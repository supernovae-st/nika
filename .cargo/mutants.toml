# cargo-mutants workspace config.
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Cross-platform mutation calibration (ADR-090 follow-up). The L1 computer-use
# crates carry OS-specific backends behind #[cfg(target_os = ...)]. On a macOS
# dev/CI host, `cargo mutants -- --lib` reports survivors in the Linux-only
# backend code — those are NOT macOS test gaps; the Linux backend is exercised
# by the ubuntu-latest CI matrix (.github/workflows/diamond-ci.yml). Excluding
# them here makes the macOS mutation run reproduce the macOS-reachable
# measurement that each crate-spec's Gate-5 exemption documents, so the
# scripts/ci/check-mutation-floor.sh BUDGET marker becomes reproducible.
#
# `examine_re` / `exclude_re` match the mutant's textual description (which
# includes the mutated function path), per cargo-mutants config semantics.
#
# NO global `--lib` here — it was tried (2026-06-12) and MEASURED to
# degrade sister crates: nika-bm25's formula arithmetic is pinned by its
# INTEGRATION suites (golden_values · okapibm25_parity), and hiding them
# from mutation re-opened 13 formula mutants. The nika-schema sandbox
# problem (the `../spec` sibling does not exist in the cargo-mutants
# copy) is solved at the SOURCE instead: `tests/common/mod.rs` detects
# `CARGO_MUTANTS=1` (set by cargo-mutants in the sandbox) and skips the
# conformance suites THERE ONLY, loudly — CI keeps the hard-fail.

exclude_re = [
  # nika-a11y · the AT-SPI (Linux) accessibility backend — role mapping + node
  # builder. cfg(target_os = "linux"), tested by the ubuntu CI matrix.
  "atspi_role_to_ax",
  "build_node_atspi",
  "build_raw_tree_atspi",
  # nika-schema · check/analysis.rs graph-fixpoint fns. Mutating these breaks
  # loop convergence → unbounded allocation → vm-compressor OOM/jetsam →
  # machine reboot (2026-06-18 floor-v2 diagnosis). They diverge-by-design;
  # correctness is pinned by the König/reach property suite
  # (tests/research_conformance.rs) + the metamorphic relations. Documented
  # diverge-mutants (detected-by-divergence), NOT coverage gaps — excluding
  # them lets `check-mutation-floor.sh` reproduce the floor-v2 measurement
  # without OOM-rebooting the host.
  "downstream_adjacency",
  "descendant_closure",
  "set_bits",
  "hopcroft_karp",
  "hk_bfs",
  "hk_dfs",
  "koenig_witness",
  "scan_parallel_writers",
]
