# CodeRabbit AI Review Configuration
# https://docs.coderabbit.ai/guides/configure-coderabbit

language: en-US

reviews:
  # Enable automatic reviews on PRs
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  profile: assertive

  # Request changes on high severity issues
  request_changes_workflow: true

  path_instructions:
    - path: "**/*.rs"
      instructions: |
        Review Rules:

        VERSION LOCK (CRITICAL):
        - If Cargo.toml is modified, VERIFY version stays 0.x.x
        - REJECT any version >= 1.0.0 (version lock policy)

        Code Quality:
        - Rust idioms and best practices
        - Error handling with NikaError (not anyhow)
        - Unsafe code requires justification
        - Performance in hot paths (TUI render loops)
        - tokio async patterns (no blocking in async)

        Architecture:
        - 5 semantic verbs ONLY: infer, exec, fetch, invoke, agent
        - MCP-only integration (no direct Neo4j)
        - Proper module boundaries

    - path: "**/Cargo.toml"
      instructions: |
        VERSION LOCK ENFORCEMENT:
        - Version MUST be 0.x.x (NEVER 1.0.0 or higher)
        - If version >= 1.0.0, REQUEST CHANGES immediately

    - path: "tools/nika/src/tui/**"
      instructions: |
        TUI Performance Rules:
        - NO allocations in render loops (use Cow<str>, cache strings)
        - NO blocking operations (spawn async)
        - Use parking_lot::Mutex (not std::sync::Mutex)
        - Proper state management
        - Keyboard shortcut consistency
        - Accessibility considerations

    - path: "tools/nika/src/mcp/**"
      instructions: |
        MCP Integration Rules:
        - Timeout handling (30s default for all operations)
        - Error code preservation (JSON-RPC codes)
        - Connection lifecycle management
        - Proper cleanup on disconnect

    - path: "tools/nika/src/runtime/**"
      instructions: |
        Runtime Rules:
        - 5 verbs only: infer, exec, fetch, invoke, agent
        - spawn_agent depth protection (max 10)
        - Proper DAG execution order
        - Event emission for observability

    - path: "**/*.yaml"
      instructions: |
        YAML Workflow Rules:
        - Schema compliance (nika/workflow@0.12)
        - 5 semantic verbs only
        - Binding syntax: with: { alias: $task_id }, template: {{with.alias}}
        - for_each with concurrency limits

    - path: "**/*.md"
      instructions: |
        Documentation Rules:
        - Version references must be 0.x.x
        - ASCII diagrams for terminal display
        - Mermaid only in .md files

  # Summary options
  high_level_summary: true
  poem: false

chat:
  # Allow PR authors to interact with CodeRabbit
  auto_reply: true

# Ignore patterns (don't review these)
path_filters:
  excluded_paths:
    - "target/**"
    - "**/*.lock"
    - "**/*.snap"
    - ".github/workflows/**"
    - "*.generated.*"
