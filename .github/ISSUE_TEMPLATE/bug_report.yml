name: Bug Report
description: Report a bug in Nika
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the sections below to help us reproduce and fix the issue.

  - type: input
    id: version
    attributes:
      label: Nika version
      description: "Run `nika --version` to get this."
      placeholder: "0.65.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Ubuntu / Debian
        - Fedora / RHEL
        - Arch Linux
        - Windows 11
        - Windows 10
        - Other Linux
        - Docker
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: LLM Provider (if relevant)
      description: "Which provider were you using when the bug occurred?"
      options:
        - anthropic (Claude)
        - openai
        - mistral
        - groq
        - deepseek
        - gemini (Google)
        - xai (Grok)
        - native (local GGUF)
        - mock
        - custom endpoint
        - N/A
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "A clear and concise description of the bug."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "Step-by-step instructions to reproduce the bug."
      value: |
        1. Create workflow with...
        2. Run `nika run ...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: "What you expected to happen."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: "What actually happened."
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Workflow file
      description: "Paste your `.nika.yaml` file (remove API keys and sensitive data)."
      render: yaml
    validations:
      required: false

  - type: textarea
    id: error
    attributes:
      label: Error output
      description: "Paste the full error output from the terminal."
      render: text
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: "Anything else that might help: screenshots, related issues, workarounds you tried."
    validations:
      required: false
