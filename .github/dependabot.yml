version: 2
updates:
  # Rust dependencies
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5
    groups:
      rust-minor:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - '*'
        patterns:
          - '*'
    ignore:
      # Ignore major version bumps (review manually)
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - '*'
