# Dependabot · weekly freshness for the two ecosystems that feed the build.
# Security-update toggles are repo settings (operator switch); this file
# drives version updates + the Scorecard Dependency-Update-Tool check.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    groups:
      rust-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    # One grouped PR per wave · never per-action: the codeql-action
    # init/analyze pair MUST move together (a split bump leaves the pair
    # at different versions inside one workflow run and CodeQL fails ·
    # proven on nika-spec 2026-07-19, first ungrouped wave).
    groups:
      github-actions:
        patterns:
          - "*"
