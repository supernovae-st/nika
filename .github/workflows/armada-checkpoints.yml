# 🏴‍☠️ ARMADA Quality Checkpoints
# 10 checkpoints that must clear before merge
# "The pirate fleet protecting the code treasure"

name: 🏴‍☠️ ARMADA Checkpoints

on:
  pull_request:
    branches: [main]

concurrency:
  group: armada-${{ github.head_ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Using stable; deps require 1.88+ (time crate)
  RUST_VERSION: stable

defaults:
  run:
    working-directory: tools/nika

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # STATION 1-2: Format & Lint (Fast, parallel)
  # ═══════════════════════════════════════════════════════════════════════════
  station-1-format:
    name: "🔧 Station 1: Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --all --check

  station-2-lint:
    name: "📎 Station 2: Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/nika -> target"
      - run: cargo clippy --workspace --all-targets --features tui,jobs -- -D warnings

  # ═══════════════════════════════════════════════════════════════════════════
  # STATION 3-4: Tests & Coverage (Medium, parallel)
  # ═══════════════════════════════════════════════════════════════════════════
  station-3-tests:
    name: "🧪 Station 3: Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/nika -> target"
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --features tui,jobs
        env:
          NEXTEST_RETRIES: 2

  station-4-coverage:
    name: "📊 Station 4: Coverage"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/nika -> target"
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --workspace --features tui,jobs --codecov --output-path codecov.json
      - name: Check coverage threshold
        run: |
          COVERAGE=$(cargo llvm-cov --workspace --features tui,jobs --json 2>/dev/null | jq -r '.data[0].totals.lines.percent // 0')
          echo "Coverage: ${COVERAGE}%"
          if [ -n "$COVERAGE" ] && [ "$(echo "$COVERAGE < 70" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
            echo "::warning::Coverage below 70%: ${COVERAGE}%"
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # STATION 5-6: Docs & Security (Medium, parallel)
  # ═══════════════════════════════════════════════════════════════════════════
  station-5-docs:
    name: "📖 Station 5: Docs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/nika -> target"
      - run: cargo doc --workspace --no-deps --features tui,jobs
        env:
          RUSTDOCFLAGS: "-D warnings"

  station-6-security:
    name: "⚓ Station 6: Security"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/nika -> target"
      - name: Install security tools
        run: |
          cargo install cargo-audit --locked || true
          cargo install cargo-deny --locked || true
      - name: Run cargo-audit
        run: cargo audit || echo "::warning::cargo-audit found issues"
      - name: Run cargo-deny
        run: cargo deny check 2>/dev/null || echo "::warning::cargo-deny found issues (deny.toml may be missing)"

  # ═══════════════════════════════════════════════════════════════════════════
  # STATION 7: Semver Check (API compatibility)
  # ═══════════════════════════════════════════════════════════════════════════
  station-7-semver:
    name: "📦 Station 7: Semver Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/nika -> target"
      - name: Check semver compatibility
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: tools/Cargo.toml
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════
  # STATION 8-9: AI Reviews (Slow, parallel)
  # ═══════════════════════════════════════════════════════════════════════════
  station-8-coderabbit:
    name: "🤖 Station 8: CodeRabbit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          echo "CodeRabbit AI review"
          echo "If CodeRabbit GitHub App is installed, it reviews automatically."
          echo "Otherwise, this station passes without AI review."

  station-9-claude:
    name: "🧠 Station 9: Claude AI"
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Claude AI Review (placeholder)
        run: |
          echo "Claude AI Review"
          echo "This station is a placeholder for future Claude API integration."
          echo "For now, manual review suffices."

  # ═══════════════════════════════════════════════════════════════════════════
  # STATION 10-11: Process Checkpoints (Fast, parallel)
  # ═══════════════════════════════════════════════════════════════════════════
  station-10-commits:
    name: "📝 Station 10: Ship's Log"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check commit messages (conventional)
        run: |
          echo "Checking ship's log entries (conventional commits)..."
          PATTERN="^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: .+"
          FAILED=0
          for commit in $(git log --format="%H" origin/main..HEAD 2>/dev/null || git log --format="%H" -10); do
            MSG=$(git log --format="%s" -1 "$commit")
            if [[ -n "$MSG" ]] && ! [[ "$MSG" =~ $PATTERN ]]; then
              echo "Invalid: $MSG"
              FAILED=1
            else
              echo "Valid: $MSG"
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "::warning::Some log entries don't follow conventional commits format"
          fi

  station-11-version:
    name: "🏴‍☠️ Station 11: Captain's Orders"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enforce 0.x.x version (Captain's Orders)
        run: |
          # Read from workspace Cargo.toml (working-directory is tools/nika)
          CARGO_FILE="../../tools/Cargo.toml"
          if [[ ! -f "$CARGO_FILE" ]]; then
            CARGO_FILE="Cargo.toml"
          fi

          VERSION=$(grep '^version = ' "$CARGO_FILE" | head -1 | sed 's/version = "\(.*\)"/\1/')
          MAJOR=$(echo "$VERSION" | cut -d. -f1)

          if [ "$MAJOR" != "0" ]; then
            echo "CAPTAIN'S ORDERS VIOLATION!"
            echo "The Captain has decreed: Nika shall NEVER be version 1.0.0 or higher."
            echo "Found: $VERSION | Expected: 0.x.x (forever)"
            exit 1
          fi

          echo "Version $VERSION cleared by Captain's Orders (0.x.x forever)"

  # ═══════════════════════════════════════════════════════════════════════════
  # FINAL: Fleet Cleared for Launch
  # ═══════════════════════════════════════════════════════════════════════════
  fleet-cleared:
    name: "🚀 Fleet Cleared for Launch"
    runs-on: ubuntu-latest
    needs:
      - station-1-format
      - station-2-lint
      - station-3-tests
      - station-4-coverage
      - station-5-docs
      - station-6-security
      - station-7-semver
      - station-8-coderabbit
      - station-9-claude
      - station-10-commits
      - station-11-version
    steps:
      - uses: actions/checkout@v6
      - run: |
          echo ""
          echo "ARMADA FLEET CLEARED FOR LAUNCH"
          echo ""
          echo "Station 1:  Format        - CLEARED"
          echo "Station 2:  Lint          - CLEARED"
          echo "Station 3:  Tests         - CLEARED"
          echo "Station 4:  Coverage      - CLEARED"
          echo "Station 5:  Docs          - CLEARED"
          echo "Station 6:  Security      - CLEARED"
          echo "Station 7:  Semver Check  - CLEARED"
          echo "Station 8:  CodeRabbit    - CLEARED"
          echo "Station 9:  Claude AI     - CLEARED"
          echo "Station 10: Ship's Log    - CLEARED"
          echo "Station 11: Captain       - CLEARED"
          echo ""
          echo "All hands on deck! This PR is ready for merge!"
