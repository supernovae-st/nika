name: Changelog — auto-prepend on tag

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate latest changelog section
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: /tmp/new-section.md

      - name: Preview
        run: cat /tmp/new-section.md || echo "no content"

      - name: Open PR with prepended section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ ! -s /tmp/new-section.md ]; then
            echo "No changelog content — skipping"
            exit 0
          fi
          BR="chore/changelog-${TAG}"
          git config user.name "nika-bot 🦋"
          git config user.email "nika@supernovae.studio"
          git checkout -b "${BR}"
          awk -v new="$(cat /tmp/new-section.md)" '
            /^## \[/ && !done { print new; done=1 }
            { print }
          ' CHANGELOG.md > /tmp/updated.md
          mv /tmp/updated.md CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "docs(changelog): append ${TAG} — auto-generated"
          git push -u origin "${BR}"
          gh pr create \
            --title "docs(changelog): append ${TAG}" \
            --body "Auto-generated by git-cliff on tag push. Review, edit if needed, merge." \
            --head "${BR}"
