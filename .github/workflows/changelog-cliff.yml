name: Changelog — auto-prepend on tag

on:
  push:
    tags: ['v0.8*', 'v0.9*', 'v0.10*', 'v0.11*']
  workflow_dispatch:

permissions:
  contents: read # least privilege at the top — the job elevates (Scorecard Token-Permissions)

jobs:
  changelog:
    # Only diamond-era tags (v0.80+) — excludes legacy v0.79.x
    if: startsWith(github.ref, 'refs/tags/v0.8') || startsWith(github.ref, 'refs/tags/v0.9') || startsWith(github.ref, 'refs/tags/v0.10') || startsWith(github.ref, 'refs/tags/v0.11')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the changelog commit
      pull-requests: write # open the changelog PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Generate latest changelog section
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: /tmp/new-section.md

      - name: Preview
        run: cat /tmp/new-section.md || echo "no content"

      - name: Open PR with prepended section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ ! -s /tmp/new-section.md ]; then
            echo "No changelog content — skipping"
            exit 0
          fi
          # Idempotence guard: the release PR often lands a curated
          # "## [X.Y.Z]" section before this workflow runs — prepending
          # again doubles the header (the 0.95/0.96 duplicate class,
          # cleaned in #251). Fixed-string match on the header prefix.
          VER="${TAG#v}"
          BR="chore/changelog-${TAG}"
          if grep -qF "## [${VER}]" CHANGELOG.md; then
            echo "CHANGELOG already carries a [${VER}] section — skipping (idempotence guard)"
            # Self-heal: a derailed train can tag EARLY (before the curated
            # fold reaches main), open this PR, then re-tag with the fold —
            # leaving a stale duplicate PR nobody asked for (the #538 class).
            # When the guard fires, close any leftover.
            if gh pr view "${BR}" --json state --jq .state 2>/dev/null | grep -q OPEN; then
              gh pr close "${BR}" --comment "Superseded: main already carries the curated [${VER}] section (the idempotence guard fired on a later run). Auto-closed by the workflow."
              echo "closed the stale ${BR} PR"
            fi
            exit 0
          fi
          git config user.name "nika-bot 🦋"
          git config user.email "nika@supernovae.studio"
          # Force-recreate branch (idempotent on re-run)
          git checkout -B "${BR}"
          python3 - <<'PY'
          import pathlib
          new = pathlib.Path("/tmp/new-section.md").read_text()
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text()
          # Find first "## [" header and prepend new section
          import re
          m = re.search(r'^## \[', text, re.MULTILINE)
          if m:
              out = text[:m.start()] + new + "\n\n" + text[m.start():]
              path.write_text(out)
          PY
          git add CHANGELOG.md
          git commit -m "docs(changelog): append ${TAG} — auto-generated"
          git push -u origin "${BR}" --force-with-lease
          # Create PR or update if exists
          if gh pr view "${BR}" &>/dev/null; then
            gh pr edit "${BR}" --body "Auto-generated by git-cliff on tag push. Review, edit if needed, merge."
          else
            gh pr create \
              --title "docs(changelog): append ${TAG}" \
              --body "Auto-generated by git-cliff on tag push. Review, edit if needed, merge." \
              --head "${BR}" \
              --base main
          fi
