name: Changelog — auto-prepend on tag

on:
  push:
    tags: ['v0.8*', 'v0.9*', 'v0.10*', 'v0.11*']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    # Only diamond-era tags (v0.80+) — excludes legacy v0.79.x
    if: startsWith(github.ref, 'refs/tags/v0.8') || startsWith(github.ref, 'refs/tags/v0.9') || startsWith(github.ref, 'refs/tags/v0.10') || startsWith(github.ref, 'refs/tags/v0.11')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Generate latest changelog section
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: /tmp/new-section.md

      - name: Preview
        run: cat /tmp/new-section.md || echo "no content"

      - name: Open PR with prepended section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ ! -s /tmp/new-section.md ]; then
            echo "No changelog content — skipping"
            exit 0
          fi
          BR="chore/changelog-${TAG}"
          git config user.name "nika-bot 🦋"
          git config user.email "nika@supernovae.studio"
          # Force-recreate branch (idempotent on re-run)
          git checkout -B "${BR}"
          python3 - <<'PY'
          import pathlib
          new = pathlib.Path("/tmp/new-section.md").read_text()
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text()
          # Find first "## [" header and prepend new section
          import re
          m = re.search(r'^## \[', text, re.MULTILINE)
          if m:
              out = text[:m.start()] + new + "\n\n" + text[m.start():]
              path.write_text(out)
          PY
          git add CHANGELOG.md
          git commit -m "docs(changelog): append ${TAG} — auto-generated"
          git push -u origin "${BR}" --force-with-lease
          # Create PR or update if exists
          gh pr view "${BR}" &>/dev/null \
            && gh pr edit "${BR}" --body "Auto-generated by git-cliff on tag push. Review, edit if needed, merge." \
            || gh pr create \
              --title "docs(changelog): append ${TAG}" \
              --body "Auto-generated by git-cliff on tag push. Review, edit if needed, merge." \
              --head "${BR}" \
              --base main
