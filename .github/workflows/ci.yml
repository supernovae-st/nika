# Nika Rust CI Pipeline
# Runs on: push to main, pull requests
#
# Jobs:
# 1. check: Format + Clippy (multi-platform)
# 2. test: Unit + integration tests (matrix: stable, ubuntu/macos)
# 3. coverage: Code coverage with codecov
# 4. security: cargo-deny + cargo-audit
# 5. build: Release build verification
# 6. summary: PR comment with results
#
# Nika v0.16.1 — Schema @0.9 + Registry + Security | 3,358 tests

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_full_matrix:
        description: 'Run full test matrix (stable + beta)'
        required: false
        default: 'false'
        type: boolean

# Cancel outdated runs for same PR/branch
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  NIKA_VERSION: v0.35.4
  # Minimum Rust version (matches Cargo.toml rust-version)
  # Note: Using stable to get latest; deps require 1.88+ (time crate)
  RUST_VERSION: stable
  # Minimum coverage threshold (%)
  COVERAGE_THRESHOLD: 70

defaults:
  run:
    working-directory: tools/nika

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Quick Check (runs first, fast feedback)
  # ─────────────────────────────────────────────────────────────────────────────
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain (${{ env.RUST_VERSION }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/nika -> target"
          cache-on-failure: true
          shared-key: check-${{ matrix.os }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy (all features)
        run: cargo clippy --workspace --all-targets --features tui,jobs -- -D warnings

      - name: Run clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Check documentation
        run: cargo doc --workspace --no-deps --features tui,jobs
        env:
          RUSTDOCFLAGS: -Dwarnings

  # ─────────────────────────────────────────────────────────────────────────────
  # Test Suite (matrix: rust version x os)
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.rust }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        rust: [stable]
        os: [ubuntu-latest, macos-latest]
        include:
          # Add beta only for full matrix runs
          - rust: beta
            os: ubuntu-latest
            optional: true
    continue-on-error: ${{ matrix.optional || false }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/nika -> target"
          cache-on-failure: true
          shared-key: test-${{ matrix.rust }}-${{ matrix.os }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run unit tests with nextest
        id: nextest
        run: |
          cargo nextest run --workspace --features tui,jobs 2>&1 | tee test-results.txt
          # Extract summary for PR comment
          PASSED=$(grep -E "^\s*\d+ tests passed" test-results.txt | grep -oE '\d+' | head -1 || echo "0")
          FAILED=$(grep -E "^\s*\d+ tests failed" test-results.txt | grep -oE '\d+' | head -1 || echo "0")
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Run doc tests
        run: cargo test --workspace --doc --features tui,jobs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.rust }}-${{ matrix.os }}
          path: test-results.txt
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Code Coverage (ubuntu + stable only)
  # ─────────────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/nika -> target"
          cache-on-failure: true
          shared-key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov --workspace --features tui,jobs --lcov --output-path lcov.info
          cargo llvm-cov report --workspace --features tui,jobs --summary-only | tee coverage-summary.txt

      - name: Extract coverage percentage
        id: coverage
        run: |
          # Extract line coverage percentage from summary
          COVERAGE=$(grep -E "^Total" coverage-summary.txt | awk '{print $NF}' | tr -d '%' || echo "0")
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "Coverage: $COVERAGE%"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: nika
          name: nika-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage-summary.txt
          retention-days: 30

      - name: Check coverage threshold
        env:
          COVERAGE: ${{ steps.coverage.outputs.percentage }}
          THRESHOLD: ${{ env.COVERAGE_THRESHOLD }}
        run: |
          if [ -n "$COVERAGE" ] && [ "$COVERAGE" != "0" ]; then
            COVERAGE_INT=${COVERAGE%.*}
            if [ "$COVERAGE_INT" -lt "$THRESHOLD" ]; then
              echo "::warning::Coverage ($COVERAGE%) is below threshold ($THRESHOLD%)"
            else
              echo "Coverage ($COVERAGE%) meets threshold ($THRESHOLD%)"
            fi
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Schema & Workflow Validation (v0.14.2 features)
  # ─────────────────────────────────────────────────────────────────────────────
  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/nika -> target"
          cache-on-failure: true
          shared-key: schema-validation

      - name: Build nika binary
        run: cargo build --release

      - name: Validate schema version tests (v0.1-v0.9)
        run: |
          echo "=== Validating schema version tests ==="
          for version in v0.1 v0.2 v0.3 v0.4 v0.5 v0.6 v0.7 v0.8 v0.9; do
            echo "Testing: tests/schema-version-tests/${version}-test.nika.yaml"
            ./target/release/nika check "tests/schema-version-tests/${version}-test.nika.yaml" || exit 1
          done
          echo "All schema version tests passed!"

      - name: Validate feature examples
        run: |
          echo "=== Validating feature examples ==="
          # context: field example (v0.9)
          ./target/release/nika check examples/v09-context-loading.nika.yaml || exit 1
          echo "context: loading OK"

          # include: DAG fusion example (v0.9)
          ./target/release/nika check examples/v09-include-dag-fusion.nika.yaml || exit 1
          echo "include: DAG fusion OK"

          # multi-provider example (v0.6)
          ./target/release/nika check examples/v06-multi-provider.nika.yaml || exit 1
          echo "multi-provider OK"

          # v0.15 features
          ./target/release/nika check examples/v15-infer-options.nika.yaml || exit 1
          echo "infer options OK"

          ./target/release/nika check examples/v15-secure-exec.nika.yaml || exit 1
          echo "secure exec OK"

          echo "All feature examples passed!"

      - name: Validate public examples
        run: |
          echo "=== Validating public examples ==="
          PASSED=0
          FAILED=0
          for file in examples/public/*.nika.yaml; do
            if ./target/release/nika check "$file" > /dev/null 2>&1; then
              PASSED=$((PASSED + 1))
            else
              echo "WARN: $file failed validation (may require MCP)"
              FAILED=$((FAILED + 1))
            fi
          done
          echo "Public examples: $PASSED passed, $FAILED skipped"

      - name: Summary
        run: |
          echo "=== Schema Validation Summary ==="
          echo "- Schema versions: v0.1-v0.9 all validated"
          echo "- Feature examples: context:, include:, multi-provider, infer options, secure exec"
          echo "- Public examples validated"

  # ─────────────────────────────────────────────────────────────────────────────
  # Security Audit
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/nika -> target"
          cache-on-failure: true
          shared-key: security

      - name: Install security tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: Check for deny.toml
        id: deny_config
        run: |
          if [ -f "deny.toml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run cargo-deny (licenses + bans + sources)
        if: steps.deny_config.outputs.exists == 'true'
        id: deny
        run: |
          cargo deny check 2>&1 | tee deny-output.txt || true

      - name: Run cargo-audit (vulnerabilities)
        id: audit
        run: |
          # Clear advisory-db to avoid conflict with rust-cache
          rm -rf ~/.cargo/advisory-db || true
          # Run cargo audit with proper error handling
          cargo audit --json 2>&1 | tee audit-output.json || true
          cargo audit 2>&1 | tee audit-output.txt || true
          # Count vulnerabilities safely
          # Note: grep -c outputs "0" AND exits with code 1 when no matches
          # Using assignment with || true to capture the count without triggering || echo
          VULNS=0
          if [ -f audit-output.txt ]; then
            VULNS=$(grep -c "Vulnerability" audit-output.txt 2>/dev/null) || VULNS=0
          fi
          echo "vulnerabilities=${VULNS}" >> "$GITHUB_OUTPUT"

      - name: Check for secrets in code (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            deny-output.txt
            audit-output.txt
            audit-output.json
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Verification
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [test, security]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: nika-linux-x64
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            artifact: nika-macos-arm64
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/nika -> target"
          cache-on-failure: true
          shared-key: build-${{ matrix.os }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binary
        run: |
          BINARY="target/${{ matrix.target }}/release/nika"
          if [ -f "$BINARY" ]; then
            echo "Binary size: $(du -h "$BINARY" | cut -f1)"
            file "$BINARY"
          else
            echo "::error::Binary not found at $BINARY"
            exit 1
          fi

      - name: Upload binary artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/nika
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # PR Summary Comment
  # ─────────────────────────────────────────────────────────────────────────────
  summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [check, test, coverage, security, build]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Generate summary comment
        uses: actions/github-script@v8
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          NIKA_VER: ${{ env.NIKA_VERSION }}
          RUST_VER: ${{ env.RUST_VERSION }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const checkResult = process.env.CHECK_RESULT;
            const testResult = process.env.TEST_RESULT;
            const coverageResult = process.env.COVERAGE_RESULT;
            const securityResult = process.env.SECURITY_RESULT;
            const buildResult = process.env.BUILD_RESULT;
            const nikaVersion = process.env.NIKA_VER;
            const rustVersion = process.env.RUST_VER;
            const serverUrl = process.env.SERVER_URL;
            const repo = process.env.REPO;
            const runId = process.env.RUN_ID;

            const statusEmoji = (result) => {
              switch(result) {
                case 'success': return ':white_check_mark:';
                case 'failure': return ':x:';
                case 'cancelled': return ':stop_sign:';
                case 'skipped': return ':fast_forward:';
                default: return ':question:';
              }
            };

            const body = `## Nika CI Results

            | Job | Status |
            |-----|--------|
            | Check (fmt + clippy) | ${statusEmoji(checkResult)} ${checkResult} |
            | Test (all features) | ${statusEmoji(testResult)} ${testResult} |
            | Coverage | ${statusEmoji(coverageResult)} ${coverageResult} |
            | Security (audit) | ${statusEmoji(securityResult)} ${securityResult} |
            | Build (release) | ${statusEmoji(buildResult)} ${buildResult} |

            ### Nika Info
            - **Version**: ${nikaVersion}
            - **Rust Version**: ${rustVersion}
            - **Crates**: nika-core, nika-mcp, nika-provider, nika-runtime, nika-tui, nika-cli

            <details>
            <summary>View detailed results</summary>

            - [Workflow run](${serverUrl}/${repo}/actions/runs/${runId})
            - Coverage report available in artifacts
            - Security reports available in artifacts

            </details>

            ---
            *Generated by Nika CI workflow*`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existingComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Nika CI Results')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
