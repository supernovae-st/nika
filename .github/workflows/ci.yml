name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel outdated runs for same PR/branch
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# NOTE: No defaults.run.working-directory — each step sets working-directory explicitly

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Check: fmt + clippy + doc + version gate
  # ─────────────────────────────────────────────────────────────────────────────
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'tools -> target'
          cache-on-failure: true
          shared-key: check-${{ matrix.os }}

      - name: Check formatting
        working-directory: tools/nika
        run: cargo fmt --all --check

      - name: Run clippy (workspace, all targets)
        working-directory: tools/nika
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check documentation
        working-directory: tools/nika
        run: cargo doc --workspace --no-deps --exclude nika-py
        env:
          RUSTDOCFLAGS: -Dwarnings

      - name: Version lock (must stay 0.x.x forever)
        run: |
          VERSION=$(grep '^version = ' tools/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          echo "Nika version: $VERSION (major=$MAJOR)"
          [ "$MAJOR" = "0" ] || { echo "::error::Version $VERSION violates 0.x.x lock!"; exit 1; }

  # ─────────────────────────────────────────────────────────────────────────────
  # Test: nextest --lib (NEVER bare cargo test = macOS keychain popup)
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'tools -> target'
          cache-on-failure: true
          shared-key: test-${{ matrix.os }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run unit tests (--lib, all workspace crates)
        working-directory: tools/nika
        run: |
          set -o pipefail
          cargo nextest run --workspace --lib 2>&1 | tee /tmp/test-results.txt

      - name: Run doc tests
        working-directory: tools/nika
        run: cargo test --workspace --doc

      - name: Output test summary
        if: always()
        run: |
          PASSED=$(grep -oE '[0-9]+ passed' /tmp/test-results.txt | grep -oE '[0-9]+' | head -1 || echo '0')
          echo "### Tests (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests passed: **$PASSED**" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────────
  # Feature compatibility: no-default-features + all-features
  # ─────────────────────────────────────────────────────────────────────────────
  test-features:
    name: Feature Compatibility
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'tools -> target'
          cache-on-failure: true
          shared-key: features

      - name: Check no-default-features (core compiles without TUI/media/LSP)
        working-directory: tools/nika
        run: cargo check --workspace --no-default-features

      - name: Check all-features (excluding postgres — requires PG service)
        working-directory: tools/nika
        run: |
          cargo check --workspace --all-features --exclude nika-storage
          cargo check -p nika-storage --no-default-features
          cargo check -p nika-storage

  # ─────────────────────────────────────────────────────────────────────────────
  # Coverage: llvm-cov nextest --lib → Codecov
  # ─────────────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'tools -> target'
          cache-on-failure: true
          shared-key: coverage

      - name: Install cargo-llvm-cov + nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Generate coverage (nextest --lib)
        working-directory: tools/nika
        run: |
          cargo llvm-cov nextest --workspace --lib --lcov --output-path lcov.info
          cargo llvm-cov report --workspace --lib --summary-only | tee /tmp/coverage-summary.txt

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tools/nika/lcov.info
          flags: nika
          name: nika-coverage
          fail_ci_if_error: false

      - name: Check coverage threshold
        run: |
          COVERAGE=$(grep 'TOTAL' /tmp/coverage-summary.txt | awk '{print $NF}' | tr -d '%' || echo '0')
          echo "Coverage: $COVERAGE%"
          THRESHOLD=70
          if [ -n "$COVERAGE" ] && [ "$COVERAGE" != "0" ]; then
            COVERAGE_INT=${COVERAGE%.*}
            if [ "$COVERAGE_INT" -lt "$THRESHOLD" ]; then
              echo "::warning::Coverage ($COVERAGE%) is below threshold ($THRESHOLD%)"
            else
              echo "Coverage ($COVERAGE%) meets threshold ($THRESHOLD%)"
            fi
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Security: audit + deny + machete
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'tools -> target'
          cache-on-failure: true
          shared-key: security

      - name: Install security tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-machete

      - name: cargo audit (vulnerabilities)
        working-directory: tools
        run: |
          rm -rf ~/.cargo/advisory-db || true
          cargo audit --ignore RUSTSEC-2023-0071

      - name: cargo deny (licenses + bans + sources)
        working-directory: tools/nika
        run: cargo deny check

      - name: cargo machete (unused deps)
        working-directory: tools
        run: cargo machete

  # ─────────────────────────────────────────────────────────────────────────────
  # Semver: breaking change detection
  # ─────────────────────────────────────────────────────────────────────────────
  semver:
    name: Semver Check
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: cargo semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: tools/Cargo.toml
          package: nika
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Validate: build nika binary, run nika check on all examples
  # ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate Workflows
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'tools -> target'
          cache-on-failure: true
          shared-key: validate

      - name: Build nika binary
        working-directory: tools
        run: cargo build --release -p nika

      - name: Validate examples
        working-directory: tools
        run: |
          FAILED=0
          # 1. Gate tests (tools/nika/examples/) — internal test workflows
          while IFS= read -r -d '' f; do
            ./target/release/nika check "$f" || FAILED=1
          done < <(find nika/examples -name "*.nika.yaml" -print0)
          # 2. User examples (repo root examples/)
          while IFS= read -r -d '' f; do
            ./target/release/nika check "$f" || FAILED=1
          done < <(find ../examples -name "*.nika.yaml" -print0)
          # 3. Test workflows (best-effort, some need API keys)
          while IFS= read -r -d '' f; do
            ./target/release/nika check "$f" 2>/dev/null || true
          done < <(find ../tests -name "*.nika.yaml" -print0)
          [ "$FAILED" -eq 0 ] || exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Summary: PR comment with all job results
  # ─────────────────────────────────────────────────────────────────────────────
  summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [check, test, test-features, coverage, security, semver, validate]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: tools/Cargo.toml
          sparse-checkout-cone-mode: false

      - name: Extract version
        id: version
        run: |
          VER=$(grep '^version = ' tools/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "value=v${VER}" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        uses: actions/github-script@v8
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_FEATURES_RESULT: ${{ needs.test-features.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SEMVER_RESULT: ${{ needs.semver.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          NIKA_VER: ${{ steps.version.outputs.value }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const e = (r) => ({ success: ':white_check_mark:', failure: ':x:', cancelled: ':stop_sign:', skipped: ':fast_forward:' }[r] || ':question:');
            const ver = process.env.NIKA_VER;
            const body = `## 🦋 Nika CI — ${ver}\n\n| Job | Status |\n|-----|--------|\n| check (fmt + clippy + doc) | ${e(process.env.CHECK_RESULT)} ${process.env.CHECK_RESULT} |\n| test (nextest --lib) | ${e(process.env.TEST_RESULT)} ${process.env.TEST_RESULT} |\n| test-features | ${e(process.env.TEST_FEATURES_RESULT)} ${process.env.TEST_FEATURES_RESULT} |\n| coverage | ${e(process.env.COVERAGE_RESULT)} ${process.env.COVERAGE_RESULT} |\n| security | ${e(process.env.SECURITY_RESULT)} ${process.env.SECURITY_RESULT} |\n| semver | ${e(process.env.SEMVER_RESULT)} ${process.env.SEMVER_RESULT} |\n| validate | ${e(process.env.VALIDATE_RESULT)} ${process.env.VALIDATE_RESULT} |\n\n[View run](${process.env.SERVER_URL}/${process.env.REPO}/actions/runs/${process.env.RUN_ID})\n\n---\n*🦋 Nika CI*`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('🦋 Nika CI'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body
              });
            }
