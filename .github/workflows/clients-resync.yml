name: clients-resync

# The vendored client matrix follows the agents registry without blocking
# unrelated pushes. crates/nika-cli-host/data/clients.registry.yaml is a
# byte-copy of nika-plugins/clients.yaml. The engine's `.agents/` release kit
# is NOT part of this reverse lane: nika-plugins mirrors it from immutable
# engine release tags through its own resync-mirror.py/release-heal contract.
# Drift used to be judged by a unit test
# reading the LIVE sibling checkout on the developer's machine — the
# wrong-judge class (one test binary, two verdicts, whichever repos
# happen to sit beside the checkout; it blocked two unrelated engine
# pushes 2026-07-31). The assertion is gone from cargo test; the drift
# surfaces here instead. Daily: clone nika-plugins@main, re-vendor the client
# matrix, open
# ONE idempotent PR on drift — never a direct push. The job RUNS
# `nika-cli-host`'s own tests before it opens anything (see the guard
# below): a bot PR carries no Rust job, so delegating that judgement to
# CI would delegate it to nobody — the wrong-judge class this lane was
# created to escape, landed on again one layer out.
# SECURITY: no github.event data reaches the shell.

on:
  schedule:
    - cron: '19 6 * * *'
  workflow_dispatch:

permissions:
  contents: read # least privilege at the top — the job elevates (Scorecard Token-Permissions)

jobs:
  heal:
    runs-on: ubuntu-latest
    outputs:
      mutated: ${{ steps.heal.outputs.mutated }}
    permissions:
      contents: write # push the heal branch
      pull-requests: write # open the heal PR
    # Raised from 10: this job now RUNS its own tests before it opens
    # anything, instead of delegating to a CI run that never comes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: diamond
      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-nextest
      - name: The vendored client matrix follows the agents registry
        id: heal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/supernovae-st/nika-plugins ../agents
          cp ../agents/clients.yaml crates/nika-cli-host/data/clients.registry.yaml
          git add crates/nika-cli-host/data/clients.registry.yaml
          if git diff --cached --quiet; then
            echo "matrix current — nothing to resync"
            echo "mutated=false" >> "$GITHUB_OUTPUT"
            echo "MUTATED: none because matrix current" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/estate.py --write   # the manifest rides the heal (staged files first — estate.py reads the INDEX)
          git add estate.yaml

          # THE JOB JUDGES ITSELF — the header above promised "Diamond CI (the
          # vendored-bytes tests included) judges". That judgement cannot
          # happen: GitHub does not start workflow runs from events raised with
          # the repository's GITHUB_TOKEN (anti-recursion), so a bot PR carries
          # no Rust job. Note the irony this lane already documents: the drift
          # check was MOVED here from a unit test to escape the wrong-judge
          # class, and landed on a judge that never shows up.
          # Scope: the whole `nika-cli-host` crate (it owns the vendored file
          # written just above), not a list of test names — a list goes stale
          # the day a fourth test lands.
          echo "::group::the vendored matrix at the candidate snapshot"
          if ! cargo nextest run -p nika-cli-host --no-fail-fast; then
            echo "::endgroup::"
            echo "::error::the vendored matrix does not pass its own tests — NOT vendored, no PR opened"
            echo "mutated=false" >> "$GITHUB_OUTPUT"
            echo "MUTATED: none because vendored tests failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1   # loud, not silent: a red cron run is the signal a human sees
          fi
          echo "::endgroup::"
          git config user.name "nika-release[bot]"
          git config user.email "nika@supernovae.studio"
          git checkout -B bot/clients-resync
          git commit -m "chore(matrix): the vendored snapshot follows the agents SSOT — $(git -C ../agents rev-parse --short HEAD) (clients-resync)"
          git push -f origin bot/clients-resync
          gh pr create --head bot/clients-resync \
            --title "chore(matrix): the vendored snapshot follows the agents SSOT" \
            --body "Automated re-vendoring (clients-resync lane · the dedicated-heal precedent). The drift used to block unrelated pushes via a unit test reading the live sibling checkout — it now surfaces HERE, within 24h, judged by Diamond CI. This lane owns only the client registry. The engine release kit under .agents/ is mirrored in the opposite direction by nika-plugins from immutable engine tags. Manual heal when it cannot wait: cp <agents>/repo/clients.yaml crates/nika-cli-host/data/clients.registry.yaml && python3 scripts/estate.py --write. Merge on green." \
            2>/dev/null || echo "PR already open — refreshed"
          echo "mutated=true" >> "$GITHUB_OUTPUT"
          echo "MUTATED: yes · force-pushed bot/clients-resync and opened/refreshed the PR" >> "$GITHUB_STEP_SUMMARY"
