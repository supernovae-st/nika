name: Diamond CI

# All template expressions below reference `matrix.*` values defined from
# the static literal lists in this same file — there is no untrusted input
# in any `run:` step (no issue/PR/commit-message interpolation).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # THE GROUP IS PER-SHA ON MAIN, PER-REF EVERYWHERE ELSE.
  #
  # On a branch the next run REPLACES the previous one — cancelling saves
  # minutes and loses nothing. On main every commit is its own subject and
  # must be judged before it is replaced.
  #
  # `cancel-in-progress: false` was the first attempt at that (2026-08-13)
  # and it is NOT enough: it protects a run that is RUNNING, never one that
  # is QUEUED. GitHub keeps exactly one *pending* run per group and cancels
  # the earlier one when a newer arrives — the flag does not apply, because
  # that run was never in progress. Merges landing close together therefore
  # still dropped main commits, which is the very thing the old comment here
  # claimed to have fixed.
  #
  # Measured 2026-08-18 — mechanism, not correlation: FOUR of seven main runs
  # cancelled in one evening, and the cancelled run 32166885428 (sha
  # 6946fd36) carries `n_jobs: 0` — it never started a single job. The
  # trigger is merge RHYTHM, not content: a session landing eight PRs
  # manufactures its own cancellations. The failure is silent in the worst
  # direction — no red and no green; an absent verdict reads like nothing to
  # report.
  #
  # A per-sha group on main gives every commit its own queue, so there is
  # nothing to evict. It costs parallel runs when merges are rapid; that is
  # the price of judging each commit, and this repo already said that is the
  # price it wants to pay.
  #
  # An expression is supported here (GitHub's actions-group-concurrency docs
  # ship the `release/` example); a path filter is NOT — `concurrency` is
  # evaluated at workflow level, before any job, with no changed-file
  # context. No injection surface: `github.ref` and `github.sha` are
  # repo-controlled, compared and concatenated into a GROUP NAME, never
  # interpolated into a `run:` shell.
  group: diamond-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Kept, and redundant on main by construction now (a per-sha group has no
  # sibling to cancel). It stays because it is the load-bearing half on every
  # OTHER ref, where the group IS shared across pushes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  ratchets:
    name: ratchet
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - loc-limits
          - crate-size
          - fn-length
          - unwrap
          - expect
          - dead-code
          # A security gate that ran pre-push ONLY: a contributor without
          # the hook installed, and every PR from a fork, met no check at
          # all on the credential-header list (2026-08-02).
          - credential-headers
          # One workspace, one version: every member + path-dep pin + both
          # locks spell the root version (the 0.109.0-dev opening · 2026-08-18).
          - version-uniform
    env:
      CHECK: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ratchet
        run: ./scripts/ci/check-"$CHECK".sh

  rust:
    name: rust
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [clippy, tests, no-default-features, wasm]
    env:
      JOB: ${{ matrix.job }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No system libs installed here ON PURPOSE: the default workspace build is
      # pure-Rust. The only crate that links C system deps is `nika-screen`
      # (xcap → Wayland/X11/PipeWire/DRM/EGL), and that backend now lives behind
      # the default-OFF `xcap` feature — so this job's `cargo build --workspace`
      # IS the headless-build proof (a missing system lib here = a regression).
      # The `--features xcap` path is exercised by the cargo-hack job, which
      # installs the desktop libs.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: "1.91"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          shared-key: diamond
      - name: Install cargo-nextest (tests leg)
        if: matrix.job == 'tests'
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-nextest
      - name: Install bubblewrap (tests leg · forces the landlock jail proof to RUN not skip)
        if: matrix.job == 'tests'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          # ubuntu-24.04's AppArmor bwrap profile grants userns creation but
          # denies CAP_NET_ADMIN inside it, so bwrap dies bringing up loopback
          # in the unshared netns ("loopback: Failed RTM_NEWADDR: Operation
          # not permitted") and the jail proof never runs the child. Detach
          # the profile and keep unprivileged userns open so bwrap behaves as
          # on a developer machine.
          sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict 2>/dev/null || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The conformance suites (nika-schema tests/) read the PUBLIC spec
      # repo's fixtures — locally a sibling ../spec checkout, here an
      # explicit NIKA_SPEC_DIR. Tests-leg only: the full battery (the
      # 2026-07-06 flip) is the first CI consumer these suites ever had.
      # The conformance pin lives in SPEC_PIN at the repo root — ONE
      # mechanism across the estate (file + heal bot, the vscode/registry
      # pattern). PINNED, not floating: a floating default branch reddens
      # every engine branch the moment a spec change merges ahead of its
      # engine cascade — the cross-repo drift class. spec-pin-heal.yml
      # advances the pin by PR; this CI judges at the pin.
      - name: Checkout nika-spec (conformance fixtures · tests + wasm legs)
        if: matrix.job == 'tests' || matrix.job == 'wasm'
        run: |
          set -euo pipefail
          pin="$(grep -v '^#' SPEC_PIN | head -1 | tr -d '[:space:]')"
          git clone --filter=blob:none https://github.com/supernovae-st/nika-spec "$GITHUB_WORKSPACE/nika-spec"
          git -C "$GITHUB_WORKSPACE/nika-spec" checkout --detach "$pin"
      # The vendored pack IS spec@SPEC_PIN, byte for byte — one spec identity
      # per binary. Re-vendor from the pinned checkout and refuse any
      # difference (fail closed: a pack that followed some other commit is
      # a second identity, whichever direction it drifted). Judged in the
      # tests leg only: one leg is one verdict, and the wasm leg checks the
      # same tree.
      - name: The pack is spec@SPEC_PIN
        if: matrix.job == 'tests'
        run: |
          set -euo pipefail
          bash scripts/sync-pack.sh "$GITHUB_WORKSPACE/nika-spec"
          if ! git diff --quiet --exit-code -- crates/nika-pack/pack; then
            git --no-pager diff --stat -- crates/nika-pack/pack
            echo "::error::crates/nika-pack/pack differs from nika-spec@SPEC_PIN — re-vendor with scripts/sync-pack.sh <spec at SPEC_PIN> (spec-pin-heal moves both together)"
            exit 1
          fi
          echo "pack == spec@$(git -C "$GITHUB_WORKSPACE/nika-spec" rev-parse --short HEAD) · $(git ls-files crates/nika-pack/pack | wc -l | tr -d ' ') files"
      - name: Run rust job
        env:
          NIKA_SPEC_DIR: ${{ github.workspace }}/nika-spec
        run: ./scripts/ci/check-"$JOB".sh

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The floating EmbarkStudios/cargo-deny-action@v2 broke 2026-07-13:
      # its musl container trips over our rust-toolchain.toml pin
      # (`override toolchain '1.91-…-musl' is not installed`) and its
      # arg plumbing regressed (`unrecognized subcommand 'warn'`).
      # Install the binary and run it directly — the SAME invocation the
      # local pre-push hook has proven for months (one lane, no wrapper).
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # cargo-deny
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check

  hack:
    name: cargo-hack (feature matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libdbus-1-dev libudev-dev \
            libx11-dev libxi-dev libxtst-dev libpipewire-0.3-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgbm-dev pkg-config
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          shared-key: diamond
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # cargo-hack
        with:
          tool: cargo-hack
      - name: check feature powerset (no dev deps)
        # `metal` (nika-infer-local) pulls candle-core/metal → the Apple-GPU
        # `metal` crate, which only builds on macOS/iOS. Exclude it from the
        # Linux feature-matrix; a macOS runner would cover it if we add one.
        run: cargo hack --feature-powerset --no-dev-deps --exclude-features metal check --workspace
      - name: test the xcap-gated screen backend
        # nika-screen's pure-logic tests (region-bounds validation · capture
        # timestamp · stream plumbing) live behind the default-OFF `xcap` feature,
        # so the default `tests` job doesn't run them and the powerset above only
        # `check`s. RUN them here, where the desktop libs are installed (the
        # OS-FFI capture tests stay `#[ignore]` — the runner has no display).
        run: cargo test -p nika-screen --features xcap --lib

  miri:
    name: miri (L0 UB detection)
    runs-on: ubuntu-latest
    # Miri is nightly-only and ~100-1000x slower than native. Runs against
    # nika-error (L0, pure, zero I/O) — the crate with the most logic. Scoped
    # OFF nika-catalog (232 lib tests under miri ran >40min and got cancelled
    # before finishing); both are safe Rust (zero unsafe · Diamond forbids it)
    # so the UB risk is minimal. Not on kernel/kernel-mock (async + tokio not
    # supported under miri) and not on catalog-verify (network I/O).
    # Non-blocking (continue-on-error) until workspace-wide miri stabilises.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # nightly
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          shared-key: diamond-miri
      - name: miri test — nika-error
        env:
          # `-Zmiri-isolation-error=warn`: a proptest in the L0 tests calls
          # getcwd (failure-persistence file path) which miri's isolation blocks;
          # warn-and-return-error lets proptest fall back instead of aborting,
          # keeping strict-provenance UB detection intact.
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-isolation-error=warn"
          # The repo's rust-toolchain.toml pins stable 1.91, which overrides the
          # action's nightly when cargo runs — and 1.91 has no miri component.
          # Force the nightly toolchain (that carries miri) for this step only.
          RUSTUP_TOOLCHAIN: nightly
          # miri is ~100-1000x slower than native; the default 256 proptest
          # cases take >1h here. UB is structural, not input-dependent, so 1
          # case per proptest exercises the same code paths in seconds.
          PROPTEST_CASES: "1"
        run: cargo miri test --lib -p nika-error

  machete:
    name: cargo-machete (unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # cargo-machete
        with:
          tool: cargo-machete
      - name: check for unused dependencies
        run: cargo machete

  semver:
    name: cargo-semver-checks (api breakage)
    runs-on: ubuntu-latest
    # Compares current public API against baseline `origin/main`.
    # Fails PRs that introduce breaking changes without documented intent.
    # Non-blocking on push to main (only rejects PRs).
    continue-on-error: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          shared-key: diamond-semver
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: nika-error,nika-catalog,nika-kernel
          baseline-rev: origin/main

  typos:
    name: typos (spell check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@5e38bf262baaf477ca9f241b3a7cd3d277fd7df8 # master

  # The declared rust-version is a public contract (consumers pin against
  # it), so it gets its own named gate: the workspace must build with
  # EXACTLY the MSRV toolchain and the committed lockfile — even after the
  # day the main matrix moves to a newer stable.
  msrv:
    name: msrv (rust-version floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          shared-key: msrv
      # No --all-features: some features are platform-gated (the Apple-only
      # objc2 path breaks on a Linux runner); the floor is what a default
      # `cargo install --locked` consumer actually compiles.
      - run: cargo check --workspace --locked
