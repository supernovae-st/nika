name: e2e smoke

# Validates the SHIPPED nika release binary works for a brand-new user
# (the "first 15 minutes" onboarding path). Downloads the published release
# asset — no building.
#
# SECURITY: every `run:` step uses only `matrix.*` (static literals),
# `github.token` (via GH_TOKEN env), and values computed locally inside
# the step. No `github.event.*` free-text reaches any shell.

on:
  workflow_dispatch: {}
  release:
    types: [published]
  schedule:
    # Every Monday at 07:00 UTC — catches asset/infra rot
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    name: smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,  platform: macos-arm64 }
          - { os: ubuntu-latest, platform: linux-x64   }

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # ──────────────────────────────────────────────────────────────────
      # 1. Resolve + download the latest release
      # ──────────────────────────────────────────────────────────────────
      - name: Resolve latest release tag
        id: tag
        run: |
          set -euo pipefail
          tag="$(gh release view --repo supernovae-st/nika --json tagName --jq '.tagName')"
          version="${tag#v}"
          printf 'tag=%s\n'     "$tag"     >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf '::notice::Resolved release: tag=%s  version=%s\n' "$tag" "$version"

      - name: Download release assets
        env:
          TAG:      ${{ steps.tag.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
          VERSION:  ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dl
          gh release download "$TAG" \
            --repo supernovae-st/nika \
            --pattern "nika-${PLATFORM}-${VERSION}.tar.gz" \
            --pattern SHA256SUMS \
            --dir dl

      # ──────────────────────────────────────────────────────────────────
      # 2. Verify checksum, extract, put `nika` on PATH
      # ──────────────────────────────────────────────────────────────────
      - name: Verify checksum + extract
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION:  ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          tarball="nika-${PLATFORM}-${VERSION}.tar.gz"

          # Portable check: grep the matching line from SHA256SUMS, then
          # compare manually so we need neither GNU sha256sum nor BSD
          # shasum -c quirks around relative paths.
          expected="$(grep "${tarball}" dl/SHA256SUMS | awk '{print $1}')"
          if [ -z "$expected" ]; then
            printf '::error::No checksum entry found for %s in SHA256SUMS\n' "$tarball"
            exit 1
          fi

          # Compute the actual digest (macOS=shasum, Linux=sha256sum — both
          # produce the same hex output on the first field).
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "dl/${tarball}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "dl/${tarball}" | awk '{print $1}')"
          fi

          if [ "$actual" = "$expected" ]; then
            printf '[PASS] checksum OK  %s\n' "$actual"
          else
            printf '::error::[FAIL] checksum mismatch for %s\n' "$tarball"
            printf '  expected: %s\n' "$expected"
            printf '  actual:   %s\n' "$actual"
            exit 1
          fi

          # Extract; the tarball contains a single `nika` binary at root.
          mkdir -p bin
          tar -xzf "dl/${tarball}" -C bin
          chmod +x bin/nika

          # Make nika available for subsequent steps.
          printf '%s/bin\n' "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      # ──────────────────────────────────────────────────────────────────
      # 3. nika --version
      # ──────────────────────────────────────────────────────────────────
      - name: nika --version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          out="$(nika --version 2>&1)"
          printf 'output: %s\n' "$out"
          if printf '%s' "$out" | grep -qF "$VERSION"; then
            printf '[PASS] --version contains %s\n' "$VERSION"
          else
            printf '::error::[FAIL] --version output does not contain version %s\n' "$VERSION"
            exit 1
          fi

      - name: Install bubblewrap (Ubuntu exec path stays confined)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends bubblewrap
          sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict 2>/dev/null || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # ──────────────────────────────────────────────────────────────────
      # 4. exec path (offline) — check + run a single exec task
      # ──────────────────────────────────────────────────────────────────
      - name: exec path (offline)
        run: |
          set -euo pipefail
          # The fixture speaks the living contract: `command` is argv-only
          # (the string form died at 0.103 — NIKA-PARSE-019) and an absent
          # `permits:` block is ZERO authority (F-O8 · NEP-0003), so the
          # exec grant is explicit.
          cat > hello.nika.yaml <<'WORKFLOW'
          nika: hello-smoke
          permits:
            exec: [echo]
          tasks:
            greet:
              exec:
                command: [echo, hello-from-nika]
          WORKFLOW

          # Gate: structural validity
          if nika check hello.nika.yaml; then
            printf '[PASS] nika check exit 0\n'
          else
            printf '::error::[FAIL] nika check exited non-zero\n'
            exit 1
          fi

          # Gate: execution — the exec verb runs the shell command. (`nika run`
          # captures task stdout into the structured result rather than echoing
          # it, so we assert a clean exit rather than grepping the human render.)
          if nika run hello.nika.yaml; then
            printf '[PASS] nika run (exec) exit 0\n'
          else
            printf '::error::[FAIL] nika run (exec) exited non-zero\n'
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────────
      # 5. mock infer (offline) — model: mock/echo requires no provider
      # ──────────────────────────────────────────────────────────────────
      - name: mock infer (offline)
        run: |
          set -euo pipefail
          cat > mock-infer.nika.yaml <<'WORKFLOW'
          nika: mock-infer-smoke
          model: mock/echo
          tasks:
            ping:
              infer:
                prompt: hi
          WORKFLOW

          if nika run mock-infer.nika.yaml; then
            printf '[PASS] mock infer exit 0\n'
          else
            printf '::error::[FAIL] mock infer exited non-zero\n'
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────────
      # 6. try offline UX — the audit's "first example must work offline"
      # (`nika try` is the showroom door: offline mock rehearsal by
      # default, zero keys.)
      # ──────────────────────────────────────────────────────────────────
      - name: try offline UX
        run: |
          set -euo pipefail
          if nika try 01-hello --no-progress; then
            printf '[PASS] nika try 01-hello exit 0\n'
          else
            printf '::error::[FAIL] nika try 01-hello exited non-zero\n'
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────────
      # 6b. try fixture door — the #815 class: a fixture-reading example
      # must materialize its ingredients in try's own room and leave the
      # operator's folder untouched ("nothing written, nothing owned").
      # 01-hello reads no fixtures, so it alone cannot catch a regression.
      # ──────────────────────────────────────────────────────────────────
      - name: try fixture door (offline)
        run: |
          set -euo pipefail
          mkdir try-fixture-probe
          cd try-fixture-probe
          if nika try meeting-actions --no-progress; then
            printf '[PASS] nika try meeting-actions exit 0\n'
          else
            printf '::error::[FAIL] nika try meeting-actions exited non-zero\n'
            exit 1
          fi
          leftovers="$(ls -A)"
          if [ -z "$leftovers" ]; then
            printf '[PASS] operator folder untouched\n'
          else
            printf '::error::[FAIL] try left files behind: %s\n' "$leftovers"
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────────
      # 7. nika doctor
      # ──────────────────────────────────────────────────────────────────
      - name: nika doctor
        run: |
          set -euo pipefail
          if nika doctor; then
            printf '[PASS] doctor exit 0\n'
          else
            printf '::error::[FAIL] doctor exited non-zero\n'
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────────
      # 8. LSP smoke (best-effort — never fails the job)
      # The LSP server speaks JSON-RPC over stdio with Content-Length framing.
      # We send a minimal `initialize` request and look for `capabilities`
      # in the response. If the framing is fragile (EOF timing, etc.) the
      # step is allowed to fail without blocking the job.
      # ──────────────────────────────────────────────────────────────────
      - name: LSP smoke (best-effort)
        continue-on-error: true
        run: |
          set -euo pipefail

          # Minimal LSP initialize request body (no user-controlled text).
          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"processId":null,"rootUri":null,"capabilities":{}}}'
          body_len="${#body}"
          request="Content-Length: ${body_len}\r\n\r\n${body}"

          # Send the request over stdin; read up to 4096 bytes of the response.
          # `timeout` is available on both macOS (via coreutils or brew) and Linux.
          # Fall back gracefully if timeout is absent.
          if command -v timeout >/dev/null 2>&1; then
            response="$(printf '%b' "$request" | timeout 5s nika lsp 2>/dev/null | head -c 4096 || true)"
          else
            response="$(printf '%b' "$request" | nika lsp 2>/dev/null | head -c 4096 || true)"
          fi

          if printf '%s' "$response" | grep -q '"capabilities"'; then
            printf '[PASS] LSP initialize response contains "capabilities"\n'
          else
            # Fallback: at minimum nika lsp should start and accept EOF cleanly.
            printf '::warning::LSP response did not contain "capabilities" — trying EOF fallback\n'
            if printf '' | timeout 5s nika lsp >/dev/null 2>&1; then
              printf '[PASS] LSP EOF fallback: exited cleanly\n'
            else
              printf '::warning::LSP EOF fallback returned non-zero (continue-on-error)\n'
              exit 1
            fi
          fi
