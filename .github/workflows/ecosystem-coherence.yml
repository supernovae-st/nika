name: ecosystem coherence

# The nightly cross-repo drift bot — scripts/ci/ecosystem-coherence.py.
# FAIL pins (24h post-tag grace): tap==release · site==release · npm==repo ·
# pack==spec. WARN: operator-gated lag (OpenVSX publish · docs snapshot) +
# the lockstep-at-0.97 preview. Read-only · public HTTP · no user input
# reaches the shell.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  coherence:
    name: cross-repo pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Self-test the bot (offline decision table — grace · lockstep · pre-release · dark surfaces)
        run: python3 scripts/ci/test-ecosystem-coherence.py
      - name: Run the coherence bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/ci/ecosystem-coherence.py | tee bot.out | tee -a "$GITHUB_STEP_SUMMARY"
      # The findings reach a DURABLE surface: one idempotent issue —
      # upserted while the board carries findings, closed on GREEN.
      # Step-summary dies with the run; the issue is where a drift
      # waits for its human. SECURITY: the body is the bot's own
      # stdout (repo-owned script over public pins), never event data.
      - name: The nightly board is an issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -f bot.out ] || exit 0
          TITLE="ecosystem coherence — nightly board"
          NUM="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' || true)"
          if grep -qE "^(FAIL|WARN) " bot.out; then
            BODY="$(printf 'Nightly run %s\n\n```\n%s\n```\n' "$GITHUB_RUN_ID" "$(cat bot.out)")"
            if [ -n "$NUM" ]; then gh issue comment "$NUM" --body "$BODY" >/dev/null; echo "board updated: #$NUM"
            else gh issue create --title "$TITLE" --body "$BODY" >/dev/null; echo "board opened"; fi
          else
            if [ -n "$NUM" ]; then gh issue close "$NUM" --comment "GREEN — every pin holds (run $GITHUB_RUN_ID)." >/dev/null; echo "board closed"; else echo "green · no board"; fi
          fi
