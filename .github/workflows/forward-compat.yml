name: Forward-compat — API surface + semver

on:
  pull_request:
    paths:
      - 'crates/**/src/lib.rs'
      - 'crates/**/src/**/*.rs'
      - 'crates/**/Cargo.toml'
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked

      - name: Detect public API changes (diff vs base)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for crate in crates/*/Cargo.toml; do
            name=$(basename "$(dirname "$crate")")
            echo "::group::$name public API diff"
            cargo public-api --package "$name" \
              --diff-git-checkouts "$BASE_SHA" "$HEAD_SHA" \
              --deny added --deny changed --deny removed || {
                echo "::warning title=API change::$name has unannotated public API change"
              }
            echo "::endgroup::"
          done

  semver-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          # nika-fx, nika-onboard and nika-store are publish=true (nika-bm25
          # class) but have no crates.io release yet — the action hard-errors
          # on the registry lookup for a never-published crate. Remove each at
          # its first release.
          exclude: nika-fx,nika-onboard,nika-graph,nika-store
