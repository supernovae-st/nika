name: Forward-compat — API surface + semver

on:
  pull_request:
    paths:
      - 'crates/**/src/lib.rs'
      - 'crates/**/src/**/*.rs'
      - 'crates/**/Cargo.toml'
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked

      - name: Detect public API changes (diff vs base)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for crate in crates/*/Cargo.toml; do
            name=$(basename "$(dirname "$crate")")
            echo "::group::$name public API diff"
            cargo public-api --package "$name" \
              --diff-git-checkouts "$BASE_SHA" "$HEAD_SHA" \
              --deny added --deny changed --deny removed || {
                echo "::warning title=API change::$name has unannotated public API change"
              }
            echo "::endgroup::"
          done

  semver-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # nika-fx and nika-onboard are publish=true (nika-bm25 class) but
          # have no crates.io release yet — the action hard-errors on the
          # registry lookup for a never-published crate. Remove each at its
          # first release.
          exclude: nika-fx,nika-onboard
