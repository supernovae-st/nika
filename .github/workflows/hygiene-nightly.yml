name: Hygiene — Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main   # explicit — always check main even if default branch differs (renamed from nika-diamond 2026-05-06)

      # Vectors 34 (cargo-deny) + 36 (cargo-machete) hard-RED and vector 15
      # (cargo-audit) YELLOWs when the binary is absent. Installing them here
      # makes the nightly actually run the supply-chain policy instead of
      # false-flagging on a missing tool — one of the causes of the recurring
      # drift-issue spam (2026-06; vector 15 was the last holdout, the
      # standing YELLOW in the #240 drift table).
      - name: Install supply-chain tools (cargo-deny + cargo-machete + cargo-audit)
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-deny,cargo-machete,cargo-audit

      # Vector 45 (taught-commands) renders the real surfaces with the
      # real binary — on a fresh runner none exists, and the vector's
      # honest SKIP would make it a permanent no-op in the one job that
      # runs it nightly (measured by an adversarial pass the day the
      # vector shipped). The build IS the vector's input. No workflow
      # input is interpolated here: the command is a constant.
      - name: Build the CLI (vector 45 renders the real surfaces)
        run: cargo build -p nika-cli --bin nika

      - name: Run hygiene dashboard
        id: hygiene
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/hygiene/*.sh
          set +e
          ./scripts/hygiene/check-all.sh > /tmp/hygiene.txt 2>&1
          EXIT=$?
          echo "exit=$EXIT" >> "$GITHUB_OUTPUT"
          cat /tmp/hygiene.txt
          sed -E 's/\x1b\[[0-9;]*[mK]//g' /tmp/hygiene.txt > /tmp/hygiene-clean.txt

      # An exit this job does not recognise is NOT a clear. 127 (the script
      # is gone), 124 (timeout), 137 (OOM-killed) all used to fall past
      # every branch below and leave a green check — the dashboard silently
      # reporting nothing about a run that never happened. It fails loudly
      # instead: an unmeasurable state is not a measured one.
      - name: Refuse an unmeasurable run
        if: steps.hygiene.outputs.exit != '0' && steps.hygiene.outputs.exit != '1' && steps.hygiene.outputs.exit != '2'
        run: |
          echo "::error::hygiene dashboard could not answer (exit ${{ steps.hygiene.outputs.exit }}) — this is not a clean bill"
          exit 1

      - name: Prepare issue body
        if: steps.hygiene.outputs.exit == '2'
        run: |
          {
            echo "Drift detected across one or more vectors."
            echo ""
            echo '```'
            cat /tmp/hygiene-clean.txt
            echo '```'
            echo ""
            echo "_Auto-generated by hygiene-nightly. Run \`./scripts/hygiene/check-all.sh\` locally to reproduce._"
          } > /tmp/issue-body.md

      - name: Open or update drift issue (RED only)
        if: steps.hygiene.outputs.exit == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="hygiene-drift: ecosystem out of sync"
          # Self-heal the dedup label. Without it, `gh issue create --label`
          # silently fell back to a label-less issue, so the list query below
          # never matched and the nightly opened a NEW duplicate every run
          # (18 dupes by 2026-06-28). Creating it idempotently makes dedup work.
          gh label create hygiene-drift --color fbca04 \
            --description "Auto-filed by the nightly hygiene drift dashboard" \
            --force >/dev/null 2>&1 || true
          EXISTING=$(gh issue list --label hygiene-drift --state open --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file /tmp/issue-body.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/issue-body.md --label hygiene-drift
          fi

      # NOT-RED closes it, which is 0 or 1 — not 0 alone. The dashboard
      # tracks DRIFT (exit 2); a yellow is a warning, not drift. Keyed on
      # 0 only, and with five persistent yellows on the tree, the close
      # path could never fire: every issue this job ever opened would stay
      # open forever once the red was repaired (2026-08-02).
      - name: Close drift issue when no longer RED
        if: steps.hygiene.outputs.exit == '0' || steps.hygiene.outputs.exit == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label hygiene-drift --state open --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "All hygiene checks green again 🦋"
          fi
