name: Hygiene — Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run hygiene dashboard
        id: hygiene
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/hygiene/*.sh
          set +e
          ./scripts/hygiene/check-all.sh > /tmp/hygiene.txt 2>&1
          EXIT=$?
          echo "exit=$EXIT" >> "$GITHUB_OUTPUT"
          cat /tmp/hygiene.txt
          sed -E 's/\x1b\[[0-9;]*[mK]//g' /tmp/hygiene.txt > /tmp/hygiene-clean.txt

      - name: Open or update drift issue (RED only)
        if: steps.hygiene.outputs.exit == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="hygiene-drift: ecosystem out of sync"
          BODY=$(printf '%s\n\n```\n%s\n```\n\n_Auto-generated by hygiene-nightly. Run `./scripts/hygiene/check-all.sh` locally to reproduce._' \
            "Drift detected across one or more vectors." \
            "$(cat /tmp/hygiene-clean.txt)")
          EXISTING=$(gh issue list --label hygiene-drift --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label hygiene-drift 2>/dev/null || \
              gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Close drift issue if all green
        if: steps.hygiene.outputs.exit == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label hygiene-drift --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "All hygiene checks green again 🦋"
          fi
