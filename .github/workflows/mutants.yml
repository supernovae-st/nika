name: Mutants Nightly

# Nightly mutation testing (ADR-003 Gate 5) over the crates whose test suites
# carry the security thesis · nika-cap is the capability CHECKER (the component
# whose soundness the whole capability-boundary argument rests on). The run
# invokes the house floor/budget gate (scripts/ci/check-mutation-floor.sh),
# which enforces kill-ratio >= floor (or the documented GATE5-EXEMPT budget)
# and honours .cargo/mutants.toml exclusions. Slow by nature (minutes/crate) ·
# nightly + dispatch only, never a PR gate.
#
# Security note: schedule/dispatch triggers only · no user-controlled strings ·
# the matrix value reaches the shell via env-var indirection.

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    name: mutants · ${{ matrix.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Each crate is its own job (fail-fast: false, 90 min each), so this
        # list widens without any crate's cost reaching another's.
        crate:
          # The capability boundary itself.
          - nika-cap
          # Added 2026-08-13. These six carry a `GATE5-EXEMPT` marker, and
          # until today that marker attested ITSELF: check-gate5-attestation.sh
          # greps for its presence and calls the crate attested, so a budget
          # could drift to nothing and CI would stay green. The floor script
          # already honours BUDGET mode for them; they simply were never RUN.
          # A declaration is not a measurement.
          - nika-types
          - nika-cel
          - nika-catalog
          - nika-catalog-codegen
          - nika-tmpl
          - nika-schema
          # The v0.114 dataflow descent is pure evaluation logic (CEL, jq,
          # record projection and error classification). Its admission floor
          # is measured here so the crate's Gate-5 attestation stays current.
          - nika-dataflow
          # NOT added, and the reason is the point. nika-a11y · nika-screen ·
          # nika-input · nika-browser are platform-sensitive, and the floor
          # script's own header documents that `-- --lib` on ubuntu mutates the
          # cfg'd-out other-OS arms, so they report MORE survivors than their
          # spec's reachable count. Running them here would manufacture a red
          # that accuses the crate for the runner's platform · the exact
          # instrument fault this gate was just fixed to stop making. Their
          # exemption stays DECLARED rather than measured, and naming that is
          # the honest half of the ratchet.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: mutants-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Mutation floor · ${{ matrix.crate }}
        env:
          CRATE: ${{ matrix.crate }}
        run: bash scripts/ci/check-mutation-floor.sh "$CRATE"
