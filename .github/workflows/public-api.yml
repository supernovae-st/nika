name: public-api

on:
  pull_request:
    paths:
      - 'crates/**/src/**'
      - 'crates/**/Cargo.toml'
      - 'Cargo.toml'
      # A baseline or floor change MUST re-run the gate — otherwise a snapshot
      # regeneration ships unverified (a regen-only push carries no src/** and
      # matched nothing · observed 2026-07-03 on the gate-repair branch itself).
      - 'crates/**/public-api.txt'
      - 'scripts/ci/public-api-coverage-baseline.txt'
      - '.github/workflows/public-api.yml'
  # Run on direct pushes to EVERY branch, main included. The Diamond rebuild
  # commits straight to its feature branch, so a PR-only trigger let the
  # committed baselines drift silently (caught only when a PR finally opened).
  #
  # main was excluded until 2026-07-30 on the assumption that it stays
  # PR-gated, which made a redundant post-merge re-run the only cost of
  # including it. That assumption is false for this org: supernovae-st is
  # direct-push and main receives commits that never pass through a PR, so the
  # exclusion was a blind spot exactly the size of the direct-push flow —
  # measured that day at 352 drifted lines across nine crates, invisible
  # because a gate that never fires reads exactly like a gate that passes.
  # One redundant run per merge is the cheaper half of that trade.
  push:
    paths:
      - 'crates/**/src/**'
      - 'crates/**/Cargo.toml'
      - 'Cargo.toml'
      - 'crates/**/public-api.txt'
      - 'scripts/ci/public-api-coverage-baseline.txt'
      - '.github/workflows/public-api.yml'
  # Manual re-verification (e.g. after a tool-version bump + mass regen).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: install nightly rustdoc (required by cargo-public-api)
        # cargo-public-api shells out to `cargo +nightly rustdoc` for JSON
        # output — with only stable installed every run died in ~1m40s on
        # `toolchain 'nightly' is not installed` BEFORE diffing anything,
        # leaving the API-freeze gate silently blind (observed on every run
        # through 2026-07-01). Same pattern as fuzz-nightly.yml.
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: install cargo-public-api
        # Pinned to the version the committed public-api.txt baselines were
        # generated with (scripts/hygiene/check-public-api-coverage.sh uses
        # the same local tool). An unpinned latest can render the same API
        # differently (auto-trait/blanket-impl formatting changed across
        # releases — the historical baselines carry that skew) and would
        # false-RED every crate at once. Bump tool + regenerate all
        # baselines in ONE commit.
        run: cargo install --locked cargo-public-api --version 0.51.0
      - name: diff each covered lib crate
        # The crate list is PROJECTED from the coverage floor (ADR-090: one SSOT,
        # three consumers — this job, semver-checks.yml, and hygiene vector 38).
        # Add a crate to scripts/ci/public-api-coverage-baseline.txt + commit its
        # public-api.txt, and all three pick it up. No hardcoded parallel list.
        # Reads a repo-tracked file only (no untrusted github.event.* input).
        # nika-catalog-verify is binary-only (no lib target) so it is never floored.
        # Foundation crates are publish=false (ADR-022); snapshots live in-repo to
        # enforce Gate 12 (FCI) locally and in CI.
        # Baselines are CANONICAL ON THIS RUNNER'S PLATFORM (ubuntu): crates
        # with platform-cfg'd surfaces (a11y · input · browser) render
        # differently on macOS, so regenerate snapshots FROM THE ARTIFACT this
        # job uploads on failure (public-api-actual), not from a local mac run.
        run: |
          set -euo pipefail
          fail=0
          mkdir -p /tmp/public-api-actual
          crates=$(grep -vE '^[[:space:]]*#' scripts/ci/public-api-coverage-baseline.txt | grep -E '^nika-')
          for crate in $crates; do
            # DEFAULT features (not --all-features): platform-exclusive features
            # (metal · xcap) cannot compile on this runner and killed the loop
            # (observed: nika-infer-local's metal on ubuntu). The gate locks the
            # default-feature surface every consumer gets; feature-gated
            # platform surfaces are intentionally not baseline-locked.
            actual=$(cargo public-api -p "$crate" --omit auto-trait-impls)
            printf '%s\n' "$actual" > "/tmp/public-api-actual/$crate.txt"
            expected=$(cat "crates/$crate/public-api.txt")
            if [ "$actual" != "$expected" ]; then
              echo "::error::public API drift in $crate — regenerate snapshot or revert"
              diff <(echo "$expected") <(echo "$actual") || true
              fail=1
            fi
          done
          exit $fail
      - name: upload canonical renderings (drift repair source)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-api-actual
          path: /tmp/public-api-actual/
          if-no-files-found: ignore
