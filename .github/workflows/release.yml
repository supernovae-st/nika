name: release

# Cross-platform binary release. On a `vX.Y.Z` tag this builds the four
# `nika` binaries the Homebrew formula points at and holds the GitHub release
# draft until every immutable registry coordinate is proven complete. Nothing
# runs until a tag is pushed or an operator explicitly replays one.
#
# SECURITY (cf diamond-ci.yml): every `run:` step references only `matrix.*`
# (static literals in this file), `github.ref_name` / the `tag` input (the
# pushed tag — a `vX.Y.Z` string, not attacker-authored free text), and values
# passed through `env:`. No issue/PR/comment text reaches a shell.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild; dispatch this workflow from main, never from the tag'
        required: true

permissions:
  contents: read # least privilege at the top — release job elevates (Scorecard Token-Permissions)

# All version trains share one publication lane. A manual replay cannot overlap
# another replay or a live train for release assets, the floating image tag, or
# the Homebrew formula. Never cancel a running train after an irreversible
# registry write. GitHub retains one pending train and may replace it with a
# newer one, so the ceremony never queues more than one train behind the active
# run.
concurrency:
  group: nika-release-train
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  coordinate:
    name: freeze release coordinate
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.coordinate.outputs.tag }}
      version: ${{ steps.coordinate.outputs.version }}
      sha: ${{ steps.coordinate.outputs.sha }}
    steps:
      - name: Refuse a replay selected from a non-main workflow ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] \
            && [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            printf 'release replay must select --ref main; got %s\n' "$WORKFLOW_REF" >&2
            exit 1
          fi
      # Validate with the workflow's own first-party guard before any build or
      # publication job can start. In particular, `+build` must never reach
      # `gh release create` and leave a half-published multi-registry train.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: scripts/release/check-release-tag.sh
          sparse-checkout-cone-mode: false
      - name: Resolve and peel the selected tag exactly once
        id: coordinate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          bash .release-tooling/scripts/release/check-release-tag.sh "$TAG"
          refs="$(git ls-remote --exit-code "https://github.com/${REPO}.git" \
            "refs/tags/${TAG}" "refs/tags/${TAG}^{}")"
          direct="$(printf '%s\n' "$refs" | awk -v ref="refs/tags/${TAG}" '$2 == ref { print $1 }')"
          peeled="$(printf '%s\n' "$refs" | awk -v ref="refs/tags/${TAG}^{}" '$2 == ref { print $1 }')"
          sha="${peeled:-$direct}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::${TAG} did not resolve to one peeled commit"
            exit 73
          }
          if [ "$EVENT_NAME" = push ] && [ "$sha" != "$PUSH_SHA" ]; then
            echo "::error::pushed tag resolves to ${sha}, but github.sha is ${PUSH_SHA}"
            exit 73
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.name }}
    needs: coordinate
    runs-on: ${{ matrix.os }}
    env:
      # Evaluated once at job start so steps can reference it in `if:` conditions.
      # Step-level env is not visible to `if:` expressions.
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: arm64 native + x64 cross-compiled on the same arm runner
          # (the engine is pure-Rust + rustls — no C/OpenSSL — so the darwin
          # cross-build is clean and avoids the deprecated macos-13 runner).
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x64 }
          # Linux: GNU on the OLDEST runners for the broadest glibc compat
          # (switch to `*-unknown-linux-musl` + musl-tools for fully-static
          # binaries if a glibc-version complaint ever surfaces).
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64 }
    steps:
      # ref pinned to the tag: on a tag push this is a no-op (ref_name IS
      # the tag), but a workflow_dispatch rebuild used to check out MAIN
      # and only the version-match guard below kept that honest. The
      # binaries and their provenance now come from the tag they claim.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.coordinate.outputs.sha }}
          persist-credentials: false
      - name: Verify tag matches Cargo workspace version
        env:
          REF_NAME: ${{ needs.coordinate.outputs.tag }}
        run: |
          set -euo pipefail
          tag_version="${REF_NAME#v}"
          cargo_version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::release tag ${REF_NAME} does not match Cargo workspace version ${cargo_version}"
            exit 1
          fi
      # The provenance manifest must be TRUE of the tree being released.
      # It is not required per-commit (a whole-tree projection carried by
      # every branch makes concurrent PRs collide on a file none of them
      # edited), so this is the gate that owns it: the tagged tree, the
      # one whose binaries a user will verify, must match its manifest
      # exactly. RELEASING.md step 2 regenerates it before the tag.
      - name: The estate manifest is true of the tagged tree
        run: |
          set -euo pipefail
          if ! python3 scripts/estate.py --check; then
            echo "::error::the estate manifest does not describe the tagged tree — run python3 scripts/estate.py --write, commit it, and re-tag"
            exit 1
          fi
      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - name: Build nika-cli (release · locked · sovereign lane whole)
        # `local-infer` on every target (#518 ruling · option A-CPU): the
        # shipped binary pulls AND serves — measured +2.4 MB. CPU on
        # purpose, darwin included: candle 0.10's quantized rms-norm Metal
        # kernel is broken, so `--features metal` ships a lane that dies
        # at first token. Revisit when candle fixes the kernel.
        # `access-harness` (D-2026-08-04-N1 · P3): the class has been on
        # main, API-frozen, since 2026-08-08, and was never in this line.
        # A downloadable binary that cannot `--access` a seat is a lie
        # the wiring gate now catches. metal stays off (tombstone).
        run: cargo build --release --locked --bin nika-cli --target ${{ matrix.target }} --features local-infer,access-harness
      - name: Sign + notarize (macOS)
        # Gatekeeper-trust the binary so browser-downloads do not show
        # "unidentified developer". SAFETY: continue-on-error is MANDATORY —
        # a signing failure must never block the release; unsigned binaries
        # still ship exactly as before. Also gated on HAS_SIGNING so forks
        # without the secrets skip the step cleanly.
        if: runner.os == 'macOS' && env.HAS_SIGNING == 'true'
        continue-on-error: true
        env:
          TARGET: ${{ matrix.target }}
          P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # ── 1. Import the Developer ID certificate into a throw-away keychain ──
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(openssl rand -base64 16)"
          P12="$RUNNER_TEMP/cert.p12"

          printf '%s' "$P12_B64" | base64 --decode > "$P12"

          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$P12" -k "$KC" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC"
          # Prepend the throw-away keychain to the user search list
          OLD_KEYCHAINS="$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KC" $OLD_KEYCHAINS

          # ── 2. Locate the signing identity ──
          IDENTITY="$(security find-identity -v -p codesigning "$KC" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate." >&2
            exit 1
          fi
          echo "Signing with identity: $IDENTITY"

          # ── 3. Sign the binary (hardened runtime + secure timestamp) ──
          BINARY="target/$TARGET/release/nika-cli"
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" "$BINARY"
          codesign --verify --strict --verbose=2 "$BINARY"

          # ── 4. Notarize ──
          # Bare CLI binaries cannot be stapled; Gatekeeper validates online.
          ZIP="$RUNNER_TEMP/nika.zip"
          ditto -c -k --keepParent "$BINARY" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # ── 5. Clean up the throw-away keychain (best-effort) ──
          security delete-keychain "$KC" || true

      - name: Package as `nika`
        env:
          ASSET_NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
          REF_NAME: ${{ needs.coordinate.outputs.tag }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          stage="$(mktemp -d)"
          # The PUBLIC binary is `nika` (the formula does `bin.install "nika"`).
          # nika-cli is the seed surface until the L5 `nika` composition root
          # ships; the release renames it to its public name.
          cp "target/${TARGET}/release/nika-cli" "${stage}/nika"
          chmod +x "${stage}/nika"
          # Pre-generated shell completions ride the tarball (#487) so distro
          # packages (AUR nika-bin · future nixpkgs/apk) can `install -Dm644`
          # them without executing the target-arch binary in package().
          # Running the binary HERE is proven-safe on every matrix row: the
          # funnel-e2e gate below already executes this same staged binary
          # (macos-x64 cross runs via Rosetta on the arm runner).
          mkdir -p "${stage}/completions"
          "${stage}/nika" completions bash > "${stage}/completions/nika.bash"
          "${stage}/nika" completions zsh  > "${stage}/completions/_nika"
          "${stage}/nika" completions fish > "${stage}/completions/nika.fish"
          for f in nika.bash _nika nika.fish; do
            test -s "${stage}/completions/${f}"
          done
          tarball="nika-${ASSET_NAME}-${version}.tar.gz"
          tar -czf "${tarball}" -C "${stage}" nika completions
          shasum -a 256 "${tarball}" | tee "${tarball}.sha256"
      - name: Install bubblewrap (Linux gates run CONFINED · the Diamond CI tests-leg recipe)
        # Since #889 a `permits:`-declaring workflow REFUSES to start where no
        # sandbox backend exists (NIKA-1710). The funnel's consent-pause leg and
        # the trust battery both spend an exec under permits — on the Linux
        # builders without bwrap they died `exit=3 want=4` (v0.109.1 · run
        # 32193107899) while the macOS builders (seatbelt) passed. Install the
        # jail so both gates run confined here too, the same way they do on
        # macOS — never a waiver. ubuntu-24.04's AppArmor bwrap profile grants
        # userns creation but denies CAP_NET_ADMIN inside it, so bwrap dies
        # bringing up loopback in the unshared netns; detach the profile and
        # keep unprivileged userns open (the tests-leg recipe, proven daily).
        if: runner.os == 'Linux'
        run: |
          # apt has no deadline of its own: measured 2026-08-19 (02:54Z→~03:20Z),
          # every job entering this step hung on a mirror stall and the 6-hour job
          # timeout was the only exit — every open PR froze behind it. A 30 s socket
          # timeout + 3 retries cover the transient half; the 5-minute hard deadline
          # turns the rest into a clean red the operator can re-run.
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends bubblewrap
          sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict 2>/dev/null || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true  # absent on ubuntu-22.04
      - name: Funnel e2e (gate before upload)
        # The stranger's first path, played against the TARBALL that is
        # about to ship (untarred into a clean HOME · offline · content
        # asserts, never bare exit codes) — the deno pattern: a broken
        # first-run never uploads. scripts/ci/funnel-e2e.sh is the spec.
        # No workflow inputs reach the script: it takes one local path.
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          tar -xzf nika-*.tar.gz -C "$smoke"
          bash scripts/ci/funnel-e2e.sh "$smoke/nika"
          # The operator's trust path against the SAME tarball — the
          # runs-as-evidence claims (resume · reproduce · chain verify ·
          # tamper/drop exit 2 · OTLP export). A release whose flight
          # recorder lies never uploads. scripts/test/trust-battery.sh.
          bash scripts/test/trust-battery.sh "$smoke/nika"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nika-${{ matrix.name }}
          path: |
            nika-*.tar.gz
            nika-*.tar.gz.sha256
          if-no-files-found: error

  release-draft:
    name: prepare draft release
    needs: [coordinate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create or inspect the draft release
    outputs:
      version: ${{ needs.coordinate.outputs.version }}
      tag: ${{ needs.coordinate.outputs.tag }}
      hashes: ${{ steps.meta.outputs.hashes }}
      sha: ${{ needs.coordinate.outputs.sha }}
      release-id: ${{ steps.release.outputs.id }}
      draft: ${{ steps.release.outputs.draft }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      # The checkout this job never had. The front-page step below runs
      # scripts/release/render-notes.sh FROM THE REPO, and this job started
      # from a bare runner: the v0.106.0 first attempt died on exit 127
      # (`No such file or directory`) with all four builds green — the step
      # shipped with the front-page commit and, being tag-triggered only,
      # had never once executed. Pinned to the tag ref so a
      # workflow_dispatch rebuild renders the notes of the tag it names,
      # never of whatever main has become.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.coordinate.outputs.sha }}
          persist-credentials: false
      # workflow_dispatch may rebuild a tag older than this helper. Pull the
      # one first-party script from the exact commit whose workflow is running,
      # never from the historical release tree and never from a floating ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: |
            scripts/release/check-release-tag.sh
            scripts/release/prepare-draft-release.sh
            scripts/release/read-release-state.sh
            scripts/release/resolve-release-tag.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Aggregate checksums + version
        id: meta
        env:
          REF_NAME: ${{ needs.coordinate.outputs.tag }}
        run: |
          set -euo pipefail
          (cd artifacts && cat ./*.tar.gz.sha256 | sort > SHA256SUMS)
          # Subjects for the SLSA generator job below — sha256 of every
          # shipped tarball, base64 one-line, per the generator contract.
          echo "hashes=$(cd artifacts && sha256sum nika-*.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"
          {
            echo "## Checksums"
            echo '```'
            cat artifacts/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-native-manifest
          path: artifacts/SHA256SUMS
          if-no-files-found: error
      - name: Create or reuse the GitHub draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ needs.coordinate.outputs.tag }}
          RELEASE_SHA: ${{ needs.coordinate.outputs.sha }}
        run: |
          set -euo pipefail
          # The curated front page (What · Install · Verify · Provenance) is
          # rendered from CHANGELOG.md; --generate-notes keeps the full PR
          # list appended below it (gh prepends provided notes to generated).
          bash scripts/release/render-notes.sh "$REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          bash .release-tooling/scripts/release/prepare-draft-release.sh \
            "$REF_NAME" "$REPO" "$RUNNER_TEMP/release-notes.md" "$RELEASE_SHA" \
            >> "$GITHUB_OUTPUT"
  native-attest:
    # Native attestation generation is tag-context-only and deliberately has no
    # release-write token. A manual replay verifies existing attestations in the
    # read-only final proof instead of minting branch-context replacements.
    name: attest native release archives
    needs: release-draft
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nika-*
          path: artifacts
          merge-multiple: true
      - name: Attest build provenance (verifiable via `gh attestation verify`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/nika-*.tar.gz'

  provenance:
    # The scorecard-visible provenance: this reusable workflow builds and
    # GENERATES `multiple.intoto.jsonl` as a run artifact. The native
    # attest-build-provenance step above stays (gh attestation verify) but
    # scorecard's Signed-Releases probe only reads release ASSET NAMES
    # (ossf/scorecard#4080) — the .intoto.jsonl asset is what scores.
    # Tag pin is the generator's own hard requirement (its internal
    # verifier refuses SHA refs) — the one documented exception to the
    # SHA-pin law; scorecard's Pinned-Dependencies knows this exception.
    name: slsa provenance (intoto asset)
    needs: release-draft
    # On workflow_dispatch, github.ref/github.sha identify the workflow source
    # (normally main), not the input tag whose bytes were built. The generic
    # generator binds those context values into the statement, so only a tag
    # push can create tag-true provenance. Manual replay can only verify an
    # existing statement; missing provenance requires rerunning the retained
    # original tag-push run.
    if: github.event_name == 'push'
    permissions:
      actions: read # read the workflow run for provenance
      id-token: write # sign the provenance (Sigstore OIDC)
      # `contents: write`, not `read` (#1419 · v0.117.0 died at startup):
      # the generator's nested `upload-assets` job declares `contents:
      # write` unconditionally and GitHub validates that declaration when
      # the reusable workflow is CALLED, before `upload-assets: false`
      # skips the job. The caller must grant what the callee declares; the
      # authority never runs — the isolated release-assets-converge job
      # below owns every release upload.
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release-draft.outputs.hashes }}
      # The upstream release uploader deletes and replaces an occupied
      # same-name asset. Generate a run artifact only; the isolated
      # release-assets-converge job below owns the fail-closed release upload.
      upload-assets: false

  provenance-publish:
    name: verify push slsa provenance
    needs: [release-draft, provenance]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: scripts/release
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nika-*
          path: artifacts
          merge-multiple: true
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - name: Normalize the generated statement name
        env:
          PROVENANCE_NAME: ${{ needs.provenance.outputs.provenance-name }}
        run: |
          set -euo pipefail
          test "$PROVENANCE_NAME" = "multiple.intoto.jsonl"
          test -s artifacts/multiple.intoto.jsonl
      - name: Verify push provenance before exposing its run artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release-draft.outputs.release-id }}
          RELEASE_SHA: ${{ needs.release-draft.outputs.sha }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-draft.outputs.tag }}
        run: |
          set -euo pipefail
          native=(artifacts/nika-*.tar.gz)
          bash .release-tooling/scripts/release/verify-slsa-provenance.sh \
            "$TAG" "$REPO" artifacts/multiple.intoto.jsonl "${native[@]}"
          bash .release-tooling/scripts/release/read-release-state.sh \
            "$REPO" "$RELEASE_ID" "$TAG" "$RELEASE_SHA" >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance
          path: artifacts/multiple.intoto.jsonl
          if-no-files-found: error

  provenance-replay-check:
    name: verify existing slsa provenance on replay
    needs: release-draft
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: scripts/release
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nika-*
          path: artifacts
          merge-multiple: true
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - name: Download exactly one existing statement
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release-draft.outputs.release-id }}
          RELEASE_SHA: ${{ needs.release-draft.outputs.sha }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-draft.outputs.tag }}
        run: |
          set -euo pipefail
          bash .release-tooling/scripts/release/read-release-state.sh \
            "$REPO" "$RELEASE_ID" "$TAG" "$RELEASE_SHA" >/dev/null
          matches="$(gh api "repos/${REPO}/releases/${RELEASE_ID}" \
            --jq '[.assets[] | select(.name == "multiple.intoto.jsonl")] | length')"
          if [ "$matches" != "1" ]; then
            echo "::error::workflow_dispatch cannot regenerate tag-context SLSA provenance; rerun the original tag-push run while it is retained"
            exit 73
          fi
          gh release download "$TAG" --repo "$REPO" \
            --pattern multiple.intoto.jsonl --dir artifacts
          native=(artifacts/nika-*.tar.gz)
          bash .release-tooling/scripts/release/verify-slsa-provenance.sh \
            "$TAG" "$REPO" artifacts/multiple.intoto.jsonl "${native[@]}"
          bash .release-tooling/scripts/release/read-release-state.sh \
            "$REPO" "$RELEASE_ID" "$TAG" "$RELEASE_SHA" >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance
          path: artifacts/multiple.intoto.jsonl
          if-no-files-found: error

  provenance-result:
    name: select event-specific provenance result
    needs: [provenance-publish, provenance-replay-check]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected lane and reject skipped masquerades
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_RESULT: ${{ needs.provenance-publish.result }}
          REPLAY_RESULT: ${{ needs.provenance-replay-check.result }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            [ "$PUSH_RESULT" = success ] && [ "$REPLAY_RESULT" = skipped ]
          else
            [ "$PUSH_RESULT" = skipped ] && [ "$REPLAY_RESULT" = success ]
          fi

  bump-formula:
    name: bump homebrew tap
    needs: finalize
    if: ${{ !contains(needs.finalize.outputs.version, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.finalize.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: scripts/release
          sparse-checkout-cone-mode: false
      - name: Refuse an old stable release before touching the tap
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.finalize.outputs.release-id }}
          RELEASE_SHA: ${{ needs.finalize.outputs.sha }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.finalize.outputs.tag }}
        run: |
          set -euo pipefail
          bash .release-tooling/scripts/release/assert-newest-public-stable.sh \
            "$REPO" "$RELEASE_ID" "$TAG" "$RELEASE_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tap repo is homebrew-tap — the canonical brew mapping for
          # `brew install supernovae-st/tap/nika` (renamed back 2026-07-06;
          # the homebrew-nika interlude survives as a GitHub redirect).
          repository: supernovae-st/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap
      - name: Update + push the formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.finalize.outputs.release-id }}
          RELEASE_SHA: ${{ needs.finalize.outputs.sha }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.finalize.outputs.tag }}
          VERSION: ${{ needs.finalize.outputs.version }}
        run: |
          set -euo pipefail
          bash .release-tooling/scripts/release/update-formula.sh tap/Formula/nika.rb "$VERSION" artifacts
          cd tap
          git config user.name "nika-release[bot]"
          git config user.email "nika@supernovae.studio"
          # Stage ONLY the formula (no `-a` blanket-stage) + guard a re-dispatch
          # for an already-bumped version (`git commit` exits non-zero on a
          # clean tree, which `set -e` would turn into a job failure for a no-op).
          git add Formula/nika.rb
          if git diff --cached --quiet; then
            echo "::notice::formula already at ${VERSION} — nothing to bump"
          else
            bash ../.release-tooling/scripts/release/assert-newest-public-stable.sh \
              "$REPO" "$RELEASE_ID" "$TAG" "$RELEASE_SHA"
            git commit -m "nika ${VERSION}"
            git push
          fi

  npm-wasm-pack:
    # The browser half of `nika check` rides the same tag as the binaries —
    # one tree, one version, two artifact families. This is the COMPILING
    # half of the npm train and it deliberately holds nothing: the house
    # invariant across this file is compile at contents:read, elevate only
    # where nothing compiles (build → release), and `cargo install` +
    # build scripts are exactly the third-party code that must never see
    # an OIDC token or a writable GITHUB_TOKEN. package.json is projected
    # from cargo metadata at pack time, and an untagged tree can only
    # produce a -dev prerelease (npm-pack.sh · the lineage-lie guard).
    # Plan: docs/plans/2026-07-28-check-wasm-npm-distribution.md
    name: npm pack (nika-check-wasm)
    needs: release-draft
    runs-on: ubuntu-24.04
    permissions:
      contents: read # this job compiles third-party code — lowest privilege
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-draft.outputs.sha }}
          # no token persisted into .git/config while build.rs code runs
          persist-credentials: false
      - name: Checkout nika-spec (Leg A differential corpus · judged at SPEC_PIN)
        # npm-pack.sh runs the crate's full test suite, whose Leg A
        # differential is NOT env-gated — without a spec checkout it panics
        # on this runner (same idiom as diamond-ci's tests + wasm legs).
        run: |
          set -euo pipefail
          pin="$(grep -v '^#' SPEC_PIN | head -1 | tr -d '[:space:]')"
          # the corpus must stay content-addressed — a branch name here
          # would make the judged input float
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::SPEC_PIN is not a commit sha"
            exit 1
          }
          git clone --filter=blob:none https://github.com/supernovae-st/nika-spec "$GITHUB_WORKSPACE/nika-spec"
          git -C "$GITHUB_WORKSPACE/nika-spec" checkout --detach "$pin"
      - name: Install the wasm toolchain (binder at the lock's version · pinned binaryen)
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          # the binder follows Cargo.lock — npm-pack.sh refuses a mismatch,
          # so this install reads the version FROM the lock (one source).
          # cargo install over a prebuilt fetch: slower, but a release train
          # pays minutes for certainty (three first-exercise failures in
          # this file's history argue the point).
          v="$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')"
          cargo install wasm-bindgen-cli@"$v" --locked
          # binaryen pinned by sha, unpacked OUTSIDE the checkout — a PATH
          # entry rooted in repo content would let any tree carrying
          # binaryen-version_131/bin/<name> shadow system tools. -f matters:
          # without it an HTTP error body lands in the file and surfaces as
          # a confusing checksum mismatch instead of a named failure.
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/binaryen.tar.gz" https://github.com/WebAssembly/binaryen/releases/download/version_131/binaryen-version_131-x86_64-linux.tar.gz
          echo "b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_131/bin" >> "$GITHUB_PATH"
      - name: Fetch the release tag (first-exercise find №4 — the version assert caught it)
        # the sha checkout above is the supply-chain fix (immutable ref) but
        # it carries ZERO tags — npm-pack.sh's honesty gate then reads the
        # tree as untagged and packs a -dev prerelease, and the version
        # assert below refuses it (proven on v0.106.1's first run: packed
        # 0.106.1-dev.g… ≠ released 0.106.1). One tag, fetched explicitly.
        env:
          TAG: ${{ needs.release-draft.outputs.tag }}
        run: git fetch origin tag "$TAG" --no-tags
      - name: Pack (tests · wasm-release build · bindgen · wasm-opt · projected manifest)
        env:
          NIKA_SPEC_DIR: ${{ github.workspace }}/nika-spec
        run: bash crates/nika-check-wasm/npm-pack.sh
      - name: The packed version IS the released version
        # asserted BEFORE anything leaves this job — npm versions are
        # immutable and release assets are public, so a wrong version must
        # die here, not after an upload. Equality subsumes the -dev case
        # (a suffixed version can never equal the tag's).
        env:
          VERSION: ${{ needs.release-draft.outputs.version }}
        run: |
          set -euo pipefail
          packed="$(python3 -c 'import json;print(json.load(open("crates/nika-check-wasm/dist-npm/package.json"))["version"])')"
          [ "$packed" = "$VERSION" ] || {
            echo "::error::packed ${packed} ≠ released ${VERSION}"
            exit 1
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: |
            crates/nika-check-wasm/dist-npm/*.tgz
            crates/nika-check-wasm/dist-npm/*.tgz.sha256
          if-no-files-found: error

  npm-wasm-publish:
    # The ELEVATED half — runs zero third-party code: download, gh, npm on
    # a pinned toolchain, plus the one first-party immutable-upload helper
    # checked out sparsely at the exact workflow SHA. The tarball is attested
    # on tag push and its exact SRI is proven before the finalizer can expose
    # the draft.
    name: npm publish (nika-check-wasm)
    needs: [release-draft, npm-wasm-pack]
    runs-on: ubuntu-24.04
    permissions:
      contents: read # sparse checkout only; release assets belong to finalizer
      id-token: write # npm --provenance (Sigstore OIDC) + build attestation
      attestations: write # publish the tarball's build-provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: |
            scripts/release/check-release-tag.sh
            scripts/release/npm-publish-immutable.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # node 24 bundles npm ≥ 11.5.1 — npm is the component that
          # GENERATES the provenance attestation, and the runner default
          # (npm 10) is both unpinned and too old for the OIDC follow-up.
          # setup-node also writes the .npmrc as an env REFERENCE, so the
          # token never touches the filesystem in cleartext.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Attest build provenance (the npm tarball · verifiable via `gh attestation verify`)
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '*.tgz'
      - name: Converge npm by exact sha512 SRI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.release-draft.outputs.version }}
        run: |
          set -euo pipefail
          tarballs=(./*.tgz)
          sidecars=(./*.tgz.sha256)
          [ "${#tarballs[@]}" -eq 1 ] && [ "${#sidecars[@]}" -eq 1 ] \
            && [ -f "${tarballs[0]}" ] && [ -f "${sidecars[0]}" ] || {
              echo "::error::expected exactly one npm tarball and sidecar"
              exit 73
            }
          bash .release-tooling/scripts/release/npm-publish-immutable.sh \
            publish "@supernovae-st/nika-check-wasm@${VERSION}" \
            "${tarballs[0]}" "${sidecars[0]}"

  docker:
    # The official multi-arch image (#442) — one image unblocks Dokploy /
    # Coolify / Railway templates + the Docker MCP Registry. Fed from the
    # SAME linux tarball artifacts the release ships (never a rebuild), so
    # the image binary is bit-identical to the published tarballs the funnel
    # e2e + trust battery already gated. The digest may become public while the
    # GitHub release remains draft; only the version coordinate is immutable,
    # and `latest` remains behind the finalizer.
    # SECURITY: the only run: step reads VERSION through env: (tag-derived,
    # cf the header contract) — no event text reaches a shell.
    name: build ghcr digest
    needs: release-draft
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout the Dockerfile
      packages: write # push to ghcr.io — scoped to THIS job only
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: scripts/release
          sparse-checkout-cone-mode: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Reuse only a durable marker, otherwise require a digest build
        id: coordinate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release-draft.outputs.release-id }}
          RELEASE_SHA: ${{ needs.release-draft.outputs.sha }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-draft.outputs.tag }}
        run: |
          set -euo pipefail
          state=0
          digest="$(bash .release-tooling/scripts/release/release-digest-marker.sh \
            read "$REPO" "$RELEASE_ID" "$TAG" "$RELEASE_SHA")" || state=$?
          if [ "$state" -eq 0 ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$state" -eq 44 ] || exit "$state"
          # An occupied image:version without this marker is not authority.
          # Build from the release tarballs and bind the resulting digest.
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "digest=" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.coordinate.outputs.build == 'true'
        with:
          ref: ${{ needs.release-draft.outputs.sha }}
          path: .release-source
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Stage per-arch binaries into the build context
        if: steps.coordinate.outputs.build == 'true'
        # Docker arch names (amd64 · arm64) ≠ release tarball arch names
        # (x64 · arm64) — the mapping happens HERE, once; the Dockerfile
        # just COPYs dist/linux/${TARGETARCH}/nika.
        env:
          VERSION: ${{ needs.release-draft.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p .release-source/dist/linux/amd64 .release-source/dist/linux/arm64
          tar -xzf "artifacts/nika-linux-x64-${VERSION}.tar.gz" -C .release-source/dist/linux/amd64 nika
          tar -xzf "artifacts/nika-linux-arm64-${VERSION}.tar.gz" -C .release-source/dist/linux/arm64 nika
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Build + push by digest (linux/amd64 · linux/arm64)
        id: image
        if: steps.coordinate.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .release-source
          platforms: linux/amd64,linux/arm64
          push: true
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=Nika
            org.opencontainers.image.description=Sovereign AI workflow runtime
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release-draft.outputs.sha }}
            org.opencontainers.image.version=${{ needs.release-draft.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - name: Select and prove the exact digest payload
        id: digest
        env:
          CANDIDATE: ${{ steps.image.outputs.digest }}
          MARKER_DIGEST: ${{ steps.coordinate.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_SHA: ${{ needs.release-draft.outputs.sha }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.release-draft.outputs.version }}
        run: |
          set -euo pipefail
          candidate="${CANDIDATE:-$MARKER_DIGEST}"
          digest="$(bash .release-tooling/scripts/release/oci-coordinate-immutable.sh \
            inspect "$IMAGE" "$VERSION" "$candidate" "$RELEASE_SHA" \
            "https://github.com/${REPO}")"
          bash .release-tooling/scripts/release/verify-oci-payload.sh \
            "$IMAGE" "$digest" "$VERSION" artifacts
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  oci-proof:
    # All pre-marker Docker actions run with read-only contents/packages.
    # No third-party Docker action receives release-body write authority.
    name: prove ghcr digest payload
    needs: [release-draft, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.proof.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: scripts/release
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prove the digest identity and payload bytes
        id: proof
        env:
          DIGEST: ${{ needs.docker.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_SHA: ${{ needs.release-draft.outputs.sha }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.release-draft.outputs.version }}
        run: |
          set -euo pipefail
          bash .release-tooling/scripts/release/oci-coordinate-immutable.sh \
            inspect "$IMAGE" "$VERSION" "$DIGEST" "$RELEASE_SHA" \
            "https://github.com/${REPO}" >/dev/null
          bash .release-tooling/scripts/release/verify-oci-payload.sh \
            "$IMAGE" "$DIGEST" "$VERSION" artifacts
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  oci-marker:
    # This job stages only the already-proven digest. It has no package
    # permission, Docker action, registry login, or image execution surface.
    name: persist ghcr digest marker
    needs: [release-draft, oci-proof]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      digest: ${{ steps.persist.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: scripts/release
          sparse-checkout-cone-mode: false
      - name: Re-read release identity and persist only the proven digest
        id: persist
        env:
          DIGEST: ${{ needs.oci-proof.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release-draft.outputs.release-id }}
          RELEASE_SHA: ${{ needs.release-draft.outputs.sha }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-draft.outputs.tag }}
        run: |
          set -euo pipefail
          bash .release-tooling/scripts/release/read-release-state.sh \
            "$REPO" "$RELEASE_ID" "$TAG" "$RELEASE_SHA" >/dev/null
          persisted="$(bash .release-tooling/scripts/release/release-digest-marker.sh \
            stage "$REPO" "$RELEASE_ID" "$TAG" "$RELEASE_SHA" "$DIGEST")"
          [ "$persisted" = "$DIGEST" ]
          echo "digest=$persisted" >> "$GITHUB_OUTPUT"

  oci-version:
    # The immutable version coordinate is allowed to converge only after the
    # release-body marker is durable. A missing image:version is healed from
    # that exact image@digest; a divergent occupied version is refused.
    name: converge ghcr immutable version
    needs: [release-draft, oci-marker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.converge.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: scripts/release
          sparse-checkout-cone-mode: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Converge from the durable marker
        id: converge
        env:
          DIGEST: ${{ needs.oci-marker.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_SHA: ${{ needs.release-draft.outputs.sha }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.release-draft.outputs.version }}
        run: |
          set -euo pipefail
          digest="$(bash .release-tooling/scripts/release/oci-coordinate-immutable.sh \
            publish "$IMAGE" "$VERSION" "$DIGEST" "$RELEASE_SHA" \
            "https://github.com/${REPO}")"
          [ "$digest" = "$DIGEST" ]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  release-assets-converge:
    # This job is the only full-asset release writer. It runs first-party
    # workflow-SHA tooling only: no provenance, npm, Docker, package token, or
    # deploy key shares its contents-write authority.
    name: converge exact github release assets
    needs: [release-draft, provenance-result, npm-wasm-pack]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: scripts/release
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nika-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-native-manifest
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-provenance
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: artifacts
      - name: Stage and verify exactly eight immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release-draft.outputs.release-id }}
          RELEASE_SHA: ${{ needs.release-draft.outputs.sha }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-draft.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          assets=(
            "artifacts/nika-macos-arm64-${version}.tar.gz"
            "artifacts/nika-macos-x64-${version}.tar.gz"
            "artifacts/nika-linux-arm64-${version}.tar.gz"
            "artifacts/nika-linux-x64-${version}.tar.gz"
            artifacts/SHA256SUMS
            artifacts/multiple.intoto.jsonl
            "artifacts/supernovae-st-nika-check-wasm-${version}.tgz"
            "artifacts/supernovae-st-nika-check-wasm-${version}.tgz.sha256"
          )
          bash .release-tooling/scripts/release/release-assets-barrier.sh \
            stage "$REPO" "$RELEASE_ID" "$TAG" "$RELEASE_SHA" "${assets[@]}"
          bash .release-tooling/scripts/release/release-assets-barrier.sh \
            verify "$REPO" "$RELEASE_ID" "$TAG" "$RELEASE_SHA" "${assets[@]}"

  release-final-proof:
    # Every untrusted or registry-facing verifier runs with read authority
    # only. Its digest output is the immutable-registry fact trusted by the
    # final contents writer.
    name: prove complete release without write authority
    needs:
      - release-draft
      - release-assets-converge
      - native-attest
      - provenance-result
      - npm-wasm-pack
      - npm-wasm-publish
      - oci-version
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.proof.outputs.digest }}
    steps:
      - name: Refuse incomplete or skipped prerequisites
        env:
          ASSETS_RESULT: ${{ needs.release-assets-converge.result }}
          DRAFT_RESULT: ${{ needs.release-draft.result }}
          EVENT_NAME: ${{ github.event_name }}
          NATIVE_ATTEST_RESULT: ${{ needs.native-attest.result }}
          NPM_RESULT: ${{ needs.npm-wasm-publish.result }}
          OCI_RESULT: ${{ needs.oci-version.result }}
          PROVENANCE_RESULT: ${{ needs.provenance-result.result }}
          WASM_PACK_RESULT: ${{ needs.npm-wasm-pack.result }}
        run: |
          set -euo pipefail
          for result in \
            "$ASSETS_RESULT" "$DRAFT_RESULT" "$NPM_RESULT" "$OCI_RESULT" \
            "$PROVENANCE_RESULT" "$WASM_PACK_RESULT"; do
            [ "$result" = success ] || {
              echo "::error::release prerequisite result is ${result}, not success"
              exit 73
            }
          done
          if [ "$EVENT_NAME" = push ]; then
            [ "$NATIVE_ATTEST_RESULT" = success ]
          else
            [ "$NATIVE_ATTEST_RESULT" = skipped ]
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: scripts/release
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nika-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-native-manifest
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-provenance
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: artifacts
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prove checksums, provenance, npm, marker, and ghcr payload
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          PROVEN_DIGEST: ${{ needs.oci-version.outputs.digest }}
          RELEASE_ID: ${{ needs.release-draft.outputs.release-id }}
          RELEASE_SHA: ${{ needs.release-draft.outputs.sha }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-draft.outputs.tag }}
          VERSION: ${{ needs.release-draft.outputs.version }}
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/checksum-names"
          printf '%s\n' \
            "nika-linux-arm64-${VERSION}.tar.gz" \
            "nika-linux-x64-${VERSION}.tar.gz" \
            "nika-macos-arm64-${VERSION}.tar.gz" \
            "nika-macos-x64-${VERSION}.tar.gz" | LC_ALL=C sort > "$expected"
          awk '{ print $2 }' artifacts/SHA256SUMS | LC_ALL=C sort \
            | sed 's/^\*//' > "$RUNNER_TEMP/actual-checksum-names"
          cmp -s "$expected" "$RUNNER_TEMP/actual-checksum-names" || {
            echo "::error::SHA256SUMS does not name exactly the four native archives"
            exit 73
          }
          (cd artifacts && sha256sum -c SHA256SUMS)
          bash .release-tooling/scripts/release/verify-release-attestations.sh \
            "$TAG" "$RELEASE_SHA" "$REPO" artifacts
          native=(artifacts/nika-*.tar.gz)
          bash .release-tooling/scripts/release/verify-slsa-provenance.sh \
            "$TAG" "$REPO" artifacts/multiple.intoto.jsonl "${native[@]}"
          bash .release-tooling/scripts/release/npm-publish-immutable.sh verify \
            "@supernovae-st/nika-check-wasm@${VERSION}" \
            "artifacts/supernovae-st-nika-check-wasm-${VERSION}.tgz" \
            "artifacts/supernovae-st-nika-check-wasm-${VERSION}.tgz.sha256"
          persisted="$(bash .release-tooling/scripts/release/release-digest-marker.sh \
            read "$REPO" "$RELEASE_ID" "$TAG" "$RELEASE_SHA")"
          [ "$persisted" = "$PROVEN_DIGEST" ]
          digest="$(bash .release-tooling/scripts/release/oci-coordinate-immutable.sh \
            verify "$IMAGE" "$VERSION" "$persisted" "$RELEASE_SHA" \
            "https://github.com/${REPO}")"
          [ "$digest" = "$persisted" ]
          bash .release-tooling/scripts/release/verify-oci-payload.sh \
            "$IMAGE" "$digest" "$VERSION" artifacts
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  finalize:
    # The final writer invokes only first-party GitHub-state tooling. Immutable
    # registry/provenance facts arrive as the read-only proof job's digest.
    name: publish complete release
    needs: [release-draft, release-final-proof]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      discussions: write
    outputs:
      tag: ${{ needs.release-draft.outputs.tag }}
      version: ${{ needs.release-draft.outputs.version }}
      sha: ${{ needs.release-draft.outputs.sha }}
      release-id: ${{ needs.release-draft.outputs.release-id }}
      digest: ${{ needs.release-final-proof.outputs.digest }}
      transitioned: ${{ steps.publish.outputs.transitioned }}
    steps:
      - name: Refuse incomplete or skipped prerequisites
        env:
          DRAFT_RESULT: ${{ needs.release-draft.result }}
          PROOF_RESULT: ${{ needs.release-final-proof.result }}
        run: |
          set -euo pipefail
          for result in "$DRAFT_RESULT" "$PROOF_RESULT"; do
            [ "$result" = success ] || {
              echo "::error::release prerequisite result is ${result}, not success"
              exit 73
            }
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: scripts/release
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nika-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-native-manifest
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-provenance
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: artifacts
      - name: Resolve tap readiness without sharing the deploy key
        id: tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          ready=false
          if [ -n "${TAP_DEPLOY_KEY:-}" ]; then
            ready=true
          fi
          unset TAP_DEPLOY_KEY
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Recheck GitHub state and publish once
        id: publish
        env:
          ARTIFACTS: artifacts
          GH_TOKEN: ${{ github.token }}
          PROVEN_DIGEST: ${{ needs.release-final-proof.outputs.digest }}
          RELEASE_ID: ${{ needs.release-draft.outputs.release-id }}
          RELEASE_SHA: ${{ needs.release-draft.outputs.sha }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-draft.outputs.tag }}
          TAP_READY: ${{ steps.tap.outputs.ready }}
        run: |
          set -euo pipefail
          command -v gh sha256sum >/dev/null
          bash .release-tooling/scripts/release/finalize-release.sh \
            "$REPO" "$RELEASE_ID" "$TAG" "$RELEASE_SHA" "$PROVEN_DIGEST" \
            "$ARTIFACTS" "$TAP_READY" \
            >> "$GITHUB_OUTPUT"
      - name: Record already-public replay
        if: steps.publish.outputs.transitioned != 'true'
        run: echo "release visibility was already public; stable pointers will converge behind the newest-release guard" >> "$GITHUB_STEP_SUMMARY"

  move-latest:
    name: move ghcr latest after publication
    needs: finalize
    if: ${{ !contains(needs.finalize.outputs.version, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout: scripts/release
          sparse-checkout-cone-mode: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Move latest to the finalized immutable digest
        env:
          DIGEST: ${{ needs.finalize.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_ID: ${{ needs.finalize.outputs.release-id }}
          RELEASE_SHA: ${{ needs.finalize.outputs.sha }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.finalize.outputs.tag }}
          VERSION: ${{ needs.finalize.outputs.version }}
        run: |
          set -euo pipefail
          bash .release-tooling/scripts/release/assert-newest-public-stable.sh \
            "$REPO" "$RELEASE_ID" "$TAG" "$RELEASE_SHA"
          persisted="$(bash .release-tooling/scripts/release/release-digest-marker.sh \
            read "$REPO" "$RELEASE_ID" "$TAG" "$RELEASE_SHA")"
          [ "$persisted" = "$DIGEST" ]
          bash .release-tooling/scripts/release/oci-coordinate-immutable.sh \
            verify "$IMAGE" "$VERSION" "$DIGEST" "$RELEASE_SHA" \
            "https://github.com/${REPO}" >/dev/null
          bash .release-tooling/scripts/release/assert-newest-public-stable.sh \
            "$REPO" "$RELEASE_ID" "$TAG" "$RELEASE_SHA"
          bash .release-tooling/scripts/release/converge-oci-pointer.sh \
            "$IMAGE" latest "$DIGEST"
