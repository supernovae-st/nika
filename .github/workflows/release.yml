# Nika Release Workflow
# ==============================================================================
# Triggered on tag push (v*) or manual dispatch.
# Publishes to ALL distribution channels in parallel:
#
#   build (7 targets) → docker-publish → release (GitHub)
#                                           ├── update-homebrew
#                                           ├── vscode-publish (Marketplace + Open VSX)
#                                           ├── npm-publish (@supernovae-st/nika)
#                                           ├── crates-publish (13 crates in order)
#                                           └── sdk-client-publish → nika-client dispatch
#
# Secrets required: VSCE_PAT, NPM_TOKEN, CARGO_REGISTRY_TOKEN, HOMEBREW_TAP_TOKEN
# Optional: OVSX_PAT (Open VSX for VSCodium/Cursor)
# ==============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.49.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (build only, no release/publish)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Pre-flight: verify CI passed + version coherence
  # ─────────────────────────────────────────────────────────────────────────────
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify CI passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          echo "Release commit: ${COMMIT}"

          # Skip CI check for manual dispatch (operator takes responsibility)
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — skipping automated CI check"
            exit 0
          fi

          # Check if CI workflow succeeded on this commit
          STATUS=$(gh api "repos/${REPO}/commits/${COMMIT}/check-runs" \
            --jq '[.check_runs[] | select(.name | test("check|test|security"; "i")) | .conclusion] | unique | join(",")') || true

          if echo "$STATUS" | grep -q "failure"; then
            echo "::error::CI has failures on this commit. Fix before releasing."
            exit 1
          fi
          echo "CI status: ${STATUS:-no checks found}"

      - name: Verify version coherence
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${TAG#v}"
          CARGO_VERSION=$(grep '^version = ' tools/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Tag version: ${VERSION}"
          echo "Cargo version: ${CARGO_VERSION}"

          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag ${TAG} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi
          echo "Version coherence: OK"

      - name: Verify CHANGELOG has entry
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${TAG#v}"
          # Check both root and tools/nika CHANGELOG
          for f in "CHANGELOG.md" "tools/nika/CHANGELOG.md"; do
            if [ -f "$f" ] && grep -q "\[${VERSION}\]" "$f"; then
              echo "CHANGELOG entry found in $f for ${VERSION}"
              exit 0
            fi
          done
          echo "::warning::No CHANGELOG entry found for ${VERSION}"

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Release Binaries (7 targets)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # === Native targets (full features, for Homebrew/GitHub Releases) ===
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: nika-macos-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: nika-macos-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: nika-linux-arm64
            cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: nika-linux-x64
          # === Windows ===
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: nika-windows-x64
          # === Docker targets (musl static) ===
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: nika-linux-musl-x64
            docker: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: nika-linux-musl-arm64
            docker: true
            cross: true

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Use HEAD for dry-run, tag for real releases
          ref: ${{ inputs.dry_run && github.sha || env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (cross-compilation)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && !matrix.docker
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install musl tools
        if: matrix.docker && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'tools -> target'
          shared-key: release-${{ matrix.target }}

      # Build commands based on target type
      # Working directory is tools/nika (the binary crate), NOT tools/ (workspace root).
      # Building from the crate directory avoids compiling workspace-only members
      # Members not in the binary's dependency graph are excluded automatically.
      - name: Build (native, full features)
        if: "!matrix.cross && !matrix.docker"
        working-directory: tools/nika
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (native, musl static)
        if: "!matrix.cross && matrix.docker"
        working-directory: tools/nika
        run: cargo build --release --target ${{ matrix.target }} --no-default-features

      - name: Build (cross, full features)
        if: matrix.cross && !matrix.docker
        working-directory: tools/nika
        run: cross build --release --target ${{ matrix.target }} --no-default-features --features tui,serve,media-core,lsp

      - name: Build (cross, musl static)
        if: matrix.cross && matrix.docker
        working-directory: tools/nika
        run: cross build --release --target ${{ matrix.target }} --no-default-features

      - name: macOS code sign and notarize
        if: runner.os == 'macOS' && !inputs.dry_run
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET: ${{ matrix.target }}
        run: |
          # Import certificate into temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          trap "security delete-keychain '$KEYCHAIN_PATH'" EXIT
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Sign the binary
          BINARY_PATH="tools/target/${TARGET}/release/nika"
          codesign --sign "Developer ID Application: SuperNovae ($APPLE_TEAM_ID)" \
            --options runtime \
            --timestamp \
            "$BINARY_PATH"

          # Notarize
          zip -j $RUNNER_TEMP/nika-notarize.zip "$BINARY_PATH"
          xcrun notarytool submit $RUNNER_TEMP/nika-notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 10m

          echo "macOS binary signed and notarized successfully"

      - name: Extract version from tag
        id: version
        shell: bash
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Package (Unix)
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT: ${{ matrix.artifact }}
          TARGET: ${{ matrix.target }}
        run: |
          # Create archive directory
          mkdir -p "dist/${ARTIFACT}-${VERSION}"

          # Copy binary
          cp "tools/target/${TARGET}/release/nika" "dist/${ARTIFACT}-${VERSION}/"

          # Copy documentation
          cp README.md LICENSE CHANGELOG.md "dist/${ARTIFACT}-${VERSION}/" 2>/dev/null || true

          # Create tarball and checksum
          cd dist
          tar -czvf "${ARTIFACT}-${VERSION}.tar.gz" "${ARTIFACT}-${VERSION}"
          shasum -a 256 "${ARTIFACT}-${VERSION}.tar.gz" > "${ARTIFACT}-${VERSION}.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT: ${{ matrix.artifact }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force -Path "dist/$env:ARTIFACT-$env:VERSION"
          Copy-Item "tools/target/$env:TARGET/release/nika.exe" "dist/$env:ARTIFACT-$env:VERSION/"
          Copy-Item README.md, LICENSE, CHANGELOG.md "dist/$env:ARTIFACT-$env:VERSION/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist/$env:ARTIFACT-$env:VERSION" -DestinationPath "dist/$env:ARTIFACT-$env:VERSION.zip"
          $hash = (Get-FileHash "dist/$env:ARTIFACT-$env:VERSION.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ARTIFACT-$env:VERSION.zip" | Out-File -Encoding utf8 "dist/$env:ARTIFACT-$env:VERSION.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          retention-days: 7

      - name: Generate SLSA provenance attestation
        if: "!inputs.dry_run"
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish Docker Image (from pre-built musl binaries)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-publish:
    name: Publish Docker Image
    needs: build
    if: ${{ !inputs.dry_run && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Use HEAD for dry-run, tag for real releases
          ref: ${{ inputs.dry_run && github.sha || env.RELEASE_TAG }}

      - name: Download Linux amd64 artifact (musl static)
        uses: actions/download-artifact@v8
        with:
          name: nika-linux-musl-x64
          path: artifacts/amd64

      - name: Download Linux arm64 artifact (musl static)
        uses: actions/download-artifact@v8
        with:
          name: nika-linux-musl-arm64
          path: artifacts/arm64

      - name: Extract version
        id: version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Extract binaries for Docker
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p docker-context/amd64 docker-context/arm64

          # Extract binaries
          tar -xzf "artifacts/amd64/nika-linux-musl-x64-${VERSION}.tar.gz" -C docker-context/amd64 --strip-components=1
          tar -xzf "artifacts/arm64/nika-linux-musl-arm64-${VERSION}.tar.gz" -C docker-context/arm64 --strip-components=1

          chmod +x docker-context/*/nika

          # Verify static linking
          echo "=== Verifying binaries ==="
          file docker-context/amd64/nika
          ls -la docker-context/*/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/supernovae-st/nika
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/nika
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=true
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: docker-context
          file: tools/nika/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/supernovae-st/nika
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Create GitHub Release
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build, docker-publish]
    if: ${{ !inputs.dry_run && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      ai_telegram_msg: ${{ steps.ai_notes.outputs.telegram_msg }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Use HEAD for dry-run, tag for real releases
          ref: ${{ inputs.dry_run && github.sha || env.RELEASE_TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release-assets/ \;
          echo "=== Release assets ==="
          ls -la release-assets/

      - name: Extract version
        id: version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Generate AI release notes
        id: ai_notes
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "v0.0.0")
          COMMIT_COUNT=$(git log --oneline "${PREV_TAG}..HEAD" | wc -l | tr -d ' ')
          COMMIT_LOG=$(git log --oneline "${PREV_TAG}..HEAD" --pretty="- %s" | head -30)
          CRATE_COUNT=$(ls -d tools/nika-*/Cargo.toml tools/nika/Cargo.toml 2>/dev/null | wc -l | tr -d ' ')
          TEST_COUNT=$(grep -r "#\[test\]" tools/ --include="*.rs" 2>/dev/null | wc -l | tr -d ' ')

          # Extract CHANGELOG entry
          CHANGELOG_NOTES=""
          for f in "CHANGELOG.md" "tools/nika/CHANGELOG.md"; do
            if [ -f "$f" ]; then
              CHANGELOG_NOTES=$(awk -v ver="${VERSION}" '
                /^## \[/ { if (index($0, "[" ver "]")) { found=1; next } else if (found) { exit } }
                found { print }
              ' "$f" || true)
              [ -n "$CHANGELOG_NOTES" ] && break
            fi
          done

          # Extract nika binary from release tarball
          NIKA_BIN=""
          TARBALL=$(ls release-assets/nika-linux-x64-*.tar.gz 2>/dev/null | head -1)
          if [ -n "$TARBALL" ]; then
            mkdir -p /tmp/nika-extract
            tar -xzf "$TARBALL" -C /tmp/nika-extract --strip-components=1
            if [ -f "/tmp/nika-extract/nika" ]; then
              NIKA_BIN="/tmp/nika-extract/nika"
            fi
          fi

          if [ -n "$NIKA_BIN" ] && [ -n "$ANTHROPIC_API_KEY" ]; then
            chmod +x "$NIKA_BIN"
            echo "Using nika binary: $NIKA_BIN"

            # Gather diff stats for AI analysis
            DIFF_STAT=$(git diff --stat "${PREV_TAG}..HEAD" 2>/dev/null | tail -1 || echo "unknown")
            RELEASE_DATE=$(date +%Y-%m-%d)

            "$NIKA_BIN" run .github/release-notes.nika.yaml \
              --input version="$VERSION" \
              --input prev_tag="$PREV_TAG" \
              --input changelog="$CHANGELOG_NOTES" \
              --input commit_log="$COMMIT_LOG" \
              --input commit_count="$COMMIT_COUNT" \
              --input test_count="$TEST_COUNT" \
              --input tool_count="62" \
              --input transform_count="63" \
              --input provider_count="14" \
              --input crate_count="$CRATE_COUNT" \
              --input diff_stat="$DIFF_STAT" \
              --input date="$RELEASE_DATE" \
              -y --no-interactive 2>/dev/null || true

            if [ -f ".nika/artifacts/release-notes.md" ]; then
              cp .nika/artifacts/release-notes.md release-notes.md
              echo "ai_success=true" >> $GITHUB_OUTPUT
              echo "AI release notes generated successfully"
            fi

            if [ -f ".nika/artifacts/telegram-message.html" ]; then
              TELEGRAM_MSG=$(cat .nika/artifacts/telegram-message.html)
              DELIMITER=$(openssl rand -hex 8)
              echo "telegram_msg<<${DELIMITER}" >> $GITHUB_OUTPUT
              echo "$TELEGRAM_MSG" >> $GITHUB_OUTPUT
              echo "${DELIMITER}" >> $GITHUB_OUTPUT
            fi
          else
            echo "Skipping AI notes: nika_bin=${NIKA_BIN:-not found}, api_key=${ANTHROPIC_API_KEY:+set}"
          fi

      - name: Generate release notes (fallback)
        if: steps.ai_notes.outputs.ai_success != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "v0.0.0")

          # Stats
          CRATE_COUNT=$(ls -d tools/nika-*/Cargo.toml tools/nika/Cargo.toml 2>/dev/null | wc -l | tr -d ' ')
          TEST_COUNT=$(grep -r "#\[test\]" tools/ --include="*.rs" 2>/dev/null | wc -l | tr -d ' ')
          NPM_COUNT=$(ls -d packages/*/package.json 2>/dev/null | wc -l | tr -d ' ')

          # What's Changed: prefer CHANGELOG, fallback to git log
          CHANGELOG_NOTES=""
          for f in "CHANGELOG.md" "tools/nika/CHANGELOG.md"; do
            if [ -f "$f" ]; then
              CHANGELOG_NOTES=$(awk -v ver="${VERSION}" '
                /^## \[/ { if (index($0, "[" ver "]")) { found=1; next } else if (found) { exit } }
                found { print }
              ' "$f" || true)
              [ -n "$CHANGELOG_NOTES" ] && break
            fi
          done
          if [ -z "$CHANGELOG_NOTES" ]; then
            CHANGELOG_NOTES=$(git log --oneline "${PREV_TAG}..HEAD" --pretty="- %s" 2>/dev/null | head -20 || echo "- Initial release")
          fi

          # Binary sizes from release-assets
          SIZE_ARM64=$(ls -lh release-assets/nika-macos-arm64-*.tar.gz 2>/dev/null | awk '{print $5}' | head -1 || echo "—")
          SIZE_X64=$(ls -lh release-assets/nika-macos-x64-*.tar.gz 2>/dev/null | awk '{print $5}' | head -1 || echo "—")
          SIZE_LINUX_X64=$(ls -lh release-assets/nika-linux-x64-*.tar.gz 2>/dev/null | awk '{print $5}' | head -1 || echo "—")
          SIZE_LINUX_ARM64=$(ls -lh release-assets/nika-linux-arm64-*.tar.gz 2>/dev/null | awk '{print $5}' | head -1 || echo "—")
          SIZE_WIN=$(ls -lh release-assets/nika-windows-x64-*.zip 2>/dev/null | awk '{print $5}' | head -1 || echo "—")

          # Write release notes (no ASCII art headers)
          {
            echo "## 🦋 Nika v${VERSION}"
            echo ""
            echo "> Semantic YAML Workflow Engine for AI — Schema \`nika/workflow@0.12\`"
            echo ""
            echo "### What's Changed"
            echo ""
            echo "${CHANGELOG_NOTES}"
            echo ""
            echo "### 📦 Install"
            echo ""
            echo "| | Method | Command |"
            echo "|---|--------|---------|"
            echo "| 🚀 | **Quick** | \`curl -fsSL https://raw.githubusercontent.com/supernovae-st/nika/main/install.sh \| sh\` |"
            echo "| 🍺 | **Homebrew** | \`brew install supernovae-st/tap/nika\` |"
            echo "| 📦 | **npm** | \`npx @supernovae-st/nika\` |"
            echo "| 🦀 | **Cargo** | \`cargo install nika\` |"
            echo "| 🐳 | **Docker** | \`docker run --rm ghcr.io/supernovae-st/nika:${VERSION}\` |"
            echo "| 💻 | **VS Code** | Search \"Nika\" or \`ext install supernovae.nika-lang\` |"
            echo "| 🪟 | **Scoop** | \`scoop bucket add nika https://github.com/supernovae-st/scoop-nika && scoop install nika\` |"
            echo "| 🐧 | **AUR** | \`yay -S nika-bin\` |"
            echo ""
            echo "### 📥 Downloads"
            echo ""
            echo "| Platform | Architecture | File | Size |"
            echo "|----------|-------------|------|------|"
            echo "| 🍎 macOS | Apple Silicon | \`nika-macos-arm64-${VERSION}.tar.gz\` | ${SIZE_ARM64} |"
            echo "| 🍎 macOS | Intel | \`nika-macos-x64-${VERSION}.tar.gz\` | ${SIZE_X64} |"
            echo "| 🐧 Linux | x64 | \`nika-linux-x64-${VERSION}.tar.gz\` | ${SIZE_LINUX_X64} |"
            echo "| 🐧 Linux | ARM64 | \`nika-linux-arm64-${VERSION}.tar.gz\` | ${SIZE_LINUX_ARM64} |"
            echo "| 🪟 Windows | x64 | \`nika-windows-x64-${VERSION}.zip\` | ${SIZE_WIN} |"
            echo ""
            echo "> 🔐 All binaries include SHA256 checksums, SLSA provenance, and macOS notarization."
            echo ""
            echo "### 🌐 Available On"
            echo ""
            echo "| Platform | Link |"
            echo "|----------|------|"
            echo "| GitHub | [v${VERSION}](https://github.com/supernovae-st/nika/releases/tag/v${VERSION}) |"
            echo "| VS Code | [supernovae.nika-lang](https://marketplace.visualstudio.com/items?itemName=supernovae.nika-lang) |"
            echo "| Open VSX | [supernovae.nika-lang](https://open-vsx.org/extension/supernovae/nika-lang) |"
            echo "| npm | [@supernovae-st/nika](https://www.npmjs.com/package/@supernovae-st/nika) |"
            echo "| crates.io | [nika](https://crates.io/crates/nika) |"
            echo "| Docker | [ghcr.io](https://github.com/supernovae-st/nika/pkgs/container/nika) · [Docker Hub](https://hub.docker.com/r/thibautmelen/nika) |"
            echo "| Homebrew | \`supernovae-st/tap/nika\` |"
            echo "| Scoop | [supernovae-st/scoop-nika](https://github.com/supernovae-st/scoop-nika) |"
            echo "| AUR | [nika-bin](https://aur.archlinux.org/packages/nika-bin) |"
            echo ""
            echo "### 📊 Stats"
            echo ""
            echo "| | Metric | Value |"
            echo "|---|--------|-------|"
            echo "| 🦀 | Crates | ${CRATE_COUNT} workspace crates |"
            echo "| 🧪 | Tests | ${TEST_COUNT}+ passing |"
            echo "| 📦 | npm | ${NPM_COUNT} platform packages |"
            echo "| 🔐 | macOS | Signed + Notarized (Developer ID) |"
            echo "| 🛡️ | SLSA | Build provenance attested |"
            echo "| 🐳 | Docker | Multi-arch amd64/arm64 + SBOM |"
            echo ""
            echo "---"
            echo ""
            echo "Made with 💜 by [SuperNovae Studio](https://supernovae.studio) — Open Source, AGPL-3.0"
            echo ""
            echo "**Full Changelog**: https://github.com/supernovae-st/nika/compare/${PREV_TAG}...v${VERSION}"
          } > release-notes.md

      - name: Determine pre-release
        id: prerelease
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Only mark as pre-release for alpha/beta/rc/dev suffixes
          # NOTE: Nika is intentionally 0.x.x forever (see Version Lock)
          if echo "$VERSION" | grep -qE "(alpha|beta|rc|dev)"; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect codename from AI release notes
        id: codename
        if: steps.ai_notes.outputs.ai_success == 'true'
        run: |
          # Extract codename from first heading: "## 🦋 Nika v0.65.1 — Codename Here"
          CODENAME=$(head -5 release-notes.md | grep -oP '(?<=— ).*' | head -1 | sed 's/ *$//')
          if [ -n "$CODENAME" ]; then
            echo "value=${CODENAME}" >> $GITHUB_OUTPUT
            echo "Detected codename: ${CODENAME}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "🦋 Nika ${{ steps.version.outputs.version }}${{ steps.codename.outputs.value && format(' — {0}', steps.codename.outputs.value) || '' }}"
          body_path: release-notes.md
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Update Homebrew Formula (multi-arch: macOS arm64/x64 + Linux x64/arm64)
  # ─────────────────────────────────────────────────────────────────────────────
  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    if: ${{ !inputs.dry_run && !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      HAS_HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - name: Extract version
        id: version
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ] || ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Invalid version '$VERSION' from RELEASE_TAG='$RELEASE_TAG'"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Skip if no token
        if: env.HAS_HOMEBREW_TOKEN != 'true'
        run: echo "::warning::HOMEBREW_TAP_TOKEN not set — Homebrew formula update SKIPPED"

      - name: Download SHA256 checksums
        if: env.HAS_HOMEBREW_TOKEN == 'true'
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sha256

          for artifact in nika-macos-arm64 nika-macos-x64 nika-linux-arm64 nika-linux-x64; do
            gh release download "$TAG" \
              --repo "$REPO" \
              --pattern "${artifact}-${VERSION}.tar.gz.sha256" \
              --dir /tmp/sha256
          done

          echo "macos_arm64=$(awk '{print $1}' /tmp/sha256/nika-macos-arm64-${VERSION}.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "macos_x64=$(awk '{print $1}' /tmp/sha256/nika-macos-x64-${VERSION}.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "linux_arm64=$(awk '{print $1}' /tmp/sha256/nika-linux-arm64-${VERSION}.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "linux_x64=$(awk '{print $1}' /tmp/sha256/nika-linux-x64-${VERSION}.tar.gz.sha256)" >> $GITHUB_OUTPUT

      - name: Generate and push formula
        if: env.HAS_HOMEBREW_TOKEN == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_MACOS_ARM64: ${{ steps.sha.outputs.macos_arm64 }}
          SHA_MACOS_X64: ${{ steps.sha.outputs.macos_x64 }}
          SHA_LINUX_ARM64: ${{ steps.sha.outputs.linux_arm64 }}
          SHA_LINUX_X64: ${{ steps.sha.outputs.linux_x64 }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/supernovae-st/homebrew-tap.git" /tmp/tap
          cd /tmp/tap

          cat > Formula/nika.rb << 'FORMULA'
          # Formula/nika.rb — Pre-built binaries, multi-arch (macOS + Linux)
          # Updated automatically by CI on each release (release.yml → update-homebrew)
          class Nika < Formula
            desc "Semantic YAML workflow engine for AI — 5 verbs, 9 providers, LSP"
            homepage "https://github.com/supernovae-st/nika"
            version "VERSION_PLACEHOLDER"
            license "AGPL-3.0-or-later"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/supernovae-st/nika/releases/download/v#{version}/nika-macos-arm64-#{version}.tar.gz"
                sha256 "SHA_MACOS_ARM64_PLACEHOLDER"
              else
                url "https://github.com/supernovae-st/nika/releases/download/v#{version}/nika-macos-x64-#{version}.tar.gz"
                sha256 "SHA_MACOS_X64_PLACEHOLDER"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/supernovae-st/nika/releases/download/v#{version}/nika-linux-arm64-#{version}.tar.gz"
                sha256 "SHA_LINUX_ARM64_PLACEHOLDER"
              else
                url "https://github.com/supernovae-st/nika/releases/download/v#{version}/nika-linux-x64-#{version}.tar.gz"
                sha256 "SHA_LINUX_X64_PLACEHOLDER"
              end
            end

            def install
              bin.install "nika"
            end

            def post_install
              return unless OS.mac? || OS.linux?
              Timeout.timeout(15) do
                system bin/"nika", "--quiet", "daemon", "start"
              end
            rescue Timeout::Error, StandardError
              # Silently ignore — daemon starts on first use
            end

            test do
              assert_match "nika #{version}", shell_output("#{bin}/nika --version")

              (testpath/"test.nika.yaml").write <<~YAML
                schema: "nika/workflow@0.12"
                description: "Homebrew test"
                tasks:
                  - id: hello
                    exec: "echo hello"
              YAML
              assert_match "DAG", shell_output("#{bin}/nika check #{testpath}/test.nika.yaml")
            end
          end
          FORMULA

          # Strip heredoc indentation
          sed -i 's/^          //' Formula/nika.rb

          # Replace placeholders with actual values
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/" Formula/nika.rb
          sed -i "s/SHA_MACOS_ARM64_PLACEHOLDER/${SHA_MACOS_ARM64}/" Formula/nika.rb
          sed -i "s/SHA_MACOS_X64_PLACEHOLDER/${SHA_MACOS_X64}/" Formula/nika.rb
          sed -i "s/SHA_LINUX_ARM64_PLACEHOLDER/${SHA_LINUX_ARM64}/" Formula/nika.rb
          sed -i "s/SHA_LINUX_X64_PLACEHOLDER/${SHA_LINUX_X64}/" Formula/nika.rb

          echo "=== Generated formula ==="
          cat Formula/nika.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/nika.rb
          git diff --cached --quiet && { echo "No changes to formula"; exit 0; }
          git commit -m "nika ${VERSION}"
          git push

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish VS Code Extension
  # ─────────────────────────────────────────────────────────────────────────────
  vscode-publish:
    name: Publish VS Code Extension
    needs: release
    if: ${{ !inputs.dry_run && !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
    defaults:
      run:
        working-directory: editors/vscode

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Sync version from tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version

      - name: Compile TypeScript
        run: npm run compile

      - name: Package VSIX
        run: npx vsce package --no-git-tag-version

      - name: Upload VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          gh release upload "$TAG" \
            "nika-lang-${VERSION}.vsix" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Publish to VS Code Marketplace
        if: env.HAS_VSCE_PAT == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --no-git-tag-version -p "$VSCE_PAT"
        continue-on-error: true

      - name: Warn if VS Code Marketplace PAT is missing
        if: env.HAS_VSCE_PAT != 'true'
        run: echo "::warning::VSCE_PAT secret is missing — VS Code Marketplace publish was SKIPPED. Extension will NOT be updated for users."

      - name: Publish to Open VSX (VSCodium/Cursor/Gitpod)
        if: env.HAS_OVSX_PAT == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish --no-git-tag-version -p "$OVSX_PAT"
        continue-on-error: true

      - name: Warn if Open VSX PAT is missing
        if: env.HAS_OVSX_PAT != 'true'
        run: echo "::warning::OVSX_PAT secret is missing — Open VSX publish was SKIPPED (Cursor/VSCodium users won't get the update)."

      - name: Verify extension version on Marketplace
        if: env.HAS_VSCE_PAT == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Waiting for marketplace propagation..."
          sleep 10
          PUBLISHED=$(npx vsce show supernovae.nika-lang --json 2>/dev/null | node -e "
            let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>{
              try { console.log(JSON.parse(d).versions[0].version); } catch { console.log('unknown'); }
            })
          " 2>/dev/null || echo "unknown")
          echo "Published version: ${PUBLISHED} (expected: ${VERSION})"
          if [ "${PUBLISHED}" = "${VERSION}" ]; then
            echo "Extension v${VERSION} confirmed on Marketplace"
          else
            echo "::warning::Extension may not have propagated yet (found: ${PUBLISHED}, expected: ${VERSION}). Check manually."
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish npm Packages (platform binaries + main wrapper)
  # ─────────────────────────────────────────────────────────────────────────────
  npm-publish:
    name: Publish npm Packages
    needs: release
    if: ${{ !inputs.dry_run && !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Prepare and publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # Map: artifact-name → npm-package-dir → binary-name
          declare -A PLATFORMS=(
            ["nika-macos-arm64"]="packages/nika-darwin-arm64:nika"
            ["nika-macos-x64"]="packages/nika-darwin-x64:nika"
            ["nika-linux-x64"]="packages/nika-linux-x64:nika"
            ["nika-linux-arm64"]="packages/nika-linux-arm64:nika"
            ["nika-windows-x64"]="packages/nika-win32-x64:nika.exe"
          )

          for artifact in "${!PLATFORMS[@]}"; do
            IFS=':' read -r pkg_dir binary_name <<< "${PLATFORMS[$artifact]}"
            echo "=== Publishing ${pkg_dir} ==="

            # Extract binary from tarball/zip
            if [[ "$artifact" == *"windows"* ]]; then
              # Windows: zip archive
              unzip -o "artifacts/${artifact}/${artifact}-${VERSION}.zip" -d /tmp/extract
              cp "/tmp/extract/${artifact}-${VERSION}/nika.exe" "${pkg_dir}/${binary_name}"
            else
              # Unix: tarball
              tar -xzf "artifacts/${artifact}/${artifact}-${VERSION}.tar.gz" \
                --strip-components=1 -C /tmp/extract-unix 2>/dev/null || mkdir -p /tmp/extract-unix
              tar -xzf "artifacts/${artifact}/${artifact}-${VERSION}.tar.gz" -C /tmp/extract-unix --strip-components=1
              cp "/tmp/extract-unix/nika" "${pkg_dir}/${binary_name}"
              chmod +x "${pkg_dir}/${binary_name}"
            fi
            rm -rf /tmp/extract /tmp/extract-unix

            # Sync version
            cd "${pkg_dir}"
            npm version "$VERSION" --no-git-tag-version
            npm publish --access public || echo "  -> WARN: may already exist"
            cd ../..
          done

      - name: Publish main @supernovae-st/nika package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd packages/npm
          # Update version in package.json and optionalDependencies
          node -e "
            const v = process.env.VERSION;
            const pkg = require('./package.json');
            pkg.version = v;
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = v;
            }
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm publish --access public || echo "::warning::npm publish failed (may already exist)"

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish to crates.io (10 workspace crates in dependency order)
  # ─────────────────────────────────────────────────────────────────────────────
  crates-publish:
    name: Publish to crates.io
    needs: release
    if: ${{ !inputs.dry_run && !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          # Publish order: leaf dependencies first (13 crates)
          CRATES=(
            nika-core
            nika-event
            nika-lsp-core
            nika-mcp
            nika-media
            nika-init
            nika-engine
            nika-sdk
            nika-daemon
            nika-cli
            nika-tui
            nika-lsp
            nika
          )

          for crate in "${CRATES[@]}"; do
            echo "=== Publishing ${crate} ==="
            cd "tools/${crate}"
            cargo publish 2>&1 || echo "  -> WARN: ${crate} may already exist at this version (skipping)"
            echo "  -> Waiting 30s for index propagation..."
            sleep 30
            cd ../..
          done
          echo "=== All crates published ==="

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish @supernovae-st/nika-sdk (Node.js via napi-rs)
  # ─────────────────────────────────────────────────────────────────────────────
  sdk-npm-publish:
    name: Build Node.js SDK (${{ matrix.target }})
    needs: crates-publish
    if: ${{ !inputs.dry_run && !cancelled() && needs.crates-publish.result == 'success' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_zig: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Zig (for cross-compilation)
        if: matrix.use_zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install napi-rs CLI
        run: npm install -g @napi-rs/cli@3

      - name: Build native module
        working-directory: tools/nika-napi
        run: napi build --release --target ${{ matrix.target }} ${{ matrix.use_zig && '--zig' || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdk-npm-${{ matrix.target }}
          path: tools/nika-napi/*.node

  sdk-npm-collect:
    name: Collect and Publish SDK npm
    needs: sdk-npm-publish
    if: ${{ !cancelled() && needs.sdk-npm-publish.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all SDK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sdk-npm-*
          path: tools/nika-napi
          merge-multiple: true

      - name: Install napi-rs CLI
        run: npm install -g @napi-rs/cli@3

      - name: Sync version from release tag
        working-directory: tools/nika-napi
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version

      - name: Prepare and publish
        working-directory: tools/nika-napi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cp index.d.ts index.d.ts.handwritten
          napi create-npm-dirs
          napi artifacts
          napi prepublish --skip-gh-release
          cp index.d.ts.handwritten index.d.ts
          npm publish --access public

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish nika-sdk (Python via maturin)
  # ─────────────────────────────────────────────────────────────────────────────
  sdk-pypi-publish:
    name: Build Python SDK (${{ matrix.os }}-${{ matrix.target }})
    needs: crates-publish
    if: ${{ !inputs.dry_run && !cancelled() && needs.crates-publish.result == 'success' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            os: ubuntu-latest
          - target: aarch64
            os: ubuntu-latest
          - target: x86_64
            os: macos-latest
          - target: aarch64
            os: macos-latest
          - target: x64
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          working-directory: tools/nika-py

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: sdk-pypi-${{ matrix.os }}-${{ matrix.target }}
          path: tools/nika-py/dist

  sdk-pypi-collect:
    name: Collect and Publish SDK PyPI
    needs: sdk-pypi-publish
    if: ${{ !cancelled() && needs.sdk-pypi-publish.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          pattern: sdk-pypi-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*

  # ─────────────────────────────────────────────────────────────────────────────
  # Update Scoop Bucket (Windows)
  # ─────────────────────────────────────────────────────────────────────────────
  update-scoop:
    name: Update Scoop Bucket
    needs: release
    if: ${{ !inputs.dry_run && !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      HAS_HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: nika-windows-x64
          path: artifacts

      - name: Extract version and hash
        id: info
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          HASH=$(cat artifacts/nika-windows-x64-${TAG#v}.zip.sha256 | awk '{print $1}')
          echo "hash=${HASH}" >> $GITHUB_OUTPUT

      - name: Update Scoop manifest
        if: env.HAS_HOMEBREW_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.info.outputs.version }}
          HASH: ${{ steps.info.outputs.hash }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          # Clone or create the scoop bucket repo
          if gh repo view supernovae-st/scoop-nika &>/dev/null; then
            gh repo clone supernovae-st/scoop-nika /tmp/scoop-nika
          else
            mkdir -p /tmp/scoop-nika/bucket
            cd /tmp/scoop-nika
            git init
            echo "# Scoop Bucket for Nika" > README.md
            gh repo create supernovae-st/scoop-nika --public --source=. --push
          fi

          # Generate manifest
          cat > /tmp/scoop-nika/bucket/nika.json << MANIFEST
          {
            "version": "${VERSION}",
            "description": "Semantic YAML workflow engine for AI tasks",
            "homepage": "https://github.com/supernovae-st/nika",
            "license": "AGPL-3.0-or-later",
            "architecture": {
              "64bit": {
                "url": "https://github.com/supernovae-st/nika/releases/download/${TAG}/nika-windows-x64-${VERSION}.zip",
                "hash": "${HASH}"
              }
            },
            "extract_dir": "nika-windows-x64-${VERSION}",
            "bin": "nika.exe",
            "checkver": {
              "github": "https://github.com/supernovae-st/nika"
            },
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/supernovae-st/nika/releases/download/v\$version/nika-windows-x64-\$version.zip"
                }
              }
            }
          }
          MANIFEST

          # Commit and push
          cd /tmp/scoop-nika
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update nika to ${VERSION}"
          git push
        continue-on-error: true

  # NOTE: Winget requires .exe/.msi installer, not .zip
  # TODO: Add winget-releaser once we have an NSIS/WiX installer

  # NOTE: Windows code signing via SignPath
  # TODO: Buy X.509 cert (~$210/yr SSL.com) when Windows users arrive
  # SignPath account: SuperNovae Studio, CSR created, SIGNPATH_API_TOKEN in secrets

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish to AUR (Arch Linux)
  # ─────────────────────────────────────────────────────────────────────────────
  update-aur:
    name: Publish to AUR
    needs: release
    if: ${{ !inputs.dry_run && !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Extract version and hash
        id: info
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          # Download and get hash of Linux x64 tarball
          URL="https://github.com/supernovae-st/nika/releases/download/${TAG}/nika-linux-x64-${VERSION}.tar.gz"
          SHA256=$(curl -sL "${URL}" | sha256sum | awk '{print $1}')
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT

      - name: Publish nika-bin to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: nika-bin
          pkgbuild: |
            # Maintainer: SuperNovae Studio <dev@supernovae.studio>
            pkgname=nika-bin
            pkgver=${{ steps.info.outputs.version }}
            pkgrel=1
            pkgdesc="Semantic YAML workflow engine for AI tasks"
            arch=('x86_64')
            url="https://github.com/supernovae-st/nika"
            license=('AGPL-3.0-or-later')
            provides=('nika')
            conflicts=('nika')
            source=("https://github.com/supernovae-st/nika/releases/download/v${pkgver}/nika-linux-x64-${pkgver}.tar.gz")
            sha256sums=('${{ steps.info.outputs.sha256 }}')

            package() {
              install -Dm755 "nika-linux-x64-${pkgver}/nika" "${pkgdir}/usr/bin/nika"
            }
          commit_username: supernovae-st
          commit_email: dev@supernovae.studio
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # SDK Client Publish (@supernovae-st/nika-client)
  # ─────────────────────────────────────────────────────────────────────────────
  # Triggers nika-client release workflow via repository_dispatch.
  # nika-client bumps its version to match, runs tests, and publishes to npm.
  sdk-client-publish:
    name: Publish nika-client SDK
    needs: [release]
    if: ${{ !inputs.dry_run && !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger nika-client release
        env:
          GH_TOKEN: ${{ secrets.NIKA_REPO_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${TAG#v}"
          echo "Triggering @supernovae-st/nika-client@$VERSION"
          gh api repos/supernovae-st/nika-client/dispatches \
            -f event_type=nika-release \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[nika_tag]=$TAG"
          echo "Dispatch sent — nika-client will auto-publish v$VERSION"

  # ─────────────────────────────────────────────────────────────────────────────
  # Post-publish Smoke Test
  # ─────────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Post-publish Smoke Test
    needs: [npm-publish, crates-publish, vscode-publish, sdk-client-publish]
    if: ${{ !inputs.dry_run && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for registry propagation
        run: sleep 60

      - name: Test npm package
        run: |
          npm info @supernovae-st/nika version 2>/dev/null && echo "✅ npm: package visible" || echo "⚠️ npm: not yet visible"
        continue-on-error: true

      - name: Test crates.io
        run: |
          curl -s "https://crates.io/api/v1/crates/nika" | grep -q '"newest_version"' && echo "✅ crates.io: visible" || echo "⚠️ crates.io: not yet visible"
        continue-on-error: true

      - name: Test VS Code Marketplace
        run: |
          curl -s "https://marketplace.visualstudio.com/items?itemName=supernovae.nika-lang" | grep -q "nika-lang" && echo "✅ VS Code: visible" || echo "⚠️ VS Code: not yet visible"
        continue-on-error: true

      - name: Test Docker image
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          docker manifest inspect "ghcr.io/supernovae-st/nika:${TAG}" && echo "✅ Docker: visible" || echo "⚠️ Docker: not yet visible"
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Release Notification (Telegram)
  # ─────────────────────────────────────────────────────────────────────────────
  notify:
    name: Release Notification
    needs:
      - release
      - docker-publish
      - update-homebrew
      - vscode-publish
      - npm-publish
      - crates-publish
      - update-scoop
      - update-aur
      - sdk-client-publish
      - smoke-test
    if: ${{ always() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    env:
      HAS_TELEGRAM: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}

    steps:
      - name: Checkout for stats
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Collect release stats
        id: stats
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "v0.0.0")
          echo "prev_tag=${PREV_TAG}" >> $GITHUB_OUTPUT

          CRATE_COUNT=$(ls -d tools/nika-*/Cargo.toml tools/nika/Cargo.toml 2>/dev/null | wc -l | tr -d ' ')
          echo "crate_count=${CRATE_COUNT}" >> $GITHUB_OUTPUT

          TEST_COUNT=$(grep -r "#\[test\]" tools/ --include="*.rs" 2>/dev/null | wc -l | tr -d ' ')
          echo "test_count=${TEST_COUNT}" >> $GITHUB_OUTPUT

          NPM_COUNT=$(ls -d packages/*/package.json 2>/dev/null | wc -l | tr -d ' ')
          echo "npm_count=${NPM_COUNT}" >> $GITHUB_OUTPUT

          # Git log for changelog (max 10 commits)
          CHANGELOG=$(git log --oneline "${PREV_TAG}..HEAD" --pretty="• %s" 2>/dev/null | head -10 || echo "• Initial release")
          DELIMITER=$(openssl rand -hex 8)
          echo "changelog<<${DELIMITER}" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "${DELIMITER}" >> $GITHUB_OUTPUT

          # Success count (must match the needs: list above)
          TOTAL=10
          SUCCESS=0
          for r in \
            "${{ needs.release.result }}" \
            "${{ needs.docker-publish.result }}" \
            "${{ needs.update-homebrew.result }}" \
            "${{ needs.vscode-publish.result }}" \
            "${{ needs.npm-publish.result }}" \
            "${{ needs.crates-publish.result }}" \
            "${{ needs.update-scoop.result }}" \
            "${{ needs.update-aur.result }}" \
            "${{ needs.sdk-client-publish.result }}" \
            "${{ needs.smoke-test.result }}"; do
            [ "$r" = "success" ] && SUCCESS=$((SUCCESS + 1))
          done
          echo "success_count=${SUCCESS}" >> $GITHUB_OUTPUT
          echo "total_count=${TOTAL}" >> $GITHUB_OUTPUT

      - name: "Telegram: AI-enhanced notification"
        if: env.HAS_TELEGRAM == 'true' && needs.release.outputs.ai_telegram_msg != ''
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: ${{ needs.release.outputs.ai_telegram_msg }}

      - name: "Telegram: Release notification (fallback)"
        if: env.HAS_TELEGRAM == 'true' && needs.release.outputs.ai_telegram_msg == ''
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            🦋 <b>Nika ${{ steps.stats.outputs.version }}</b> — ${{ steps.stats.outputs.success_count }}/${{ steps.stats.outputs.total_count }} ✅

            📊 <b>Stats</b>
            🧪 ${{ steps.stats.outputs.test_count }}+ tests · 🦀 ${{ steps.stats.outputs.crate_count }} crates · 🔐 Signed + Notarized

            📋 <b>What's New</b>
            ${{ steps.stats.outputs.changelog }}

            ${{ needs.release.result == 'success' && '✅' || '❌' }} GitHub · ${{ needs.docker-publish.result == 'success' && '✅' || '❌' }} Docker · ${{ needs.update-homebrew.result == 'success' && '✅' || needs.update-homebrew.result == 'skipped' && '⏭️' || '⚠️' }} Homebrew · ${{ needs.vscode-publish.result == 'success' && '✅' || '❌' }} VS Code · ${{ needs.npm-publish.result == 'success' && '✅' || '❌' }} npm · ${{ needs.crates-publish.result == 'success' && '✅' || '❌' }} Cargo

            📦 <b>Install</b>
            <code>brew install supernovae-st/tap/nika</code>
            <code>npx @supernovae-st/nika</code>
            <code>cargo install nika</code>

            🔗 <a href="https://github.com/supernovae-st/nika/releases/tag/${{ env.RELEASE_TAG }}">View Release</a> · <a href="https://github.com/supernovae-st/nika/compare/${{ steps.stats.outputs.prev_tag }}...${{ env.RELEASE_TAG }}">Full Diff</a>
