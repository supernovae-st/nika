# Nika Release Workflow
# ==============================================================================
# Triggered on tag push (v*) or manual dispatch.
# Publishes to ALL distribution channels in parallel:
#
#   build (7 targets) → docker-publish → release (GitHub)
#                                           ├── update-homebrew
#                                           ├── vscode-publish (Marketplace + Open VSX)
#                                           ├── npm-publish (@supernovae/nika)
#                                           └── crates-publish (10 crates in order)
#
# Secrets required: VSCE_PAT, NPM_TOKEN, CARGO_REGISTRY_TOKEN, HOMEBREW_TAP_TOKEN
# Optional: OVSX_PAT (Open VSX for VSCodium/Cursor)
# ==============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.21.2)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (build only, no release/publish)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build Release Binaries (6 targets)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # === Native targets (full features, for Homebrew/GitHub Releases) ===
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: nika-macos-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: nika-macos-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: nika-linux-arm64
            cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: nika-linux-x64
          # === Windows ===
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: nika-windows-x64
          # === Docker targets (musl static, no keychain) ===
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: nika-linux-musl-x64
            docker: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: nika-linux-musl-arm64
            docker: true
            cross: true

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Use HEAD for dry-run, tag for real releases
          ref: ${{ inputs.dry_run && github.sha || env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (cross-compilation)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && !matrix.docker
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install musl tools
        if: matrix.docker && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      # Build commands based on target type
      - name: Build (native, full features)
        if: "!matrix.cross && !matrix.docker"
        working-directory: tools/nika
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (native, musl static)
        if: "!matrix.cross && matrix.docker"
        working-directory: tools/nika
        run: cargo build --release --target ${{ matrix.target }} --no-default-features

      - name: Build (cross, full features)
        if: matrix.cross && !matrix.docker
        working-directory: tools/nika
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (cross, musl static)
        if: matrix.cross && matrix.docker
        working-directory: tools/nika
        run: cross build --release --target ${{ matrix.target }} --no-default-features

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Package (Unix)
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT: ${{ matrix.artifact }}
          TARGET: ${{ matrix.target }}
        run: |
          # Create archive directory
          mkdir -p "dist/${ARTIFACT}-${VERSION}"

          # Copy binary
          cp "tools/nika/target/${TARGET}/release/nika" "dist/${ARTIFACT}-${VERSION}/"

          # Copy documentation
          cp README.md LICENSE CHANGELOG.md "dist/${ARTIFACT}-${VERSION}/" 2>/dev/null || true

          # Create tarball and checksum
          cd dist
          tar -czvf "${ARTIFACT}-${VERSION}.tar.gz" "${ARTIFACT}-${VERSION}"
          shasum -a 256 "${ARTIFACT}-${VERSION}.tar.gz" > "${ARTIFACT}-${VERSION}.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT: ${{ matrix.artifact }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force -Path "dist/$env:ARTIFACT-$env:VERSION"
          Copy-Item "tools/nika/target/$env:TARGET/release/nika.exe" "dist/$env:ARTIFACT-$env:VERSION/"
          Copy-Item README.md, LICENSE, CHANGELOG.md "dist/$env:ARTIFACT-$env:VERSION/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist/$env:ARTIFACT-$env:VERSION" -DestinationPath "dist/$env:ARTIFACT-$env:VERSION.zip"
          $hash = (Get-FileHash "dist/$env:ARTIFACT-$env:VERSION.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ARTIFACT-$env:VERSION.zip" | Out-File -Encoding utf8 "dist/$env:ARTIFACT-$env:VERSION.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish Docker Image (from pre-built musl binaries)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-publish:
    name: Publish Docker Image
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Use HEAD for dry-run, tag for real releases
          ref: ${{ inputs.dry_run && github.sha || env.RELEASE_TAG }}

      - name: Download Linux amd64 artifact (musl static)
        uses: actions/download-artifact@v8
        with:
          name: nika-linux-musl-x64
          path: artifacts/amd64

      - name: Download Linux arm64 artifact (musl static)
        uses: actions/download-artifact@v8
        with:
          name: nika-linux-musl-arm64
          path: artifacts/arm64

      - name: Extract version
        id: version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Extract binaries for Docker
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p docker-context/amd64 docker-context/arm64

          # Extract binaries
          tar -xzf "artifacts/amd64/nika-linux-musl-x64-${VERSION}.tar.gz" -C docker-context/amd64 --strip-components=1
          tar -xzf "artifacts/arm64/nika-linux-musl-arm64-${VERSION}.tar.gz" -C docker-context/arm64 --strip-components=1

          chmod +x docker-context/*/nika

          # Verify static linking
          echo "=== Verifying binaries ==="
          file docker-context/amd64/nika
          ls -la docker-context/*/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/supernovae-st/nika
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: docker-context
          file: tools/nika/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/supernovae-st/nika
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Create GitHub Release
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build, docker-publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Use HEAD for dry-run, tag for real releases
          ref: ${{ inputs.dry_run && github.sha || env.RELEASE_TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release-assets/ \;
          echo "=== Release assets ==="
          ls -la release-assets/

      - name: Extract version
        id: version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Create release notes
          cat > release-notes.md << 'HEADER'
          ```
          ╔═══════════════════════════════════════════════════════════════════════════════╗
          ║                                                                               ║
          ║   🦋  N I K A                                                                 ║
          ║                                                                               ║
          ║   Semantic YAML Workflow Engine for AI                                        ║
          ║                                                                               ║
          ╚═══════════════════════════════════════════════════════════════════════════════╝
          ```
          HEADER

          echo "" >> release-notes.md
          echo "## 🦋 Nika v${VERSION}" >> release-notes.md
          echo "" >> release-notes.md

          # Extract changelog section
          if [ -f "CHANGELOG.md" ]; then
            NOTES=$(awk -v ver="${VERSION}" '/^## \[/{if(match($0, ver)){found=1; next}} /^## \[/{if(found) exit} found{print}' CHANGELOG.md || true)
            if [ -n "$NOTES" ]; then
              echo "$NOTES" >> release-notes.md
            fi
          fi

          # Add installation + published platforms section
          cat >> release-notes.md << INSTALL

          ---

          ## 📦 Installation

          | Method | Command |
          |--------|---------|
          | **Quick Install** | \`curl -fsSL https://raw.githubusercontent.com/SuperNovae-studio/nika/main/install.sh \| sh\` |
          | **Homebrew** | \`brew install supernovae-st/tap/nika\` |
          | **npm** | \`npx @supernovae/nika\` or \`npm install -g @supernovae/nika\` |
          | **Cargo** | \`cargo install nika\` |
          | **Docker** | \`docker run --rm ghcr.io/supernovae-st/nika:${VERSION}\` |
          | **VS Code** | Search "Nika" in Extensions or \`ext install supernovae.nika-lang\` |

          ### Binary Download

          | Platform | Architecture | File |
          |----------|--------------|------|
          | 🍎 macOS | Apple Silicon | \`nika-macos-arm64-${VERSION}.tar.gz\` |
          | 🍎 macOS | Intel | \`nika-macos-x64-${VERSION}.tar.gz\` |
          | 🐧 Linux | x64 | \`nika-linux-x64-${VERSION}.tar.gz\` |
          | 🐧 Linux | ARM64 | \`nika-linux-arm64-${VERSION}.tar.gz\` |
          | 🪟 Windows | x64 | \`nika-windows-x64-${VERSION}.zip\` |

          ## 🌐 Published To

          | Platform | Link |
          |----------|------|
          | GitHub Releases | [v${VERSION}](https://github.com/SuperNovae-studio/nika/releases/tag/v${VERSION}) |
          | VS Code Marketplace | [supernovae.nika-lang](https://marketplace.visualstudio.com/items?itemName=supernovae.nika-lang) |
          | npm | [@supernovae/nika](https://www.npmjs.com/package/@supernovae/nika) |
          | crates.io | [nika](https://crates.io/crates/nika) |
          | Docker | [ghcr.io/supernovae-st/nika](https://github.com/SuperNovae-studio/nika/pkgs/container/nika) |
          | Homebrew | \`supernovae-st/tap/nika\` |

          ---

          <sub>Made with 💜 by [SuperNovae Studio](https://supernovae.studio) — Schema \`nika/workflow@0.12\`</sub>
          INSTALL

      - name: Determine pre-release
        id: prerelease
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Only mark as pre-release for alpha/beta/rc/dev suffixes
          # NOTE: Nika is intentionally 0.x.x forever (see Version Lock)
          if echo "$VERSION" | grep -qE "(alpha|beta|rc|dev)"; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "🦋 Nika ${{ steps.version.outputs.version }}"
          body_path: release-notes.md
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Update Homebrew Formula
  # ─────────────────────────────────────────────────────────────────────────────
  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Extract version
        id: version
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Update Homebrew formula
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: nika
          homebrew-tap: supernovae-st/homebrew-tap
          download-url: https://github.com/supernovae-st/nika/releases/download/${{ env.TAG }}/nika-macos-x64-${{ steps.version.outputs.version }}.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish VS Code Extension
  # ─────────────────────────────────────────────────────────────────────────────
  vscode-publish:
    name: Publish VS Code Extension
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Sync version from tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version

      - name: Compile TypeScript
        run: npm run compile

      - name: Package VSIX
        run: npx vsce package --no-git-tag-version

      - name: Upload VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          gh release upload "$TAG" \
            "nika-lang-${VERSION}.vsix" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --no-git-tag-version -p "$VSCE_PAT"

      - name: Publish to Open VSX (VSCodium/Cursor/Gitpod)
        if: ${{ secrets.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish --no-git-tag-version -p "$OVSX_PAT"
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish npm Package
  # ─────────────────────────────────────────────────────────────────────────────
  npm-publish:
    name: Publish npm Package
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/npm

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Sync version from tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish to crates.io (10 workspace crates in dependency order)
  # ─────────────────────────────────────────────────────────────────────────────
  crates-publish:
    name: Publish to crates.io
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          # Publish order: leaf dependencies first
          CRATES=(
            nika-core
            nika-event
            nika-lsp-core
            nika-mcp
            nika-media
            nika-engine
            nika-cli
            nika-tui
            nika-lsp
            nika
          )

          for crate in "${CRATES[@]}"; do
            echo "=== Publishing ${crate} ==="
            cd "tools/${crate}"
            # Skip if already published at this version
            if cargo publish --dry-run 2>&1 | grep -q "already uploaded"; then
              echo "  -> ${crate} already published, skipping"
            else
              cargo publish --allow-dirty || {
                echo "  -> WARN: ${crate} publish failed (may already exist)"
              }
              # Wait for crates.io index propagation
              echo "  -> Waiting 30s for index propagation..."
              sleep 30
            fi
            cd ../..
          done
          echo "=== All crates published ==="
