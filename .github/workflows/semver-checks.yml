name: semver-checks

on:
  pull_request:
    paths:
      - 'crates/**/src/**'
      - 'crates/**/Cargo.toml'
  # Also on direct pushes to non-main branches — the Diamond rebuild commits
  # straight to its feature branch, so a PR-only trigger misses surface drift
  # until a PR opens. main stays PR-gated (no redundant post-merge re-run).
  push:
    branches-ignore: ['main']
    paths:
      - 'crates/**/src/**'
      - 'crates/**/Cargo.toml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - name: install cargo-semver-checks
        # Pin to the repo toolchain (rust-toolchain.toml · 1.91): a bare
        # install resolves latest (0.50.0 needs rustc 1.93 → rc=101 fleet-
        # wide 2026-08-04). Re-pin when the toolchain channel advances.
        run: cargo install --locked cargo-semver-checks --version 0.49.0
      - name: check every covered lib crate
        # The crate list is PROJECTED from the coverage floor (ADR-090: one SSOT,
        # three consumers — this job, public-api.yml, and hygiene vector 38). Reads
        # a repo-tracked file only (no untrusted github.event.* input).
        # Foundation crates are publish=false (ADR-022), so this step degrades
        # breaking-change hits to warnings (informational visibility, not blocking).
        # Pairs with public-api.yml: that one surfaces drift; this one classifies it
        # as breaking vs additive.
        run: |
          set -euo pipefail
          crates=$(grep -vE '^[[:space:]]*#' scripts/ci/public-api-coverage-baseline.txt | grep -E '^nika-')
          for crate in $crates; do
            cargo semver-checks check-release -p "$crate" || \
              echo "::warning::$crate has breaking changes (publish=false, informational)"
          done
