name: spec-pin-heal

# The pin advances itself: daily, if nika-spec main moved past SPEC_PIN,
# bump the pin and open ONE idempotent PR that ALSO re-vendors the pack
# from the same commit — one spec identity per binary. The job judges the
# full tests-leg battery at the candidate before opening anything. Never
# a direct push. The healed files live outside .github/workflows/, so
# GITHUB_TOKEN can push them.
# SECURITY: no github.event data is interpolated.

on:
  schedule:
    - cron: '51 6 * * *'
  workflow_dispatch:

permissions:
  contents: read # least privilege at the top — the job elevates (Scorecard Token-Permissions)

jobs:
  heal:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the heal branch
      pull-requests: write # open the heal PR
    # Raised from 10: this job now RUNS the conformance suites before it opens
    # anything, instead of delegating that to a CI run that never comes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          shared-key: diamond
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-nextest
      - name: The pin follows the spec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/supernovae-st/nika-spec ../spec
          head="$(git -C ../spec rev-parse HEAD)"
          pin="$(grep -v '^#' SPEC_PIN | head -1 | tr -d '[:space:]')"
          if [ "$head" = "$pin" ]; then echo "pin current ($pin) — nothing to heal"; exit 0; fi
          python3 - "$head" <<'PYEOF'
          import io, re, sys
          s = io.open('SPEC_PIN', encoding='utf-8').read()
          s = re.sub(r'^[0-9a-f]{40}$', sys.argv[1], s, count=1, flags=re.M)
          io.open('SPEC_PIN', 'w', encoding='utf-8').write(s)
          PYEOF
          git add SPEC_PIN
          python3 scripts/estate.py --write   # the manifest rides the heal (staged files first — estate.py reads the INDEX)
          git add estate.yaml

          # THE JOB JUDGES ITSELF — it used to delegate to a judge that never came.
          # This body previously ended by opening a PR that said "the Diamond CI
          # conformance leg judges at the new pin; merge on green". That judgement
          # was impossible: GitHub does not start workflow runs from events raised
          # with the repository's GITHUB_TOKEN (anti-recursion), so a bot PR carries
          # no Rust job at all. On 2026-08-13 one such PR advanced the pin ACROSS
          # the envelope freeze and reddened main with 240 NIKA-PARSE-003 — its
          # rollup held three checks, none of them Rust.
          # Scope: the whole `nika-check` crate, NOT a hand-listed set of suite
          # names. A list would go stale the day a fourth conformance suite lands,
          # and a guard that names its subjects is a guard that misses the next one.
          git -C ../spec checkout --detach "$head"
          bash scripts/sync-pack.sh ../spec
          git add crates/nika-pack/pack
          python3 scripts/estate.py --write
          git add estate.yaml
          echo "::group::the full battery at the candidate pin"
          if ! NIKA_SPEC_DIR="$PWD/../spec" CI=1 ./scripts/ci/check-tests.sh; then
            echo "::endgroup::"
            echo "::error::the engine does not implement spec $head — pin NOT advanced, no PR opened"
            exit 1   # loud, not silent: a red cron run is the signal a human sees
          fi
          echo "::endgroup::"
          git config user.name "nika-release[bot]"
          git config user.email "nika@supernovae.studio"
          branch="bot/spec-pin-${head:0:12}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            open="$(gh pr list --head "$branch" --state open --json number --jq 'length')"
            if [ "$open" = "1" ]; then
              echo "candidate PR already open on $branch — nothing to rewrite"
              exit 0
            fi
            echo "::error::candidate branch $branch exists without one open PR — refusing an ambiguous rewrite"
            exit 1
          fi
          git checkout -b "$branch"
          git commit -m "chore(spec-pin): the pin and the pack follow the spec — $(git -C ../spec rev-parse --short HEAD)"
          git push origin "$branch"
          gh pr create --head "$branch" \
            --title "chore(spec-pin): the pin and the pack follow the spec" \
            --body "Automated pin advance (spec-pin-heal). SPEC_PIN and the vendored pack move to the same nika-spec commit; the job judged the full tests-leg battery before opening this." \
            2>/dev/null || echo "PR already open — refreshed"
