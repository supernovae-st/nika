name: Validate Nika Workflows

on:
  push:
    paths:
      - '**.nika.yaml'
      - 'schemas/nika-workflow.schema.json'
      - '.yamllint.yaml'
  pull_request:
    paths:
      - '**.nika.yaml'
      - 'schemas/nika-workflow.schema.json'
      - '.yamllint.yaml'

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint Nika workflows
        run: yamllint -c .yamllint.yaml **/*.nika.yaml

  validate-schema:
    name: Validate Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/nika -> target"

      - name: Build Nika
        run: |
          cd tools/nika
          cargo build --release

      - name: Validate workflows
        run: |
          for f in examples/*.nika.yaml; do
            echo "Validating $f..."
            ./tools/target/release/nika validate "$f"
          done

  check-extension:
    name: Check File Extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for non-standard YAML files
        run: |
          # Find YAML files in examples/ that don't follow Nika conventions
          # Valid extensions (Schema @0.6):
          #   *.nika.yaml  - Workflow definitions
          #   *.agent.yaml - Agent definitions
          #   *.skill.yaml - Skill definitions
          WRONG_EXT=$(find tools/nika/examples -name "*.yaml" \
            ! -name "*.nika.yaml" \
            ! -name "*.agent.yaml" \
            ! -name "*.skill.yaml" \
            2>/dev/null || true)
          if [ -n "$WRONG_EXT" ]; then
            echo "ERROR: Found YAML files without valid extension:"
            echo "$WRONG_EXT"
            echo ""
            echo "Valid extensions: *.nika.yaml, *.agent.yaml, *.skill.yaml"
            exit 1
          fi
          echo "All YAML files use valid Nika extensions"
