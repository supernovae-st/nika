# ─────────────────────────────────────────────────────────────────────────────
# Release profile (post rust-perf audit 2026-05-12 · BLUEPRINT v1.2 §4 ship-now)
# ─────────────────────────────────────────────────────────────────────────────
# LTO=fat + codegen-units=1 unlock ~5-10% on hot loops (BGE-M3 cosine, BM25
# scoring, RRF fusion) per cargo-pgo + rust-compiler-team Kobzol research.
# Cost · 2× build time at release · `cargo build --release` only · dev builds
# unaffected. strip=symbols matches ADR-061 SLSA L3 byte-determinism target.
# panic=unwind KEPT · panic=abort breaks `cargo test` panic-catching + violates
# the propagate-errors discipline (forbidden for the surrounding tooling ·
# ambiguous for the engine · default unwind is the conservative choice). debug=line-tables-only
# preserves enough symbols for `cargo flamegraph` without bloating release binary.

[profile.release]
lto             = "fat"
codegen-units   = 1
strip           = "symbols"
panic           = "unwind"
debug           = "line-tables-only"
incremental     = false

[profile.bench]
inherits        = "release"
debug           = true

# The browser artifact's own profile (nika-check-wasm · additive, harms no
# other build): the workspace release keeps debuginfo for native profiling,
# which a served .wasm must not carry — measured 4.6M with it, and the fat
# LTO + size-opt pass exists to prune the L0 judgment hub's heavy corners
# (jaq · jsonschema) out of a parse+conform artifact.
[profile.wasm-release]
inherits = "release"
strip = "debuginfo"
debug = false
lto = true
opt-level = "z"
codegen-units = 1
# A trapped wasm instance never comes back (the jq-bomb work made that
# literal — the shadow stack does not restore), so unwinding machinery in
# the artifact would be dead weight implying a recovery the crate refuses
# to promise. No catch_unwind exists anywhere in the wasm dependency tree.
panic = "abort"
