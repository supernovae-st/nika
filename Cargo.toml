uuid     = { version = "1", features = ["v7", "v4", "serde"] }   # ADR-033 UUIDv7 IDs (nika-error L0) · v4 for nika:builtin nika:uuid
clap     = { version = "4.5", features = ["derive"] }       # L4 CLI surface (completions + man derive from this tree)
