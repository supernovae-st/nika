[workspace]
resolver = "3"
members  = ["crates/nika-types", "crates/nika-error", "crates/nika-catalog", "crates/nika-catalog-codegen", "crates/nika-catalog-verify", "crates/nika-kernel", "crates/nika-kernel-ai", "crates/nika-kernel-core", "crates/nika-kernel-runtime", "crates/nika-kernel-plugin", "crates/nika-kernel-mock", "crates/nika-schema", "crates/nika-bm25", "crates/nika-screen", "crates/nika-event", "crates/nika-exec-runner", "crates/nika-blob", "crates/nika-clock", "crates/nika-fs", "crates/nika-http", "crates/nika-ocr", "crates/nika-a11y", "crates/nika-input", "crates/nika-browser", "crates/nika-pack"]
# Excluded so cargo does not try to descend into untracked main-leftover
# manifests under crates/ (the orphan working tree carries them but they
# are not part of the diamond workspace).
exclude = [
  "crates/nika-builtin", "crates/nika-cli",
  "crates/nika-core", "crates/nika-daemon", "crates/nika-display", "crates/nika-engine",
  "crates/nika-extract",
  "crates/nika-init",
  "crates/nika-lsp", "crates/nika-lsp-core", "crates/nika-macros", "crates/nika-mcp",
  "crates/nika-media", "crates/nika-policy", "crates/nika-sdk", "crates/nika-security",
  "crates/nika-serve", "crates/nika-storage", "crates/nika-vault",
  "crates/nika-verb-exec", "crates/nika-verb-fetch", "crates/nika-verb-infer",
  "crates/nika-verb-invoke", "crates/nika",
]

[workspace.package]
version      = "0.80.0"
edition      = "2024"
license      = "AGPL-3.0-or-later"
authors      = ["Thibaut Melen <thibaut@supernovae.studio>"]
rust-version = "1.91"
repository   = "https://github.com/supernovae-st/nika"
homepage     = "https://supernovae.studio"

# ─────────────────────────────────────────────────────────────────────────────
# Diamond layer assignments — enforced by scripts/ci/check-layering.sh.
# L0 = zero I/O, zero async. L0.5 = trait-only. L4 = interface crates.
# See docs/architecture/crate-layer-registry.md for the full discipline.
# ─────────────────────────────────────────────────────────────────────────────

[workspace.metadata.diamond]
# WIP crates: in the workspace but pre-admission (no complete 12-gate table
# yet). SINGLE SOURCE for the admitted-vs-WIP split — scripts/crate-metrics.sh
# is the projector that reads this; refresh-status.sh + check-crate-specs.sh
# query the projector (never re-hardcode the list). When a crate is admitted,
# remove it from this array — one edit, here, period.
wip = ["nika-schema", "nika-browser"]
# nika-pack · the embedded language pack (spec snapshot + manifest hashes ·
# proposal branch feat/nika-pack · pure data · include_dir · zero I/O).
layers.nika-pack = "L0"
layers.nika-types = "L0"
layers.nika-error = "L0"
layers.nika-event = "L0"
layers.nika-clock = "L1"
# nika-fs · Phase-B slice step 4 (announce ladder · D-2026-06-10-N6 cascade) ·
# implements kernel io::fs {FsRead,FsWrite,FsMeta,FsList} · tokio::fs + globset ·
# atomic write (temp+rename per kernel CANCEL SAFETY contract) · typed FsError
# (Pattern A · FCI-023bis · NIKA-110..119).
layers.nika-fs = "L1"
# nika-blob · Phase-B slice step 6 (announce ladder · D-2026-06-10-N6 cascade) ·
# implements kernel io::blob BlobStore via blake3 CAS · sharded fs layout ·
# atomic temp+rename (unique temp) · sidecar .mime (put/stat round-trip) · size cap.
layers.nika-blob = "L1"
# nika-exec-runner · Phase-B slice step 7 (announce floor `exec` · D-2026-06-10-N6) ·
# implements kernel io::process {ShellRun,ShellCancel} via tokio::process · command
# blocklist (NFKC + zero-width + quote/basename bypass defenses) · kill_on_drop + concurrent drain.
layers.nika-exec-runner = "L1"
# nika-http · Phase-B slice step 5 (announce ladder · D-2026-06-10-N6 cascade) ·
# implements kernel io::http {HttpGet,HttpPost} via reqwest · SSRF defense
# (static + DNS-resolve + per-hop redirect re-check) · response size cap.
layers.nika-http = "L1"
layers.nika-catalog = "L0"
layers.nika-catalog-codegen = "L0"
layers.nika-catalog-verify = "L4"
layers.nika-schema = "L0"
layers.nika-kernel = "L0.5"
layers.nika-kernel-ai = "L0.5"
layers.nika-kernel-core = "L0.5"
layers.nika-kernel-runtime = "L0.5"
layers.nika-kernel-plugin = "L0.5"
layers.nika-kernel-mock = "L0.5"
# nika-bm25 · W3 admission target · single-crate-feature-gated per devil's
# advocate 2026-05-12 audit (Option E supersedes 2-crate split) · ADR-038
# binding · spec docs/crate-specs/nika-bm25.md · `kernel` feature default-on
# Diamond-internal · external crates.io consumers `--no-default-features`
layers.nika-bm25 = "L1"
# nika-screen · M2.1 first computer-use L1 effect crate (ADR-081 guards 6+7) ·
# implements kernel io::screen ScreenCapture · xcap backend (B.3) · NIKA-1000..1099.
layers.nika-screen = "L1"
# nika-ocr · M2.2 second computer-use L1 effect crate (no mandatory guard) ·
# implements kernel io::ocr OcrEngine · ocrs pure-Rust backend (B.3) · NIKA-1100..1199.
layers.nika-ocr = "L1"
layers.nika-a11y = "L1"
# nika-input · M2.4 fourth computer-use L1 effect crate · FIRST write-side ·
# implements kernel io::input InputDeviceDyn · enigo cross-platform backend ·
# ADR-081 Guards 1+2 MANDATORY · NIKA-1300..1399.
layers.nika-input = "L1"
# nika-browser · M2.5 fifth computer-use L1 effect crate · CDP web arm ·
# implements kernel io::browser BrowserAutomationDyn · chromiumoxide backend (B.3) ·
# ADR-081 Guard 5 MANDATORY (selector clickjacking) · NIKA-1400..1499.
layers.nika-browser = "L1"

# ─────────────────────────────────────────────────────────────────────────────
# Per-layer banned external deps (runtime-binding crates forbidden at layers
# that must stay runtime-agnostic). Enforced by
# scripts/hygiene/check-layer-deps.sh (vector 33).
#
# L0 = pure data + logic, no async runtime, no I/O binding.
# L0.5 = trait-only surface, uses `trait_variant` for async-fn desugaring
#        (no direct tokio/futures dep in the trait crate itself).
# L1+ = effect impls may bind to tokio and its ecosystem.
# ─────────────────────────────────────────────────────────────────────────────
layer-bans.L0 = ["tokio", "tokio-util", "tokio-stream", "tokio-macros", "rayon", "async-std", "smol", "futures", "futures-util", "futures-core", "futures-channel", "async-channel", "reqwest", "hyper", "h2", "axum", "actix-web"]
layer-bans."L0.5" = ["tokio", "tokio-util", "tokio-stream", "rayon", "async-std", "smol", "reqwest", "hyper", "h2", "axum", "actix-web"]

# ─────────────────────────────────────────────────────────────────────────────
# Workspace-wide lint policy. Every member crate MUST opt in via:
#     [lints]
#     workspace = true
# ─────────────────────────────────────────────────────────────────────────────

[workspace.lints.rust]
unsafe_code                    = "forbid"
unused_must_use                = "deny"
elided_lifetimes_in_paths      = "warn"
unreachable_pub                = "warn"
explicit_outlives_requirements = "warn"
unused_extern_crates           = "warn"
# Declare `cfg(loom)` as a known config flag so `#[cfg(loom)]` in
# nika-types::cancel (and any future concurrent primitive) doesn't
# emit `unexpected_cfgs` warnings on normal `cargo build`. Loom tests
# run explicitly via `RUSTFLAGS="--cfg loom"`.
unexpected_cfgs                = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
# Group levels (priority = -1 so individual lints below win)
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "warn", priority = -1 }
perf        = { level = "deny", priority = -1 }
pedantic    = { level = "warn", priority = -1 }

# Core "diamond" lints — zero tolerance on production src/
unwrap_used    = "deny"
expect_used    = "warn"
panic          = "deny"
todo           = "warn"
unimplemented  = "warn"
dbg_macro      = "deny"
print_stdout   = "warn"
print_stderr   = "warn"
# Per-function 100-LOC soft cap (ADR-023). Function modularity discipline.
too_many_lines = "warn"

# World-class discipline (post-blueprint v1.1 audit · 2026-05-12)
# `must_use_candidate` + `let_underscore_must_use` DEFERRED to ratchet sprint ·
# existing codebase ships 126 candidate sites · enabling either at warn breaks
# `-D warnings` CI gate · queue as standalone refactor with `#[expect(...)]`
# baseline per uv pattern · v0.85 milestone target.

[workspace.lints.rustdoc]
# Compile-time doc discipline (was script-only via check-doc-private-items.sh)
broken_intra_doc_links     = "deny"
private_intra_doc_links    = "warn"
invalid_codeblock_attributes = "deny"
bare_urls                  = "warn"

# ─────────────────────────────────────────────────────────────────────────────
# Shared dependencies. Populated when Phase 1 extract-ready crates land.
# Rule (RUST_ENFORCEMENT §2): pin once here, downstream = `.workspace = true`.
# ─────────────────────────────────────────────────────────────────────────────

[workspace.dependencies]
# Pin once here, downstream uses `.workspace = true` (RUST_ENFORCEMENT §2).
thiserror  = "2.0"
include_dir = "0.7"   # nika-pack L0 · compile-time spec-pack embedding
sha2 = "0.10"         # nika-pack dev · manifest integrity hashing
miette     = "7.6"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
marked-yaml  = "0.8"
serde-saphyr = { version = "0.0.23", features = ["miette"] }
phf        = { version = "0.13", features = ["macros", "unicase"] }
unicase    = "2.9"

trait-variant = "0.1"
bytes         = { version = "1", features = ["serde"] }
blake3        = "1"     # nika-blob L1 — content-addressed hashing (CC0-1.0 OR Apache-2.0 · allowlisted)
unicode-normalization = "0.1"   # nika-exec-runner L1 — NFKC confusable-bypass defense in the command blocklist (MIT OR Apache-2.0)
futures-core  = "0.3"
parking_lot   = "0.12"
tokio         = { version = "1", features = ["rt", "macros", "time"] }
globset       = "0.4"   # nika-fs L1 — FsList::glob matcher (literal_separator · MIT OR Unlicense)
reqwest       = { version = "0.12", default-features = false, features = ["rustls-tls"] }   # nika-http L1 + nika-catalog-verify L4 — pin once (RUST_ENFORCEMENT §2) · rustls (no openssl)
url           = "2"     # nika-http L1 — SSRF URL parsing (also transitive via reqwest · pinned aligned)

# Forward-pinned shared deps (used by Phase 1+ crates).
# Pinning here keeps versions aligned when downstream crates opt in via
# `.workspace = true`. Per RUST_ENFORCEMENT §2.
strsim   = "0.11"   # nika-error Phase C suggest() — Levenshtein for "did you mean"
smallvec = "1.13"   # SmallVec adoption per RUST_2026_BEST_PRACTICES (hot-path vecs)
tracing  = "0.1"    # L1+ effect crates (fs/http/process/...) structured logging
ocrs     = "0.12"   # nika-ocr L1 (M2.2) — pure-Rust OCR engine (rten runtime · no C dep · keeps unsafe forbid)
rten     = "0.24"   # nika-ocr L1 — Model::load_file for .rten weights (ocrs ^0.24 normal dep · pinned aligned)
accessibility = "0.2"   # nika-a11y L1 (M2.3 · macOS-gated) — safe AXUIElement API (TreeWalker · encapsulated ApplicationServices unsafe · keeps unsafe forbid)
core-foundation = "0.10" # nika-a11y L1 (M2.3 · macOS-gated) — CFString/CFType for AXAttribute generic reads (value · subrole)
atspi    = "0.29"   # nika-a11y L1 (M2.3-bis · Linux-gated · ADR-083) — pure-Rust async AT-SPI2 D-Bus client (root_accessible_on_registry · get_children · get_role · State::Sensitive) · CI-pending verify on a Linux/AT-SPI host
enigo    = "0.6"    # nika-input L1 (M2.4 · ADR-083 cross-platform) — synthetic pointer+keyboard (macOS CGEvent · Windows SendInput · Linux X11/Wayland · per-OS unsafe encapsulated → keeps unsafe forbid) · API tarball-verified 0.6.1
chromiumoxide = "0.9"   # nika-browser L1 (M2.5 · ADR-083) — CDP browser automation (tokio-native · kill_on_drop child per INV-011 · fetcher feature OFF: never silently download a browser) · API tarball-verified 0.9.1
png      = "0.18"   # nika-browser L1 — Page.captureScreenshot PNG → RGBA8 kernel Frame decode (pure · headless-testable)
futures-util  = { version = "0.3", default-features = false, features = ["std"] }   # nika-browser L1 — StreamExt::next to drain the CDP Handler stream (one owned task per session)
uuid     = { version = "1", features = ["v7", "serde"] }   # ADR-033 UUIDv7 IDs (nika-error L0)
zeroize  = "1.8"    # ADR-034 Secret zeroize-on-drop (nika-kernel L0.5) — 1.8 adds heap-String zeroing

# Dev / test deps
criterion   = { version = "0.5", features = ["html_reports"] }
proptest    = "1.6"
insta       = { version = "1.42", features = ["yaml"] }
tempfile    = "3"   # nika-ocr dev — model-load error-path fixtures (with_models headless tests)
rstest      = "0.22"
expect-test = "1.5"  # inline snapshots, see ADR-015

# ─────────────────────────────────────────────────────────────────────────────
# Release profile (post rust-perf audit 2026-05-12 · BLUEPRINT v1.2 §4 ship-now)
# ─────────────────────────────────────────────────────────────────────────────
# LTO=fat + codegen-units=1 unlock ~5-10% on hot loops (BGE-M3 cosine, BM25
# scoring, RRF fusion) per cargo-pgo + rust-compiler-team Kobzol research.
# Cost · 2× build time at release · `cargo build --release` only · dev builds
# unaffected. strip=symbols matches ADR-061 SLSA L3 byte-determinism target.
# panic=unwind KEPT · panic=abort breaks `cargo test` panic-catching + violates
# security.md §Propagate errors discipline (forbidden at dx/ level · ambiguous
# at engine/ · default unwind is the conservative choice). debug=line-tables-only
# preserves enough symbols for `cargo flamegraph` without bloating release binary.

[profile.release]
lto             = "fat"
codegen-units   = 1
strip           = "symbols"
panic           = "unwind"
debug           = "line-tables-only"
incremental     = false

[profile.bench]
inherits        = "release"
debug           = true
