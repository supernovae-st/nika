# ─────────────────────────────────────────────────────────────────────────────
# Diamond layer assignments — enforced by scripts/ci/check-layering.sh.
# L0 = zero I/O, zero async. L0.5 = trait-only. L4 = interface crates.
# See docs/architecture/crate-layer-registry.md for the full discipline.
# ─────────────────────────────────────────────────────────────────────────────

[workspace.metadata.diamond]
# WIP crates: in the workspace but pre-admission (no complete 12-gate table
# yet). SINGLE SOURCE for the admitted-vs-WIP split — scripts/crate-metrics.sh
# is the projector that reads this; refresh-status.sh + check-crate-specs.sh
# query the projector (never re-hardcode the list). When a crate is admitted,
# remove it from this array — one edit, here, period.
wip = ["nika-chart", "nika-fx", "nika-proof", "nika-store", "nika-harness", "nika-execution", "nika-service-execution", "nika-serve", "nika-session"]
# nika-pack · the embedded language pack (spec snapshot + manifest hashes ·
# proposal branch feat/nika-pack · pure data · include_dir · zero I/O).
layers.nika-chart = "L0"
# nika-chart · deterministic chart artifacts (CHT master plan · stdlib §Media
# graduate #3 candidate · zero-dep · byte-identical SVG → trace chain).
# nika-cadence · the arming-registry grammar (the arm: block of nika.yaml,
# D-2026-08-10-N3) + the pure next-slot calculator · hand-counted 5-field
# cron (zero cron library — the count is the TYPE) · embedded IANA tzdb ·
# the DST shift DECLARED in the Slot type (N1) · WIP (the 12-gate admission
# lands at V3⑪ of the arming-registry plan).
layers.nika-cadence = "L0"
# nika-tui-core · the TUI session LAW (session model · derivation · plan
# seating · claims) in one crate, native + WASM (D-2026-08-11-N6 · T28) ·
# the parity proof rides the studio's fixtures bit-exact · WIP (gates
# 1-6+8 green · swarm + consumer swap owed).
layers.nika-tui-core = "L4"
layers.nika-pack = "L0"
# nika-proof · the spec-15 proof layer's hash primitives + the one receipt ·
# split from nika-runtime 2026-07-29 (the 15k crate-size cap · the
# nika-dap/nika-cap precedent) · nika_runtime::proof re-exports it whole, so
# every consumer path (`…::proof::{preimage, receipt, …}`) holds unchanged.
layers.nika-proof = "L0"
# nika-cli · the operator surface (D-2026-06-10-N6 first-15-min suite) · seeded
# 2026-06-11 with the display fold + trace verbs per docs/crate-specs/nika-cli.md.
layers.nika-cli = "L4"
layers.nika-cli-host = "L4"
# nika-arm · the descriptor-rooted ARM custody and one firer shared by
# the CLI and every later execution interface (ADR-114/117).
layers.nika-arm = "L4"
# nika-serve · the L4 remote execution projection. W05 admitted its durable
# descriptor-rooted state plane; W06 stages authenticated loopback HTTP.
# SSE, OpenAPI/SDK, and full crate admission remain later carriers.
layers.nika-serve = "L4"
# nika-trace · the flight-recorder reader (the trace verbs · evidence ·
# receipt · the learned-truth forecast · the bin's trace arm) · split from
# nika-cli 2026-08-11 (the 15k crate-size cap · D-2026-07-09-N1 one unit,
# two members · the ADR-110 cli-host precedent) — re-exported at the
# historical verbs:: paths, so every consumer reads unchanged.
layers.nika-trace = "L4"
# nika-dap · the DAP replay server + the shared forensic seams (recover ·
# chain) · split from nika-cli's verbs/dap 2026-07-09 (the
# crate-size cap · the nika-cap precedent) · source_id re-homed to
