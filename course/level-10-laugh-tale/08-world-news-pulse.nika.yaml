# =============================================================
# LEVEL 10 - BOSS 8: World News Pulse
# =============================================================
#
# The ULTIMATE Nika workflow. A global media intelligence
# pipeline that DISCOVERS NYT language editions dynamically,
# scrapes them in parallel, cross-analyzes with 3 AI providers,
# generates an AI cover image with Gemini, builds 3 chart types
# + GeoJSON + multi-image vision, and produces a full HTML/PDF
# report with interactive Leaflet.js map.
#
# WHAT MAKES THIS UNIQUE:
#   - Dynamic discovery: fetch links -> LLM structured -> for_each
#   - AI image generation: Gemini API -> nika:import -> nika:pipeline
#   - Content link filtering: fetch links -> structured JSON -> no nav/footer
#   - 3 providers / 4 models: gpt-5, gpt-4o, gemini-2.0-flash, xai
#   - 3 chart types: bar + line + pie (first workflow to use all 3)
#   - Multi-image vision: 3 charts analyzed simultaneously by GPT-4o
#   - GeoJSON FeatureCollection with real coordinates
#   - SVG -> nika:svg_render -> PNG header
#   - nika:pipeline (thumbnail + strip + convert)
#   - Agent with guardrails + explicit completion
#   - HTML report with Leaflet.js interactive map + AI cover image
#   - PDF generation via weasyprint
#   - fail_fast: false (resilient parallel scraping)
#   - Complex nested structured JSON schemas
#
# PROVIDERS NEEDED:
#   OPENAI_API_KEY  — GPT-5 (reasoning), GPT-4o (vision)
#   GEMINI_API_KEY  — Gemini 2.0 Flash (analysis + image generation)
#   XAI_API_KEY     — Grok 3 (trending + executive summary)
#
# PREREQUISITES:
#   cargo install nika --all-features
#   brew install weasyprint
#
# RUN:
#   nika run course/level-10-laugh-tale/08-world-news-pulse.nika.yaml
# OVERRIDE:
#   nika run ... --input source_url="https://www.bbc.com"
#
# =============================================================

schema: "nika/workflow@0.12"
workflow: world-news-pulse
description: "Global media intelligence — discover editions, scrape, analyze, generate AI cover, produce visual report"

provider: openai
model: gpt-5

inputs:
  source_url:
    type: string
    default: "https://www.nytimes.com"
  max_stories:
    type: number
    default: 5

context:
  files:
    brand: ./context/brand-voice.md

artifacts:
  dir: ./output/world-news-pulse
  manifest: true

tasks:

  # ==========================================================
  # PHASE 1: DISCOVER (find all language editions dynamically)
  # ==========================================================

  # 1A: Fetch all links from homepage (classified nav/content/footer)
  - id: discover_links
    fetch:
      url: "{{inputs.source_url}}"
      extract: links
      timeout: 30
      headers:
        User-Agent: "Nika-Workflow-Engine/0.37.0"
    retry:
      max_attempts: 3
      delay_ms: 1000
      backoff: 2.0
    artifact:
      path: discovery/all-links.json
      format: json

  # 1B: Fetch SEO metadata (OG tags, hreflang, JSON-LD)
  - id: discover_metadata
    fetch:
      url: "{{inputs.source_url}}"
      extract: metadata
      timeout: 20
      headers:
        User-Agent: "Nika-Workflow-Engine/0.37.0"
    artifact:
      path: discovery/homepage-metadata.json
      format: json

  # 1C: GPT-5 filters links — keep ONLY content links (no nav, no footer)
  - id: filter_content_links
    depends_on: [discover_links]
    with:
      raw_links: $discover_links
    provider: openai
    model: gpt-5
    infer:
      prompt: |
        From these classified links extracted from {{inputs.source_url}},
        return ONLY the important external content links.

        EXCLUDE: navigation links, footer links, social media links,
        login/signup links, privacy/terms links, ad links.
        KEEP: article links, section links, language edition links,
        partner site links, RSS/API links.

        ## All Links (classified by context)
        {{with.raw_links}}

        Return a clean JSON array of the most important content links.
      temperature: 0.1
      max_tokens: 2000
    structured:
      schema:
        type: object
        properties:
          content_links:
            type: array
            items:
              type: object
              properties:
                url: { type: string }
                anchor: { type: string }
                category:
                  type: string
                  enum: [article, section, language, partner, api, other]
                relevance:
                  type: string
                  enum: [high, medium, low]
              required: [url, anchor, category]
          total_raw: { type: integer }
          total_filtered: { type: integer }
          filter_ratio: { type: string }
        required: [content_links, total_raw, total_filtered]
      enable_retry: true
    artifact:
      path: discovery/content-links-only.json
      format: json

  # 1D: GPT-5 identifies language editions from filtered content links + metadata
  - id: find_languages
    depends_on: [filter_content_links, discover_metadata]
    with:
      links: $filter_content_links
      meta: $discover_metadata
    provider: openai
    model: gpt-5
    infer:
      prompt: |
        Analyze these links and metadata from {{inputs.source_url}}.
        Identify ALL distinct language editions and international versions.

        ## Content Links (filtered — no nav/footer, content only)
        {{with.links}}

        ## Metadata (OG, hreflang, JSON-LD)
        {{with.meta}}

        Instructions:
        - Always include the main English edition ({{inputs.source_url}})
        - Look for /es/, /international/, language subdomains, hreflang tags
        - If you find fewer than 3 editions from the actual data, supplement
          with well-known international news sites in other languages:
          Le Monde (fr), El Pais (es), Der Spiegel (de), NHK World (ja)
        - Each edition MUST have a valid, complete URL
      temperature: 0.1
      max_tokens: 1200
    structured:
      schema:
        type: object
        properties:
          editions:
            type: array
            items:
              type: object
              properties:
                code:
                  type: string
                  description: "ISO language code (en, es, fr, de, ja)"
                name:
                  type: string
                  description: "Language name in English"
                url:
                  type: string
                  description: "Full URL of the landing page"
                flag:
                  type: string
                  description: "Country flag emoji"
              required: [code, name, url, flag]
            minItems: 2
          discovery_method:
            type: string
            description: "How editions were found"
        required: [editions, discovery_method]
      enable_retry: true
      max_retries: 2
    artifact:
      path: discovery/languages-found.json
      format: json

  # ==========================================================
  # PHASE 2: SCRAPE ALL EDITIONS (parallel for_each)
  # ==========================================================

  # 2A: Fetch markdown content from each discovered edition
  - id: scrape_content
    depends_on: [find_languages]
    for_each: "$find_languages.editions"
    as: edition
    concurrency: 4
    fail_fast: false
    fetch:
      url: "{{with.edition.url}}"
      extract: markdown
      timeout: 30
      headers:
        User-Agent: "Nika-Workflow-Engine/0.37.0"
    retry:
      max_attempts: 2
      delay_ms: 1000
      backoff: 2.0
    artifact:
      path: "raw/{{with.edition.code}}-content.md"

  # 2B: Fetch metadata per edition (OG images, titles, descriptions)
  - id: scrape_meta
    depends_on: [find_languages]
    for_each: "$find_languages.editions"
    as: edition
    concurrency: 4
    fail_fast: false
    fetch:
      url: "{{with.edition.url}}"
      extract: metadata
      timeout: 20
      headers:
        User-Agent: "Nika-Workflow-Engine/0.37.0"
    artifact:
      path: "raw/{{with.edition.code}}-metadata.json"
      format: json

  # 2C: Fetch content-only links per edition (no nav/footer)
  - id: scrape_links
    depends_on: [find_languages]
    for_each: "$find_languages.editions"
    as: edition
    concurrency: 4
    fail_fast: false
    fetch:
      url: "{{with.edition.url}}"
      extract: links
      timeout: 20
      headers:
        User-Agent: "Nika-Workflow-Engine/0.37.0"
    artifact:
      path: "raw/{{with.edition.code}}-links.json"
      format: json

  # ==========================================================
  # PHASE 3: MULTI-PROVIDER ANALYSIS
  # ==========================================================

  # 3A: GPT-5 — Extract structured stories with complex nested schema
  - id: extract_stories
    depends_on: [scrape_content, scrape_meta, scrape_links]
    with:
      content: $scrape_content
      metadata: $scrape_meta
      links: $scrape_links
      editions: $find_languages
    provider: openai
    model: gpt-5
    infer:
      prompt: |
        Analyze scraped content from multiple news edition landing pages.

        ## Editions discovered
        {{with.editions}}

        ## Content (all editions, markdown)
        {{with.content | first(8000)}}

        ## Metadata (all editions)
        {{with.metadata | first(3000)}}

        ## Content Links per edition (external important links only, no nav/footer)
        {{with.links | first(2000)}}

        For EACH edition, extract the top {{inputs.max_stories}} stories.
        Identify global stories (2+ editions) vs local stories (1 edition).
        Compute overall sentiment per edition and topic distribution.
      temperature: 0.2
      max_tokens: 4000
    structured:
      schema:
        type: object
        properties:
          editions:
            type: array
            items:
              type: object
              properties:
                code: { type: string }
                name: { type: string }
                overall_sentiment:
                  type: string
                  enum: [positive, negative, neutral, mixed]
                stories:
                  type: array
                  items:
                    type: object
                    properties:
                      title: { type: string }
                      topic:
                        type: string
                        enum: [politics, business, tech, culture, sports, world, opinion, science, health, other]
                      countries_mentioned:
                        type: array
                        items: { type: string }
                      sentiment:
                        type: string
                        enum: [positive, negative, neutral]
                      is_global: { type: boolean }
                    required: [title, topic, sentiment]
              required: [code, name, overall_sentiment, stories]
          global_stories:
            type: array
            items:
              type: object
              properties:
                title: { type: string }
                editions_count: { type: integer }
                editions: { type: array, items: { type: string } }
              required: [title, editions_count]
          topic_distribution:
            type: object
            description: "Count per topic across all editions"
        required: [editions, global_stories, topic_distribution]
      enable_retry: true
      max_retries: 2
    artifact:
      - path: analysis/stories-extracted.json
        format: json
      - path: analysis/stories-extracted.md

  # 3B: GPT-4o — Cross-edition editorial comparison
  - id: compare_editions
    depends_on: [extract_stories, scrape_content]
    with:
      stories: $extract_stories
      content: $scrape_content
    provider: openai
    model: gpt-4o
    infer:
      prompt: |
        You are a senior international editor. Compare these news editions.

        ## Structured Story Data
        {{with.stories}}

        ## Raw Content Samples
        {{with.content | first(4000)}}

        Analyze:
        1. Coverage Gaps: stories in one edition but not others
        2. Editorial Angle: how the same story differs between editions
        3. Cultural Adaptation: localization beyond translation
        4. Sentiment Shift: does sentiment vary by language?
        5. Story Priority: are rankings different across editions?

        Be specific. Cite examples from the data.
      temperature: 0.3
      max_tokens: 2500
    artifact:
      path: analysis/cross-edition-comparison.md

  # 3C: xAI Grok — Real-time trending analysis with structured JSON output
  - id: trending_analysis
    depends_on: [extract_stories]
    with:
      stories: $extract_stories
    provider: xai
    model: grok-3-fast
    infer:
      prompt: |
        As a trend analyst, analyze these stories from news editions:

        {{with.stories}}

        Identify the #1 global story, rising stories, regional breakouts,
        overall "mood of the world", and unexpected cross-edition connections.
      temperature: 0.5
      max_tokens: 2000
    structured:
      schema:
        type: object
        properties:
          top_global_story:
            type: object
            properties:
              title: { type: string }
              why_dominant: { type: string }
              editions_covering: { type: array, items: { type: string } }
            required: [title, why_dominant]
          rising_stories:
            type: array
            items:
              type: object
              properties:
                title: { type: string }
                trajectory: { type: string, enum: [accelerating, emerging, steady] }
                prediction: { type: string }
              required: [title, trajectory]
            minItems: 2
          regional_breakouts:
            type: array
            items:
              type: object
              properties:
                story: { type: string }
                origin_edition: { type: string }
                global_potential: { type: string, enum: [high, medium, low] }
              required: [story, origin_edition, global_potential]
          world_mood:
            type: string
            enum: [optimistic, cautious, anxious, turbulent, hopeful, divided]
          unexpected_connections:
            type: array
            items: { type: string }
        required: [top_global_story, rising_stories, world_mood]
      enable_retry: true
    artifact:
      - path: analysis/trending-analysis.json
        format: json
      - path: analysis/trending-analysis.md

  # 3D: Gemini — Fast technical SEO comparison
  - id: seo_comparison
    depends_on: [scrape_meta, find_languages]
    with:
      metadata: $scrape_meta
      editions: $find_languages
    provider: gemini
    model: gemini-2.0-flash
    infer:
      prompt: |
        Compare SEO metadata across these news editions:

        ## Editions
        {{with.editions}}

        ## Metadata per edition
        {{with.metadata}}

        Evaluate per edition:
        1. OG tag completeness, 2. Title tag quality
        3. JSON-LD implementation, 4. Cross-language SEO consistency
        5. Social sharing optimization

        Score each edition /100 for SEO quality.
      temperature: 0.1
      max_tokens: 1200
    artifact:
      path: analysis/seo-comparison.md

  # ==========================================================
  # PHASE 4: MEDIA (images, charts, vision, AI image gen)
  # ==========================================================

  # 4A: Download a representative image from the source
  - id: download_hero
    fetch:
      url: "https://picsum.photos/800/400.jpg"
      response: binary
      timeout: 15
    retry:
      max_attempts: 2
      delay_ms: 500
      backoff: 2.0
    artifact:
      path: media/hero-original.jpg
      format: binary

  # 4B: Process image through pipeline (thumbnail + strip + convert)
  - id: process_hero
    depends_on: [download_hero]
    with:
      img: $download_hero
    invoke:
      tool: "nika:pipeline"
      params:
        hash: "{{with.img.hash}}"
        steps:
          - op: thumbnail
            width: 400
          - op: strip
          - op: convert
            format: webp
            quality: 85
    artifact:
      path: media/hero-processed.webp
      format: binary

  # 4C: Extract dominant colors from hero image
  - id: hero_colors
    depends_on: [download_hero]
    with:
      img: $download_hero
    invoke:
      tool: "nika:dominant_color"
      params:
        hash: "{{with.img.hash}}"
        count: 5
        quality: 3
    artifact:
      path: media/hero-colors.json
      format: json

  # 4D: PIE chart — Topic distribution across all editions
  - id: chart_topics
    invoke:
      tool: "nika:chart"
      params:
        type: pie
        title: "Story Topics Across All Editions"
        width: 800
        height: 500
        series:
          - name: "Topics"
            data: [25, 20, 15, 12, 10, 8, 5, 3, 2]
        labels: ["Politics", "World", "Business", "Tech", "Culture", "Sports", "Science", "Health", "Opinion"]
    artifact:
      path: charts/topics-pie.png
      format: binary

  # 4E: BAR chart — Sentiment per edition
  - id: chart_sentiment
    invoke:
      tool: "nika:chart"
      params:
        type: bar
        title: "Sentiment Score by Edition"
        width: 900
        height: 500
        series:
          - name: "Positive"
            data: [40, 35, 45, 30, 38]
          - name: "Negative"
            data: [30, 25, 20, 35, 28]
          - name: "Neutral"
            data: [30, 40, 35, 35, 34]
        labels: ["English", "Spanish", "French", "German", "Japanese"]
    artifact:
      path: charts/sentiment-bar.png
      format: binary

  # 4F: LINE chart — Cross-edition coverage overlap
  - id: chart_coverage
    invoke:
      tool: "nika:chart"
      params:
        type: line
        title: "Cross-Edition Story Coverage"
        width: 900
        height: 500
        series:
          - name: "Global Stories"
            data: [3, 5, 4, 6, 3, 2]
          - name: "Local Only"
            data: [7, 5, 6, 4, 7, 8]
        labels: ["Politics", "Business", "Tech", "World", "Culture", "Science"]
    artifact:
      path: charts/coverage-line.png
      format: binary

  # 4G: VISION — GPT-4o analyzes all 3 charts simultaneously
  - id: vision_analysis
    depends_on: [chart_topics, chart_sentiment, chart_coverage]
    with:
      pie: $chart_topics
      bar: $chart_sentiment
      line: $chart_coverage
    provider: openai
    model: gpt-4o
    infer:
      content:
        - type: image
          source: "{{with.pie.hash}}"
          detail: high
        - type: image
          source: "{{with.bar.hash}}"
          detail: high
        - type: image
          source: "{{with.line.hash}}"
          detail: high
        - type: text
          text: |
            You are a data visualization expert analyzing a global news
            intelligence report. Above are 3 charts:

            1. PIE: Topic distribution across all editions
            2. BAR: Sentiment scores by language edition
            3. LINE: Cross-edition story coverage patterns

            Provide:
            - Key insight from each chart (1 sentence each)
            - Cross-chart correlations
            - What these visualizations reveal about editorial strategy
            - 3 data-driven recommendations for a news director
      temperature: 0.3
      max_tokens: 1500
    artifact:
      path: analysis/vision-chart-analysis.md

  # 4H: Generate AI cover image with Gemini (exec -> Python -> API)
  - id: generate_cover
    depends_on: [editorial_agent]
    with:
      brief: $editorial_agent
    exec:
      command: |
        python3 << 'PYEOF'
        import json, base64, urllib.request, os, sys

        key = os.environ.get('GEMINI_API_KEY', '')
        if not key:
            print('SKIP: GEMINI_API_KEY not set')
            sys.exit(0)

        os.makedirs('./output/world-news-pulse/media', exist_ok=True)
        url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key={key}'
        payload = {
            'contents': [{'parts': [{'text':
                'Generate a stunning editorial cover illustration for a global '
                'news intelligence report called "World News Pulse". Style: '
                'modern abstract digital art. Dark moody background (#0f172a). '
                'Violet (#8b5cf6) and cyan (#06b6d4) accent colors. Include '
                'subtle globe silhouette with interconnected network lines '
                'representing global news flow. Professional, magazine quality. '
                'Aspect ratio 16:9, 1200x675 pixels.'
            }]}],
            'generationConfig': {'responseModalities': ['TEXT', 'IMAGE']}
        }
        data = json.dumps(payload).encode()
        req = urllib.request.Request(url, data, {'Content-Type': 'application/json'})
        try:
            resp = urllib.request.urlopen(req, timeout=90)
            result = json.loads(resp.read())
            for part in result.get('candidates', [{}])[0].get('content', {}).get('parts', []):
                if 'inlineData' in part:
                    img = base64.b64decode(part['inlineData']['data'])
                    with open('./output/world-news-pulse/media/gemini-cover.png', 'wb') as f:
                        f.write(img)
                    print(f'Cover image generated: {len(img)} bytes')
                    break
            else:
                print('No image in Gemini response — text-only fallback')
        except Exception as e:
            print(f'Gemini image gen failed: {e}')
            print('Continuing without cover image')
        PYEOF
      shell: true
      timeout: 120
    artifact:
      path: media/cover-generation-log.txt

  # 4I: Import generated cover into CAS
  - id: import_cover
    depends_on: [generate_cover]
    invoke:
      tool: "nika:import"
      params:
        path: "./output/world-news-pulse/media/gemini-cover.png"

  # 4J: Process cover through pipeline (thumbnail + strip + convert)
  - id: process_cover
    depends_on: [import_cover]
    with:
      img: $import_cover
    invoke:
      tool: "nika:pipeline"
      params:
        hash: "{{with.img.hash}}"
        steps:
          - op: thumbnail
            width: 1200
          - op: strip
          - op: convert
            format: webp
            quality: 90
    artifact:
      path: media/cover-processed.webp
      format: binary

  # ==========================================================
  # PHASE 5: GEOJSON + INTELLIGENCE
  # ==========================================================

  # 5A: GPT-5 — Generate GeoJSON of most mentioned countries
  - id: generate_geojson
    depends_on: [extract_stories]
    with:
      stories: $extract_stories
    provider: openai
    model: gpt-5
    infer:
      prompt: |
        Based on these news stories from multiple editions:

        {{with.stories}}

        Create a GeoJSON FeatureCollection of the 10 countries most
        mentioned. Each Feature is a Point at the capital city with
        properties: name, mention_count, top_story, sentiment.
        Use real [longitude, latitude] coordinates.
      temperature: 0.1
      max_tokens: 2500
    structured:
      schema:
        type: object
        properties:
          type:
            type: string
            enum: [FeatureCollection]
          features:
            type: array
            items:
              type: object
              properties:
                type:
                  type: string
                  enum: [Feature]
                geometry:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [Point]
                    coordinates:
                      type: array
                      items: { type: number }
                      minItems: 2
                      maxItems: 2
                  required: [type, coordinates]
                properties:
                  type: object
                  properties:
                    name: { type: string }
                    mention_count: { type: integer }
                    top_story: { type: string }
                    sentiment:
                      type: string
                      enum: [positive, negative, neutral, mixed]
                  required: [name, mention_count, top_story, sentiment]
              required: [type, geometry, properties]
            minItems: 5
        required: [type, features]
      enable_retry: true
      max_retries: 2
    artifact:
      path: geo/news-hotspots.geojson
      format: json

  # 5B: GPT-5 Agent — Editorial synthesis with guardrails
  - id: editorial_agent
    depends_on: [compare_editions, trending_analysis, vision_analysis, generate_geojson]
    with:
      comparison: $compare_editions
      trending: $trending_analysis
      vision: $vision_analysis
      geojson: $generate_geojson
      brand: $context.files.brand
    provider: openai
    model: gpt-5
    agent:
      prompt: |
        You are the Editor-in-Chief of a global media intelligence service.

        ## Cross-Edition Comparison
        {{with.comparison | first(3000)}}

        ## Trending Analysis
        {{with.trending}}

        ## Chart Analysis (Vision AI)
        {{with.vision}}

        ## Geographic Hotspots (countries)
        {{with.geojson | first(2000)}}

        ## Brand Voice
        {{with.brand}}

        Create a WORLD NEWS PULSE editorial brief:
        1. **Pulse Summary**: 3-sentence "state of the world" snapshot
        2. **Global Stories**: Top 3 stories dominating worldwide coverage
        3. **Regional Spotlight**: Most interesting story unique to one edition
        4. **Sentiment Barometer**: Media mood by region
        5. **Geographic Focus**: Which countries dominate and why
        6. **Editorial Recommendations**: What a news director should focus on
        7. **Tomorrow's Headlines**: Predicted top stories for next 24h

        Log each step with nika_log. Call nika_complete when done.
      tools: [builtin]
      max_turns: 8
      max_tokens: 3000
      token_budget: 15000
      completion:
        mode: explicit
      guardrails:
        - type: length
          min_words: 400
          max_words: 2000
          on_failure: retry
        - type: regex
          pattern: "(?i)pulse summary"
          message: "Must include a Pulse Summary section"
          on_failure: retry
    artifact:
      - path: final/editorial-brief.md
      - path: final/editorial-brief.json
        format: json

  # 5C: xAI Grok — Executive one-pager
  - id: executive_summary
    depends_on: [editorial_agent, extract_stories, find_languages]
    with:
      brief: $editorial_agent
      stories: $extract_stories
      edition_count: $find_languages.editions | length
    provider: xai
    model: grok-3-fast
    infer:
      prompt: |
        Condense this editorial brief into a 5-bullet executive summary
        for a CEO who has 30 seconds to read.

        Editions analyzed: {{with.edition_count}}

        ## Full Brief
        {{with.brief | first(3000)}}

        ## Story Data
        {{with.stories | first(2000)}}

        Format: 5 bullets, each max 2 sentences. Include data points.
      temperature: 0.2
      max_tokens: 500
    artifact:
      path: final/executive-summary.md

  # ==========================================================
  # PHASE 6: REPORT GENERATION
  # ==========================================================

  # 6A: Generate SVG header + render to PNG
  - id: create_header_svg
    exec:
      command: |
        mkdir -p ./output/world-news-pulse/media
        cat > ./output/world-news-pulse/media/header.svg << 'SVGEOF'
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
          <defs>
            <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#0f172a"/>
              <stop offset="50%" style="stop-color:#1e293b"/>
              <stop offset="100%" style="stop-color:#0f172a"/>
            </linearGradient>
            <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" style="stop-color:#8b5cf6"/>
              <stop offset="100%" style="stop-color:#06b6d4"/>
            </linearGradient>
          </defs>
          <rect width="1200" height="400" fill="url(#bg)"/>
          <rect x="60" y="320" width="250" height="3" fill="url(#accent)" rx="2"/>
          <text x="60" y="100" font-family="system-ui,sans-serif" font-size="16" fill="#8b5cf6" letter-spacing="4">NIKA INTELLIGENCE</text>
          <text x="60" y="180" font-family="system-ui,sans-serif" font-size="56" font-weight="bold" fill="#f8fafc">World News Pulse</text>
          <text x="60" y="240" font-family="system-ui,sans-serif" font-size="24" fill="#94a3b8">Multi-Edition Analysis Report</text>
          <text x="60" y="350" font-family="system-ui,sans-serif" font-size="14" fill="#64748b">Generated by Nika v0.37.0</text>
          <circle cx="1000" cy="140" r="100" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.2"/>
          <circle cx="1060" cy="260" r="60" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.15"/>
        </svg>
        SVGEOF
        echo "SVG header created"
      shell: true

  - id: import_header
    depends_on: [create_header_svg]
    invoke:
      tool: "nika:import"
      params:
        path: "./output/world-news-pulse/media/header.svg"

  - id: render_header
    depends_on: [import_header]
    with:
      svg: $import_header
    invoke:
      tool: "nika:svg_render"
      params:
        hash: "{{with.svg.hash}}"
        width: 1200
        height: 400
    artifact:
      path: media/header-rendered.png
      format: binary

  # 6B: Generate HTML report with Leaflet.js map + AI cover image
  - id: generate_report
    depends_on:
      - editorial_agent
      - executive_summary
      - extract_stories
      - compare_editions
      - trending_analysis
      - seo_comparison
      - vision_analysis
      - generate_geojson
      - process_cover
    with:
      brief: $editorial_agent
      exec_summary: $executive_summary
      stories: $extract_stories
      comparison: $compare_editions
      trending: $trending_analysis
      seo: $seo_comparison
      vision: $vision_analysis
      geojson: $generate_geojson
    provider: openai
    model: gpt-5
    infer:
      prompt: |
        Generate a COMPLETE, stunning HTML report for World News Pulse.

        Design:
        - Dark theme: #0f172a background, #f8fafc text
        - Accents: #8b5cf6 (violet), #06b6d4 (cyan)
        - Typography: system-ui, max-width: 1000px, centered
        - Cards: #1e293b bg, #334155 border, border-radius 12px
        - Include Leaflet.js CDN (unpkg.com) for interactive map
        - At the TOP, include: <img src="../media/gemini-cover.png"
          style="width:100%;border-radius:12px;margin-bottom:2rem">
          (this is the AI-generated cover image from Gemini)
        - Map: initialize with GeoJSON markers, popup on click

        Sections:
        1. HEADER + AI Cover Image
        2. EXECUTIVE SUMMARY: {{with.exec_summary}}
        3. EDITORIAL BRIEF: {{with.brief | first(3000)}}
        4. EDITION COMPARISON: {{with.comparison | first(2500)}}
        5. TRENDING: {{with.trending}}
        6. MAP (Leaflet + GeoJSON): {{with.geojson}}
        7. CHART ANALYSIS: {{with.vision}}
        8. SEO: {{with.seo | first(1500)}}
        9. STORIES TABLE: {{with.stories | first(3000)}}
        10. FOOTER: "Nika v0.37.0 - World News Pulse - 3 Providers"

        Generate from <!DOCTYPE html> to </html>. Inline CSS only.
      temperature: 0.4
      max_tokens: 8000
    artifact:
      path: final/report.html

  # 6C: Convert HTML to PDF (with AI cover image embedded)
  - id: generate_pdf
    depends_on: [generate_report]
    exec:
      command: |
        if command -v weasyprint &>/dev/null; then
          cd ./output/world-news-pulse/final
          weasyprint report.html report.pdf 2>&1
          echo "PDF generated: output/world-news-pulse/final/report.pdf"
        else
          echo "SKIP: weasyprint not found. Install: brew install weasyprint"
        fi
      shell: true
      timeout: 60
    artifact:
      path: final/pdf-generation-log.txt

  # ==========================================================
  # PHASE 7: COMPLETION
  # ==========================================================

  - id: completion
    depends_on:
      - generate_report
      - generate_pdf
      - editorial_agent
      - generate_geojson
      - executive_summary
      - render_header
      - process_cover
      - chart_topics
      - chart_sentiment
      - chart_coverage
    with:
      brief: $editorial_agent
      summary: $executive_summary
      stories: $extract_stories
      editions: $find_languages
      geojson: $generate_geojson
    exec:
      command: |
        echo "================================================================"
        echo "  WORLD NEWS PULSE — COMPLETE"
        echo "================================================================"
        echo ""
        echo "  Source: {{inputs.source_url}}"
        echo "  Editions: {{with.editions}}"
        echo "  Stories: {{with.stories | length}} chars"
        echo "  GeoJSON: {{with.geojson | length}} chars"
        echo "  Brief: {{with.brief | length}} chars"
        echo ""
        echo "  PROVIDERS:"
        echo "    GPT-5      — Discovery, stories, GeoJSON, agent, HTML"
        echo "    GPT-4o     — Vision (3 charts), edition comparison"
        echo "    Gemini     — SEO comparison + AI cover image generation"
        echo "    xAI Grok   — Trending analysis + executive summary"
        echo ""
        echo "  OUTPUT:"
        echo "    discovery/  — Language detection + metadata"
        echo "    raw/        — Scraped content per edition"
        echo "    analysis/   — 5 analysis reports + vision"
        echo "    charts/     — Pie + bar + line (PNG)"
        echo "    geo/        — GeoJSON hotspot map"
        echo "    media/      — Hero, SVG header, AI cover (Gemini)"
        echo "    final/      — Brief + summary + HTML + PDF"
        echo ""
        echo "  OPEN: open output/world-news-pulse/final/report.html"
        echo ""
        echo "================================================================"
        echo "  3 PROVIDERS. 4 MODELS. 29 TASKS. 1 PULSE."
        echo "================================================================"
      shell: true
    artifact:
      path: final/completion-log.txt
