[package]
name          = "nika-a11y"
description   = "Accessibility-tree-query L1 effect crate — implements the nika-kernel AccessibilityTree trait (snapshot + find + resolve_ref) via the macOS AXUIElement backend (safe `accessibility` crate). Third computer-use L1 · M2.3 · owns ADR-081 Guard 3 (AX-secure-field redaction · mandatory)."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Internal L1 effect crate (not a standalone crates.io satellite).

# Gate 2 (ADR linked) · ADR-081 = 7 L1 security guards forever; nika-a11y OWNS
# Guard 3 (AX-secure-field redaction · MANDATORY-at-admission · pure tree-transform).
[package.metadata.adr]
adr = ["ADR-003", "ADR-081"]

[dependencies]
nika-kernel = { path = "../nika-kernel", version = "0.80.0" }
thiserror   = { workspace = true }
# tokio `rt` for spawn_blocking (the !Send AXUIElement walk runs off the async
# runtime · worker-local · kernel CANCEL SAFETY contract). Cross-platform.
tokio       = { workspace = true, features = ["rt"] }

# macOS backend (B.3) · accessibility = safe AXUIElement API (TreeWalker · the
# unsafe ApplicationServices FFI is encapsulated → this crate stays
# unsafe_code = forbid). core-foundation for CFString/CFType reads (value ·
# subrole). Both gated to macOS — Linux AT-SPI / Windows UIA land later (§4).
[target.'cfg(target_os = "macos")'.dependencies]
accessibility   = { workspace = true }
core-foundation = { workspace = true }

[dev-dependencies]
# #[tokio::test] for the async AccessibilityTree methods · proptest pins the
# pure helpers (Guard 3 redaction · role mapping · find-by-id · query filter).
tokio    = { workspace = true, features = ["macros", "rt"] }
proptest = { workspace = true }

[lints]
workspace = true
