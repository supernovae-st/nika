# SPDX-License-Identifier: AGPL-3.0-or-later
#
# STANDALONE WORKSPACE — deliberately OUTSIDE the diamond workspace
# (root Cargo.toml `exclude`). The official ACP SDK requires
# `serde_json/preserve_order` (every version since 0.15.0 · verified on
# the sparse index 2026-08-05), and cargo feature unification would turn
# it on for the WHOLE engine build — flipping serde_json::Value key
# order from sorted to insertion on every byte-attested surface
# (decision receipts · locks · check --json goldens). Five goldens
# turned red the moment the dep entered the workspace; this quarantine
# is the structural fix. The B3 design decision (hand-rolled wire v1 in
# the engine + this harness as the CONFORMANCE instrument · vs an
# upstream feature-gate PR) is the operator's gate — spec §2 amendment.
[package]
name          = "nika-acp"
description   = "The harness access class (D-2026-08-04-N1 · P3) — ACP conformance harness + the mock agent instrument. Quarantined workspace: the official SDK's serde_json preserve_order requirement must never unify into the engine's feature graph."
version       = "0.112.0"
edition       = "2024"
license       = "AGPL-3.0-or-later"
publish       = false

[workspace]
# Empty on purpose: this crate IS its own workspace (own lockfile ·
# own feature graph · zero unification with the diamond).

[dependencies]
agent-client-protocol = "2.0.0"   # wire v1 (SDK 2.x) · pin per spec §2

[dev-dependencies]
# The mock + conformance tests only — the lib carries no runtime of its own yet.
tokio        = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
futures-core = "0.3"
tokio-util   = { version = "0.7", features = ["compat"] }
nika-kernel  = { path = "../nika-kernel" }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies.nika-verb-agent]
# The seat e2e drives the verb's harness path (feature-gated there).
path = "../nika-verb-agent"
features = ["access-harness"]

[dev-dependencies.nika-kernel-mock]
path = "../nika-kernel-mock"

[dev-dependencies.nika-verb-invoke]
path = "../nika-verb-invoke"

[dev-dependencies.nika-harness]
# The engine's hand-rolled wire-v1 client — judged HERE, from the
# quarantine, by the official SDK's Agent role (spec §2bis Lane A: the
# SDK is the JUDGE, never a link-time dependency of the engine). The
# path dep is test-only and lives in THIS workspace's lockfile, so the
# SDK's serde_json/preserve_order never reaches the engine build.
path = "../nika-harness"

[dev-dependencies.nika-schema]
# The gate e2e declares the workflow's permits: boundary on the input.
path = "../nika-schema"

[dev-dependencies.serde_json]
# The gate e2e binds the operator's answer value.
version = "1"

[dev-dependencies.nika-runtime]
# The billing e2e drives a FULL run (the trace frame is the receipt).
path = "../nika-runtime"
features = ["access-harness"]

[dev-dependencies.nika-verb-infer]
path = "../nika-verb-infer"

[dev-dependencies.nika-verb-exec]
path = "../nika-verb-exec"

[dev-dependencies.nika-providers]
path = "../nika-providers"

[dev-dependencies.nika-check]
path = "../nika-check"

[dev-dependencies.nika-event]
path = "../nika-event"

[dev-dependencies.nika-types]
path = "../nika-types"
