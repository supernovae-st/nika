[package]
name          = "nika-bm25-kernel"
description   = "MemoryRecall adapter for nika-bm25-core · L1 thin bridge to nika-kernel sealed traits (Q6 split Option D · ADR-043)."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Diamond-internal adapter · couples to nika-kernel · standalone-publishable value lives in nika-bm25-core.

# NOTE: Q6 split per rust-architect 2026-05-12. ~80 LOC adapter.
# Workspace member but NOT YET ADMITTED · Gate 12 atomic admission.

[dependencies]
nika-bm25-core = { path = "../nika-bm25-core", version = "0.80.0" }
nika-kernel    = { path = "../nika-kernel",    version = "0.80.0" }
nika-types     = { path = "../nika-types",     version = "0.80.0" }
nika-error     = { path = "../nika-error",     version = "0.80.0" }
thiserror      = { workspace = true }

# Q4 cooperative scheduling · tokio::task::consume_budget() per BLUEPRINT v1.3 §4
tokio = { workspace = true, features = ["rt"] }
trait-variant = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
insta    = { workspace = true }
rstest   = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
# Pre-W3 scaffold ignores · deps for Gate 3 GREEN phase.
ignored = ["nika-bm25-core", "nika-kernel", "nika-types", "nika-error", "thiserror", "tokio", "trait-variant", "proptest", "insta", "rstest"]
