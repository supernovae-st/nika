[package]
name          = "nika-bm25"
description   = "BM25 (Okapi) lexical scoring satellite for the Nika diamond memory subsystem. L1 · pure-algo · publishable standalone (ADR-004)."
# NOTE: W3 admission IN PROGRESS · workspace member but NOT YET admitted ·
# Gate 12 atomic admission commit happens when Gates 2/4-11 GREEN.
# Current state · Gate 1 SPEC ✓ · Gate 3 scaffold (BmParams only) ·
# `docs/crate-specs/nika-bm25.md` is the binding plan.
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = true  # L1 memory satellite — publishable on crates.io per ADR-004.

[dependencies]
nika-types  = { path = "../nika-types",  version = "0.80.0" }
nika-error  = { path = "../nika-error",  version = "0.80.0" }
nika-kernel = { path = "../nika-kernel", version = "0.80.0" }
thiserror   = { workspace = true }

# Tokio for cooperative scheduling (consume_budget per BLUEPRINT v1.3 §4)
tokio = { workspace = true, features = ["rt"] }

# Async trait variant (per ADR-006 + ADR-014 sealed traits)
trait-variant = { workspace = true }

[dev-dependencies]
proptest    = { workspace = true }
criterion   = { workspace = true }
insta       = { workspace = true }
rstest      = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
# Pre-W3 scaffold ignores · deps declared for Gate 3 GREEN phase
# (scoring kernel impl) + Gate 6 proptest + Gate 7 criterion + Gate 2
# insta/rstest fixtures · unused until next session. Remove on Gate 12
# atomic admission once all consumed.
ignored = [
  # Runtime deps · Gate 3 GREEN phase
  "nika-error", "nika-kernel", "nika-types", "thiserror", "tokio", "trait-variant",
  # Dev deps · Gates 2 + 6 + 7
  "criterion", "insta", "proptest", "rstest",
]
