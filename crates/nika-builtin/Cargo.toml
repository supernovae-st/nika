[package]
name          = "nika-builtin"
description   = "The 26 canonical stdlib builtins (core 6 · file 5 · data 8 · network 2 · introspection 2 · media 3) behind ONE dispatcher implementing the three kernel tool seams — ToolExecuteDyn + ToolBatchDyn + ToolDefinitionProviderDyn. Spec: docs/crate-specs/nika-builtin.md (normative contracts: nika-spec stdlib/builtins-v0.1.md)."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Internal L1.5 tool layer.

[dependencies]
nika-kernel = { path = "../nika-kernel", version = "0.118.2" }   # the 3 tool seams + fs/http/clock/event effect seams
nika-extract = { path = "../nika-extract", version = "0.118.2" }  # nika:fetch — the extract modes + page digest (L1.5→L1.5 same-layer)
nika-fx      = { path = "../nika-fx", version = "0.118.2" }  # nika:image_fx — deterministic artistic effects (L1 pure-algo · zero-dep)
nika-types   = { path = "../nika-types", version = "0.118.2" }    # fetch traverse bound — ONE definition with the static checker
nika-chart   = { path = "../nika-chart", version = "0.118.2" }    # nika:chart — deterministic artifacts (zero-dep · byte-identical SVG · sha256 → trace chain)
url           = { workspace = true }   # traverse — same-origin math + normalization (the WHATWG parse the transport uses)
# data wave
jaq-core      = { workspace = true }   # nika:jq — THE data language
jaq-std       = { workspace = true }
jaq-json      = { workspace = true }
json-patch    = { workspace = true }   # nika:json_diff (RFC 6902) + nika:json_merge_patch (RFC 7396)
jsonschema    = { workspace = true }   # nika:validate — SSRF floor: workspace pins default-features=false (no http/file resolver); regression `validate_never_fetches_a_remote_ref` guards the flip
jiff          = { workspace = true }   # nika:date arithmetic/format · strftime
jiff-tzdb     = { workspace = true }   # nika:date named-zone resolution (bundled · sovereign · zero system read)
serde_yaml_bw = { workspace = true }   # nika:convert yaml + nika:validate format:yaml
toml_convert  = { workspace = true }   # nika:convert toml
csv           = { workspace = true }   # nika:convert csv
bytes         = { workspace = true }   # nika:fetch — Bytes (HttpResponse.body) handed to the blocking pool
blake3        = { workspace = true }   # nika:hash default algo
sha2          = { workspace = true }   # nika:hash sha256/sha512
uuid          = { workspace = true }   # nika:uuid v7/v4
# file wave
regex         = { workspace = true }   # nika:grep (RE2-class · the portable subset)
encoding_rs   = { workspace = true }   # nika:fetch — charset-aware decode for extraction modes
# media wave — nika:image_generate reuses jiff (created_at) + sha2 (asset
# hashes) + the in-crate base64/hex helpers; ZERO new runtime deps.
# plumbing
serde_json    = { workspace = true }
tokio         = { workspace = true }   # spawn_blocking — jq's sync CPU eval off the async executor
# the check-time contract side of the tools_json join (category · args ·
# required) — the SAME vocabulary the in-test drift guards pin to the
# ToolDef schemas (one source, no drift). Minimal features: the builtin
# catalog only, no provider/pricing data. L1.5→L0 downward (layering-clean).
nika-catalog  = { path = "../nika-catalog", version = "0.118.2", default-features = false, features = ["builtins-transforms"] }
# THE fs boundary predicate (`fit::glob_admits`), shared with the static check
# so the two verdicts cannot drift. Was dev-only, backing a differential test
# between "two independent implementations" — they drifted, in the permissive
# direction, and the differential was scoped away from the forms that broke.
# One implementation, like `nika_types::net` already is for hosts.
nika-cap = { path = "../nika-cap", version = "0.118.2" }

[dev-dependencies]
nika-kernel-mock = { path = "../nika-kernel-mock", version = "0.118.2" }
# test-only: the REAL filesystem (TokioFs) — the permits.fs boundary tests
# need a true `canonicalize` (resolves `..` + symlinks) against a /tmp scratch
# dir; MockFs::canonicalize is a no-op, so the escape cases can only be proven
# against the production impl. dev-only · L1.5→L1 downward (layering-clean).
nika-fs          = { path = "../nika-fs", version = "0.118.2" }
# test-only: an INDEPENDENT PNG decoder proving the mock image provider's
# hand-rolled stored-deflate encoder emits spec-valid files (not just bytes
# our own sniffer accepts).
png              = { workspace = true }
proptest         = { workspace = true }
tokio            = { workspace = true }

[package.metadata.lore]
daemon        = "forgeron"
archetype     = "kodama-forgeron"
spirit_role   = "l'établi aux 24 outils · chaque lame fait UNE chose · le modèle demande, l'atelier exécute, la whitelist garde la porte"
voice_pattern = "spoken"
layer         = "L1.5"
err_prefix    = "NIKA-BUILTIN-*"

[lints]
workspace = true
