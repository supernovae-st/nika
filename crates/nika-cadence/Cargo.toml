#
# nika-cadence · L0 · PUR · zéro I/O · zéro async.
# The arming-registry grammar + the next-slot calculator.
[package]
name        = "nika-cadence"
description = "L0 cadence engine — the arm: registry grammar and the pure next-slot calculator (hand-counted 5-field cron · embedded IANA tzdb · zero I/O)"

version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Foundation crate, never on crates.io (ADR-022).

[lints]
workspace = true

[dependencies]
serde         = { workspace = true }
serde_json    = { workspace = true }   # pure arm-ledger wire parsing/replay (W7)
serde_yaml_bw = { workspace = true }   # the panic-free vendored fork — the house YAML plane
thiserror     = { workspace = true }
jiff          = { workspace = true }
jiff-tzdb     = { workspace = true }   # the EMBEDDED IANA tzdb — never the host's zoneinfo
sha2          = { workspace = true }   # the firing machine's identities (SlotId · ArmGeneration — W7 · the source-identity convention)
nika-error    = { path = "../nika-error", version = "0.118.6" }
miette        = { workspace = true, features = ["fancy-no-backtrace"] }

[dev-dependencies]
proptest = { workspace = true }
insta    = { workspace = true }   # the emit renderer's unit snapshots (W3 · LE PONT)
