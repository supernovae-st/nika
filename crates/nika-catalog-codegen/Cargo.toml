[package]
name          = "nika-catalog-codegen"
description   = "Build-time TOML → Rust source codegen for nika-catalog. L0-tier-0 — pure transformation, build-time-only, zero nika-* deps."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Foundation crate — never on crates.io. See feedback_publish_false_foundation_strategy.md + ADR-017.

[dependencies]
toml        = "1.1"
phf_codegen = "0.13"
phf_shared  = { version = "0.13", features = ["unicase"] }
serde       = { workspace = true, features = ["derive"] }
unicase     = { workspace = true }
thiserror   = { workspace = true }

[dev-dependencies]
insta       = { workspace = true }
proptest    = { workspace = true }
rstest      = { workspace = true }
syn         = { version = "2.0", features = ["full", "parsing"] }

[lints]
workspace = true
