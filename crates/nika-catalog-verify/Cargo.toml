[package]
name          = "nika-catalog-verify"
description   = "Online verifier for nika-catalog — probes npm/pypi/oci registries and remote MCP endpoints, reports drift."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # L4 dev-tool binary — internal verifier, never on crates.io. See feedback_publish_false_foundation_strategy.md + ADR-017.

[[bin]]
name = "nika-catalog-verify"
path = "src/main.rs"

[dependencies]
nika-catalog = { path = "../nika-catalog", version = "0.116.2" }

clap       = { version = "4.5", features = ["derive"] }
tokio      = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }
reqwest    = { workspace = true, features = ["json", "http2"] }  # rustls-tls from the workspace pin
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures    = "0.3"

[dev-dependencies]
rstest = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["rstest"]  # dev-dep used in #[cfg(test)] blocks

[lints]
workspace = true
