# Serverless, before tax. The OpenAI-compatible adapter is NOT the biller.
# Official reasoning guide explicitly uses this unsuffixed wire model.
# Dedicated :fp4 deployments and project-specific endpoints are not aliases.
# No free-tier credit or EUR/USD conversion is assumed. Empty document hashes
# mean unavailable; the URL/date observation is not a byte-pinned document.
[[tariffs]]
provider = "openai"
billing_provider = "scaleway"
currency = "EUR"
output_token_param = "max_completion_tokens"
model = "gpt-oss-120b"
endpoints = ["https://api.scaleway.ai/v1/chat/completions"]
source = "https://www.scaleway.com/en/pricing/model-as-a-service/"
limits_source = "https://www.scaleway.com/en/docs/generative-apis/reference-content/supported-models/"
route_source = "https://www.scaleway.com/en/docs/generative-apis/how-to/query-reasoning-models/"
as_of = "2026-09-24"
source_sha256 = ""
limits_sha256 = ""
context_tokens = 131072
max_output_tokens = 32768
input_nano_per_token = 150
output_nano_per_token = 600
# No cache discount is qualified. Cache input costs the input rate.
cached_nano_per_token = 150

# This admission covers only bounded text requests to the exact free variant.
# The model itself also accepts images/video; those uses are not qualified here.
# No inference from a :free suffix, absent component, or 0/0
# models.dev row. No plugin, media-generation, BYOK or dynamic-router claim.
# The official model page also declares this variant free:
# https://openrouter.ai/qwen/qwen3.8-27b:free
# Both byte hashes below name the complete observed GET /api/v1/models body.
# Use its smaller max_completion_tokens bound, not the model-page context size.
[[tariffs]]
provider = "openrouter"
billing_provider = "openrouter"
currency = "USD"
output_token_param = "max_tokens"
model = "qwen/qwen3.8-27b:free"
endpoints = ["https://openrouter.ai/api/v1/chat/completions"]
