# Exact admission bindings, separate from the models.dev pricing snapshot.
# Peak rates; no time discount. USD/M tokens * 1000 = nano-USD/token.
# 1M interpreted conservatively as 1,048,576; 384K is explicitly 393,216
# in the official Chat Completions reference. Thinking is included in output.
schema = "nika/inference-admission@1.1"

