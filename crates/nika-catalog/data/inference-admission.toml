# Exact admission bindings, separate from the models.dev pricing snapshot.
# Peak rates; no time discount. USD/M tokens * 1000 = nano-USD/token.
# 1M interpreted conservatively as 1,048,576; 384K is explicitly 393,216
# in the official Chat Completions reference. Thinking is included in output.
# @1.2 (both optional): `cache_write_nano_per_token` prices input written to
# the provider's cache where the provider bills it apart; a row with it
# reserves its whole context at the higher of its input and write rates, and
# a row without it leaves a call that wrote the cache unknown. `served_models`
# lists the models the provider's own documentation names as served for
# `model` (a dated snapshot its replies report), each the same route; a
# model names one row of its provider.
# @1.3 (optional): `generation_tokens` is the most a route can generate
# whatever the request names, when no request parameter bounds its reasoning;
# the reservation covers it at the output rate in place of the requested output.
schema = "nika/inference-admission@1.3"

