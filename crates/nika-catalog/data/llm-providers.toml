# nika-catalog — LLM provider catalog
#
# Model folds into Provider via [[providers.models]] — no separate Model type.
# `default_model` and `cheap_model` are WIRE identifiers (the string sent to
# the provider's API, not a nickname). Token limits are a manually-curated
# snapshot and MUST be set explicitly per model.
#
# Schema invariants (enforced in build.rs):
#   * top-level `schema` matches LLM_PROVIDERS_SCHEMA constant
#   * unique provider id + aliases (case-insensitive, ASCII-only)
#   * every provider has at least one model
#   * default_model + cheap_model must appear in the models list (wire id match)
#   * context_window_tokens + max_output_tokens are REQUIRED (no silent default)
#   * tags must be sorted alphabetically (kebab-case) and deduplicated
#   * data_policy (@1.1 · optional) arrives whole or not at all — trains ∈
#     {no, yes, opt-out, split, passthrough} · zdr ∈ {yes, enterprise-only,
#     no, local} · retention + source non-empty. An ABSENT table means no
#     sourced policy vendored — never an implicit "does not train".

schema = "nika/llm-providers@1.1"

[[providers]]
id = "anthropic"
name = "Anthropic Claude"
aliases = ["claude"]
env_var = "ANTHROPIC_API_KEY"
key_prefixes = ["sk-ant-"]
default_model = "claude-sonnet-4-6"
cheap_model = "claude-haiku-4-5-20251001"
requires_key = true
description = "Claude models (Opus, Sonnet, Haiku)."
api_dialect = "anthropic"
tags = ["extended-thinking", "frontier", "function-calling", "long-context", "prompt-caching", "streaming", "structured-output", "vision"]
# No-train · 30d abuse window (flagged: up to 2y) · ZDR per-org, approval-gated.
data_policy = { trains = "no", retention = "30", zdr = "yes", source = "https://platform.claude.com/docs/en/manage-claude/api-and-data-retention + https://privacy.claude.com/en/articles/7996866 · 2026-07-29" }

[[providers.models]]
id = "sonnet"
model = "claude-sonnet-4-6"
context_window_tokens = 200000
max_output_tokens = 8192

[[providers.models]]
id = "haiku"
model = "claude-haiku-4-5-20251001"
context_window_tokens = 200000
max_output_tokens = 8192

[[providers]]
id = "openai"
name = "OpenAI"
aliases = ["gpt"]
env_var = "OPENAI_API_KEY"
# OpenAI ships two disjoint prefix families: project keys (sk-proj-) and
# classic user keys (sk-). Order matters — sk-proj- is checked first since
# it is more specific.
key_prefixes = ["sk-proj-", "sk-"]
default_model = "gpt-5.2"
cheap_model = "gpt-5-mini"
requires_key = true
description = "GPT-5.x, the o-series, and other OpenAI models."
api_dialect = "openai-chat"
tags = ["code-execution", "frontier", "function-calling", "image-gen", "prompt-caching", "realtime", "streaming", "vision"]
# No-train (opt-in only) · 30d abuse logs · ZDR approval-gated, eligible endpoints.
data_policy = { trains = "no", retention = "30", zdr = "yes", source = "https://developers.openai.com/api/docs/guides/your-data · 2026-07-29" }

[[providers.models]]
id = "gpt-5.2"
model = "gpt-5.2"
context_window_tokens = 272000
max_output_tokens = 128000

[[providers.models]]
id = "gpt-5-mini"
model = "gpt-5-mini"
context_window_tokens = 272000
max_output_tokens = 128000

