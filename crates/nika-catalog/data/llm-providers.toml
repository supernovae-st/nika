# the 2-model openai row — the catalog is the resolver allowlist, so
# the living seat enters the catalog.
[[providers.models]]
id = "gpt-4o-mini"
model = "gpt-4o-mini"
context_window_tokens = 128000
max_output_tokens = 16384

