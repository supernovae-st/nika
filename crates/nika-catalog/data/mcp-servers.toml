identifier = "@modelcontextprotocol/server-memory"
transport = "stdio"

[[servers.env_vars]]
name = "MEMORY_STORAGE_PATH"
required = true
is_secret = false
description = "API key / token for Memory."

[[servers]]
id = "pdf"
aliases = []
title = "PDF"
