id = "intercom"
aliases = []
title = "Intercom"
description = "Intercom customer messaging (remote OAuth endpoint)."
category = "communication"
pricing = "paid"
homepage = "https://www.intercom.com/"
last_verified = "2026-04-14"
tags = ["destructive", "official"]

[[servers.remotes]]
transport = "streamable-http"
url = "https://mcp.intercom.com/sse"
auth = "oauth"

[[servers]]
id = "grafana"
aliases = []
title = "Grafana"
description = "Grafana dashboards + alerting (Go binary via OCI image)."
category = "analytics"
pricing = "freemium"
homepage = "https://grafana.com/"
last_verified = "2026-04-14"
tags = ["official", "open-source", "read-only"]

[[servers.packages]]
registry_type = "oci"
identifier = "ghcr.io/grafana/mcp-grafana"
transport = "stdio"

[[servers.env_vars]]
name = "GRAFANA_URL"
required = true
is_secret = false
description = "Grafana instance URL."
