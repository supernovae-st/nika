# nika-catalog — MCP server catalog
#
# Aligns with the official MCP Registry schema (registry.modelcontextprotocol.io,
# v2025-12-11): each server exposes one or more local-install `packages`
# (npm/pypi/oci/cargo/mcpb) and/or one or more `remotes` (HTTP/SSE endpoints).
#
# Schema invariants (enforced in build.rs):
#   * top-level `schema` matches MCP_SERVERS_SCHEMA constant
#   * unique server id (case-insensitive, ASCII-only)
#   * packages.len() + remotes.len() >= 1
#   * category parses to a known Category variant
#   * pricing ∈ {free, freemium, paid}
#   * runner is pypi-only (non-pypi + runner = error; pypi + no runner = error)
#   * aliases never collide with any id or another alias

schema = "nika/mcp-servers@1.0"


# ─── Anthropic Official (3) ──────────────────────────

[[servers]]
id = "filesystem"
aliases = []
title = "Filesystem"
description = "Read and write local files with path-based access control."
category = "anthropic"
pricing = "free"
last_verified = "2026-04-14"
tags = ["destructive", "official"]

[[servers.packages]]
registry_type = "npm"
identifier = "@modelcontextprotocol/server-filesystem"
transport = "stdio"

[[servers.env_vars]]
name = "FILESYSTEM_ALLOWED_PATHS"
required = true
is_secret = false
description = "API key / token for Filesystem."

[[servers]]
id = "memory"
aliases = []
title = "Memory"
description = "Persistent key/value memory store."
category = "anthropic"
pricing = "free"
last_verified = "2026-04-14"
