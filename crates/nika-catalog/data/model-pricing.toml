# ── GENERATED · do not hand-edit ────────────────────────────
# Source: models.dev (MIT · anomalyco/models.dev) — see [meta].
# Refresh: bash scripts/refresh-pricing.sh
# Values: USD per 1M tokens. Lookup: exact match, then contains()
# fallback (first hit wins — longest patterns emitted first).
# Cache axes ride along when upstream discloses them; the cost
# math prices cache subsets at these rates (input-rate fallback).
# Token limits · open_weights · status are upstream's own words,
# carried verbatim. An OMITTED field means upstream did not say —
# read it as unknown, never as 0 / false.
# Research facts (@1.3 · energy · tokenizer · determinism) are
# vendored by the research lane with per-claim sources — this
# refresh never AUTHORS them, it re-attaches the live file's rows
# by (provider, model_pattern) and names any orphan loudly. An
# OMITTED research field means no sourced fact exists yet.

