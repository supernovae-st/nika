[package]
name          = "nika-check"
description   = "The static judgment crate — the workflow analyzer (Core conformance · the derived DAG edges every surface projects) plus the `nika check` pre-flight ladder (cost ceiling · secret-leak IFC · capability-escape fit · trifecta · policy · gate reachability · the RunCertificate) over the parsed AST. Pure, sync, zero I/O, zero async — an embedder gets static judgment without the CLI. Layer L0 — split from nika-schema 2026-07-21 (the 15k crate-size wall · the nika-graph/nika-dap precedents): the parser keeps its blueprint shape, the judgment lives here."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Foundation crate — never on crates.io. See feedback_publish_false_foundation_strategy.md + ADR-017.

[dependencies]
# L0-DEP-FANOUT-EXEMPT: nika-check is the static-judgment hub over the parsed
# AST — it assembles the L0 leaf vocabularies it judges against (nika-schema
# the parser/AST it analyzes · nika-cap the permits boundary the escapes and
# trifecta read · nika-catalog the closed builtin catalog the tool lints read
# · nika-types the suggest/type/net primitives the findings render ·
# nika-vocab the dead-form teaching texts). All five are dependency-light L0
# leaves; the fan-in is the same intentional shape nika-schema carries
# (ADR-027 · marker-based exemption) — the judgment crate is precisely where
# those vocabularies meet. The sixth, nika-check-analyzer, is NOT a foreign
# vocabulary: it is this crate's own analysis substrate, descended to a
# sibling member at the 15k wall (ONE unit, TWO members · D-2026-07-09-N1)
# and re-exported here at its historical `analyzer` path.
nika-check-analyzer = { path = "../nika-check-analyzer", version = "0.118.7" } # the analysis substrate this ladder judges on top of (member split, not a new unit)
nika-schema  = { path = "../nika-schema", version = "0.118.7" }  # the AST + parser + error voice this judges (the blueprint split: parser there, judgment here)
nika-cap     = { path = "../nika-cap", version = "0.118.7" }     # the permits boundary (PolicyViolation · TrifectaViolation · CertEffects on the public report)
nika-catalog = { path = "../nika-catalog", version = "0.118.7" } # the closed builtin catalog (all_builtins · find_builtin — the tool lints' one voice)
nika-types   = { path = "../nika-types", version = "0.118.7" }   # suggest (did-you-mean) · TypeExpr relations · net primitives (SSRF literals)
nika-vocab   = { path = "../nika-vocab", version = "0.118.7" }   # the dead-form teaching texts (foreign_namespace_teaching — consumed at home, no re-export hop)

serde      = { workspace = true }
serde_json = { workspace = true }
url        = { workspace = true }   # permits.net.http host extraction — the SAME WHATWG parse the runtime http effect connects with (no check↔runtime drift · pure/sync)
# jaq (the jq compile-check) and jsonschema (the schema meta-check) DESCENDED
# with the analysis substrate to nika-check-analyzer (ADR-115) — they were
# only ever reached from `analyzer::{jq_lint, schema_lint}`. The judgment
# ladder sheds four heavy deps by the move; the parity claim they carry (the
# SAME jaq and the SAME validator_for the runtime uses) travels with them,
# in the member's own manifest.

[dev-dependencies]
# the verb-theater example folds REAL engine events (the telemetry truth)
nika-event = { path = "../nika-event", version = "0.118.7" }
# the emitted⊆registered ratchet cross-checks every statically-emittable
# spec code against the embedded canon registry (spec/05-errors.md SSOT)
nika-pack  = { path = "../nika-pack", version = "0.118.7" }
uuid       = { workspace = true }    # the verb-theater tape's run/event ids
proptest   = { workspace = true }
serde      = { workspace = true }    # the conformance harness's expected.json derives
serde_json = { workspace = true }
criterion  = { workspace = true }    # gate-7 benches · parse + check hot paths

[[bench]]
name    = "refonte_baseline"
harness = false            # own harness: explicit p50/p95 + allocs + slope (W0 gate 8)

[[bench]]
name = "parser_bench"
harness = false

[package.metadata.cargo-machete]
ignored = ["proptest", "serde", "criterion"]  # macro-invisible dev uses (proptest! · derive(Deserialize) in the harness · bench harness)

[package.metadata.lore]
daemon        = "juge"
archetype     = "static-oracle"
spirit_role   = "juge le workflow avant qu'un jeton ne brûle · la vérité statique · jamais une exécution"
voice_pattern = "declarative"
layer         = "L0"
err_prefix    = "none"

[lints]
workspace = true
