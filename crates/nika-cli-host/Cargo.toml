[package]
name          = "nika-cli-host"
description   = "The host-integration member of the nika-cli unit (L4 · size-cap split per D-2026-07-09-N1 · ADR-110). Carries the integration control plane — client probes, wire writers, doctor receipts, the vendored client matrix, the context envelope and the trace-retention config. nika-cli re-exports every item at its historical path: one unit, two members."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Internal member of the nika-cli unit (the binary ships, the lib doesn't).

[dependencies]
nika-builtin   = { path = "../nika-builtin", version = "0.111.0-dev" }   # tool surfaces the welcome glance names
nika-catalog   = { path = "../nika-catalog", version = "0.111.0-dev" }   # env_var ladder (probe key presence)
nika-check     = { path = "../nika-check", version = "0.111.0-dev" }     # CheckReport surfaces the doctor/welcome glance reads
nika-dap       = { path = "../nika-dap", version = "0.111.0-dev" }       # workspace inventory (welcome glance · truncation law)
nika-display   = { path = "../nika-display", version = "0.111.0-dev" }   # theme (Role · Theme) + display::format::file_url
nika-models    = { path = "../nika-models", version = "0.111.0-dev" }    # model ids the probe/doctor ladders name
nika-pack      = { path = "../nika-pack", version = "0.111.0-dev" }      # embedded pack version (kit probes)
nika-providers = { path = "../nika-providers", version = "0.111.0-dev" } # ProviderRegistry + ExecutionLocus (the probe ladders)
nika-runtime   = { path = "../nika-runtime", version = "0.111.0-dev" }   # trace-store shapes retention walks + WorkflowPause/Stamper (notify · ADR-111)
nika-schema    = { path = "../nika-schema", version = "0.111.0-dev" }    # RawWorkflow (context envelope · glance)
nika-http      = { path = "../nika-http", version = "0.111.0-dev" }      # ReqwestHttp — the notify webhook client (ADR-111 · SSRF floor)
nika-event     = { path = "../nika-event", version = "0.111.0-dev" }     # Event + notify_delivered/notify_failed kinds (ADR-111)
nika-types     = { path = "../nika-types", version = "0.111.0-dev" }     # EventId · KeyValue · Timestamp (notify journal fields)
nika-kernel    = { path = "../nika-kernel", version = "0.111.0-dev" }    # HttpPostDyn seam the notify client posts through
nika-migrate   = { path = "../nika-migrate", version = "0.111.0-dev" }   # the codemods the fix_ladder arms ride (W1 · W2 · C2 · R5 · D1)
nika-harness   = { path = "../nika-harness", version = "0.111.0-dev", optional = true } # the adapter registry + probes (P3 B6 · access-harness)
sha2           = { workspace = true }   # ADR-111 — the deterministic CloudEvents id (trace × task)
hmac           = { workspace = true }   # ADR-111 — Standard Webhooks `v1,` HMAC-SHA256 signature
base64         = { workspace = true }   # ADR-111 — whsec_ secret decode + signature encoding
url            = { workspace = true }   # ADR-111 — notify target host extraction (boundary allowlist)
jiff           = { workspace = true }   # ADR-111 — the envelope's RFC 3339 `time` attribute
bytes          = { workspace = true }   # ADR-111 — the POST body rides the kernel HttpRequest shape
clap           = { workspace = true }                                # WireTarget ValueEnum (the wire verb's clap seam)
serde          = { workspace = true }                                # receipts + registry rows
serde_json     = { workspace = true }                                # --json surfaces (doctor receipt · wire plan)
serde_yaml_bw  = { workspace = true }                                # the vendored clients matrix parse (H6)
toml_edit      = { workspace = true }                                # wire codex/grok · comment-preserving TOML tables

[lints]
workspace = true

[features]
# Forwarded from nika-cli (one unit, two members): the doctor's local-model
# surface rides the same flag as the descended local-models member.
local-infer = ["nika-models/local-infer"]
# The harness access class (P3 B6): the adapter registry + probes join
# the doctor/probe surfaces. Off by default.
access-harness = ["dep:nika-harness"]

[dev-dependencies]
tempfile = { workspace = true }  # scratch dirs for the metrics + welcome test fixtures
