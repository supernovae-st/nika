# clients.yaml · the client × component matrix (kit-native · SSOT of client coverage)
#
# Law (mission nika-client-doors · 2026-07-30): a client's coverage is asserted
# HERE and nowhere else. README rows, docs pages and the everywhere map are
# projections of this file. Cells are closed enums; an absent or `none` cell
# REQUIRES a reason (per-cell `gaps:` or row-level `class_gap:`) · no silent caps.
# The gate (scripts/check-clients-matrix.py) proves: cells within enums · every
# gap reasoned · class-A manifests exist on disk · prose counts in manifests and
# READMEs equal the derived bundle counts · `wire:` values equal the shipped
# binary's target list (probed when a nika binary is present) · both directions.
#
# component keys (the 9 classes):
#   manifest skills subagents commands hooks rules mcp presentation scaffold
# mechanisms (closed enum):
#   native-manifest  the client's own plugin system loads it from our manifest
#   agent-plugin     the client reads the PORTABLE Agent Plugins 1.0.0 package
#                    (agent-plugins.org · published 2026-08-06) · root
#                    plugin.json + skills/ + mcp.json, and nothing else: v1
#                    standardises exactly two component types, so a cell can
#                    only be agent-plugin for manifest, skills or mcp
#   claude-layout    the client reads the Claude Code layout unported
#   wire             `nika wire <target>` writes the client's real config
#   init             `nika init` project scaffold covers it (AGENTS.md family ·
#                    .agents/skills authoring skill · editor wiring)
#   mcp-config       hand-carried MCP stanza documented in the client's guide
#   skill-pack       the kit-native skill file (agentskills.io shape)
#   none             the client's loader has no such surface · reason required
# statuses:
#   recon   mechanism known from primary sources · nothing shipped or proven
#   wired   shipped (manifest/wire/docs exist) · live proof fiche not in hand
#   proven  live fiche: version pair + a deterministic check line
schema_version: 1

clients:
