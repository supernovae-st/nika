    name: Claude Code
    class: A
    status: proven
    install: "claude plugin marketplace add supernovae-st/nika-plugins && claude plugin install nika@nika"
    components: {manifest: native-manifest, skills: native-manifest,
                 subagents: native-manifest, commands: native-manifest,
                 hooks: native-manifest, mcp: native-manifest,
                 presentation: native-manifest, scaffold: init}
    gaps:
      rules: "rules (.mdc) are a Cursor surface · Claude sessions get the law via the skill, the hooks and the init scaffold (CLAUDE.md family)"
    wire: claude
    proof: "live in-session load on the operator machine 2026-07-30 · 4 skills + 3 subagents + /nika:* commands + hooks + the 9-tool oracle registered"
    docs: integrations/clients/claude-code.mdx

