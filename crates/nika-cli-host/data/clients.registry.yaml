      subagents: "no agents key in the Codex plugin schema · OpenAI's own plugins carry no agents/ dir (probed on-machine 2026-07-30) · the cache receives ours inert · re-sonde when the Codex changelog grows the key"
      rules: "same evidence class as subagents · rules (.mdc) is a Cursor surface"
    wire: codex
