[package]
name          = "nika-cli"
description   = "The operator surface of the engine (L4) — the `nika` verb tree, the display fold (render = pure function of the event stream), and the flight-recorder reader. Seeded 2026-06-11 with display + `trace replay|show`; grows the full first-15-min suite (D-2026-06-10-N6) at the S6 build. Spec: docs/crate-specs/nika-cli.md."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Internal L4 interface crate (the binary ships, the lib doesn't).

[dependencies]
nika-event  = { path = "../nika-event", version = "0.92.0-dev" }  # the REAL event taxonomy (the fold input)
nika-types  = { path = "../nika-types", version = "0.92.0-dev" }  # Timestamp · KeyValue · ids
nika-schema = { path = "../nika-schema", version = "0.92.0-dev" } # parse + the ADR-092 check ladder (check · inspect · graph)
nika-error  = { path = "../nika-error", version = "0.92.0-dev" }  # the code registry (`nika explain`)
nika-pack   = { path = "../nika-pack", version = "0.92.0-dev" }   # the embedded language pack (`nika spec|schema|examples|new`)
nika-bm25   = { path = "../nika-bm25", version = "0.92.0-dev" }   # intent→template routing (`nika new` · the deterministic floor)
clap        = { workspace = true }                             # verb tree (completions + man derive later)
clap_complete = { workspace = true }                           # `nika completions <shell>` (spec §9)
serde       = { workspace = true }                             # graph projection envelope (§6)
serde_json  = { workspace = true }                             # trace NDJSON parse · --json surfaces
uuid        = { workspace = true }                             # deterministic demo EventIds
# The `nika run` composer (verbs/run/) wires the REAL shipped layers below
# the CLI — all strictly downward (L4 → L3/L2/L1.5/L1/L0). Before the run
# verb these were dev-deps (the e2e rehearsal only); the verb makes them
# load-bearing in src/.
nika-kernel      = { path = "../nika-kernel", version = "0.92.0-dev" }        # ProviderInferDyn · Secret · the seam traits
nika-runtime     = { path = "../nika-runtime", version = "0.92.0-dev" }       # the L3 executor (the composer drives it)
nika-providers   = { path = "../nika-providers", version = "0.92.0-dev" }     # ProviderRegistry — resolve provider/model + keys
nika-verb-infer  = { path = "../nika-verb-infer", version = "0.92.0-dev" }
nika-verb-exec   = { path = "../nika-verb-exec", version = "0.92.0-dev" }
nika-verb-invoke = { path = "../nika-verb-invoke", version = "0.92.0-dev" }
nika-verb-agent  = { path = "../nika-verb-agent", version = "0.92.0-dev" }
nika-builtin     = { path = "../nika-builtin", version = "0.92.0-dev" }       # BuiltinDispatcher — the tool plane (invoke + agent tools)
nika-fs          = { path = "../nika-fs", version = "0.92.0-dev" }            # TokioFs — the builtin tool plane's fs effect
nika-clock       = { path = "../nika-clock", version = "0.92.0-dev" }         # SystemClock — backoff + timeout + the date builtin
nika-http        = { path = "../nika-http", version = "0.92.0-dev" }          # ReqwestHttp — the registry + fetch effect
nika-exec-runner = { path = "../nika-exec-runner", version = "0.92.0-dev" }   # TokioShell — the exec verb's subprocess runner
nika-catalog     = { path = "../nika-catalog", version = "0.92.0-dev", features = ["providers"] }  # the env_var ladder per provider
nika-lsp         = { path = "../nika-lsp", version = "0.92.0-dev" }           # `nika lsp` — the language server (stdio · drives the editor extension)
nika-mcp         = { path = "../nika-mcp", version = "0.92.0-dev" }           # `nika mcp` — the MCP server (stdio · exposes check/explain to Cursor/Claude Desktop)
tokio            = { workspace = true }                                   # the bin's async entry (block the run on the executor)

[[bin]]
name = "nika-cli"
path = "src/main.rs"
# The final user-facing binary name (`nika`) is reserved for the L5
# composition root; this dev-named bin is the seed it will compose.

[dev-dependencies]
# Test-only seams: the mocks the e2e pipeline + the run-verb tests inject.
nika-kernel-mock = { path = "../nika-kernel-mock", version = "0.92.0-dev" }
proptest = { workspace = true }   # Gate 6 · the fold's order-independence property (tests/fold_property.rs)

[package.metadata.lore]
daemon        = "messager"
archetype     = "kodama-messager"
spirit_role   = "la voix du moteur vers l'humain · chaque glyphe dit la vérité du stream · l'audit avant l'action"
voice_pattern = "spoken"
layer         = "L4"
err_prefix    = "none"

[lints]
workspace = true
