[package]
name          = "nika-cli"
description   = "The operator surface of the engine (L4) — the `nika` verb tree and the display fold (render = pure function of the event stream); the flight-recorder reader lives in the `nika-trace` member (size-cap split 2026-08-11 · D-2026-07-09-N1). Seeded 2026-06-11 with display + `trace replay|show`; grows the full first-15-min suite (D-2026-06-10-N6) at the S6 build. Spec: docs/crate-specs/nika-cli.md."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Internal L4 interface crate (the binary ships, the lib doesn't).
default-run            = "nika" # the one public executable (ADR-135) · `cargo run` and `--bin` know no other name

[dependencies]
nika-event  = { path = "../nika-event", version = "0.118.2" }  # the REAL event taxonomy (the fold input)
nika-cli-host = { path = "../nika-cli-host", version = "0.118.2" } # the host-integration member (the 15k wall · ADR-110 · one unit, two members)
nika-session = { path = "../nika-session", version = "0.118.2", default-features = false }  # the native session (bare `nika` on a terminal · ADR-125)
nika-types  = { path = "../nika-types", version = "0.118.2" }  # Timestamp · KeyValue · ids
nika-schema = { path = "../nika-schema", version = "0.118.2" } # parse (check · inspect · graph · run)
nika-vocab  = { path = "../nika-vocab", version = "0.118.2" }
nika-cadence = { path = "../nika-cadence", version = "0.118.2" }  # the arm: grammar + the pure next-slot calculator (L4→L0)
nika-arm     = { path = "../nika-arm", version = "0.118.2" }      # descriptor-rooted ARM custody + the one firer (L4→L4)
nika-fs      = { path = "../nika-fs", version = "0.118.2" }       # descriptor-rooted sidecar ownership (L4→L1)
nika-execution = { path = "../nika-execution", version = "0.118.2" } # shared owned-byte admission/execution boundary (L4→L3)
nika-service-execution = { path = "../nika-service-execution", version = "0.118.2" } # the ONE shared production execution driver over an admitted world (L4→L3)
nika-serve   = { path = "../nika-serve", version = "0.118.2" }      # loopback HTTP mode of `nika serve` (W06)
jiff        = { workspace = true }  # the CLOCK — nika-cadence is pure and takes a Zoned; reading one is an L4 act  # the project file (ceiling — the --max-cost-usd flag's default rung · D-2026-08-11-N5)
nika-check  = { path = "../nika-check", version = "0.118.2" }  # the ADR-092 check ladder (the check verb · run gates · fix loop)
nika-graph = { path = "../nika-graph", version = "0.118.2" }   # the canonical projection (inspect --format json renders it)
nika-error  = { path = "../nika-error", version = "0.118.2" }  # the code registry (`nika explain`)
nika-pack   = { path = "../nika-pack", version = "0.118.2" }   # the embedded language pack (`nika spec|schema|examples|new`)
# nika-cap + url moved out with the drift compute (nika-dap hosts both now).
clap        = { workspace = true }                             # verb tree (completions + man derive later)
clap_complete = { workspace = true }                           # `nika completions <shell>` (spec §9)
serde_json  = { workspace = true }                             # trace NDJSON parse · --json surfaces
nix         = { workspace = true, features = ["fs"] }          # kernel advisory leases + stdout→stderr fold
# The `nika run` composer (verbs/run/compose.rs · the verb/agent/effect
# crates) descended to `nika_runtime::compose` 2026-07-22 (the 15k wall —
# compute descends, render stays); what remains below is what the CLI's own
# surfaces drive: the kernel seam bounds (the run gauntlet's generics),
# the L3 executor + its composer, the registry resolve half, the provider
# probe/explain ladders, the builtin tool list (tools · welcome), and the
# registry/anchor http clients.
nika-kernel      = { path = "../nika-kernel", version = "0.118.2" }        # ProviderInferDyn · Secret · the seam traits
nika-runtime     = { path = "../nika-runtime", version = "0.118.2" }       # the L3 executor + the descended production composer (compose · admit · SystemStamper)
nika-registry-client = { path = "../nika-registry-client", version = "0.118.2" }  # the L2 resolve/verify/cache half (this crate composes http + executor around it)
nika-providers   = { path = "../nika-providers", version = "0.118.2" }     # ProviderRegistry — the probe/explain ladders
nika-builtin     = { path = "../nika-builtin", version = "0.118.2" }       # tool_defs/tools_json — the tools + welcome surfaces
nika-http        = { path = "../nika-http", version = "0.118.2" }          # ReqwestHttp — the registry + trace-anchor clients (notify descended to nika-cli-host · ADR-111)
# keyring + minisign moved out with the trust plane (nika-dap::seal/sign host the custody + primitives now).
nika-catalog     = { path = "../nika-catalog", version = "0.118.2", features = ["providers", "pricing"] }  # env_var ladder + the rates the preflight shows
nika-lsp         = { path = "../nika-lsp", version = "0.118.2" }           # `nika lsp` — the language server (stdio · drives the editor extension)
nika-display     = { path = "../nika-display", version = "0.118.2" } # the run-comprehension surface (descended 2026-07-10 · re-exported at display::)
nika-onboard     = { path = "../nika-onboard", version = "0.118.2" } # the founding wizard + guided first workflow (descended 2026-07-12 · adapters at verbs/{init,new}.rs)
nika-dap         = { path = "../nika-dap", version = "0.118.2" }           # `nika dap` + the trace-forensics plane (chain · recover · otel · reproduce · store · retention — re-exported at the old verb paths)
nika-trace       = { path = "../nika-trace", version = "0.118.2" }         # the flight-recorder reader (trace verbs · evidence · receipt · forecast · the bin's trace arm — descended 2026-08-11 · re-exported at the old verb paths)
nika-mcp         = { path = "../nika-mcp", version = "0.118.2" }           # `nika mcp` — the MCP server (stdio · exposes check/explain to Cursor/Claude Desktop)
nika-models      = { path = "../nika-models", version = "0.118.2" }        # `nika model` — the local-models unit (ONE dir · Hub pull · serve glue · descended 2026-07-12)
nika-migrate     = { path = "../nika-migrate", version = "0.118.2" }       # the .nika.yaml envelope migrations (W1 map · W2 flow) — the fix verb's repairs (descended 2026-07-15 · size-cap · pure std)
tokio            = { workspace = true }                                   # the bin's async entry (block the run on the executor)

[features]
# Agentic CLI adapters (Claude Code · Codex · Gemini CLI · Kimi Code ·
# Qwen Code) ship in the default binary so `--access claude-code` is a
# known token without `--features access-harness`.
default = ["access-harness"]
# Build `nika model serve` for real: the candle backend + the loopback
# OpenAI-compat server (ADR-091 · ADR-093) — forwarded to the descended
# local-models member. Off by default (the lean-core contract).
local-infer = ["nika-models/local-infer", "nika-cli-host/local-infer"]
# Apple-GPU kernels for the local backend (macOS only — CI's Linux
# feature-matrix excludes this name, keep them aligned).
metal       = ["local-infer", "nika-models/metal"]
# The harness access class (D-2026-08-04-N1 · P3): `infer:`/`agent:`
# may delegate to the user's own agentic CLI. On by default so the
# official install.sh binary can pin `--access claude-code`.
access-harness = ["nika-runtime/access-harness", "nika-cli-host/access-harness", "nika-session/access-harness"]

[[bin]]
# The public executable is BORN `nika` (ADR-135): the same name from
# `cargo build --bin nika` through target/release/nika, the release
# tarball, the tap, the flake and the user's prompt — no rename at
# packaging, no second executable. The package keeps its layer name
# (`nika-cli`, L4); a future L5 composition root takes this target by
# moving it, never by renaming it. Gated by check-public-binary.sh and
# tests/public_binary_identity.rs.
name = "nika"
path = "src/main.rs"

[dev-dependencies]
nika-arm = { path = "../nika-arm", version = "0.118.2", features = ["test-support"] }
# Test-only seams: the mocks the e2e pipeline + the run-verb tests inject.
tempfile       = { workspace = true }                              # isolated filesystem fixtures across the CLI test estate
minisign       = { workspace = true }                              # the tier tests' keypair fixtures + the memory-fold teardown test (custody lives in nika-dap)
blake3         = { workspace = true }                              # the memory e2e's independent set-digest recompute (H13 fold shape)
sha2           = { workspace = true }                              # integration fixtures independently recompute composition/resume digests
nika-store       = { path = "../nika-store", version = "0.118.2" }  # F-P8 signed memory — the teardown fold test + the e2e's seeded store
nika-kernel-mock = { path = "../nika-kernel-mock", version = "0.118.2" }
nika-cap         = { path = "../nika-cap", version = "0.118.2" }           # the teardown memory-fold test's Integrity label (F-P8)
# The e2e rehearsals (tests/e2e_pipeline.rs · forecast_e2e.rs ·
# composition_e2e.rs) compose their OWN mock-seamed runtimes — the verb
# crates + the journal hash ride dev-only since the production composer
# descended to nika-runtime (2026-07-22).
nika-verb-infer  = { path = "../nika-verb-infer", version = "0.118.2" }
nika-verb-exec   = { path = "../nika-verb-exec", version = "0.118.2" }
nika-verb-invoke = { path = "../nika-verb-invoke", version = "0.118.2" }
nika-verb-agent  = { path = "../nika-verb-agent", version = "0.118.2" }
proptest = { workspace = true }   # Gate 6 · the fold's order-independence property (tests/fold_property.rs)
insta    = { workspace = true }   # the arm report's snapshot (PROUVÉ · DÉCLARÉ · orphelins)
uuid     = { workspace = true }   # test fixtures mint EventIds (the last prod use descended with the journal writer)
expectrl = { workspace = true }   # PTY e2e · the wizard conversation is TTY-gated — unreachable
                                  # from piped harnesses by construction (tests/wizard_pty.rs · unix)
serde         = { workspace = true } # the pack_examples_family manifest rows (derive)
serde_yaml_bw = { workspace = true } # parsing that manifest — the panic-free fork already in the tree (nika-builtin)

[package.metadata.lore]
daemon        = "messager"
archetype     = "kodama-messager"
spirit_role   = "la voix du moteur vers l'humain · chaque glyphe dit la vérité du stream · l'audit avant l'action"
voice_pattern = "spoken"
layer         = "L4"
err_prefix    = "none"

[lints]
workspace = true

# cargo-binstall resolution (#383). The release tarball carries the binary
# under its public name (`nika` — the bin target's own name, ADR-135), and the
# asset names use macos/linux × arm64/x64 rather than target triples, so the
# bin-dir and every pkg-url are spelled explicitly — binstall's default
# heuristics miss the assets and silently fall back to a source build.
# Verification rides the per-release SHA256SUMS.
[package.metadata.binstall]
pkg-fmt = "tgz"
bin-dir = "nika{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/nika-macos-arm64-{ version }.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/nika-macos-x64-{ version }.tar.gz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/nika-linux-x64-{ version }.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/nika-linux-arm64-{ version }.tar.gz"
