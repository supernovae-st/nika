[package]
name = "nika"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "DAG workflow runner for AI tasks with MCP integration"
readme = "../../README.md"

[[bin]]
name = "nika"
path = "src/main.rs"

[dependencies]
nika-core.workspace = true
nika-mcp.workspace = true
nika-provider.workspace = true
nika-runtime.workspace = true
nika-tui.workspace = true

# CLI
clap.workspace = true

# Async
tokio.workspace = true

# Serialization
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
toml.workspace = true

# Errors
thiserror.workspace = true
miette.workspace = true

# Utilities
chrono.workspace = true
colored.workspace = true
dotenvy.workspace = true
dirs.workspace = true
camino.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["tui"]
tui = []

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true
pretty_assertions.workspace = true
dashmap.workspace = true
wiremock.workspace = true
proptest.workspace = true
serial_test.workspace = true
rustc-hash.workspace = true
ratatui.workspace = true
rig-core.workspace = true
regex.workspace = true
nika-runtime = { workspace = true, features = ["test-fixtures"] }
