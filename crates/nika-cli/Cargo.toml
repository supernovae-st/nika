[package]
name          = "nika-cli"
description   = "The operator surface of the engine (L4) — the `nika` verb tree, the display fold (render = pure function of the event stream), and the flight-recorder reader. Seeded 2026-06-11 with display + `trace replay|show`; grows the full first-15-min suite (D-2026-06-10-N6) at the S6 build. Spec: docs/crate-specs/nika-cli.md."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Internal L4 interface crate (the binary ships, the lib doesn't).

[dependencies]
nika-event  = { path = "../nika-event", version = "0.80.0" }  # the REAL event taxonomy (the fold input)
nika-types  = { path = "../nika-types", version = "0.80.0" }  # Timestamp · KeyValue · ids
nika-schema = { path = "../nika-schema", version = "0.80.0" } # parse + the ADR-092 check ladder (check · inspect · graph)
nika-error  = { path = "../nika-error", version = "0.80.0" }  # the code registry (`nika explain`)
nika-pack   = { path = "../nika-pack", version = "0.80.0" }   # the embedded language pack (`nika spec|schema|examples|new`)
clap        = { workspace = true }                             # verb tree (completions + man derive later)
clap_complete = { workspace = true }                           # `nika completions <shell>` (spec §9)
serde       = { workspace = true }                             # graph projection envelope (§6)
serde_json  = { workspace = true }                             # trace NDJSON parse · --json surfaces
uuid        = { workspace = true }                             # deterministic demo EventIds

[[bin]]
name = "nika-cli"
path = "src/main.rs"
# The final user-facing binary name (`nika`) is reserved for the L5
# composition root; this dev-named bin is the seed it will compose.

[dev-dependencies]
# The e2e pipeline rehearsal (tests/e2e_pipeline.rs) composes the REAL
# shipped layers below the CLI — all strictly downward (L4 → L2/L1.5/L0.5/L0).
nika-kernel      = { path = "../nika-kernel", version = "0.80.0" }
nika-kernel-mock = { path = "../nika-kernel-mock", version = "0.80.0" }
nika-providers   = { path = "../nika-providers", version = "0.80.0" }
nika-verb-infer  = { path = "../nika-verb-infer", version = "0.80.0" }
nika-verb-exec   = { path = "../nika-verb-exec", version = "0.80.0" }
nika-verb-invoke = { path = "../nika-verb-invoke", version = "0.80.0" }
nika-verb-agent  = { path = "../nika-verb-agent", version = "0.80.0" }
nika-builtin     = { path = "../nika-builtin", version = "0.80.0" }
nika-runtime     = { path = "../nika-runtime", version = "0.80.0" }  # the L3 it rehearsed for — the floor flip (s18)
tokio            = { workspace = true }

[package.metadata.lore]
daemon        = "messager"
archetype     = "kodama-messager"
spirit_role   = "la voix du moteur vers l'humain · chaque glyphe dit la vérité du stream · l'audit avant l'action"
voice_pattern = "spoken"
layer         = "L4"
err_prefix    = "none"

[lints]
workspace = true
