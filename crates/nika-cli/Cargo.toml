[package]
name          = "nika-cli"
description   = "The operator surface of the engine (L4) — the `nika` verb tree, the display fold (render = pure function of the event stream), and the flight-recorder reader. Seeded 2026-06-11 with display + `trace replay|show`; grows the full first-15-min suite (D-2026-06-10-N6) at the S6 build. Spec: docs/crate-specs/nika-cli.md."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Internal L4 interface crate (the binary ships, the lib doesn't).

[dependencies]
nika-event  = { path = "../nika-event", version = "0.102.0" }  # the REAL event taxonomy (the fold input)
nika-types  = { path = "../nika-types", version = "0.102.0" }  # Timestamp · KeyValue · ids
nika-schema = { path = "../nika-schema", version = "0.102.0" } # parse + the ADR-092 check ladder (check · inspect · graph)
nika-graph = { path = "../nika-graph", version = "0.102.0" }   # the canonical projection (inspect --format json renders it)
nika-error  = { path = "../nika-error", version = "0.102.0" }  # the code registry (`nika explain`)
nika-pack   = { path = "../nika-pack", version = "0.102.0" }   # the embedded language pack (`nika spec|schema|examples|new`)
clap        = { workspace = true }                             # verb tree (completions + man derive later)
clap_complete = { workspace = true }                           # `nika completions <shell>` (spec §9)
serde       = { workspace = true }                             # graph projection envelope (§6)
serde_json  = { workspace = true }                             # trace NDJSON parse · --json surfaces
toml_edit   = { workspace = true }                             # wire codex · ~/.codex/config.toml (comment-preserving)
uuid        = { workspace = true }
# The `nika run` composer (verbs/run/) wires the REAL shipped layers below
# the CLI — all strictly downward (L4 → L3/L2/L1.5/L1/L0). Before the run
# verb these were dev-deps (the e2e rehearsal only); the verb makes them
# load-bearing in src/.
nika-kernel      = { path = "../nika-kernel", version = "0.102.0" }        # ProviderInferDyn · Secret · the seam traits
nika-runtime     = { path = "../nika-runtime", version = "0.102.0" }       # the L3 executor (the composer drives it)
nika-registry-client = { path = "../nika-registry-client", version = "0.102.0" }  # the L2 resolve/verify/cache half (this crate composes http + executor around it)
nika-providers   = { path = "../nika-providers", version = "0.102.0" }     # ProviderRegistry — resolve provider/model + keys
nika-verb-infer  = { path = "../nika-verb-infer", version = "0.102.0" }
nika-verb-exec   = { path = "../nika-verb-exec", version = "0.102.0" }
nika-verb-invoke = { path = "../nika-verb-invoke", version = "0.102.0" }
nika-verb-agent  = { path = "../nika-verb-agent", version = "0.102.0" }
nika-builtin     = { path = "../nika-builtin", version = "0.102.0" }       # BuiltinDispatcher — the tool plane (invoke + agent tools)
nika-fs          = { path = "../nika-fs", version = "0.102.0" }            # TokioFs — the builtin tool plane's fs effect
nika-clock       = { path = "../nika-clock", version = "0.102.0" }         # SystemClock — backoff + timeout + the date builtin
nika-http        = { path = "../nika-http", version = "0.102.0" }          # ReqwestHttp — the registry + fetch effect
nika-exec-runner = { path = "../nika-exec-runner", version = "0.102.0" }   # TokioShell — the exec verb's subprocess runner
nika-catalog     = { path = "../nika-catalog", version = "0.102.0", features = ["providers", "pricing"] }  # env_var ladder + the rates the preflight shows
nika-lsp         = { path = "../nika-lsp", version = "0.102.0" }           # `nika lsp` — the language server (stdio · drives the editor extension)
nika-display     = { path = "../nika-display", version = "0.102.0" } # the run-comprehension surface (descended 2026-07-10 · re-exported at display::)
nika-onboard     = { path = "../nika-onboard", version = "0.102.0" } # the founding wizard + guided first workflow (descended 2026-07-12 · adapters at verbs/{init,new}.rs)
nika-dap         = { path = "../nika-dap", version = "0.102.0" }           # `nika dap` + the trace-forensics plane (chain · recover · otel · reproduce · store · retention — re-exported at the old verb paths)
nika-mcp         = { path = "../nika-mcp", version = "0.102.0" }           # `nika mcp` — the MCP server (stdio · exposes check/explain to Cursor/Claude Desktop)
nika-models      = { path = "../nika-models", version = "0.102.0" }        # `nika model` — the local-models unit (ONE dir · Hub pull · serve glue · descended 2026-07-12)
tokio            = { workspace = true }                                   # the bin's async entry (block the run on the executor)

[features]
# Build `nika model serve` for real: the candle backend + the loopback
# OpenAI-compat server (ADR-091 · ADR-093) — forwarded to the descended
# local-models member. Off by default (the lean-core contract).
local-infer = ["nika-models/local-infer"]
# Apple-GPU kernels for the local backend (macOS only — CI's Linux
# feature-matrix excludes this name, keep them aligned).
metal       = ["local-infer", "nika-models/metal"]

[[bin]]
name = "nika-cli"
path = "src/main.rs"
# The final user-facing binary name (`nika`) is reserved for the L5
# composition root; this dev-named bin is the seed it will compose.

[dev-dependencies]
# Test-only seams: the mocks the e2e pipeline + the run-verb tests inject.
nika-kernel-mock = { path = "../nika-kernel-mock", version = "0.102.0" }
proptest = { workspace = true }   # Gate 6 · the fold's order-independence property (tests/fold_property.rs)
tempfile = { workspace = true }   # trace-file sink fixtures (`.nika/traces/` journal · sink.rs tests)
expectrl = { workspace = true }   # PTY e2e · the wizard conversation is TTY-gated — unreachable
                                  # from piped harnesses by construction (tests/wizard_pty.rs · unix)

[package.metadata.lore]
daemon        = "messager"
archetype     = "kodama-messager"
spirit_role   = "la voix du moteur vers l'humain · chaque glyphe dit la vérité du stream · l'audit avant l'action"
voice_pattern = "spoken"
layer         = "L4"
err_prefix    = "none"

[lints]
workspace = true

# cargo-binstall resolution (#383). The release tarball carries the binary
# under its PUBLIC name (`nika`, renamed at packaging — release.yml), and the
# asset names use macos/linux × arm64/x64 rather than target triples, so the
# bin-dir and every pkg-url are spelled explicitly — binstall's default
# heuristics miss the assets and silently fall back to a source build.
# Verification rides the per-release SHA256SUMS.
[package.metadata.binstall]
pkg-fmt = "tgz"
bin-dir = "nika{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/nika-macos-arm64-{ version }.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/nika-macos-x64-{ version }.tar.gz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/nika-linux-x64-{ version }.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/nika-linux-arm64-{ version }.tar.gz"
