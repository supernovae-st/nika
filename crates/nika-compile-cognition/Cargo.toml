# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name        = "nika-compile-cognition"
version.workspace = true
edition     = "2024"
rust-version = "1.88"
license     = "AGPL-3.0-or-later"
description = "The seats' doors of the Compile core: the COLD proposal (a private semantic plan a seat proposes, decoded, merged, composed), the native door (a seat writes the .nika, the compiler judges it), the sketch door (structure judged first, typed holes filled, the document emitted), the verified transform, the knowledge door and the bounded decision seats — above the deterministic compiler, never below it (ADR-140)."
repository  = "https://github.com/supernovae-st/nika"
publish     = false  # member of the nika-onboard unit — never on crates.io alone

[dependencies]
nika-compile        = { path = "../nika-compile", version = "0.123.0-preview.1" }        # the deterministic core and its stated surface, one unit in several members (ADR-140)
nika-compile-reader = { path = "../nika-compile-reader", version = "0.123.0-preview.1" } # the frozen reader and typed plan
nika-compile-fidelity = { path = "../nika-compile-fidelity", version = "0.123.0-preview.1" } # candidate read-back, fidelity and sketch laws (ADR-141)
nika-compile-seats = { path = "../nika-compile-seats", version = "0.123.0-preview.1" } # the decision seats and the rehearsal port a host lends a preparation, with the reasoning record (ADR-146)
nika-compile-clauses = { path = "../nika-compile-clauses", version = "0.123.0-preview.1" } # how one clause of a request reads: the parts, the prohibition reading, the clause key, the stated spellings (ADR-145)
nika-kernel = { path = "../nika-kernel", version = "0.123.0-preview.1" } # explicit authoring provider seam
nika-check  = { path = "../nika-check", version = "0.123.0-preview.1" }  # the same pure Check core the native door judges a candidate with
nika-pack   = { path = "../nika-pack", version = "0.123.0-preview.1" }   # the card, the skeletons and the examples a seat is shown
serde      = { workspace = true } # private semantic-plan decoder
serde_json = { workspace = true } # the plan, the provenance, the schema
sha2 = { workspace = true } # incremental identities in the existing authoring observer
serde_yaml_bw = { workspace = true } # the sketch's document, emitted deterministically
tokio      = { workspace = true } # bounded authoring timeout
# The transform verifier runs a seat's program on the seat's own example with the SAME jaq
# stack and capability policy the runtime `nika:jq` installs (mirrored, as nika-check-analyzer
# mirrors it: the layering hosts no shared engine below both).
jaq-core = { workspace = true }
jaq-std  = { workspace = true }
jaq-json = { workspace = true }
nika-cap = { path = "../nika-cap", version = "0.123.0-preview.1" }
nika-providers = { path = "../nika-providers", version = "0.123.0-preview.1", default-features = false } # the call observer a seat runs under and the counters it charges (the authority over them descended to nika-compile-seats, ADR-152)
unicode-normalization = { workspace = true, default-features = false } # the relation-canonical spelling probe compares texts under NFC (B24, prototype)

[package.metadata.lore]
daemon        = "forgeron"
archetype     = "compiler-smith"
spirit_role   = "seat authoring proposes, writes or sketches; the compiler judges, repairs and replays"

[lints]
workspace = true
