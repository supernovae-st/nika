# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name        = "nika-compile-fidelity"
version.workspace = true
edition     = "2024"
rust-version = "1.88"
license     = "AGPL-3.0-or-later"
description = "The laws a candidate .nika document is judged by, pure over the request, the reader's plan and the projected document, with the constrained sketch a seat proposes and the plan a candidate states by its structure. Layer L4 — a size-cap member of the nika-onboard unit (D-2026-07-09-N1 · ADR-141 · the ADR-137 and ADR-138 precedents), ascended from nika-compile-reader at the 15k prod-LOC wall; nika-compile depends on it and it depends on the reader, never the reverse."
repository  = "https://github.com/supernovae-st/nika"
publish     = false  # member of the nika-onboard unit — never on crates.io alone

[dependencies]
serde_json = { workspace = true } # the projected candidate document, the sketch and its fills
nika-compile-reader = { path = "../nika-compile-reader", version = "0.123.0-preview.1" } # the plan, the HOT vocabulary and the lexicon the laws read (ONE unit, several members · ADR-141)
nika-compile-behavior = { path = "../nika-compile-behavior", version = "0.123.0-preview.1" } # the behavioural contract kept at its historical behavior path, and the date-time shape classifier Law 25 reads (ADR-149)
nika-schema = { path = "../nika-schema", version = "0.123.0-preview.1" } # the approval laws read a gate on the AST the parser gives Check
nika-check-analyzer = { path = "../nika-check-analyzer", version = "0.123.0-preview.1" } # the refusal substitution (NEP-0020) those laws reuse
nika-cap = { path = "../nika-cap", version = "0.123.0-preview.1" } # the builtin reach and argument contracts the sketch admission laws read
nika-types = { path = "../nika-types", version = "0.123.0-preview.1" } # net::{host_is_blocked, is_documentation_host} — the one SSRF host oracle a selected source is judged by (L4→L0)
jaq-core = { workspace = true } # the jq a candidate states, parsed (never run) for the record-scope and instant-order laws (24 · 25)
sha2 = { workspace = true } # the digests the kept, semantic and source-revision records and an observation basis bind

[package.metadata.lore]
daemon        = "forgeron"
archetype     = "compiler-smith"
spirit_role   = "juge le candidat contre la demande et le plan, ne réécrit jamais · une loi refuse, le siège répare"

[lints]
workspace = true
