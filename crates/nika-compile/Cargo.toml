# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name        = "nika-compile"
version.workspace = true
edition     = "2024"
rust-version = "1.88"
license     = "AGPL-3.0-or-later"
description = "The deterministic Compile core: requests and outcomes, exact skeletons, HOT admission, record replay, native record application, assembly, edits and Check preview; a size-cap member of the nika-onboard unit (ADR-137, ADR-138, ADR-140)."
repository  = "https://github.com/supernovae-st/nika"
publish     = false  # member of the nika-onboard unit — never on crates.io alone

[dependencies]
nika-compile-reader = { path = "../nika-compile-reader", version = "0.120.3" } # the frozen reader and the typed plan, ONE unit in two members (the ADR-137 precedent)
nika-compile-fidelity = { path = "../nika-compile-fidelity", version = "0.120.3" } # the laws a candidate is judged by, the seat's sketch and a candidate's plan (ADR-141)
nika-catalog = { path = "../nika-catalog", version = "0.120.3" } # the seat's capability row: the reasoning cap is a shape the assembler sizes at Ready
serde = { workspace = true } # embedded retrieval index decoder
url = { workspace = true } # explicit HTTP binding host, never inferred authority
nika-pack    = { path = "../nika-pack", version = "0.120.3" }    # templates · examples (the scaffold corpus)
nika-bm25    = { path = "../nika-bm25", version = "0.120.3" }    # recall over the gallery
serde_json   = { workspace = true }                              # the plan, the provenance, the schema
sha2         = { workspace = true }                              # the intent sha a recorded plan is keyed by
nika-schema = { path = "../nika-schema", version = "0.120.3" }  # the same strict parser for in-memory candidates
nika-source = { path = "../nika-source", version = "0.120.3" }  # lexical program-source naming (#1684)
nika-check  = { path = "../nika-check", version = "0.120.3" }  # the same pure Check core for the preview
serde_yaml_bw = { workspace = true } # deterministic emission; edits retain semantic regions
marked-yaml = { workspace = true } # locate constant nodes with the canonical parser's YAML frontend
thiserror = { workspace = true }
miette = { workspace = true }
nika-error = { path = "../nika-error", version = "0.120.3" } # compiler machinery failures retain the canonical error voice
nika-vocab = { path = "../nika-vocab", version = "0.120.3" } # the project grammar's own spellings (`manqué:`) for a schedule's binding questions
tempfile = { workspace = true } # exclusive dest create + atomic overwrite persist

[dev-dependencies]
nika-kernel = { path = "../nika-kernel", version = "0.120.3" } # hermetic provider doubles
tokio = { workspace = true } # hermetic async compiler suites
nika-compile-cognition = { path = "../nika-compile-cognition", version = "0.120.3" } # the seats' doors the compile suites drive (a dev edge only: the unit's suites stay beside its core · ADR-140)
nika-providers = { path = "../nika-providers", version = "0.120.3", default-features = false } # real bounded registry in hermetic compiler tests
nix = { workspace = true, features = ["fs"] } # FIFO fixture for overwrite-refuse proof
nika-cadence = { path = "../nika-cadence", version = "0.120.3" } # the overlap enum the trigger questions mirror: its drift test

[package.metadata.lore]
daemon        = "forgeron"
archetype     = "compiler-smith"
spirit_role   = "lit l'intention, écrit le code, ne devine jamais · une clause demandée survit ou est questionnée"

[lints]
workspace = true
