[package]
name          = "nika-dap"
description   = "The Debug Adapter Protocol server (`nika dap`) — a READ-ONLY replay debugger over recorded run journals: breakpoints on task lines, stepping walks task settles, stepBack is free because the log is total (replay = re-render, never re-execute). Also the trace-forensics plane every reader shares: the chain walk, the tolerant recover, the OTLP projection, the reproduce comparison, the store scan and the retention policy — and since 2026-07-22 the journal's WRITE half (the run-journal sink + the `--json` NDJSON lane + the Tee) and the ADR-099 resume fold, descended from nika-cli's run verb at the 15k wall (compute descends, render stays). Layer L4 — split from nika-cli's verbs/dap 2026-07-09 (the crate-size cap · the nika-cap precedent), grown by the W0 trace descent the same day."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Internal L4 interface crate (the binary ships, the lib doesn't).

[dependencies]
nika-event  = { path = "../nika-event", version = "0.117.0" }   # the journal taxonomy the replayer walks
nika-schema = { path = "../nika-schema", version = "0.117.0" }  # parse the workflow for breakpoint line-mapping
nika-check  = { path = "../nika-check", version = "0.117.0" }  # the check ladder the evidence pack + inventory/drift scans fold
nika-types  = { path = "../nika-types", version = "0.117.0" }   # field values on replayed frames
nika-cap    = { path = "../nika-cap", version = "0.117.0" }     # BuiltinEffect — the drift scan's permit taxonomy
nika-vocab  = { path = "../nika-vocab", version = "0.117.0" }   # the project file (traces.keep — the retention ladder's file rung · D-2026-08-11-N5)
nika-runtime = { path = "../nika-runtime", version = "0.117.0" }  # the proof layer (preimage · receipt · semantic hash) — seal canonicalization + the evidence pack's fold
nika-kernel = { path = "../nika-kernel", version = "0.117.0" }   # the HttpPostDyn seam the anchor's submit rides
nika-store  = { path = "../nika-store", version = "0.117.0" }    # F-P8 signed memory — the teardown's `covers["memory"]` fold substrate (memory::attend)
sha2        = { workspace = true }                              # the chain primitive + source identity (one voice)
# The trust plane (descended from nika-cli 2026-07-21 · the 15k wall —
# compute descends, render stays): seal custody · workflow signing.
keyring     = { version = "4" }                                 # the run-key custody (OS keychain first)
minisign    = { version = "0.9", default-features = false }     # the seal + workflow signature primitive (the registry v0.2 voice, shared)
serde      = { workspace = true }                             # protocol frames (Request derive)
serde_json = { workspace = true }                             # DAP wire bodies + replay journal parse
thiserror  = { workspace = true }                             # RecoverError — typed, never a bare String (FCI-019)
url      = { workspace = true }                              # the drift scan's literal-URL host parse (pinned with the SSRF stack)
# The trust plane, second leg (2026-07-20 · compute descends, render stays):
# the anchor's two notaries (Rekor v2 + RFC 3161).
base64         = { workspace = true }   # the Rekor/RFC 3161 wire encoding
bytes          = { workspace = true }   # kernel HttpRequest bodies (the anchor's POSTs)
ed25519-dalek  = { workspace = true }   # Ed25519ph entry signature + checkpoint verification
der            = { workspace = true }   # RFC 3161 TimeStampReq/TSTInfo DER
cms            = { workspace = true }   # the TSA token's CMS SignedData verification
p384           = { workspace = true }   # the Sigstore TSA leaf's ECDSA P-384
jiff           = { workspace = true }   # the sidecar's `anchored_at` RFC 3339 render
uuid           = { workspace = true }   # the RFC 3161 nonce entropy

[dev-dependencies]
tempfile = { workspace = true }   # replay fixtures on disk
proptest = { workspace = true }   # stats totality (quantile_h7 over arbitrary finite samples)
nika-kernel-mock = { path = "../nika-kernel-mock", version = "0.117.0" }   # the anchor submit path's MockHttp seam
nika-display = { path = "../nika-display", version = "0.117.0" }   # the journal tests' demo event fixtures (test-only)
tokio    = { workspace = true }   # the submit path's test runtime (current-thread block_on)

[package.metadata.lore]
daemon        = "scribe"
archetype     = "time-walker-scribe"
spirit_role   = "rejoue le journal pas à pas · le passé répond au débogueur · jamais une ré-exécution"
voice_pattern = "spoken"
layer         = "L4"
err_prefix    = "none"

[lints]
workspace = true
