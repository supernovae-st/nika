[package]
name          = "nika-error"
description   = "Canonical error infrastructure for the Nika diamond. Layer L0 — pure, zero I/O, zero async."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true

[dependencies]
thiserror  = { workspace = true }
miette     = { workspace = true, features = ["fancy-no-backtrace"] }
serde      = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
uuid       = { workspace = true, optional = true }

[features]
default = ["serde"]
serde   = ["dep:serde", "dep:serde_json", "dep:uuid", "miette/serde"]

[dev-dependencies]
insta       = { workspace = true }
proptest    = { workspace = true }
rstest      = { workspace = true }
serde_json  = { workspace = true }
expect-test = { workspace = true }  # inline snapshots, see ADR-015

[package.metadata.cargo-machete]
ignored = ["insta", "rstest"]  # dev-deps used in #[cfg(test)] blocks

[lints]
workspace = true
