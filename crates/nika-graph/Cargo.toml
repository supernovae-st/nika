[package]
name        = "nika-graph"
version.workspace = true
edition     = "2024"
rust-version = "1.88"
license     = "AGPL-3.0-or-later"
description = "nika's canonical graph projection — graph_format: 2, typed edges (spec 03 §graph projection): ONE projector for every surface (CLI inspect · LSP semanticDocument · future canvases)"
repository  = "https://github.com/supernovae-st/nika"

[dependencies]
nika-schema = { path = "../nika-schema", version = "0.118.5" } # RawWorkflow — the parsed truth
nika-check  = { path = "../nika-check", version = "0.118.5" }  # CheckReport · the analyzed truth this projects
serde       = { workspace = true }                             # the wire shape (GraphDoc → JSON)


[package.metadata.lore]
daemon        = "navigatrice"
archetype     = "cartographer"
spirit_role   = "dessine la carte que toutes les surfaces lisent · une projection · zéro fork"

[lints]
workspace = true
