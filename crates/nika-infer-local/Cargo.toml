[package]
name          = "nika-infer-local"
description   = "Sovereign local inference (L1.5) — the all-Rust sidecar that replaces the ollama dependency for the local-first default. Speaks OpenAI-compat so Nika's existing wire client reaches it unchanged; runs in a supervised child process (crash-isolated). v1 scaffold ships the protocol + the device-agnostic Backend seam + a deterministic MockBackend; the candle backend lands behind the `local-infer` feature (off by default · ADR-091)."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Internal L1.5 service crate.

[dependencies]
serde         = { workspace = true }   # OpenAI-compat protocol types (the wire contract).
serde_json    = { workspace = true }   # request/response (de)serialization.
thiserror     = { workspace = true }   # internal typed errors.
trait-variant = { workspace = true }   # BackendDyn: Send companion (workspace async-trait convention).

# ── the candle backend (ADR-091) — OFF by default ────────────────────────────
# The default build links ZERO inference deps (the lean-core contract). The
# `local-infer` feature pulls the pure-Rust candle stack; pinned per-crate (no
# other workspace member uses them). `metal` adds the Apple-GPU kernels on top.
candle-core         = { version = "0.10", optional = true }
candle-transformers = { version = "0.10", optional = true }
# 0.22 converges on candle-core 0.10's own tokenizers — ONE copy in the tree
# (0.23 exists upstream but would re-duplicate until candle bumps).
tokenizers          = { version = "0.22", optional = true, default-features = false, features = ["onig"] }
tokio               = { workspace = true, optional = true }

[features]
local-infer = ["dep:candle-core", "dep:candle-transformers", "dep:tokenizers", "dep:tokio"]
metal       = ["local-infer", "candle-core/metal"]

[dev-dependencies]
tokio    = { workspace = true }
serde_json = { workspace = true }
proptest = { workspace = true }   # property tests for the logits/sampling algorithms

[package.metadata.lore]
daemon        = "forgeron"
archetype     = "kodama-forgeron"
spirit_role   = "forge l'inférence à la maison · le modèle tourne sous notre toit, jamais chez un daemon étranger · une voix souveraine en pur Rust"
voice_pattern = "silent"
layer         = "L1.5"
err_prefix    = "none"

[lints]
workspace = true
