[package]
name          = "nika-lsp"
description   = "The Nika language server (L4) — `nika lsp` (stdio). v0.1 surface: diagnostics from the ADR-092 check ladder, hover + completion from the locked language vocabulary, document symbols (tasks) and go-to-definition for task refs. Pure analysis modules over `nika-schema`; a sync `lsp-server` loop. Feeds the nika-vscode extension. Spec: docs/crate-specs/nika-lsp.md."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Internal L4 interface crate (driven by the `nika lsp` subcommand).

[dependencies]
nika-graph = { path = "../nika-graph", version = "0.118.7" }  # the canonical projection (nika/semanticDocument serves it verbatim)
nika-catalog = { path = "../nika-catalog", version = "0.118.7", features = ["builtins-transforms", "providers"] } # the tool/model vocabulary completions derive from (born-stale law: never hand-tabled)
nika-types   = { path = "../nika-types", version = "0.118.7" }  # ExtractMode::ALL — the mode: lane derives from the L0 vocabulary
nika-schema = { path = "../nika-schema", version = "0.118.7" }  # parse + RawWorkflow (the analysis source)
nika-vocab  = { path = "../nika-vocab", version = "0.118.7" }   # TASK_KEYS — the one task-shape list the parser refuses by and the editor offers by
nika-check  = { path = "../nika-check", version = "0.118.7" }  # the ADR-092 check ladder the diagnostics surface
lsp-server  = { workspace = true }                             # sync stdio JSON-RPC message loop
lsp-types   = { workspace = true }                             # LSP 3.17 protocol types
serde       = { workspace = true }                             # DeserializeOwned/Serialize bounds for the request dispatch
serde_json  = { workspace = true }                             # request/notification param (de)serialization
thiserror   = { workspace = true }                             # LspError (transport/protocol) enum

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }   # kill(pid, 0) — the safe parent-existence probe behind the `initialize` §processId watchdog (encapsulates the signal FFI → crate stays unsafe_code = forbid)

[dev-dependencies]
proptest = { workspace = true }   # Gate 6 — position round-trip + apply_change ≡ full replace
tempfile = { workspace = true }   # skills lane — workspace-walk fixtures on a real tempdir
nika-pack = { path = "../nika-pack", version = "0.118.7" }   # providers-order parity vs the vendored design tokens

[lib]
name = "nika_lsp"
path = "src/lib.rs"

[package.metadata.lore]
daemon        = "scribe"
archetype     = "kodama-scribe"
spirit_role   = "le scribe qui guide la main de l'auteur dans l'éditeur · chaque diagnostic enseigne avant que le token ne brûle · l'audit vit dans la frappe"
voice_pattern = "spoken"
layer         = "L4"
err_prefix    = "none"

[lints]
workspace = true

[[bench]]
name    = "refonte_lsp_baseline"
harness = false            # own harness: explicit p50/p95 + slope (W0 gate 8)
