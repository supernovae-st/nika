[package]
name          = "nika-mcp"
description   = "MCP server — exposes Nika's static surface (check · explain) as Model Context Protocol tools over stdio (newline-delimited JSON-RPC 2.0). Layer L4 — sovereign, hand-rolled, zero SDK."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Foundation crate — never on crates.io. See ADR-022.

[dependencies]
nika-schema = { path = "../nika-schema", version = "0.102.0" }  # parse + the ADR-092 check ladder (the `nika_check` tool)
nika-providers = { path = "../nika-providers", version = "0.102.0", default-features = false }  # the resolver law: every model resolves in THIS binary (#320)
nika-error  = { path = "../nika-error", version = "0.102.0" }   # code_help/lookup — numeric registry (the `nika_explain` tool)
nika-pack   = { path = "../nika-pack", version = "0.102.0" }    # embedded canon error_codes — the spec codes (NIKA-VAR-* · NIKA-DAG-* …)
# The embedded knowledge payloads (`nika_catalog` · `nika_tools`) — the SAME
# versioned projections `nika catalog|tools --json` emit (one builder per
# owning crate · zero duplication). L4→L0 / L4→L1.5, strictly downward.
nika-catalog = { path = "../nika-catalog", version = "0.102.0", default-features = false, features = ["serde", "capabilities"] }
nika-builtin = { path = "../nika-builtin", version = "0.102.0" }

serde_json  = { workspace = true }   # JSON-RPC 2.0 messages (the only wire format · no SDK)
thiserror   = { workspace = true }   # the transport error enum

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }   # Gate 6 · property tests on the JSON-RPC dispatcher (untrusted client input)
