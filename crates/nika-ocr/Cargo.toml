[package]
name          = "nika-ocr"
description   = "OCR text-extraction L1 effect crate — implements the nika-kernel OcrEngine trait (read + read_region) via the pure-Rust ocrs backend. Second computer-use L1 · M2.2."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Internal L1 effect crate (not a standalone crates.io satellite).

# Gate 2 (ADR linked) · ADR-081 = 7 L1 security guards forever; nika-ocr owns
# NONE mandatory (read-only inference · guards enforced upstream at capture).
[package.metadata.adr]
adr = ["ADR-003", "ADR-081"]

[dependencies]
nika-kernel = { path = "../nika-kernel", version = "0.116.0" }
# thiserror + miette removed 2026-06-10: OcrError + its derives moved to
# nika-kernel-core (Pattern A migration · FCI-023bis) — nika-ocr re-exports it.
# ocrs = pure-Rust OCR engine (detect → find lines → recognize) · rten = the
# tensor runtime, used directly for Model::load_file(.rten). tokio `rt` for
# spawn_blocking (the ocrs engine is synchronous + CPU-bound · run it off the
# async runtime per kernel CANCEL SAFETY contract). Models are NEVER bundled
# nor auto-downloaded (sovereignty Rule 1) — loaded from explicit local paths
# provisioned by the operator/daemon (see docs/crate-specs/nika-ocr.md §4).
ocrs        = { workspace = true }
rten        = { workspace = true }
tokio       = { workspace = true, features = ["rt"] }

[dev-dependencies]
# #[tokio::test] for the async OcrEngine methods · bytes builds Frame payloads ·
# proptest pins the pure helpers (RGBA→RGB · crop · bbox-union · Gate 6) ·
# tempfile feeds with_models() its model-load error paths headlessly.
tokio    = { workspace = true, features = ["macros", "rt"] }
bytes    = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
