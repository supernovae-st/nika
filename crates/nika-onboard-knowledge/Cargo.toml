#
# nika-onboard-knowledge · L4 · the knowledge door: the strict admission of a Foundry knowledge
# release, the releases this build embeds, the catalogue and the authoring pack. Size-cap member
# of the nika-onboard unit (D-2026-07-09-N1 · ADR-137 amendment): nika-onboard →
# nika-onboard-knowledge, never back.
[package]
name        = "nika-onboard-knowledge"
description = "L4 member of the nika-onboard unit — the knowledge door: the strict admission of a Foundry knowledge release against a trusted identity, the releases this build embeds, the catalogue and the authoring pack; nika-onboard re-exports it at knowledge:: (D-2026-07-09-N1 · ADR-137)"

version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Internal member of the nika-onboard unit.

[lints]
workspace = true

[dependencies]
nika-compile       = { path = "../nika-compile", version = "0.123.2" }       # AuthoringKnowledge · KnowledgeReference · CompileRequest
nika-compile-seats = { path = "../nika-compile-seats", version = "0.123.2" } # foundry (recall, release profile, catalogue, reach) · decide
nika-event         = { path = "../nika-event", version = "0.123.2" }         # shared knowledge byte identities
include_dir        = { workspace = true }                              # the current knowledge release, embedded whole from its directory
serde_json         = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] } # the knowledge door's collection on held directory descriptors (openat · fstatat · no follow, no unsafe)

[features]
# The synthetic knowledge release the strict door admits, for other doors' tests; never default.
test-support = []

[dev-dependencies]
tempfile = { workspace = true } # admission vectors and fixture roots on disk
tokio    = { workspace = true } # the whole-catalogue reach witnesses await a decision seat
