# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name        = "nika-onboard"
version.workspace = true
edition     = "2024"
rust-version = "1.88"
license     = "AGPL-3.0-or-later"
description = "nika's onboarding surface — project bootstrap (init), read-only gallery discovery and the stateless Compile core"
repository  = "https://github.com/supernovae-st/nika"

[dependencies]
nika-event = { path = "../nika-event", version = "0.121.0" } # shared knowledge byte identities
nika-compile = { path = "../nika-compile", version = "0.121.0" }
nika-compile-cognition = { path = "../nika-compile-cognition", version = "0.121.0" } # the seats' doors (ADR-140) · re-exported under `compile` beside the core
nika-pack    = { path = "../nika-pack", version = "0.121.0" }    # templates · examples (the scaffold corpus)
nika-vocab   = { path = "../nika-vocab", version = "0.121.0" }   # the project file — the wizard's starter nika.yaml rides its STARTER const (zero drift · D-2026-08-11-N5)
nika-bm25    = { path = "../nika-bm25", version = "0.121.0" }    # intent→template routing (the deterministic floor)
nika-display = { path = "../nika-display", version = "0.121.0" } # theme + chrome (rail · panel · banner)
nika-catalog = { path = "../nika-catalog", version = "0.121.0", features = ["providers"] } # the model menu (local first)
serde_json   = { workspace = true }                              # the canvas stamp (parse + re-emit settings.json)

nika-schema = { path = "../nika-schema", version = "0.121.0" }  # the same strict parser for in-memory compiler candidates
nika-source = { path = "../nika-source", version = "0.121.0" }  # lexical program-source naming (#1684)
nika-check  = { path = "../nika-check", version = "0.121.0" }  # the same pure Check core, without environment/admission probes



[dev-dependencies]
tempfile = { workspace = true }

[package.metadata.lore]
daemon        = "forgeron"
archetype     = "founder-smith"
spirit_role   = "forge le premier feu d'un projet · questions avant écritures · la preuve dans la première minute"

[lints]
workspace = true
