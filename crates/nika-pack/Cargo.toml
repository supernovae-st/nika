[package]
name          = "nika-pack"
description   = "The embedded language pack — the spec, schema, examples and templates of the language version this binary speaks. Layer L0 — pure data, zero I/O, zero async."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Foundation crate — never on crates.io.

[dependencies]
include_dir = { workspace = true }

[dev-dependencies]
sha2          = { workspace = true }
nika-catalog  = { path = "../nika-catalog", version = "0.109.0" }  # spec_parity — the vendored canon's 17 must resolve in the shipped catalog
serde_yaml_bw = { workspace = true }

[lints]
workspace = true
