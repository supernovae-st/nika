# design/motion.yaml — the per-verb MOTION identities · SSOT v1
# One name per verb across every surface: the website's tiles animate
# these as CSS keyframes, the VS Code canvas replays them, the engine's
# terminal speaks them as 1-cell braille frames (nika-display theme.rs
# mirrors this table — parity-gated like the glyph column).
# Schema: DTCG-aligned (duration/cubicBezier are standard token types);
# `terminal:` is the nika extension (a first — no design system ships a
# terminal motion target today).
#
# Gates · WIRED 2026-07-28 in scripts/design-projector.py `check_motion()`,
# after this file spent its whole life claiming five gates and having none.
# That is exactly how `slow` below came to disagree with the website's `slow`
# (see the duration note): a source of truth nobody reads is a draft.
#   1. every terminal frame is exactly ONE cell wide          ✅ wired
#      (scoped to `frames` · `exec.edge_frames` is a 4-cell rail window)
#   2. duration_ms divides evenly by the frame count, and the
#      resulting cadence is never faster than duration.fast    ✅ wired
#   3. css_keyframes exists verbatim site-side                 ❌ NOT WIRED,
#      and not claimed: `nika-motion-*` appears nowhere on the website. The
#      names below are a DECLARED binding awaiting its first consumer, not a
#      description of something shipping.
#   4. ascii_fallback is pure 0x20-0x7E                        ✅ wired
#   5. rest/done glyphs identical across families              ✅ wired
motion:
  version: 1
  # The named duration scale (ms · DTCG duration type). ONE quantum:
  # `fast` is both the terminal frame floor (gate 2) and the UI frame
  # cadence below. Consumers speak the names, never raw ms.
  #
  # ⚠ NAME COLLISION, deliberate and load-bearing. The website owns a SECOND
  # scale, also spelling `fast/base/slow`, in scripts/lens/graph/sets.yaml —
  # where `slow` is 600ms. These are not the same quantity and neither is
  # wrong: this scale is a FRAME CADENCE (a spinner tick, a braille step),
  # that one is a REVEAL duration (a section rising into view). 240 and 600
  # are both correct for what they measure. Do not "reconcile" them; the fix
  # if this keeps confusing readers is to rename one scale, not to average
  # two unrelated clocks into one wrong number.
  duration:
    fast: 80
    base: 160
    slow: 240
    deliberate: 400
  # The UI frame cadence — a NAME from the scale above (one clock).
  frame_interval: fast
  easing:
    calm: [0.4, 0.0, 0.6, 1.0]
    steady: [0.0, 0.0, 1.0, 1.0]
    snap: [0.2, 0.0, 0.0, 1.0]
    # spatial motion (transforms · layout travel) rides the house spring —
    # a linear() keypoint ramp (~4% overshoot) owned surface-side, bound
    # here BY NAME; effects (color · opacity) ride this cubicBezier.
    spatial: spring
    effects: [0.22, 1.0, 0.36, 1.0]
  families:
    infer:            # thinking → SAMPLING · scattered dots settle
      css_keyframes: nika-motion-infer
      easing: calm
      duration_ms: 800
      reduced: freeze   # prefers-reduced-motion per family · enum: keep-fade | freeze | off
      terminal:
        frames: ["⠂","⠈","⠐","⠄","⠠","⠁","⡀","⠃","⠘","⠨"]
        ascii_fallback: [".","o","O","o"]
        rest: "·"
        done: "●"
    exec:             # deterministic process → SCANLINE · a band sweeps
      css_keyframes: nika-motion-exec
      easing: steady
      duration_ms: 800
      reduced: freeze
      terminal:
        frames: ["⠉","⠒","⠤","⣀","⠤","⠒","⠉","⠒","⠤","⣀"]
        edge_frames: ["━╍┄┈","┈━╍┄","┄┈━╍","╍┄┈━"]   # the dag rail pulse window
        ascii_fallback: ["-","=","_","="]
        rest: "·"
        done: "●"
    invoke:           # round-trip call → ROUNDTRIP · the pendulum
      css_keyframes: nika-motion-invoke
      easing: snap
      duration_ms: 800
      reduced: freeze
      terminal:
        frames: ["⠆","⠃","⠉","⠘","⠰","⢠","⠰","⠘","⠉","⠃"]
        ascii_fallback: ["<","^",">","v"]
        rest: "·"
        done: "●"
    agent:            # autonomous loop → ORBIT · continuous rotation
      css_keyframes: nika-motion-agent
      easing: calm
      duration_ms: 800
      reduced: freeze
      terminal:
        frames: ["⠋","⠙","⠹","⠸","⠼","⠴","⠦","⠧","⠇","⠏"]
        ascii_fallback: ["|","/","-","\\"]
        rest: "·"
        done: "●"
  reduced_motion:     # css prefers-reduced-motion ≡ CLI NIKA_REDUCED_MOTION
    css: step-only
    terminal:
      collapse_to: ["·","●"]
      interval_ms: 1000
