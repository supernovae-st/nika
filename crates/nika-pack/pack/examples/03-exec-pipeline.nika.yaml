# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
#
# 03 · exec pipeline — shell, a conditional gate, cleanup on every outcome.
#
# Rehearse a test gate; announce a simulated deploy only if the suite passes.
# The suite and cleanup are demonstrations: no build or deployment is run.
# The interesting part is what "pass" means here: a red suite is not a broken
# workflow, it is a NUMBER the next task reads. The pipeline succeeds at
# finding out the tests failed.
#
# Demonstrates ·
#   - the `exec:` verb · its two doors, `shell:` (a line) and `command:` (an argv array)
#   - `capture: structured` · `.output` is { stdout, stderr, exit_code }
#   - `timeout:` · a Go-duration string, quoted · hard kill, retries included
#   - `run.clock` · naming the clock that deadline rides
#   - `with:` + `when:` · a DATA edge · the exit code crosses, the CEL gate reads it
#   - `after:` · a STATE edge · admit a task on the producer's outcome
#   - `after: {…: unwind}` · cleanup as a TASK · runs on every outcome of a
#     STARTED producer (success · fail · timeout · cancel) · a producer that
#     never started unwinds nothing
#
# The sample suite deliberately exits 1: the gate closes, the simulated deploy
# skips, the notice fires, and cleanup runs. Change `exit 1` to `exit 0` to
# exercise the other branch. Both paths need only the system shell and printf.
# To adapt this to real CI, replace the sample command, cleanup and deploy
# with YOUR operations and declare their filesystem/toolchain requirements.
# A sandbox refusal is an authority failure, not a failed test suite: it must
# stay red and cannot be converted into a passing `capture: structured` task.
#
# Run · nika run examples/03-exec-pipeline.nika.yaml

nika: exec-pipeline

run:
  # `timeout:` below has to be measured against something. Left undeclared it
  # rides the ambient system clock — the honest default, never a refusal — but
  # the choice is then invisible in the file. Say it out loud. (`virtual` runs
  # deadlines on a simulated clock instead, for tests that must not wait.)
  clock: system

permits:
  # `true`, not a program list, and the checker will tell you why if you try:
  # « a shell-string command cannot be verified against a `permits.exec`
  # program allowlist (a pipeline can launch any program) — use the array
  # form ». `test` below wants a shell line, so the allowlist is off the table
  # for this file. A workflow whose steps are all `command:` arrays can — and
  # should — write the tight form instead: `exec: ["printf"]`.
  exec: true

tasks:
  test:
    timeout: "5m"
    exec:
      # Door 1 · a shell line. Pipes, globs and `&&` work; a program allowlist
      # cannot bound it.
      shell: "printf 'sample suite: one failing test\n'; exit 1"
      capture: structured  # → { stdout, stderr, exit_code }

  release_lock:
    # The rehearsal announces cleanup; it creates or removes no real lock.
    # In real CI replace this with the matching release operation. The unwind
    # edge runs after every outcome of a STARTED producer, including failure.
    after: { test: unwind }
    exec:
      command: ["printf", "sample cleanup: release the build lock\n"]

  deploy:
    with:
      # `capture: structured` is what makes this possible: a non-zero exit
      # becomes DATA instead of a failure. The task above is ✔ and its
      # `.status` is `success` — it ran the command and found out. The red
      # suite lives in `exit_code`, and nowhere else. Gate on the number, and
      # never on the task status, or you will ship a broken build.
      exit_code: ${{ tasks.test.output.exit_code }}
    when: ${{ with.exit_code == 0 }}   # red → skipped · green → ship
    exec:
      # Door 2 · an argv array. No shell, no word-splitting, and every program
      # in it is checkable against `permits.exec`.
      command: ["printf", "sample deploy: the suite passed\n"]

  no_ship_notice:
    # The third edge kind. `with:` carries DATA and `when:` reads it; `after:`
    # carries STATE — it admits this task on the producer's outcome and nothing
    # else. The vocabulary is success · failure · skipped · terminal (terminal =
    # any settled state, cancelled included).
    #
    # `deploy` is skipped whenever the gate above closes, so this is "the ship
    # did not go out" — a fact you cannot express with a value edge, because a
    # skipped task has no value to bind.
    after:
      deploy: skipped
    exec:
      command: ["printf", "deploy skipped: the sample suite was red\n"]

# The task succeeded at running a deliberately failing sample suite:
#   {"suite_exit_code": 1, "task_status": "success"}
# Replacing `exit 1` with `exit 0` reports 0 and opens the simulated deploy.
outputs:
  suite_exit_code: ${{ tasks.test.output.exit_code }}
  task_status: ${{ tasks.test.status }}
