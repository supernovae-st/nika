# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
#
# 08 · The deployment's knobs — one authority, two roles.
#
# THREE authorities can put a value in a workflow: `inputs:` (declared once,
# supplied by the caller OR by its own `default:`) · `const:` (the author,
# fixed in the file) · `secrets:` (a governed store reference, masked, and it
# lives with the jobs · CONVENTIONS §3).
#
# A deployment knob — a region label, a verbosity switch — is an `inputs:`
# entry with `required: false` and a `default:`. It used to have a block of
# its own, `config:`, and that block is dead: it had zero usage in real work,
# its `default:` was its only possible source, and under the taint lattice
# `config.p` and `inputs.p` produced the SAME refusal by the same path. Two
# authorities the checker cannot tell apart are one authority.
#
# Demonstrates ·
#   - a knob · typed, `required: false`, `default:`-carrying
#   - declared-only resolution · an undeclared `${{ inputs.x }}` is
#     `NIKA-VAR-001` — the engine NEVER falls back to the OS environment
#     (spec/01-envelope.md §inputs)
#   - `when:` on a knob · a quiet run and a verbose run, one file
#   - who supplies what · `--var` reaches every `inputs:` entry, knob or not
#
# Run · nika run examples/08-config-values.nika.yaml
#   The verbose twin · flip `verbose.default` to true and run again.

nika: config-values

permits:
  tools: ["nika:jq", "nika:log"]

inputs:
  team:
    type: string
    default: "atelier"
    required: true
    description: "Whose report this is — the CALLER's value · --var team=…"
  # The deployment's knobs — `required: false` + a `default:` is what makes
  # this file runnable everywhere with nobody supplying anything. Never a
  # credential here: an input's value appears in logs and traces
  # (spec/01-envelope.md §secrets) — a value that must stay masked belongs
  # to `secrets:`.
  region:
    required: false
    type: string
    default: "eu"
    description: "Which region label the report carries"
  verbose:
    required: false
    type: bool
    default: false
    description: "Emit the debug dump task when true"

const:
  # The author's number — fixed in the file, never supplied by anyone.
  window_days: 7

tasks:
  report:
    invoke:
      tool: "nika:jq"
      args:
        input:
          team: "${{ inputs.team }}"
          region: "${{ inputs.region }}"
          window_days: "${{ const.window_days }}"
        expression: '. + {title: "\(.team) · \(.region) · last \(.window_days) days"}'

  debug_dump:
    with:
      report: ${{ tasks.report.output }}
    # A knob routes WORK — it never stands in for a human decision
    # (spec/10-authority.md · "a `when:` on an input flag is not a gate").
    # False by default: this task settles `skipped`, and nothing downstream
    # reads it, so the quiet run stays quiet. The shape rule (cel-subset)
    # wants an explicit relation — `== true`, never the bare flag.
    when: ${{ inputs.verbose == true }}
    invoke:
      tool: "nika:log"
      args:
        level: debug
        message: "full report object"
        data: "${{ with.report }}"

outputs:
  report:
    value: ${{ tasks.report.output }}
    description: "The shaped report · title carries team + region + window"
