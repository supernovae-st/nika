# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
#
# 18 · admit a finite batch before starting model calls
#
# At most eight items, two concurrent calls, 2048 tokens and 30s per item. Empty input returns []. max_parallel alone does not bound item count.
# Demonstrates · explicit input admission, narrow permits and typed results.
# Needs · no services or credentials for mock rehearsal.
# Run · nika run examples/18-bounded-batch.nika.yaml --model mock/echo
# GENERATED by scripts/template-rehearsals.py from templates/bounded-batch.nika.yaml.
nika: bounded-batch
model: ollama/qwen3.5:4b
run:
  clock: system
const:
  brief: Summarize the item in one sentence.
  items:
  - first note
  - second note
permits:
  tools:
  - nika:assert
  - nika:validate
tasks:
  validate:
    invoke:
      tool: nika:validate
      args:
        data: ${{ const.items }}
        format: json
        schema:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 4000
  admit:
    with:
      valid: ${{ tasks.validate.output.valid }}
    invoke:
      tool: nika:assert
      args:
        condition: ${{ with.valid }}
        message: Input violates the declared shape or size bound
  process:
    after:
      admit: success
    for_each:
      items: ${{ const.items }}
      max_parallel: 2
      fail_fast: true
    timeout: 30s
    infer:
      prompt: '${{ const.brief }}

        Item: ${{ item }}'
      max_tokens: 2048
      schema:
        type: object
        additionalProperties: false
        required:
        - summary
        properties:
          summary:
            type: string
            minLength: 1
            maxLength: 4000
outputs:
  results: '${{ tasks.process.output == null ? [] : tasks.process.output }}'
