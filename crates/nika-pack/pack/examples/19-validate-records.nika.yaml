# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
#
# 19 · reject malformed records before producing totals
#
# At most eight records. Closed objects reject unknown fields; integer amounts avoid string coercion. Validation returns a verdict; assert makes rejection terminal.
# Demonstrates · explicit input admission, narrow permits and typed results.
# Needs · no services or credentials for mock rehearsal.
# Run · nika run examples/19-validate-records.nika.yaml --model mock/echo
# GENERATED by scripts/template-rehearsals.py from templates/validate-records.nika.yaml.
nika: validate-records
const:
  batch: daily-orders
  records:
  - id: a
    amount: 10
  - id: b
    amount: 20
permits:
  tools:
  - nika:assert
  - nika:jq
  - nika:validate
tasks:
  validate:
    invoke:
      tool: nika:validate
      args:
        data: ${{ const.records }}
        format: json
        schema:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - amount
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 64
              amount:
                type: integer
                minimum: 0
                maximum: 1000000
  admit:
    with:
      valid: ${{ tasks.validate.output.valid }}
    invoke:
      tool: nika:assert
      args:
        condition: ${{ with.valid }}
        message: Input violates the declared shape or size bound
  report:
    after:
      admit: success
    invoke:
      tool: nika:jq
      args:
        input:
          batch: ${{ const.batch }}
          records: ${{ const.records }}
        expression: '{batch, count: (.records | length), total: ([.records[].amount] | add // 0)}'
outputs:
  report: ${{ tasks.report.output }}
