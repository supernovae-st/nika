# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
#
# 20 · compare two snapshots without model judgment
#
# Each snapshot has at most eight bounded strings. Set semantics remove duplicates and sort the output; an empty snapshot is meaningful.
# Demonstrates · explicit input admission, narrow permits and typed results.
# Needs · no services or credentials for mock rehearsal.
# Run · nika run examples/20-snapshot-diff.nika.yaml --model mock/echo
# GENERATED by scripts/template-rehearsals.py from templates/snapshot-diff.nika.yaml.
nika: snapshot-diff
const:
  resource: enabled-features
  before:
  - alpha
  - beta
  after:
  - beta
  - gamma
permits:
  tools:
  - nika:assert
  - nika:jq
  - nika:validate
tasks:
  validate:
    invoke:
      tool: nika:validate
      args:
        data:
          before: ${{ const.before }}
          after: ${{ const.after }}
        format: json
        schema:
          type: object
          additionalProperties: false
          required:
          - before
          - after
          properties:
            before:
              type: array
              maxItems: 8
              items:
                type: string
                minLength: 1
                maxLength: 4000
            after:
              type: array
              maxItems: 8
              items:
                type: string
                minLength: 1
                maxLength: 4000
  admit:
    with:
      valid: ${{ tasks.validate.output.valid }}
    invoke:
      tool: nika:assert
      args:
        condition: ${{ with.valid }}
        message: Input violates the declared shape or size bound
  diff:
    after:
      admit: success
    invoke:
      tool: nika:jq
      args:
        input:
          resource: ${{ const.resource }}
          before: ${{ const.before }}
          after: ${{ const.after }}
        expression: '{resource, added: ((.after - .before) | unique), removed: ((.before - .after) | unique),
          kept: ([.after[] as $id | select(.before | index($id)) | $id] | unique)}'
outputs:
  diff: ${{ tasks.diff.output }}
