# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
#
# 23 · collect independent reviews with a deterministic conjunction
#
# Two fixed review calls, each capped at 2048 tokens and 30s. Agreement is a routing signal, not proof that the document is correct; this workflow does not publish.
# Demonstrates · explicit input admission, narrow permits and typed results.
# Needs · no services or credentials for mock rehearsal.
# Run · nika run examples/23-parallel-review.nika.yaml --model mock/echo
# GENERATED by scripts/template-rehearsals.py from templates/parallel-review.nika.yaml.
nika: parallel-review
model: ollama/qwen3.5:4b
run:
  clock: system
const:
  document: The service processes jobs in order.
  law: '{ready: (.clarity.ready and .accuracy.ready), reviews: [.clarity, .accuracy]}'
  cases:
  - clarity:
      ready: false
      reason: fixture
    accuracy:
      ready: false
      reason: fixture
    expected: false
  - clarity:
      ready: false
      reason: fixture
    accuracy:
      ready: true
      reason: fixture
    expected: false
  - clarity:
      ready: true
      reason: fixture
    accuracy:
      ready: false
      reason: fixture
    expected: false
  - clarity:
      ready: true
      reason: fixture
    accuracy:
      ready: true
      reason: fixture
    expected: true
permits:
  tools:
  - nika:assert
  - nika:jq
  - nika:validate
tasks:
  validate:
    invoke:
      tool: nika:validate
      args:
        data: ${{ const.document }}
        format: json
        schema:
          type: string
          minLength: 1
          maxLength: 4000
  admit:
    with:
      valid: ${{ tasks.validate.output.valid }}
    invoke:
      tool: nika:assert
      args:
        condition: ${{ with.valid }}
        message: Input violates the declared shape or size bound
  clarity:
    after:
      admit: success
      law_holds: success
    timeout: 30s
    infer:
      prompt: 'Review clarity and missing explanations. Document: ${{ const.document }}'
      max_tokens: 2048
      schema:
        type: object
        additionalProperties: false
        required:
        - ready
        - reason
        properties:
          ready:
            type: boolean
          reason:
            type: string
            minLength: 1
            maxLength: 4000
  accuracy:
    after:
      admit: success
      law_holds: success
    timeout: 30s
    infer:
      prompt: 'Review unsupported claims and internal contradictions. Document: ${{ const.document }}'
      max_tokens: 2048
      schema:
        type: object
        additionalProperties: false
        required:
        - ready
        - reason
        properties:
          ready:
            type: boolean
          reason:
            type: string
            minLength: 1
            maxLength: 4000
  verdict:
    with:
      clarity: ${{ tasks.clarity.output }}
      accuracy: ${{ tasks.accuracy.output }}
    invoke:
      tool: nika:jq
      args:
        input:
          clarity: ${{ with.clarity }}
          accuracy: ${{ with.accuracy }}
        expression: ${{ const.law }}
    after:
      law_holds: success
  prove:
    for_each:
      items: ${{ const.cases }}
      max_parallel: 1
      fail_fast: true
    invoke:
      tool: nika:jq
      args:
        input: ${{ item }}
        expression: . as $case | (${{ const.law }}) | .ready == $case.expected
  law_holds:
    with:
      cases: ${{ tasks.prove.output }}
    invoke:
      tool: nika:assert
      args:
        condition: ${{ with.cases == [true, true, true, true] }}
        message: All four conjunction truth-table cases must pass
outputs:
  verdict: ${{ tasks.verdict.output }}
