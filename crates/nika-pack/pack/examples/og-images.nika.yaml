# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
#
# showcase · T1 starter · marketing / content
#
# Every landing page needs an OG image · this is the whole pipeline in one
# task: brief in → PNG on disk + provenance manifest out. Outputs carry
# PATHS + sha256, never image bytes (assets live on disk · workflows pass
# references).
#
# Demonstrates ·
#   - `nika:image_generate` · the stdlib §Media builtin
#   - `provider: mock` · deterministic, offline, zero keys — the honest
#     dry-run default; the enum is `mock | local | gemini | openai | xai`
#     (stdlib §Media), so flip ONE line for production:
#       provider: local     (sovereign · your LocalAI/Ollama/sd.cpp server)
#       provider: gemini    (GEMINI_API_KEY)
#       provider: openai    (OPENAI_API_KEY)
#       provider: xai       (XAI_API_KEY)
#   - `permits.fs.write` covering a DIRECTORY-writing builtin · see the
#     comment below: `check` and the run judge two different things
#   - `metadata:` · provenance fields ride into the manifest
#
# Run · nika run examples/og-images.nika.yaml

nika: og-images

permits:
  tools: ["nika:image_generate"]
  fs:
    # `check` judges the `output_dir:` ARGUMENT; the RUN gates every FINAL
    # file path under it — the images, their provenance sidecars and
    # manifest.json. `**` covers the directory AND every descendant, so one
    # entry answers both. Granting the bare directory (`out/og`) passes
    # `check` and then dies at run on the first asset: measured, and the
    # reason this comment exists.
    write: ["out/og/**"]

tasks:
  hero:
    invoke:
      tool: "nika:image_generate"
      args:
        provider: mock                # offline + deterministic · flip to local/gemini/openai to render for real
        prompt: "OG hero — a monarch butterfly over a deep-blue nebula, editorial photo, negative space left"
        aspect_ratio: "16:9"          # exact WxH is an openai gpt-image-2 feature · gemini folds to a size class
        n: 2                          # two variants to A/B
        output_dir: "out/og"
        filename_prefix: "launch-hero"
        metadata: { campaign: "launch", page_slug: "home" }

outputs:
  paths: ${{ tasks.hero.output.images }}
  manifest: ${{ tasks.hero.output.manifest_path }}
