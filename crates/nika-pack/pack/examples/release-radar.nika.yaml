# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
#
# showcase · T2 chain · devops / dependency hygiene
#
# « Did anything we depend on ship this week? » · answered from the project's
# own feeds. `mode: feed` parses RSS/Atom natively · the diff against last
# run's state means you only hear about what is NEW.
#
# ⚠ THIS FILE IS THE CORPUS'S ONE DELIBERATE RED · `nika check` exits 2 with
#   NIKA-SEC-009 (lethal trifecta · private read + untrusted ingress + external
#   egress with no dominating human gate). The gate over-approximates here:
#   the "egress" it names is `save_state`, a LOCAL write of the workflow's own
#   state file. The decision to leave this red rather than silence it is
#   recorded at the nika engine repo · docs/plans/2026-07-28-verdict-coverage.md
#   (§DECIDED · SEC-009). Adding a `nika:prompt` just to turn it green would
#   be ceremony bolted on to quiet a security message — on a file people copy.
#   A red gate reporting something true is the honest state.
#
# Demonstrates ·
#   - `nika:fetch` `mode: feed` · RSS/Atom parsing built in
#   - the state-file pattern · read last run → diff → write next state, one
#     path on both sides
#   - `nika:json_diff` (RFC 6902) · NEW entries are additions in the patch
#   - `on_error: on_codes: + recover:` · recovery SCOPED to one error code ·
#     first run has no state file, and only that is forgiven: a permission
#     error on the same read still fails loudly
#
# Needs · network to reach the feed host. The second hint `check` prints —
#   « `previous` reads out/release-radar.json which does not exist here · the
#   run would fail at that wave » — is measured FALSE for this file: the
#   `on_codes:` recovery below handles exactly that, and the first run exits 0
#   with an empty previous state. The hint cannot see the recovery.
#
# Run · nika run examples/release-radar.nika.yaml
#   Run it twice: the first run reports everything as new and writes the
#   state, the second reports only what shipped in between.
#   Offline rehearsal (zero key, deterministic) · add `--model mock/echo`.

nika: v1
workflow:
  id: release-radar
  description: "dependency release feed → diff vs last run → only the NEW ships"

model: ollama/qwen3.5:4b   # local · zero key · swap for any provider in the catalog

const:
  releases_feed: "https://github.com/tokio-rs/tokio/releases.atom"
  state_path: "out/release-radar.json"
permits:
  tools: ["nika:fetch", "nika:jq", "nika:json_diff", "nika:prompt", "nika:read", "nika:write"]
  fs:
    # The state-file pattern touches exactly ONE path, on both sides: read
    # last run's state, write the next. `const.state_path` names it and a run
    # cannot move a const, so the same literal is the whole boundary —
    # `create_dirs:` makes out/ underneath it on the first run.
    read: ["out/release-radar.json"]
    write: ["out/release-radar.json"]
  net:
    http: ["github.com"]   # the feed's host · net entries are exact names, never globs

tasks:
  # The human gate first (NIKA-SEC-009 · NEP-0002, the Rule of Two as a
  # static check). This boundary permits all three legs — private read
  # (the state file) + untrusted ingress (the release feed) + egress
  # (the state write) — so a blocking prompt (no default:) dominates the
  # flow before a byte moves. Headless surfaces pause durably and resume
  # with `--resume <trace> --answer approve=true`.
  approve:
    invoke:
      tool: "nika:prompt"
      args:
        message: "This run fetches ${{ const.releases_feed }}, diffs against ${{ const.state_path }}, and rewrites that state file. Proceed?"

  # First run has no state file · recover to an empty list.
  no_state:
    with:
      go: ${{ tasks.approve.output }}
    when: ${{ with.go == true }}
    invoke:
      tool: "nika:jq"
      args: { input: [], expression: "." }

  previous:
    with:
      go: ${{ tasks.approve.output }}
    when: ${{ with.go == true }}
    invoke:
      tool: "nika:read"
      args: { path: "${{ const.state_path }}" }
    on_error:
      on_codes: [NIKA-BUILTIN-READ-001]   # not-found ONLY · a permission error still fails loudly
      recover: ${{ tasks.no_state.output }}

  feed:
    with:
      go: ${{ tasks.approve.output }}
    when: ${{ with.go == true }}
    invoke:
      tool: "nika:fetch"
      args:
        url: "${{ const.releases_feed }}"
        mode: feed
    output:
      entries: "[.items[] | {title, url, published}]"
    on_error:
      # No network → this sample stands in for the RAW feed response, so it
      # carries `items:` exactly as `mode: feed` returns it and the `output:`
      # jq above runs over it unchanged. Recovering the BINDING's shape
      # instead makes the jq throw NIKA-VAR-004 — the recovery must mirror the
      # response, never the binding.
      recover:
        items:
          - { title: "tokio 1.48.0", url: "https://github.com/tokio-rs/tokio/releases/tag/tokio-1.48.0", published: "2026-07-21T09:14:00Z" }
          - { title: "tokio 1.47.1", url: "https://github.com/tokio-rs/tokio/releases/tag/tokio-1.47.1", published: "2026-07-02T16:40:00Z" }

  fresh:
    with:
      previous: ${{ tasks.previous.output }}
      entries: ${{ tasks.feed.entries }}
    invoke:
      tool: "nika:json_diff"
      args:
        before: "${{ with.previous }}"
        after: "${{ with.entries }}"

  digest:
    with:
      fresh: ${{ tasks.fresh.output }}
      entries: ${{ tasks.feed.entries }}
    when: ${{ size(with.fresh) > 0 }}
    infer:
      max_tokens: 500
      prompt: |
        New releases appeared on our dependency radar (RFC 6902 patch
        against last run) ·
        ${{ with.fresh }}
        Full current feed · ${{ with.entries }}
        Write 3 bullets · what shipped · whether it looks breaking ·
        what to check in our code.

  save_state:
    with:
      entries: ${{ tasks.feed.entries }}
    invoke:
      tool: "nika:write"
      args:
        path: "${{ const.state_path }}"
        content: "${{ with.entries }}"
        create_dirs: true
        overwrite: true

outputs:
  new_entries:
    value: ${{ tasks.fresh.output }}
    description: "RFC 6902 ops · empty = nothing new since last run"
  # Untyped on purpose: `digest` is `when:`-gated, so on a quiet week it is
  # SKIPPED and this reads null. Exporting it is also what keeps those tokens
  # from being dead spend — an infer whose output nothing consumes is paid for
  # and thrown away, and `check` says so.
  briefing: ${{ tasks.digest.output }}
