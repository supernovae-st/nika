# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
#
# snippet · the four-verb teaching set · exec — the machine runs a program
#
# `exec:` launches ONE program in argv form — never a shell, never a
# string to interpolate into. The `permits.exec` allowlist names it:
# an exec task under no grant refuses at check (NIKA-AUTH-006).
#
# Demonstrates ·
#   - `exec:` · the running verb, argv form
#   - `permits.exec` · the program allowlist the verb answers to
#
# This starter prints a literal message with the system printf. It needs no
# Cargo project or Rust toolchain. Replace the argv and permit together when
# adapting it; real builds also need their workspace and toolchain fs grants.
#
# House rule · a rehearsal file stays GREEN even where the sandbox refuses
# the confined program (macOS seatbelt · the `nika test` mock plane):
# `on_error: recover:` substitutes a LABELLED line, never the output the run
# could not produce.
#
# Run · nika run examples/snippets/run.nika.yaml
nika: run
permits:
  exec: ["printf"]
tasks:
  hello:
    exec:
      command: ["printf", "%s\n", "Hello from a confined program"]
    on_error:
      # Catch-all rehearsal arm (the house rule the header states) — a
      # labelled stand-in, never a fabricated program output.
      recover: "the sandbox refused the confined printf — no program ran (recovered rehearsal value)"

outputs:
  message: ${{ tasks.hello.output }}
