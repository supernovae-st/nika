# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
#
# TEMPLATE · agent-loop · plan fast → execute with a leashed agent → validate the typed result.
#
#   [plan]────▶[execute]─────▶[confirm]
#   infer       agent·leashed  nika:assert
#
# The open-ended job — research, review, triage — where the steps cannot be
# written in advance. A cheap `infer` drafts the plan, a LEASHED agent works
# it (bounded turns, bounded spend, a default-deny tool grant), and an assert
# refuses to pass an empty result downstream.
#
# Demonstrates ·
#   - `agent:` under the full leash · `max_turns` + `max_tokens_total` + an
#     explicit `tools:` list · nothing outside it is reachable
#   - `schema:` on the agent · the engine owns the final shape — a free-text
#     answer that misses it is re-asked; a `nika:done` result that misses it
#     is judged as it is on 0.118.7 (see `execute`) — never hand-instruct it
#   - `nika:assert` as a trust boundary · an empty run must not read as a
#     successful one
#
# Needs · nothing. Scaffolds and runs green in an empty directory.
#
# Run · nika run <file> --model mock/echo                    # offline rehearsal
#     · nika run <file> --var goal="triage the open bugs"    # a real seat
nika: agent-loop-template       # SLOT: kebab-case workflow id

# SLOT: a TOOL-CALLING model · local by default. This seat is measured, not
# assumed: `ollama/qwen2.5:14b` completes the planning call in ~65s under the
# ceiling below. A reasoning seat (`ollama/qwen3.5:4b`) spends its whole
# budget thinking and never emits JSON here — the guaranteed offline path is
# `--model mock/echo`, which needs no seat at all.
# `nika new` STAMPS this line: it rewrites `model:` with a seat this binary
# can resolve, and whatever rides on the line is dropped — so the teaching
# lives here, above it. Measured on 0.118.7: with no resolvable seat the
# stamp leaves `mock/echo`, the offline path this file guarantees.
model: mock/echo

inputs:
  goal:
    type: string
    required: true
    # A `required:` input still carries a `default:` here so the skeleton
    # RUNS the moment it is scaffolded. Replace the default with your job;
    # `--var goal=…` overrides it at any time.
    default: "<SLOT: what the agent must accomplish>"
    description: "What the agent must accomplish"   # SLOT

permits:                            # the blast radius · default-deny once present
  # Exactly what the body invokes: `nika:assert` (the confirm task) plus the
  # two the agent may call. No `fs:` — see the note on `tools:` below.
  tools: ["nika:assert", "nika:done", "nika:jq"]

tasks:
  plan:
    infer:
      prompt: "Break '${{ inputs.goal }}' into at most 4 concrete steps."   # SLOT
      # SLOT: the spend ceiling for the planning call. Size it for the SEAT,
      # not for the answer: a reasoning model spends tokens thinking before
      # it emits the first brace, and a ceiling that cuts it off mid-thought
      # fails NIKA-INFER-002 ("no JSON value found · the reply was cut off at
      # the token limit"). Measured — 400 starves qwen3.5:4b on this prompt.
      max_tokens: 2000
      schema:
        type: object
        additionalProperties: false
        required: [steps]
        properties:
          steps: { type: array, items: { type: string } }

  execute:
    with:
      # BOTH bindings, on purpose. The plan is a summary of the goal, never a
      # substitute for it: measured on five real seats, a prompt that carried
      # only the plan produced three GREEN runs with an invented or an empty
      # answer — the agent was asked to compute over data it never received,
      # and the assert below only proves non-emptiness. The goal rides in.
      goal: ${{ inputs.goal }}
      steps: ${{ tasks.plan.output.steps }}
    agent:
      # Describe the job in the prompt; declare its result shape in schema:.
      # The granted nika:done sentinel is required to finish this loop.
      # Text-only plans receive feedback within the turn/token budgets.
      # The engine validates the final result and can request a schema
      # repair within its configured retry allowance and task budgets.
      # A valid result shape does not prove the promised work was performed;
      # retain an independent check of the facts or artifacts you require.
      system: "You are a careful analyst. Work the plan step by step and report what you actually found."   # SLOT
      prompt: |
        Goal · ${{ with.goal }}
        Plan · ${{ with.steps }}
      tools:                        # SLOT: the MINIMUM grant for the job
        # Pure compute — this pair needs no filesystem, so the skeleton runs
        # anywhere. Granting the agent a tool here is only HALF a grant: every
        # call still crosses the workflow boundary above. Two halves, two
        # clocks — `tools:` vs `permits.tools` is judged STATICALLY at check
        # (since 0.115); adding `nika:read` to this list WITHOUT adding
        # `permits.fs.read` stays the run's verdict and fails at run with
        # `NIKA-SEC-004 · agent tool "nika:read" refused by the security
        # boundary` — measured, mid-loop, after the turns are paid for.
        - "nika:jq"
        - "nika:done"               # explicit completion · loop-owned
      max_turns: 15                 # SLOT: the loop bound
      max_tokens_total: 80000       # SLOT: cumulative input + output tokens
      schema:                       # SLOT: the typed final-message contract
        # Closed on purpose: declare every allowed result field here.
        # Keep extra fields out of the result; schema repair is bounded,
        # and exhausting that allowance is a failure.
        type: object
        additionalProperties: false
        required: [findings]
        properties:
          findings:
            type: array
            minItems: 1               # an empty list is a schema miss, never a green run
            items: { type: string, minLength: 1 }

  confirm:
    with:
      # The schema above already refuses an empty list and an empty string;
      # this assert is the trust boundary downstream code can SEE, and the
      # place for YOUR law once the goal fixes one (a count · a required id ·
      # a value you computed by hand). `size` counts the collection in this
      # expression here — a per-item rule belongs in the schema
      # (as above) or in a `nika:jq` law. No static law catches an INVENTED
      # answer: that gap closes upstream, by binding the goal into the agent.
      has_findings: ${{ size(tasks.execute.output.findings) > 0 }}   # the check crosses as ONE boundary expression · SLOT: your law
    invoke:
      tool: "nika:assert"
      args:
        condition: "${{ with.has_findings }}"
        message: "Agent returned no findings, do not trust an empty run"   # SLOT

outputs:
  findings:
    value: ${{ tasks.execute.output.findings }}
    description: "The agent's typed findings"   # SLOT
