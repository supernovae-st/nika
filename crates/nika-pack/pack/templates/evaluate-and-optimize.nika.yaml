# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
#
# TEMPLATE · evaluate-and-optimize · draft → two fixed critique/revision rounds.
#
# The bound is structural: exactly two revision rounds are unrolled in the DAG,
# followed by one score-only measurement of the final result. The model cannot
# add another turn, and every infer has its own token ceiling.
#
# Needs · nothing. Runs offline in an empty directory with mock/echo.
#
# CEILINGS · every infer is capped, and a cap is sized for the SEAT, not for
#   the answer: a reasoning seat thinks inside `max_tokens`, so a cap that fits
#   the visible answer alone starves it (the thinking trace eats the cap and
#   the answer is blank · NIKA-INFER-004 at run). The capacity gate names the
#   floor BEFORE any spend, but only for the seat it is asked about — this
#   file's envelope seat is `mock/echo`, which checks clean with ANY cap.
#   Measured on 0.118.7 across five real seats: `max_tokens: 200` on the three
#   critique steps was refused at check for the three reasoning seats («too
#   small for reasoning seat … at least 256»). Pin the seat when you check:
#     nika check <file> --model <provider/model>
#
# Run · nika run <file> --model mock/echo
nika: evaluate-and-optimize       # SLOT: kebab-case workflow id

# SLOT: the seat this file runs on — a local one first (`ollama/…`), a hosted
# one when the job needs it. `nika new` STAMPS this line: it rewrites `model:`
# with a seat this binary can resolve, and whatever rides on the line is
# dropped — a marker THERE never reaches the reader, so it lives here.
# Measured on 0.118.7: with no resolvable seat the stamp leaves `mock/echo`.
model: mock/echo

const:
  brief: "<SLOT: the deliverable to draft, critique and revise>"

permits: {}

tasks:
  draft:
    infer:
      max_tokens: 300               # SLOT: the draft ceiling · sized for the SEAT (see CEILINGS)
      prompt: "Draft this deliverable: ${{ const.brief }}"
      schema:
        type: object
        additionalProperties: false
        required: [text]
        properties:
          text: { type: string, minLength: 1 }

  evaluate_1:
    with:
      candidate: ${{ tasks.draft.output.text }}
    infer:
      max_tokens: 400               # SLOT: the critique ceiling · a reasoning seat's floor is 256 here (measured)
      prompt: |
        Critique this candidate against the brief. Name one concrete repair.
        Brief: ${{ const.brief }}
        Candidate: ${{ with.candidate }}
      schema:
        type: object
        additionalProperties: false
        required: [score, repair]
        properties:
          score: { type: integer, minimum: 0, maximum: 100 }
          repair: { type: string, minLength: 1 }

  optimize_1:
    with:
      candidate: ${{ tasks.draft.output.text }}
      repair: ${{ tasks.evaluate_1.output.repair }}
    infer:
      max_tokens: 300               # SLOT: the revision ceiling · sized for the SEAT
      prompt: |
        Revise the candidate using the repair, without changing the brief.
        Candidate: ${{ with.candidate }}
        Repair: ${{ with.repair }}
      schema:
        type: object
        additionalProperties: false
        required: [text]
        properties:
          text: { type: string, minLength: 1 }

  evaluate_2:
    with:
      candidate: ${{ tasks.optimize_1.output.text }}
    infer:
      max_tokens: 400               # SLOT: idem · the same floor applies
      prompt: |
        Critique this revision against the same brief. Name one final repair.
        Brief: ${{ const.brief }}
        Candidate: ${{ with.candidate }}
      schema:
        type: object
        additionalProperties: false
        required: [score, repair]
        properties:
          score: { type: integer, minimum: 0, maximum: 100 }
          repair: { type: string, minLength: 1 }

  optimize_2:
    with:
      candidate: ${{ tasks.optimize_1.output.text }}
      repair: ${{ tasks.evaluate_2.output.repair }}
    infer:
      max_tokens: 300               # SLOT: the final revision ceiling · sized for the SEAT
      prompt: |
        Produce the final revision using the last repair.
        Candidate: ${{ with.candidate }}
        Repair: ${{ with.repair }}
      schema:
        type: object
        additionalProperties: false
        required: [text]
        properties:
          text: { type: string, minLength: 1 }

  final_evaluate:
    with:
      candidate: ${{ tasks.optimize_2.output.text }}
    infer:
      max_tokens: 400               # SLOT: the score-only ceiling · the same floor applies
      prompt: |
        Score the final candidate against the brief. Evaluate the candidate
        exactly as written without proposing another revision.
        Brief: ${{ const.brief }}
        Candidate: ${{ with.candidate }}
      schema:
        type: object
        additionalProperties: false
        required: [score, reason]
        properties:
          score: { type: integer, minimum: 0, maximum: 100 }
          reason: { type: string, minLength: 1 }

outputs:
  result: ${{ tasks.optimize_2.output.text }}
  final_score: ${{ tasks.final_evaluate.output.score }}
