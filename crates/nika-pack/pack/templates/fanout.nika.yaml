# SPDX-License-Identifier: Apache-2.0
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
#
# TEMPLATE · fanout · discover a collection → process every item in parallel → merge.
#
#   [discover]──▶[process ∥×N]───▶[survivors]──▶[merge]
#   nika:glob     for_each·infer    nika:jq        infer
#   [prove]──▶[law_holds]────────────┘  the fan-in law, proven on a fixture first
#   nika:jq    nika:assert
#
# The "do this for EVERY one of them" job, where you do not know how many there
# are until the run starts. Discovery yields a collection, `for_each` fans it
# out under a real leash (bounded parallelism, per-item timeout, retries), one
# bad item cannot sink the batch, and the survivors merge into a single answer.
#
# Demonstrates ·
#   - `for_each:` over a RUNTIME collection · the fan width is discovered, never
#     written down
#   - the full leash · `for_each.max_parallel` + `timeout` + `retry` +
#     `for_each.fail_fast: false`
#   - `on_error: recover: null` + a null-aware fan-in · a failed item becomes a
#     hole at its index, order is preserved, the batch survives
#   - pin the glob · `*.md` also matches README.md (hint `glob-readme`)
#   - `--resume` cache-hits the whole fan when items + definition match,
#     including prompts that read `item.field`
#   - extract facts (`type: integer`), then `nika:jq` is the law —
#     do not pay a second infer to name the level (`13-extract-then-law`)
#   - prove the fan-in law on a const fixture + `nika:assert` BEFORE it meets
#     real data (`prove` → `law_holds` · the `unproven-law` hint stays silent)
#
# Needs · nothing. Scaffolds and runs green in an empty directory — an empty
#   discovery skips the fan-out and the fan-in still returns a value.
#
# COST · `check` reads `process` as UNBOUNDED by construction: the fan width
#   is discovered at run, so no static ceiling exists (measured on 0.118.7 ·
#   « for_each over an expression (unknown count) · 1 uncapped task »). The
#   per-item ceiling below bounds each CALL; the RUN bounds the FAN. The cap
#   admits this file (measured on a real seat with `--max-cost-usd 0.10`: the
#   static floor stays under the cap because the width is unknown) and a
#   crossing mid-run is NIKA-1704 — the crossing call completes and counts,
#   nothing new starts.
#
# Run · nika run <file> --model mock/echo                            # offline rehearsal
#       nika run <file> --model <provider/model> --max-cost-usd 0.25     # a real seat · the fan's cap
nika: fanout-template       # SLOT: kebab-case workflow id

# SLOT: provider/model · local · zero key. House seat — `ollama/qwen3.5:4b`,
# a THINKING model: the ceilings below leave room for the think block, which
# counts against `max_tokens` too.
# `--model mock/echo` needs no seat and is the path this file guarantees.
# `nika new` STAMPS this line: it rewrites `model:` with a seat this binary
# can resolve, and whatever rides on the line is dropped — so the teaching
# lives here, above it. Measured on 0.118.7: with no resolvable seat the
# stamp leaves `mock/echo`, the offline path this file guarantees.
model: mock/echo

run:
  # A `timeout:` is a deadline, and a deadline needs a clock. Declaring it says
  # out loud which one: `system` is the ambient wall clock (the honest default);
  # `virtual` drives a simulated clock for deterministic tests.
  clock: system

const:
  collection_source: "./items"      # SLOT: where the collection comes from
  # Known answers for the fan-in law — computed by hand, never by a model.
  # `prove` feeds them through the SAME jq `survivors` uses; a drift between
  # the two is a red assert, not a quietly wrong report.
  law_cases: ["kept", null, "also kept"]

permits:
  tools: ["nika:assert", "nika:glob", "nika:jq", "nika:read"]
  fs:
    # TWO entries, and both earn their place. `nika:glob` is gated on the
    # DIRECTORY it walks, not on the files it returns — measured: with
    # `./items/*.md` here (the pattern) the run dies `NIKA-SEC-004 ·
    # ./items resolves outside the declared permits.fs.read boundary`,
    # because `*` never crosses `/` and so never matches `./items` itself.
    # And `nika:read` is gated on the FILES — a directory grant does not
    # cover its children (measured: dir-only here made every per-item read
    # die SEC-004, `recover: null` swallowed each, and the model was
    # handed nulls — a green run inventing content). A deeper pattern
    # (`./items/**/*.md`) walks deeper and needs `./items/**` for both.
    read: ["./items", "./items/*"]

tasks:
  discover:
    invoke:                         # SLOT: glob / fetch sitemap / exec + jq split
      tool: "nika:glob"
      args: { pattern: "${{ const.collection_source }}/*.md" }

  # `discover` hands back PATH STRINGS — a prompt that interpolates the raw
  # item shows the model a FILENAME, never the file (measured: a green run
  # whose fluent « report » was invented from the names alone — check, mock
  # rehearsal and run all green around it). Reading the item is its own fan.
  # Delete this task — and fan `process` over `discover` — when your items
  # already ARE the content (an inline list · fetched records). Need each
  # content paired with its path? `resume-screener` shows the transpose.
  read:
    with:
      discover: ${{ tasks.discover.output }}
    for_each:
      items: ${{ with.discover }}
      max_parallel: 8
      fail_fast: false
    on_error:
      recover: null                 # an unreadable item yields null · the batch lives
    invoke:
      tool: "nika:read"
      args: { path: "${{ item }}" }

  process:
    with:
      read: ${{ tasks.read.output }}
    # The quiet-day guard: an EMPTY discovery skips the `read` fan, and a
    # skipped task hands NULL — which a bare for_each refuses (NIKA-VAR-006).
    # The ternary keeps the no-items day green end to end.
    for_each:
      items: "${{ with.read == null ? [] : with.read }}"
      max_parallel: 4                 # SLOT: the polite ceiling
      fail_fast: false
    timeout: "60s"                  # SLOT: per-iteration bound
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      jitter: true
    on_error:
      recover: null                 # a failed item yields null at its index · the batch lives
    infer:                          # SLOT: the per-item job (any verb)
      max_tokens: 2000              # SLOT: the per-ITEM ceiling · think + answer · multiply by the fan width
      # The marker below is a VALUE, not a comment. The parser drops
      # comments, so a `# SLOT:` line could never make `check` refuse —
      # which is how an unfilled scaffold ran green and left a file that
      # read like a result (#1066). Replace the line, keep the binding.
      prompt: |
        <SLOT: what to do with each item>

        ${{ item }}

  # The fan-in below is a LAW: a jq over what a model produced. A law is
  # proven on known answers first — `prove` runs the SAME expression over
  # `const.law_cases`, `law_holds` refuses the run if it drifted. Measured on
  # 0.118.7: without this pair `check` hints `[unproven-law]` on `survivors`.
  prove:
    invoke:
      tool: "nika:jq"
      args:
        input: ${{ const.law_cases }}
        expression: "((. // []) | [ .[] | select(. != null) ]) == [\"kept\", \"also kept\"]"

  law_holds:
    with:
      ok: ${{ tasks.prove.output }}
    invoke:
      tool: "nika:assert"
      args:
        condition: "${{ with.ok }}"
        message: "the fan-in law drifted from its hand-computed fixture"

  survivors:
    after:
      law_holds: success            # state, no data · the law is proven before it meets real data
    with:
      process: ${{ tasks.process.output }}
    invoke:                         # the null-aware fan-in · order preserved
      tool: "nika:jq"
      args:
        input: ${{ with.process }}
        # `. // []` · an EMPTY discovery skips the whole for_each (null
        # upstream) — the fan-in must survive its own quiet day.
        expression: "(. // []) | [ .[] | select(. != null) ]"

  merge:
    with:
      survivors: ${{ tasks.survivors.output }}
    infer:
      max_tokens: 3000              # SLOT: the fan-in ceiling · think + answer
      # SLOT: the fan-in · the survivors array (failed items filtered). Keep
      # slot markers out of the block below — it is prompt TEXT, not YAML.
      prompt: |
        Merge these results into one report · ${{ with.survivors }}

outputs:
  report: ${{ tasks.merge.output }}
