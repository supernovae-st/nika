# COUNTEREXAMPLE · egress sanctions the send. A webhook secret that reaches
# nika:notify with no door is not a watcher, it is a leak.
# Expected · NIKA-SEC-006.
nika: gate-and-act-negative
const:
  source_url: "https://api.example.com/v1/value"
secrets:
  webhook:
    source: env
    key: ALERTS_WEBHOOK_URL
permits:
  tools: ["nika:notify"]
  net: { http: ["hooks.slack.com"] }
tasks:
  act:
    invoke:
      tool: nika:notify
      args:
        channel: webhook
        target: "${{ secrets.webhook }}"
        message: "crossed"
