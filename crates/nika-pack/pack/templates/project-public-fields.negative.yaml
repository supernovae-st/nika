# COUNTEREXAMPLE · the source read is outside the declared file boundary.
# Expected · NIKA-SEC-004.
nika: project-public-fields
model: ollama/qwen3.5:4b
run:
  clock: system
const:
  instruction: Summarize the incident using only the allowed fields.
  record:
    topic: queue latency
    severity: 2
    email: private@example.invalid
    internal_note: internal-only-fixture
permits: {}
tasks:
  validate:
    invoke:
      tool: nika:validate
      args:
        data: ${{ const.record }}
        format: json
        schema:
          type: object
          additionalProperties: false
          required:
          - topic
          - severity
          - email
          - internal_note
          properties:
            topic:
              type: string
              minLength: 1
              maxLength: 4000
            severity:
              type: integer
              minimum: 0
              maximum: 5
            email:
              type: string
              minLength: 1
              maxLength: 4000
            internal_note:
              type: string
              minLength: 1
              maxLength: 4000
  admit:
    with:
      valid: ${{ tasks.validate.output.valid }}
    invoke:
      tool: nika:assert
      args:
        condition: ${{ with.valid }}
        message: Input violates the declared shape or size bound
  public:
    after:
      admit: success
    invoke:
      tool: nika:jq
      args:
        input: ${{ const.record }}
        expression: '{topic, severity}'
  summarize:
    with:
      public: ${{ tasks.public.output }}
    timeout: 30s
    infer:
      prompt: '${{ const.instruction }}

        Allowed fields only: ${{ with.public }}'
      max_tokens: 2048
      schema:
        type: object
        additionalProperties: false
        required:
        - summary
        properties:
          summary:
            type: string
            minLength: 1
            maxLength: 4000
  read_source:
    invoke:
      tool: nika:read
      args:
        path: ./private.json
outputs:
  public: ${{ tasks.public.output }}
  summary: ${{ tasks.summarize.output.summary }}
