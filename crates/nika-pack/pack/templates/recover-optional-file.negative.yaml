# SPDX-License-Identifier: Apache-2.0
# COUNTEREXAMPLE · Zero attempts is not a recovery policy.
# Expected · NIKA-PARSE-011.
nika: recover-optional-file
run:
  clock: system
const:
  fallback: No optional configuration supplied.
permits:
  tools:
  - nika:assert
  - nika:jq
  - nika:read
  - nika:validate
  fs:
    read:
    - ./optional.txt
tasks:
  read:
    invoke:
      tool: nika:read
      args:
        path: ./optional.txt
    timeout: 5s
    retry:
      max_attempts: 0
      backoff_strategy: exponential
      jitter: false
    on_error:
      on_codes:
      - NIKA-BUILTIN-READ-001
      recover: ${{ const.fallback }}
  validate:
    with:
      content: ${{ tasks.read.output }}
    invoke:
      tool: nika:validate
      args:
        data: ${{ with.content }}
        format: json
        schema:
          type: string
          minLength: 1
          maxLength: 4000
  admit:
    with:
      valid: ${{ tasks.validate.output.valid }}
    invoke:
      tool: nika:assert
      args:
        condition: ${{ with.valid }}
        message: Content must be nonempty and at most 4000 characters
  result:
    after:
      admit: success
    with:
      content: ${{ tasks.read.output }}
    invoke:
      tool: nika:jq
      args:
        input: ${{ with.content }}
        expression: .
outputs:
  content: ${{ tasks.result.output }}
