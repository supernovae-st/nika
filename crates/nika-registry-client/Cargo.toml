[package]
name          = "nika-registry-client"
description   = "Registry consumption L2 service — resolve registry:owner/name[@version] refs against the public nika-registry index: fetch over the kernel http seam, verify the pinned sha256 digest, cache under one canonical dir. Nothing executes at pull time — the verified file feeds the normal audit-before-run pipeline."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Internal L2 service crate (size-cap descent from nika-cli · D-2026-07-09-N1).

[dependencies]
nika-kernel = { path = "../nika-kernel", version = "0.118.1" }   # HttpGetDyn seam — the ONE injected effect
nika-vocab  = { path = "../nika-vocab", version = "0.118.1" }    # the project file (registry.floor — the NEP-0016 gate's project rung, max-composed · D-2026-08-11-N5)
serde       = { workspace = true }
serde_json  = { workspace = true }
sha2        = { workspace = true }   # the digest verify (index-pinned sha256 · hard refuse on mismatch)
minisign    = { version = "0.9", default-features = false }   # the v0.2 signature verification (detached, over the artifact bytes)
toml_edit   = { workspace = true }   # the local pin records (pins.toml — bare refs never float · ADR-106)

[dev-dependencies]
nika-kernel-mock = { path = "../nika-kernel-mock", version = "0.118.1" }  # MockHttp — the injected seam under test
tempfile         = { workspace = true }
tokio            = { workspace = true }   # the tests park their own current-thread executor

[package.metadata.lore]
daemon        = "sentinelle"
archetype     = "kodama-sentinelle"
spirit_role   = "trust-chain-keeper"
voice_pattern = "silent"
layer         = "L2"
err_prefix    = "NIKA-REG"
