[package]
name          = "nika-runtime"
description   = "The L3 orchestrator — wave-ordered DAG execution of a CHECKED workflow through the four verb crates, the one event-emission site per verb path (INV-024). The first L3 crate. Spec: docs/crate-specs/nika-runtime.md."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Internal L3 orchestration crate.

[dependencies]
nika-types       = { path = "../nika-types", version = "0.105.0" }        # EventId · Timestamp · KeyValue · Value
nika-error       = { path = "../nika-error", version = "0.105.0" }        # NIKA_1700..1703 registry constants
nika-event       = { path = "../nika-event", version = "0.105.0" }        # Event · EventKind (the stream this crate emits)
nika-schema      = { path = "../nika-schema", version = "0.105.0" }       # RawWorkflow · RawAction (the run input)
nika-check       = { path = "../nika-check", version = "0.105.0" }        # CheckReport · the audit-before-run gate (the admit/trust planes)
nika-tmpl        = { path = "../nika-tmpl", version = "0.105.0" }         # the ONE ${{ }} island lexer · shared with the checker (check⇄run parity)
nika-catalog     = { path = "../nika-catalog", version = "0.105.0", features = ["pricing"] } # estimate_cost_for — the ONE pricing seam (floor + actual agree by construction)
nika-cel         = { path = "../nika-cel", version = "0.105.0" }          # the cel-subset/0.1 engine behind the expr seam (parse · compute · Resolver · L0)
nika-kernel      = { path = "../nika-kernel", version = "0.105.0" }       # ShellRunDyn · ToolExecuteDyn · ClockDyn · ai seams (hub only)
nika-verb-infer  = { path = "../nika-verb-infer", version = "0.105.0" }
nika-verb-exec   = { path = "../nika-verb-exec", version = "0.105.0" }
nika-verb-invoke = { path = "../nika-verb-invoke", version = "0.105.0" }
nika-verb-agent  = { path = "../nika-verb-agent", version = "0.105.0" }
futures-util     = { workspace = true }   # buffered(k) intra-wave concurrency + select (no executor · async rides the injected seams)
jaq-core         = { workspace = true }   # output: named bindings — THE data language (the same jaq nika:jq runs · spec 04 §binding)
jaq-std          = { workspace = true }   # jq stdlib filters (map · select · add …) over a binding's raw output
jaq-json         = { workspace = true }   # jq Val ↔ serde_json bridge for output: bindings
serde            = { workspace = true }   # TerminalCause wire form (snake_case · spec 13) — FCI-003-pinned against as_str()
serde_json       = { workspace = true }
blake3           = { workspace = true }   # ADR-099 resume keys — hash of the JCS key payloads (content, never mtimes)
serde_json_canonicalizer = { workspace = true }   # ADR-099 resume keys — RFC 8785 canonical bytes (trap 5 · map order + whitespace)
thiserror        = { workspace = true }
miette           = { workspace = true }
uuid             = { workspace = true }

[dev-dependencies]
nika-kernel-mock = { path = "../nika-kernel-mock", version = "0.105.0" }  # MockClock · MockShell · MockToolExecutor · MockToolDefinitionProvider
nika-providers   = { path = "../nika-providers", version = "0.105.0" }    # ProviderRegistry mock/echo (the tests' InferVerb seam · the composer owns it in prod)
nika-builtin     = { path = "../nika-builtin", version = "0.105.0" }      # the REAL BuiltinDispatcher over mock fs/http — the adversarial suite's fs-boundary plane (L1.5 ← L3, downward)
nika-pack        = { path = "../nika-pack", version = "0.105.0" }          # error_codes() — the spec-plane codes the runtime emits pin to the embedded canon
bytes            = { workspace = true }   # canned HttpResponse bodies (the F1 capturing http seam)
insta            = { workspace = true }
proptest         = { workspace = true }
tokio            = { workspace = true }

[package.metadata.lore]
daemon        = "timonier"
archetype     = "kodama-timonier"
spirit_role   = "tient la barre du DAG · chaque vague part à son heure · l'audit passe avant la mer"
voice_pattern = "spoken"
layer         = "L3"
err_prefix    = "NIKA-170x"

[lints]
workspace = true
