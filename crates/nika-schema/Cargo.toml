[package]
name          = "nika-schema"
description   = "Workflow AST + parser for the Nika diamond (THE PARSER — its blueprint shape). The static judgment (analyzer + `nika check` ladder) lives in nika-check (split 2026-07-21 · the 15k crate-size wall · the nika-graph precedent). Layer L0 — pure, zero I/O, zero async."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Foundation crate — never on crates.io. See feedback_publish_false_foundation_strategy.md + ADR-017.

[dependencies]
# L0-DEP-FANOUT-EXEMPT: nika-schema is the workflow AST/parser hub — it
# assembles the closed vocabularies from the L0 leaf crates it depends on
# (nika-error codes · nika-types base+suggest · nika-catalog capability
# vocab · nika-tmpl the shared island lexer the runtime ALSO consumes for
# check⇄run parity). nika-tmpl is a dependency-light L0 leaf extracted FROM
# this crate for reuse without pulling the parser; inlining it back to stay
# at 3 would defeat the extraction + re-introduce the check⇄run scanner
# drift. (The analyzer + check ladder — and the nika-cap permits edge they
# needed — descended to nika-check 2026-07-21 · the 15k wall.) High fan-in
# is intentional for the schema assembler hub (ADR-027 · marker-based
# exemption).
nika-source  = { path = "../nika-source", version = "0.109.1" } # spans + file registry (size-cap split of THIS unit · D-2026-07-09-N1 · re-exported at src/source)
nika-vocab   = { path = "../nika-vocab", version = "0.109.1" }  # .nika.yaml config vocabulary (size-cap split of THIS unit · 3rd member · re-exported at src/types)
nika-error   = { path = "../nika-error", version = "0.109.1" }
nika-catalog = { path = "../nika-catalog", version = "0.109.1" }
nika-types   = { path = "../nika-types", version = "0.109.1" }   # ExtractMode — fetch arg-shape rules (one closed vocabulary)
nika-tmpl    = { path = "../nika-tmpl", version = "0.109.1" }   # the ${{ }} language crate (island lexer + expression grammar · check⇄run parity)

thiserror  = { workspace = true }
marked-yaml  = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
miette     = { workspace = true }

[dev-dependencies]
# the emitted⊆registered ratchet cross-checks every statically-emittable
# spec code against the embedded canon registry (spec/05-errors.md SSOT)
nika-pack  = { path = "../nika-pack", version = "0.109.1" }
rstest     = { workspace = true }
serde_json = { workspace = true }
criterion  = { workspace = true }  # gate-7 benches · the parse hot path

[[bench]]
name = "parse_bench"
harness = false

[package.metadata.cargo-machete]
ignored = ["rstest", "serde-saphyr", "criterion"]  # macro-invisible dev + parse-backend + bench-harness uses machete cannot see

[lints]
workspace = true
