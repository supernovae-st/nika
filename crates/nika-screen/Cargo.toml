[package]
name          = "nika-screen"
description   = "Screen-capture L1 effect crate — implements the nika-kernel ScreenCapture trait (display enumeration + full/region/stream capture). First computer-use L1 · ADR-081 guards 6+7."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Internal L1 effect crate (not a standalone crates.io satellite).

# Gate 2 (ADR linked) · ADR-081 = 7 L1 security guards forever; this crate owns
# guards 6 (capture-LED indicator) + 7 (consent UX), MANDATORY-at-admission.
[package.metadata.adr]
adr = ["ADR-003", "ADR-081"]

[dependencies]
nika-kernel = { path = "../nika-kernel", version = "0.91.0-dev" }
# thiserror + miette removed 2026-06-10: ScreenError + its derives moved to
# nika-kernel-core (Pattern A migration · FCI-023bis) — nika-screen re-exports it.
bytes       = { workspace = true }  # Frame RGBA8 zero-copy payload (B.3)
# B.3 capture backend · xcap = cross-platform screen capture (macOS/Linux/Windows).
# Replaces the plan's phantom `nokhwa` (a WEBCAM lib · docs.rs verbatim). xcap
# encapsulates the OS FFI internally, so this crate stays `unsafe_code = forbid`.
xcap        = "0.9"
# B.3 wraps the sync xcap calls in `spawn_blocking` (rt) so a dropped future
# surrenders the worker promptly (kernel CANCEL SAFETY contract); B.4 adds the
# mpsc stream worker. L1 tokio is layer-legal + deny.toml-allowlisted here.
# `#[tokio::test]` macros + spawn_blocking (rt) ride the workspace base feature set;
# `sync` (added here) brings the bounded `mpsc` channel for the B.4 capture stream.
tokio        = { workspace = true, features = ["sync"] }
futures-core = { workspace = true }  # `Stream` trait for the B.4 capture_stream adapter

[dev-dependencies]
# Gate 6 (PROPERTY) · proptest exercises the security state machines
# (ConsentGate fail-closed transitions · LedIndicator engaged-count) over
# randomized op sequences — the OS-FFI capture paths stay #[ignore] (need a
# real display + TCC), so mutation coverage of the pure logic comes from here.
proptest = { workspace = true }

[lints]
workspace = true
