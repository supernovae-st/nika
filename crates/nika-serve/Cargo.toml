[package]
name          = "nika-serve"
description   = "The L4 remote execution projection: durable jobs plus authenticated loopback HTTP."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false

[dependencies]
bytes      = { workspace = true }
http-body-util = { workspace = true }
hyper      = { workspace = true }
hyper-util = { workspace = true }
jiff       = { workspace = true }
miette     = { workspace = true, features = ["fancy-no-backtrace"] }
nika-cadence = { path = "../nika-cadence", version = "0.118.7" }
nika-dap     = { path = "../nika-dap", version = "0.118.7" }      # TraceFileSink — the journal a resident job leaves on disk (#1381)
nika-arm     = { path = "../nika-arm", version = "0.118.7" }      # the ONE ledger both firers write (ADR-116 · wave 6 · one slot, one firer)
nika-error  = { path = "../nika-error", version = "0.118.7" }
nika-execution = { path = "../nika-execution", version = "0.118.7" }
nika-service-execution = { path = "../nika-service-execution", version = "0.118.7" }
nika-event             = { path = "../nika-event", version = "0.118.7" }   # the settlement's RunState — JobStatus is its projection (ADR-130)
nika-fs    = { path = "../nika-fs", version = "0.118.7" }
nika-runtime = { path = "../nika-runtime", version = "0.118.7" }
nika-trace   = { path = "../nika-trace", version = "0.118.7" }    # the ONE verifier `nika trace verify` runs — the verify route projects its machine document (lateral L4→L4 · the nika-mcp → nika-cli-host precedent)
nika-types = { path = "../nika-types", version = "0.118.7" }
nika-vocab = { path = "../nika-vocab", version = "0.118.7" }
nix        = { workspace = true, features = ["fs"] }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
subtle     = { workspace = true }
thiserror  = { workspace = true }
tokio      = { workspace = true, features = ["io-util", "net", "rt-multi-thread", "sync"] }
uuid       = { workspace = true }
zeroize    = { workspace = true }

[dev-dependencies]
minisign = { workspace = true }  # the in-memory run key the seal-point test signs with (custody stays out of the test)
nika-arm = { path = "../nika-arm", version = "0.118.7", features = ["test-support"] }  # the ledger fixtures the one-firer tests write
tempfile = { workspace = true }

[lints]
workspace = true
