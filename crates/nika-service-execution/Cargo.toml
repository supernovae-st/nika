[package]
name          = "nika-service-execution"
description   = "The ONE shared production execution driver over an admitted, byte-owned world. Composes the root runtime and every nested `workflow:` call through the same production composition root, for the local CLI/ARM surface and the service surface alike. Layer L3. Spec: docs/crate-specs/nika-service-execution.md."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Internal L3 orchestration crate.

[dependencies]
nika-verb-infer = { path = "../nika-verb-infer", version = "0.123.0-preview.1" } # production schema retry bound, owned by the verb
nika-runtime     = { path = "../nika-runtime", version = "0.123.0-preview.1" }      # the composition root + child seam this driver drives (same-layer L3)
nika-execution   = { path = "../nika-execution", version = "0.123.0-preview.1" }    # sealed owned-byte admission authority (ExecutionContext · ExecutionSnapshot)
nika-check       = { path = "../nika-check", version = "0.123.0-preview.1" }        # CheckReport — the audit-before-run pair sealed to the snapshot
nika-event       = { path = "../nika-event", version = "0.123.0-preview.1" }        # Event + the source-identity hash (lf_normal_form · sha256_hex)
nika-schema      = { path = "../nika-schema", version = "0.123.0-preview.1" }       # RawWorkflow · RawAction · Permits · ResolvedSkills
nika-types       = { path = "../nika-types", version = "0.123.0-preview.1" }        # ExecutionId · RunId · CorrelationId · EventId · Timestamp
nika-providers   = { path = "../nika-providers", version = "0.123.0-preview.1" }    # ProviderProbe — the access candidates the run gate judges
nika-harness     = { path = "../nika-harness", version = "0.123.0-preview.1" }      # build the operator-selected subscription seat
nika-builtin     = { path = "../nika-builtin", version = "0.123.0-preview.1" }      # the rehearsal's tool plane: the builtin dispatcher over its room
nika-exec-runner = { path = "../nika-exec-runner", version = "0.123.0-preview.1" }  # a rehearsal's isolated jq: one bounded, reaped helper process at a time (the tokio owner)
nika-kernel      = { path = "../nika-kernel", version = "0.123.0-preview.1" }       # the seams a rehearsal denies (shell · http · provider · tools · fs)
nika-verb-exec   = { path = "../nika-verb-exec", version = "0.123.0-preview.1" }    # the rehearsal runtime's four verbs, composed as production's
nika-verb-invoke = { path = "../nika-verb-invoke", version = "0.123.0-preview.1" }
nika-verb-agent  = { path = "../nika-verb-agent", version = "0.123.0-preview.1" }
serde_json       = { workspace = true }
thiserror        = { workspace = true }                                   # RunShapeError — the typed unknown-cost Run shape refusal (FCI-019)

[dev-dependencies]
bytes    = { workspace = true }                           # a test backend implements the kernel read seam
nika-fs  = { path = "../nika-fs", version = "0.123.0-preview.1" }   # OwnedDir — the admission input the tests capture from
tempfile = { workspace = true }
tokio    = { workspace = true }

[package.metadata.lore]
daemon        = "timonier"
archetype     = "kodama-timonier"
spirit_role   = "conduit le monde scellé · une seule route pour la barre locale et la barre distante"
voice_pattern = "silent"
layer         = "L3"
err_prefix    = "none"

[lints]
workspace = true
