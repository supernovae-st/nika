#
# nika-session-host · L4 · the native Session over a wire: one host adapter that keeps the
# actual SessionRuntime, the snapshots it published and the commands it accepted, behind the
# native machine door (`nika session --json`) and the HTTP door of `nika serve`. Size-cap
# member of the nika-session unit (D-2026-07-09-N1 · ADR-144 pattern): nika-session-host →
# nika-session, never back. WIP with its unit.
[package]
name        = "nika-session-host"
description = "L4 interface — the native Session over a wire: one host adapter around the actual SessionRuntime (published snapshots and their Waiting in custody, an idempotent command ledger, Stop linearized with publication, an event log), its NDJSON machine door and its HTTP routes; a size-cap member of the nika-session unit"

version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Interface crate — a member of the nika-session unit; the `nika` binary is the only consumer.

[lints]
workspace = true

[dependencies]
nika-session  = { path = "../nika-session", version = "0.123.0-preview.1", default-features = false }  # the ONE SessionRuntime every door drives (lateral L4→L4 · never back)
nika-cli-host = { path = "../nika-cli-host", version = "0.123.0-preview.1", default-features = false }  # lane — the run child a native Session run goes through · probe::home_dir
nika-catalog  = { path = "../nika-catalog", version = "0.123.0-preview.1", features = ["providers"] }   # the provider's first cataloged model when a choice names none
nika-onboard  = { path = "../nika-onboard", version = "0.123.0-preview.1" }      # compile::room::JqHelper — the binary a rehearsal's nika:jq steps run with
nika-types    = { path = "../nika-types", version = "0.123.0-preview.1" }        # cancel::CancelCtx — the Stop token of the turn under way

blake3          = { workspace = true }  # the digest of a command's exact bytes in the ledger
bytes           = { workspace = true }
getrandom       = { workspace = true }  # 128-bit session and snapshot handles
http-body-util  = { workspace = true }
hyper           = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
tokio           = { workspace = true, features = ["sync", "time"] }

[features]
default = ["access-harness"]
# The harness reasoner a kept choice may name, as bare `nika` builds it.
access-harness = ["nika-session/access-harness"]

[dev-dependencies]
hyper-util = { workspace = true }
tempfile   = { workspace = true }
tokio      = { workspace = true, features = ["sync", "time", "rt-multi-thread", "net", "macros", "io-util"] }
