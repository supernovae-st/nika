[package]
name          = "nika-session"
description   = "The native session — bare `nika` on a terminal: a grounded conversation over the installed engine (the project snapshot · the selected intelligence · the context broker · the hallucination guard · the deterministic facts). Layer L4 — a host runtime, never a workflow."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Foundation crate — never on crates.io. See ADR-022.

[dependencies]
nika-cli-host = { path = "../nika-cli-host", version = "0.121.0", default-features = false }  # the ONE probe/census · the oracle facade · the git-root walk (lateral L4→L4 · ADR-124 precedent)
nika-providers = { path = "../nika-providers", version = "0.121.0", default-features = false }  # AccessClass · the resolver law (the guard's model check) · ProviderRegistry (the API/local reasoner)
nika-verb-infer = { path = "../nika-verb-infer", version = "0.121.0", default-features = false }  # ONE inference call, no workflow (the API/local reasoner)
nika-http     = { path = "../nika-http", version = "0.121.0" }        # ReqwestHttp — the API reasoner's wire
nika-runtime  = { path = "../nika-runtime", version = "0.121.0" }     # compose::config_from_env — the ONE env boundary · engine_identity
nika-dap      = { path = "../nika-dap", version = "0.121.0" }         # inventory::collect_workflows — the ONE workspace walker
nika-vocab    = { path = "../nika-vocab", version = "0.121.0" }       # project::discover — the project file
nika-source   = { path = "../nika-source", version = "0.121.0" }      # lexical program-source naming (#1684)
nika-pack     = { path = "../nika-pack", version = "0.121.0" }        # the embedded facts (canon · schema · examples · templates · codes)
nika-builtin  = { path = "../nika-builtin", version = "0.121.0" }     # tools_json — the builtin names the guard trusts
nika-error    = { path = "../nika-error", version = "0.121.0" }       # codes::lookup — the numeric registry the guard trusts
nika-types    = { path = "../nika-types", version = "0.121.0" }       # AccessClass — the census reads the probe rows by class
nika-onboard  = { path = "../nika-onboard", version = "0.121.0" }     # routing::route_query — the ONE intent router
nika-harness  = { path = "../nika-harness", version = "0.121.0", optional = true }  # the infer-grade seat (the harness reasoner)
nika-check    = { path = "../nika-check", version = "0.121.0" }       # CheckReport — the preview's effect rows read the report's own permits and requirements
nika-schema   = { path = "../nika-schema", version = "0.121.0" }      # the parser — the review reads a candidate's tasks from the AST, never from prose
nika-cap      = { path = "../nika-cap", version = "0.121.0" }         # ExecPermit — the exec grant's shape in the effect rows
nika-fs       = { path = "../nika-fs", version = "0.121.0" }          # OwnedDir::write_atomic — a change lands by temp + rename below the root's descriptor
nika-cadence  = { path = "../nika-cadence", version = "0.121.0" }     # the arm: grammar (L0 · pure) — a cadence the session derives is validated before it is proposed
nika-trace    = { path = "../nika-trace", version = "0.121.0" }       # run_view::RunFacts — what a run's trace proves, read for the result, gate and `/proof` views (its ONE verify door judges the chain · lateral L4→L4 · never back)
nika-event    = { path = "../nika-event", version = "0.121.0" }       # source_id::sha256_hex — the digest of each knowledge-pack reference the authoring record keeps (L0 · pure)

blake3      = { workspace = true }   # the witness of the bytes a preview was built over
serde       = { workspace = true }
serde_json  = { workspace = true }
nika-catalog = { path = "../nika-catalog", version = "0.121.0", features = ["providers", "pricing"] } # the priced-model check at the model question
thiserror   = { workspace = true }
tokio       = { workspace = true }

[features]
default = ["access-harness"]
# The harness reasoner (an existing AI app's seat reasons with the human).
access-harness = ["dep:nika-harness", "nika-cli-host/access-harness", "nika-verb-infer/access-harness", "nika-providers/access-harness"]

[lints]
workspace = true

[dev-dependencies]
nika-kernel = { path = "../nika-kernel", version = "0.121.0" } # injected loopback HTTP mechanics
tempfile = { workspace = true }
