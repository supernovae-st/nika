# nika-tui-core · L4 · la LOI de la session TUI · pur · zéro I/O · zéro async.
# Joined the workspace as WIP 2026-08-12 (the nika-cadence precedent) ·
# ADMITTED 2026-08-14 · all 12 gates · retire du tableau `wip`.
[package]
name        = "nika-tui-core"
description = "L4 interface law — the TUI session model + the derivation layer (waves · idle · bottleneck · totals) + the plan-board seating + the executable claims · one Rust truth for every surface (native · WASM · cloud)"

version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Interface crate — ships as an npm pack via wasm-bindgen, never on crates.io.

[lib]
crate-type = ["cdylib", "rlib"]   # the .wasm artifact AND a normal Rust dep

[dependencies]
serde        = { workspace = true }
# float_roundtrip — the fingerprint, the journal fold and the parity test
# compare BITS; serde_json's default fast float parser rounds
# 420.40000000000003 to 420.4 (measured). Exact parsing or the proof
# measures nothing.
serde_json   = { workspace = true, features = ["float_roundtrip"] }
thiserror    = { workspace = true }
# OPTIONAL on purpose. `wasm-bindgen` publishes a BLANKET `Upcast` impl, so
# the moment it enters a dependency graph EVERY public type of EVERY crate
# downstream acquires it. This crate is not a leaf (its sibling
# `nika-check-wasm` is) — `nika-trace` depends on it, and `nika-cli` on that,
# so a non-optional binding dragged 30 blanket-impl lines into two public-api
# baselines that had gained no item of their own. The doors below stay
# ordinary Rust under default features; only the FFI attribute is gated.
wasm-bindgen = { workspace = true, optional = true }

[features]
# The browser lot. `build-wasm.sh` passes it; nothing else needs to.
wasm = ["dep:wasm-bindgen"]

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }   # Gate 6 · the derivation invariants under arbitrary shapes
nika-event = { path = "../nika-event", version = "0.118.3" }   # the spellings this crate copies are pinned to their owner (ADR-130 · tests/wire_pins.rs)
nika-graph = { path = "../nika-graph", version = "0.118.3" }   # the graph format this crate reads is pinned to its owner (format 3 · tests/wire_pins.rs)
