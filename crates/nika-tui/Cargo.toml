#
# nika-tui · L4 · the Ratatui renderer of the session (ADR-139) · the workspace, inline on request ·
# one terminal owner · typed events in, lines out · plain mode never touched.
# Joined the workspace as WIP 2026-09-21 (the nika-tui-core precedent).
[package]
name        = "nika-tui"
description = "L4 interface — the terminal renderer of the Nika session: one owner of the terminal, the workspace over the real project and the faces of a workflow it opens, an inline viewport on request whose finished lines live in the terminal's own scrollback, a composer that treats a paste as data (ADR-139)"

version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Interface crate — the `nika` binary is the only consumer.

[lints]
workspace = true

[dependencies]
ratatui          = { workspace = true, features = ["unstable-rendered-line-info"] }
# Level-triggered Unix input keeps unread keys observable after a resize.
crossterm        = { workspace = true, features = ["use-dev-tty"] }
ratatui-textarea = { workspace = true }
tokio            = { workspace = true, features = ["sync", "signal", "time", "rt", "macros"] }
unicode-width    = "0.2"
nika-session     = { path = "../nika-session", version = "0.124.0", default-features = false }   # the live conversation (UX-2): TurnOutcome → beats, L4 lateral like nika-cli

nika-cli-host    = { path = "../nika-cli-host", version = "0.124.0", default-features = false } # live one-use child review, no admission authority
nika-display     = { path = "../nika-display", version = "0.124.0" }   # the theme seam (Role · verb and state glyphs), already under nika-session and nika-cli-host
nika-fs          = { path = "../nika-fs", version = "0.124.0" }   # OwnedDir · read_capped — the Live host adapter reads one listed workflow below the root, no symlink, bounded (never the renderer)
nika-tui-view    = { path = "../nika-tui-view", version = "0.124.0" }   # the faces of an opened workflow, from the Session's look (ADR-143 · nika-tui → nika-tui-view, never back)
nika-trace       = { path = "../nika-trace", version = "0.124.0", default-features = false }   # the ONE verifier over a captured journal (verify_captured) and its fold (RunFacts::of) for the Proof face · L4 lateral, never back
serde_json       = { workspace = true }   # host parsing of bytes it already holds: the verifier's versioned --json verdict, a write's JSON-encoded output path, a kept execution read back through ExecutionId's own Deserialize
jiff             = { workspace = true }   # the machine's zone a run's start is read in: a run is named by when it began on the person's clock (also the instants of the ledger fixtures)

[dev-dependencies]
expectrl = { workspace = true }   # PTY proof · the terminal is restored on every exit path (unix)
sha2     = { workspace = true }   # the logomark provenance proof: the renditions still name the repository's own mark
nika-arm = { path = "../nika-arm", version = "0.124.0", features = ["test-support"] } # the ledger fixtures a schedule's fired runs are read back from, through the Session's own history reader
nika-runtime = { path = "../nika-runtime", version = "0.124.0" } # the project key a launchd unit is named by, so a test host's units carry the names the Session journals a disarm by
nika-cadence = { path = "../nika-cadence", version = "0.124.0" } # the unit name `arm --emit` gives a beat, for that test host

[[bin]]
name = "nika-tui-proto"
path = "src/bin/nika-tui-proto.rs"
