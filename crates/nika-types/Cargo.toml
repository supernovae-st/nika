[package]
name          = "nika-types"
description   = "Foundation value types for the Nika diamond. Layer L0 — pure, zero I/O, zero async."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Foundation crate — never on crates.io. See feedback_publish_false_foundation_strategy.md + ADR-017.

[dependencies]
# `serde` is the only genuinely optional dependency: the derives are
# feature-gated so the crate compiles `--no-default-features`. `uuid` and
# `serde_json` are STRUCTURAL — `id.rs` wraps `Uuid` in its ID newtypes and
# `checkpoint.rs` carries a `serde_json::Value` context field — so they are
# always present, not bundled into the serde feature.
serde      = { workspace = true, optional = true }
serde_json = { workspace = true }
uuid       = { workspace = true }
# NFKC confusable-bypass defense of the argv exec floor (`exec.rs` — the
# ONE predicate check ≡ run judge with · #605). no_std-compatible with
# default-features off, so the `--no-default-features` seam stays intact.
unicode-normalization = { workspace = true, default-features = false }

[features]
default = ["std", "serde"]
# `std` gates `std::`-only code (today: nothing beyond core + alloc). Kept
# as a feature-flag seam for WASM v0.100 (see ADR-028 + Phase F of the
# 2026-04-16 swarm-3 audit plan).
std     = []
serde   = ["dep:serde"]

[dev-dependencies]
serde_json = { workspace = true }
proptest   = { workspace = true }

# Loom interleaving-exhaustive tests. `loom` becomes a real dep only
# when `RUSTFLAGS="--cfg loom"` is set; for the normal workflow
# (`cargo test --workspace --lib`, `cargo build`) it doesn't compile.
# Invoke explicitly:
#   RUSTFLAGS="--cfg loom" cargo test --locked -p nika-types --lib loom_cancel
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[package.metadata.cargo-machete]
ignored = ["loom"]  # only referenced under cfg(loom)

[lints]
workspace = true
