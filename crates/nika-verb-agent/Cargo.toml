[package]
name          = "nika-verb-agent"
description   = "The `agent` verb executor (L2) — the multi-turn ReAct loop: infer → whitelisted tool dispatch → feed-back, until completion or a budget. The 4th and last verb (D-2026-05-22-N18). Spec: docs/crate-specs/nika-verb-agent.md."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Internal L2 verb crate (the binary ships, the lib doesn't).

[dependencies]
nika-types      = { path = "../nika-types", version = "0.109.0", features = ["serde"] } # SpendOnFailure (billed-then-failed spend · Cost Intelligence)
nika-kernel      = { path = "../nika-kernel", version = "0.109.0" }       # ai::provider seam · ai::tool_defs seam · runtime agent DTOs
nika-error       = { path = "../nika-error", version = "0.109.0" }        # NIKA_460..467 registry constants
nika-verb-invoke = { path = "../nika-verb-invoke", version = "0.109.0" }  # tool dispatch (same-layer L2 · spec §0.5)
nika-bm25        = { path = "../nika-bm25", version = "0.109.0" }         # deterministic per-turn tool routing (L2→L1 downward · ADR-096)
nika-schema      = { path = "../nika-schema", version = "0.109.0" }       # agent:compose parse (L2→L0 downward)
nika-cap         = { path = "../nika-cap", version = "0.109.0" }          # the harness permission bridge's judge (L2→L0 · B5)
nika-check       = { path = "../nika-check", version = "0.109.0" }        # agent:compose static gate (L2→L0 downward · check-before-permission)
nika-catalog     = { path = "../nika-catalog", version = "0.109.0", features = ["pricing"] } # find_pricing_for — the priced-ness the unmetered gate reads (R3-F1)
jsonschema       = { workspace = true }                                   # final-message `schema:` validation (NIKA_464)
serde_json       = { workspace = true }
thiserror        = { workspace = true }
miette           = { workspace = true }
tokio            = { workspace = true }                                   # spawn_blocking — agent:compose's sync check off the async executor (ADR-096)
futures-util     = { workspace = true }                                   # buffered — order-preserving parallel intra-turn dispatch (ADR-097)

[dev-dependencies]
nika-kernel-mock = { path = "../nika-kernel-mock", version = "0.109.0" }  # MockProvider · MockToolExecutor · MockToolDefinitionProvider
proptest         = { workspace = true }

[package.metadata.lore]
daemon        = "navigatrice"
archetype     = "kodama-navigatrice"
spirit_role   = "la boucle qui pense puis agit · chaque tour négocie avec le budget · la whitelist est la côte qu'elle ne franchit jamais"
voice_pattern = "spoken"
layer         = "L2"
err_prefix    = "NIKA-46x"

[dependencies.futures-core]
workspace = true
optional = true

[features]
# The harness access class (D-2026-08-04-N1 · P3 B4): agent tasks may
# delegate to the user's own authenticated harness through the kernel
# DynAgentBackend seam. DEFAULT OFF (feature-defaults law) — the native
# loop is byte-unchanged without it; the runtime composer injects the
# backend only when the feature is on AND an adapter is configured.
access-harness = ["dep:futures-core"]

[lints]
workspace = true
