# SPDX-License-Identifier: AGPL-3.0-or-later

[package]
name          = "nika-verb-infer"
description   = "The `infer` verb executor (L2) — one-shot LLM inference per nika-spec 02-verbs.md. Resolves `provider/model` through nika-providers, shapes the kernel InferRequest, and owns the floor of the structured-output recipe (request-side ResponseFormat + bounded schema-validation retry)."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Internal L2 verb crate.

[dependencies]
nika-types      = { path = "../nika-types", version = "0.114.0", features = ["serde"] } # SpendOnFailure (billed-then-failed spend · Cost Intelligence)
nika-error     = { path = "../nika-error", version = "0.114.0" }
nika-kernel    = { path = "../nika-kernel", version = "0.114.0" }
nika-catalog   = { path = "../nika-catalog", version = "0.114.0", features = ["pricing"] } # find_pricing_for — the priced-ness the unmetered gate reads (R3-F1)
nika-providers = { path = "../nika-providers", version = "0.114.0" }
nika-harness   = { path = "../nika-harness", version = "0.114.0", optional = true }
jsonschema     = { workspace = true }
miette         = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }

[dev-dependencies]
bytes    = { workspace = true }
proptest = { workspace = true }
tokio    = { workspace = true }

[package.metadata.lore]
daemon        = "forgeron"
archetype     = "kodama-forgeron"
spirit_role   = "premier des quatre verbes · une question posée à l'oracle · la réponse contrainte à la forme promise"
voice_pattern = "silent"
layer         = "L2"
err_prefix    = "NIKA-43x"

[lints]
workspace = true

[features]
default = []
access-harness = ["dep:nika-harness"]
