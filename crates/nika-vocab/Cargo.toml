[package]
name          = "nika-vocab"
description   = "Workflow configuration vocabulary for .nika.yaml files: capture/decode modes, retry, durations, secrets, var/output declarations. Layer L0 — pure, zero I/O. Third member of the nika-schema architectural unit (size-cap split, D-2026-07-09-N1)."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Foundation crate — never on crates.io. See ADR-017.

[dependencies]
nika-source = { path = "../nika-source", version = "0.107.1" } # Spanned/Span on declaration values
nika-cap    = { path = "../nika-cap", version = "0.107.1" }    # permits/policy vocab re-exported at the original module path
nika-types  = { path = "../nika-types", version = "0.107.1" }  # the ONE type core (parse_type · fits) behind the TypeExpr helpers
serde       = { workspace = true }
serde_json  = { workspace = true }

[lints]
workspace = true
