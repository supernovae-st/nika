[package]
name          = "nika-vocab"
description   = "Configuration vocabulary: the .nika.yaml workflow file (capture/decode modes, retry, durations, secrets, var/output declarations) · and the nika.yaml PROJECT file (D-2026-08-11-N5). Layer L0 — pure, sync parsers; the one fs read is the project discovery (local operator config, the policy.toml seam-bypass class). Third member of the nika-schema architectural unit (size-cap split, D-2026-07-09-N1)."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
publish                = false  # Foundation crate — never on crates.io. See ADR-017.

[dependencies]
nika-source = { path = "../nika-source", version = "0.116.0" } # Spanned/Span on declaration values
nika-cap    = { path = "../nika-cap", version = "0.116.0" }    # permits/policy vocab re-exported at the original module path
nika-types  = { path = "../nika-types", version = "0.116.0" }  # the ONE type core (parse_type · fits) behind the TypeExpr helpers
serde       = { workspace = true }
serde_json  = { workspace = true }
marked-yaml = { workspace = true } # the project-file parser — per-key spans (a refusal names its line · the nika-schema idiom)

[dev-dependencies]
proptest = { workspace = true }    # the closed grammar's robustness + round-trip ratchets (Gate 6)

[lints]
workspace = true
