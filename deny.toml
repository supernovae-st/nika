# 🏰 FORTRESS: cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# ═══════════════════════════════════════════════════════════════════════════════
# Advisories - Check for known vulnerabilities
# ═══════════════════════════════════════════════════════════════════════════════
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

# ═══════════════════════════════════════════════════════════════════════════════
# Licenses - Ensure compatible licenses
# ═══════════════════════════════════════════════════════════════════════════════
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# ═══════════════════════════════════════════════════════════════════════════════
# Bans - Disallow specific crates
# ═══════════════════════════════════════════════════════════════════════════════
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

deny = [
    # Deprecated or unmaintained crates
    { name = "openssl", wrappers = ["openssl-sys"] },
]

skip = []
skip-tree = []

# ═══════════════════════════════════════════════════════════════════════════════
# Sources - Trusted crate sources
# ═══════════════════════════════════════════════════════════════════════════════
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
