# cargo-deny policy for `nika-diamond`.
#
# Layer-ban wrappers (the diamond-enforcement magic) are populated as crates
# arrive. Example template, commented out until we have real members:
#
#   [[bans.deny]]
#   name     = "tokio"
#   wrappers = ["nika-clock", "nika-fs", "nika-http", "nika-blob",
#               "nika-process", "nika-mcp", "nika-media",
#               "nika-verb-exec", "nika-verb-fetch", "nika-verb-invoke",
#               "nika-verb-infer", "nika-verb-agent",
#               "nika-runtime", "nika-daemon",
#               "nika-cli", "nika-serve", "nika-lsp", "nika-sdk",
#               "nika", "nika-kernel-mock"]

[graph]
all-features = false

[licenses]
version              = 2
confidence-threshold = 0.8
allow = [
  "AGPL-3.0-or-later",
  "MIT",
  "MIT-0",                  # MIT No Attribution — strictly MORE permissive than MIT (no attribution clause) · OSI-approved · borrow-or-share via jsonschema (nika-verb-infer)
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CDLA-Permissive-2.0",    # webpki-roots v1.0.6+ (Mozilla root certs)
]

[bans]
multiple-versions = "warn"
wildcards         = "deny"

# Layer-ban wrappers. Each [[deny]] entry scopes a crate to specific wrappers;
# any other workspace member that consumes it fails `cargo deny check`.
# Extend the `wrappers` list as L1+ effect crates (nika-http, nika-fs,
# nika-runtime, nika-daemon, verb-*) join the workspace via 12-gate admission.

# ── SUPPLY CHAIN · the 2026-08-20 arrayref lure ──────────────────────────────
# `arrayref 0.3.9` was YANKED from crates.io. The yank is the pressure, not the
# accident: a yank turns `cargo deny` red, a red blocks every push, and the
# obvious unblocking gesture is `cargo update -p arrayref`, which resolves to
# 0.3.10. Measured that day, on this workspace:
#
#   arrayref 0.3.9   ZERO dependencies (a pure macro crate · what we pin)
#   arrayref 0.3.10  depends on `proc-macro1`
#   proc-macro2 1.0.106  the legitimate crate · depends on `unicode-ident`
#   proc-macro1 1.0.107  a typosquat · depends on base64 · rustls · UREQ
#
# A proc macro runs at COMPILE time with ambient privileges. An HTTP and TLS
# stack there is a delivery and exfiltration channel, not a feature, and the
# version number sits one ahead of the crate it imitates.
#
# These two bans are purely ADDITIVE armour: neither name is in the tree today,
# so nothing changes until something tries to pull one in, at which point it
# fails closed. They do NOT resolve the yank red on 0.3.9 · that is a posture
# decision about `[advisories] yanked` and it belongs to the operator.
# Review when `blake3` moves off `arrayref`, or when a 0.3.11 appears whose
# dependency set has been READ before it is accepted.

[[bans.deny]]
name   = "proc-macro1"
reason = "typosquat of proc-macro2 · a compile-time macro that pulls ureq/rustls · see the note above"

[[bans.deny]]
name    = "arrayref"
version = "=0.3.10"
reason  = "the release that introduced the proc-macro1 edge · pin 0.3.9, whose dependency set is empty"

[[bans.deny]]
name     = "tokio"
wrappers = [
  "nika-catalog-verify",   # L4 binary: async HTTP for online catalog verification
  "nika-kernel-core",      # L0.5 base sibling (4-way split 2026-06-10): tokio dev-dep for #[tokio::test] in async io trait tests (screen.rs)
  "nika-kernel-ai",        # L0.5 ai sibling (4-way split 2026-06-10): tokio dev-dep for #[tokio::test] in async memory trait tests
  "nika-kernel-mock",      # L0.5 test mock: tokio channels for trait harness
  "nika-bm25",             # L1 memory satellite (feature=kernel gated, W4+ wire-up): tokio reserved for L2 RecallPool fan-out cooperative scheduling per ADR-078 step 6 + ADR-039 L-5 (yield_now NOT consume_budget) · Option E single-crate-feature-gated per devil's advocate 2026-05-12
  "nika-store",            # L1 memory satellite (F-P8): tokio dev-dep ONLY for #[tokio::test] over the async kernel memory-trait impls (zero runtime tokio dep — the L1-deterministic sign/verify substrate is sync at the trait boundary)
  "nika-screen",           # L1 effect crate (M2.1): tokio dev-dep for #[tokio::test] async ScreenCapture tests · B.4 wires mpsc stream worker + CancellationToken reaping
  "nika-ocr",              # L1 effect crate (M2.2): tokio dev-dep for #[tokio::test] async OcrEngine tests · B.3 wires spawn_blocking ocrs inference (sync engine off the runtime · CANCEL SAFETY contract)
  "nika-a11y",             # L1 effect crate (M2.3): tokio dev-dep for #[tokio::test] async AccessibilityTree tests · B.3 wires spawn_blocking AXUIElement walk (sync !Send handle worker-local · CANCEL SAFETY contract)
  "nika-clock",            # L1 time effect: tokio::time::sleep is the production async impl of nika-kernel Clock::sleep · 12-gate admitted 74a8ff483
  "nika-fs",               # L1 filesystem effect: tokio::fs is the production impl of the kernel fs *Dyn family (atomic temp+rename write) · announce-ladder s4 · 12-gate admitted (D-2026-06-10-N6)
  "nika-http",             # L1 http effect: tokio::net::lookup_host powers the SSRF DNS-resolve check (reqwest rides the same runtime) · announce-ladder s5
  "nika-blob",             # L1 blob effect: tokio::fs is the production CAS backend (blake3 hash · sharded layout · atomic temp+rename) · announce-ladder s6
  "nika-exec-runner",      # L1 exec effect: tokio::process is THE subprocess spawner (kill_on_drop · concurrent drain · timeout · registry cancel-by-pid) · announce floor exec · s7
  "nika-input",            # L1 write-side effect (M2.4): tokio `rt` for spawn_blocking — the sync `enigo` OS-event synthesis runs off the async runtime (worker-local · CANCEL SAFETY contract · same pattern as nika-a11y) · B.3 wires enigo
  "nika-browser",          # L1 web effect (M2.5): tokio `rt` for the per-session CDP Handler task — chromiumoxide is async-native (NO spawn_blocking) · B.3 wires chromiumoxide
  "nika-providers",
  "nika-harness",          # L1 effect (P3 · D-2026-08-04-N1): tokio io-util/sync drive the ACP wire-v1 session (JSON-lines transport · mpsc event stream · the spawned adapter's stdio underneath at B3.2)
  "nika-infer-local",      # L1.5 candle sidecar (ADR-091): tokio for the local-inference worker
  "nika-models",           # L4 local-models unit (descended from nika-cli 2026-07-12): current-thread runtime blocks the Hub pull on the nika-http seam (the registry #452 idiom)
  "nika-registry-client",  # L2 service (descended from nika-cli 2026-07-12): tokio dev-dep ONLY — the tests park a current-thread executor around the async resolve (zero runtime tokio dep · the L4 shim owns the production executor)
  "nika-verb-infer",       # L2 verb (s9): tokio dev-dep for #[tokio::test] run() tests over the mock registry (zero runtime tokio dep · transport inherited from the resolved provider)
  "nika-verb-exec",        # L2 verb (s10): tokio dev-dep for #[tokio::test] run() tests over MockShell (zero runtime tokio dep · subprocess owned by the injected runner)
  "nika-verb-invoke",      # L2 verb (s11): tokio dev-dep for #[tokio::test] run() tests over an inline mock ToolExecute (zero runtime tokio dep · dispatch owned by the injected executor)
  "nika-cli",              # L4 operator surface (WIP seed 2026-06-11): tokio dev-dep for the #[tokio::test] e2e pipeline rehearsal over the async verb crates (zero runtime tokio dep · the lib fold + bin replay are sync)
  "nika-verb-agent",       # L2 verb (s12): tokio dev-dep for #[tokio::test] loop tests over the three mock seams (zero runtime tokio dep · inference + dispatch ride the injected providers)
  "nika-builtin",          # L1.5 (s16): tokio `rt` for spawn_blocking — nika:jq's sync jaq eval runs off the async executor (model-controlled cost · the nika-ocr/a11y pattern) + #[tokio::test] over the mock seams
  "nika-extract",          # L1.5 (s17): tokio `rt` for spawn_blocking — the HTML/feed parse of a model-fetched body (up to 64 MiB) runs off the async executor (same pattern) + #[tokio::test]
  "nika-runtime",          # L3 orchestrator (s18): tokio dev-dep for the #[tokio::test] conformance floor over the four verb crates — the crate's own code keeps ZERO tokio edge (async rides the injected verb seams); the descended production composer (2026-07-22) reaches tokio only TRANSITIVELY through the wrapper effect crates below (nika-fs/http/exec-runner), never directly
  "nika-service-execution", # L3 shared driver: tokio dev-dep ONLY for #[tokio::test] over the async service seam (zero runtime tokio dep)
  "nika-serve",            # L4 remote HTTP: tokio net/rt/sync own the listener (W06 · loopback Bearer server)
  "nika-dap",              # L4 forensics (the trust plane · 2026-07-20): tokio dev-dep ONLY — the anchor submit-path tests park a current-thread executor around the HttpPostDyn seam (zero runtime tokio dep · the L4 shim owns the production executor)
  "nika-trace",            # L4 flight-recorder reader (descended from nika-cli 2026-08-11 · the 15k wall · ADR-110): the anchor verb's production submit parks a current-thread executor around the nika-http Rekor/RFC 3161 round-trips (the nika-models idiom · the lib is sync everywhere else)
  # Transitive consumers via reqwest → hyper stack (allowed through nika-catalog-verify)
  # tower-http joined via chromiumoxide's reqwest 0.13 tree (nika-browser M2.5).
  "reqwest", "hyper", "hyper-util", "hyper-rustls", "h2",
  # async-compression joined via tower-http when reqwest grew the transparent
  # gzip/brotli/deflate decode features (nika-http · 2026-06-12).
  "async-compression",
  "tower", "tower-http", "tokio-util", "tokio-rustls",
  # Transitive consumers via chromiumoxide (nika-browser's CDP backend · M2.5):
  # the CDP WebSocket rides async-tungstenite/tokio · tower-http via its reqwest
  "chromiumoxide", "async-tungstenite", "tower-http",
]

[[bans.deny]]
name     = "reqwest"
wrappers = [
  "nika-catalog-verify",   # L4 binary: HTTP probes for catalog drift detection
  "nika-http",             # L1 http effect: THE production HttpGet/HttpPost impl (SSRF static + DNS-resolve + per-hop redirect re-check · response size cap) · announce-ladder s5
  "chromiumoxide",         # transitive: nika-browser's CDP backend uses reqwest for its WebSocket debug-URL bootstrap (NOT the fetcher — that feature stays OFF) · scoped to the lib, never a nika-* direct dep
]

# hyper is not explicitly banned — it's always transitive via reqwest,
# which is already scoped to nika-catalog-verify above.

[advisories]
version = 2
yanked  = "deny"
# Advisory ignores (CVE IDs) listed explicitly here — never blanket-suppress.
# Document every entry: RUSTSEC ID + reason + upstream issue + review date.
ignore = [
  # "RUSTSEC-YYYY-NNNN",  # example only — always document reason + upstream issue
  #
  # RUSTSEC-2024-0436 · `paste` is unmaintained (archived, no vuln). It is a
  # COMPILE-TIME-ONLY proc-macro (token pasting) — zero runtime surface. Pulled
  # transitively by the candle ML linalg stack (gemm/pulp/tokenizers/metal →
  # nika-infer-local, ADR-091). No patched version exists and no removable path
  # short of forking the entire ML ecosystem. Informational advisory, not a
  # vulnerability. Review: 2026-06-22. Upstream: github.com/dtolnay/paste (archived).
  "RUSTSEC-2024-0436",
  #
  # arrayref@0.3.9 · YANKED 2026-08-20, and the yank is the pressure rather than
  # the accident. A yank turns this gate red, the red blocks every push in the
  # repo, and the obvious unblocking gesture is `cargo update -p arrayref`,
  # which resolves to 0.3.10. Measured on this workspace that day ·
  #   arrayref 0.3.9   ZERO dependencies · a pure macro crate · what we pin
  #   arrayref 0.3.10  depends on `proc-macro1`
  #   proc-macro2 1.0.106  the legitimate crate · depends on `unicode-ident`
  #   proc-macro1 1.0.107  a typosquat · depends on base64 · rustls · UREQ
  # A proc macro runs at COMPILE time with ambient privileges; an HTTP and TLS
  # stack there is a delivery channel, not a feature, and its version sits one
  # ahead of the crate it imitates. So we keep 0.3.9, whose checksum is pinned
  # above and whose dependency set is empty, and the [[bans.deny]] pair below
  # makes the successor and the typosquat fail closed.
  # This exception is per-crate AND per-version by design · the yank gate stays
  # `deny` for everything else. Review: when blake3 moves off arrayref, or when
  # a 0.3.11 appears whose dependency set has been READ before it is accepted.
  # Upstream: reported to crates.io security + the arrayref/blake3 maintainers.
  "arrayref@0.3.9",
  #
  # RUSTSEC-2026-0194 + RUSTSEC-2026-0195 · quick-xml DoS pair (quadratic
  # dup-attr check + unbounded NsReader namespace allocation · fix >=0.41.0).
  # 2026-07-10: the DEFAULT-BUILD graph is CLEAN — feed-rs 2.4.0 shipped the
  # quick-xml 0.41 bump (taken same-week) and nika-extract's direct sitemap
  # parser rides 0.41.0. What remains is feature-gated OFF, never in a
  # default or release build:
  #   · 0.30.0 ← xcb 1.7 ← xcap 0.9.6 ← nika-screen — xcap OFF by default
  #     (ADR-081 · headless) + Linux-X11-only.
  #   · 0.39.4 · same feature-gated screen-capture cluster.
  # Entries stay ONLY for `--features xcap` dev builds on Linux/X11.
  # Review: 2026-08-10 · drop when xcb/xcap cross 0.41. Mirror: .cargo/audit.toml.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
