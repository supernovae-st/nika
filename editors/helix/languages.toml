# Nika Workflow Language — Helix Configuration
#
# Nika YAML workflows (*.nika.yaml) with LSP support.
# Inherits YAML Tree-sitter grammar with Nika-specific queries.
#
# Setup:
#   1. Copy this file to ~/.config/helix/languages.toml
#      (or merge into your existing languages.toml)
#   2. Copy queries/nika/ to ~/.config/helix/runtime/queries/nika/
#   3. Ensure `nika-lsp` is on $PATH:
#        cargo install nika-lsp
#        # or: brew install supernovae-st/tap/nika-lsp
#
# Verify: `hx --health nika` should show the language and LSP.

# ─────────────────────────────────────────────────────────────────
# Language definition
# ─────────────────────────────────────────────────────────────────

[[language]]
name = "nika"
scope = "source.nika"
injection-regex = "nika"
file-types = [{ glob = "*.nika.yaml" }]
roots = ["nika.toml", ".nika"]
language-servers = ["nika-lsp", "yaml-language-server"]
indent = { tab-width = 2, unit = "  " }
comment-token = "#"
auto-format = false

# Reuse the YAML Tree-sitter grammar — Nika is valid YAML with semantic overlay.
# Helix ships tree-sitter-yaml by default; we just point to it.
grammar = "yaml"

# ─────────────────────────────────────────────────────────────────
# Language servers
# ─────────────────────────────────────────────────────────────────

[language-server.nika-lsp]
command = "nika-lsp"
# Alternative if nika-lsp is not installed but nika has lsp feature:
# command = "nika"
# args = ["lsp", "--stdio"]

[language-server.yaml-language-server]
command = "yaml-language-server"
args = ["--stdio"]

[language-server.yaml-language-server.config.yaml]
# Associate nika workflow schema with *.nika.yaml files
schemas = { "https://nika.sh/schema/workflow.json" = "*.nika.yaml" }
validate = true
hover = true
completion = true
