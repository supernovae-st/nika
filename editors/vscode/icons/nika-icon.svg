<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background: dark slate matching galleryBanner #0f172a -->
  <rect width="256" height="256" rx="32" fill="#0f172a"/>
  <!-- Nika butterfly — centered, scaled up from 32x32 to fit 256x256 -->
  <g transform="translate(32, 32) scale(6)">
    <!-- Left upper wing -->
    <path d="M16 12 C13 5, 4 3, 3 10 C2 15, 9 17, 16 14" fill="#60A5FA"/>
    <!-- Right upper wing -->
    <path d="M16 12 C19 5, 28 3, 29 10 C30 15, 23 17, 16 14" fill="#60A5FA"/>
    <!-- Left lower wing -->
    <path d="M16 16 C12 17, 5 20, 6 25 C7 28, 12 27, 16 20" fill="#93C5FD"/>
    <!-- Right lower wing -->
    <path d="M16 16 C20 17, 27 20, 26 25 C25 28, 20 27, 16 20" fill="#93C5FD"/>
    <!-- Body -->
    <ellipse cx="16" cy="16" rx="1.2" ry="5" fill="#BFDBFE"/>
    <!-- Antennae -->
    <line x1="15" y1="11" x2="12" y2="6" stroke="#BFDBFE" stroke-width="0.6" stroke-linecap="round"/>
    <line x1="17" y1="11" x2="20" y2="6" stroke="#BFDBFE" stroke-width="0.6" stroke-linecap="round"/>
    <circle cx="12" cy="6" r="0.7" fill="#BFDBFE"/>
    <circle cx="20" cy="6" r="0.7" fill="#BFDBFE"/>
  </g>
</svg>
