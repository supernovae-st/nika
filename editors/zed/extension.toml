id = "nika"
name = "Nika Workflow Language"
version = "0.1.0"
schema_version = 1
authors = ["SuperNovae Studio <hello@supernovae.studio>"]
description = "Language support for Nika (.nika.yaml) workflow files — syntax highlighting, LSP diagnostics, completions, hover docs, and go-to-definition."
repository = "https://github.com/supernovae-st/nika"

[grammars.yaml]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-yaml"
rev = "4463985dfccc640f3d6991e3396a2047610cf5f8"

[language_servers.nika-lsp]
name = "Nika LSP"
languages = ["Nika"]

[language_servers.nika-lsp.language_ids]
"Nika" = "nika"

[context_servers.nika-mcp]
