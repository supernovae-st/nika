# Diamond pattern - fan-out + fan-in
#
# DAG: read_code → [security, quality] → report
#
schema: "nika/workflow@0.12"

provider: openai
model: gpt-4o-mini

tasks:
  - id: read_code
    exec:
      command: "cat src/main.rs | head -50"

  - id: security
    depends_on: [read_code]
    with:
      code: $read_code
    infer:
      prompt: |
        Analyze this code for security issues:
        {{with.code}}

        List any security concerns briefly.
      model: haiku  # Fast/cheap

  - id: quality
    depends_on: [read_code]
    with:
      code: $read_code
    infer:
      prompt: |
        Analyze this code for quality issues:
        {{with.code}}

        List any code quality concerns briefly.
      model: haiku

  - id: report
    depends_on: [security, quality]
    with:
      security_review: $security
      quality_review: $quality
    infer:
      prompt: |
        Create a brief code review summary:

        SECURITY:
        {{with.security_review}}

        QUALITY:
        {{with.quality_review}}
