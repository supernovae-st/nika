# Exec-only workflow - no LLM needed
#
# DAG: [list_files, show_date] → combine
#
schema: "nika/workflow@0.12"

tasks:
  - id: list_files
    exec:
      command: "ls -la"

  - id: show_date
    exec:
      command: "date"

  - id: combine
    depends_on: [list_files, show_date]
    with:
      files: $list_files
      date: $show_date
    exec:
      command: "echo 'Files:' && echo '{{with.files}}' && echo 'Date: {{with.date}}'"
