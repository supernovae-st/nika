# SPDX-License-Identifier: AGPL-3.0-or-later
# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
#
# image-og-pipeline — brief in, OG image set + provenance manifest out.
#
# Why this one file matters ·
#   - assets, not blobs · `nika:image_generate` SAVES files under a DECLARED
#     `permits.fs` boundary and returns paths + dimensions + sha256 — image
#     bytes never ride workflow outputs, logs or traces.
#   - offline-first · `provider: mock` renders real, decodable PNGs with
#     zero network and zero keys · the pipeline is testable in CI as-is.
#     Production is a one-line flip · `provider: gemini` (GEMINI_API_KEY)
#     or `provider: openai` (OPENAI_API_KEY).
#   - provenance · every batch writes a `*.manifest.json` beside the assets
#     (request echo · per-image sha256 · usage · warnings · your metadata).
nika: v1
workflow: image-og-pipeline
description: "Generate the launch OG hero variants into ./assets/og with a provenance manifest"

permits:
  fs: { write: ["./assets/og/**"] }   # the ONLY place assets may land (NIKA-SEC-004)
  tools: ["nika:image_generate"]

vars:
  brief:
    type: string
    default: "OG hero — a monarch butterfly over a deep-blue nebula, editorial photo, negative space left"
    description: "The creative brief the provider renders"

tasks:
  # invoke · the whole pipeline is ONE task — generate → validate (magic
  # bytes + dimensions) → save (atomic · collision-probed) → manifest.
  - id: hero
    invoke:
      tool: "nika:image_generate"
      args:
        provider: mock                # offline + deterministic · flip to gemini/openai for real renders
        prompt: "${{ vars.brief }}"
        aspect_ratio: "16:9"
        n: 2                          # two variants to A/B
        output_dir: "./assets/og"
        filename_prefix: "launch-hero"
        metadata: { campaign: "launch", page_slug: "home" }

# Typed return · paths + the manifest, ready for a caller (a site build,
# a CMS uploader, a QR landing-page generator…).
outputs:
  images: ${{ tasks.hero.output.images }}
  manifest: ${{ tasks.hero.output.manifest_path }}
