# Multi-provider workflow - Claude + OpenAI
#
# DAG: topic → [claude_view, openai_view] → synthesis
#
schema: "nika/workflow@0.1"

provider: openai
model: gpt-4o-mini

tasks:
  - id: topic
    exec:
      command: "echo 'The future of AI assistants'"

  - id: claude_view
    depends_on: [topic]
    with:
      subject: topic
    infer:
      prompt: |
        Give a brief (2-3 sentences) perspective on: {{with.subject}}
      model: haiku

  - id: openai_view
    depends_on: [topic]
    with:
      subject: topic
    infer:
      prompt: |
        Give a brief (2-3 sentences) perspective on: {{with.subject}}
      provider: openai
      model: gpt-4o-mini

  - id: synthesis
    depends_on: [claude_view, openai_view]
    with:
      claude: claude_view
      gpt: openai_view
    infer:
      prompt: |
        Compare these two AI perspectives:

        CLAUDE: {{with.claude}}

        GPT: {{with.gpt}}

        What's similar? What's different? (2-3 sentences)
