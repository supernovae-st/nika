# Real NovaNet MCP Integration Test
#
# This workflow tests REAL MCP communication with NovaNet.
# Requires: Neo4j running, NovaNet MCP binary at specified path.
#
# Usage:
#   cargo run -- run examples/novanet-real-test.nika.yaml

schema: "nika/workflow@0.12"
provider: mock

mcp:
  novanet:
    command: cargo
    args: [run, --manifest-path, ../../novanet/tools/novanet-mcp/Cargo.toml]
    env:
      NOVANET_MCP_NEO4J_URI: bolt://localhost:7687
      NOVANET_MCP_NEO4J_USER: neo4j
      NOVANET_MCP_NEO4J_PASSWORD: novanetpassword
      RUST_LOG: info

tasks:
  # Query NovaNet for entities
  - id: count_entities
    invoke:
      mcp: novanet
      tool: novanet_search
      params:
        query: "*"
        mode: fulltext
        kinds: ["Entity"]

  # Show the result
  - id: show_count
    depends_on: [count_entities]
    with:
      count: $count_entities
    exec:
      command: "echo 'Entity count from NovaNet: {{with.count}}'"
