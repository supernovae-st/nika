# Structured output — natural prompt, validated JSON
#
# DAG: extract → validate_downstream
#
# Run: nika run examples/04-structured-output/extract-data.nika.yaml
# Test: nika run examples/04-structured-output/extract-data.nika.yaml --provider mock

schema: "nika/workflow@0.12"
workflow: structured-output
description: "Extract structured data from a natural language description"

provider: mock
model: mock-default

inputs:
  description: "Alice is a 30-year-old developer from Paris who specializes in Rust and Python. She has 8 years of experience and speaks French and English."

tasks:
  # Natural prompt — NEVER mention JSON in the prompt.
  # The 5-layer defense handles schema enforcement automatically.
  - id: extract
    infer: "Tell me about this person: {{inputs.description}}"
    structured:
      schema:
        type: object
        properties:
          name: { type: string }
          age: { type: number, minimum: 0 }
          city: { type: string }
          skills: { type: array, items: { type: string }, minItems: 1 }
          experience_years: { type: number, minimum: 0 }
          languages: { type: array, items: { type: string } }
        required: [name, age, skills]
      enable_repair: true
      max_retries: 3

  - id: use_data
    depends_on: [extract]
    with:
      person: $extract
    infer: |
      Using this profile data, write a one-paragraph professional bio:
      Name: {{with.person.name}}
      Skills: {{with.person.skills | join(", ")}}
      Experience: {{with.person.experience_years}} years
