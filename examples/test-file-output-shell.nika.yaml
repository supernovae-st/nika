# Test File Output: MCP + Files with Shell Mode
#
# Tests file output with proper shell: true for metacharacters
#
# Usage:
#   cd tools/nika && cargo run -- run ../../examples/test-file-output-shell.nika.yaml

schema: "nika/workflow@0.12"
workflow: test-file-output-shell
description: Test MCP with file output (shell mode)
provider: mock

mcp:
  novanet:
    command: novanet-mcp
    args: []
    env:
      NOVANET_MCP_NEO4J_URI: bolt://localhost:7687
      NOVANET_MCP_NEO4J_USER: neo4j
      NOVANET_MCP_NEO4J_PASSWORD: novanetpassword

tasks:
  # Step 1: Setup with shell mode for complex command
  - id: setup
    exec:
      command: "mkdir -p /tmp/nika-shell-output && echo 'Directory created'"
      shell: true

  # Step 2: Get stats
  - id: get_stats
    depends_on: [setup]
    invoke:
      mcp: novanet
      tool: novanet_describe
      params:
        describe: stats

  # Step 3: Search
  - id: search
    depends_on: [setup]
    invoke:
      mcp: novanet
      tool: novanet_search
      params:
        query: "qr"
        limit: 5

  # Step 4: Save stats using tee with shell mode
  - id: save_stats
    depends_on: [get_stats]
    with:
      data: $get_stats
    exec:
      command: "echo {{with.data|shell}} > /tmp/nika-shell-output/stats.txt && echo 'Stats saved'"
      shell: true

  # Step 5: Save search using tee with shell mode
  - id: save_search
    depends_on: [search]
    with:
      data: $search
    exec:
      command: "echo {{with.data|shell}} > /tmp/nika-shell-output/search.txt && echo 'Search saved'"
      shell: true

  # Step 6: Show files with shell mode
  - id: show_files
    depends_on: [save_stats, save_search]
    exec:
      command: "echo '=== Files created ===' && ls -la /tmp/nika-shell-output/ && echo '=== stats.txt ===' && cat /tmp/nika-shell-output/stats.txt | head -c 500"
      shell: true
