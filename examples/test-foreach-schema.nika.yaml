# Test Workflow: for_each with Binding References + Schema Validation
#
# Demonstrates the for_each binding reference feature:
# - $alias format: for_each: "$locales"
# - Template format: for_each: "{{with.locales}}"
#
# This workflow is AGENTIC:
# - Discovers locales from NovaNet (not hardcoded or LLM-generated)
# - Discovers entities from NovaNet for context
# - Parallelizes independent MCP calls
# - Uses proper bindings between tasks
#
# Prerequisites:
#   - NovaNet MCP server running (novanet-mcp binary)
#   - Neo4j database seeded with locales
#
# Usage:
#   cd tools/nika && cargo run -- run ../../examples/test-foreach-schema.nika.yaml

schema: "nika/workflow@0.12"
workflow: test-foreach-schema
description: for_each binding references with schema validation and NovaNet discovery
provider: claude
model: claude-sonnet-4-20250514

mcp:
  novanet:
    command: /Users/thibaut/.cargo/bin/novanet-mcp
    args: []
    env:
      NOVANET_MCP_NEO4J_URI: bolt://localhost:7687
      NOVANET_MCP_NEO4J_USER: neo4j
      NOVANET_MCP_NEO4J_PASSWORD: novanetpassword

tasks:
  # ============================================================================
  # PHASE 1: Discovery (parallel tasks)
  # ============================================================================

  # Step 1a: Discover locales from NovaNet with regional diversity
  - id: discover_locales
    invoke:
      mcp: novanet
      tool: novanet_search
      params:
        query: "*"
        mode: fulltext
        kinds: ["Locale"]
        limit: 6

  # Step 1b: Discover an entity for tagline context (parallel with 1a)
  - id: discover_entity
    invoke:
      mcp: novanet
      tool: novanet_describe
      params:
        describe: entity
        entity_key: qr-code

  # ============================================================================
  # PHASE 2: Locale Processing (for_each over discovered locales)
  # ============================================================================

  # Step 2: Process each locale using $alias binding reference
  # This demonstrates for_each: "$locales" syntax with NovaNet data
  - id: process_locales
    depends_on: [discover_locales, discover_entity]
    with:
      locales: $discover_locales
      entity: $discover_entity
    for_each: "$locales.rows"
    as: locale
    infer:
      prompt: |
        # Tagline Generation Task

        ## Entity Context from NovaNet
        {{with.entity}}

        ## Target Locale
        Code: {{locale.code}}
        Language: {{locale.language}}
        Region: {{locale.region}}

        ## Instructions
        Generate a localized tagline for the entity's product/service.

        The tagline should:
        1. Be culturally appropriate for {{locale.region}}
        2. Be catchy and memorable in {{locale.language}}
        3. Reference the entity's core concept in the local language
        4. Feel native, not translated

        Return the tagline with metadata.
      temperature: 0.4
    output:
      format: json
      max_retries: 2
      schema:
        type: object
        additionalProperties: false
        properties:
          locale_code:
            type: string
            pattern: "^[a-z]{2}-[A-Z]{2}$"
          language:
            type: string
          region:
            type: string
          tagline:
            type: string
            minLength: 10
            maxLength: 100
          word_count:
            type: integer
            minimum: 2
            maximum: 15
          tone:
            type: string
            enum: [professional, friendly, playful, elegant, bold]
        required: [locale_code, language, region, tagline, word_count, tone]

  # ============================================================================
  # PHASE 3: Aggregation (depends on all locale processing)
  # ============================================================================

  # Step 3: Aggregate all taglines into a summary
  - id: aggregate_taglines
    depends_on: [process_locales, discover_entity, discover_locales]
    with:
      all_taglines: $process_locales
      entity: $discover_entity
      original_locales: $discover_locales
    infer:
      prompt: |
        # Tagline Aggregation Task

        ## Entity Context
        {{with.entity}}

        ## Discovered Locales from NovaNet
        {{with.original_locales}}

        ## Generated Taglines
        {{with.all_taglines}}

        ## Instructions
        Analyze the collection of localized taglines and provide:
        1. Overall quality assessment
        2. Consistency check across locales
        3. Regional pattern analysis (do taglines reflect regional preferences?)
        4. Recommendations for improvement

        Return a structured analysis.
      temperature: 0
    output:
      format: json
      max_retries: 2
      schema:
        type: object
        additionalProperties: false
        properties:
          entity_key:
            type: string
          total_taglines:
            type: integer
          locales_covered:
            type: array
            items:
              type: string
          regions_covered:
            type: array
            items:
              type: string
          quality_assessment:
            type: object
            properties:
              overall_score:
                type: integer
                minimum: 0
                maximum: 100
              consistency_score:
                type: integer
                minimum: 0
                maximum: 100
              cultural_fit_score:
                type: integer
                minimum: 0
                maximum: 100
              native_feel_score:
                type: integer
                minimum: 0
                maximum: 100
            required: [overall_score, consistency_score, cultural_fit_score, native_feel_score]
          regional_patterns:
            type: array
            items:
              type: object
              properties:
                region:
                  type: string
                observation:
                  type: string
              required: [region, observation]
          recommendations:
            type: array
            items:
              type: object
              properties:
                locale:
                  type: string
                suggestion:
                  type: string
                priority:
                  type: string
                  enum: [low, medium, high]
              required: [locale, suggestion, priority]
        required: [entity_key, total_taglines, locales_covered, regions_covered, quality_assessment, recommendations]
