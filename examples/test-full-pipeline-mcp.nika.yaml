# Test Full Pipeline: MCP + Binding + Output Files
#
# This workflow tests:
# 1. MCP Perplexity search
# 2. Data binding between steps
# 3. LLM inference with context
# 4. File output via exec
#
# Usage:
#   cd tools/nika && cargo run -- run ../../examples/test-full-pipeline-mcp.nika.yaml

schema: "nika/workflow@0.12"
workflow: test-full-pipeline-mcp
description: Test MCP integration with binding and file output
provider: claude

# MCP servers
mcp:
  perplexity:
    command: npx
    args: ["-y", "@perplexity-ai/mcp-server"]
    env:
      PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY}"

tasks:
  # Step 1: Create output directory
  - id: setup
    exec:
      command: "mkdir -p /tmp/nika-test-output && echo 'Output dir: /tmp/nika-test-output'"
      shell: true

  # Step 2: Search with Perplexity MCP
  - id: search_topic
    depends_on: [setup]
    invoke:
      mcp: perplexity
      tool: perplexity_search_web
      params:
        query: "knowledge graphs AI 2024 trends"
        recency: month

  # Step 3: Extract key points using LLM (binding from step 2)
  - id: extract_points
    depends_on: [search_topic]
    with:
      search_results: search_topic
    infer: |
      Based on these search results about knowledge graphs for AI:

      {{with.search_results}}

      Extract the top 3 most important trends. Format as a numbered list.

  # Step 4: Save search results to file
  - id: save_search
    depends_on: [search_topic]
    with:
      results: search_topic
    exec:
      command: "echo {{with.results|shell}} > /tmp/nika-test-output/01-search-results.txt && echo 'Saved search results'"
      shell: true

  # Step 5: Save extracted points to file
  - id: save_points
    depends_on: [extract_points]
    with:
      points: extract_points
    exec:
      command: "echo {{with.points|shell}} > /tmp/nika-test-output/02-key-points.txt && echo 'Saved key points'"
      shell: true

  # Step 6: Generate final summary (binding from previous steps)
  - id: generate_summary
    depends_on: [extract_points]
    with:
      points: extract_points
    infer: |
      Create a 2-sentence executive summary based on:

      {{with.points}}

  # Step 7: Save summary to file
  - id: save_summary
    depends_on: [generate_summary]
    with:
      summary: generate_summary
    exec:
      command: "echo {{with.summary|shell}} > /tmp/nika-test-output/03-summary.txt && echo 'Saved summary'"
      shell: true

  # Step 8: List output files
  - id: list_output
    depends_on: [save_search, save_points, save_summary]
    exec:
      command: "echo '=== Output Files ===' && ls -la /tmp/nika-test-output/"
      shell: true
