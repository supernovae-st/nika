# Test NovaNet Pipeline: MCP + Binding + Output Files
#
# This workflow tests:
# 1. NovaNet MCP queries
# 2. Data binding between steps
# 3. LLM inference with context
# 4. File output via exec
#
# Usage:
#   cd tools/nika && cargo run -- run ../../examples/test-novanet-pipeline.nika.yaml

schema: "nika/workflow@0.3"
workflow: test-novanet-pipeline
description: Test NovaNet MCP integration with binding and file output
provider: claude

# MCP servers (using pre-built binary for fast startup)
mcp:
  novanet:
    command: /Users/thibaut/.cargo/bin/novanet-mcp
    args: []
    env:
      NOVANET_MCP_NEO4J_URI: bolt://localhost:7687
      NOVANET_MCP_NEO4J_USER: neo4j
      NOVANET_MCP_NEO4J_PASSWORD: novanetpassword

tasks:
  # Step 1: Create output directory
  - id: setup
    exec:
      command: "mkdir -p /tmp/nika-novanet-output && echo 'Output dir created'"
      shell: true

  # Step 2: Query schema with NovaNet MCP
  - id: get_schema
    depends_on: [setup]
    invoke:
      mcp: novanet
      tool: novanet_describe
      params:
        describe: schema

  # Step 3: Search entities
  - id: search_entities
    depends_on: [setup]
    invoke:
      mcp: novanet
      tool: novanet_search
      params:
        query: "qr"
        limit: 5

  # Step 4: Extract insights using LLM (binding from steps 2 & 3)
  - id: analyze_graph
    depends_on: [get_schema, search_entities]
    with:
      schema: get_schema
      entities: search_entities
    infer: |
      Analyze this knowledge graph:

      Schema: {{with.schema}}

      Search results for "qr": {{with.entities}}

      Provide 3 key insights about the graph structure in a numbered list.

  # Step 5: Save schema to file
  - id: save_schema
    depends_on: [get_schema]
    with:
      data: get_schema
    exec:
      command: "echo {{with.data|shell}} > /tmp/nika-novanet-output/01-schema.txt && echo 'Saved schema'"
      shell: true

  # Step 6: Save search results to file
  - id: save_search
    depends_on: [search_entities]
    with:
      data: search_entities
    exec:
      command: "echo {{with.data|shell}} > /tmp/nika-novanet-output/02-search.txt && echo 'Saved search'"
      shell: true

  # Step 7: Save analysis to file
  - id: save_analysis
    depends_on: [analyze_graph]
    with:
      analysis: analyze_graph
    exec:
      command: "echo {{with.analysis|shell}} > /tmp/nika-novanet-output/03-analysis.txt && echo 'Saved analysis'"
      shell: true

  # Step 8: List output files
  - id: list_output
    depends_on: [save_schema, save_search, save_analysis]
    exec:
      command: "echo '=== Output Files ===' && ls -la /tmp/nika-novanet-output/ && echo '=== Content Preview ===' && head -5 /tmp/nika-novanet-output/*.txt"
      shell: true
