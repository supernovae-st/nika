# Test NovaNet Simple: MCP + Binding + Console Output
#
# Simpler test without file writing to avoid shell escaping issues
#
# Usage:
#   cd tools/nika && cargo run -- run ../../examples/test-novanet-simple.nika.yaml

schema: "nika/workflow@0.12"
workflow: test-novanet-simple
description: Test NovaNet MCP integration with binding
provider: claude

mcp:
  novanet:
    command: /Users/thibaut/.cargo/bin/novanet-mcp
    args: []
    env:
      NOVANET_MCP_NEO4J_URI: bolt://localhost:7687
      NOVANET_MCP_NEO4J_USER: neo4j
      NOVANET_MCP_NEO4J_PASSWORD: novanetpassword

tasks:
  # Step 1: Query schema
  - id: get_schema
    invoke:
      mcp: novanet
      tool: novanet_describe
      params:
        describe: stats

  # Step 2: Search entities
  - id: search_entities
    invoke:
      mcp: novanet
      tool: novanet_search
      params:
        query: "qr"
        limit: 3

  # Step 3: Analyze with LLM (binding)
  - id: analyze
    depends_on: [get_schema, search_entities]
    with:
      stats: get_schema
      entities: search_entities
    infer: |
      Given these graph stats: {{with.stats}}
      And these entities: {{with.entities}}

      In exactly 2 sentences, what is this knowledge graph about?

  # Step 4: Echo final result
  - id: show_result
    depends_on: [analyze]
    with:
      analysis: analyze
    exec:
      command: "echo 'Analysis complete. Result length:' && echo '{{with.analysis}}' | wc -c"
      shell: true
