# Test Workflow: NovaNet MCP Integration with Structured Outputs
#
# Demonstrates complete NovaNet + Nika integration:
# 1. novanet_describe: Load entity context
# 2. novanet_context (knowledge): Get locale-specific terms
# 3. novanet_context (block): Full RLM-on-KG context assembly
# 4. Structured output with inline schema validation
#
# This workflow is AGENTIC:
# - Discovers entities and locales from NovaNet (not hardcoded)
# - Parallelizes independent MCP calls
# - Uses proper bindings between tasks
#
# Prerequisites:
#   - NovaNet MCP server running (novanet-mcp binary)
#   - Neo4j database seeded
#
# Usage:
#   cd tools/nika && cargo run -- run ../../examples/test-novanet-structured.nika.yaml

schema: "nika/workflow@0.9"
workflow: test-novanet-structured
description: NovaNet MCP integration with structured output enforcement
provider: claude
model: claude-sonnet-4-20250514

mcp:
  novanet:
    command: /Users/thibaut/.cargo/bin/novanet-mcp
    args: []
    env:
      NOVANET_MCP_NEO4J_URI: bolt://localhost:7687
      NOVANET_MCP_NEO4J_USER: neo4j
      NOVANET_MCP_NEO4J_PASSWORD: novanetpassword

tasks:
  # ============================================================================
  # PHASE 1: Discovery (parallel tasks - no dependencies)
  # ============================================================================

  # Step 1a: Discover available entities from NovaNet
  - id: discover_entities
    invoke:
      mcp: novanet
      tool: novanet_search
      params:
        query: "*"
        mode: fulltext
        kinds: ["Entity"]
        limit: 5

  # Step 1b: Discover available locales from NovaNet (parallel with 1a)
  - id: discover_locales
    invoke:
      mcp: novanet
      tool: novanet_search
      params:
        query: "*"
        mode: fulltext
        kinds: ["Locale"]
        limit: 5

  # ============================================================================
  # PHASE 2: Context Assembly (depends on discovery)
  # ============================================================================

  # Step 2a: Describe the first discovered entity
  - id: describe_entity
    depends_on: [discover_entities]
    with:
      entities: discover_entities
    invoke:
      mcp: novanet
      tool: novanet_describe
      params:
        describe: entity
        entity_key: "{{with.entities.rows[0].key}}"

  # Step 2b: Get knowledge atoms for first discovered locale (parallel with 2a)
  - id: get_terms
    depends_on: [discover_locales]
    with:
      locales: discover_locales
    invoke:
      mcp: novanet
      tool: novanet_context
      params:
        locale: "{{with.locales.rows[0].code}}"
        mode: knowledge
        atom_type: term
        domain: technology

  # Step 2c: Get generation context with RLM-on-KG (depends on both discoveries)
  - id: get_generation_context
    depends_on: [discover_entities, discover_locales]
    with:
      entities: discover_entities
      locales: discover_locales
    invoke:
      mcp: novanet
      tool: novanet_context
      params:
        focus_key: "{{with.entities.rows[0].key}}"
        locale: "{{with.locales.rows[0].code}}"
        mode: block
        token_budget: 4000
        spreading_depth: 2

  # ============================================================================
  # PHASE 3: Content Generation (depends on all context)
  # ============================================================================

  # Step 3: Generate EntityNative content with structured output
  - id: generate_native_content
    depends_on: [describe_entity, get_terms, get_generation_context, discover_locales]
    with:
      entity: describe_entity
      terms: get_terms
      context: get_generation_context
      locales: discover_locales
    infer:
      prompt: |
        # Task: Generate EntityNative Content

        ## Entity Context
        {{with.entity}}

        ## Locale Terms
        {{with.terms}}

        ## Generation Context (RLM-on-KG)
        {{with.context}}

        ## Instructions
        Generate the EntityNative content for this entity in the target locale.

        Use the denomination_forms from the generation context.
        Include proper SEO metadata using locale-appropriate terms.
        Follow the language conventions and cultural context from the locale data.

        The locale code is: {{with.locales.rows[0].code}}

        Return structured JSON matching the schema exactly.
      temperature: 0.2
    output:
      format: json
      max_retries: 2
      schema:
        type: object
        additionalProperties: false
        properties:
          key:
            type: string
            pattern: "^entity-native:[a-z0-9-]+@[a-z]{2}-[A-Z]{2}$"
            description: "EntityNative key in format entity-native:slug@locale"
          denomination_forms:
            type: object
            properties:
              text:
                type: string
                description: Prose form for body content
              title:
                type: string
                description: Capitalized form for headings
              abbrev:
                type: string
                description: Short form after first mention
              url:
                type: string
                pattern: "^[a-z0-9-]+$"
                description: URL-safe slug form
            required: [text, title, abbrev, url]
          meta:
            type: object
            properties:
              title:
                type: string
                maxLength: 60
              description:
                type: string
                maxLength: 160
              keywords:
                type: array
                items:
                  type: string
            required: [title, description, keywords]
          content:
            type: object
            properties:
              headline:
                type: string
              tagline:
                type: string
              intro_paragraph:
                type: string
            required: [headline, tagline, intro_paragraph]
        required: [key, denomination_forms, meta, content]

  # ============================================================================
  # PHASE 4: Validation (depends on generated content)
  # ============================================================================

  # Step 4: Validate and summarize the generated content
  - id: validate_content
    depends_on: [generate_native_content, describe_entity, discover_locales]
    with:
      native: generate_native_content
      entity: describe_entity
      locales: discover_locales
    infer:
      prompt: |
        # Validation Task

        ## Generated EntityNative Content
        {{with.native}}

        ## Original Entity Context
        {{with.entity}}

        ## Target Locale
        {{with.locales.rows[0].code}}

        Validate this EntityNative content against:
        1. Proper language usage for the target locale
        2. SEO best practices (title length, description length)
        3. Consistency between denomination_forms and content
        4. URL slug validity
        5. Alignment with the original entity semantics

        Return validation results.
      temperature: 0
    output:
      format: json
      max_retries: 1
      schema:
        type: object
        properties:
          is_valid:
            type: boolean
          entity_key:
            type: string
          locale_code:
            type: string
          checks:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                passed:
                  type: boolean
                message:
                  type: string
              required: [name, passed, message]
          quality_score:
            type: integer
            minimum: 0
            maximum: 100
        required: [is_valid, entity_key, locale_code, checks, quality_score]
