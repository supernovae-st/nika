# Test Workflow: Schema Validation with Retry Loop
#
# Demonstrates the 3-layer structured output enforcement:
# 1. DynamicSubmitTool: LLM-side schema injection
# 2. jsonschema validation: Code-side validation
# 3. Retry loop: Re-prompt with error feedback on failure
#
# This workflow is AGENTIC:
# - Discovers entities from NovaNet (not hardcoded)
# - Uses proper bindings between tasks
# - Parallelizes independent MCP calls
#
# Prerequisites:
#   - NovaNet MCP server running (novanet-mcp binary)
#   - Neo4j database seeded
#
# Usage:
#   cd tools/nika && cargo run -- run ../../examples/test-schema-retry.nika.yaml

schema: "nika/workflow@0.12"
workflow: test-schema-retry
description: Test structured output enforcement with retry loop and NovaNet discovery
provider: claude
model: claude-sonnet-4-20250514

mcp:
  novanet:
    command: novanet-mcp
    args: []
    env:
      NOVANET_MCP_NEO4J_URI: bolt://localhost:7687
      NOVANET_MCP_NEO4J_USER: neo4j
      NOVANET_MCP_NEO4J_PASSWORD: novanetpassword

tasks:
  # Step 1: Discover available entities from NovaNet
  - id: discover_entities
    invoke:
      mcp: novanet
      tool: novanet_search
      params:
        query: "*"
        mode: fulltext
        kinds: ["Entity"]
        limit: 5

  # Step 2: Get schema introspection (parallel with entity discovery)
  - id: get_schema_context
    invoke:
      mcp: novanet
      tool: novanet_introspect
      params:
        target: classes
        realm: org
        layer: semantic

  # Step 3: Select target entity and get its full context
  - id: get_entity_context
    depends_on: [discover_entities]
    with:
      entities: $discover_entities
    invoke:
      mcp: novanet
      tool: novanet_describe
      params:
        describe: entity
        # Use first discovered entity dynamically
        entity_key: "{{with.entities.rows[0].key}}"

  # Step 4: Generate keywords with strict schema validation
  # Uses discovered entity context, not hardcoded "QR code"
  - id: generate_keywords
    depends_on: [get_entity_context, get_schema_context]
    with:
      entity: $get_entity_context
      schema: $get_schema_context
    infer:
      prompt: |
        # SEO Keyword Generation Task

        ## Entity Context from NovaNet
        {{with.entity}}

        ## Schema Context
        {{with.schema}}

        ## Task
        Generate 3 SEO keywords for this entity's product/service.

        IMPORTANT: Follow the exact schema. Common mistakes to avoid:
        - intent must be exactly one of: informational, navigational, transactional, commercial
        - slug_form must be lowercase with only letters, numbers, and hyphens
        - difficulty must be between 0 and 100 inclusive
        - volume must be a positive integer

        Use the entity's denomination_forms and semantic context to generate
        culturally-appropriate keywords.

        Return a JSON object with the keywords array.
      temperature: 0.3
    output:
      format: json
      max_retries: 3
      schema:
        type: object
        additionalProperties: false
        properties:
          entity_key:
            type: string
            description: The entity key from NovaNet
          keywords:
            type: array
            minItems: 3
            maxItems: 3
            items:
              type: object
              additionalProperties: false
              properties:
                value:
                  type: string
                  minLength: 3
                  description: The keyword phrase
                slug_form:
                  type: string
                  pattern: "^[a-z0-9-]+$"
                  description: URL-safe slug form (lowercase only)
                volume:
                  type: integer
                  minimum: 0
                  description: Monthly search volume estimate
                difficulty:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: SEO difficulty score (0-100)
                intent:
                  type: string
                  enum: [informational, navigational, transactional, commercial]
                  description: Search intent classification
              required: [value, slug_form, volume, difficulty, intent]
        required: [entity_key, keywords]

  # Step 5: Analyze the keywords and produce a structured report
  - id: analyze_keywords
    depends_on: [get_entity_context, generate_keywords]
    with:
      entity: $get_entity_context
      keywords: $generate_keywords
    infer:
      prompt: |
        # Keyword Analysis Task

        ## Entity Context
        {{with.entity}}

        ## Generated Keywords
        {{with.keywords}}

        Analyze these SEO keywords in the context of the entity.
        Calculate statistics and provide recommendations based on:
        1. Relevance to the entity's semantic meaning
        2. Search intent alignment with entity usage
        3. Competitive landscape

        Return the analysis in the exact JSON structure specified.
      temperature: 0
    output:
      format: json
      max_retries: 2
      schema:
        type: object
        additionalProperties: false
        properties:
          entity_key:
            type: string
          stats:
            type: object
            properties:
              total_volume:
                type: integer
                minimum: 0
              avg_difficulty:
                type: number
                minimum: 0
                maximum: 100
              intent_distribution:
                type: object
                additionalProperties:
                  type: integer
            required: [total_volume, avg_difficulty, intent_distribution]
          recommendations:
            type: array
            items:
              type: object
              properties:
                keyword:
                  type: string
                action:
                  type: string
                  enum: [target, monitor, ignore, high_priority]
                reason:
                  type: string
              required: [keyword, action, reason]
        required: [entity_key, stats, recommendations]
