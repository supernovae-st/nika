# Test SEO Discovery: NovaNet + DataForSEO
#
# Ce workflow teste l'intégration complète:
# 1. Charge une Entity depuis NovaNet
# 2. Recherche les keywords via DataForSEO
# 3. Analyse et score les résultats
#
# Usage:
#   cd tools/nika && cargo run -- run ../../examples/test-seo-discovery.nika.yaml

schema: "nika/workflow@0.12"
workflow: test-seo-discovery
description: Test NovaNet + DataForSEO integration for keyword discovery
provider: claude

mcp:
  novanet:
    command: /Users/thibaut/.cargo/bin/novanet-mcp
    args: []
    env:
      NOVANET_MCP_NEO4J_URI: bolt://localhost:7687
      NOVANET_MCP_NEO4J_USER: neo4j
      NOVANET_MCP_NEO4J_PASSWORD: novanetpassword

tasks:
  # Step 1: Load Entity from NovaNet
  - id: load_entity
    invoke:
      mcp: novanet
      tool: novanet_describe
      params:
        describe: entity
        entity_key: qr-code

  # Step 2: Get Slugification rules for fr-FR
  - id: get_slugification
    invoke:
      mcp: novanet
      tool: novanet_search
      params:
        mode: walk
        start_key: fr-FR
        direction: outgoing
        arc_families:
          - ownership
        target_kinds:
          - Slugification
        max_depth: 1

  # Step 3: Search keywords (simulated - DataForSEO MCP pas encore intégré)
  # Pour l'instant on utilise les données qu'on a déjà récupérées
  - id: keyword_data
    depends_on: [load_entity]
    with:
      entity: load_entity
    infer: |
      Basé sur l'entity: {{with.entity}}

      Voici les données de recherche réelles (DataForSEO France):
      - "qr code": 135,000/mois, MEDIUM competition
      - "code qr": 135,000/mois, MEDIUM competition
      - "qr code gratuit": 40,500/mois, MEDIUM competition
      - "generateur qr code": 9,900/mois, HIGH competition
      - "créer qr code": 5,400/mois, HIGH competition

      Retourne un JSON avec le keyword gagnant et son score selon la formule:
      score = volume x sem_coef x intent_boost

      sem_coef: same_as=1.0, action_for=0.95, produces=0.85
      intent_boost: transactional=1.2, informational=1.0

  # Step 4: Generate EntityNative data (what we would write)
  - id: generate_native
    depends_on: [load_entity, get_slugification, keyword_data]
    with:
      entity: load_entity
      slug_rules: get_slugification
      keywords: keyword_data
    infer: |
      Entity: {{with.entity}}
      Slugification rules: {{with.slug_rules}}
      Keywords: {{with.keywords}}

      Génère le JSON pour créer EntityNative:qr-code@fr-FR avec:
      1. denomination_forms (text, title, abbrev, url)
      2. Le keyword gagnant
      3. Le slug selon les règles de slugification

      Format attendu:
      {
        "key": "entity-native:qr-code@fr-FR",
        "denomination_forms": [...],
        "winning_keyword": "...",
        "slug": "..."
      }
