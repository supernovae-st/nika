schema: "nika/workflow@0.12"
provider: mock

tasks:
  - id: get_weather
    infer:
      prompt: |
        Return weather for Paris as JSON:
        {"city": "Paris", "temp": 18, "condition": "sunny"}
    output:
      format: json

  - id: recommend
    depends_on: [get_weather]
    with:
      weather: get_weather
      temp: get_weather.temp ?? 20
    infer:
      prompt: |
        Weather: {{with.weather}}
        Temperature: {{with.temp}}C

        Recommend an activity for this weather.
