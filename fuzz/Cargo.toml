# nika-schema fuzz harness · cargo-fuzz (libFuzzer)
# Self-rooted (empty [workspace]) · NOT a member of the engine workspace ·
# run from engine root · `cargo +nightly fuzz run parse_workflow`
[package]
name = "nika-schema-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nika-schema = { path = "../crates/nika-schema" }
nika-check  = { path = "../crates/nika-check" }
nika-dap    = { path = "../crates/nika-dap" }

[[bin]]
name = "parse_workflow"
path = "fuzz_targets/parse_workflow.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cel_expression"
path = "fuzz_targets/cel_expression.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cap_check"
path = "fuzz_targets/cap_check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "infer_permits"
path = "fuzz_targets/infer_permits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "receipt_decode"
path = "fuzz_targets/receipt_decode.rs"
test = false
doc = false
bench = false

[workspace]

[patch.crates-io]
# The same pin as the root workspace: dom_smoothie 0.18.0 breaks candidate score ties by
# its hash map's per-process order; the fork revision keeps first-scored order (nika PR 1503).
# It drops the day upstream releases it. Tag 0.18.0-nika.1 on the fork names this rev.
dom_smoothie = { git = "https://github.com/supernovae-st/dom_smoothie", rev = "fd6db004615af3c14d20f90bfb43ca514db4e57d" }
