# lefthook.yml — nika engine hook pipeline
# Separate config because the engine is a separate git repo (public submodule).
# Install: cd nika && lefthook install -c lefthook.yml
#
# This fixes the dangling core.hooksPath that currently points to
# /Users/thibaut/dev/supernovae/nika/.husky (deleted path = no hooks fire).
#
# Engine-specific additions on top of what the root lefthook.yml covers:
#   - commit-msg: same Conventional Commits validator, scoped to engine types
#   - pre-commit: fmt + clippy-touched-crates (fast, targeted)
#   - pre-push: full workspace test + all CI ratchets
#   No duplication with root: root hooks fire on monorepo commits;
#   engine hooks fire on commits made inside nika/engine/.

prepare-commit-msg:
  commands:
    inject-coauthor:
      run: bash scripts/hooks/prepare-commit-msg.sh {1} {2}

commit-msg:
  commands:
    validate-message:
      run: bash scripts/hooks/validate-conventional-commit.sh {1}
      fail_text: |
        Commit message rejected.
        type(scope): lowercase description
        Valid types: feat fix chore docs perf test refactor build ci revert security
        Valid scopes: workspace kernel catalog error kernel-mock ci hygiene docs adr
        Footer must include: Co-Authored-By: Nika 🦋 <nika@supernovae.studio>

pre-commit:
  parallel: true

  commands:
    rust-fmt:
      glob: '**/*.rs'
      run: cargo fmt --check --quiet
      fail_text: 'cargo fmt check failed. Run: cargo fmt'

    # Targeted clippy: only the crates touched in this commit + their reverse-deps.
    # Faster than full --workspace on large commits but still catches ripple effects.
    clippy-touched:
      glob: '**/*.rs'
      run: bash scripts/hooks/clippy-touched-crates.sh
      fail_text: 'clippy found warnings in touched crates. Fix before committing.'

    # Ratchets that are cheap and fast: unwrap + fn-length only.
    # Full ratchet suite runs at pre-push, not here.
    unwrap-ratchet:
      glob: '**/*.rs'
      run: bash scripts/ci/check-unwrap.sh
      fail_text: 'unwrap/expect found in src/. Use ? operator.'

    shellcheck-engine:
      glob: '**/*.sh'
      # `-x` follows `# shellcheck source=` directives into the sourced file.
      # Without it every `. scripts/ci/_lib.sh` raises SC1091 ("not following")
      # even where the directive is already correct, AND the helpers defined
      # there stay invisible — so a typo in a shared function is never caught.
      # Measured before widening: 105 tracked scripts, 0 error/warning with
      # `-x` and 0 without, so it opens no backlog and only sees more.
      run: shellcheck -x {staged_files}

    shfmt-engine:
      glob: '**/*.sh'
      run: shfmt -d -i 2 -ci -bn {staged_files}

    # estate.yaml hashes the tracked tree. CI checks it; nothing local did, so
    # every miss surfaced only after a push and a CI wait.
    # Measured 2026-08-13: FOUR round-trips in one evening. The fourth cause was
    # subtle — the manifest HAD been regenerated, then `shfmt -w` reformatted the
    # file afterwards and invalidated it. So the right moment is not "when you
    # think of it", it is "after the last reformatting": a hook knows that, a
    # human does not.
    # `--check`, never `--write`: a hook that silently repairs hides the drift
    # instead of teaching it, and would write a file nobody reviewed.
    # Order matters — estate.py reads the INDEX: stage the file, THEN derive,
    # THEN stage the manifest. This hook caught that very mistake on the commit
    # that installs it, in 0.16 s.
    estate-manifest:
      # Split by verdict · a COVERAGE hole refuses, FRESHNESS does not.
      # A whole-tree projection required at commit time makes every pair
      # of concurrent branches collide on a file neither one edited
      # (four PRs, four conflicts, 2026-08-20). Freshness is proven where
      # it is the guarantee — at tag time, in release.yml.
      run: bash scripts/hooks/estate-gate.sh
      fail_text: 'estate: a path no rule classifies, or a rule matching nothing. Fix the glob in scripts/estate_rules.py (freshness alone no longer refuses — the tag gate owns it).'

    block-private-paths:
      run: bash scripts/hooks/block-private-paths.sh
      fail_text: 'Private path reference in public engine files. Engine is PUBLIC.'

    # A new crate must arrive with the ADR that justifies admitting it. This
    # check reads the STAGED diff, so pre-commit is the only place it can
    # fire — its previous home was run-ci-ratchets at pre-push, where the
    # index is empty and the branch was unreachable. --staged-only keeps it
    # silent unless a new crate is actually staged; the standing coverage
    # report stays at pre-push. Gated on Cargo.toml because a new crate
    # always brings one.
    adr-coverage-new-crate:
      glob: '**/Cargo.toml'
      run: bash scripts/ci/check-adr-coverage.sh --staged-only
      fail_text: 'New crate staged without an ADR. Stage docs/adr/adr-NNN-*.md naming it.'

pre-push:
  parallel: false

  commands:
    # The four heavy legs (workspace tests · clippy · 15 hygiene vectors ·
    # 9 CI ratchets) live behind ONE stdin-aware door: a deletion-only push
    # (`git push origin --delete X` · local sha = the zero sha) sends
    # nothing new to the remote, so the gate skips instantly instead of
    # running the full suite for a ref removal. Fail-safe: no stdin refs →
    # the gate RUNS (a silent skip is impossible). Same contracts as the
    # four old inline legs — hygiene YELLOW passes, only RED blocks.
    gate:
      use_stdin: true
      run: bash scripts/hooks/pre-push-gate.sh
      fail_text: 'pre-push gate failed (tests · clippy · hygiene · ratchets — see output).'

    cargo-deny:
      glob: 'Cargo.*'
      run: cargo deny check
      fail_text: 'cargo deny: security advisory or license violation.'

    cargo-machete:
      glob: 'Cargo.*'
      run: cargo machete --with-metadata
      fail_text: 'cargo machete: unused dependencies detected.'

    force-push-guard:
      # Forward git's pre-push refspec (<local-ref> <local-sha> <remote-ref>
      # <remote-sha>) to the hook. The key IS `use_stdin` — `stdin` is not a
      # lefthook key and gets dropped silently, leaving the guard to judge
      # from repo state alone instead of from the refs actually being pushed.
      use_stdin: true
      run: bash scripts/hooks/force-push-guard.sh

post-commit:
  commands:
    changelog-preview:
      run: bash scripts/hooks/changelog-preview.sh 2>/dev/null || true

    activity-log:
      run: bash scripts/hooks/activity-log.sh

    sequence-reminder:
      # post-commit has no staged set · without an explicit files source the
      # glob filters NOTHING and the reminder fired on every commit
      # (empirical 2026-07-10 ×2 on README-only commits). The commit's own
      # file list is the correct source.
      files: git diff-tree --no-commit-id --name-only -r HEAD
      glob: 'memory/execution-roadmap/**/*'
      run: >
        printf '\n[reminder] execution-roadmap/ touched — update SEQUENCE.md status.\n'

post-merge:
  commands:
    adr-seal-check:
      run: bash scripts/hooks/adr-seal-check.sh post-merge

    coauthor-squash-detect:
      run: bash scripts/hooks/coauthor-squash-detect.sh

# P1-4 Batch H+: rebases that modify sealed ADRs were undetected because
# post-rewrite was not wired. The adr-seal-check.sh script already supports
# the post-rewrite context (reads rewritten pairs from stdin).
post-rewrite:
  commands:
    adr-seal-check:
      run: bash scripts/hooks/adr-seal-check.sh post-rewrite
