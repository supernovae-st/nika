# 🏴‍☠️ ARMADA: Release-plz Configuration
# Automated release management for Nika
# Part of ARMADA quality checkpoints
# https://release-plz.dev/docs/config

[workspace]
# Allow release-plz to release new versions
allow_dirty = false
# Update dependencies in Cargo.toml
dependencies_update = true
# Create GitHub releases
git_release_enable = true
# Draft releases for review before publishing
git_release_draft = false
# Use release type based on conventional commits
release_commits = "^(feat|fix|docs|perf|refactor|style|test|chore|security)(\\([a-z-]+\\))?!?:"
# PR labels for release PRs
pr_labels = ["release", "automated", "armada"]
# Repo URL for links
repo_url = "https://github.com/SuperNovae-studio/nika"

[changelog]
# Use Keep a Changelog format
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
# Protect breaking changes from being skipped
protect_breaking_commits = true
# Link to commits
commit_preprocessors = [
    { pattern = "\\(#([0-9]+)\\)", replace = "([#$1](https://github.com/SuperNovae-studio/nika/pull/$1))" },
]

# Main Nika CLI package
[[package]]
name = "nika"
# Path to the crate changelog
changelog_path = "tools/nika/CHANGELOG.md"
# Publish to crates.io (disabled for now)
publish = false
# Semver check
semver_check = true
# Git tag format
git_tag_name = "v{{ version }}"

# 🏴‍☠️ CAPTAIN'S ORDERS: Version Lock
# Nika must NEVER be version 1.0.0 or higher
# This is enforced by:
# - tests/version_lock_test.rs (Rust tests)
# - .github/workflows/version-lock.yml (CI)
# - .github/workflows/armada-checkpoints.yml (Station 10)
# See: docs/plans/2025-02-25-nika-fortress-design.md
