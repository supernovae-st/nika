# release-plz configuration for Nika
# https://release-plz.ieni.dev/docs/config
#
# This file configures automated release management:
# - Version bumping based on conventional commits
# - CHANGELOG generation via git-cliff
# - GitHub release creation

[workspace]
# Use git-cliff for CHANGELOG generation
changelog_config = "cliff.toml"

# Create GitHub releases for tagged versions
git_release_enable = true

# PR labels for automated release PRs
pr_labels = ["release", "automated", "armada"]

# Run cargo semver-checks before releasing
semver_check = true

# Timeout for cargo publish operations
publish_timeout = "10m"

# Allow dirty due to .claude/ symlink
# TODO: Remove .claude/ from git history (see security-private-content.md)
allow_dirty = true

# Update dependencies in Cargo.lock
dependencies_update = true

# Git tag format (v prefix)
git_tag_name = "v{{ version }}"

# Release name format (GitHub release title)
git_release_name = "v{{ version }}"

# Repo URL for links
repo_url = "https://github.com/supernovae-st/nika"

# Main Nika CLI package
[[package]]
name = "nika"
# Path to the crate changelog (relative to package Cargo.toml)
changelog_path = "CHANGELOG.md"
# Publish to crates.io (disabled for now)
publish = false
# Semver check
semver_check = true
# Git tag format
git_tag_name = "v{{ version }}"

# 🏴‍☠️ CAPTAIN'S ORDERS: Version Lock
# Nika must NEVER be version 1.0.0 or higher
# This is enforced by:
# - tests/version_lock_test.rs (Rust tests)
# - .github/workflows/version-lock.yml (CI)
# - .github/workflows/armada-checkpoints.yml (Station 10)
# See: docs/plans/2025-02-25-nika-fortress-design.md
