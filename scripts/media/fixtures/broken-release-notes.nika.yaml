# yaml-language-server: $schema=https://nika.sh/spec/v1/workflow.schema.json
# The BROKEN half of the full-loop pair (tapes/full-loop.tape).
# Two agent-typo classes, both named by `nika check` with their fix:
#   `tasks.digets` (a `with:` edge) → NIKA-DAG-002 · did you mean `digest`?
#   `nika:wrte`    → TOOLS · did you mean `nika:write`? (+ the PERMITS echo)
# validate-media.sh keeps this file FAILING check — the asset's point.
# git log → typed notes → RELEASE_NOTES.md · checked before it spends
nika: release-notes

model: ollama/qwen3.5:4b   # local · zero key · or mistral/mistral-small · mock/echo offline

permits:
  fs:
    write: ["RELEASE_NOTES.md"]
  exec: ["git"]
  tools: ["nika:write"]

tasks:
  history:
    exec:
      command: ["git", "log", "--oneline", "--no-merges", "-8"]

  stats:
    exec:
      command: ["git", "shortlog", "-sn", "HEAD"]

  digest:
    with:
      history: ${{ tasks.history.output }}
    infer:
      max_tokens: 400
      prompt: |
        Group these commits into a headline and highlights:
        ${{ with.history }}
      schema:
        type: object
        required: [headline, highlights]
        properties:
          headline: { type: string }
          highlights: { type: array, items: { type: string } }
        additionalProperties: false

  notes:
    with:
      digets_headline: ${{ tasks.digets.output.headline }}
      digest_highlights: ${{ tasks.digest.output.highlights }}
      stats: ${{ tasks.stats.output }}
    invoke:
      tool: "nika:wrte"
      args:
        path: "RELEASE_NOTES.md"
        content: |
          # ${{ with.digets_headline }}

          ${{ with.digest_highlights }}

          contributors · ${{ with.stats }}

outputs:
  headline: ${{ tasks.digest.output.headline }}
