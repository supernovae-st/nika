schema: "nika/workflow@0.12"
workflow: orchestration-goal-driven
description: |
  Goal-driven orchestration workflow. Orchestrator agent autonomously
  routes between multiple specialized agents based on intermediate results.

  Features tested:
  - orchestrate block (adaptive task routing)
  - goal: (optimization target)
  - max_rounds (iteration limit with graceful stop)
  - confidence_target (quality threshold)
  - Multiple specialized agents (researcher, analyst, writer)
  - Dynamic routing based on confidence scores
  - Feedback loops and refinement

provider: mock
model: claude-sonnet-4-20250514

inputs:
  research_goal: "Analyze competitive landscape in AI workflow engines"
  target_confidence: 0.85
  max_iterations: 4

# Orchestration configuration: adaptive task routing
# The orchestrator monitors confidence scores and routes
# work between specialized agents until target is met or
# max_rounds exhausted.
orchestrate:
  goal: "{{inputs.research_goal}}"
  target_confidence: "{{inputs.target_confidence}}"
  max_rounds: "{{inputs.max_iterations}}"
  routing:
    # Route 1: Research phase (low confidence → gather data)
    - from: initial
      to: researcher_agent
      when: "confidence < 0.3"
      description: "Gather market data and competitive intelligence"

    # Route 2: Analysis phase (medium confidence → analyze)
    - from: researcher_agent
      to: analyst_agent
      when: "confidence >= 0.3 && confidence < 0.7"
      description: "Analyze data, identify patterns and gaps"

    # Route 3: Synthesis phase (high confidence → write)
    - from: analyst_agent
      to: writer_agent
      when: "confidence >= 0.7 && confidence < {{inputs.target_confidence}}"
      description: "Synthesize findings into comprehensive report"

    # Terminal route: Success
    - from: writer_agent
      to: complete
      when: "confidence >= {{inputs.target_confidence}}"
      description: "Report meets confidence threshold"

tasks:
  # Task 1: Initial orchestrator agent
  - id: initial
    description: Initial assessment and research direction
    agent:
      system: |
        You are an orchestration director. Assess the research goal
        and determine initial approach. Assign work to specialized agents.
      prompt: "Research goal: {{inputs.research_goal}}"
      max_turns: 2
      completion:
        mode: natural
      tools: []

  # Task 2: Researcher agent - data gathering
  - id: researcher_agent
    description: Autonomous research agent (simulated)
    infer:
      prompt: |
        Research task: {{inputs.research_goal}}

        Find and analyze:
        1. Top 5 competitors in AI workflow engines
        2. Market size and growth trends
        3. Key features and differentiation
        4. Pricing strategies
        5. Customer segments

        Provide raw findings with confidence scores for each area.
      max_tokens: 600
      temperature: 0.7
    structured:
      schema:
        type: object
        properties:
          competitors:
            type: array
            items:
              type: object
              properties:
                name: { type: string }
                market_position: { type: string }
              required: [name]
          market_insights:
            type: object
            properties:
              market_size: { type: string }
              growth_rate: { type: string }
              trends:
                type: array
                items: { type: string }
          confidence_score: { type: number, minimum: 0, maximum: 1 }
        required: [competitors, confidence_score]
      enable_repair: true

  # Task 3: Analyst agent - pattern recognition
  - id: analyst_agent
    description: Autonomous analysis agent
    depends_on: [researcher_agent]
    with:
      research_data: $researcher_agent
    infer:
      prompt: |
        Analyze this research data:
        {{with.research_data | to_json}}

        Identify:
        1. Market gaps and opportunities
        2. Competitive advantages
        3. Industry consolidation patterns
        4. Emerging technologies
        5. Customer pain points

        Provide analysis with confidence scores for each insight.
      max_tokens: 600
      temperature: 0.6
    structured:
      schema:
        type: object
        properties:
          market_gaps:
            type: array
            items:
              type: object
              properties:
                gap: { type: string }
                opportunity_size: { type: string }
              required: [gap]
          competitive_advantages:
            type: array
            items: { type: string }
          emerging_trends:
            type: array
            items: { type: string }
          confidence_score: { type: number, minimum: 0, maximum: 1 }
        required: [market_gaps, confidence_score]
      enable_repair: true

  # Task 4: Writer agent - report synthesis
  - id: writer_agent
    description: Autonomous writing agent
    depends_on: [analyst_agent]
    with:
      analysis: $analyst_agent
    infer:
      prompt: |
        Based on this analysis:
        {{with.analysis | to_json}}

        Create a comprehensive competitive landscape report that includes:
        1. Executive Summary
        2. Market Overview
        3. Competitor Analysis (detailed)
        4. Opportunities and Threats
        5. Strategic Recommendations
        6. Implementation Roadmap

        Format as professional markdown. Include confidence assessment.
      max_tokens: 800
      temperature: 0.5
    structured:
      schema:
        type: object
        properties:
          report_markdown: { type: string, minLength: 1000 }
          key_recommendations:
            type: array
            items: { type: string }
            minItems: 3
          confidence_score: { type: number, minimum: 0, maximum: 1 }
          gaps_for_further_research:
            type: array
            items: { type: string }
        required: [report_markdown, confidence_score]
      enable_repair: true

  # Task 5: Evaluation and completion
  - id: complete
    description: Final evaluation
    depends_on: [writer_agent]
    with:
      final_report: $writer_agent
      target: "{{inputs.target_confidence}}"
    infer:
      prompt: |
        Evaluate this report against the target confidence level
        ({{with.target}}):

        {{with.final_report | to_json}}

        Assess:
        - Completeness
        - Accuracy
        - Actionability
        - Depth of analysis

        Provide final confidence score and completion status.
      max_tokens: 300

# Orchestration Mechanics:
#
# 1. Goal-driven: orchestrate.goal defines optimization target
# 2. Routing: when/then rules dynamically select next task
# 3. Confidence tracking: each task produces confidence_score
# 4. Feedback loops: can route back to earlier stages if needed
# 5. Terminal conditions:
#    - confidence >= target_confidence: SUCCESS
#    - round count >= max_rounds: PARTIAL (with results so far)
#    - error occurs: FAILED (with partial results)
#
# Confidence scoring best practices:
# - 0.0-0.3: low confidence, needs more work
# - 0.3-0.7: medium confidence, can proceed with caveats
# - 0.7-0.85: high confidence, near completion
# - 0.85+: very high confidence, meets target
#
# Routing syntax:
# when: "condition"  uses task output variables
#   Examples:
#   - "confidence < 0.5"
#   - "has_errors == true"
#   - "data_completeness < 0.8"
#
# Dynamic re-routing example:
# If analyst detects missing data (low confidence):
#   analyst_agent → researcher_agent (loop back)
# If writer detects gaps:
#   writer_agent → analyst_agent (refine analysis)
# Then proceed to completion
#
# Run with real provider:
# ANTHROPIC_API_KEY=xxx nika run test-workflow-10-orchestration.nika.yaml
#
# Monitor orchestration rounds:
# nika run test-workflow-10-orchestration.nika.yaml --trace
# # Shows: round 1/4, confidence scores, routing decisions
#
# Adjust targets:
# nika run test-workflow-10-orchestration.nika.yaml \
#   --input target_confidence=0.95 \
#   --input max_iterations=5
#
# Visualize routing DAG:
# nika workflow graph test-workflow-10-orchestration.nika.yaml
# # Shows all possible paths through orchestration logic
