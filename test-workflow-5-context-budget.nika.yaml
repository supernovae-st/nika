schema: "nika/workflow@0.12"
workflow: context-budget-pipeline
description: |
  Handle large document processing with context budgeting.
  Fetch large content → compress with token budgeting → summarize
  in stages to stay within token limits.

  Features tested:
  - context_budget (token limit for task)
  - Large document handling (>100KB)
  - Token counting and truncation
  - with bindings with path access (nested field extraction)
  - depends_on (pipeline ordering)
  - Template transforms (upper, trim, length)
  - Graceful degradation on token overflow

provider: mock
model: claude-haiku-4-5

inputs:
  large_document_url: "https://example.com/large-doc.pdf"
  max_context_tokens: 4000
  summary_depth: "medium"

tasks:
  # Task 1: Fetch large document
  - id: fetch_document
    description: Fetch large document (may exceed context budget)
    fetch:
      url: "{{inputs.large_document_url}}"
      extract: markdown
      timeout: 30

  # Task 2: Count tokens and prepare for compression
  - id: analyze_size
    description: Analyze document size and token estimate
    depends_on: [fetch_document]
    with:
      content: $fetch_document
      content_length: "{{with.content | length}}"
    infer:
      prompt: |
        Analyze this document:
        - Character count: {{with.content_length}}
        - Estimated tokens: ~{{with.content_length | to_number | round}}
        - Available budget: {{inputs.max_context_tokens}}

        Provide a chunking strategy if document exceeds budget.
      max_tokens: 200

  # Task 3: Compress document respecting context budget
  - id: compress_content
    description: |
      Compress document to fit within context budget.
      Uses context_budget to enforce token limit.
    depends_on: [fetch_document]
    with:
      raw_content: $fetch_document
      budget: "{{inputs.max_context_tokens | to_number}}"
    infer:
      prompt: |
        Compress this document to essential information only:
        {{with.raw_content | trim | first}}

        Keep key facts, numbers, and conclusions.
        Remove redundancy and verbose explanations.
      max_tokens: "{{with.budget | to_number | ceil}}"
      context_budget: "{{inputs.max_context_tokens}}"
      temperature: 0.3

  # Task 4: Multi-stage summarization with bounded context
  - id: stage1_summary
    description: First-pass summary with strict context limit
    depends_on: [compress_content]
    with:
      compressed: $compress_content
    infer:
      prompt: |
        Create a concise summary (max 100 words):
        {{with.compressed}}
      max_tokens: 100
      context_budget: 2000

  - id: stage2_synthesis
    description: Second-pass synthesis of stage 1 summary
    depends_on: [stage1_summary]
    with:
      stage1: $stage1_summary
      depth: "{{inputs.summary_depth}}"
    infer:
      prompt: |
        Synthesize this {{with.depth}} summary further:
        {{with.stage1}}

        Create 3-5 key bullet points.
      max_tokens: 150
      context_budget: 1500

  # Task 5: Extract insights respecting budget
  - id: extract_insights
    description: Extract key insights with structured output
    depends_on: [stage2_synthesis]
    with:
      summary: $stage2_synthesis
    infer:
      prompt: |
        Extract actionable insights from:
        {{with.summary}}
    structured:
      schema:
        type: object
        properties:
          key_insights:
            type: array
            items: { type: string }
            minItems: 1
            maxItems: 5
          confidence_level:
            type: string
            enum: [low, medium, high]
          recommended_actions:
            type: array
            items: { type: string }
        required: [key_insights, confidence_level]
      enable_repair: true
      max_retries: 1

  # Task 6: Final report with budget enforcement
  - id: final_report
    description: Generate final report with all insights
    depends_on: [extract_insights]
    with:
      insights: $extract_insights
    infer:
      prompt: |
        Create a final executive report based on these insights:
        {{with.insights | to_json}}

        Format: markdown with clear sections.
      max_tokens: 300
      context_budget: "{{inputs.max_context_tokens}}"
      temperature: 0.5

# Run with real provider (Anthropic):
# ANTHROPIC_API_KEY=xxx nika run test-workflow-5-context-budget.nika.yaml
#
# Monitor token usage:
# nika run test-workflow-5-context-budget.nika.yaml --trace
#
# Test with lower budget:
# nika run test-workflow-5-context-budget.nika.yaml --input max_context_tokens=2000
