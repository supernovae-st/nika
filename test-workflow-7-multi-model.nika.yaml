schema: "nika/workflow@0.12"
workflow: multi-model-pipeline
description: |
  Cost-optimized multi-model pipeline: fast haiku draft → quality
  sonnet refinement → final haiku format.

  Features tested:
  - Per-task model override (task-level model field)
  - Provider compatibility (anthropic supports all models)
  - depends_on (sequential chain)
  - with bindings (data threading)
  - Model selection strategy (speed vs quality vs cost)
  - Token budgeting by model capability

provider: anthropic
model: claude-sonnet-4-20250514  # Default, but overridden per-task

inputs:
  topic: "Machine Learning in Production"
  audience: "engineering teams"

tasks:
  # Task 1: Fast draft using haiku (cheapest)
  # Use case: initial ideation, bulk processing
  - id: draft_outline
    description: |
      Generate draft outline with haiku.
      Cost: ~10x cheaper than sonnet
      Speed: 2-3x faster
      Use: brainstorming, initial structure
    infer:
      prompt: |
        Create an outline for a guide on {{inputs.topic}}.
        Target audience: {{inputs.audience}}

        Include:
        - 5 main sections
        - 2-3 subsections per section
        - Brief description of each section

        Format as markdown list.
      model: claude-haiku-4-5  # Override: use haiku for speed
      max_tokens: 300
      temperature: 0.8  # Higher creativity for brainstorming

  # Task 2: Quality refinement using sonnet (best quality)
  # Use case: content quality, reasoning, nuance
  - id: refine_outline
    description: |
      Refine outline with sonnet for quality.
      Cost: baseline (our default model)
      Quality: high reasoning capability
      Use: complex analysis, refinement
    depends_on: [draft_outline]
    with:
      draft: $draft_outline
    infer:
      prompt: |
        Refine this outline to be more comprehensive and engaging:
        {{with.draft}}

        Enhance:
        - Add real-world examples
        - Improve section flow
        - Make it more actionable for {{inputs.audience}}
        - Add estimated time per section

        Keep markdown format.
      model: claude-sonnet-4-20250514  # Override: use sonnet for quality
      max_tokens: 500
      temperature: 0.6  # Moderate temperature for refinement

  # Task 3: Generate example content for first section
  - id: generate_section1
    description: |
      Generate first section content with sonnet.
      Use: main content generation
    depends_on: [refine_outline]
    with:
      outline: $refine_outline
    infer:
      prompt: |
        Based on this outline, write the first section (~300 words):
        {{with.outline | first}}

        Make it:
        - Informative and practical
        - Appropriate for {{inputs.audience}}
        - Include a small code example if relevant
      model: claude-sonnet-4-20250514
      max_tokens: 400
      temperature: 0.7

  # Task 4: Summarize section with haiku (cost optimization)
  # Use case: post-processing, summary extraction
  - id: summarize_section
    description: |
      Summarize generated content with haiku for cost.
      Cost: 10x cheaper than sonnet
      Use: condensing, summarization
    depends_on: [generate_section1]
    with:
      section: $generate_section1
    infer:
      prompt: |
        Summarize this content in 2-3 sentences (max 100 words):
        {{with.section}}
      model: claude-haiku-4-5  # Override: use haiku for summary
      max_tokens: 100
      temperature: 0.5  # Lower temp for consistency

  # Task 5: Final validation and polish with sonnet
  - id: final_validation
    description: |
      Final quality check with sonnet.
      Use: validation, polish, edge cases
    depends_on: [summarize_section, refine_outline]
    with:
      summary: $summarize_section
      original_outline: $refine_outline
    infer:
      prompt: |
        Review and validate this summary against the outline:

        Outline: {{with.original_outline}}
        Summary: {{with.summary}}

        Is the summary accurate and complete? Any improvements?
        Provide feedback and a revised summary if needed.
      model: claude-sonnet-4-20250514
      max_tokens: 250
      temperature: 0.4  # Low temp for consistency/accuracy
    structured:
      schema:
        type: object
        properties:
          is_accurate: { type: boolean }
          is_complete: { type: boolean }
          feedback: { type: string }
          revised_summary: { type: string }
        required: [is_accurate, is_complete]
      enable_repair: true

  # Task 6: Format final output with haiku
  - id: format_output
    description: |
      Format output as markdown with haiku.
      Cost: minimal
      Use: final formatting, presentation
    depends_on: [final_validation]
    with:
      validation: $final_validation
    infer:
      prompt: |
        Format this validation result as a professional markdown document:
        {{with.validation | to_json}}

        Include: summary, feedback, and revised content sections.
      model: claude-haiku-4-5
      max_tokens: 300

# Model cost comparison (Anthropic March 2026):
# - Haiku: $0.80 / 1M input, $4.00 / 1M output
# - Sonnet: $3.00 / 1M input, $15.00 / 1M output
# - Opus: $15.00 / 1M input, $75.00 / 1M output
#
# This workflow optimizes by using:
# - 2x haiku (10-15% of sonnet cost)
# - 3x sonnet (quality-critical paths)
# Estimated savings: ~40-50% vs all-sonnet pipeline
#
# Run with real provider:
# ANTHROPIC_API_KEY=xxx nika run test-workflow-7-multi-model.nika.yaml
#
# Visualize model usage:
# nika run test-workflow-7-multi-model.nika.yaml --trace | grep -i "model:"
