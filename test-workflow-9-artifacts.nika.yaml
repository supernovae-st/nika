schema: "nika/workflow@0.12"
workflow: artifact-pipeline
description: |
  Multi-format artifact persistence pipeline.
  Generate markdown → save artifact → transform to JSON → save artifact.

  Features tested:
  - Workflow-level artifacts config (directory, format, mode)
  - Task-level artifact block (single output)
  - Multiple artifact formats (markdown, json)
  - mode:overwrite (replace existing)
  - mode:unique (auto-rename duplicates)
  - Artifact source binding (save upstream data)
  - Artifact manifest (index of all outputs)

provider: mock
model: claude-haiku-4-5

inputs:
  report_topic: "AI Trends Q2 2026"
  output_dir: "./reports"

# Workflow-level artifact configuration
artifacts:
  dir: "{{inputs.output_dir}}"
  format: markdown              # Default format
  mode: overwrite               # Default behavior
  manifest: true                # Generate artifacts.json
  max_size: 104857600          # 100MB limit per file

tasks:
  # Task 1: Generate markdown report
  - id: generate_report
    description: Generate initial markdown report
    infer:
      prompt: |
        Write a comprehensive report on {{inputs.report_topic}}.

        Include:
        - Executive Summary
        - Key Trends (3-5)
        - Market Analysis
        - Predictions
        - Recommendations

        Format as professional markdown with proper headings.
      max_tokens: 800
      temperature: 0.7

    # Task-level artifact: save infer output as markdown
    artifact:
      path: "{{inputs.report_topic | lower | replace(' ', '-')}}-report.md"
      format: markdown
      mode: unique  # Auto-rename if exists: report-1.md, report-2.md

  # Task 2: Validate and enhance report
  - id: enhance_report
    description: Enhance report with additional analysis
    depends_on: [generate_report]
    with:
      original_report: $generate_report
    infer:
      prompt: |
        Enhance this report with additional insights:
        {{with.original_report}}

        Add:
        - Risk assessment
        - Opportunity analysis
        - Implementation timeline

        Keep markdown format.
      max_tokens: 600
      temperature: 0.6

  # Task 3: Extract data as JSON
  - id: extract_to_json
    description: |
      Extract report data as structured JSON.
      Save as separate artifact in JSON format.
    depends_on: [enhance_report]
    with:
      enhanced: $enhance_report
    infer:
      prompt: |
        Convert this report to structured JSON:
        {{with.enhanced}}

        Structure:
        {
          "title": "...",
          "summary": "...",
          "trends": [...],
          "predictions": [...],
          "recommendations": [...]
        }
      max_tokens: 800
      response_format: json

    # Task-level artifact: save as JSON with overwrite mode
    artifact:
      path: "{{inputs.report_topic | lower | replace(' ', '-')}}-data.json"
      format: json
      mode: overwrite  # Replace if already exists

  # Task 4: Create metadata artifact
  - id: create_metadata
    description: Generate metadata file for report
    depends_on: [generate_report, extract_to_json]
    with:
      markdown_size: "{{$generate_report | length}}"
      json_data: $extract_to_json
      timestamp: "2026-03-29T12:00:00Z"
    infer:
      prompt: |
        Create metadata for this report:
        - Size: {{with.markdown_size}} characters
        - Data points: {{with.json_data | keys | length}}
        - Generated: {{with.timestamp}}

        Include format info, validation status, source info.
      max_tokens: 200

    # Artifact with custom path and YAML format
    artifact:
      path: "metadata.yaml"
      format: yaml
      mode: unique

  # Task 5: Generate index with artifact source binding
  - id: generate_index
    description: |
      Generate index file that references all artifacts.
      Uses artifact source binding to include raw data.
    depends_on: [create_metadata]
    infer:
      prompt: |
        Create an index file referencing all generated artifacts:
        - {{inputs.report_topic | lower | replace(' ', '-')}}-report.md
        - {{inputs.report_topic | lower | replace(' ', '-')}}-data.json
        - metadata.yaml

        Include file descriptions, sizes, and access instructions.
      max_tokens: 300

    # Artifact binding: save upstream task output directly
    artifact:
      path: "index.md"
      source: generate_index  # Bind from task output
      format: markdown
      mode: overwrite

  # Task 6: Summary task with full artifacts directory
  - id: final_summary
    description: |
      Final summary of all generated artifacts.
      Lists files in output directory.
    depends_on: [generate_index]
    with:
      output_location: "{{inputs.output_dir}}"
    infer:
      prompt: |
        Summarize the report generation process.

        Artifacts saved to: {{with.output_location}}

        Files generated:
        1. {{inputs.report_topic | lower | replace(' ', '-')}}-report.md (main report)
        2. {{inputs.report_topic | lower | replace(' ', '-')}}-data.json (structured data)
        3. metadata.yaml (file metadata)
        4. index.md (navigation index)

        All files use consistent naming and are indexed in manifest.
      max_tokens: 250

# Artifact Configuration Explained:
#
# Workflow-level (applied to all unless overridden):
# - dir: output directory for artifacts
# - format: default format (markdown/json/yaml/text)
# - mode: default behavior
#   * overwrite: replace existing files
#   * unique: auto-rename duplicates
#   * append: add to existing file
#   * fail: error if file exists
# - manifest: auto-generate artifacts.json index
#
# Task-level (override workflow defaults):
# - path: file path within output dir
# - format: markdown/json/yaml/binary
# - mode: overwrite/unique/append
# - source: bind from upstream task (not task output)
#
# Examples:
# artifact:
#   path: report.md
#   format: markdown
#
# artifact:
#   path: data.json
#   source: extract_task      # Save $extract_task output
#   format: json
#
# Run with real provider:
# ANTHROPIC_API_KEY=xxx nika run test-workflow-9-artifacts.nika.yaml
#
# List generated artifacts:
# ls -lh {{inputs.output_dir}}/
# cat {{inputs.output_dir}}/artifacts.json
#
# Test unique mode (create duplicates):
# nika run test-workflow-9-artifacts.nika.yaml
# nika run test-workflow-9-artifacts.nika.yaml  # Auto-renames
# ls -lh {{inputs.output_dir}}/
