schema: "nika/workflow@0.12"
workflow: e06-import-dimensions
description: "Import image and get dimensions"
provider: mock

tasks:
  - id: import_img
    invoke:
      tool: "nika:import"
      params:
        path: "tests/e2e-overnight/fixtures/red-10x10.png"
  - id: get_dims
    depends_on: [import_img]
    with:
      hash: $import_img.hash
    invoke:
      tool: "nika:dimensions"
      params:
        hash: "{{with.hash}}"
