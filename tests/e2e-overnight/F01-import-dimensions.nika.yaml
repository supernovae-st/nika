schema: "nika/workflow@0.12"
workflow: f01-import-dimensions
description: "Media: import PNG and get dimensions"
provider: mock

tasks:
  - id: import_img
    invoke:
      tool: "nika:import"
      params:
        path: "tests/e2e-overnight/fixtures/red-10x10.png"
  - id: dimensions
    depends_on: [import_img]
    with:
      img: $import_img
    invoke:
      tool: "nika:dimensions"
      params:
        hash: "{{with.img.hash}}"
