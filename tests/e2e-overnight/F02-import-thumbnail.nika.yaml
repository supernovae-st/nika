schema: "nika/workflow@0.12"
workflow: f02-import-thumbnail
description: "Media: import and create thumbnail"
provider: mock

tasks:
  - id: import_img
    invoke:
      tool: "nika:import"
      params:
        path: "tests/e2e-overnight/fixtures/red-10x10.png"
  - id: thumb
    depends_on: [import_img]
    with:
      img: $import_img
    invoke:
      tool: "nika:thumbnail"
      params:
        hash: "{{with.img.hash}}"
        width: 64
        height: 64
