schema: "nika/workflow@0.12"
workflow: f05-dominant-color
description: "Media: extract dominant color"
provider: mock

tasks:
  - id: import_img
    invoke:
      tool: "nika:import"
      params:
        path: "tests/e2e-overnight/fixtures/red-10x10.png"
  - id: color
    depends_on: [import_img]
    with:
      img: $import_img
    invoke:
      tool: "nika:dominant_color"
      params:
        hash: "{{with.img.hash}}"
