schema: "nika/workflow@0.12"
workflow: f12-import-full-chain
description: "Media: import → dimensions + thumbhash + dominant_color (fan-out)"
provider: mock

tasks:
  - id: import_img
    invoke:
      tool: "nika:import"
      params:
        path: "tests/e2e-overnight/fixtures/red-10x10.png"

  - id: dims
    depends_on: [import_img]
    with:
      hash: $import_img.hash
    invoke:
      tool: "nika:dimensions"
      params:
        hash: "{{with.hash}}"

  - id: colors
    depends_on: [import_img]
    with:
      hash: $import_img.hash
    invoke:
      tool: "nika:dominant_color"
      params:
        hash: "{{with.hash}}"

  - id: thash
    depends_on: [import_img]
    with:
      hash: $import_img.hash
    invoke:
      tool: "nika:thumbhash"
      params:
        hash: "{{with.hash}}"

  - id: summary
    depends_on: [dims, colors, thash]
    with:
      d: $dims
      c: $colors
      t: $thash
    exec:
      command: "echo 'w={{with.d.width}} h={{with.d.height}} colors={{with.c.count}} thumbhash={{with.t.thumbhash | first(10)}}'"
      shell: true
