schema: "nika/workflow@0.12"
workflow: v01-redaction-all-secrets
description: "Verification: test secret patterns in env vars"
provider: mock

tasks:
  - id: echo_secrets
    exec:
      command: "echo AWS=$AWS_KEY GH=$GH_TOKEN"
      shell: true
      env:
        AWS_KEY: "AKIAIOSFODNN7EXAMPLE"
        GH_TOKEN: "ghp_ABCDEFabcdef1234567890123456789012"
  - id: verify
    depends_on: [echo_secrets]
    with:
      output: $echo_secrets
    invoke:
      tool: "nika:log"
      params:
        message: "Secrets output length: {{with.output | trim | length}}"
        level: "info"
