schema: "nika/workflow@0.12"
workflow: w01-vision-openai
description: "Vision: import image → OpenAI vision analysis"
provider: openai
model: gpt-4o-mini

tasks:
  - id: import_img
    invoke:
      tool: "nika:import"
      params:
        path: "tests/e2e-overnight/fixtures/red-10x10.png"

  - id: describe
    depends_on: [import_img]
    with:
      img: $import_img
    infer:
      content:
        - type: text
          text: "What color is this image? Answer in one word."
        - type: image
          source: "{{with.img.hash}}"
          detail: low
      max_tokens: 50
      temperature: 0
