schema: nika/workflow@0.12
workflow: mistral-standard-inference-test
description: "Test Mistral with standard inference and structured output"

provider: mistral
model: mistral-small-latest

inputs:
  topic: "Machine Learning Model Selection"
  detail_level: "intermediate"

tasks:
  # Task 1: Basic inference
  - id: mistral_basic
    infer:
      prompt: |
        Explain {{inputs.topic}} at {{inputs.detail_level}} level.

        Cover:
        1. Core concepts
        2. Key factors in model selection
        3. Common pitfalls
      max_tokens: 500
    description: "Mistral basic inference test"

  # Task 2: Structured output (JSON format)
  - id: mistral_structured
    depends_on: [mistral_basic]
    with:
      context: $mistral_basic
    infer:
      prompt: |
        Based on this explanation: {{with.context}}

        Extract a structured guide for model selection.
      response_format: json
      max_tokens: 600
    structured:
      schema:
        type: object
        properties:
          selection_criteria:
            type: array
            items:
              type: object
              properties:
                criterion: { type: string }
                description: { type: string }
                importance: { type: string, enum: ["critical", "important", "nice_to_have"] }
              required: [criterion, importance]
          model_types:
            type: array
            items: { type: string }
          best_practices:
            type: array
            items: { type: string }
        required: [selection_criteria, model_types]
      enable_repair: true
      max_retries: 2
    description: "Structured JSON output with schema"

  # Task 3: Multi-turn style conversation
  - id: mistral_followup
    depends_on: [mistral_structured]
    with:
      guide: $mistral_structured
    infer:
      prompt: |
        Given this selection guide:
        {{with.guide | to_json}}

        What are the top 3 most expensive mistakes in model selection?
        Explain briefly.
      max_tokens: 400
    description: "Follow-up question to structured output"

  # Task 4: Code generation capability
  - id: mistral_code
    infer:
      prompt: |
        Generate Python pseudocode for a simple model selection workflow.

        Include:
        - Load data
        - Feature preprocessing
        - Train-test split
        - Model selection loop
        - Evaluation metrics

        Use clear variable names and comments.
      max_tokens: 700
      temperature: 0.3
    description: "Mistral code generation"

  # Task 5: Temperature control for determinism
  - id: mistral_deterministic
    infer:
      prompt: "What is 2 + 2? Answer in exactly one sentence."
      max_tokens: 20
      temperature: 0.0
    description: "Zero temperature for deterministic response"

  # Task 6: Comparison task
  - id: mistral_comparison
    depends_on: [mistral_basic, mistral_structured]
    with:
      explanation: $mistral_basic
      structure: $mistral_structured
    infer:
      prompt: |
        Compare these two outputs for clarity and usefulness:

        Explanation approach:
        {{with.explanation | trim | first(150)}}...

        Structured approach:
        {{with.structure | to_json | trim | first(150)}}...

        Which approach is better for different use cases?
      max_tokens: 400
    description: "Compare explanation vs structured approaches"

  # Task 7: Error recovery with retry
  - id: mistral_with_retry
    infer:
      prompt: |
        Generate a detailed model selection framework.
        Return as JSON with at least 5 criteria.
      response_format: json
      max_tokens: 800
    retry:
      max_attempts: 2
      delay_ms: 1000
    structured:
      schema:
        type: object
        properties:
          framework_name: { type: string }
          criteria:
            type: array
            items:
              type: object
              properties:
                name: { type: string }
                weight: { type: number, minimum: 0, maximum: 1 }
              required: [name]
            minItems: 5
        required: [framework_name, criteria]
      enable_repair: true
      max_retries: 2
    description: "Structured output with retry and repair"

  # Task 8: Cost efficiency analysis
  - id: cost_analysis
    infer:
      prompt: |
        Mistral Small is a cost-efficient model.
        Why might you choose mistral-small-latest over larger models?

        Consider: latency, cost, quality, use cases.
      max_tokens: 350
    description: "Analyze cost-efficiency trade-offs"

  # Task 9: Comprehensive summary
  - id: mistral_test_summary
    depends_on: [mistral_basic, mistral_structured, mistral_followup, mistral_code, mistral_deterministic, mistral_comparison, mistral_with_retry, cost_analysis]
    with:
      basic: $mistral_basic | trim | first(80)
      structured: $mistral_structured | to_json | trim | first(80)
      followup: $mistral_followup
      code: $mistral_code | trim | first(100)
      deterministic: $mistral_deterministic
      comparison: $mistral_comparison
      framework: $mistral_with_retry
      cost: $cost_analysis
    exec:
      command: |
        echo "=== Mistral Standard Inference Test Summary ==="
        echo ""
        echo "1. Basic Inference:"
        echo "   {{with.basic}}..."
        echo ""
        echo "2. Structured JSON:"
        echo "   {{with.structured}}..."
        echo ""
        echo "3. Follow-up Capability:"
        echo "   {{with.followup | trim | first(80)}}..."
        echo ""
        echo "4. Code Generation:"
        echo "   {{with.code}}..."
        echo ""
        echo "5. Deterministic (temp=0):"
        echo "   {{with.deterministic}}"
        echo ""
        echo "6. Approach Comparison:"
        echo "   {{with.comparison | trim | first(80)}}..."
        echo ""
        echo "7. Structured with Retry:"
        echo "   {{with.framework | to_json | trim | first(80)}}..."
        echo ""
        echo "8. Cost Analysis:"
        echo "   {{with.cost | trim | first(80)}}..."
        echo ""
        echo "Test Results:"
        echo "  ✓ Basic inference working"
        echo "  ✓ Structured JSON validated"
        echo "  ✓ Code generation functional"
        echo "  ✓ Temperature control effective"
        echo "  ✓ Retry and repair mechanisms active"
        echo "  ✓ Cost-efficient model confirmed"
      shell: true
    description: "Comprehensive test summary for Mistral"
