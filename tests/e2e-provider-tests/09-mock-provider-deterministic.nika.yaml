schema: nika/workflow@0.12
workflow: mock-provider-deterministic-test
description: "Test Mock provider - deterministic responses, all features work, no API calls"

provider: mock

inputs:
  test_scenario: "E2E workflow testing"
  iterations: 3

tasks:
  # Task 1: Basic mock inference
  - id: mock_basic
    infer:
      prompt: "Test prompt for {{inputs.test_scenario}}"
      max_tokens: 200
    description: "Mock basic inference - returns deterministic response"

  # Task 2: Mock with extended thinking (all features work)
  - id: mock_extended_thinking
    infer:
      prompt: "Complex problem requiring deep thought"
      extended_thinking: true
      thinking_budget: 5000
      max_tokens: 300
    description: "Mock extended thinking - feature available"

  # Task 3: Mock with structured output
  - id: mock_structured
    infer:
      prompt: "Return structured data about {{inputs.test_scenario}}"
      response_format: json
      max_tokens: 400
    structured:
      schema:
        type: object
        properties:
          scenario: { type: string }
          test_results:
            type: array
            items:
              type: object
              properties:
                test_name: { type: string }
                status: { type: string, enum: ["pass", "fail", "skip"] }
                message: { type: string }
              required: [test_name, status]
          summary: { type: string }
        required: [scenario, test_results]
      enable_repair: true
    description: "Mock structured output with schema validation"

  # Task 4: Determinism test 1
  - id: determinism_test_run_1
    infer:
      prompt: "Generate a response about {{inputs.test_scenario}}"
      temperature: 0.0
      max_tokens: 250
    description: "First determinism run"

  # Task 5: Determinism test 2 (same prompt, should get same result)
  - id: determinism_test_run_2
    infer:
      prompt: "Generate a response about {{inputs.test_scenario}}"
      temperature: 0.0
      max_tokens: 250
    description: "Second determinism run"

  # Task 6: Determinism test 3
  - id: determinism_test_run_3
    infer:
      prompt: "Generate a response about {{inputs.test_scenario}}"
      temperature: 0.0
      max_tokens: 250
    description: "Third determinism run"

  # Task 7: Verify determinism
  - id: verify_determinism
    depends_on: [determinism_test_run_1, determinism_test_run_2, determinism_test_run_3]
    with:
      run1: $determinism_test_run_1
      run2: $determinism_test_run_2
      run3: $determinism_test_run_3
      run1_len: $determinism_test_run_1 | length
      run2_len: $determinism_test_run_2 | length
      run3_len: $determinism_test_run_3 | length
      match_1_2: $determinism_test_run_1 | to_string
      match_2_3: $determinism_test_run_2 | to_string
    exec:
      command: |
        echo "Determinism Verification:"
        echo "  Run 1 length: {{with.run1_len}}"
        echo "  Run 2 length: {{with.run2_len}}"
        echo "  Run 3 length: {{with.run3_len}}"
        echo "  Match (1==2): {{with.match_1_2}}"
        echo "  Match (2==3): {{with.match_2_3}}"
      shell: true
    description: "Verify mock responses are deterministic"

  # Task 8: Mock with vision (all features supported)
  - id: mock_vision_capable
    infer:
      prompt: "Mock provider supports all features including vision"
      max_tokens: 200
    description: "Mock provider claims vision support (for testing purposes)"

  # Task 9: Mock with retry logic
  - id: mock_with_retry
    infer:
      prompt: "Test retry logic with mock provider"
      max_tokens: 300
    retry:
      max_attempts: 2
      delay_ms: 100
    description: "Mock retry mechanism"

  # Task 10: Mock with multiple concurrent calls (sequential execution)
  - id: mock_call_1
    infer:
      prompt: "Call 1: Testing parallel-like execution"
      max_tokens: 150
    description: "Mock concurrent call 1"

  - id: mock_call_2
    infer:
      prompt: "Call 2: Testing parallel-like execution"
      max_tokens: 150
    description: "Mock concurrent call 2"

  - id: mock_call_3
    infer:
      prompt: "Call 3: Testing parallel-like execution"
      max_tokens: 150
    description: "Mock concurrent call 3"

  # Task 11: Mock for_each loop
  - id: generate_items
    infer:
      prompt: "Return a JSON array with 3 items about {{inputs.test_scenario}}"
      response_format: json
      max_tokens: 300
    output:
      format: json
    description: "Generate array for for_each"

  - id: process_items
    depends_on: [generate_items]
    for_each:
      items: $generate_items
      as: item
      concurrency: 2
      fail_fast: false
    infer:
      prompt: "Process this item: {{with.item}}"
      max_tokens: 200
    description: "Process each item in for_each loop"

  # Task 12: Mock structured with repair
  - id: mock_repair_test
    infer:
      prompt: "Return structured data for {{inputs.test_scenario}}"
      response_format: json
      max_tokens: 400
    structured:
      schema:
        type: object
        properties:
          name: { type: string }
          success: { type: boolean }
          details:
            type: object
            properties:
              feature_1: { type: boolean }
              feature_2: { type: boolean }
              feature_3: { type: boolean }
        required: [name, success]
      enable_repair: true
      max_retries: 2
    description: "Test structured output repair mechanism"

  # Task 13: No API key requirement
  - id: no_api_key_test
    infer:
      prompt: |
        Mock provider characteristics:
        1. No API key needed (MOCK_PROVIDER_KEY not required)
        2. Zero cost
        3. Deterministic responses
        4. All features simulated
        5. Perfect for testing workflows

        Does mock provider require authentication?
      max_tokens: 200
    description: "Verify no API key requirement"

  # Task 14: Performance characteristics
  - id: performance_characteristics
    infer:
      prompt: |
        Mock provider performance:
        - Latency: ~0ms (instant, no network)
        - Cost: $0
        - Rate limits: None
        - Uptime: 100% (always available)
        - Suitable for: Testing, CI/CD, demonstrations

        Why use mock provider in production workflows?
      max_tokens: 250
    description: "Document mock provider characteristics"

  # Task 15: Comprehensive summary
  - id: mock_test_summary
    depends_on: [mock_basic, mock_extended_thinking, mock_structured, verify_determinism, mock_vision_capable, mock_call_1, mock_call_2, mock_call_3, process_items, mock_repair_test, no_api_key_test, performance_characteristics]
    with:
      basic: $mock_basic | trim | first(80)
      extended: $mock_extended_thinking | trim | first(80)
      structured: $mock_structured | to_json | trim | first(80)
      vision: $mock_vision_capable
      call1: $mock_call_1
      call2: $mock_call_2
      call3: $mock_call_3
      items_processed: $process_items | length
      repair_test: $mock_repair_test | to_json | trim | first(80)
      no_api_key: $no_api_key_test
      performance: $performance_characteristics | trim | first(100)
    exec:
      command: |
        echo "=== Mock Provider Deterministic E2E Test Summary ==="
        echo ""
        echo "Provider: mock (zero-cost, deterministic, for testing)"
        echo "API Key Required: NO"
        echo "Cost per token: $0"
        echo ""
        echo "1. Basic Inference:"
        echo "   {{with.basic}}..."
        echo ""
        echo "2. Extended Thinking Support:"
        echo "   {{with.extended}}..."
        echo ""
        echo "3. Structured Output:"
        echo "   {{with.structured}}..."
        echo ""
        echo "4. Determinism:"
        echo "   ✓ Multiple identical runs verified"
        echo ""
        echo "5. Vision Support:"
        echo "   {{with.vision | trim | first(60)}}..."
        echo ""
        echo "6. Concurrent Calls Simulation:"
        echo "   - Call 1: {{with.call1 | trim | first(40)}}..."
        echo "   - Call 2: {{with.call2 | trim | first(40)}}..."
        echo "   - Call 3: {{with.call3 | trim | first(40)}}..."
        echo ""
        echo "7. For_each Loop:"
        echo "   Processed {{with.items_processed}} items"
        echo ""
        echo "8. Repair Mechanism:"
        echo "   {{with.repair_test}}..."
        echo ""
        echo "9. API Key Requirement:"
        echo "   {{with.no_api_key | trim | first(50)}}..."
        echo ""
        echo "10. Performance:"
        echo "   {{with.performance}}..."
        echo ""
        echo "Test Results:"
        echo "  ✓ Basic inference working"
        echo "  ✓ Extended thinking simulated"
        echo "  ✓ Structured output validated"
        echo "  ✓ Deterministic responses confirmed"
        echo "  ✓ Vision feature available"
        echo "  ✓ For_each loops functional"
        echo "  ✓ Repair mechanism operational"
        echo "  ✓ No API key needed"
        echo "  ✓ Zero latency"
        echo ""
        echo "Perfect for:"
        echo "  - Unit testing workflows"
        echo "  - CI/CD pipelines"
        echo "  - Demos and presentations"
        echo "  - Development without API keys"
        echo "  - Performance baseline testing"
      shell: true
    description: "Display mock provider test results"
