schema: "nika/workflow@0.12"
workflow: edge-case-003-diamond-dag
description: |
  Diamond DAG: fan-out (1 → 10 parallel tasks) → fan-in (all to 1).
  Tests parallel execution, data merging from multiple sources.
  Expected: PASS. All 10 parallel tasks should execute concurrently,
  then merge results into final_merge task.
provider: mock

tasks:
