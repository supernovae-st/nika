schema: "nika/workflow@0.12"
workflow: edge-case-004-foreach-concurrency
description: |
  for_each with 50 items, concurrency: 5.
  Tests concurrency limit enforcement, loop iteration.
  Expected: PASS. Should process 50 items in 10 batches of 5,
  returning array of 50 results.
provider: mock

