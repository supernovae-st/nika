tasks:
  - id: process_items
    for_each:
      items: "{{inputs.items}}"
      as: item
      concurrency: 5
      fail_fast: false
    infer: "Process {{with.item}}"

  - id: summarize
    depends_on: [process_items]
    with:
      results: $process_items
    infer: |
      Processed {{with.results | length}} items:
      First: {{with.results | first}}
      Last: {{with.results | last}}
