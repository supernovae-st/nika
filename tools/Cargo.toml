[workspace]
resolver = "2"
members = [
    "nika",
    "nika-engine",
    "nika-init",
    "nika-daemon",
    "nika-cli",
    "nika-tui",
    "nika-core",
    "nika-event",
    "nika-mcp",
    "nika-media",
    "nika-lsp-core",
    "nika-lsp",
]

[workspace.package]
version = "0.50.0"
edition = "2021"
authors = ["Thibaut MÉLEN <thibaut@supernovae.studio>", "SuperNovae Studio <contact@supernovae.studio>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/supernovae-st/nika"
rust-version = "1.86"

[workspace.dependencies]
# Internal crates
nika-cli = { path = "nika-cli", version = "0.50.0" }
nika-core = { path = "nika-core", version = "0.50.0" }
nika-engine = { path = "nika-engine", version = "0.50.0", default-features = true }
nika-init = { path = "nika-init", version = "0.50.0" }
nika-tui = { path = "nika-tui", version = "0.50.0" }
nika-event = { path = "nika-event", version = "0.50.0" }
nika-mcp = { path = "nika-mcp", version = "0.50.0" }
nika-media = { path = "nika-media", version = "0.50.0" }
nika-daemon = { path = "nika-daemon", version = "0.50.0" }
nika-lsp-core = { path = "nika-lsp-core", version = "0.50.0" }

# Async
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "signal"] }
tokio-util = "0.7"
async-trait = "0.1"
backon = "1.3"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde-saphyr = "0.0.20"
toml = "0.8"

# YAML parsing
marked-yaml = "0.8"
strsim = "0.11"
indexmap = "2.7"

# JSON
serde_json_path = "0.7"
jsonschema = { version = "0.26", default-features = false }

# Errors
thiserror = "2.0"
miette = { version = "7.6", features = ["fancy"] }

# HTTP
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "gzip", "brotli", "deflate"] }
url = "2"

# Crypto
sha2 = "0.10"
blake3 = { version = "1.8", features = ["mmap"] }

# Concurrency
dashmap = "6.1"
parking_lot = "0.12"

# Utilities
regex = "1.11"
colored = "2.1"
indicatif = "0.18"
semver = "1.0"
smallvec = "1.13"
rustc-hash = "2.1"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
camino = "1.1"
globset = "0.4"
ignore = "0.4"
base64 = "0.22"
rand = "0.8"
humantime = "2.1"
dirs = "6"

# DAG
petgraph = { version = "0.6", features = ["serde-1"] }

# MCP
rmcp = { version = "0.16", features = ["client", "server", "transport-child-process", "transport-io"] }

# LLM
rig-core = { version = "0.33", features = ["rmcp"] }

# CLI
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-error = "0.2"

# Defensive types
nutype = { version = "0.6", features = ["serde"] }
static_assertions = "1.1"
strum = { version = "0.27", features = ["derive"] }
derive_more = { version = "2.0", features = ["display", "from", "error"] }

# Dev
tempfile = "3.27"
insta = { version = "1.34", features = ["yaml"] }
pretty_assertions = "1.4"
proptest = "1.4"
serial_test = "3"
rstest = "0.25"

[workspace.lints.clippy]
# Deny patterns that cause silent failures
wildcard_enum_match_arm = "warn"
manual_assert = "warn"
redundant_else = "warn"
needless_pass_by_value = "warn"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
split-debuginfo = "unpacked"

[profile.test]
opt-level = 1
