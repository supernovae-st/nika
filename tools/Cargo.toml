[workspace]
resolver = "2"
members = [
    "nika",
    "nika-engine",
    "nika-display",
    "nika-init",
    "nika-daemon",
    "nika-cli",
    "nika-core",
    "nika-event",
    "nika-mcp",
    "nika-media",
    "nika-storage",
    "nika-serve",
    "nika-lsp-core",
    "nika-lsp",
    "nika-sdk",
    "nika-vault",
    "nika-kernel",
    "nika-kernel-mock",
    "nika-clock",
    "nika-fs",
    "nika-blob",
    "nika-http",
    "nika-exec-runner",
    "nika-macros",
    "nika-builtin",
    "nika-policy",
    "nika-extract",
    "nika-security",
    "nika-verb-exec",
    "nika-verb-invoke",
    "nika-verb-fetch",
    "nika-verb-infer",
]

[workspace.package]
version = "0.81.0"
edition = "2021"
authors = ["Thibaut MÉLEN <thibaut@supernovae.studio>", "SuperNovae Studio <contact@supernovae.studio>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/supernovae-st/nika"
rust-version = "1.86"

[workspace.dependencies]
# Internal crates
nika-cli = { path = "nika-cli", version = "0.81.0" }
nika-core = { path = "nika-core", version = "0.81.0" }
nika-display = { path = "nika-display", version = "0.81.0" }
nika-engine = { path = "nika-engine", version = "0.81.0", default-features = true }
nika-init = { path = "nika-init", version = "0.81.0" }
nika-event = { path = "nika-event", version = "0.81.0" }
nika-mcp = { path = "nika-mcp", version = "0.81.0" }
nika-media = { path = "nika-media", version = "0.81.0" }
nika-daemon = { path = "nika-daemon", version = "0.81.0" }
nika-storage = { path = "nika-storage", version = "0.81.0" }
nika-serve = { path = "nika-serve", version = "0.81.0" }
nika-lsp-core = { path = "nika-lsp-core", version = "0.81.0" }
nika-sdk = { path = "nika-sdk", version = "0.81.0" }
nika-vault = { path = "nika-vault", version = "0.81.0" }
nika-kernel = { path = "nika-kernel", version = "0.81.0" }
nika-kernel-mock = { path = "nika-kernel-mock", version = "0.81.0" }
nika-clock = { path = "nika-clock", version = "0.81.0" }
nika-fs = { path = "nika-fs", version = "0.81.0" }
nika-blob = { path = "nika-blob", version = "0.81.0" }
nika-http = { path = "nika-http", version = "0.81.0" }
nika-exec-runner = { path = "nika-exec-runner", version = "0.81.0" }
nika-macros = { path = "nika-macros", version = "0.81.0" }
nika-builtin = { path = "nika-builtin", version = "0.81.0" }
nika-policy = { path = "nika-policy", version = "0.81.0" }
nika-extract = { path = "nika-extract", version = "0.81.0" }
nika-security = { path = "nika-security", version = "0.81.0" }
nika-verb-exec = { path = "nika-verb-exec", version = "0.81.0" }
nika-verb-invoke = { path = "nika-verb-invoke", version = "0.81.0" }
nika-verb-fetch = { path = "nika-verb-fetch", version = "0.81.0" }
nika-verb-infer = { path = "nika-verb-infer", version = "0.81.0" }

# Allocator
mimalloc = { version = "0.1", default-features = false }

# Rate limiting
governor = { version = "0.10", default-features = false, features = ["std", "dashmap"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# Async
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "signal"] }
tokio-util = "0.7"
tokio-stream = "0.1"
futures-util = "0.3"
futures-core = "0.3"
async-stream = "0.3"
async-trait = "0.1"
backon = "1.3"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde-saphyr = "0.0.20"
toml = "0.8"

# XML parsing
quick-xml = "0.37"

# YAML parsing
marked-yaml = "0.8"
strsim = "0.11"
indexmap = "2.13"

# JSON
serde_json_path = "0.7"
jsonschema = { version = "0.26", default-features = false }

# Errors
thiserror = "2.0"
miette = { version = "7.6", features = ["fancy"] }

# HTTP
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "gzip", "brotli", "deflate", "hickory-dns", "zstd", "cookies"] }
url = "2"
axum = { version = "0.8", features = ["json", "macros", "query"] }
aide = { version = "=0.16.0-alpha.3", features = ["axum", "axum-json", "axum-query", "scalar"] }
tower = { version = "0.5", features = ["timeout", "limit"] }
tower-http = { version = "0.6", features = ["trace", "limit", "cors", "timeout"] }
subtle = "2"

# Crypto
sha2 = "0.10"
hmac = "0.12"
blake3 = { version = "1.8", features = ["mmap"] }

# Concurrency
dashmap = "6.1"
parking_lot = "0.12"
moka = { version = "0.12", features = ["sync"] }

# Utilities
lru = "0.12"
regex = "1.11"
colored = "2.1"
indicatif = "0.18"
semver = "1.0"
smallvec = "1.15"
rustc-hash = "2.1"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
camino = "1.1"
glob = "0.3"
globset = "0.4"
ignore = "0.4"
base64 = "0.22"
rand = "0.8"
getrandom = "0.3"
humantime = "2.1"
dirs = "6"

# DAG
petgraph = { version = "0.6", features = ["serde-1"] }

# MCP
rmcp = { version = "0.16", features = ["client", "server", "transport-child-process", "transport-io"] }

# LLM
rig-core = { version = "0.34", features = ["rmcp"] }

# CLI
clap = { version = "4.6", features = ["derive", "suggestions", "error-context"] }
clap_complete = "4.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Interactive prompts
cliclack = "0.5"

# File type detection
infer = "0.19"

# File locking
fs2 = "0.4"

# Secret management
secrecy = "0.10"
zeroize = "1.8"
orion = "0.17"
whoami = "1"

# Shell
shlex = "1.3"
which = "8"

# Unicode text handling
unicode-width = "0.2"
unicode-normalization = "0.1"
terminal_size = "0.4"

# Syntax highlighting
tree-sitter = "0.25"
tree-sitter-yaml = "0.7"

# Text manipulation
ropey = "1.6"

arboard = "3.4"
streaming-iterator = "0.1"
signal-hook = { version = "0.4", features = ["iterator"] }

# LSP
tower-lsp-server = "0.23"
ls-types = "0.0"

# MCP tooling
shellexpand = "3.1"
schemars = "1.2"

# Web extraction
dom_smoothie = "0.16"
feed-rs = "2.3"
scraper = { version = "0.26", features = ["atomic"] }
htmd = "0.5"
psl = "2"

# Crawl ethics & intelligence
texting_robots = "0.2"
http-cache-semantics = "3.0"
fastbloom = "0.17"
cookie_store = "0.22"
reqwest_cookie_store = "0.10"

# RAG: text chunking
text-splitter = { version = "0.29", features = ["markdown"] }
tiktoken-rs = "0.9"

# Environment
dotenvy = "0.15"

# Package registry
urlencoding = "2.1"
flate2 = "1.1"
tar = "0.4"

# jq expressions (full stdlib: group_by, sort_by, map, select, etc.)
jaq-core = "3.0"
jaq-std = "3.0"
jaq-json = { version = "2.0", features = ["serde"] }

# Scheduler
croner = "3"
hron = "1"
chrono-tz = "0.10"

# Storage
rusqlite = { version = "0.39", features = ["bundled"] }
sqlx-core = { version = "0.8", features = ["chrono"] }
sqlx-postgres = { version = "0.8", features = ["chrono"] }

# File watching
notify = "8"

# Unix
nix = { version = "0.31", features = ["signal", "process", "fs", "net"] }
sd-notify = "0.5"

# Media
mime = "0.3"
mime_guess = "2.0"
bytes = "1"
imagesize = "0.14"
thumbhash = "0.1"
color-thief = "0.2"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

# Proc-macro tooling
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
darling = "0.20"

# Testing proc-macros
trybuild = "1"

# Dev
tempfile = "3.27"
insta = { version = "1.42", features = ["yaml"] }
pretty_assertions = "1.4"
proptest = "1.4"
serial_test = "3"
rstest = "0.25"

[workspace.lints.clippy]
# Deny patterns that cause silent failures
wildcard_enum_match_arm = "warn"
manual_assert = "warn"
redundant_else = "warn"
needless_pass_by_value = "warn"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"  # BUG-9: allow catch_unwind in nika-serve embedded executor

[profile.dev]
split-debuginfo = "unpacked"

[profile.test]
# opt-level = 0 (dev default) avoids ARM64 linker symbol errors
# caused by 3 conflicting html5ever versions in the dependency graph
lto = false
