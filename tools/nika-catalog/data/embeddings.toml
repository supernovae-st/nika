# nika-catalog — Embedding model catalog
#
# Vector-store compatibility is a compile-time fact. Every row below captures
# the dimensions, context window, default normalisation, preferred similarity
# metric, and price per 1M input tokens for a single embedding model.
#
# Schema invariants (enforced in build.rs):
#   * top-level `schema` matches EMBEDDINGS_SCHEMA constant
#   * unique id (case-insensitive, ASCII-only)
#   * dimensions > 0
#   * max_input_tokens > 0
#   * input_per_million >= 0.0
#   * similarity ∈ {cosine, dot-product, l2}
#   * provider references an existing entry in llm-providers.toml
#   * tags must be sorted alphabetically (kebab-case) and deduplicated
#
# Pricing snapshot: 2026-04-14. Prices DRIFT — xtask verify-catalog cron
# flags drift against upstream pricing pages.

schema = "nika/embeddings@1.0"

# ─── Voyage AI ─────────────────────────────────────────────────────────

[[embeddings]]
id = "voyage/voyage-3-large"
provider = "voyage"
model = "voyage-3-large"
dimensions = 1024
max_input_tokens = 32000
normalized_by_default = true
similarity = "cosine"
input_per_million = 0.18
description = "Voyage 3 large — best-in-class RAG / retrieval."
tags = ["embedding", "matryoshka", "rag"]

