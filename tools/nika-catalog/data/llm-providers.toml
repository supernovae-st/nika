# nika-catalog — LLM provider catalog (Phase C).
#
# Migrated from src/data/providers.rs (21 providers). Model folds into
# Provider via [[providers.models]] — no separate Model type. `default_model`
# and `cheap_model` are the WIRE identifiers for parity with legacy.
# Context / output token limits are a 2026-04-14 snapshot; unknown models
# default to 128_000 context / 4_096 output.

[[providers]]
id = "anthropic"
name = "Anthropic Claude"
aliases = ["claude"]
env_var = "ANTHROPIC_API_KEY"
key_prefix = "sk-ant-"
default_model = "claude-sonnet-4-20250514"
cheap_model = "claude-haiku-4-5-20251001"
requires_key = true
description = "Claude models (Opus, Sonnet, Haiku)."

[[providers.models]]
id = "sonnet"
model = "claude-sonnet-4-20250514"
context_window_tokens = 200000
max_output_tokens = 8192

[[providers.models]]
id = "haiku"
model = "claude-haiku-4-5-20251001"
context_window_tokens = 200000
max_output_tokens = 8192

