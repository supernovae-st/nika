[package]
name = "nika-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "CLI subcommand handlers for Nika"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["nika-engine/default"]
native-inference = ["nika-engine/native-inference"]
# Forwarded features for cfg!() checks in media.rs and doctor.rs display code
lsp = ["nika-engine/lsp"]
media-core = ["nika-engine/media-core"]
media-thumbnail = ["nika-engine/media-thumbnail"]
media-metadata = ["nika-engine/media-metadata"]
media-optimize = ["nika-engine/media-optimize"]
media-svg = ["nika-engine/media-svg"]
media-phash = ["nika-engine/media-phash"]
media-pdf = ["nika-engine/media-pdf"]
media-chart = ["nika-engine/media-chart"]
media-provenance = ["nika-engine/media-provenance"]
media-qr = ["nika-engine/media-qr"]
media-compression = ["nika-engine/media-compression"]
media-iqa = ["nika-engine/media-iqa"]
fetch-html = ["nika-engine/fetch-html"]
fetch-markdown = ["nika-engine/fetch-markdown"]
fetch-article = ["nika-engine/fetch-article"]
fetch-feed = ["nika-engine/fetch-feed"]

[dependencies]
# Engine crate (all engine logic)
nika-engine = { workspace = true }
nika-core = { workspace = true }
nika-init = { workspace = true }
nika-mcp = { workspace = true }
nika-vault = { workspace = true }
nika-storage = { workspace = true }

# Crypto
blake3 = { workspace = true }
getrandom = { workspace = true }

# CLI
clap = { workspace = true }

# Async
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Full JSON Schema validation for `nika eval output_matches_schema`
jsonschema = { workspace = true }

# Progress
indicatif = { workspace = true }

# Secrets
secrecy = { workspace = true }

# Random (gen_id in run headers)
rand = { workspace = true }

# Utilities
colored = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
humantime = { workspace = true }
infer = { workspace = true }
which = { workspace = true }
dirs = { workspace = true }
xxhash-rust = { workspace = true }

# Hash maps (FxHashMap for FetchParams compatibility)
rustc-hash = { workspace = true }

# Interactive wizard
cliclack = { workspace = true }

# Scheduler
croner = { workspace = true }
hron = { workspace = true }

# Workflow discovery
glob = { workspace = true }

# UUID for token IDs
uuid = { workspace = true }

# Timezone detection
chrono-tz = { workspace = true }

[target.'cfg(unix)'.dependencies]
nika-daemon = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }
image = { workspace = true }
filetime = "0.2"
