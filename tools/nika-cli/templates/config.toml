# Nika Project Configuration
# Generated by `nika init` or `nika config reset`

[tools]
# Permission mode for file tools
# Options: deny, plan, accept-edits, accept-all
permission = "plan"

# Working directory (default: project root)
# Files outside this directory cannot be accessed
# working_dir = "."

[provider]
# Default LLM provider (claude, openai, mistral, groq, deepseek, ollama)
# Provider auto-detection checks env vars: ANTHROPIC_API_KEY, OPENAI_API_KEY, etc.
# Can also override with: nika chat --provider <name>
default = "claude"

# Default model (provider-specific)
# Can also override with: nika chat --model <name>
# model = "claude-sonnet-4-6"

[editor]
# Theme: light, dark, solarized
theme = "solarized"

# Tab width for YAML files
tab_width = 2

# Auto-format on save
auto_format = true

[session]
# Auto-restore last session on startup
auto_restore = true

# Maximum sessions to keep
max_sessions = 50

# Session TTL in days
session_ttl_days = 7

[trace]
# Keep traces for N days
retention_days = 7

# Maximum trace files (oldest deleted first)
max_traces = 100
