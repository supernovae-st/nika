[package]
name = "nika-daemon"
description = "Nika background daemon — secrets, jobs, watch, cache"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = true

[features]
default = []
# OS keychain support (macOS Keychain, Linux Secret Service, Windows Credential Manager)
keychain = ["dep:keyring"]

[dependencies]
# Internal (lightweight — no nika-engine dependency to avoid circular deps)
nika-core = { workspace = true }

# Keychain (optional — behind keychain feature)
keyring = { workspace = true, optional = true }

# Async runtime
tokio = { workspace = true, features = ["net", "signal", "process", "fs", "io-util", "rt-multi-thread", "macros", "sync", "time"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Secrets
secrecy = { workspace = true }

# Errors
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Hashing
blake3 = { workspace = true }

# Time
chrono = { workspace = true }

# Cron expression parsing (scheduler)
croner = { workspace = true }

# IDs
uuid = { workspace = true }

# Paths
dirs = { workspace = true }

# Storage (SQLite for jobs + cache persistence)
rusqlite = { workspace = true }

# File watching
notify = { workspace = true }
globset = { workspace = true }

# Concurrent cache
dashmap = { workspace = true }

# Unix (daemonize, signals, socket perms)
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

# systemd Type=notify readiness (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = { workspace = true }
serial_test = { workspace = true }
