[package]
name = "nika-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Nika workflow engine — embeddable runtime, provider, DAG, and binding logic"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = true

[package.metadata.cargo-machete]
ignored = ["rig-core"]  # imported as `rig`, machete can't detect renamed crates

[features]
default = ["media-core", "fetch-extract", "fetch-article", "fetch-feed", "fetch-sitemap", "media-chart", "media-phash", "media-pdf", "media-iqa", "media-qr", "media-compression", "media-provenance"]
# Only lsp remains opt-in (editor-specific, not needed for engine users).
# Everything else is default. Zero flags for the binary.
native-inference = ["dep:mistralrs", "dep:async-stream", "dep:image"]  # Native LLM inference via mistral.rs
lsp = ["dep:tower-lsp-server", "dep:nika-lsp-core", "tokio/io-std", "tokio/io-util"]  # Language Server Protocol support

# Media tool features — forwarded to nika-media
media-core = ["nika-media/media-core"]
media-thumbnail = ["nika-media/media-thumbnail"]
media-metadata = ["nika-media/media-metadata"]
media-optimize = ["nika-media/media-optimize"]
media-svg = ["nika-media/media-svg"]
media-phash = ["nika-media/media-phash"]
media-pdf = ["nika-media/media-pdf"]
media-chart = ["nika-media/media-chart"]
media-provenance = ["nika-media/media-provenance"]
media-qr = ["nika-media/media-qr"]
media-compression = ["nika-media/media-compression"]
media-iqa = ["nika-media/media-iqa"]
# Web extraction — forwarded to nika-media (for media operations).
# Note: nika-extract is unconditionally depended on and enables all its
# fetch-* features by default, so engine's fetch-* features only need to
# control engine-local `dep:X` and nika-media/fetch-X activation.
fetch-html = ["nika-media/fetch-html", "dep:scraper"]
fetch-markdown = ["nika-media/fetch-markdown", "dep:htmd"]
fetch-article = ["nika-media/fetch-article", "dep:dom_smoothie", "dep:scraper"]
fetch-feed = ["nika-media/fetch-feed", "dep:feed-rs"]
fetch-sitemap = ["dep:quick-xml"]
fetch-extract = ["fetch-html", "fetch-markdown"]

[dependencies]
# Core crates
nika-core = { workspace = true }
nika-kernel = { workspace = true }
nika-macros = { workspace = true }
nika-display = { workspace = true }
nika-event = { workspace = true }
nika-mcp = { workspace = true }
nika-media = { workspace = true }
nika-builtin = { workspace = true }
nika-policy = { workspace = true }
nika-extract = { workspace = true }
nika-vault = { workspace = true }
nika-verb-exec = { workspace = true }
nika-verb-invoke = { workspace = true }
# S14-β: pure retry/backoff/hreflang helpers extracted from fetch.rs
nika-verb-fetch = { workspace = true }
nika-exec-runner = { workspace = true }
nika-clock = { workspace = true }
nika-fs = { workspace = true }

# Async
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# YAML parsing
serde-saphyr = { workspace = true }
indexmap = { workspace = true }

# JSONPath (RFC 9535)
serde_json_path = { workspace = true }

# JSON Schema validation
jsonschema = { workspace = true }

# Errors
thiserror = { workspace = true }
miette = { workspace = true }

# HTTP
reqwest = { workspace = true }
url = { workspace = true }

# Crawl ethics
texting_robots = { workspace = true }
governor = { workspace = true }

# HTTP intelligence
cookie_store = { workspace = true }
reqwest_cookie_store = { workspace = true }

# RAG
text-splitter = { workspace = true }

# Cryptographic hashing
sha2 = { workspace = true }

# Secure credential storage
secrecy = { workspace = true }

# Native inference via mistral.rs
mistralrs = { version = "0.7", optional = true }
async-stream = { version = "0.3", optional = true }

# Utilities
regex = { workspace = true }
colored = { workspace = true }
dashmap = { workspace = true }
semver = { workspace = true }
parking_lot = { workspace = true }
smallvec = { workspace = true }
rustc-hash = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
xxhash-rust = { workspace = true }
chrono = { workspace = true }
humantime = { workspace = true }
shlex = { workspace = true }
unicode-normalization = { workspace = true }

# Package registry
urlencoding = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }

# File System
ignore = { workspace = true }
globset = { workspace = true }

# DAG
petgraph = { workspace = true }

# MCP (rmcp used via nika-mcp)

# LLM Agent Framework
rig-core = { workspace = true }

# Media pipeline
blake3 = { workspace = true }
base64 = { workspace = true }

# Image processing (used by native vision — provider/native/runtime.rs)
image = { workspace = true, optional = true }

# Fetch extract (used by executor/extract.rs, not media tools)
dom_smoothie = { workspace = true, optional = true }
feed-rs = { workspace = true, optional = true }
scraper = { workspace = true, optional = true }
htmd = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }

# LSP Server (feature-gated)
tower-lsp-server = { workspace = true, optional = true }
nika-lsp-core = { workspace = true, optional = true }

# Logging
tracing = { workspace = true }
futures = { version = "0.3.32", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
insta = { workspace = true }
pretty_assertions = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
serial_test = { workspace = true }
wiremock = "0.6"
qrcode = "0.14"
image = { workspace = true }

[target.'cfg(unix)'.dependencies]
nika-daemon = { workspace = true }
nix = { workspace = true }
