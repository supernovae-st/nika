[package]
name = "nika-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Nika workflow engine — embeddable runtime, provider, DAG, and binding logic"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = true

[features]
default = ["media-core", "fetch-extract", "fetch-article", "fetch-feed", "media-chart", "media-phash", "media-pdf", "media-iqa", "media-qr", "media-compression"]
# Only 2 features remain opt-in:
#   - media-provenance (C2PA): heavy dep (openssl, crypto) + legal/compliance use case
#   - lsp: editor-specific, not needed for engine users
# Everything else is default.
native-keychain = ["dep:keyring"]  # OS keychain support
native-inference = ["dep:mistralrs", "dep:async-stream", "dep:image"]  # Native LLM inference via mistral.rs
lsp = ["dep:tower-lsp-server", "dep:nika-lsp-core", "tokio/io-std", "tokio/io-util"]  # Language Server Protocol support

# Media tool features — forwarded to nika-media
media-core = ["nika-media/media-core"]
media-thumbnail = ["nika-media/media-thumbnail"]
media-metadata = ["nika-media/media-metadata"]
media-optimize = ["nika-media/media-optimize"]
media-svg = ["nika-media/media-svg"]
media-phash = ["nika-media/media-phash"]
media-pdf = ["nika-media/media-pdf"]
media-chart = ["nika-media/media-chart"]
media-provenance = ["nika-media/media-provenance"]
media-qr = ["nika-media/media-qr"]
media-compression = ["nika-media/media-compression"]
media-iqa = ["nika-media/media-iqa"]
# Web extraction — forwarded to nika-media
fetch-html = ["nika-media/fetch-html", "dep:scraper", "dep:psl"]
fetch-markdown = ["nika-media/fetch-markdown", "dep:htmd"]
fetch-article = ["nika-media/fetch-article", "dep:dom_smoothie", "dep:scraper"]
fetch-feed = ["nika-media/fetch-feed", "dep:feed-rs"]
fetch-extract = ["fetch-html", "fetch-markdown"]

[dependencies]
# Core crates
nika-core = { workspace = true }
nika-init = { workspace = true }
nika-event = { workspace = true }
nika-mcp = { workspace = true }
nika-media = { workspace = true }

# Async
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# YAML parsing
serde-saphyr = { workspace = true }
marked-yaml = { workspace = true }
indexmap = { workspace = true }

# JSONPath (RFC 9535)
serde_json_path = { workspace = true }

# JSON Schema validation
jsonschema = { workspace = true }

# Errors
thiserror = { workspace = true }
miette = { workspace = true }

# HTTP
reqwest = { workspace = true }
url = { workspace = true }

# Cryptographic hashing
sha2 = { workspace = true }

# Secure credential storage
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"], optional = true }
secrecy = "0.10"
zeroize = "1.8"


# Native inference via mistral.rs
mistralrs = { version = "0.7", optional = true }
async-stream = { version = "0.3", optional = true }

# Utilities
regex = { workspace = true }
colored = { workspace = true }
indicatif = { workspace = true }
dashmap = { workspace = true }
semver = { workspace = true }
parking_lot = { workspace = true }
smallvec = { workspace = true }
rustc-hash = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
xxhash-rust = { workspace = true }
chrono = { workspace = true }
humantime = { workspace = true }
shlex = "1.3"
unicode-normalization = "0.1"

# Package registry
urlencoding = "2.1"
flate2 = "1.1"
tar = "0.4"

# File System
ignore = { workspace = true }
globset = { workspace = true }

# DAG
petgraph = { workspace = true }

# MCP
rmcp = { workspace = true }

# LLM Agent Framework
rig-core = { workspace = true }

# Unicode text handling
unicode-width = "0.2"
terminal_size = "0.4"

# Media pipeline
blake3 = { workspace = true }
infer = "0.19"
base64 = { workspace = true }

# Image processing (used by native vision — provider/native/runtime.rs)
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "gif"] }

# Fetch extract (used by executor/extract.rs, not media tools)
dom_smoothie = { version = "0.16", optional = true }
feed-rs = { version = "2.3", optional = true }
scraper = { version = "0.26", optional = true, features = ["atomic"] }
htmd = { version = "0.5", optional = true }
psl = { version = "2", optional = true }

# LSP Server (feature-gated)
tower-lsp-server = { version = "0.23", optional = true }
nika-lsp-core = { workspace = true, optional = true }

# Logging
tracing = { workspace = true }
futures = { version = "0.3.32", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
insta = { workspace = true }
pretty_assertions = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
serial_test = { workspace = true }
wiremock = "0.6"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[target.'cfg(unix)'.dependencies]
nika-daemon = { workspace = true }
