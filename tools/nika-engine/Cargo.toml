[package]
name = "nika-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Nika workflow engine — embeddable runtime, provider, DAG, and binding logic"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = true

[package.metadata.cargo-machete]
ignored = ["rig-core"]  # imported as `rig`, machete can't detect renamed crates

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["media-core", "fetch-extract", "fetch-article", "fetch-feed", "media-chart", "media-phash", "media-pdf", "media-iqa", "media-qr", "media-compression", "media-provenance"]
# Only lsp remains opt-in (editor-specific, not needed for engine users).
# Everything else is default. Zero flags for the binary.
native-inference = ["dep:mistralrs", "dep:async-stream", "dep:image"]  # Native LLM inference via mistral.rs
lsp = ["dep:tower-lsp-server", "dep:nika-lsp-core", "tokio/io-std", "tokio/io-util"]  # Language Server Protocol support

# Media tool features — forwarded to nika-media
media-core = ["nika-media/media-core"]
media-thumbnail = ["nika-media/media-thumbnail"]
media-metadata = ["nika-media/media-metadata"]
media-optimize = ["nika-media/media-optimize"]
media-svg = ["nika-media/media-svg"]
media-phash = ["nika-media/media-phash"]
media-pdf = ["nika-media/media-pdf"]
media-chart = ["nika-media/media-chart"]
media-provenance = ["nika-media/media-provenance"]
media-qr = ["nika-media/media-qr"]
media-compression = ["nika-media/media-compression"]
media-iqa = ["nika-media/media-iqa"]
# Web extraction — forwarded to nika-media. Post-S12-F7/F8 the engine
# no longer owns any HTML extraction code itself (moved to
# nika-extract crate), so these features only forward to nika-media
# — the engine no longer carries its own scraper/htmd/dom_smoothie/
# feed-rs/quick-xml deps. Features are retained as pass-through
# toggles for backwards compatibility with downstream callers that
# select them. `fetch-sitemap` was removed in the S16 swarm cleanup
# because neither the engine nor nika-media implements sitemap
# extraction today.
fetch-html = ["nika-media/fetch-html"]
fetch-markdown = ["nika-media/fetch-markdown"]
fetch-article = ["nika-media/fetch-article"]
fetch-feed = ["nika-media/fetch-feed"]
fetch-extract = ["fetch-html", "fetch-markdown"]

[dependencies]
# Core crates
nika-core = { workspace = true }
nika-kernel = { workspace = true }
nika-macros = { workspace = true }
nika-display = { workspace = true }
nika-event = { workspace = true }
nika-mcp = { workspace = true }
nika-media = { workspace = true }
nika-builtin = { workspace = true }
nika-policy = { workspace = true }
nika-extract = { workspace = true }
nika-security = { workspace = true }
nika-vault = { workspace = true }
# TEMP (S13-B2 → S15/S16): nika-verb-exec dep is normal downward direction
# but the engine's TaskExecutor::run_exec still orchestrates template
# resolution + security validation + error mapping around the verb-crate
# call. Clears when dispatch() live path replaces TaskExecutor (Wave D,
# blocked on template_resolve migration to nika-runtime).
nika-verb-exec = { workspace = true }
# TEMP (S13-C2 → S15): nika-verb-invoke handles builtin dispatch; engine
# still owns MCP non-builtin path (50MB cap, media pipeline, retry events).
# Clears when McpPoolAdapter lands and invoke.rs MCP branch delegates to
# the verb crate. Requires McpPool trait expansion first (S15-A0..A3).
nika-verb-invoke = { workspace = true }
# TEMP (S14-β → S15/S16): partial helper migration only. The retry loop
# orchestration in fetch.rs still calls safe_backoff_delay + parse_retry_after
# re-imported from nika-verb-fetch::retry. Removal blocked on extracting
# fetch_cache + RunContext + SSRF redirect closure + response handling for
# 6 modes (slim/full/binary/llm_txt/304/default). Same shape as W14-B2
# infer surgery — deferred multi-session effort.
nika-verb-fetch = { workspace = true }
# TEMP (W16-A0 → S18+): dual-role dependency.
#
# Role 1 (W16-A0): single-source `emit_provider_responded` helper —
# all 7 engine emission sites (streaming, L0a, L0b, vision, mock) route
# through the verb-crate helper so invariant #24 has exactly one
# regression target.
#
# Role 2 (S17-A2): live execution path for simple text inference.
# The engine's `run_infer` at infer.rs:991 delegates to
# `nika_verb_infer::run()` when `!has_structured && !has_content &&
# extended_thinking != Some(true)`. The streaming path still owns
# structured output (L0a/L0b/L2-L3 retry), vision, and extended
# thinking.
#
# Clears when structured output, vision, and extended thinking are
# also moved to the verb crate (i.e., when the streaming path below
# infer.rs:1081 is replaced wholesale). That's S18+ multi-session
# work blocked on verb-crate streaming support + StructuredOutputEngine
# extraction. Invariant #22 compliance: TEMP marker + explicit
# clearance condition.
nika-verb-infer = { workspace = true }
nika-exec-runner = { workspace = true }
nika-clock = { workspace = true }
nika-fs = { workspace = true }

# Async
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# YAML parsing
serde-saphyr = { workspace = true }
indexmap = { workspace = true }

# JSONPath (RFC 9535)
serde_json_path = { workspace = true }

# JSON Schema validation
jsonschema = { workspace = true }

# Errors
thiserror = { workspace = true }
miette = { workspace = true }

# HTTP
reqwest = { workspace = true }
url = { workspace = true }

# Crawl ethics
texting_robots = { workspace = true }
governor = { workspace = true }

# HTTP intelligence
cookie_store = { workspace = true }
reqwest_cookie_store = { workspace = true }

# Cryptographic hashing
sha2 = { workspace = true }

# Secure credential storage
secrecy = { workspace = true }

# Native inference via mistral.rs
mistralrs = { version = "0.7", optional = true }
async-stream = { version = "0.3", optional = true }

# Utilities
regex = { workspace = true }
colored = { workspace = true }
dashmap = { workspace = true }
semver = { workspace = true }
parking_lot = { workspace = true }
smallvec = { workspace = true }
rustc-hash = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
xxhash-rust = { workspace = true }
chrono = { workspace = true }
unicode-normalization = { workspace = true }

# File System
ignore = { workspace = true }
globset = { workspace = true }

# DAG
petgraph = { workspace = true }

# MCP (rmcp used via nika-mcp)

# LLM Agent Framework
rig-core = { workspace = true }

# Media pipeline
blake3 = { workspace = true }
base64 = { workspace = true }

# Image processing (used by native vision — provider/native/runtime.rs)
image = { workspace = true, optional = true }

# HTML/feed/sitemap extraction was moved to the `nika-extract` crate
# in S12-F7/F8. The engine no longer holds scraper, htmd, dom_smoothie,
# feed-rs, or quick-xml deps directly — extraction is consumed through
# `nika-media` (which holds its own feature-gated copies) via the
# `fetch-*` feature pass-throughs above. Removed in S16-swarm cleanup.

# LSP Server (feature-gated)
tower-lsp-server = { workspace = true, optional = true }
nika-lsp-core = { workspace = true, optional = true }

# Logging
tracing = { workspace = true }
futures = { version = "0.3.32", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
insta = { workspace = true }
pretty_assertions = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
serial_test = { workspace = true }
nika-core = { workspace = true, features = ["mock-bindings"] }
nika-kernel-mock = { workspace = true }
wiremock = "0.6"
qrcode = "0.14"
image = { workspace = true }
shlex = { workspace = true }
flate2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
nika-daemon = { workspace = true }
nix = { workspace = true }
