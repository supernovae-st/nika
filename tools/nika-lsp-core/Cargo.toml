[package]
name = "nika-lsp-core"
version = "0.36.0"
edition = "2021"
authors = ["Thibaut MÉLEN <thibaut@supernovae.studio>"]
description = "Protocol-agnostic LSP intelligence for Nika workflows"
license = "AGPL-3.0-or-later"
repository = "https://github.com/supernovae-st/nika"
rust-version = "1.86"

[dependencies]
nika-core = { path = "../nika-core" }
ls-types = "0.0"
ropey = "1.6"
dashmap = "6"
parking_lot = "0.12"
rustc-hash = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.24"
tree-sitter-yaml = "0.7"

[dev-dependencies]
pretty_assertions = "1"
insta = { version = "1.34", features = ["yaml"] }
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
