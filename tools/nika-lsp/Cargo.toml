[package]
name = "nika-lsp"
version.workspace = true
edition.workspace = true
description = "Language Server Protocol implementation for Nika workflows"
license.workspace = true
authors = ["Thibaut Melen <thibaut@supernovae.studio>"]
repository.workspace = true
homepage = "https://nika.sh"
documentation = "https://docs.rs/nika-lsp"
readme = "README.md"
keywords = ["lsp", "yaml", "workflow", "nika"]
categories = ["development-tools", "text-editors"]
publish = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "nika-lsp"
path = "src/main.rs"

[dependencies]
# LSP
tower-lsp-server = "0.23"

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Concurrent data structures
dashmap = { workspace = true }
parking_lot = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Nika engine (only needs AST + source types — no default features to minimize deps)
nika-engine = { path = "../nika-engine", version = "0.39.0", default-features = false }

# Protocol-agnostic LSP intelligence
nika-lsp-core = { workspace = true }

# Text manipulation
ropey = "1.6"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Template validation
regex = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = { workspace = true }

[features]
default = []
