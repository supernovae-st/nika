[package]
name = "nika-lsp"
version.workspace = true
edition.workspace = true
description = "Language Server Protocol implementation for Nika workflows"
license.workspace = true
authors = ["Thibaut Melen <thibaut@supernovae.studio>"]
repository.workspace = true
homepage = "https://nika.sh"
documentation = "https://docs.rs/nika-lsp"
readme = "README.md"
keywords = ["lsp", "yaml", "workflow", "nika"]
categories = ["development-tools", "text-editors"]
publish = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "nika-lsp"
path = "src/main.rs"

[dependencies]
# LSP
tower-lsp-server = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Concurrent data structures
dashmap = { workspace = true }

# Serialization
serde_json = { workspace = true }

# Nika core (AST, catalogs, source types)
nika-core = { workspace = true }

# Protocol-agnostic LSP intelligence
nika-lsp-core = { workspace = true }

# Text manipulation
ropey = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Template validation
regex = { workspace = true }

# Daemon client (unix only — daemon uses Unix sockets)
[target.'cfg(unix)'.dependencies]
nika-daemon = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[features]
default = []
