[package]
name = "nika-media"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Content-addressable storage and media processing for Nika"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["media-compression"]
media-compression = ["dep:zstd"]
media-thumbnail = ["dep:image"]

[dependencies]
nika-mcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
base64 = { workspace = true }
infer = "0.19"
mime = "0.3"
mime_guess = "2.0"
bytes = "1"
tokio = { workspace = true, features = ["fs"] }
miette = { workspace = true }
imagesize = "0.14"
thumbhash = "0.1"
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "gif"] }

# Optional
zstd = { version = "0.13", optional = true, default-features = false }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
