[package]
name = "nika-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Nika TUI — Terminal user interface with 3-view architecture (Studio/Command/Control)"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = true

[features]
default = []
native-inference = ["nika-engine/native-inference"]
media-core = ["nika-engine/media-core"]
media-thumbnail = ["nika-engine/media-thumbnail"]
media-metadata = ["nika-engine/media-metadata"]
media-optimize = ["nika-engine/media-optimize"]
media-svg = ["nika-engine/media-svg"]
media-phash = ["nika-engine/media-phash"]
media-pdf = ["nika-engine/media-pdf"]
media-chart = ["nika-engine/media-chart"]
media-provenance = ["nika-engine/media-provenance"]
media-qr = ["nika-engine/media-qr"]
media-compression = ["nika-engine/media-compression"]
media-iqa = ["nika-engine/media-iqa"]
fetch-html = ["nika-engine/fetch-html"]
fetch-markdown = ["nika-engine/fetch-markdown"]
fetch-article = ["nika-engine/fetch-article"]
fetch-feed = ["nika-engine/fetch-feed"]
fetch-extract = ["nika-engine/fetch-extract"]

[dependencies]
# Engine crate (all engine logic — NOT nika to avoid circular dep)
nika-engine = { workspace = true }

# Core crate (catalogs, types — pure data, no I/O)
nika-core = { workspace = true }
nika-security = { workspace = true }
nika-vault = { workspace = true }

# LSP core (for TUI completion/analysis)
nika-lsp-core = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Errors
thiserror = { workspace = true }

# TUI framework
ratatui = { workspace = true }
crossterm = { workspace = true }
tui-input = { workspace = true }

# Clipboard
arboard = { workspace = true }

# Syntax Highlighting
tree-sitter = { workspace = true }
tree-sitter-yaml = { workspace = true }
streaming-iterator = { workspace = true }

# Git integration (via CLI — no git2/openssl C compilation)

# Unicode text handling
unicode-width = { workspace = true }
terminal_size = { workspace = true }

# Utilities
colored = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
parking_lot = { workspace = true }
rustc-hash = { workspace = true }
camino = { workspace = true }
ignore = { workspace = true }
xxhash-rust = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
infer = { workspace = true }

# Signal handling (terminal restore on SIGTERM/SIGHUP)
signal-hook = { workspace = true }

# Secret zeroization (API keys)
secrecy = { workspace = true }
zeroize = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
insta = { workspace = true }
pretty_assertions = { workspace = true }
serial_test = { workspace = true }
temp-env = "0.3"
