[package]
name = "nika"
version = "0.16.1"
edition = "2021"
description = "DAG workflow runner for AI tasks with MCP integration"
license = "AGPL-3.0-or-later"
rust-version = "1.86"

[[bin]]
name = "nika"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm", "dep:tui-textarea", "dep:tui-input", "dep:arboard", "dep:notify", "dep:nucleo", "dep:unicode-width", "dep:unicode-segmentation", "dep:terminal_size"]
jobs = ["dep:rusqlite", "dep:backon", "dep:cron", "dep:humantime-serde"]  # Jobs Daemon feature
integration = []  # Enable integration tests with real MCP servers
test-fixtures = []  # Export test_fixtures module for external test crates

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"  # Shell completion generation

# Async
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "signal"] }
tokio-util = "0.7"  # CancellationToken for workflow abort
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
toml = "0.8"

# YAML parsing - serde-saphyr replaces deprecated serde_yaml
# Migration: 2026-02-27 - serde_yaml v0.9.34 is deprecated (repo archived)
# serde-saphyr is a drop-in replacement with: safe Rust, better errors, same API
# See: docs/plans/2026-02-27-v014-complete-plan.md Section 14.1
serde-saphyr = "0.0.20"

# JSON Schema validation
jsonschema = "0.26"

# Errors
thiserror = "1.0"
miette = { version = "7.6", features = ["fancy"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
url = "2"  # URL parsing and validation

# Secure credential storage
keyring = "3"

# Utilities
bytes = "1.11.1"  # Force upgrade to fix RUSTSEC-2026-0007
regex = "1.11"
colored = "2.1"
dotenvy = "0.15"
dashmap = "6.1"
parking_lot = "0.12"
smallvec = "1.13"
rustc-hash = "2.1"
uuid = { version = "1.0", features = ["v4"] }
dirs = "5.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
chrono = "0.4"
rand = "0.8"
humantime = "2.1"  # Duration parsing for nika:sleep (v0.9.3)
shlex = "1.3"  # Shell-free command parsing (v0.15.0 Security)

# File System - production-grade crates
camino = "1.1"     # UTF-8 safe paths (Utf8PathBuf) - no OsStr panics
ignore = "0.4"     # .gitignore/.ignore support (from ripgrep author)
globset = "0.4"    # Fast glob pattern matching (from ripgrep author)

# DAG - StableGraph for v0.9.0+ (stable NodeIndex after deletion)
petgraph = { version = "0.6", features = ["serde-1"] }

# MCP - Anthropic's official Rust SDK
# See docs/research/2026-02-19-mcp-rust-crates.md for crate comparison
rmcp = { version = "0.16", features = ["client", "transport-child-process"] }

# LLM Agent Framework - replaces custom provider implementation
# Native rmcp integration via .rmcp_tools() method
rig-core = { version = "0.31", features = ["rmcp"] }

# TUI (feature-gated)
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", features = ["event-stream"], optional = true }  # Added event-stream for async events
arboard = { version = "3.4", optional = true }  # Clipboard support
notify = { version = "8", optional = true }  # File watching for auto-refresh
nucleo = { version = "0.5", optional = true }  # Fuzzy file search (Helix quality)

# TUI Text Input Components - Updated 2026-02-27 for security fixes
# tui-textarea-2: Maintained fork of tui-textarea with ratatui 0.30+ support
# Fixes: RUSTSEC-2024-0436 (paste unmaintained), RUSTSEC-2026-0002 (lru unsound)
# See: docs/plans/2026-02-27-v014-complete-plan.md Section 14.2
tui-textarea = { package = "tui-textarea-2", version = "0.10", optional = true }  # YAML editor
tui-input = { version = "0.15", features = ["crossterm"], optional = true }  # Chat input (upgraded from 0.11)

# Unicode text handling (from NovaNet patterns)
unicode-width = { version = "0.2", optional = true }  # Display width for CJK, emoji
unicode-segmentation = { version = "1.11", optional = true }  # Grapheme-aware text
terminal_size = { version = "0.4", optional = true }  # Terminal dimensions for responsive layouts

# Jobs Daemon (feature-gated)
rusqlite = { version = "0.32", features = ["bundled"], optional = true }  # SQLite state persistence
backon = { version = "1.3", optional = true }  # Retry with exponential backoff
cron = { version = "0.13", optional = true }  # Cron expression parsing
humantime-serde = { version = "1.1", optional = true }  # Duration serde for TOML config

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = { version = "0.3.32", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = "3.14"
proptest = "1.4"
insta = { version = "1.34", features = ["yaml"] }
pretty_assertions = "1.4"
criterion = { version = "0.5", features = ["async_tokio"] }
serial_test = "3.1"
wiremock = "0.6"
serde-saphyr = "0.0.20"  # For benchmarks (same as main dep)

# Self-dependency to enable test-fixtures feature for integration tests
[dev-dependencies.nika]
path = "."
features = ["test-fixtures"]

# ═══════════════════════════════════════════════════════════════════════════
# BENCHMARKS - Run with: cargo bench
# ═══════════════════════════════════════════════════════════════════════════

[[bench]]
name = "workflow_parsing"
harness = false

[[bench]]
name = "dag_validation"
harness = false

[[bench]]
name = "binding_resolution"
harness = false

[[bench]]
name = "task_execution"
harness = false
