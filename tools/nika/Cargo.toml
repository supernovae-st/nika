[package]
name = "nika"
version = "0.22.1"
edition = "2021"
authors = ["Thibaut MÉLEN <thibaut@supernovae.studio>", "SuperNovae Studio <contact@supernovae.studio>"]
description = "Semantic YAML workflow engine for AI tasks - DAG execution, MCP integration, multi-provider LLM support"
license = "AGPL-3.0-or-later"
repository = "https://github.com/supernovae-st/nika"
homepage = "https://supernovae.studio"
documentation = "https://github.com/supernovae-st/nika#readme"
keywords = ["ai", "workflows", "dag", "mcp", "llm"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
rust-version = "1.86"

[[bin]]
name = "nika"
path = "src/main.rs"

[features]
default = ["tui", "spn-daemon", "native-keychain"]
tui = ["dep:ratatui", "dep:crossterm", "dep:tui-textarea", "dep:tui-input", "dep:arboard", "dep:notify", "dep:nucleo", "dep:unicode-width", "dep:unicode-segmentation", "dep:terminal_size", "dep:tui-tree-widget", "dep:tree-sitter", "dep:tree-sitter-yaml", "dep:streaming-iterator", "dep:syntect"]
lsp = ["dep:tower-lsp", "tokio/io-std", "tokio/io-util"]  # Language Server Protocol support (v0.22)
jobs = ["dep:rusqlite", "dep:cron", "dep:humantime-serde"]  # Jobs Daemon feature
spn-daemon = ["dep:spn-client"]  # Use spn daemon for unified secret management (v0.20)
native-keychain = ["dep:keyring"]  # OS keychain support (macOS Keychain, Windows Credential Manager, Linux Secret Service)
integration = []  # Enable integration tests with real MCP servers
test-fixtures = []  # Export test_fixtures module for external test crates
docker = ["tui"]  # Docker build: TUI enabled, no keychain (uses env vars for secrets)

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"  # Shell completion generation

# Async
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "signal"] }
tokio-util = "0.7"  # CancellationToken for workflow abort
async-trait = "0.1"
backon = "1.3"  # Retry with exponential backoff (used by MCP + Jobs)

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
toml = "0.8"

# YAML parsing - serde-saphyr replaces deprecated serde_yaml
# Migration: 2026-02-27 - serde_yaml v0.9.34 is deprecated (repo archived)
# serde-saphyr is a drop-in replacement with: safe Rust, better errors, same API
# See: docs/plans/2026-02-27-v014-complete-plan.md Section 14.1
serde-saphyr = "0.0.20"

# v0.19 Foundation - Two-Phase IR Architecture
# See: docs/plans/2026-03-04-v0.19-foundation-implementation.md
marked-yaml = "0.8"     # YAML parsing with Span (line:col) tracking
strsim = "0.11"         # Levenshtein distance for "did you mean?" suggestions
indexmap = "2.7"        # Preserve key insertion order in YAML maps

# JSON Schema validation
jsonschema = "0.26"
schemars = "1.0"  # JSON Schema generation for Rust types (v0.21 StructuredOutputEngine)

# Errors
thiserror = "1.0"
miette = { version = "7.6", features = ["fancy"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
url = "2"  # URL parsing and validation

# Secure credential storage
# keyring is optional - only needed when NOT using spn-daemon
# Docker builds don't include keyring (no OS keychain in containers)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"], optional = true }
secrecy = "0.10"   # SecretString wrapper (upgraded for spn-client compat)
zeroize = "1.8"    # Auto-clear memory on drop

# spn daemon client for unified secret management (v0.20)
# Solves macOS Keychain popup issue - daemon is sole keychain accessor
# Enable with: cargo build --features spn-daemon
# v0.2.4: Re-exports spn-core types (providers, validation, backend)
spn-client = { version = "0.2.4", optional = true }

# Text editing (v0.21.2 - VS Code quality)
ropey = "1.6"  # Efficient rope data structure for text editing

# Git integration (v0.21.3 - Git gutter + file status)
git2 = "0.19"  # libgit2 bindings for git operations

# OpenSSL vendored for cross-compilation (required by git2 -> libgit2-sys -> openssl-sys)
# Using vendored feature compiles OpenSSL statically, avoiding system OpenSSL dependency
# Required for: musl static builds, cross-compilation (aarch64-linux-gnu), CI builds
openssl = { version = "0.10", features = ["vendored"] }

# Utilities
bytes = "1.11.1"  # Force upgrade to fix RUSTSEC-2026-0007
regex = "1.11"
colored = "2.1"
dotenvy = "0.15"
dashmap = "6.1"
semver = "1.0"  # Semantic version parsing for package resolution
parking_lot = "0.12"
smallvec = "1.13"
rustc-hash = "2.1"
uuid = { version = "1.0", features = ["v4"] }
dirs = "5.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
chrono = "0.4"
rand = "0.8"
humantime = "2.1"  # Duration parsing for nika:sleep (v0.9.3)
shlex = "1.3"  # Shell-free command parsing (v0.15.0 Security)
shellexpand = "3.1"  # Env var expansion for MCP commands ($VAR, ${VAR}, ~)

# File System - production-grade crates
camino = "1.1"     # UTF-8 safe paths (Utf8PathBuf) - no OsStr panics
ignore = "0.4"     # .gitignore/.ignore support (from ripgrep author)
globset = "0.4"    # Fast glob pattern matching (from ripgrep author)

# DAG - StableGraph for v0.9.0+ (stable NodeIndex after deletion)
petgraph = { version = "0.6", features = ["serde-1"] }

# MCP - Anthropic's official Rust SDK
# See docs/research/2026-02-19-mcp-rust-crates.md for crate comparison
rmcp = { version = "0.16", features = ["client", "transport-child-process"] }

# LLM Agent Framework - replaces custom provider implementation
# Native rmcp integration via .rmcp_tools() method
# v0.32: Uses rmcp 0.16 (aligned with novanet-mcp and Nika direct dep)
rig-core = { version = "0.32", features = ["rmcp"] }

# TUI (feature-gated)
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", features = ["event-stream"], optional = true }  # Added event-stream for async events
arboard = { version = "3.4", optional = true }  # Clipboard support
notify = { version = "8", optional = true }  # File watching for auto-refresh
nucleo = { version = "0.5", optional = true }  # Fuzzy file search (Helix quality)
tui-tree-widget = { version = "0.24", optional = true }  # VS Code-like tree view (v0.20)

# Syntax Highlighting - Two backends available:
# - syntect: TextMate grammars, 50k+ lines/sec, ready-made themes (VS Code compatible)
# - tree-sitter: Incremental parsing, structural editing (Helix approach)
# v0.22: Using syntect for YAML highlighting (simpler, sufficient for .nika.yaml files)
tree-sitter = { version = "0.24", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
streaming-iterator = { version = "0.1", optional = true }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"], optional = true }

# TUI Text Input Components - Updated 2026-02-27 for security fixes
# tui-textarea-2: Maintained fork of tui-textarea with ratatui 0.30+ support
# Fixes: RUSTSEC-2024-0436 (paste unmaintained), RUSTSEC-2026-0002 (lru unsound)
# See: docs/plans/2026-02-27-v014-complete-plan.md Section 14.2
tui-textarea = { package = "tui-textarea-2", version = "0.10", optional = true }  # YAML editor
tui-input = { version = "0.15", features = ["crossterm"], optional = true }  # Chat input (upgraded from 0.11)

# Unicode text handling (from NovaNet patterns)
unicode-width = { version = "0.2", optional = true }  # Display width for CJK, emoji
unicode-segmentation = { version = "1.11", optional = true }  # Grapheme-aware text
terminal_size = { version = "0.4", optional = true }  # Terminal dimensions for responsive layouts

# Jobs Daemon (feature-gated)
rusqlite = { version = "0.32", features = ["bundled"], optional = true }  # SQLite state persistence
cron = { version = "0.13", optional = true }  # Cron expression parsing
humantime-serde = { version = "1.1", optional = true }  # Duration serde for TOML config

# LSP Server (feature-gated) - v0.22 Language Server Protocol support
tower-lsp = { version = "0.20", optional = true }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = { version = "0.3.32", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = "3.14"
proptest = "1.4"
insta = { version = "1.34", features = ["yaml"] }
pretty_assertions = "1.4"
criterion = { version = "0.5", features = ["async_tokio"] }
serial_test = "3.1"
wiremock = "0.6"
serde-saphyr = "0.0.20"  # For benchmarks (same as main dep)

# Self-dependency to enable test-fixtures feature for integration tests
[dev-dependencies.nika]
path = "."
features = ["test-fixtures"]

# ═══════════════════════════════════════════════════════════════════════════
# BENCHMARKS - Run with: cargo bench
# ═══════════════════════════════════════════════════════════════════════════

[[bench]]
name = "workflow_parsing"
harness = false

[[bench]]
name = "dag_validation"
harness = false

[[bench]]
name = "binding_resolution"
harness = false

[[bench]]
name = "task_execution"
harness = false
