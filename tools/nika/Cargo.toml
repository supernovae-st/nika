[package]
name = "nika"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Semantic YAML workflow engine for AI tasks - DAG execution, MCP integration, multi-provider LLM support"
license.workspace = true
repository.workspace = true
homepage = "https://supernovae.studio"
documentation = "https://github.com/supernovae-st/nika#readme"
keywords = ["ai", "workflows", "dag", "mcp", "llm"]
categories = ["command-line-utilities", "development-tools"]
publish = true
readme = "README.md"
rust-version.workspace = true

[[bin]]
name = "nika"
path = "src/main.rs"

[features]
default = ["tui", "nika-engine/default"]
# Only 2 features remain opt-in:
#   - media-provenance (C2PA): heavy dep (openssl, crypto) + legal/compliance use case
#   - lsp: editor-specific, not needed for CLI users
# Everything else is default via nika-engine/default.
tui = ["dep:ratatui", "dep:crossterm", "dep:tui-input", "dep:arboard", "dep:nucleo", "dep:tree-sitter", "dep:tree-sitter-yaml", "dep:streaming-iterator", "dep:git2", "dep:openssl"]
integration = []  # Enable integration tests with real MCP servers

# Forwarded features to nika-engine and nika-cli
nika-daemon = ["nika-engine/nika-daemon"]
native-keychain = ["nika-engine/native-keychain"]
native-inference = ["nika-engine/native-inference", "nika-cli/native-inference"]
media-core = ["nika-engine/media-core", "nika-cli/media-core"]
media-thumbnail = ["nika-engine/media-thumbnail", "nika-cli/media-thumbnail"]
media-metadata = ["nika-engine/media-metadata", "nika-cli/media-metadata"]
media-optimize = ["nika-engine/media-optimize", "nika-cli/media-optimize"]
media-svg = ["nika-engine/media-svg", "nika-cli/media-svg"]
media-phash = ["nika-engine/media-phash", "nika-cli/media-phash"]
media-pdf = ["nika-engine/media-pdf", "nika-cli/media-pdf"]
media-chart = ["nika-engine/media-chart", "nika-cli/media-chart"]
media-provenance = ["nika-engine/media-provenance", "nika-cli/media-provenance"]
media-qr = ["nika-engine/media-qr", "nika-cli/media-qr"]
media-compression = ["nika-engine/media-compression", "nika-cli/media-compression"]
media-iqa = ["nika-engine/media-iqa", "nika-cli/media-iqa"]
fetch-html = ["nika-engine/fetch-html", "nika-cli/fetch-html"]
fetch-markdown = ["nika-engine/fetch-markdown", "nika-cli/fetch-markdown"]
fetch-article = ["nika-engine/fetch-article", "nika-cli/fetch-article"]
fetch-feed = ["nika-engine/fetch-feed", "nika-cli/fetch-feed"]
fetch-extract = ["nika-engine/fetch-extract"]
lsp = ["dep:tower-lsp-server", "tokio/io-std", "tokio/io-util", "nika-engine/lsp", "nika-cli/lsp"]

[dependencies]
# Engine crate (all engine logic lives here now)
nika-engine = { workspace = true }

# CLI subcommand handlers
nika-cli = { workspace = true }

# CLI
clap = { workspace = true }
clap_complete = { workspace = true }

# Async runtime (main.rs + TUI)
tokio = { workspace = true }

# Serialization (used by cli/ and tui/)
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Errors (used by main.rs and tui/)
miette = { workspace = true }
thiserror = { workspace = true }

# Utilities (used by main.rs, cli/, tui/)
colored = { workspace = true }
dotenvy = "0.15"
rand = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }

# Logging (setup in main.rs)
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# TUI (feature-gated)
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", features = ["event-stream"], optional = true }
arboard = { version = "3.4", optional = true }
nucleo = { version = "0.5", optional = true }

# Syntax Highlighting (TUI)
tree-sitter = { version = "0.24", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
streaming-iterator = { version = "0.1", optional = true }

# TUI Text Input
tui-input = { version = "0.15", features = ["crossterm"], optional = true }

# Unicode text handling (TUI)
unicode-width = "0.2"
terminal_size = "0.4"

# Utilities (used by CLI and TUI)
rustc-hash = { workspace = true }
camino = { workspace = true }
ignore = { workspace = true }
xxhash-rust = { workspace = true }
uuid = { workspace = true }
dirs = "5.0"
humantime = { workspace = true }
infer = "0.19"

# Git integration (TUI only)
git2 = { version = "0.19", optional = true }
openssl = { version = "0.10", features = ["vendored"], optional = true }

# LSP Server (feature-gated)
tower-lsp-server = { version = "0.23", optional = true }
nika-lsp-core = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
insta = { workspace = true }
pretty_assertions = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
serial_test = "3.1"
wiremock = "0.6"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
dashmap = { workspace = true }
rig-core = { workspace = true }
futures = { version = "0.3.32", default-features = false, features = ["alloc"] }

# ═══════════════════════════════════════════════════════════════════════════
# BENCHMARKS
# ═══════════════════════════════════════════════════════════════════════════

[[bench]]
name = "binding_resolution"
harness = false

[[bench]]
name = "task_execution"
harness = false

# Profiles are defined in workspace root (tools/Cargo.toml)
