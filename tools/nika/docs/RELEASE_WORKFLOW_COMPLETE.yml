# Nika Workspace Release Workflow (v0.28+)
# ==============================================================================
# Triggered on tag push (v*) or manual dispatch
#
# Release Pipeline:
#   1. Version Validation (verify workspace version coherence)
#   2. Build Matrix (6 targets: macOS, Linux native + musl)
#   3. Test Suite (all platforms, all features)
#   4. Publish Crates (sequential: core → runtime → tui)
#   5. GitHub Release (create release with binaries)
#   6. Docker Publish (multi-arch image)
#   7. Homebrew Update (formula update)
#
# Nika v0.28.0 — 3-Crate Workspace Architecture
# ==============================================================================

name: Release (Workspace)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.28.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (build only, no publish)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 1: Version Validation (2 min)
  # ═══════════════════════════════════════════════════════════════════════════

  validate-versions:
    name: Validate Versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.dry_run && github.sha || env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Extract version from tag
        id: extract
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Verify version coherence
        env:
          EXPECTED_VERSION: ${{ steps.extract.outputs.version }}
        run: |
          echo "=== Verifying workspace version coherence ==="

          # Extract versions from each crate
          CORE_VER=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name == "nika-core") | .version')
          RUNTIME_VER=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name == "nika-runtime") | .version')
          TUI_VER=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name == "nika-tui") | .version')

          echo "Expected: $EXPECTED_VERSION"
          echo "nika-core:    $CORE_VER"
          echo "nika-runtime: $RUNTIME_VER"
          echo "nika-tui:     $TUI_VER"

          # Check all versions match
          if [ "$CORE_VER" != "$EXPECTED_VERSION" ]; then
            echo "::error::nika-core version mismatch: $CORE_VER != $EXPECTED_VERSION"
            exit 1
          fi

          if [ "$RUNTIME_VER" != "$EXPECTED_VERSION" ]; then
            echo "::error::nika-runtime version mismatch: $RUNTIME_VER != $EXPECTED_VERSION"
            exit 1
          fi

          if [ "$TUI_VER" != "$EXPECTED_VERSION" ]; then
            echo "::error::nika-tui version mismatch: $TUI_VER != $EXPECTED_VERSION"
            exit 1
          fi

          echo "✓ All crates synchronized at v$EXPECTED_VERSION"

      - name: Verify CHANGELOG entries
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          echo "=== Verifying CHANGELOG entries ==="
          if ! grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::No CHANGELOG entry found for v$VERSION"
            exit 1
          fi
          echo "✓ CHANGELOG entry exists for v$VERSION"

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 2: Build Matrix (30 min)
  # ═══════════════════════════════════════════════════════════════════════════

  build:
    name: Build ${{ matrix.target }}
    needs: validate-versions
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native targets (full features)
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: nika-macos-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: nika-macos-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: nika-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: nika-linux-arm64
            cross: true

          # Docker targets (musl static)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: nika-linux-musl-x64
            docker: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: nika-linux-musl-arm64
            docker: true
            cross: true

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.dry_run && github.sha || env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (cross-compilation)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && !matrix.docker
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install musl tools
        if: matrix.docker && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # Build commands
      - name: Build (native, full features)
        if: "!matrix.cross && !matrix.docker"
        run: cargo build --release --target ${{ matrix.target }} -p nika-tui

      - name: Build (native, docker features)
        if: "!matrix.cross && matrix.docker"
        run: cargo build --release --target ${{ matrix.target }} -p nika-tui --no-default-features --features docker

      - name: Build (cross, full features)
        if: matrix.cross && !matrix.docker
        run: cross build --release --target ${{ matrix.target }} -p nika-tui

      - name: Build (cross, docker features)
        if: matrix.cross && matrix.docker
        run: cross build --release --target ${{ matrix.target }} -p nika-tui --no-default-features --features docker

      # Package
      - name: Package binary
        env:
          VERSION: ${{ needs.validate-versions.outputs.version }}
          ARTIFACT: ${{ matrix.artifact }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "dist/${ARTIFACT}-${VERSION}"
          cp "target/${TARGET}/release/nika" "dist/${ARTIFACT}-${VERSION}/"
          cp README.md LICENSE CHANGELOG.md "dist/${ARTIFACT}-${VERSION}/" 2>/dev/null || true
          cd dist
          tar -czvf "${ARTIFACT}-${VERSION}.tar.gz" "${ARTIFACT}-${VERSION}"
          shasum -a 256 "${ARTIFACT}-${VERSION}.tar.gz" > "${ARTIFACT}-${VERSION}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 3: Test Suite (20 min)
  # ═══════════════════════════════════════════════════════════════════════════

  test-release:
    name: Test Release Build
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.dry_run && github.sha || env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Run all tests
        run: cargo nextest run --workspace --all-features

      - name: Download linux-x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: nika-linux-x64
          path: artifacts

      - name: Extract and test binary
        env:
          VERSION: ${{ needs.validate-versions.outputs.version }}
        run: |
          cd artifacts
          tar -xzf "nika-linux-x64-${VERSION}.tar.gz"
          BINARY="nika-linux-x64-${VERSION}/nika"
          chmod +x "$BINARY"
          "$BINARY" --version
          "$BINARY" --help

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 4: Publish Crates (10 min)
  # ═══════════════════════════════════════════════════════════════════════════

  publish-crates:
    name: Publish Crates
    needs: [validate-versions, build, test-release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish nika-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          echo "=== Publishing nika-core ==="
          cargo publish -p nika-core --token "$CARGO_REGISTRY_TOKEN"

      - name: Wait for nika-core propagation
        run: |
          echo "Waiting 60s for crates.io index propagation..."
          sleep 60

      - name: Verify nika-core is available
        env:
          VERSION: ${{ needs.validate-versions.outputs.version }}
        run: |
          cargo search nika-core --limit 1 | grep "$VERSION" || {
            echo "::error::nika-core $VERSION not found on crates.io"
            exit 1
          }

      - name: Publish nika-runtime
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          echo "=== Publishing nika-runtime ==="
          cargo publish -p nika-runtime --token "$CARGO_REGISTRY_TOKEN"

      - name: Wait for nika-runtime propagation
        run: |
          echo "Waiting 60s for crates.io index propagation..."
          sleep 60

      - name: Verify nika-runtime is available
        env:
          VERSION: ${{ needs.validate-versions.outputs.version }}
        run: |
          cargo search nika-runtime --limit 1 | grep "$VERSION" || {
            echo "::error::nika-runtime $VERSION not found on crates.io"
            exit 1
          }

      - name: Publish nika-tui
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          echo "=== Publishing nika-tui ==="
          cargo publish -p nika-tui --token "$CARGO_REGISTRY_TOKEN"

      - name: Final verification
        env:
          VERSION: ${{ needs.validate-versions.outputs.version }}
        run: |
          echo "Waiting 30s for final propagation..."
          sleep 30
          cargo search nika-tui --limit 1 | grep "$VERSION" || {
            echo "::error::nika-tui $VERSION not found on crates.io"
            exit 1
          }
          echo "✓ All crates published successfully"

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 5: GitHub Release (5 min)
  # ═══════════════════════════════════════════════════════════════════════════

  github-release:
    name: Create GitHub Release
    needs: [validate-versions, build, publish-crates]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate release notes
        env:
          VERSION: ${{ needs.validate-versions.outputs.version }}
        run: |
          cat > release-notes.md << 'HEADER'
          ```
          ╔═══════════════════════════════════════════════════════════════════════════════╗
          ║                                                                               ║
          ║   🦋  N I K A   v 0 . 2 8 . 0                                                ║
          ║                                                                               ║
          ║   Semantic YAML Workflow Engine — 3-Crate Workspace Architecture             ║
          ║                                                                               ║
          ╚═══════════════════════════════════════════════════════════════════════════════╝
          ```
          HEADER

          echo "" >> release-notes.md
          echo "## 🦋 Nika v${VERSION}" >> release-notes.md
          echo "" >> release-notes.md

          # Extract changelog
          if [ -f "CHANGELOG.md" ]; then
            NOTES=$(awk -v ver="${VERSION}" '/^## \[/{if(match($0, ver)){found=1; next}} /^## \[/{if(found) exit} found{print}' CHANGELOG.md || true)
            if [ -n "$NOTES" ]; then
              echo "$NOTES" >> release-notes.md
            fi
          fi

          # Add crates info
          cat >> release-notes.md << CRATES

          ---

          ## 📦 Crates

          This release includes 3 crates published to crates.io:

          | Crate | Version | Description |
          |-------|---------|-------------|
          | [nika-core](https://crates.io/crates/nika-core) | ${VERSION} | Zero-dep core types (AST, DAG, error) |
          | [nika-runtime](https://crates.io/crates/nika-runtime) | ${VERSION} | Execution engine (MCP, providers, runtime) |
          | [nika-tui](https://crates.io/crates/nika-tui) | ${VERSION} | Terminal interface (TUI, LSP, jobs) |

          CRATES

          # Add installation section
          cat >> release-notes.md << INSTALL

          ---

          ## 📦 Installation

          ### Cargo
          \`\`\`bash
          cargo install nika-tui
          \`\`\`

          ### Homebrew (macOS/Linux)
          \`\`\`bash
          brew tap supernovae-st/tap && brew install nika
          \`\`\`

          ### Docker
          \`\`\`bash
          docker pull ghcr.io/supernovae-st/nika:${VERSION}
          docker run --rm ghcr.io/supernovae-st/nika:${VERSION} --version
          \`\`\`

          ### Binary Download
          Download the appropriate archive for your platform from the assets below.

          | Platform | Architecture | File |
          |----------|--------------|------|
          | 🍎 macOS | Apple Silicon | \`nika-macos-arm64-${VERSION}.tar.gz\` |
          | 🍎 macOS | Intel | \`nika-macos-x64-${VERSION}.tar.gz\` |
          | 🐧 Linux | x64 | \`nika-linux-x64-${VERSION}.tar.gz\` |
          | 🐧 Linux | ARM64 | \`nika-linux-arm64-${VERSION}.tar.gz\` |

          ---

          <sub>Made with 💜 by [SuperNovae Studio](https://supernovae.studio)</sub>
          INSTALL

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "🦋 Nika ${{ needs.validate-versions.outputs.version }}"
          body_path: release-notes.md
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 6: Docker Publish (15 min)
  # ═══════════════════════════════════════════════════════════════════════════

  docker-publish:
    name: Publish Docker Image
    needs: [validate-versions, build, github-release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download musl binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract binaries for Docker
        env:
          VERSION: ${{ needs.validate-versions.outputs.version }}
        run: |
          mkdir -p docker-context/amd64 docker-context/arm64

          tar -xzf "artifacts/nika-linux-musl-x64/nika-linux-musl-x64-${VERSION}.tar.gz" -C docker-context/amd64 --strip-components=1
          tar -xzf "artifacts/nika-linux-musl-arm64/nika-linux-musl-arm64-${VERSION}.tar.gz" -C docker-context/arm64 --strip-components=1

          chmod +x docker-context/*/nika
          file docker-context/amd64/nika
          file docker-context/arm64/nika

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/supernovae-st/nika
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: docker-context
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.validate-versions.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Generate attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/supernovae-st/nika
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 7: Homebrew Update (5 min)
  # ═══════════════════════════════════════════════════════════════════════════

  update-homebrew:
    name: Update Homebrew Formula
    needs: [validate-versions, github-release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: nika
          homebrew-tap: supernovae-st/homebrew-tap
          download-url: https://github.com/supernovae-st/nika/releases/download/${{ env.RELEASE_TAG }}/nika-macos-x64-${{ needs.validate-versions.outputs.version }}.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        continue-on-error: true
