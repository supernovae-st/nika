# Nika Jobs Daemon Configuration
# v0.14 Feature: Background job scheduling with cron, webhooks, file watching, intervals
#
# This configuration file defines scheduled and triggered jobs for the Nika daemon.
# Place in .nika/jobs.toml or specify with `nika jobs start --config jobs.toml`

[daemon]
# Daemon process settings
pid_file = ".nika/jobs.pid"
log_file = ".nika/logs/jobs.log"
log_level = "info"  # trace, debug, info, warn, error

# Graceful shutdown timeout (seconds)
shutdown_timeout = 30

# Health check endpoint
health_check_port = 9090
health_check_path = "/health"

# Metrics export (Prometheus)
metrics_enabled = true
metrics_port = 9091

# ════════════════════════════════════════════════════════════════════
# CRON JOBS
# Standard cron syntax with optional seconds field
# ════════════════════════════════════════════════════════════════════

[[jobs.cron]]
name = "daily-content-audit"
schedule = "0 6 * * *"  # Every day at 6 AM
workflow = "workflows/content-audit.nika.yaml"
enabled = true
timezone = "America/New_York"
# Inputs passed to workflow
[jobs.cron.inputs]
audit_depth = "full"
notify_on_issues = true

[[jobs.cron]]
name = "hourly-metrics-collection"
schedule = "0 * * * *"  # Every hour
workflow = "workflows/collect-metrics.nika.yaml"
enabled = true
# Retry on failure
max_retries = 3
retry_delay_seconds = 60
[jobs.cron.inputs]
sources = ["analytics", "search_console", "social"]

[[jobs.cron]]
name = "weekly-seo-report"
schedule = "0 9 * * 1"  # Every Monday at 9 AM
workflow = "workflows/seo-report.nika.yaml"
enabled = true
[jobs.cron.inputs]
report_format = "pdf"
send_to = ["team@company.com"]

[[jobs.cron]]
name = "nightly-backup"
schedule = "0 2 * * *"  # Every day at 2 AM
workflow = "workflows/backup-database.nika.yaml"
enabled = true
# Exclusive: only one instance at a time
exclusive = true
# Timeout for long-running jobs
timeout_minutes = 120

# ════════════════════════════════════════════════════════════════════
# WEBHOOK JOBS
# HTTP-triggered workflow execution with authentication
# ════════════════════════════════════════════════════════════════════

[[jobs.webhook]]
name = "github-push"
path = "/webhooks/github"
workflow = "workflows/ci-cd-pipeline.nika.yaml"
enabled = true

# Authentication
[jobs.webhook.auth]
type = "hmac-sha256"
secret_env = "GITHUB_WEBHOOK_SECRET"
header = "X-Hub-Signature-256"

# Input mapping from webhook payload
[jobs.webhook.input_mapping]
commit_sha = "$.after"
branch = "$.ref"
repository = "$.repository.full_name"
pusher = "$.pusher.name"

# Filter: only trigger on specific conditions
[jobs.webhook.filter]
branch_pattern = "^refs/heads/(main|develop)$"
ignore_patterns = ["[skip ci]", "[no build]"]

[[jobs.webhook]]
name = "stripe-payment"
path = "/webhooks/stripe"
workflow = "workflows/process-payment.nika.yaml"
enabled = true

[jobs.webhook.auth]
type = "hmac-sha256"
secret_env = "STRIPE_WEBHOOK_SECRET"
header = "Stripe-Signature"

[jobs.webhook.input_mapping]
event_type = "$.type"
customer_id = "$.data.object.customer"
amount = "$.data.object.amount"
currency = "$.data.object.currency"

# Event type filter
[jobs.webhook.filter]
event_types = ["payment_intent.succeeded", "payment_intent.failed"]

[[jobs.webhook]]
name = "cms-publish"
path = "/webhooks/cms"
workflow = "workflows/content-published.nika.yaml"
enabled = true

[jobs.webhook.auth]
type = "bearer"
token_env = "CMS_WEBHOOK_TOKEN"

[jobs.webhook.input_mapping]
content_id = "$.id"
content_type = "$.type"
locale = "$.locale"
action = "$.action"

# ════════════════════════════════════════════════════════════════════
# FILE WATCH JOBS
# Trigger workflows when files change (debounced)
# ════════════════════════════════════════════════════════════════════

[[jobs.watch]]
name = "schema-changed"
paths = ["brain/models/**/*.yaml"]
events = ["create", "modify"]  # create, modify, delete, rename
workflow = "workflows/validate-schema.nika.yaml"
enabled = true
# Debounce rapid changes
debounce_ms = 1000
# Ignore patterns
ignore = ["*.bak", "*.tmp", ".git/**"]

[jobs.watch.inputs]
validate_strict = true
generate_types = true

[[jobs.watch]]
name = "content-updated"
paths = ["content/**/*.md", "content/**/*.json"]
events = ["create", "modify", "delete"]
workflow = "workflows/rebuild-index.nika.yaml"
enabled = true
debounce_ms = 2000

[[jobs.watch]]
name = "config-changed"
paths = [".nika/config.toml", ".nika/context/**"]
events = ["modify"]
workflow = "workflows/reload-config.nika.yaml"
enabled = true
debounce_ms = 500

# ════════════════════════════════════════════════════════════════════
# INTERVAL JOBS
# Fixed-interval execution (simpler than cron for regular intervals)
# ════════════════════════════════════════════════════════════════════

[[jobs.interval]]
name = "health-check"
every = "5m"  # 5 minutes (supports: s, m, h, d)
workflow = "workflows/health-check.nika.yaml"
enabled = true
# Run immediately on daemon start
run_on_start = true

[jobs.interval.inputs]
endpoints = ["api", "database", "cache", "mcp"]
alert_threshold_ms = 1000

[[jobs.interval]]
name = "queue-processor"
every = "30s"
workflow = "workflows/process-queue.nika.yaml"
enabled = true
# Exclusive: skip if previous run still active
exclusive = true

[jobs.interval.inputs]
batch_size = 100
max_processing_time_ms = 25000

[[jobs.interval]]
name = "cache-warmup"
every = "15m"
workflow = "workflows/warm-cache.nika.yaml"
enabled = true
run_on_start = true

[jobs.interval.inputs]
entities = ["popular", "recent", "trending"]
locales = ["en-US", "fr-FR", "de-DE"]

# ════════════════════════════════════════════════════════════════════
# JOB GROUPS
# Logical groupings for enable/disable and monitoring
# ════════════════════════════════════════════════════════════════════

[groups]
production = ["daily-content-audit", "hourly-metrics-collection", "nightly-backup", "github-push"]
development = ["schema-changed", "content-updated", "config-changed"]
monitoring = ["health-check", "queue-processor"]

# ════════════════════════════════════════════════════════════════════
# NOTIFICATIONS
# Alert channels for job failures
# ════════════════════════════════════════════════════════════════════

[notifications.slack]
webhook_url_env = "SLACK_WEBHOOK_URL"
channel = "#nika-jobs"
on_failure = true
on_success = false  # Don't spam on success
mention_on_failure = ["@oncall"]

[notifications.email]
smtp_host = "smtp.company.com"
smtp_port = 587
from = "nika-jobs@company.com"
to = ["devops@company.com"]
on_failure = true
on_success = false

[notifications.pagerduty]
routing_key_env = "PAGERDUTY_ROUTING_KEY"
# Only alert for critical jobs
jobs = ["nightly-backup", "health-check"]
severity = "critical"

# ════════════════════════════════════════════════════════════════════
# RESOURCE LIMITS
# Prevent runaway jobs from consuming resources
# ════════════════════════════════════════════════════════════════════

[limits]
# Max concurrent job executions
max_concurrent_jobs = 10

# Per-job memory limit (MB)
max_memory_mb = 512

# Default timeout for jobs without explicit timeout
default_timeout_minutes = 30

# Max workflow file size (KB)
max_workflow_size_kb = 1024

# Rate limiting for webhooks (requests per minute per endpoint)
webhook_rate_limit = 60
