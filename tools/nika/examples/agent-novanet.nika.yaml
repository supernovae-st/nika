# Agent with NovaNet MCP Tools
#
# Demonstrates agentic execution with MCP tool integration.
# The agent autonomously calls NovaNet tools to gather context
# and generate native content.
#
# Usage:
#   nika examples/agent-novanet.nika.yaml
#
# Requirements:
#   - ANTHROPIC_API_KEY environment variable
#   - NovaNet MCP server running (cargo run in tools/novanet-mcp)
#   - Neo4j database with NovaNet schema

schema: "nika/workflow@0.12"
workflow: agent-novanet
description: "Agent with NovaNet MCP tool integration"

provider: claude
model: claude-sonnet-4-6

mcp:
  novanet:
    command: cargo
    args:
      - run
      - --manifest-path
      - ../../../novanet/tools/novanet-mcp/Cargo.toml
    env:
      NOVANET_MCP_NEO4J_URI: bolt://localhost:7687
      NOVANET_MCP_NEO4J_USER: neo4j
      NOVANET_MCP_NEO4J_PASSWORD: novanetpassword

tasks:
  - id: generate_content
    description: "Generate native French content for QR Code hero block"
    agent:
      prompt: |
        Generate native French content for the QR Code homepage hero block.

        INSTRUCTIONS:
        1. Use novanet_generate to get full context for entity "qr-code" in locale "fr-FR"
        2. Use the denomination_forms EXACTLY as provided (no paraphrasing)
        3. Generate a JSON object with:
           - title: H1 for the hero (use denomination_forms.title)
           - subtitle: Short tagline
           - description: 2-3 sentences (use denomination_forms.text)
           - cta_text: Call-to-action button text

        When complete, output the JSON and say "GENERATION_COMPLETE".

      mcp: [novanet]
      max_turns: 5
      extended_thinking: false

    output:
      format: json
      schema:
        type: object
        required: [title, subtitle, description, cta_text]
        properties:
          title:
            type: string
          subtitle:
            type: string
          description:
            type: string
          cta_text:
            type: string
      max_retries: 2
