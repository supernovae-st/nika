# Simple Agent Workflow
#
# Demonstrates the agent verb in its simplest form.
# The agent operates without MCP tools, using only reasoning.
#
# Usage:
#   nika examples/agent-simple.nika.yaml
#
# Requirements:
#   - ANTHROPIC_API_KEY environment variable

schema: "nika/workflow@0.10"
workflow: agent-simple
description: "Simple agent demonstration without MCP tools"

provider: claude
model: claude-sonnet-4-6

tasks:
  - id: summarize
    description: "Summarize YAML configuration benefits"
    agent:
      prompt: |
        Summarize the key benefits of using YAML for configuration files.

        Provide a JSON response with:
        - benefits: array of 3 key benefits
        - recommendation: one sentence recommendation

      max_turns: 3

    output:
      format: json
      schema:
        type: object
        required: [benefits, recommendation]
        properties:
          benefits:
            type: array
            items:
              type: string
            minItems: 3
            maxItems: 5
          recommendation:
            type: string
      max_retries: 2
