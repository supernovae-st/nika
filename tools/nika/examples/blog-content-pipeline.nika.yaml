# Blog Content Pipeline
#
# Comprehensive workflow for multi-platform blog content generation.
# Demonstrates all verbs + for_each + agent orchestration.
#
# Pipeline:
#   check_calendar -> (parallel) [get_trends + web_search + scrape_competitors]
#     -> research_topics -> generate_outline -> generate_metadata
#       -> write_article (agent) -> render_platforms (for_each)
#         -> validate_content -> prepare_publication -> save_and_notify
#
# Usage:
#   nika examples/blog-content-pipeline.nika.yaml
#
# Requirements:
#   - ANTHROPIC_API_KEY
#   - PERPLEXITY_API_KEY
#   - FIRECRAWL_API_KEY
#   - NEWSAPI_KEY (optional)

schema: "nika/workflow@0.9"
workflow: blog-content-pipeline
description: "Enterprise blog content generation pipeline with multi-platform support"

provider: claude
model: claude-sonnet-4-6

artifacts:
  dir: ./content/{{date}}/{{workflow_name}}
  format: json
  manifest: true

mcp:
  perplexity:
    command: npx
    args: ["-y", "@perplexity-ai/mcp-server"]

  firecrawl:
    command: npx
    args: ["-y", "firecrawl-mcp"]

inputs:
  content_calendar_path:
    type: string
    description: "Path to content calendar JSON"
    default: "./content-calendar.json"
  target_word_count:
    type: integer
    description: "Target article word count"
    default: 2500

tasks:
  # -------------------------------------------------------------------------
  # PHASE 1: Content Planning & Discovery
  # -------------------------------------------------------------------------

  - id: check_calendar
    description: "Check content calendar for available slots"
    exec: |
      if [ -f "{{inputs.content_calendar_path}}" ]; then
        cat "{{inputs.content_calendar_path}}"
      else
        echo '{"status":"no_calendar","available_slots":5,"next_deadline":"2026-03-15"}'
      fi
    output:
      format: json

  # -------------------------------------------------------------------------
  # PHASE 2: Parallel Research & Competitive Analysis
  # -------------------------------------------------------------------------

  - id: get_trends
    description: "Fetch trending topics from news API"
    fetch:
      url: "https://newsapi.org/v2/top-headlines?category=technology&pageSize=10"
      method: GET
      headers:
        Authorization: "Bearer ${NEWSAPI_KEY:-demo}"
    output:
      format: json

  - id: web_search
    description: "Search web for current AI and content trends"
    error_handling: fallback_to_default
    agent:
      prompt: |
        Search the web for the latest trends in AI, machine learning, and
        content marketing for 2026. Use perplexity_search_web to find:

        1. Emerging AI technologies relevant to content creators
        2. Content formats gaining popularity
        3. SEO trends for 2026

        Return a structured summary with trend name, relevance, and description.

      mcp: [perplexity]
      max_turns: 3

    output:
      format: json
      max_retries: 2
      fallback_value:
        trends:
          - name: "AI-Assisted Content Creation"
            relevance: "high"
            description: "LLMs and generative AI for content creators"
          - name: "Voice Search Optimization"
            relevance: "high"
            description: "SEO strategies for voice-activated searches"
          - name: "Interactive Content Formats"
            relevance: "medium"
            description: "Quizzes, polls, and dynamic content engagement"
      schema:
        type: object
        required: [trends]
        properties:
          trends:
            type: array
            items:
              type: object
              required: [name, relevance, description]
              properties:
                name:
                  type: string
                relevance:
                  type: string
                  enum: [high, medium, low]
                description:
                  type: string

  - id: scrape_competitors
    description: "Analyze competitor blog posts"
    error_handling: fallback_to_default
    agent:
      prompt: |
        Using firecrawl_scrape, analyze competitor blog posts on AI content.
        Extract:
        1. Article structure and sections
        2. Content length and tone
        3. Use of keywords and CTAs
        4. Engagement patterns

        Return analysis as structured JSON.

      mcp: [firecrawl]
      max_turns: 4

    output:
      format: json
      fallback_value:
        competitors:
          - name: "Competitor A"
            avg_word_count: 2400
            structure: ["intro", "problem", "solution", "implementation", "conclusion"]
            tone: "professional"
            cta_frequency: "high"
          - name: "Competitor B"
            avg_word_count: 2200
            structure: ["intro", "research", "insights", "tips", "conclusion"]
            tone: "conversational"
            cta_frequency: "medium"

  # -------------------------------------------------------------------------
  # PHASE 3: Topic Research & Synthesis
  # -------------------------------------------------------------------------

  - id: research_topics
    description: "Deep research on selected topic"
    use:
      calendar: check_calendar
      trends: get_trends
      web_trends: web_search
      competitor_insights: scrape_competitors
    agent:
      prompt: |
        Based on these inputs, select the BEST blog topic:

        CALENDAR: {{use.calendar | to_yaml}}
        TRENDS: {{use.trends | to_yaml}}
        WEB TRENDS: {{use.web_trends | to_yaml}}
        COMPETITORS: {{use.competitor_insights | to_yaml}}

        The topic must be:
        - Currently trending
        - Underserved by competitors
        - Relevant to our audience
        - SEO-friendly

        Use perplexity_search_web to research this topic deeply.

      mcp: [perplexity]
      max_turns: 5
      extended_thinking: true
      thinking_budget: 4000

    output:
      format: json
      max_retries: 2
      schema:
        type: object
        required: [topic, seo_keywords, research_summary, sections]
        properties:
          topic:
            type: string
          why_trending:
            type: string
          seo_keywords:
            type: array
            items:
              type: string
            minItems: 3
          competitor_gap:
            type: string
          research_summary:
            type: string
          sections:
            type: array
            items:
              type: string
            minItems: 4

    artifact:
      path: research/topic-research.json

    flow: [check_calendar, get_trends, web_search, scrape_competitors]

  # -------------------------------------------------------------------------
  # PHASE 4: Content Structure & Metadata
  # -------------------------------------------------------------------------

  - id: generate_outline
    description: "Generate detailed article outline"
    use:
      research: research_topics
    infer:
      prompt: |
        Create a detailed blog post outline based on this research:
        {{use.research | to_yaml}}

        The outline should have:
        - Compelling introduction hook
        - 4-5 main sections with subsections
        - Real-world examples for each section
        - Practical takeaways
        - Strong conclusion with CTA

        Target word count: {{inputs.target_word_count}}

        Format as Markdown with ## and ### headers.
    output:
      format: text

    artifact:
      path: outline/article-outline.md
      format: text

    flow: [research_topics]

  - id: generate_metadata
    description: "Generate SEO metadata"
    use:
      research: research_topics
      outline: generate_outline
    infer:
      prompt: |
        Based on research and outline, generate SEO metadata:

        RESEARCH: {{use.research | to_yaml}}
        OUTLINE PREVIEW: {{use.outline | truncate: 500}}

        Generate:
        1. SEO title (55-60 chars)
        2. Meta description (155-160 chars)
        3. Meta keywords (5-7 terms)
        4. OG description
        5. Twitter description

    output:
      format: json
      max_retries: 2
      schema:
        type: object
        required: [seo_title, meta_description, meta_keywords]
        properties:
          seo_title:
            type: string
            maxLength: 65
          meta_description:
            type: string
            maxLength: 165
          meta_keywords:
            type: array
            items:
              type: string
            minItems: 5
          og_description:
            type: string
          twitter_description:
            type: string

    artifact:
      path: metadata/seo-metadata.json

    flow: [research_topics, generate_outline]

  # -------------------------------------------------------------------------
  # PHASE 5: Article Writing
  # -------------------------------------------------------------------------

  - id: write_article
    description: "Multi-turn agent writes article with refinement"
    use:
      research: research_topics
      outline: generate_outline
      metadata: generate_metadata
    agent:
      prompt: |
        You are an expert technical content writer.

        Write a comprehensive blog post following this outline:
        {{use.outline}}

        RESEARCH CONTEXT:
        {{use.research | to_yaml}}

        SEO METADATA:
        {{use.metadata | to_yaml}}

        REQUIREMENTS:
        1. Follow outline structure exactly
        2. Use active voice, conversational tone with expert depth
        3. Include real-world examples and data
        4. Word count: {{inputs.target_word_count}}
        5. End with strong CTA

        Provide the final article in Markdown format.

      max_turns: 4
      extended_thinking: true
      thinking_budget: 8000

    output:
      format: text

    artifact:
      path: article/final-article.md
      format: text

    flow: [generate_outline, generate_metadata]

  # -------------------------------------------------------------------------
  # PHASE 6: Multi-Platform Content Adaptation
  # -------------------------------------------------------------------------

  - id: render_platforms
    description: "Adapt article for different platforms"
    use:
      article: write_article
      metadata: generate_metadata
    for_each:
      - name: blog
        format: markdown
        style: professional
      - name: twitter
        format: threads
        style: engaging
      - name: linkedin
        format: article
        style: thought-leadership
    as: platform
    concurrency: 3
    fail_fast: false
    error_handling: continue
    infer:
      prompt: |
        Adapt this blog article for {{platform.name}} platform:

        ARTICLE:
        {{use.article | truncate: 2000}}

        PLATFORM: {{platform.name}}
        FORMAT: {{platform.format}}
        STYLE: {{platform.style}}

    output:
      format: text

    artifact:
      path: platforms/{{platform.name}}.md
      format: text

    flow: [write_article]

  # -------------------------------------------------------------------------
  # PHASE 7: Quality Assurance
  # -------------------------------------------------------------------------

  - id: validate_content
    description: "Validate content quality and SEO"
    use:
      article: write_article
      platforms: render_platforms
      metadata: generate_metadata
    infer:
      prompt: |
        Perform comprehensive quality check:

        ARTICLE PREVIEW:
        {{use.article | truncate: 1000}}

        METADATA:
        {{use.metadata | to_yaml}}

        VALIDATION CHECKLIST:
        - Word count target met
        - All sections covered
        - Grammar/spelling correct
        - SEO optimized
        - CTAs present

        Return validation results.

    output:
      format: json
      max_retries: 1
      schema:
        type: object
        required: [overall_score, ready_to_publish, issues]
        properties:
          overall_score:
            type: integer
            minimum: 0
            maximum: 100
          seo_score:
            type: integer
          content_score:
            type: integer
          ready_to_publish:
            type: boolean
          critical_issues:
            type: array
            items:
              type: string
          issues:
            type: array
            items:
              type: string
          recommendations:
            type: array
            items:
              type: string

    artifact:
      path: validation/quality-report.json

    flow: [render_platforms]

  # -------------------------------------------------------------------------
  # PHASE 8: Publication Preparation
  # -------------------------------------------------------------------------

  - id: prepare_publication
    description: "Prepare final publication package"
    use:
      article: write_article
      metadata: generate_metadata
      validation: validate_content
    infer:
      prompt: |
        Create final publication package summary:

        ARTICLE: {{use.article | truncate: 500}}...
        METADATA: {{use.metadata | to_yaml}}
        VALIDATION: {{use.validation | to_yaml}}

        Return publication summary with status and next steps.

    output:
      format: json

    artifact:
      path: publication/package.json

    flow: [validate_content]

  - id: save_and_notify
    description: "Save content and generate report"
    use:
      package: prepare_publication
      validation: validate_content
    exec: |
      echo "=== BLOG CONTENT PIPELINE COMPLETE ==="
      echo "Quality Score: {{use.validation.overall_score}}/100"
      echo "Ready to Publish: {{use.validation.ready_to_publish}}"
      echo ""
      echo "Artifacts generated:"
      echo "  - research/topic-research.json"
      echo "  - outline/article-outline.md"
      echo "  - metadata/seo-metadata.json"
      echo "  - article/final-article.md"
      echo "  - platforms/{blog,twitter,linkedin}.md"
      echo "  - validation/quality-report.json"
      echo "  - publication/package.json"

    flow: [prepare_publication]
