# Brainstorm Agent Workflow
#
# Research-driven brainstorming agent that uses MCP tools
# to gather information before ideation.
#
# Pipeline: Research -> Brainstorm -> Refine
#
# Usage:
#   nika examples/brainstorm-agent.nika.yaml
#
# Requirements:
#   - ANTHROPIC_API_KEY
#   - PERPLEXITY_API_KEY
#   - FIRECRAWL_API_KEY

schema: "nika/workflow@0.10"
workflow: brainstorm-agent
description: "Research-driven brainstorming with web search and content analysis"

provider: claude
model: claude-sonnet-4-6

artifacts:
  dir: ./brainstorm/{{date}}
  format: json
  manifest: true

mcp:
  perplexity:
    command: npx
    args: ["-y", "@perplexity-ai/mcp-server"]

  firecrawl:
    command: npx
    args: ["-y", "firecrawl-mcp"]

inputs:
  topic:
    type: string
    description: "Brainstorming topic"
    default: "AI-powered QR code generation for marketing"

tasks:
  # ========================================================================
  # PHASE 1: Research & Discovery
  # ========================================================================

  - id: research
    description: "Gather context and research the topic"
    agent:
      prompt: |
        You are a research assistant preparing for a brainstorming session.

        TOPIC: {{inputs.topic}}

        INSTRUCTIONS:
        1. Use perplexity_search_web to find recent information about this topic
        2. If URLs are mentioned, use firecrawl_scrape to extract detailed content
        3. Synthesize your findings into a structured research brief

        When complete, output the JSON and say "RESEARCH_COMPLETE".

      mcp: [perplexity, firecrawl]
      max_turns: 10
      extended_thinking: true
      thinking_budget: 4000

    output:
      format: json
      schema:
        type: object
        required: [topic, key_findings, trends, opportunities]
        properties:
          topic:
            type: string
          key_findings:
            type: array
            items:
              type: string
            minItems: 3
          trends:
            type: array
            items:
              type: string
          competitors_or_examples:
            type: array
            items:
              type: string
          opportunities:
            type: array
            items:
              type: string
          sources:
            type: array
            items:
              type: string
      max_retries: 2

    artifact:
      path: research-brief.json

  # ========================================================================
  # PHASE 2: Ideation
  # ========================================================================

  - id: brainstorm
    description: "Generate ideas based on research"
    use:
      research: research
    infer:
      prompt: |
        Based on the following research brief, generate creative ideas.

        RESEARCH:
        {{use.research | to_yaml}}

        BRAINSTORMING RULES:
        1. Generate 5-7 distinct ideas
        2. For each idea, provide:
           - Name (catchy, memorable)
           - Description (2-3 sentences)
           - Why it works (based on research)
           - Implementation complexity (Low/Medium/High)
           - Potential impact (Low/Medium/High)
        3. Include at least one "wild card" unconventional idea
        4. Rank ideas by potential ROI

    output:
      format: json
      schema:
        type: object
        required: [session_topic, ideas]
        properties:
          session_topic:
            type: string
          ideas:
            type: array
            items:
              type: object
              required: [rank, name, description, rationale, complexity, impact]
              properties:
                rank:
                  type: integer
                  minimum: 1
                name:
                  type: string
                description:
                  type: string
                rationale:
                  type: string
                complexity:
                  type: string
                  enum: [Low, Medium, High]
                impact:
                  type: string
                  enum: [Low, Medium, High]
                is_wild_card:
                  type: boolean
            minItems: 5
            maxItems: 7
          recommended_next_steps:
            type: array
            items:
              type: string
      max_retries: 2

    artifact:
      path: brainstorm-ideas.json

    flow: [research]

  # ========================================================================
  # PHASE 3: Refinement
  # ========================================================================

  - id: refine
    description: "Deep dive on top idea"
    use:
      ideas: brainstorm
    infer:
      prompt: |
        Take the #1 ranked idea from the brainstorm and develop it further.

        BRAINSTORM RESULTS:
        {{use.ideas | to_yaml}}

        REFINEMENT TASKS:
        1. Expand the concept with specific features
        2. Identify potential challenges and mitigations
        3. Define success metrics
        4. Create a rough implementation timeline (phases, not dates)
        5. List required resources/skills

    output:
      format: json
      schema:
        type: object
        required: [idea_name, expanded_concept, key_features, challenges, success_metrics]
        properties:
          idea_name:
            type: string
          expanded_concept:
            type: string
          key_features:
            type: array
            items:
              type: string
            minItems: 3
          challenges:
            type: array
            items:
              type: object
              required: [challenge, mitigation]
              properties:
                challenge:
                  type: string
                mitigation:
                  type: string
          success_metrics:
            type: array
            items:
              type: string
          implementation_phases:
            type: array
            items:
              type: object
              required: [phase, deliverables]
              properties:
                phase:
                  type: string
                deliverables:
                  type: array
                  items:
                    type: string
          required_resources:
            type: array
            items:
              type: string
      max_retries: 2

    artifact:
      path: refined-idea.json

    flow: [brainstorm]
