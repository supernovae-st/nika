# Claude API Test Workflow
#
# Simple test to verify Anthropic/Claude API integration with Nika.
# This is the most basic workflow - one infer task with text output.
#
# Usage:
#   nika examples/claude-test.nika.yaml
#
# Requirements:
#   - ANTHROPIC_API_KEY environment variable

schema: "nika/workflow@0.10"
workflow: claude-test
description: "Test Claude API connectivity with a simple inference"

provider: claude
model: claude-sonnet-4-6

tasks:
  - id: hello_claude
    description: "Simple Claude API test"
    infer:
      prompt: "Say hello and tell me one fun fact about croissants. Keep it under 50 words."
    output:
      format: text
