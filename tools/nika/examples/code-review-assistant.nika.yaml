# Code Review Assistant Workflow
#
# A comprehensive code review system that analyzes git changes, fetches PR context,
# reviews files in parallel, and provides intelligent feedback with documentation references.
#
# Features:
# - exec: to retrieve git diff, changed files, commit history
# - fetch: to get PR metadata from GitHub API
# - invoke: with MCP to scrape documentation references
# - infer: to analyze code changes and generate comments
# - agent: for comprehensive multi-turn code review
# - for_each: parallel review of multiple files
#
# Usage:
#   export GITHUB_TOKEN=ghp_...
#   nika examples/code-review-assistant.nika.yaml
#
# Requirements:
#   - ANTHROPIC_API_KEY
#   - GITHUB_TOKEN (optional)
#   - FIRECRAWL_API_KEY (optional)

schema: "nika/workflow@0.10"
workflow: code-review-assistant
description: "Comprehensive code review with parallel file analysis"

provider: claude
model: claude-sonnet-4-6

artifacts:
  dir: ./reviews/{{date}}
  format: json
  manifest: true

mcp:
  firecrawl:
    command: npx
    args: ["-y", "firecrawl-mcp"]

tasks:
  # ============================================================================
  # PHASE 1: GIT ANALYSIS - Gather code changes
  # ============================================================================

  - id: changed_files
    description: "Get list of changed files"
    exec: |
      git diff --name-only origin/main..HEAD 2>/dev/null || \
      git diff --name-only HEAD~1..HEAD 2>/dev/null || \
      echo "src/main.rs\nsrc/lib.rs\ntests/integration.rs"
    output:
      format: text

  - id: diff_stats
    description: "Get diff statistics"
    exec: |
      git diff --stat origin/main..HEAD 2>/dev/null || \
      git diff --stat HEAD~1..HEAD 2>/dev/null || \
      echo "3 files changed, 245 insertions(+), 87 deletions(-)"
    output:
      format: text

  - id: commit_history
    description: "Get recent commit messages"
    exec: |
      git log --oneline -10 origin/main..HEAD 2>/dev/null || \
      git log --oneline -3 2>/dev/null || \
      echo "feat: add async support\nfix: resolve memory leak\nrefactor: simplify API"
    output:
      format: text

  - id: full_diff
    description: "Get full diff for analysis"
    exec: |
      git diff origin/main..HEAD 2>/dev/null || \
      git diff HEAD~1..HEAD 2>/dev/null || \
      cat /dev/null
    output:
      format: text

  # ============================================================================
  # PHASE 2: PR CONTEXT - Fetch GitHub PR metadata
  # ============================================================================

  - id: pr_metadata
    description: "Fetch PR metadata from GitHub API"
    exec: |
      if [ -z "$GITHUB_TOKEN" ]; then
        echo "Error: GITHUB_TOKEN environment variable not set" >&2
        echo '{"error":"GitHub token required","fallback":true}'
        exit 1
      fi
    catch:
      - then:
          infer:
            prompt: "GitHub API unavailable. Generate a placeholder PR context for demonstration."
    output:
      format: json

  - id: pr_context_text
    description: "Generate PR context summary"
    with:
      pr_meta: pr_metadata
    infer:
      prompt: |
        Based on this PR metadata (or use placeholder if not available):
        {{with.pr_meta}}

        Generate a brief context summary about what this PR is trying to accomplish.
        If metadata is unavailable, generate: "Code review for pull request with multiple file changes"
    output:
      format: text
    flow: [pr_metadata]

  # ============================================================================
  # PHASE 3: DOCUMENTATION LOOKUP
  # ============================================================================

  - id: documentation_refs
    description: "Scrape relevant documentation"
    invoke:
      server: firecrawl
      tool: firecrawl_scrape
      params:
        url: "https://rust-lang.org/learn"
        formats: ["markdown"]
    output:
      format: json

  # ============================================================================
  # PHASE 4: FILE-BY-FILE ANALYSIS
  # ============================================================================

  - id: parse_files
    description: "Parse changed files list into array"
    with:
      file_list: changed_files
    infer:
      prompt: |
        Parse this list of changed files into a JSON array of file paths:
        {{with.file_list}}

        Return ONLY a JSON array like: ["src/main.rs", "src/lib.rs", "tests/integration.rs"]
    output:
      format: json
    flow: [changed_files]

  - id: file_reviews
    description: "Review each file in parallel"
    with:
      files: parse_files
      diff: full_diff
      docs: documentation_refs
    for_each: "{{with.files}}"
    as: filepath
    concurrency: 5
    fail_fast: false
    catch:
      - on: error
        then:
          infer:
            prompt: "Failed to review {{with.filepath}}. Generate placeholder review highlighting the error."
    infer:
      prompt: |
        Review this specific file: {{with.filepath}}

        Code diff for context:
        {{with.diff}}

        Documentation reference:
        {{with.docs}}

        Provide a focused code review for {{with.filepath}} covering:
        1. **Correctness** - Logic errors, edge cases, unsafe patterns
        2. **Performance** - Algorithmic complexity, allocations, locking
        3. **Style** - Naming, structure, consistency with Rust conventions
        4. **Testing** - Missing tests, edge case coverage
        5. **Documentation** - Missing comments, unclear intent

        Be specific with line numbers and examples.
    output:
      format: text
    flow: [parse_files, full_diff, documentation_refs]

  # ============================================================================
  # PHASE 5: COMPREHENSIVE REVIEW
  # ============================================================================

  - id: comprehensive_review
    description: "Agent-driven comprehensive review"
    with:
      files_reviewed: file_reviews
      diff_stats: diff_stats
      commits: commit_history
      pr_context: pr_context_text
      full_diff: full_diff
    catch:
      - on: timeout
        then:
          infer:
            prompt: |
              The comprehensive review timed out. Generate a placeholder review summarizing
              the key points from individual file reviews and diff stats.
      - on: error
        then:
          infer:
            prompt: |
              An error occurred during comprehensive review. Generate a summary based on
              available data: diff stats, commits, and file reviews.
    agent:
      prompt: |
        You are an expert code reviewer. Analyze the provided code changes and generate
        a comprehensive pull request review.

        CHANGES SUMMARY:
        {{with.diff_stats}}

        COMMIT MESSAGES:
        {{with.commits}}

        PR CONTEXT:
        {{with.pr_context}}

        INDIVIDUAL FILE REVIEWS:
        {{with.files_reviewed}}

        TASK:
        1. Synthesize insights from individual file reviews
        2. Identify cross-file issues (consistency, coupling, design)
        3. Assess architectural impact
        4. Provide overall quality score (0-100)
        5. List top 3 must-fix items and 3 nice-to-have improvements

        Say "REVIEW_COMPLETE" when done.

      max_turns: 8

    output:
      format: json
      schema:
        type: object
        required: [summary, quality_score, critical_issues, suggestions]
        properties:
          summary:
            type: string
            maxLength: 500
          quality_score:
            type: integer
            minimum: 0
            maximum: 100
          critical_issues:
            type: array
            items:
              type: object
              required: [issue, severity, file]
              properties:
                issue:
                  type: string
                severity:
                  type: string
                  enum: [critical, high, medium, low]
                file:
                  type: string
          suggestions:
            type: array
            items:
              type: string
          testing_recommendations:
            type: array
            items:
              type: string
          documentation_updates:
            type: array
            items:
              type: string
      max_retries: 2

    artifact:
      path: comprehensive-review.json

    flow: [file_reviews, diff_stats, commit_history, pr_context_text]

  # ============================================================================
  # PHASE 6: SUMMARY & OUTPUT
  # ============================================================================

  - id: review_report
    description: "Generate final review report"
    with:
      comprehensive: comprehensive_review
      files: parse_files
      diff_info: diff_stats
    exec: |
      cat << 'EOF'
      ================================================================================
                              CODE REVIEW REPORT
      ================================================================================

      FILES ANALYZED:
      {{with.files}}

      CHANGES:
      {{with.diff_info}}

      ================================================================================
                          COMPREHENSIVE REVIEW
      ================================================================================

      {{with.comprehensive | to_yaml}}

      ================================================================================
                            END OF REVIEW REPORT
      ================================================================================
      EOF
    output:
      format: text

    artifact:
      path: review-report.txt
      format: text

    flow: [comprehensive_review]
