# ============================================================================
# COMPARISON: v0.5 (Current) vs v0.6 (Proposed)
# ============================================================================
#
# This file shows side-by-side comparison of current workarounds
# vs proposed clean syntax.
#
# ============================================================================

# ============================================================================
# CURRENT v0.5 — With Workarounds
# ============================================================================

schema: "nika/workflow@0.5"
workflow: content-pipeline-v05
description: "Current v0.5 with workarounds for file loading"

# No memory: field — must use exec: to load files
# No agents: field — must define inline every time
# No skills: field — must copy system prompts

mcp:
  novanet:
    command: cargo
    args: [run, -p, novanet-mcp]
    env:
      NOVANET_MCP_NEO4J_URI: bolt://localhost:7687

  perplexity:
    command: npx
    args: [-y, "@anthropic/perplexity-mcp"]

tasks:
  # --------------------------------------------------------------------------
  # WORKAROUND: Load brand.md via exec (ugly)
  # --------------------------------------------------------------------------
  - id: load_brand
    exec: "cat ./context/brand.md"

  # --------------------------------------------------------------------------
  # WORKAROUND: Load persona.json via exec
  # --------------------------------------------------------------------------
  - id: load_persona
    exec: "cat ./context/persona.json"

  # --------------------------------------------------------------------------
  # WORKAROUND: Agent defined inline (not reusable)
  # --------------------------------------------------------------------------
  - id: research
    agent:
      # System prompt copied every time (not DRY)
      system: |
        You are a research specialist focused on market intelligence.
        Always cite sources with URLs.
        Prefer recent information.
        Cross-reference multiple sources.
      prompt: |
        Research SEO trends for QR Code AI.

        Brand context (from file):
        {{use.load_brand}}
      provider: claude
      model: claude-sonnet-4-6
      mcp:
        - perplexity
      max_turns: 10

  # --------------------------------------------------------------------------
  # WORKAROUND: Another agent, repeat system prompt
  # --------------------------------------------------------------------------
  - id: write_content
    agent:
      # SEO skill instructions copied inline (not DRY)
      system: |
        You are a content writer.
        Follow SEO best practices:
        - Include primary keyword in title
        - Use primary keyword in first 100 words
        - Keyword density: 1-2%
        [... 50 more lines copied every time ...]
      prompt: |
        Write landing page content.

        Research: {{use.research}}
        Brand: {{use.load_brand}}
        Persona: {{use.load_persona}}
      provider: claude
      model: claude-sonnet-4-6
      max_turns: 5

flows:
  - source: load_brand
    target: research
  - source: load_persona
    target: write_content
  - source: research
    target: write_content

# ============================================================================
# PROBLEMS WITH v0.5:
# ============================================================================
#
# 1. FILE LOADING:
#    - Must use exec: "cat ./file" for each file
#    - Creates extra tasks just for loading
#    - No type parsing (JSON stays as string)
#    - No glob patterns
#
# 2. AGENT REUSE:
#    - System prompts copied in every workflow
#    - No inheritance or composition
#    - Changes require updating multiple files
#
# 3. SKILLS:
#    - No way to share methodology across agents
#    - SEO rules copied everywhere
#    - No versioning or modularity
#
# 4. SESSION MEMORY:
#    - No way to restore previous context
#    - Each workflow starts fresh
#    - No cross-workflow learning
#
# ============================================================================


