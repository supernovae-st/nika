# ============================================================================
# BENEFITS OF v0.6:
# ============================================================================
#
# 1. FILE LOADING:
#    ✓ Declarative memory: block
#    ✓ Type inference (md→string, json→object)
#    ✓ Glob patterns for multiple files
#    ✓ Session restoration
#
# 2. AGENT REUSE:
#    ✓ External .agent.yaml files
#    ✓ use: reference instead of copy
#    ✓ Inheritance with inherit: base
#    ✓ Versioned agent definitions
#
# 3. SKILLS:
#    ✓ External .skill.yaml files
#    ✓ Composable: skill: [a, b, c]
#    ✓ System prompt augmentation
#    ✓ Validation rules
#
# 4. SESSION MEMORY:
#    ✓ Restore from previous runs
#    ✓ Cross-workflow context
#    ✓ Future: long-term memory with embeddings
#
# ============================================================================
