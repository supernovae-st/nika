schema: nika/workflow@0.5
workflow: competitor-intelligence
description: |
  Comprehensive competitor intelligence analysis workflow.
  Analyzes 3-4 competitors across multiple dimensions:
  - Local database checks with timestamps
  - Social media metrics and engagement
  - Website content via Firecrawl
  - News and market intelligence via Perplexity
  - Strategic positioning and pricing analysis
  - Actionable recommendations for product strategy

  Target audience: Product managers, strategists, business development.
  Execution: Fan-out (parallel competitor analysis) + Fan-in (synthesis + agent recommendations).

provider: claude
model: claude-sonnet-4-6

mcp:
  firecrawl:
    command: npx
    args: ["-y", "@firecrawl/mcp"]
    env:
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}

  perplexity:
    command: npx
    args: ["-y", "perplexity-mcp"]
    env:
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}

tasks:
  # PHASE 1: DATA INGESTION & INITIAL CHECKS
  # ==========================================

  # Step 1: Check local competitor database for cached data and timestamps
  - id: check_competitor_db
    exec: |
      # Read from local SQLite competitor database (or JSON file fallback)
      sqlite3 competitors.db "SELECT id, name, website, last_updated FROM competitors WHERE active=1 LIMIT 4" 2>/dev/null || echo '[{"id": 1, "name": "Competitor A", "website": "compa.com", "last_updated": "2026-02-20"}, {"id": 2, "name": "Competitor B", "website": "compb.io", "last_updated": "2026-02-19"}, {"id": 3, "name": "Competitor C", "website": "compc.dev", "last_updated": "2026-02-18"}, {"id": 4, "name": "Competitor D", "website": "compd.ai", "last_updated": "2026-02-15"}]'

  # Step 2: Extract competitor list for parallel analysis
  - id: extract_competitors
    use:
      db_results: check_competitor_db
    infer:
      prompt: |
        Parse this competitor database output and normalize into a clean JSON array.
        Each entry must have: id, name, website, last_updated (ISO date).

        Database output:
        {{use.db_results}}

        Return ONLY valid JSON array, no markdown, no explanation.
      model: claude-sonnet-4-6
    output:
      format: json

  # PHASE 2: PARALLEL COMPETITOR DATA COLLECTION (FAN-OUT)
  # =======================================================

  # Step 3: Collect website content for each competitor in parallel
  - id: scrape_websites
    use:
      competitors: extract_competitors
    for_each: "{{use.competitors}}"
    as: competitor
    concurrency: 4
    fail_fast: false
    invoke:
      server: firecrawl
      tool: scrape
      params:
        url: "https://{{use.competitor.website}}"
        formats: ["markdown", "links"]
        onlyMainContent: true
    output:
      format: json

  # Step 4: Fetch social media metrics via HTTP calls (parallel)
  - id: fetch_social_metrics
    use:
      competitors: extract_competitors
    for_each: "{{use.competitors}}"
    as: competitor
    concurrency: 4
    fail_fast: false
    fetch:
      url: "https://api.socialblade.com/api/v2/search?query={{use.competitor.name}}&type=channel"
      method: GET
      headers:
        Accept: "application/json"
    output:
      format: json

  # Step 5: Get stock price data for public competitors (parallel)
  - id: fetch_stock_prices
    use:
      competitors: extract_competitors
    for_each: "{{use.competitors}}"
    as: competitor
    concurrency: 4
    fail_fast: false
    fetch:
      url: "https://api.example.com/stock/quote?ticker={{use.competitor.ticker | default: 'N/A'}}"
      method: GET
      headers:
        Authorization: "Bearer ${STOCK_API_KEY}"
    output:
      format: json

  # Step 6: Search news and announcements for each competitor via Perplexity (parallel)
  - id: search_competitor_news
    use:
      competitors: extract_competitors
    for_each: "{{use.competitors}}"
    as: competitor
    concurrency: 4
    fail_fast: false
    invoke:
      server: perplexity
      tool: search_web
      params:
        query: "{{use.competitor.name}} product release announcement funding news 2025 2026"
        max_results: 5
    output:
      format: json

  # PHASE 3: COMPETITIVE ANALYSIS & POSITIONING (CONVERGENCE POINTS)
  # ==================================================================

  # Step 7: Analyze website content and extract positioning for each competitor
  - id: analyze_positioning
    use:
      website_content: scrape_websites
      news_results: search_competitor_news
      competitors: extract_competitors
    infer:
      prompt: |
        Analyze competitor positioning based on website content and news coverage.

        For each competitor in the original list, extract:
        1. Core value proposition (in one sentence)
        2. Target market segments
        3. Primary product features (top 5)
        4. Pricing strategy (free tier, subscription, enterprise)
        5. Key partnerships or integrations
        6. Recent announcements or pivots (from news)
        7. Marketing positioning (enterprise, SMB, developer-focused, etc.)

        Website content:
        {{use.website_content | to_json}}

        News data:
        {{use.news_results | to_json}}

        Return a JSON object with competitor_positioning: [array of competitor analysis].
      model: claude-sonnet-4-6
    output:
      format: json

  # Step 8: Extract and compare pricing models
  - id: analyze_pricing
    use:
      website_content: scrape_websites
      positioning: analyze_positioning
    infer:
      prompt: |
        Extract pricing information from competitor websites and create a comparison matrix.

        For each competitor:
        1. List all pricing tiers
        2. Core features included in each tier
        3. Price per month/year
        4. Contract terms (monthly, annual, custom)
        5. Free trial availability
        6. Enterprise/custom pricing notes
        7. Price comparison vs market average

        Website content:
        {{use.website_content | to_json}}

        Positioning analysis:
        {{use.positioning | to_json}}

        Return JSON: { competitors: [{ name, pricing_tiers: [...], value_score, competitive_position }] }
      model: claude-sonnet-4-6
    output:
      format: json

  # Step 9: Analyze market sentiment and social engagement
  - id: analyze_market_sentiment
    use:
      social_metrics: fetch_social_metrics
      news_results: search_competitor_news
      positioning: analyze_positioning
    infer:
      prompt: |
        Analyze market sentiment and social engagement patterns for competitors.

        Extract for each competitor:
        1. Social media follower growth trend (if available)
        2. Engagement rate (likes, comments, shares per post)
        3. Sentiment from news coverage (positive, neutral, negative)
        4. Community size and activity level
        5. Recent major announcements (funding, partnerships, product launches)
        6. Customer sentiment indicators
        7. Brand momentum assessment (growing, stable, declining)

        Social metrics data:
        {{use.social_metrics | to_json}}

        News data:
        {{use.news_results | to_json}}

        Market positioning:
        {{use.positioning | to_json}}

        Return JSON: { sentiment_analysis: [{ competitor, brand_momentum, community_size, sentiment_score, key_signals }] }
      model: claude-sonnet-4-6
    output:
      format: json

  # PHASE 4: STRATEGIC SYNTHESIS & RECOMMENDATIONS (FAN-IN)
  # ========================================================

  # Step 10: Synthesize all competitive intelligence into unified view
  - id: synthesize_intelligence
    use:
      competitors: extract_competitors
      positioning: analyze_positioning
      pricing: analyze_pricing
      sentiment: analyze_market_sentiment
      websites: scrape_websites
      stock_data: fetch_stock_prices
    infer:
      prompt: |
        Create a comprehensive competitive intelligence summary synthesizing all analysis.

        Structure:
        1. MARKET LANDSCAPE
           - Number of active competitors, market consolidation trends
           - Average pricing, feature parity assessment
           - Market segments and positioning clusters

        2. DIRECT COMPETITORS
           For each competitor:
           - Name, market position, target segments
           - Key strengths and weaknesses
           - Pricing vs value proposition alignment
           - Recent momentum indicators
           - Estimated market share (if quantifiable)

        3. COMPETITIVE THREATS
           - Who is gaining market share
           - New market entrants or pivots
           - Features they have that we lack
           - Partnerships or integrations expanding their reach

        4. MARKET OPPORTUNITIES
           - Underserved segments
           - Features missing from all competitors
           - Positioning gaps we can exploit
           - Pricing opportunities

        5. TECHNOLOGY & INNOVATION
           - Technology stacks observed
           - Innovation velocity (based on feature releases)
           - Open source or community advantage potential

        Input data:
        Competitor list: {{use.competitors | to_json}}
        Positioning: {{use.positioning | to_json}}
        Pricing: {{use.pricing | to_json}}
        Sentiment: {{use.sentiment | to_json}}
        Stock data: {{use.stock_data | to_json}}

        Return structured markdown analysis, scannable with clear sections.
      model: claude-sonnet-4-6
    output:
      format: text

  # Step 11: Generate strategic recommendations via agent
  - id: strategic_recommendations_agent
    use:
      intelligence: synthesize_intelligence
      positioning: analyze_positioning
      pricing: analyze_pricing
      sentiment: analyze_market_sentiment
      competitors: extract_competitors
    agent:
      prompt: |
        You are a senior product strategy consultant analyzing our competitive landscape.

        Your task: Synthesize competitive intelligence into 7-10 strategic recommendations
        that our product team should act on in the next quarter.

        You have access to:
        - Comprehensive competitive intelligence summary
        - Detailed competitor positioning analysis
        - Pricing comparison matrix
        - Market sentiment and brand momentum
        - List of active competitors

        For each recommendation:
        1. State the opportunity or risk clearly
        2. Provide evidence from competitive analysis
        3. Specify the business impact (revenue growth, customer retention, market share)
        4. Recommend specific actions our product team should take
        5. Estimate implementation effort (1-3 weeks, 1 month, 1-2 quarters)
        6. Identify the target customer segment and use case
        7. Explain why competitors haven't addressed this yet

        Structure your recommendations as:
        - CATEGORY (Product, Pricing, Market, Partnerships)
        - PRIORITY (Critical, High, Medium)
        - TIMELINE (Immediate, This Quarter, This Year)

        Additional context you may analyze:
        - Are there features all competitors offer that we're missing?
        - Where can we differentiate beyond feature parity?
        - What pricing model creates the most customer value?
        - What market segments are underserved?
        - What are competitors likely to do next (predict 2-3 moves ahead)?

        Competitive Intelligence Summary:
        {{use.intelligence}}

        Competitor Positioning:
        {{use.positioning | to_json}}

        Pricing Analysis:
        {{use.pricing | to_json}}

        Market Sentiment:
        {{use.sentiment | to_json}}

        Competitor List:
        {{use.competitors | to_json}}

      max_turns: 8
      depth_limit: 1
      mcp: []
    output:
      format: text

  # PHASE 5: FINAL REPORT GENERATION & EXPORT
  # ==========================================

  # Step 12: Generate executive summary
  - id: executive_summary
    use:
      recommendations: strategic_recommendations_agent
      intelligence: synthesize_intelligence
      positioning: analyze_positioning
    infer:
      prompt: |
        Create a 1-page EXECUTIVE SUMMARY from the strategic recommendations and intelligence.

        Format:
        - HEADLINE (one sentence, e.g., "3 immediate product opportunities identified to capture $Xm market share")
        - KEY FINDINGS (3-4 bullet points, most critical insights)
        - TOP 3 RECOMMENDATIONS (prioritized, with business impact)
        - NEXT STEPS (what the team should do this week)

        Keep under 300 words. Audience: C-suite executives.

        Strategic recommendations:
        {{use.recommendations}}

        Intelligence summary:
        {{use.intelligence}}

        Competitor positioning:
        {{use.positioning | to_json}}

      model: claude-sonnet-4-6
    output:
      format: text

  # Step 13: Save complete analysis to file
  - id: save_analysis
    use:
      intelligence: synthesize_intelligence
      recommendations: strategic_recommendations_agent
      summary: executive_summary
    exec: |
      mkdir -p competitor_reports
      TIMESTAMP=$(date +%Y%m%d_%H%M%S)
      REPORT_FILE="competitor_reports/competitive_analysis_${TIMESTAMP}.md"

      cat > "$REPORT_FILE" << 'EOF'
      # Competitive Intelligence Report
      Generated: {{TIMESTAMP}}

      ## Executive Summary
      {{use.summary}}

      ## Full Competitive Intelligence
      {{use.intelligence}}

      ## Strategic Recommendations
      {{use.recommendations}}

      ---
      Report generated by Nika Competitor Intelligence Workflow v1.0
      EOF

      echo "=== COMPETITIVE INTELLIGENCE REPORT GENERATED ==="
      echo "Report saved: $REPORT_FILE"
      echo "File size: $(wc -c < "$REPORT_FILE") bytes"
      echo "Analysis complete. Ready for strategy session."

  # Step 14: Generate quick reference card for team meeting
  - id: quick_reference
    use:
      positioning: analyze_positioning
      recommendations: strategic_recommendations_agent
      pricing: analyze_pricing
    infer:
      prompt: |
        Create a ONE-PAGE quick reference card that the product team can print and reference.

        Format (max 35 lines):
        - Top 3 Competitors (name, main positioning, key strength, pricing)
        - Market Size Estimate
        - Top 3 Differentiation Opportunities
        - Top 3 Product Roadmap Priorities
        - Top 3 Pricing Opportunities
        - Estimated Implementation Effort for Each
        - Key Metrics to Monitor
        - Next Review Date (suggested: 30 days)

        Be scannable, use tables where helpful, no filler.

        Input data:
        {{use.positioning | to_json}}
        {{use.recommendations}}
        {{use.pricing | to_json}}

      model: claude-sonnet-4-6
    output:
      format: text

  # Step 15: Save quick reference
  - id: save_quick_reference
    use:
      quick_ref: quick_reference
    exec: |
      mkdir -p competitor_reports
      TIMESTAMP=$(date +%Y%m%d_%H%M%S)
      QR_FILE="competitor_reports/quick_ref_${TIMESTAMP}.txt"
      echo "{{use.quick_ref}}" > "$QR_FILE"
      echo "Quick reference saved: $QR_FILE"

# EXECUTION GRAPH - FAN-OUT / FAN-IN PATTERN
# =============================================
flows:
  # Phase 1: Data collection setup
  - source: check_competitor_db
    target: extract_competitors

  # Phase 2: Parallel data collection (FAN-OUT)
  - source: extract_competitors
    target: scrape_websites
  - source: extract_competitors
    target: fetch_social_metrics
  - source: extract_competitors
    target: fetch_stock_prices
  - source: extract_competitors
    target: search_competitor_news

  # Phase 3: Analysis (convergence points)
  - source: scrape_websites
    target: analyze_positioning
  - source: search_competitor_news
    target: analyze_positioning

  - source: scrape_websites
    target: analyze_pricing

  - source: fetch_social_metrics
    target: analyze_market_sentiment
  - source: search_competitor_news
    target: analyze_market_sentiment

  # Phase 4: Strategic synthesis (FAN-IN to unified view)
  - source: analyze_positioning
    target: synthesize_intelligence
  - source: analyze_pricing
    target: synthesize_intelligence
  - source: analyze_market_sentiment
    target: synthesize_intelligence
  - source: fetch_stock_prices
    target: synthesize_intelligence
  - source: scrape_websites
    target: synthesize_intelligence

  # Phase 5: Agent orchestration
  - source: synthesize_intelligence
    target: strategic_recommendations_agent
  - source: analyze_positioning
    target: strategic_recommendations_agent
  - source: analyze_pricing
    target: strategic_recommendations_agent
  - source: analyze_market_sentiment
    target: strategic_recommendations_agent

  # Phase 6: Final output generation
  - source: strategic_recommendations_agent
    target: executive_summary
  - source: synthesize_intelligence
    target: executive_summary
  - source: analyze_positioning
    target: executive_summary

  - source: strategic_recommendations_agent
    target: quick_reference
  - source: analyze_positioning
    target: quick_reference
  - source: analyze_pricing
    target: quick_reference

  # Phase 7: Report export
  - source: executive_summary
    target: save_analysis
  - source: synthesize_intelligence
    target: save_analysis
  - source: strategic_recommendations_agent
    target: save_analysis

  - source: quick_reference
    target: save_quick_reference
