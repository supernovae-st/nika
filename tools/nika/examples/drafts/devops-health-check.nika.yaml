schema: nika/workflow@0.5
workflow: devops-health-check
description: Comprehensive DevOps health check with system metrics, monitoring APIs, CVE detection, and anomaly analysis

mcp:
  perplexity:
    command: npx
    args:
      - -y
      - "perplexity-mcp"
    env:
      PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY}"

tasks:
  # ============================================================================
  # PHASE 1: INFRASTRUCTURE STATUS (exec: verbs)
  # ============================================================================

  - id: check_docker_status
    exec: "docker ps --format json | jq -r '.[] | {ID: .ID, Image: .Image, Status: .Status}' | head -20 || echo '[]'"

  - id: check_disk_usage
    exec: "df -h / | tail -n1 | awk '{print {\"filesystem\": $1, \"size\": $2, \"used\": $3, \"available\": $4, \"percent\": $5}}' || echo '{}'"

  - id: check_memory_usage
    exec: "free -h | grep Mem | awk '{print {\"total\": $2, \"used\": $3, \"available\": $7}}' || echo '{}'"

  - id: check_cpu_load
    exec: "uptime | sed 's/.*load average: //' | awk -F, '{print {\"1min\": $1, \"5min\": $2, \"15min\": $3}}' || echo '{}'"

  # ============================================================================
  # PHASE 2: MONITORING & OBSERVABILITY (fetch: verbs to httpbin)
  # ============================================================================

  - id: check_monitoring_endpoints
    for_each:
      - {"name": "prometheus", "endpoint": "http://localhost:9090/-/ready"}
      - {"name": "grafana", "endpoint": "http://localhost:3000/api/health"}
      - {"name": "alertmanager", "endpoint": "http://localhost:9093/-/healthy"}
    as: monitor
    concurrency: 3
    fail_fast: false
    fetch:
      url: "{{use.monitor.endpoint}}"
      method: GET
      timeout: 5000

  - id: aggregate_monitoring_status
    use:
      endpoints: check_monitoring_endpoints
    infer: |
      Analyze these monitoring endpoint responses: {{use.endpoints}}

      For each endpoint, determine:
      1. HTTP status (200 = healthy, else = problem)
      2. Response time (fast = <100ms, slow = >1s)
      3. Overall health verdict

      Format as JSON with keys: name, status, response_time, healthy

  # ============================================================================
  # PHASE 3: SECURITY & CVE CHECK (invoke: MCP to Perplexity)
  # ============================================================================

  - id: detect_cve_threats
    for_each:
      - "Rust tokio CVE 2024 2025"
      - "Docker security vulnerabilities 2025"
      - "Kubernetes CVE critical 2025"
      - "Node.js npm packages security"
    as: cve_query
    concurrency: 2
    fail_fast: false
    invoke:
      server: perplexity
      tool: perplexity_search_web
      params:
        query: "{{use.cve_query}} critical vulnerability"
        num_results: 3

  - id: aggregate_cve_findings
    use:
      cve_results: detect_cve_threats
    infer: |
      Based on these CVE search results: {{use.cve_results}}

      Extract critical information:
      - Any CRITICAL or HIGH severity CVEs found
      - Affected components in our stack (Rust, Docker, K8s, Node.js)
      - Recommended immediate actions
      - CVE references (CVE-YYYY-XXXX format)

      Format as JSON with keys: severity, affected_components, cves, actions

  # ============================================================================
  # PHASE 4: LOG ANALYSIS & ANOMALY DETECTION (infer: verb)
  # ============================================================================

  - id: extract_recent_logs
    exec: "journalctl --no-pager -n 100 2>/dev/null | tail -50 || echo 'No logs available'"

  - id: analyze_logs_for_anomalies
    use:
      logs: extract_recent_logs
      docker: check_docker_status
      memory: check_memory_usage
      disk: check_disk_usage
    infer: |
      Analyze these system logs and metrics for anomalies:

      Recent logs:
      {{use.logs}}

      Docker containers:
      {{use.docker}}

      Memory usage:
      {{use.memory}}

      Disk usage:
      {{use.disk}}

      Identify:
      1. Error patterns (repeated errors, crash loops)
      2. Performance anomalies (memory leaks, high disk growth)
      3. Container health issues (restart loops, exit codes)
      4. Resource exhaustion warnings
      5. Security-relevant events (authentication failures, unauthorized access)

      Rate severity: CRITICAL, HIGH, MEDIUM, LOW
      Format as JSON with keys: anomalies[], each with {description, severity, source, recommendation}

  # ============================================================================
  # PHASE 5: COMPREHENSIVE INCIDENT ORCHESTRATION (agent: verb)
  # ============================================================================

  - id: incident_orchestrator
    use:
      monitoring: aggregate_monitoring_status
      cve_risks: aggregate_cve_findings
      anomalies: analyze_logs_for_anomalies
      cpu_load: check_cpu_load
      docker_status: check_docker_status
    agent:
      prompt: |
        You are a senior DevOps engineer creating a comprehensive incident report.

        Analyze this infrastructure health data:

        **Monitoring Status:**
        {{use.monitoring}}

        **CVE & Security Threats:**
        {{use.cve_risks}}

        **System Anomalies:**
        {{use.anomalies}}

        **CPU Load:**
        {{use.cpu_load}}

        **Docker Containers:**
        {{use.docker_status}}

        Your tasks:
        1. **Severity Assessment**: Classify overall infrastructure health (GREEN/YELLOW/RED)
        2. **Root Cause Analysis**: For each HIGH/CRITICAL issue, identify root cause
        3. **Incident Triage**: Group related issues into incidents
        4. **Immediate Actions**: List critical steps for SREs to take NOW
        5. **Follow-up Tasks**: Create GitHub issues for each incident
        6. **Escalation Path**: Determine if on-call engineer needs notification

        Format your response as a structured incident report with these sections:
        - HEALTH_VERDICT: GREEN/YELLOW/RED with 1-line justification
        - INCIDENTS: List each incident with ID, severity, services affected
        - IMMEDIATE_ACTIONS: Numbered list of critical steps
        - GITHUB_ISSUES: Template for GitHub issues to create
        - ESCALATION_NEEDED: true/false and escalation criteria
        - PREVENTION: Recommendations to prevent recurrence

        End with "REPORT_COMPLETE" when done.
      mcp:
        - perplexity
      max_turns: 6
      model: claude-sonnet-4-6

  # ============================================================================
  # PHASE 6: STRUCTURED OUTPUT (final transformation)
  # ============================================================================

  - id: format_json_report
    use:
      incident_report: incident_orchestrator
      monitoring: aggregate_monitoring_status
      cve: aggregate_cve_findings
      anomalies: analyze_logs_for_anomalies
      docker: check_docker_status
      disk: check_disk_usage
      memory: check_memory_usage
      cpu: check_cpu_load
    infer: |
      Convert this incident report into structured JSON format for integration:

      {{use.incident_report}}

      Create a JSON object with exactly this schema:
      {
        "health_check_id": "hc-<timestamp>",
        "timestamp": "ISO-8601",
        "overall_health": "GREEN|YELLOW|RED",
        "health_score": 0-100,
        "summary": "1-2 sentence executive summary",
        "sections": {
          "infrastructure": {
            "docker_containers": "count of running containers",
            "disk_usage": {{use.disk}},
            "memory_usage": {{use.memory}},
            "cpu_load": {{use.cpu}}
          },
          "monitoring": {{use.monitoring}},
          "security": {
            "cve_threats": {{use.cve}},
            "requires_immediate_attention": boolean
          },
          "anomalies": {{use.anomalies}},
          "incidents": [
            {
              "id": "INC-001",
              "title": "string",
              "severity": "CRITICAL|HIGH|MEDIUM|LOW",
              "description": "string",
              "services_affected": ["service1", "service2"],
              "root_cause": "string",
              "immediate_actions": ["action1", "action2"]
            }
          ]
        },
        "recommendations": {
          "immediate": ["action1", "action2"],
          "follow_up": ["task1", "task2"],
          "github_issues": [
            {
              "title": "string",
              "body": "string",
              "labels": ["devops", "incident"],
              "priority": "P1|P2|P3"
            }
          ]
        },
        "escalation": {
          "needed": boolean,
          "criteria": "string",
          "on_call_team": "string"
        }
      }

      Validate all JSON syntax is correct and parseable.

  - id: save_health_report
    use:
      report: format_json_report
    exec: |
      cat > /tmp/devops-health-report-$(date +%s).json << 'EOF'
      {{use.report}}
      EOF
      echo "Health check report saved"

flows:
  # Infrastructure phase
  - source: check_docker_status
    target: check_disk_usage
  - source: check_disk_usage
    target: check_memory_usage
  - source: check_memory_usage
    target: check_cpu_load

  # Monitoring phase
  - source: check_cpu_load
    target: check_monitoring_endpoints
  - source: check_monitoring_endpoints
    target: aggregate_monitoring_status

  # Security phase
  - source: aggregate_monitoring_status
    target: detect_cve_threats
  - source: detect_cve_threats
    target: aggregate_cve_findings

  # Analysis phase
  - source: aggregate_cve_findings
    target: extract_recent_logs
  - source: extract_recent_logs
    target: analyze_logs_for_anomalies

  # Orchestration phase
  - source: analyze_logs_for_anomalies
    target: incident_orchestrator

  # Output phase
  - source: incident_orchestrator
    target: format_json_report
  - source: format_json_report
    target: save_health_report
