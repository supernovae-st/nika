# Test: Agent with temperature control
# Tests the temperature parameter for creativity control
# Run with: nika examples/test-agent-temperature.nika.yaml

schema: "nika/workflow@0.5"
provider: mock

tasks:
  # Note: temperature is a proposed feature not yet in schema
  - id: creative_agent
    agent:
      prompt: "Generate a creative and unique tagline for QR Code AI"
      # temperature: 0.9  # Proposed - not yet supported
      max_turns: 2
    output:
      format: json

  - id: precise_agent
    agent:
      prompt: "Generate a professional and precise tagline for QR Code AI"
      # temperature: 0.1  # Proposed - not yet supported
      max_turns: 2
    output:
      format: json

  - id: compare
    use:
      creative: creative_agent
      precise: precise_agent
    exec: "echo 'Creative: {{use.creative}} | Precise: {{use.precise}}' | head -c 200"

flows:
  - source: creative_agent
    target: compare
  - source: precise_agent
    target: compare
