# CI/CD Pipeline with Parallel Stages
# Demonstrates: for_each parallelism, quality gates, dependency chains, stop conditions
#
# This workflow implements a production-grade CI/CD pipeline with:
# - Parallel test execution across multiple suites
# - Coverage and mutation testing gates
# - Artifact generation and deployment
# - Rollback on failure
#
# v0.14 features: for_each, output validation
schema: nika/workflow@0.10

workflow: ci-cd-pipeline
description: |
  Production CI/CD pipeline with parallel testing, quality gates,
  and automated deployment. Demonstrates advanced DAG patterns.

context:
  files:
    ci_config: ./.nika/context/ci-config.yaml
    deploy_targets: ./.nika/context/deploy-targets.json

tasks:
  # ════════════════════════════════════════════════════════════════════
  # STAGE 1: Build & Static Analysis (Parallel)
  # ════════════════════════════════════════════════════════════════════

  - id: checkout
    exec: "git fetch origin && git checkout $COMMIT_SHA"
    output:
      use.commit_info: result

  - id: install_deps
    exec: "pnpm install --frozen-lockfile"
    flow: [checkout]

  - id: lint
    exec: "pnpm lint --format json"
    flow: [install_deps]
    output:
      use.lint_results: result
      format: json

  - id: typecheck
    exec: "pnpm typecheck --json"
    flow: [install_deps]
    output:
      use.typecheck_results: result
      format: json

  - id: audit_deps
    exec: "pnpm audit --json"
    flow: [install_deps]
    output:
      use.audit_results: result
      format: json

  # ════════════════════════════════════════════════════════════════════
  # STAGE 2: Parallel Test Execution
  # ════════════════════════════════════════════════════════════════════

  - id: run_tests
    for_each: ["unit", "integration", "e2e"]
    as: test_suite
    concurrency: 3
    fail_fast: false
    exec: "pnpm test:{{use.test_suite}} --coverage --json"
    flow: [lint, typecheck]
    output:
      use.test_results: result
      format: json

  - id: aggregate_coverage
    infer:
      prompt: |
        Analyze test coverage results and produce a summary:

        Test Results: {{use.test_results}}

        Return JSON with:
        - total_coverage: number (percentage)
        - by_suite: { unit: number, integration: number, e2e: number }
        - uncovered_files: string[] (critical files with < 80% coverage)
        - passed: boolean (true if total_coverage >= 80)
      response_format: json
    flow: [run_tests]
    output:
      use.coverage_summary: result

  # ════════════════════════════════════════════════════════════════════
  # STAGE 3: Quality Gates
  # ════════════════════════════════════════════════════════════════════

  - id: coverage_gate
    infer:
      prompt: |
        Evaluate coverage gate:
        Coverage Summary: {{use.coverage_summary}}
        Required: 80% minimum

        Return JSON: { "passed": boolean, "reason": string }
      response_format: json
    flow: [aggregate_coverage]
    output:
      use.coverage_gate_result: result

  - id: mutation_testing
    exec: "cargo mutants --json --timeout 300"
    flow: [coverage_gate]
    output:
      use.mutation_results: result
      format: json

  - id: mutation_gate
    infer:
      prompt: |
        Evaluate mutation testing results:
        {{use.mutation_results}}

        Mutation score must be >= 70% to pass.
        Return JSON: { "passed": boolean, "score": number, "reason": string }
      response_format: json
    flow: [mutation_testing]

  # ════════════════════════════════════════════════════════════════════
  # STAGE 4: Build Artifacts
  # ════════════════════════════════════════════════════════════════════

  - id: build_production
    exec: "pnpm build:production"
    flow: [mutation_gate]
    output:
      use.build_info: result

  - id: build_docker
    exec: |
      docker build -t $IMAGE_NAME:$COMMIT_SHA .
      docker tag $IMAGE_NAME:$COMMIT_SHA $IMAGE_NAME:latest
    flow: [build_production]
    output:
      use.docker_info: result

  - id: push_artifacts
    exec: |
      docker push $IMAGE_NAME:$COMMIT_SHA
      docker push $IMAGE_NAME:latest
    flow: [build_docker]

  # ════════════════════════════════════════════════════════════════════
  # STAGE 5: Parallel Deployments
  # ════════════════════════════════════════════════════════════════════

  - id: deploy_environments
    for_each: ["staging", "production"]
    as: env
    concurrency: 1  # Sequential deployment (staging first)
    fail_fast: true
    agent:
      prompt: |
        Deploy to {{use.env}} environment:

        1. Run health checks on current deployment
        2. Deploy new version with blue-green strategy
        3. Run smoke tests
        4. Switch traffic if smoke tests pass
        5. Keep old version for 10 minutes for rollback

        Docker image: $IMAGE_NAME:$COMMIT_SHA
        Environment: {{use.env}}

        Report deployment status and any issues.
      max_turns: 10
    flow: [push_artifacts]
    output:
      use.deployment_results: result

  # ════════════════════════════════════════════════════════════════════
  # STAGE 6: Post-Deployment Validation
  # ════════════════════════════════════════════════════════════════════

  - id: smoke_tests_production
    exec: "pnpm test:smoke --env=production"
    flow: [deploy_environments]

  - id: notify_slack
    fetch:
      url: "${SLACK_WEBHOOK_URL}"
      method: POST
      headers:
        Content-Type: application/json
      body: |
        {
          "text": "✅ Pipeline completed successfully",
          "blocks": [
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "*Deployment Summary*\n• Commit: $COMMIT_SHA\n• Coverage: {{use.coverage_summary.total_coverage}}%\n• Status: Success"
              }
            }
          ]
        }
    flow: [smoke_tests_production]

# Error handling: If any stage fails, the pipeline stops
# Rollback is handled by the deploy agent's blue-green strategy
