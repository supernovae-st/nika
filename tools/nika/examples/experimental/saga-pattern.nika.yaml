# Saga Pattern - Compensating Transactions
# Demonstrates: Error recovery, rollback chains, checkpoint/resume
#
# This workflow implements the Saga pattern for distributed transactions:
# - Each step has a compensating action
# - On failure, compensations run in reverse order
# - Checkpoints enable resume from last successful step
#
# Use case: E-commerce order processing with inventory, payment, shipping
schema: nika/workflow@0.10

workflow: saga-order-processing
description: |
  Order processing saga with compensating transactions.
  Demonstrates error recovery and rollback patterns.

context:
  files:
    order_template: ./.nika/context/order-template.json
  session: ./.nika/sessions/saga-checkpoint.json

tasks:
  # ════════════════════════════════════════════════════════════════════
  # STEP 1: Reserve Inventory
  # ════════════════════════════════════════════════════════════════════

  - id: reserve_inventory
    fetch:
      url: "${INVENTORY_API}/reserve"
      method: POST
      headers:
        Authorization: "Bearer ${INVENTORY_TOKEN}"
        Content-Type: application/json
      body: |
        {
          "order_id": "{{use.order_id}}",
          "items": {{use.order_items}}
        }
    output:
      use.inventory_reservation: result
      checkpoint: true  # Save state for resume

  - id: compensate_inventory
    fetch:
      url: "${INVENTORY_API}/release"
      method: POST
      headers:
        Authorization: "Bearer ${INVENTORY_TOKEN}"
        Content-Type: application/json
      body: |
        {
          "reservation_id": "{{use.inventory_reservation.id}}"
        }
    # This task is only triggered on rollback
    trigger: on_rollback
    rollback_for: reserve_inventory

  # ════════════════════════════════════════════════════════════════════
  # STEP 2: Process Payment
  # ════════════════════════════════════════════════════════════════════

  - id: process_payment
    fetch:
      url: "${PAYMENT_API}/charge"
      method: POST
      headers:
        Authorization: "Bearer ${PAYMENT_TOKEN}"
        Content-Type: application/json
      body: |
        {
          "order_id": "{{use.order_id}}",
          "amount": {{use.order_total}},
          "currency": "USD",
          "customer_id": "{{use.customer_id}}"
        }
    flow: [reserve_inventory]
    output:
      use.payment_result: result
      checkpoint: true
    stop_conditions:
      - pattern: '"status":\s*"declined"'
        action: rollback
        message: "Payment declined - initiating rollback"

  - id: compensate_payment
    fetch:
      url: "${PAYMENT_API}/refund"
      method: POST
      headers:
        Authorization: "Bearer ${PAYMENT_TOKEN}"
        Content-Type: application/json
      body: |
        {
          "charge_id": "{{use.payment_result.charge_id}}",
          "reason": "Order cancelled - saga rollback"
        }
    trigger: on_rollback
    rollback_for: process_payment

  # ════════════════════════════════════════════════════════════════════
  # STEP 3: Create Shipment
  # ════════════════════════════════════════════════════════════════════

  - id: create_shipment
    fetch:
      url: "${SHIPPING_API}/shipments"
      method: POST
      headers:
        Authorization: "Bearer ${SHIPPING_TOKEN}"
        Content-Type: application/json
      body: |
        {
          "order_id": "{{use.order_id}}",
          "address": {{use.shipping_address}},
          "items": {{use.order_items}},
          "service": "{{use.shipping_service}}"
        }
    flow: [process_payment]
    output:
      use.shipment_result: result
      checkpoint: true
    stop_conditions:
      - pattern: '"error":'
        action: rollback
        message: "Shipment creation failed - initiating rollback"

  - id: compensate_shipment
    fetch:
      url: "${SHIPPING_API}/shipments/{{use.shipment_result.id}}/cancel"
      method: POST
      headers:
        Authorization: "Bearer ${SHIPPING_TOKEN}"
    trigger: on_rollback
    rollback_for: create_shipment

  # ════════════════════════════════════════════════════════════════════
  # STEP 4: Send Notifications
  # ════════════════════════════════════════════════════════════════════

  - id: send_confirmation
    agent:
      prompt: |
        Send order confirmation to customer:

        Order ID: {{use.order_id}}
        Customer Email: {{use.customer_email}}
        Payment: {{use.payment_result}}
        Shipment: {{use.shipment_result}}
        Tracking Number: {{use.shipment_result.tracking_number}}

        1. Generate a friendly confirmation email
        2. Send via email API
        3. Send SMS notification if phone number available

        Return confirmation status.
      max_turns: 5
    flow: [create_shipment]
    output:
      use.notification_result: result

  # ════════════════════════════════════════════════════════════════════
  # STEP 5: Update Order Status
  # ════════════════════════════════════════════════════════════════════

  - id: finalize_order
    fetch:
      url: "${ORDERS_API}/{{use.order_id}}/status"
      method: PATCH
      headers:
        Authorization: "Bearer ${ORDERS_TOKEN}"
        Content-Type: application/json
      body: |
        {
          "status": "completed",
          "payment_id": "{{use.payment_result.charge_id}}",
          "shipment_id": "{{use.shipment_result.id}}",
          "tracking_number": "{{use.shipment_result.tracking_number}}"
        }
    flow: [send_confirmation]
    output:
      use.final_order: result

  # ════════════════════════════════════════════════════════════════════
  # ROLLBACK HANDLER (Orchestrator)
  # ════════════════════════════════════════════════════════════════════

  - id: rollback_orchestrator
    infer:
      prompt: |
        A saga rollback has been triggered.

        Failed Step: {{use.failed_step}}
        Error: {{use.error_message}}

        Compensations to execute (reverse order):
        {{use.compensation_chain}}

        Generate a rollback report with:
        1. Root cause analysis
        2. Steps being compensated
        3. Customer impact assessment
        4. Recommended follow-up actions
    trigger: on_rollback
    output:
      use.rollback_report: result

  - id: notify_rollback
    fetch:
      url: "${SLACK_WEBHOOK_URL}"
      method: POST
      headers:
        Content-Type: application/json
      body: |
        {
          "text": "⚠️ Order Saga Rollback",
          "blocks": [
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "*Order {{use.order_id}} - Rollback Initiated*\n\n{{use.rollback_report}}"
              }
            }
          ]
        }
    trigger: on_rollback
    flow: [rollback_orchestrator]

# Saga execution order:
# 1. reserve_inventory → process_payment → create_shipment → send_confirmation → finalize_order
#
# On failure at any step:
# - Rollback triggered
# - Compensations run in reverse: compensate_shipment → compensate_payment → compensate_inventory
# - Notifications sent
#
# Checkpoints allow resume from last successful step on retry
