# Expert Workflow: Data Processing Pipeline
# Demonstrates: complex DAG + error handling + conditional artifacts + batch processing
#
# This workflow simulates a production data pipeline that:
# 1. Fetches data from multiple sources
# 2. Validates and transforms data with strict schemas
# 3. Processes in batches with error recovery
# 4. Generates comprehensive audit trails
#
# Features demonstrated:
# - Complex DAG with diamond dependencies
# - Conditional task execution
# - Error recovery with fallbacks
# - Batch processing with for_each
# - Comprehensive artifact audit trail
# - Multiple artifact modes (overwrite, append, unique)
# - JSON Schema validation at every step
#
# Usage:
#   nika examples/expert/data-processing-pipeline.nika.yaml
#
# Requirements:
#   - ANTHROPIC_API_KEY

schema: "nika/workflow@0.12"
workflow: data-processing-pipeline
description: "Production-grade data processing with comprehensive auditing"

provider: claude
model: claude-sonnet-4-6

# Workflow-level artifact configuration
artifacts:
  dir: ./pipeline/{{date}}/run-{{uuid}}
  format: json
  mode: overwrite
  manifest: true
  max_size: 52428800   # 50 MB max

# Pipeline inputs
inputs:
  batch_size:
    type: integer
    default: 100
  validation_mode:
    type: string
    default: "strict"
    enum: [strict, lenient, skip]

tasks:
  # ═══════════════════════════════════════════════════════════════════════════════
  # STAGE 1: Data Acquisition (Parallel Sources)
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: fetch_source_a
    description: "Fetch data from primary source"
    infer:
      prompt: |
        Generate mock data representing user activity records from Source A.

        Generate exactly 50 records with:
        - id: UUID format
        - user_id: string
        - action: "view" | "click" | "purchase"
        - timestamp: ISO 8601 format
        - metadata: object with variable fields
        - source: "source_a"

        Some records should have intentional quality issues:
        - 5% missing user_id
        - 3% invalid timestamps
        - 2% malformed metadata

        Return as JSON array.
    output:
      format: json
      schema:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
            user_id:
              type: ["string", "null"]
            action:
              type: string
            timestamp:
              type: string
            metadata:
              type: object
            source:
              type: string
        minItems: 50
      max_retries: 2
    artifact:
      path: raw/source-a.json

  - id: fetch_source_b
    description: "Fetch data from secondary source"
    infer:
      prompt: |
        Generate mock data representing transaction records from Source B.

        Generate exactly 30 records with:
        - transaction_id: UUID format
        - user_id: string
        - amount: number (positive)
        - currency: "USD" | "EUR" | "GBP"
        - status: "completed" | "pending" | "failed"
        - timestamp: ISO 8601 format
        - source: "source_b"

        Include some edge cases:
        - 10% pending transactions
        - 5% failed transactions

        Return as JSON array.
    output:
      format: json
      schema:
        type: array
        items:
          type: object
          required: [transaction_id, user_id, amount, currency, status, timestamp, source]
          properties:
            transaction_id:
              type: string
            user_id:
              type: string
            amount:
              type: number
              minimum: 0
            currency:
              type: string
              enum: [USD, EUR, GBP]
            status:
              type: string
              enum: [completed, pending, failed]
            timestamp:
              type: string
            source:
              type: string
      max_retries: 2
    artifact:
      path: raw/source-b.json

  - id: fetch_source_c
    description: "Fetch data from tertiary source (user profiles)"
    infer:
      prompt: |
        Generate mock user profile data from Source C.

        Generate exactly 40 records with:
        - user_id: string (matching some IDs from other sources)
        - email: valid email format
        - name: full name
        - tier: "free" | "premium" | "enterprise"
        - created_at: ISO 8601 format
        - preferences: object
        - source: "source_c"

        Return as JSON array.
    output:
      format: json
      schema:
        type: array
        items:
          type: object
          required: [user_id, email, name, tier, created_at, source]
          properties:
            user_id:
              type: string
            email:
              type: string
              format: email
            name:
              type: string
            tier:
              type: string
              enum: [free, premium, enterprise]
            created_at:
              type: string
            preferences:
              type: object
            source:
              type: string
        minItems: 40
      max_retries: 2
    artifact:
      path: raw/source-c.json

  # ═══════════════════════════════════════════════════════════════════════════════
  # STAGE 2: Data Validation (Diamond Pattern)
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: validate_source_a
    description: "Validate source A data quality"
    with:
      data: fetch_source_a
    infer:
      prompt: |
        Validate the data from Source A.

        Data:
        {{with.data | to_yaml}}

        Validation rules:
        1. id must be present and unique
        2. user_id should be present (flag if missing)
        3. action must be valid enum
        4. timestamp must be valid ISO 8601
        5. metadata must be object (flag if malformed)

        Return validation results:
        - valid_records: array of valid record IDs
        - invalid_records: array of {id, issues: []}
        - quality_score: 0-100
        - statistics: counts by issue type
    output:
      format: json
      schema:
        type: object
        required: [valid_records, invalid_records, quality_score, statistics]
        properties:
          valid_records:
            type: array
            items:
              type: string
          invalid_records:
            type: array
            items:
              type: object
              required: [id, issues]
              properties:
                id:
                  type: string
                issues:
                  type: array
                  items:
                    type: string
          quality_score:
            type: number
            minimum: 0
            maximum: 100
          statistics:
            type: object
      max_retries: 2
    artifact:
      path: validation/source-a-validation.json
    flow: [fetch_source_a]

  - id: validate_source_b
    description: "Validate source B data quality"
    with:
      data: fetch_source_b
    infer:
      prompt: |
        Validate the transaction data from Source B.

        Data:
        {{with.data | to_yaml}}

        Validation rules:
        1. transaction_id must be unique
        2. amount must be positive
        3. currency must be valid
        4. status must be valid enum
        5. timestamps must be valid ISO 8601

        Return validation results matching the schema.
    output:
      format: json
      schema:
        type: object
        required: [valid_records, invalid_records, quality_score, statistics]
        properties:
          valid_records:
            type: array
            items:
              type: string
          invalid_records:
            type: array
            items:
              type: object
          quality_score:
            type: number
            minimum: 0
            maximum: 100
          statistics:
            type: object
      max_retries: 2
    artifact:
      path: validation/source-b-validation.json
    flow: [fetch_source_b]

  - id: validate_source_c
    description: "Validate source C data quality"
    with:
      data: fetch_source_c
    infer:
      prompt: |
        Validate the user profile data from Source C.

        Data:
        {{with.data | to_yaml}}

        Validation rules:
        1. user_id must be unique
        2. email must be valid format
        3. tier must be valid enum
        4. created_at must be valid ISO 8601

        Return validation results matching the schema.
    output:
      format: json
      schema:
        type: object
        required: [valid_records, invalid_records, quality_score, statistics]
        properties:
          valid_records:
            type: array
            items:
              type: string
          invalid_records:
            type: array
            items:
              type: object
          quality_score:
            type: number
            minimum: 0
            maximum: 100
          statistics:
            type: object
      max_retries: 2
    artifact:
      path: validation/source-c-validation.json
    flow: [fetch_source_c]

  # ═══════════════════════════════════════════════════════════════════════════════
  # STAGE 3: Data Merge (Diamond Convergence)
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: merge_validated_data
    description: "Merge validated data from all sources"
    with:
      source_a: fetch_source_a
      source_b: fetch_source_b
      source_c: fetch_source_c
      validation_a: validate_source_a
      validation_b: validate_source_b
      validation_c: validate_source_c
    infer:
      prompt: |
        Merge validated data from all three sources.

        Source A (Activity): {{with.source_a | length}} records
        Source B (Transactions): {{with.source_b | length}} records
        Source C (Profiles): {{with.source_c | length}} records

        Validation Results:
        - A: Score {{with.validation_a.quality_score}}, Valid: {{with.validation_a.valid_records | length}}
        - B: Score {{with.validation_b.quality_score}}, Valid: {{with.validation_b.valid_records | length}}
        - C: Score {{with.validation_c.quality_score}}, Valid: {{with.validation_c.valid_records | length}}

        Merge strategy:
        1. Only include records that passed validation
        2. Join activity and transaction data by user_id
        3. Enrich with profile data where available
        4. Create unified record format

        Return:
        - merged_records: array of unified records
        - merge_statistics: counts and join success rates
        - data_lineage: tracking source of each field
    output:
      format: json
      schema:
        type: object
        required: [merged_records, merge_statistics, data_lineage]
        properties:
          merged_records:
            type: array
            items:
              type: object
          merge_statistics:
            type: object
            required: [total_input, total_output, join_rate]
            properties:
              total_input:
                type: integer
              total_output:
                type: integer
              join_rate:
                type: number
          data_lineage:
            type: object
      max_retries: 2
    artifact:
      path: transformed/merged-data.json
    flow: [validate_source_a, validate_source_b, validate_source_c]

  # ═══════════════════════════════════════════════════════════════════════════════
  # STAGE 4: Batch Processing
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: create_batches
    description: "Split merged data into processing batches"
    with:
      merged: merge_validated_data
    infer:
      prompt: |
        Split the merged data into processing batches.

        Total records: {{with.merged.merged_records | length}}
        Batch size: {{inputs.batch_size}}

        Create batches with:
        - batch_id: sequential identifier
        - records: array of records for this batch
        - start_index: starting position in full dataset
        - end_index: ending position

        Return array of batch objects.
    output:
      format: json
      schema:
        type: array
        items:
          type: object
          required: [batch_id, records, start_index, end_index]
          properties:
            batch_id:
              type: string
            records:
              type: array
            start_index:
              type: integer
            end_index:
              type: integer
      max_retries: 1
    artifact:
      path: batches/batch-manifest.json
    flow: [merge_validated_data]

  - id: process_batches
    description: "Process each batch with enrichment and scoring"
    for_each: "$batches"
    as: batch
    concurrency: 2
    fail_fast: false

    with:
      batches: create_batches

    infer:
      prompt: |
        Process batch {{with.batch.batch_id}} with enrichment and scoring.

        Batch records: {{with.batch.records | length}}
        Records:
        {{with.batch.records | to_yaml}}

        For each record:
        1. Calculate engagement_score based on activity
        2. Calculate value_score based on transactions
        3. Assign user_segment: "high_value" | "growth" | "at_risk" | "new"
        4. Generate recommendations array

        Return processed records with all enrichments.
    output:
      format: json
      schema:
        type: object
        required: [batch_id, processed_records, processing_stats]
        properties:
          batch_id:
            type: string
          processed_records:
            type: array
            items:
              type: object
              properties:
                original_id:
                  type: string
                engagement_score:
                  type: number
                value_score:
                  type: number
                user_segment:
                  type: string
                recommendations:
                  type: array
          processing_stats:
            type: object
      max_retries: 2

    artifact:
      - path: batches/processed/{{with.batch.batch_id}}.json
        format: json
        mode: overwrite
      - path: batches/audit.log
        format: text
        mode: append   # Append to audit log

    flow: [create_batches]

  # ═══════════════════════════════════════════════════════════════════════════════
  # STAGE 5: Final Aggregation & Reporting
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: aggregate_results
    description: "Aggregate all batch results into final output"
    with:
      batches: process_batches
      merged: merge_validated_data

    infer:
      prompt: |
        Aggregate results from all processed batches.

        Batch results:
        {{with.batches | to_yaml}}

        Original merge statistics:
        {{with.merged.merge_statistics | to_yaml}}

        Create final aggregated output:
        1. Combine all processed records
        2. Calculate global statistics
        3. Segment distribution breakdown
        4. Top recommendations by frequency
        5. Data quality summary
    output:
      format: json
      schema:
        type: object
        required: [total_records, segment_distribution, quality_summary, top_recommendations, processing_summary]
        properties:
          total_records:
            type: integer
          segment_distribution:
            type: object
          quality_summary:
            type: object
          top_recommendations:
            type: array
            items:
              type: object
          processing_summary:
            type: object
      max_retries: 1

    artifact:
      path: output/aggregated-results.json

    flow: [process_batches]

  - id: generate_audit_report
    description: "Generate comprehensive audit report"
    with:
      source_a_val: validate_source_a
      source_b_val: validate_source_b
      source_c_val: validate_source_c
      merged: merge_validated_data
      aggregated: aggregate_results

    infer:
      prompt: |
        Generate a comprehensive audit report for this pipeline run.

        Validation Scores:
        - Source A: {{with.source_a_val.quality_score}}
        - Source B: {{with.source_b_val.quality_score}}
        - Source C: {{with.source_c_val.quality_score}}

        Merge Statistics:
        {{with.merged.merge_statistics | to_yaml}}

        Final Results:
        {{with.aggregated | to_yaml}}

        Create a detailed Markdown audit report with:
        - Executive summary
        - Data quality assessment by source
        - Processing statistics
        - Segment analysis
        - Recommendations
        - Compliance notes

    artifact:
      - path: output/audit-report.md
        format: text
      - path: output/audit-report.json
        format: json
        mode: unique   # Create unique filename if exists

    flow: [aggregate_results]

  # ═══════════════════════════════════════════════════════════════════════════════
  # STAGE 6: Final Output
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: final_output
    description: "Output pipeline completion summary"
    with:
      aggregated: aggregate_results
      audit: generate_audit_report

    exec: |
      echo "═══════════════════════════════════════════════════════════════"
      echo "  📊 DATA PROCESSING PIPELINE COMPLETE"
      echo "═══════════════════════════════════════════════════════════════"
      echo ""
      echo "Records processed: {{with.aggregated.total_records}}"
      echo ""
      echo "Segment Distribution:"
      echo "  {{with.aggregated.segment_distribution | to_yaml}}"
      echo ""
      echo "Pipeline Artifacts:"
      echo "  📁 raw/           - Source data"
      echo "  📁 validation/    - Validation results"
      echo "  📁 transformed/   - Merged data"
      echo "  📁 batches/       - Batch processing"
      echo "  📁 output/        - Final results + audit"
      echo ""
      echo "═══════════════════════════════════════════════════════════════"

    flow: [generate_audit_report]

# ═══════════════════════════════════════════════════════════════════════════════
# PIPELINE FLOW DIAGRAM (Diamond Pattern)
# ═══════════════════════════════════════════════════════════════════════════════
#
#   ┌────────────┐  ┌────────────┐  ┌────────────┐
#   │fetch_src_a │  │fetch_src_b │  │fetch_src_c │   (PARALLEL)
#   └─────┬──────┘  └─────┬──────┘  └─────┬──────┘
#         │               │               │
#         ▼               ▼               ▼
#   ┌────────────┐  ┌────────────┐  ┌────────────┐
#   │validate_a  │  │validate_b  │  │validate_c  │   (PARALLEL)
#   └─────┬──────┘  └─────┬──────┘  └─────┬──────┘
#         │               │               │
#         └───────────────┼───────────────┘
#                         │
#                         ▼
#                 ┌───────────────┐
#                 │ merge_data    │  (DIAMOND CONVERGENCE)
#                 └───────┬───────┘
#                         │
#                         ▼
#                 ┌───────────────┐
#                 │create_batches │
#                 └───────┬───────┘
#                         │
#                         ▼
#                 ┌───────────────────────────────┐
#                 │    process_batches            │  (FOR_EACH)
#                 │  ┌───┐ ┌───┐ ┌───┐ ┌───┐     │
#                 │  │B1 │ │B2 │ │B3 │ │...│     │
#                 │  └───┘ └───┘ └───┘ └───┘     │
#                 └───────────────┬───────────────┘
#                                 │
#                                 ▼
#                 ┌───────────────────────────────┐
#                 │      aggregate_results        │
#                 └───────────────┬───────────────┘
#                                 │
#                                 ▼
#                 ┌───────────────────────────────┐
#                 │    generate_audit_report      │
#                 └───────────────┬───────────────┘
#                                 │
#                                 ▼
#                 ┌───────────────────────────────┐
#                 │        final_output           │
#                 └───────────────────────────────┘
#
