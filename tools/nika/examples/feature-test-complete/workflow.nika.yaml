# Feature Test Complete — Nika v0.21.0
# Tests: Structured Output, Artifacts, LSP validation, All 5 verbs
# Location: nika/tools/nika/examples/feature-test-complete/workflow.nika.yaml

schema: nika/workflow@0.12
workflow: feature-test-complete
description: |
  Comprehensive test of Nika v0.21.0 features:
  - Structured Output Engine (Layer 2: provider-native)
  - Artifact System (atomic writes)
  - All 5 semantic verbs
  - Template interpolation
  - Task dependencies

inputs:
  topic:
    default: "Rust async programming"
  locale:
    default: "en-US"

tasks:
  # ─────────────────────────────────────────────────────────────────────────
  # TEST 1: exec: verb — Shell command execution
  # ─────────────────────────────────────────────────────────────────────────
  - id: get_timestamp
    exec: "date +%Y-%m-%d_%H-%M-%S"
    description: "Get current timestamp for artifact naming"

  # ─────────────────────────────────────────────────────────────────────────
  # TEST 2: fetch: verb — HTTP request
  # ─────────────────────────────────────────────────────────────────────────
  - id: fetch_example
    fetch:
      url: "https://httpbin.org/json"
      method: GET
    description: "Test HTTP fetch capability"

  # ─────────────────────────────────────────────────────────────────────────
  # TEST 3: infer: verb — LLM generation WITHOUT structured output
  # ─────────────────────────────────────────────────────────────────────────
  - id: generate_outline
    infer: |
      Generate a brief 3-point outline for an article about: {{inputs.topic}}
      Keep it concise, just the 3 main points as a numbered list.
    provider: claude
    model: claude-3-5-sonnet-latest
    temperature: 0.7
    description: "Basic LLM inference test"

  # ─────────────────────────────────────────────────────────────────────────
  # TEST 4: infer: verb WITH structured output (Layer 2 - provider-native)
  # ─────────────────────────────────────────────────────────────────────────
  - id: extract_metadata
    depends_on: [generate_outline]
    infer: |
      Analyze this outline and extract metadata:
      {{generate_outline.output}}

      Extract: title suggestion, estimated read time, difficulty level.
    provider: claude
    model: claude-3-5-sonnet-latest
    structured:
      schema:
        type: object
        properties:
          title:
            type: string
            description: "Suggested article title"
          read_time_minutes:
            type: integer
            minimum: 1
            maximum: 60
          difficulty:
            type: string
            enum: ["beginner", "intermediate", "advanced"]
          keywords:
            type: array
            items:
              type: string
            minItems: 2
            maxItems: 5
        required: [title, read_time_minutes, difficulty, keywords]
      enable_tool_use: true
    description: "Structured output with inline schema"

  # ─────────────────────────────────────────────────────────────────────────
  # TEST 5: Artifact output — File persistence
  # ─────────────────────────────────────────────────────────────────────────
  - id: save_result
    depends_on: [extract_metadata, get_timestamp]
    infer: |
      Create a JSON summary combining:
      - Metadata: {{extract_metadata.output}}
      - Generated at: {{get_timestamp.output}}
      - Topic: {{inputs.topic}}
      - Locale: {{inputs.locale}}
    provider: claude
    model: claude-3-5-haiku-latest
    artifact:
      path: "./outputs/result-{{get_timestamp.output}}.json"
      format: json
    description: "Save output as artifact with template path"

  # ─────────────────────────────────────────────────────────────────────────
  # TEST 6: agent: verb — Multi-turn agentic loop (optional, needs MCP)
  # ─────────────────────────────────────────────────────────────────────────
  # Uncomment if NovaNet MCP is running:
  # - id: agent_task
  #   agent:
  #     prompt: "Research {{inputs.topic}} using available tools"
  #     max_turns: 3
  #     tools: [novanet_search]
  #   description: "Agentic task with MCP tools"

# Note: Outputs are captured via artifact: field on save_result task
# Final result location: ./outputs/result-<timestamp>.json
