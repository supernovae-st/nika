# Feature Test Demo Workflow
# Tests ALL Nika features: 5 verbs, context, include, for_each, bindings, agents, MCP, schemas
#
# Usage: nika run feature-test-demo.nika.yaml --input subject="Artificial Intelligence"
#
# v0.15.0 Features tested:
# - shell: true (explicit shell mode for heredocs - REQUIRED since v0.15 defaults to shell-free)
# - infer: temperature, system, max_tokens
# - 6 LLM providers: claude, openai, mistral, groq, deepseek, gemini
# - 11 builtin tools: sleep, log, emit, assert, prompt, run, read, write, edit, glob, grep
#
# Builtins used in this workflow:
# - nika:log (debug events)
# - nika:assert (validation)
# - nika:read / nika:write (file operations without shell - v0.15.0+)

schema: nika/workflow@0.10
workflow: feature-test-demo
description: |
  Comprehensive Nika feature test workflow.
  Creates ~/Desktop/output/ with research.json, content.md, summary.txt, index.html
  Tests: infer, exec, fetch, invoke, agent, spawn_agent, for_each, context, include,
         lazy bindings, eager bindings, output schemas, MCP servers, parallelism

# ═══════════════════════════════════════════════════════════════════════════════
# CONTEXT: Load files at workflow start (v0.14.3 feature)
# ═══════════════════════════════════════════════════════════════════════════════
context:
  files:
    # Glob pattern: load all templates
    templates: ./templates/*.md
    # Single file: HTML boilerplate
    html_boilerplate: ./context/html-boilerplate.html
    # JSON schemas for reference
    schemas: ./schemas/*.json

# ═══════════════════════════════════════════════════════════════════════════════
# INCLUDE: DAG fusion from partials (v0.14.3 feature)
# ═══════════════════════════════════════════════════════════════════════════════
include:
  - path: ./partials/setup.nika.yaml
    prefix: setup_

# ═══════════════════════════════════════════════════════════════════════════════
# MCP SERVERS: Perplexity + Firecrawl (flat config, not nested under "servers")
# ═══════════════════════════════════════════════════════════════════════════════
mcp:
  perplexity:
    command: npx
    args: ["-y", "perplexity-mcp"]
    env:
      PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY}"

  firecrawl:
    command: npx
    args: ["-y", "firecrawl-mcp"]
    env:
      FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY}"

# ═══════════════════════════════════════════════════════════════════════════════
# TASKS
# ═══════════════════════════════════════════════════════════════════════════════
tasks:

  # ─────────────────────────────────────────────────────────────────────────────
  # PHASE 2: RESEARCH (agent + MCP + spawn_agent)
  # ─────────────────────────────────────────────────────────────────────────────

  - id: research_agent
    depends_on:
      - setup_generate_meta
      - setup_validate_env
    agent:
      prompt: |
        You are a research agent. Research the topic: {{input.subject}}

        Use the available MCP tools:
        1. Use 'search' (perplexity) to find relevant information
        2. Use 'firecrawl_scrape' to extract content from top sources

        Then synthesize your findings into structured research data.

        Context from templates:
        {{context.files.templates}}

        Return your findings as valid JSON matching this structure:
        - meta: { subject, timestamp, agent_id, depth }
        - sources: [{ url, title, relevance_score, provider }]
        - analysis: { summary, themes, sentiment }
        - key_findings: [{ finding, confidence, sources }]
      mcp:
        - perplexity
        - firecrawl
      max_turns: 10
      depth_limit: 3
      tools:
        - nika:log
    use:
      # Eager binding: from included setup partial
      meta: setup_generate_meta
      env_status: setup_validate_env
    output:
      format: json
      schema: ./schemas/research.schema.json

  # ─────────────────────────────────────────────────────────────────────────────
  # PHASE 3: CONTENT GENERATION (infer + for_each + parallelism)
  # v0.15.0: Uses temperature, system, max_tokens in infer:
  # ─────────────────────────────────────────────────────────────────────────────

  - id: content_generation
    depends_on:
      - research_agent
    for_each: ["md", "txt", "json"]
    as: format
    concurrency: 3
    fail_fast: true
    infer:
      prompt: |
        Generate {{use.format}} format content about: {{input.subject}}

        Use this research as context:
        {{use.research_summary}}

        Template guidance:
        {{context.files.templates}}

        Generate comprehensive content with:
        - Clear structure with title, sections, subsections
        - Proper formatting for {{use.format}}
        - Actionable insights
        - Quality metrics (word_count, reading_time, readability_score)

        Return valid JSON matching this structure:
        - format: "{{use.format}}"
        - content: { title, body, sections }
        - metadata: { word_count, reading_time_minutes, generated_at }
        - quality_metrics: { readability_score, completeness }
      model: claude-sonnet-4-6
      # v0.15.0 features - now active!
      temperature: 0.7
      system: "You are a professional content writer specializing in technical documentation."
      max_tokens: 4000
    use:
      research_summary: research_agent
      # format is auto-populated from 'as: format' in for_each
    output:
      format: json
      schema: ./schemas/content.schema.json

  # ─────────────────────────────────────────────────────────────────────────────
  # PHASE 4: HTML GENERATION (agent + for_each sections)
  # ─────────────────────────────────────────────────────────────────────────────

  - id: html_builder_agent
    depends_on:
      - research_agent
      - content_generation
    for_each: ["header", "main", "footer"]
    as: section
    concurrency: 3
    agent:
      prompt: |
        Generate the {{use.section}} section of an HTML page about: {{input.subject}}

        Use the content generated previously and create semantic, accessible HTML.

        Boilerplate reference:
        {{context.files.html_boilerplate}}

        Requirements:
        - Semantic HTML5 tags
        - ARIA labels for accessibility
        - Inline CSS styles
        - WCAG AA contrast compliance

        Return valid JSON with:
        - section_type: "{{use.section}}"
        - html: { tag, content, classes, attributes }
        - styles: { inline, theme }
        - accessibility: { aria_labels, semantic_structure }
      mcp: []
      max_turns: 5
      depth_limit: 2
      tools:
        - nika:log
    use:
      # section is auto-populated from 'as: section' in for_each
      research: research_agent
      all_content:
        path: content_generation
        lazy: true
        default: "[]"
    output:
      format: json
      schema: ./schemas/html-section.schema.json

  # ─────────────────────────────────────────────────────────────────────────────
  # PHASE 5: ASSEMBLY (infer to combine HTML sections)
  # v0.15.0: Uses temperature and system for consistent output
  # ─────────────────────────────────────────────────────────────────────────────

  - id: assemble_html
    depends_on:
      - html_builder_agent
    infer:
      prompt: |
        Combine these HTML sections into a complete HTML page:

        The sections array contains [header, main, footer] in order:
        {{use.sections}}

        Base template:
        {{context.files.html_boilerplate}}

        Output a complete, valid HTML document with:
        - DOCTYPE declaration
        - Proper head section with meta tags
        - Combined body with all sections (header at top, main in middle, footer at bottom)
        - Inline styles from each section
      model: claude-sonnet-4-6
      temperature: 0.3
      system: "You are an expert HTML/CSS developer. Output only valid HTML code."
    use:
      # for_each results are aggregated as JSON array [header_result, main_result, footer_result]
      sections: html_builder_agent
    output:
      format: text

  # ─────────────────────────────────────────────────────────────────────────────
  # PHASE 6: FILE WRITING (exec with shell: true for heredocs)
  # v0.15.0: shell: true is REQUIRED for heredoc syntax (default is now shell-free)
  # ─────────────────────────────────────────────────────────────────────────────

  - id: write_research_json
    depends_on:
      - research_agent
    exec:
      command: |
        cat > ~/Desktop/output/research.json << 'JSONEOF'
        {{use.research}}
        JSONEOF
        echo "Written: research.json"
      shell: true
    use:
      research: research_agent

  - id: write_content_md
    depends_on:
      - content_generation
    exec:
      command: |
        cat > ~/Desktop/output/content.md << 'MDEOF'
        {{use.all_content}}
        MDEOF
        echo "Written: content.md"
      shell: true
    use:
      # for_each results: [md_result, txt_result, json_result] - write all formats
      all_content: content_generation

  - id: write_summary_txt
    depends_on:
      - content_generation
    exec:
      command: |
        cat > ~/Desktop/output/summary.txt << 'TXTEOF'
        {{use.all_content}}
        TXTEOF
        echo "Written: summary.txt"
      shell: true
    use:
      # for_each results aggregated as JSON array
      all_content: content_generation

  - id: write_index_html
    depends_on:
      - assemble_html
    exec:
      command: |
        cat > ~/Desktop/output/index.html << 'HTMLEOF'
        {{use.html}}
        HTMLEOF
        echo "Written: index.html"
      shell: true
    use:
      html: assemble_html

  # ─────────────────────────────────────────────────────────────────────────────
  # PHASE 7: VERIFICATION (exec to check files)
  # v0.15.0: shell: true for shell scripting features
  # ─────────────────────────────────────────────────────────────────────────────

  - id: verify_files
    depends_on:
      - write_research_json
      - write_content_md
      - write_summary_txt
      - write_index_html
    exec:
      command: |
        cd ~/Desktop/output && \
        echo "{\"files\": [" && \
        for f in research.json content.md summary.txt index.html; do
          if [ -f "$$f" ]; then
            size=$$(wc -c < "$$f" | tr -d ' ')
            echo "  {\"name\": \"$$f\", \"exists\": true, \"size_bytes\": $$size},"
          else
            echo "  {\"name\": \"$$f\", \"exists\": false, \"size_bytes\": 0},"
          fi
        done | sed '$$ s/,$$//' && \
        echo "], \"total_files\": $$(ls -1 | wc -l | tr -d ' '), \"verified_at\": \"$$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
      shell: true
    output:
      format: json

  # ─────────────────────────────────────────────────────────────────────────────
  # FINAL: Summary report
  # v0.15.0: Uses temperature for consistent professional output
  # ─────────────────────────────────────────────────────────────────────────────

  - id: final_report
    depends_on:
      - verify_files
    infer:
      prompt: |
        Generate a brief execution summary report for this workflow run.

        Subject: {{input.subject}}
        Verification: {{use.verification}}

        Include:
        - Files created
        - Any issues detected
        - Recommendations
      model: claude-sonnet-4-6
      temperature: 0.5
      system: "You are a technical report writer. Be concise and factual."
    use:
      verification: verify_files

# ═══════════════════════════════════════════════════════════════════════════════
# FLOWS: DAG definition (using depends_on above, flows for visualization only)
# ═══════════════════════════════════════════════════════════════════════════════
flows:
  # Setup (from included partial) → Research
  - source: setup_generate_meta
    target: research_agent
  - source: setup_validate_env
    target: research_agent

  # Research → Content Generation (parallel formats)
  - source: research_agent
    target: content_generation

  # Research + Content → HTML Builder (parallel sections)
  - source: research_agent
    target: html_builder_agent
  - source: content_generation
    target: html_builder_agent

  # HTML Sections → Assembly
  - source: html_builder_agent
    target: assemble_html

  # All content ready → Write files (parallel writes)
  - source: research_agent
    target: write_research_json
  - source: content_generation
    target: write_content_md
  - source: content_generation
    target: write_summary_txt
  - source: assemble_html
    target: write_index_html

  # All writes → Verification
  - source: write_research_json
    target: verify_files
  - source: write_content_md
    target: verify_files
  - source: write_summary_txt
    target: verify_files
  - source: write_index_html
    target: verify_files

  # Verification → Final Report
  - source: verify_files
    target: final_report
