# Minimal v0.15.0 Feature Test
# Tests shell: true, temperature, system, max_tokens WITHOUT MCP dependencies
#
# Usage: nika run test-v0.15-features.nika.yaml

schema: nika/workflow@0.12
workflow: test-v0-15-features
description: |
  Minimal test for v0.15.0 features:
  - shell: true (required for shell features)
  - infer: temperature, system, max_tokens
  - bindings without .result suffix

tasks:
  # Test 1: shell: true with heredoc
  - id: test_shell_heredoc
    exec:
      command: |
        cat << 'EOF'
        {"test": "heredoc", "status": "success"}
        EOF
      shell: true
    output:
      format: json

  # Test 2: shell: true with command substitution
  - id: test_shell_substitution
    exec:
      command: |
        echo "{\"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"shell\": true}"
      shell: true
    output:
      format: json

  # Test 3: shell: true with tilde expansion
  - id: test_shell_tilde
    exec:
      command: |
        mkdir -p ./nika-test-v015 && echo "Created test directory"
      shell: true

  # Test 4: infer with temperature + system + max_tokens (v0.15.0)
  - id: test_infer_options
    depends_on:
      - test_shell_heredoc
      - test_shell_substitution
    infer:
      prompt: |
        Generate a single JSON object with these fields:
        - message: "Hello from v0.15.0"
        - temperature_test: true
        - timestamp: current ISO timestamp

        Output ONLY valid JSON, no markdown.
      temperature: 0.3
      system: "You are a JSON generator. Output only valid JSON without code blocks."
      max_tokens: 200
    with:
      heredoc_result: test_shell_heredoc
      substitution_result: test_shell_substitution
    output:
      format: json

  # Test 5: Verify bindings work without .result suffix
  - id: test_bindings
    depends_on:
      - test_infer_options
      - test_shell_tilde
    exec:
      command: |
        echo "=== v0.15.0 Feature Test Results ==="
        echo "Heredoc test: {{with.heredoc}}"
        echo "Substitution test: {{with.substitution}}"
        echo "Infer test: {{with.infer}}"
        echo "=== ALL TESTS PASSED ==="
      shell: true
    with:
      heredoc: test_shell_heredoc
      substitution: test_shell_substitution
      infer: test_infer_options

  # Test 6: Cleanup (using rmdir to avoid rm -rf blocklist)
  - id: cleanup
    depends_on:
      - test_bindings
    exec:
      command: |
        rmdir $HOME/Desktop/nika-test-v015 2>/dev/null || echo "Already cleaned or not empty"
        echo "Cleanup complete"
      shell: true

flows:
  - source: [test_shell_heredoc, test_shell_substitution]
    target: test_infer_options
  - source: test_shell_tilde
    target: test_bindings
  - source: test_infer_options
    target: test_bindings
  - source: test_bindings
    target: cleanup
