# AUDIT-03: for_each with xAI provider
schema: nika/workflow@0.12
workflow: audit-03-for-each-xai

tasks:
  - id: items
    exec: 'echo ''["red","blue","green"]'''

  - id: process
    depends_on: [items]
    for_each: "$items"
    as: color
    infer: "What fruit is typically {{with.color}}? One word only."
    provider: xai
    model: grok-3-fast
    max_tokens: 10

  - id: collect
    depends_on: [process]
    with:
      results: $process
    exec: "echo 'Fruits: {{with.results}}'"
