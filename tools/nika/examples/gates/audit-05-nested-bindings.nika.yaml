# AUDIT-05: Nested JSON binding access ($task.field.subfield)
schema: nika/workflow@0.12
workflow: audit-05-nested-bindings

tasks:
  - id: produce_json
    exec: 'echo ''{"name":"Nika","version":"0.30","features":["infer","exec","fetch"]}'''

  - id: access_nested
    depends_on: [produce_json]
    with:
      name: $produce_json.name
      version: $produce_json.version
    exec: "echo 'Name={{with.name}} Version={{with.version}}'"
