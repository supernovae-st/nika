# AUDIT-06: Multiple artifacts from single task + for_each artifacts
schema: nika/workflow@0.12
workflow: audit-06-artifact-multi

artifacts:
  dir: ./examples/gates/.test-output/artifacts

tasks:
  - id: gen_items
    exec: 'echo ''["alpha","beta","gamma"]'''

  - id: write_each
    depends_on: [gen_items]
    for_each: "$gen_items"
    as: item
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 30
    infer: "Write a one-sentence definition of the word: {{with.item}}"
    artifact:
      path: "{{with.item}}.txt"
      format: text
