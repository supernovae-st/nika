# AUDIT-09: fetch POST with body and headers
schema: nika/workflow@0.12
workflow: audit-09-fetch-post

tasks:
  - id: post_data
    fetch:
      url: "https://httpbin.org/post"
      method: POST
      body: '{"test": true, "source": "nika"}'
      headers:
        Content-Type: application/json
        X-Custom-Header: nika-audit
    description: "POST with JSON body and custom headers"

  - id: verify_response
    depends_on: [post_data]
    with:
      response: $post_data
    exec: "echo 'Got response: {{with.response}}' | head -c 200"
    description: "Verify POST response contains our data"
