# AUDIT-10: Edge cases — unicode, empty arrays, special chars
schema: nika/workflow@0.12
workflow: audit-10-edge-cases

tasks:
  - id: unicode
    exec: "printf 'Héllo Wörld 日本語 🦋'"
    description: "Unicode characters in output"

  - id: verify_unicode
    depends_on: [unicode]
    with:
      text: $unicode
    exec: "echo 'Unicode: {{with.text}}'"
    description: "Unicode should survive binding round-trip"

  - id: special_chars
    exec: "echo 'quotes: \"hello\" and <tags> and &amps'"
    description: "Special characters in output"

  - id: empty_array
    exec: "echo '[]'"
    description: "Empty JSON array"

  - id: after_empty_array
    depends_on: [empty_array]
    with:
      arr: $empty_array ?? "fallback"
    exec: "echo 'Array={{with.arr}}'"
    description: "Empty array should not trigger ?? fallback (it's not null)"

  - id: nested_json
    exec: 'printf ''{"a":{"b":{"c":"deep"}}}'''

  - id: deep_access
    depends_on: [nested_json]
    with:
      deep: $nested_json.a.b.c
    exec: "echo 'Deep={{with.deep}}'"
    description: "3-level deep JSON navigation"
