# AUDIT-13: Artifact template with {{output}} placeholder
schema: nika/workflow@0.12
workflow: audit-13-artifact-template

artifacts:
  dir: ./examples/gates/.test-output/artifacts

tasks:
  - id: get_date
    exec: "date +%Y-%m-%d"

  - id: generate
    depends_on: [get_date]
    with:
      date: $get_date
    infer: "Write one sentence about Rust."
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 50
    artifact:
      path: "report-{{with.date}}.md"
      template: "# Report {{with.date}}\n\n{{output}}"
      format: text
    description: "Template should interpolate date AND task output"
