# AUDIT-14: Error handling — failed task should not block independent tasks
schema: nika/workflow@0.12
workflow: audit-14-error-recovery

tasks:
  - id: will_fail
    exec: "exit 1"
    description: "This task should fail"

  - id: independent
    exec: "echo 'INDEPENDENT_SUCCESS'"
    description: "This should succeed even if will_fail fails (no dependency)"

  - id: depends_on_fail
    depends_on: [will_fail]
    exec: "echo 'SHOULD_NOT_RUN'"
    description: "This should be skipped (dependency failed)"
