# COMBO: multiple tasks each writing artifacts
schema: nika/workflow@0.12
model: gpt-4.1-mini
workflow: combo-artifact-multi-task

artifacts:
  dir: ./examples/gates/.test-output/combo

tasks:
  - id: header
    exec: "echo '# Report Header'"
    artifact:
      path: section-header.txt
      format: text

  - id: body
    infer: "Write one sentence about AI workflows."
    provider: openai
    
    max_tokens: 50
    artifact:
      path: section-body.txt
      format: text

  - id: footer
    depends_on: [header, body]
    with:
      h: $header
      b: $body
    exec: "echo '{{with.h}} | {{with.b}} | END'"
    artifact:
      path: section-combined.txt
      format: text
