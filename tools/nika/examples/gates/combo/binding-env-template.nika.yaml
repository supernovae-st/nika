# COMBO: env binding used in template string
schema: nika/workflow@0.12
model: gpt-4.1-mini
workflow: combo-binding-env-template

tasks:
  - id: get_env
    exec:
      command: "echo $HOME"
      shell: true

  - id: use_in_template
    depends_on: [get_env]
    with:
      home_dir: $get_env
    infer: "The user's home directory is {{with.home_dir}}. What OS is this likely? One word."
    provider: openai
    
    max_tokens: 50
