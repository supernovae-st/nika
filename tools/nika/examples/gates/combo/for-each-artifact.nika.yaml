# COMBO: for_each + artifact write
schema: nika/workflow@0.12
model: gpt-4.1-mini
workflow: combo-for-each-artifact

artifacts:
  dir: ./examples/gates/.test-output/combo

tasks:
  - id: generate
    for_each: ["rust", "python", "go"]
    as: lang
    infer: "Write one sentence about {{with.lang}} programming language."
    provider: openai
    
    max_tokens: 50
    artifact:
      path: "{{with.lang}}.txt"
      format: text
