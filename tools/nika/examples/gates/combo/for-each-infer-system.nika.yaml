# COMBO: for_each + infer with system prompt
schema: nika/workflow@0.12
model: gpt-4.1-mini
workflow: combo-for-each-infer-system

tasks:
  - id: translate
    for_each: ["Hello", "Goodbye", "Thank you"]
    as: phrase
    infer:
      system: "You are a translator. Respond with only the French translation."
      prompt: "Translate: {{with.phrase}}"
      max_tokens: 50
    provider: openai
    
