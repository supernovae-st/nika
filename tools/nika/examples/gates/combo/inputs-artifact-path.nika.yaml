# COMBO: inputs used in artifact path template
schema: nika/workflow@0.12
workflow: combo-inputs-artifact-path

inputs:
  filename:
    default: "output"

artifacts:
  dir: ./examples/gates/.test-output/combo

tasks:
  - id: generate
    infer: "Say 'artifact test' and nothing else."
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 50
    artifact:
      path: "{{inputs.filename}}.txt"
      format: text
