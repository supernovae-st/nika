# COMBO: inputs params used in with: binding -> infer
schema: nika/workflow@0.12
model: gpt-4.1-mini
workflow: combo-inputs-binding-infer

inputs:
  subject:
    default: "quantum computing"

tasks:
  - id: research
    with:
      topic: $inputs.subject
    infer: "Explain {{with.topic}} in one sentence for a beginner."
    provider: openai
    
    max_tokens: 50
