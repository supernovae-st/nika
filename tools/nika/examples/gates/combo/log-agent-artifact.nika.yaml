# COMBO: log config + agent + artifact
schema: nika/workflow@0.12
workflow: combo-log-agent-artifact

log:
  level: debug

artifacts:
  dir: ./examples/gates/.test-output/combo

tasks:
  - id: agent_logged
    agent:
      prompt: "Say 'logged agent output' then call nika_complete"
      tools: [nika_complete]
      provider: openai
      model: gpt-4.1-mini
      max_turns: 2
      max_tokens: 50
    artifact:
      path: agent-log-output.txt
      format: text
