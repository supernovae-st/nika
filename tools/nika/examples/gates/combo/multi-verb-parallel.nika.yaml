# COMBO: parallel exec + fetch + infer (no deps)
schema: nika/workflow@0.12
workflow: combo-multi-verb-parallel

tasks:
  - id: local
    exec: "echo 'LOCAL_DATA'"

  - id: remote
    fetch:
      url: "https://httpbin.org/get"
      method: GET

  - id: generate
    infer: "Say 'parallel test' and nothing else."
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 50
