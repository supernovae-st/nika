# COMBO: structured output fields used in with: binding
schema: nika/workflow@0.12
workflow: combo-structured-binding

tasks:
  - id: extract
    infer: "Return JSON with city=Paris and country=France"
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 50
    structured:
      schema:
        type: object
        properties:
          city: { type: string }
          country: { type: string }
        required: [city, country]

  - id: use_fields
    depends_on: [extract]
    with:
      city: $extract.city
      country: $extract.country
    exec: "echo '{{with.city}} is in {{with.country}}'"
