# COMBO: structured with retry
schema: nika/workflow@0.12
model: gpt-4.1-mini
workflow: combo-structured-retry

tasks:
  - id: seed
    exec: "echo 'Generate metadata'"

  - id: extract
    depends_on: [seed]
    with:
      instruction: $seed
    provider: openai
    infer:
      prompt: "{{with.instruction}}: Return JSON with title and score (1-10)"
      max_tokens: 50
    structured:
      schema:
        type: object
        properties:
          title: { type: string }
          score: { type: integer }
        required: [title, score]
      max_retries: 2
