# COMPLEX-22: Artifact with complex template using multiple bindings and placeholders
# Tests: {{output}}, {{with.*}}, {{inputs.*}} in artifact template simultaneously
schema: nika/workflow@0.12
model: gpt-4.1-mini
workflow: complex-artifact-template

artifacts:
  dir: ./examples/gates/.test-output/artifacts

inputs:
  project:
    default: "nika-report"
  version:
    default: "1.0"
  author:
    default: "nika-bot"

tasks:
  - id: get_timestamp
    exec: "date -u +%Y-%m-%dT%H:%M:%SZ"

  - id: get_hostname
    exec: "hostname"

  - id: generate_body
    depends_on: [get_timestamp]
    with:
      ts: $get_timestamp | trim
    infer: |
      Write a 3-sentence project status report for {{inputs.project}} v{{inputs.version}}.
      Current time: {{with.ts}}
    provider: openai
    
    max_tokens: 150
    description: "Generate report body with inputs and timestamp binding"

  - id: generate_summary
    depends_on: [generate_body]
    with:
      body: $generate_body | trim
    infer: "Summarize this in one sentence: {{with.body}}"
    provider: openai
    
    max_tokens: 60
    description: "Generate executive summary from body"

  - id: publish_report
    depends_on: [generate_body, generate_summary, get_timestamp, get_hostname]
    with:
      body: $generate_body | trim
      summary: $generate_summary | trim
      ts: $get_timestamp | trim
      host: $get_hostname | trim
    infer: "Finalize this report by adding a conclusion: {{with.body}}"
    provider: openai
    
    max_tokens: 200
    artifact:
      path: "report-{{inputs.project}}-v{{inputs.version}}.md"
      template: |
        # {{inputs.project}} v{{inputs.version}}
        **Author:** {{inputs.author}}
        **Generated:** {{with.ts}} on {{with.host}}

        ## Executive Summary
        {{with.summary}}

        ## Full Report
        {{output}}

        ---
        *Generated by Nika workflow engine*
      format: text
    description: "Complex artifact template with 6+ interpolation points"
