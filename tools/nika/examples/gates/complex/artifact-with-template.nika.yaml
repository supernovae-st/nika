# COMPLEX-69: Complex artifact template with multiple {{with.x}} and {{inputs.y}} refs
# Tests: template interpolation with many variables, multi-line templates
schema: nika/workflow@0.12
model: gpt-4.1-mini
workflow: complex-artifact-template

artifacts:
  dir: ./examples/gates/.test-output/artifacts

inputs:
  author:
    default: "Nika Team"
  version:
    default: "0.30"
  date:
    default: "2025-12-15"

tasks:
  - id: get_title
    infer: "Generate a creative 5-word title for a software release. Reply with the title only."
    provider: openai
    
    max_tokens: 30
    description: "Generate release title"

  - id: get_highlights
    infer: "List 3 highlights for a v0.30 release of a workflow engine. Return as JSON array of strings."
    provider: openai
    
    max_tokens: 100
    description: "Generate release highlights"

  - id: get_stats
    exec: 'echo ''{"tests":142,"pass_rate":"97%","new_features":8}'''
    description: "Release statistics"

  - id: release_notes
    depends_on: [get_title, get_highlights, get_stats]
    with:
      title: $get_title | trim
      highlights: $get_highlights
      stats: $get_stats
    infer: |
      Write a 3-sentence release description for: {{with.title}}
      Highlights: {{with.highlights}}
      Stats: {{with.stats}}
    provider: openai
    
    max_tokens: 150
    artifact:
      path: "release-v{{inputs.version}}.md"
      template: |
        # {{with.title}}

        **Version:** {{inputs.version}}
        **Author:** {{inputs.author}}
        **Date:** {{inputs.date}}

        ## Description

        {{output}}

        ## Highlights

        {{with.highlights}}

        ## Statistics

        {{with.stats}}

        ---
        Generated by Nika v{{inputs.version}}
      format: text
    description: "Release notes with complex multi-variable template"
