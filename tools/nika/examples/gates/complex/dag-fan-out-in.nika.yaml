# COMPLEX-31: Fan-out/fan-in — 1 source -> 5 parallel branches -> 1 merge
# Tests: wide fan-out, parallel execution, 5-way merge, binding from all branches
schema: nika/workflow@0.12
model: gpt-4.1-mini
workflow: complex-dag-fan-out-in

tasks:
  - id: source
    exec: "echo 'ANALYSIS_TARGET: distributed systems'"
    description: "Single source feeding 5 branches"

  - id: branch_perf
    depends_on: [source]
    with: { data: $source }
    infer: "Analyze performance aspects of: {{with.data}}. One sentence."
    provider: openai
    
    max_tokens: 60

  - id: branch_security
    depends_on: [source]
    with: { data: $source }
    infer: "Analyze security aspects of: {{with.data}}. One sentence."
    provider: openai
    
    max_tokens: 60

  - id: branch_cost
    depends_on: [source]
    with: { data: $source }
    infer: "Analyze cost aspects of: {{with.data}}. One sentence."
    provider: openai
    
    max_tokens: 60

  - id: branch_scalability
    depends_on: [source]
    with: { data: $source }
    infer: "Analyze scalability aspects of: {{with.data}}. One sentence."
    provider: openai
    
    max_tokens: 60

  - id: branch_reliability
    depends_on: [source]
    with: { data: $source }
    infer: "Analyze reliability aspects of: {{with.data}}. One sentence."
    provider: openai
    
    max_tokens: 60

  - id: merge_all
    depends_on: [branch_perf, branch_security, branch_cost, branch_scalability, branch_reliability]
    with:
      perf: $branch_perf | trim
      sec: $branch_security | trim
      cost: $branch_cost | trim
      scale: $branch_scalability | trim
      rel: $branch_reliability | trim
    infer: |
      Synthesize these 5 analysis dimensions into a comprehensive 3-sentence assessment:
      Performance: {{with.perf}}
      Security: {{with.sec}}
      Cost: {{with.cost}}
      Scalability: {{with.scale}}
      Reliability: {{with.rel}}
    provider: openai
    
    max_tokens: 200
    description: "5-way merge of all parallel branches"
