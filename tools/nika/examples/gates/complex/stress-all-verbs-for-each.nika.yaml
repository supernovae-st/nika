# COMPLEX-97: All 5 verbs inside for_each loops
# Tests: exec/infer/fetch/agent each used in for_each, binding between for_each tasks
schema: nika/workflow@0.12
workflow: complex-stress-verbs-foreach

artifacts:
  dir: ./examples/gates/.test-output/artifacts

tasks:
  # Source items
  - id: items
    exec: 'echo ''["alpha","beta","gamma"]'''

  # for_each with exec
  - id: foreach_exec
    depends_on: [items]
    for_each: "$items"
    as: item
    exec:
      command: "echo 'EXEC_{{with.item}}_'$(date +%s%N | tail -c 4)"
      shell: true
    description: "for_each with exec verb"

  # for_each with infer
  - id: foreach_infer
    depends_on: [items]
    for_each: "$items"
    as: item
    infer: "Define '{{with.item}}' in exactly 5 words."
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 30
    description: "for_each with infer verb"

  # for_each with fetch
  - id: foreach_fetch
    depends_on: [items]
    for_each: "$items"
    as: item
    fetch:
      url: "https://httpbin.org/get?item={{with.item}}"
      method: GET
    description: "for_each with fetch verb"

  # for_each with agent
  - id: foreach_agent
    depends_on: [items]
    for_each: "$items"
    as: item
    concurrency: 1
    agent:
      prompt: "For item '{{with.item}}': Call nika_complete with result='AGENT_{{with.item}}' confidence=1.0 reasoning='processed {{with.item}}'"
      provider: openai
      model: gpt-4.1-mini
      max_turns: 2
      tools: [builtin]
    description: "for_each with agent verb"

  # for_each with infer + artifact
  - id: foreach_artifact
    depends_on: [items]
    for_each: "$items"
    as: item
    infer: "Write a one-sentence note about {{with.item}}."
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 30
    artifact:
      path: "verb-{{with.item}}.txt"
      format: text
    description: "for_each with artifact"

  # Merge all for_each results
  - id: mega_merge
    depends_on: [foreach_exec, foreach_infer, foreach_fetch, foreach_agent, foreach_artifact]
    with:
      execs: $foreach_exec
      infers: $foreach_infer
      fetches: $foreach_fetch
      agents: $foreach_agent
      artifacts_out: $foreach_artifact
    infer: |
      Five for_each batches completed:
      - exec: {{with.execs}}
      - infer: {{with.infers}}
      - fetch: (data received)
      - agent: {{with.agents}}
      - artifacts: {{with.artifacts_out}}
      Summarize in 2 sentences.
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 100
    description: "Merge all 5 verb for_each results"
