# COMPLEX-50: The ULTIMATE stress test — the most complex workflow possible
# Combines: all 5 verbs, diamond DAG, for_each, agents, structured output,
# artifacts, transforms, fallbacks, context files, inputs, env bindings, multi-provider
schema: nika/workflow@0.12
workflow: complex-stress-ultimate
description: "Maximum complexity workflow testing every Nika feature simultaneously"
model: gpt-4o

artifacts:
  dir: ./examples/gates/.test-output/artifacts/ultimate
  manifest: true

inputs:
  domain:
    default: "AI infrastructure"
  version:
    default: "3.0"
  author:
    default: "nika"
  lang:
    default: "en"

context:
  files:
    style: ./examples/context/style-guide.md

log:
  level: debug

mcp:
  echo-server:
    command: echo
    args: ["ultimate-mcp"]

tasks:
  # === LAYER 0: Data Sources (4 parallel) ===
  - id: env_snapshot
    with:
      home: $env.HOME
      user: $env.USER
      shell_path: $env.SHELL
    exec:
      command: "echo '{\"user\":\"{{with.user}}\",\"home\":\"{{with.home}}\",\"shell\":\"{{with.shell_path}}\",\"ts\":\"'$(date +%s)'\"}'"
      shell: true
    description: "L0: Env vars as JSON"

  - id: http_data
    fetch:
      url: "https://httpbin.org/get?domain={{inputs.domain}}&version={{inputs.version}}"
      method: GET
    description: "L0: Fetch with inputs in URL"

  - id: static_items
    exec: 'printf ''["architecture","performance","security","observability","testing"]'''
    description: "L0: 5 items for for_each"

  - id: seed_prompt
    infer: "Generate a 1-sentence thesis about {{inputs.domain}} v{{inputs.version}}."
    provider: openai
    model: gpt-4o-mini
    max_tokens: 60
    description: "L0: LLM seed generation"

  # === LAYER 1: Processing Diamond (depends on L0) ===
  - id: analyze_env
    depends_on: [env_snapshot]
    with:
      env: $env_snapshot
      user: $env_snapshot.user ?? "unknown"
    infer: "Describe this dev environment in 1 sentence: {{with.env}}. User: {{with.user}}"
    provider: openai
    model: gpt-4o-mini
    max_tokens: 80
    description: "L1-left: Analyze env with fallback"

  - id: extract_http
    depends_on: [http_data]
    with:
      raw: $http_data
    infer: "Extract the URL and query params from: {{with.raw}}"
    provider: openai
    model: gpt-4o-mini
    max_tokens: 100
    structured:
      schema:
        type: object
        properties:
          url:
            type: string
          params:
            type: object
            properties:
              domain:
                type: string
              version:
                type: string
            required: [domain, version]
        required: [url, params]
    description: "L1-right: Structured extraction from HTTP response"

  # === LAYER 2: Fan-out for_each (depends on L0+L1) ===
  - id: deep_analysis
    depends_on: [static_items, seed_prompt]
    for_each: "$static_items"
    as: topic
    concurrency: 3
    with:
      thesis: $seed_prompt | trim
    infer: |
      Following this style: {{context.files.style}}
      Thesis: {{with.thesis}}
      Write 1 sentence analyzing '{{with.topic}}' in the context of {{inputs.domain}}.
    provider: openai
    model: gpt-4o-mini
    max_tokens: 80
    description: "L2: for_each with concurrency, context, transforms, and inputs"

  # === LAYER 2b: Agent (parallel with for_each) ===
  - id: review_agent
    depends_on: [seed_prompt]
    provider: openai
    model: gpt-4o-mini
    with:
      thesis: $seed_prompt | trim
    agent:
      prompt: |
        You are reviewing the thesis: {{with.thesis}}
        Domain: {{inputs.domain}}
        1. Log that you're starting the review
        2. Complete with your assessment
        Call nika_complete with result="thesis reviewed" confidence=0.85 reasoning="domain review"
      provider: openai
      model: gpt-4o-mini
      tools: [nika_complete, nika_log, nika_emit]
      max_turns: 4
      max_tokens: 150
      system: "You are a domain expert reviewer."
    description: "L2b: Agent reviewing the thesis in parallel"

  # === LAYER 3: Diamond merge (depends on L1+L2) ===
  - id: merge_left
    depends_on: [analyze_env, deep_analysis]
    with:
      env_analysis: $analyze_env | trim
      topic_analyses: $deep_analysis
    infer: |
      Combine environment analysis and topic deep-dives:
      Env: {{with.env_analysis}}
      Topics: {{with.topic_analyses}}
      2 sentences.
    provider: openai
    model: gpt-4o-mini
    max_tokens: 150
    description: "L3-left: Merge env + for_each results"

  - id: merge_right
    depends_on: [extract_http, review_agent]
    with:
      http: $extract_http
      review: $review_agent
    exec:
      command: "echo 'HTTP: {{with.http}}' | head -c 150 && echo '' && echo 'REVIEW: {{with.review}}' | head -c 150"
      shell: true
    description: "L3-right: Merge HTTP + agent results"

  # === LAYER 4: Cross-merge + structured consolidation ===
  - id: consolidate
    depends_on: [merge_left, merge_right, seed_prompt]
    with:
      left: $merge_left | trim
      right: $merge_right | trim
      thesis: $seed_prompt | trim
    infer: |
      Consolidate all analyses into a structured report:
      Left branch: {{with.left}}
      Right branch: {{with.right}}
      Original thesis: {{with.thesis}}
    provider: openai
    model: gpt-4o-mini
    max_tokens: 200
    structured:
      schema:
        type: object
        properties:
          title:
            type: string
          executive_summary:
            type: string
          key_findings:
            type: array
            items:
              type: string
          risk_level:
            type: string
            enum: [low, medium, high]
          confidence:
            type: number
        required: [title, executive_summary, key_findings, risk_level, confidence]
    description: "L4: Structured consolidation from both branches"

  # === LAYER 5: Parallel artifact generation ===
  - id: save_json_report
    depends_on: [consolidate]
    with:
      report: $consolidate
    exec: "echo '{{with.report}}'"
    artifact:
      path: "ultimate-{{inputs.domain}}-v{{inputs.version}}.json"
      source: report
      format: json
    description: "L5a: JSON artifact"

  - id: save_text_report
    depends_on: [consolidate, env_snapshot]
    with:
      title: $consolidate.title
      summary: $consolidate.executive_summary
      findings: $consolidate.key_findings
      risk: $consolidate.risk_level
      env: $env_snapshot.user ?? "unknown"
    infer: |
      Format this as a polished markdown report:
      Title: {{with.title}}
      Summary: {{with.summary}}
      Findings: {{with.findings}}
      Risk: {{with.risk}}
    provider: openai
    model: gpt-4o-mini
    max_tokens: 200
    artifact:
      path: "ultimate-{{inputs.domain}}-v{{inputs.version}}.md"
      template: |
        # {{with.title}}
        **Author:** {{inputs.author}} | **Version:** {{inputs.version}} | **Lang:** {{inputs.lang}}
        **User:** {{with.env}} | **Risk:** {{with.risk}}

        ## Executive Summary
        {{with.summary}}

        ## Report
        {{output}}

        ---
        *Generated by Nika ULTIMATE workflow*
      format: text
    description: "L5b: Text artifact with complex template"

  # === LAYER 6: Mock comparison (multi-provider) ===
  - id: mock_summary
    depends_on: [consolidate]
    with:
      summary: $consolidate.executive_summary
    infer: "Rewrite this summary: {{with.summary}}"
    provider: mock
    max_tokens: 80
    description: "L6: Mock provider comparison"

  # === LAYER 7: Final verification ===
  - id: ultimate_final
    depends_on: [save_json_report, save_text_report, mock_summary, consolidate]
    with:
      json_done: $save_json_report | trim
      text_done: $save_text_report | trim
      mock_out: $mock_summary | trim
      title: $consolidate.title
      risk: $consolidate.risk_level
      confidence: $consolidate.confidence
    exec:
      command: |
        echo "========================================="
        echo "  ULTIMATE WORKFLOW COMPLETE"
        echo "========================================="
        echo "Title: {{with.title}}"
        echo "Risk: {{with.risk}}"
        echo "Confidence: {{with.confidence}}"
        echo "JSON artifact: saved"
        echo "Text artifact: saved"
        echo "Mock comparison: {{with.mock_out}}"
        echo "Domain: {{inputs.domain}}"
        echo "Version: {{inputs.version}}"
        echo "Author: {{inputs.author}}"
        echo "========================================="
      shell: true
    description: "L7: Final verification — all features exercised"
