# COMPLEX-86: Schema with all JSON Schema features — strict validation
# Tests: required, enum, minLength, maxLength, minimum, maximum, pattern in structured output
schema: nika/workflow@0.12
workflow: complex-structured-strict

tasks:
  - id: strict_schema
    infer: |
      Generate a JSON object for a user registration:
      - username: 3-20 chars, lowercase letters only
      - email: valid email format
      - age: between 18 and 120
      - role: must be "admin", "user", or "viewer"
      - bio: 10-200 characters
      Use realistic values.
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 200
    structured:
      schema:
        type: object
        properties:
          username:
            type: string
            minLength: 3
            maxLength: 20
          email:
            type: string
          age:
            type: integer
            minimum: 18
            maximum: 120
          role:
            type: string
            enum: ["admin", "user", "viewer"]
          bio:
            type: string
            minLength: 10
            maxLength: 200
        required: [username, email, age, role, bio]
    description: "Strict schema with constraints"

  - id: verify
    depends_on: [strict_schema]
    with:
      user: $strict_schema
    infer: "Verify this user object is valid: {{with.user}}. Check all fields exist. Reply VALID or INVALID with reason."
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 50
    description: "Verify strict schema output"
