# DEEP-02: Test nika:complete builtin for structured agent termination
schema: nika/workflow@0.12
workflow: deep-02-builtin-complete

tasks:
  - id: complete_test
    agent:
      prompt: |
        Your task: calculate 7 * 8 and call the nika:complete tool with:
        - result: the answer as a string
        - confidence: 1.0
        - reasoning: "simple multiplication"
      provider: openai
      model: gpt-4.1-mini
      max_turns: 3
      tools: [builtin]
    description: "Agent should call nika:complete to signal task completion"
