# DEEP-05: Same structured schema across different providers
# Verifies schema enforcement works identically on OpenAI vs xAI
schema: nika/workflow@0.12
workflow: deep-05-cross-provider

tasks:
  - id: openai_extract
    infer: "Extract: The Eiffel Tower in Paris is 330m tall, built in 1889"
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 200
    structured:
      schema:
        type: object
        properties:
          landmark:
            type: string
          city:
            type: string
          height_meters:
            type: integer
          year_built:
            type: integer
        required: [landmark, city, height_meters, year_built]

  - id: xai_extract
    infer: "Extract: The Statue of Liberty in New York is 93m tall, built in 1886"
    provider: xai
    model: grok-3-fast
    max_tokens: 200
    structured:
      schema:
        type: object
        properties:
          landmark:
            type: string
          city:
            type: string
          height_meters:
            type: integer
          year_built:
            type: integer
        required: [landmark, city, height_meters, year_built]

  - id: compare
    depends_on: [openai_extract, xai_extract]
    with:
      openai: $openai_extract
      xai: $xai_extract
    exec: "echo 'OpenAI: {{with.openai}}\nxAI: {{with.xai}}'"
    description: "Compare structured output from both providers"
