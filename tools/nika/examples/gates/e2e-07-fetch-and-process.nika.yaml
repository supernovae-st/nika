# E2E-07: Fetch HTTP + process with LLM
schema: nika/workflow@0.12
workflow: e2e-07-fetch

tasks:
  - id: fetch_data
    fetch:
      url: "https://httpbin.org/json"
      method: GET

  - id: summarize
    depends_on: [fetch_data]
    with:
      data: $fetch_data
    infer: "Summarize this JSON data in one sentence: {{with.data}}"
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 100
