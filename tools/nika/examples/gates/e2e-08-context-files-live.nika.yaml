# E2E-08: context.files with REAL file content (BUG-1 regression test)
schema: nika/workflow@0.12
workflow: e2e-08-context-files

context:
  files:
    brand: ./examples/context/brand.md
    persona: ./examples/context/persona.json

tasks:
  - id: use_brand
    infer: |
      Read the following brand document and tell me the brand name in one word:
      {{context.files.brand}}
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 50

  - id: use_persona
    infer: |
      Read this persona JSON and tell me the persona's role in one sentence:
      {{context.files.persona}}
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 100
