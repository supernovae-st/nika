# E2E-10: Complex pipeline — exec + infer + structured + artifact + for_each
schema: nika/workflow@0.12
workflow: e2e-10-complex

artifacts:
  dir: ./examples/gates/.test-output/artifacts

inputs:
  topic:
    default: "AI safety"

tasks:
  - id: timestamp
    exec: "date +%Y%m%d-%H%M%S"

  - id: research
    infer: |
      List exactly 3 key points about {{inputs.topic}}.
      Return as a JSON array of strings, nothing else.
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 200

  - id: expand
    depends_on: [research]
    for_each: "$research"
    as: point
    infer: "Expand this point into one paragraph (50 words max): {{with.point}}"
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 150

  - id: compile
    depends_on: [expand, timestamp]
    with:
      paragraphs: $expand
      ts: $timestamp
    infer: |
      Compile these paragraphs into a short article:
      {{with.paragraphs}}

      Add a title and date: {{with.ts}}
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 500
    artifact:
      path: "article-{{with.ts}}.md"
      format: text
