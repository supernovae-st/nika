schema: nika/workflow@0.12
workflow: feat-agent-from-def
agents:
  researcher:
    system: "You are a research assistant. Complete the task immediately."
    provider: openai
    model: gpt-4.1-mini
    tools: [builtin]
    max_turns: 2
tasks:
  - id: research
    agent:
      prompt: "Say DONE and complete"
      provider: openai
      model: gpt-4.1-mini
      tools: [builtin]
      max_turns: 2
      max_tokens: 50
