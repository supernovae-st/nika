# FEATURE: agent with 4+ tools
schema: nika/workflow@0.12
model: gpt-4.1-mini
workflow: feat-agent-multi-tool
tasks:
  - id: multi
    agent:
      prompt: "Call nika_log with message='hello', then call nika_complete with result='DONE' confidence=1.0 reasoning='multi-tool test'"
      provider: openai
      
      max_turns: 3
      tools: [nika_complete, nika_log, nika_sleep, nika_read]
