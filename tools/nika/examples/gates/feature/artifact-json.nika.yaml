schema: nika/workflow@0.12
workflow: feat-artifact-json
artifacts:
  dir: ./examples/gates/.test-output/artifacts
tasks:
  - id: gen
    infer: "Return a JSON object with name=Nika and version=0.30"
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 50
    artifact:
      path: data.json
      format: json
