# FEATURE: artifact with custom path
schema: nika/workflow@0.12
model: gpt-4.1-mini
workflow: feat-artifact-path
artifacts:
  dir: ./examples/gates/.test-output/artifacts
tasks:
  - id: gen
    infer: "Say hello in one word"
    provider: openai
    
    max_tokens: 50
    artifact:
      path: custom/hello.txt
