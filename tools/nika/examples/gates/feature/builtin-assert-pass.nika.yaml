schema: nika/workflow@0.12
workflow: feat-builtin-assert-pass
tasks:
  - id: assert_ok
    agent:
      prompt: "Call nika_assert with condition=true and message='this should pass'. Then call nika_complete with result='ASSERT_PASS'"
      tools: [builtin]
      max_turns: 3
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 100
