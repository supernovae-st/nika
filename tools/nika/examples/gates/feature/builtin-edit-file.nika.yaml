schema: nika/workflow@0.12
workflow: feat-builtin-edit-file
tasks:
  - id: setup
    exec: "echo 'original content' > /tmp/nika-test-edit.txt"
  - id: editor
    depends_on: [setup]
    agent:
      prompt: "Call nika_edit with path='/tmp/nika-test-edit.txt', old_string='original' and new_string='modified'. Then call nika_complete with result='EDIT_OK'"
      tools: [builtin]
      max_turns: 3
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 100
