schema: nika/workflow@0.12
workflow: feat-builtin-log-levels
tasks:
  - id: logger
    agent:
      prompt: "Call nika_log three times: first with level='info' message='info msg', then level='warn' message='warn msg', then level='debug' message='debug msg'. Then call nika_complete with result='LOGGED'"
      tools: [builtin]
      max_turns: 5
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 150
