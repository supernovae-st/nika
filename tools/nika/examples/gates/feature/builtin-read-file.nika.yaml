schema: nika/workflow@0.12
workflow: feat-builtin-read-file
tasks:
  - id: reader
    agent:
      prompt: "Call nika_read with path='./README.md'. Then call nika_complete with result='READ_OK'"
      tools: [builtin]
      max_turns: 3
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 100
