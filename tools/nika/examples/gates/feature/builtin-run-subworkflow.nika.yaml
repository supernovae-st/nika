schema: nika/workflow@0.12
model: gpt-4.1-mini
workflow: feat-builtin-run-subworkflow
tasks:
  - id: runner
    agent:
      prompt: "Call nika_run with path='./examples/gates/feature/partials/helper.nika.yaml'. Then call nika_complete with result='RUN_OK'"
      tools: [builtin]
      max_turns: 3
    provider: openai
    
    max_tokens: 100
