# FEATURE: MCP invoke with Firecrawl (scrape a webpage)
schema: nika/workflow@0.12
model: gpt-4.1-mini
workflow: feat-mcp-firecrawl

mcp:
  firecrawl:
    command: npx
    args: ["-y", "firecrawl-mcp"]
    env:
      FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY}"

tasks:
  - id: scrape
    invoke:
      mcp: firecrawl
      tool: firecrawl_scrape
      params:
        url: "https://docs.rs/rig-core/latest/rig/"
    description: "Scrape rig-core docs via Firecrawl MCP"

  - id: summarize
    depends_on: [scrape]
    with:
      content: $scrape
    infer: "Summarize this page in 2 sentences: {{with.content}}"
    provider: openai
    
    max_tokens: 100
