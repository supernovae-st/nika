# FEATURE: diamond dependency pattern (a->b, a->c, b->d, c->d)
schema: nika/workflow@0.12
workflow: feat-multi-task-diamond
tasks:
  - id: a
    exec: "echo A"
  - id: b
    exec: "echo B"
    depends_on: [a]
  - id: c
    exec: "echo C"
    depends_on: [a]
  - id: d
    exec: "echo D"
    depends_on: [b, c]
