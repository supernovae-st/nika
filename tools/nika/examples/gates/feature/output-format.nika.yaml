# FEATURE: output: with format and schema
schema: nika/workflow@0.12
model: gpt-4.1-mini
workflow: feat-output-format

tasks:
  - id: json_output
    infer: "Return a JSON object with keys: name (string) and age (number). Use name=Nika age=1."
    provider: openai
    
    max_tokens: 50
    output:
      format: json
    description: "output: format: json should validate JSON response"
