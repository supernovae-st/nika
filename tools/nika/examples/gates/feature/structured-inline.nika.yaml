# FEATURE: structured: with inline schema
schema: nika/workflow@0.12
workflow: feat-structured-inline
tasks:
  - id: extract
    infer: "Return a JSON object with name and age fields for a person named Alice who is 30"
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 50
    structured:
      schema:
        type: object
        properties:
          name:
            type: string
          age:
            type: integer
        required: [name, age]
