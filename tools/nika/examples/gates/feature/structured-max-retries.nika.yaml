schema: nika/workflow@0.12
workflow: feat-structured-max-retries
tasks:
  - id: extract
    infer: "Return JSON with name='Alice' and age=30"
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 50
    structured:
      schema:
        type: object
        properties:
          name:
            type: string
          age:
            type: integer
        required: [name, age]
      max_retries: 3
