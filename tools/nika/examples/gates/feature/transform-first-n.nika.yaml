# FEATURE: with: { val: $step | first(2) } — take first N items
schema: nika/workflow@0.12
workflow: feat-transform-first-n
tasks:
  - id: gen
    exec:
      command: "echo '[\"a\",\"b\",\"c\",\"d\",\"e\"]'"
      shell: true
  - id: use
    with:
      val: $gen | parse_json | first(2)
    exec:
      command: "echo {{with.val}}"
      shell: true
    depends_on: [gen]
