# FEATURE: with: { val: $step | last(2) } — take last N items
schema: nika/workflow@0.12
workflow: feat-transform-last-n
tasks:
  - id: gen
    exec:
      command: "echo '[\"a\",\"b\",\"c\",\"d\",\"e\"]'"
      shell: true
  - id: use
    with:
      val: $gen | parse_json | last(2)
    exec:
      command: "echo {{with.val}}"
      shell: true
    flow: [gen]
