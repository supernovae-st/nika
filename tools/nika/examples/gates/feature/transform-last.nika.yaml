schema: nika/workflow@0.12
workflow: feat-transform-last
tasks:
  - id: gen
    exec:
      command: "echo '[\"alpha\",\"beta\",\"gamma\"]'"
      shell: true
  - id: use
    with:
      val: $gen | parse_json | last
    exec:
      command: "echo Last is {{with.val}}"
      shell: true
    depends_on: [gen]
