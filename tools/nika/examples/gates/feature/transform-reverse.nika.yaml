schema: nika/workflow@0.12
workflow: feat-transform-reverse
tasks:
  - id: gen
    exec:
      command: "echo '[\"alpha\",\"beta\",\"gamma\"]'"
      shell: true
  - id: use
    with:
      val: $gen | parse_json | reverse
    exec:
      command: "echo Reversed is {{with.val}}"
      shell: true
    flow: [gen]
