# FEATURE: using {{context.files.x}} in template after context: files loading
schema: nika/workflow@0.12
workflow: feat-with-binding-context
context:
  files:
    readme: ./README.md
tasks:
  - id: use_context
    exec:
      command: "echo Context loaded: {{context.files.readme}} | head -c 50"
      shell: true
