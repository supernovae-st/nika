# GATE-5: with: binding contains data (not empty)
# GATE-7: depends_on: blocks execution correctly
#
# Run: nika run examples/gates/gate-05-with-binding.nika.yaml

schema: nika/workflow@0.12
workflow: gate-05-with-binding
description: "Validate with: bindings contain upstream data and depends_on works"

tasks:
  - id: step_one
    exec: "echo 'DATA_FROM_STEP_ONE'"
    description: "Produces output for downstream binding"

  - id: step_two
    depends_on: [step_one]
    with:
      upstream: $step_one
    exec: "echo 'received: {{with.upstream}}'"
    description: "Should print 'received: DATA_FROM_STEP_ONE' — not empty"

  - id: verify
    depends_on: [step_two]
    with:
      result: $step_two
    exec: "echo 'final: {{with.result}}'"
    description: "Chains two levels of dependencies"
