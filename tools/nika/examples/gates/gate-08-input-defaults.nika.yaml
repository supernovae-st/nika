# GATE-8: inputs: default values applied correctly
#
# Run: nika run examples/gates/gate-08-input-defaults.nika.yaml

schema: nika/workflow@0.12
workflow: gate-08-input-defaults
description: "Validate inputs with default values are applied"

inputs:
  name:
    default: "World"
  count:
    default: 3

tasks:
  - id: greet
    exec: "echo 'Hello, {{inputs.name}}! Count={{inputs.count}}'"
    description: "Should output 'Hello, World! Count=3' when no overrides"
