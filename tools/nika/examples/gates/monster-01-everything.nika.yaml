# MONSTER-01: The most complex workflow possible — tests EVERY feature
schema: nika/workflow@0.12
workflow: monster-01-everything

artifacts:
  dir: ./examples/gates/.test-output/artifacts

inputs:
  seed:
    default: "42"
  lang:
    default: "en"

context:
  files:
    style: ./examples/context/style-guide.md

tasks:
  # === LAYER 1: Data Sources (parallel) ===
  - id: env_data
    exec:
      command: "echo '{\"user\":\"'$USER'\",\"pid\":\"'$$'\",\"seed\":\"{{inputs.seed}}\"}'"
      shell: true
    description: "Shell exec with env vars and inputs"

  - id: http_data
    fetch:
      url: "https://httpbin.org/get?lang={{inputs.lang}}"
      method: GET
    description: "Fetch with input interpolation in URL"

  - id: static_items
    exec: 'echo ''["alpha","beta","gamma","delta"]'''
    description: "Static array for for_each"

  # === LAYER 2: Processing (depends on L1) ===
  - id: analyze_env
    depends_on: [env_data]
    with:
      user: $env_data.user
      seed: $env_data.seed
    infer: "User '{{with.user}}' with seed '{{with.seed}}'. Generate a 1-sentence creative prompt."
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 60
    description: "Nested JSON binding + infer"

  - id: structured_extract
    depends_on: [http_data]
    with:
      raw: $http_data
    infer: |
      Extract from this HTTP response:
      {{with.raw}}
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 200
    structured:
      schema:
        type: object
        properties:
          url:
            type: string
          args:
            type: object
            properties:
              lang:
                type: string
            required: [lang]
        required: [url, args]
    description: "Structured output extraction"

  # === LAYER 3: Fan-out (for_each with xAI) ===
  - id: process_items
    depends_on: [static_items, analyze_env]
    for_each: "$static_items"
    as: item
    with:
      prompt_ctx: $analyze_env
    infer: "For '{{with.item}}': {{with.prompt_ctx}}. Answer in exactly 1 sentence."
    provider: xai
    model: grok-3-fast
    max_tokens: 60
    description: "for_each with xAI + binding from upstream"

  # === LAYER 4: Aggregation ===
  - id: merge_all
    depends_on: [process_items, structured_extract, env_data]
    with:
      items: $process_items
      extracted: $structured_extract
      env: $env_data
    exec:
      command: |
        echo "Items: {{with.items}}" | head -c 200
        echo ""
        echo "Extracted URL: {{with.extracted}}" | head -c 100
        echo ""
        echo "Env: {{with.env}}" | head -c 100
      shell: true
    description: "Merge all upstream data"

  # === LAYER 5: Final compile + artifact ===
  - id: final_report
    depends_on: [merge_all]
    with:
      merged: $merge_all
    infer: |
      Style: {{context.files.style}}

      Compile this into a clean 3-sentence summary:
      {{with.merged}}
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 200
    artifact:
      path: "monster-report-{{inputs.seed}}.md"
      template: "# Monster Report (seed={{inputs.seed}})\n\n{{output}}\n\n---\nLang: {{inputs.lang}}"
      format: text
    description: "Final report with artifact template"
