# MONSTER-02: Error resilience — workflow survives partial failures
schema: nika/workflow@0.12
workflow: monster-02-resilience

tasks:
  # Succeeds
  - id: good1
    exec: "echo 'GOOD1'"

  # Fails (exit code 1 in shell mode)
  - id: bad1
    exec:
      command: "exit 1"
      shell: true

  # Independent of bad1 — should succeed
  - id: good2
    exec: "echo 'GOOD2'"

  # Depends on good1 — should succeed
  - id: uses_good1
    depends_on: [good1]
    with:
      data: $good1
    exec: "echo 'FROM_GOOD1={{with.data}}'"

  # Depends on bad1 — should be marked as dependency-failed
  - id: uses_bad1
    depends_on: [bad1]
    with:
      data: $bad1 ?? "FALLBACK"
    exec: "echo 'FROM_BAD1={{with.data}}'"

  # Depends on BOTH good and bad — should be blocked by bad1
  - id: needs_both
    depends_on: [good1, bad1]
    with:
      g: $good1
      b: $bad1 ?? "MISSING"
    exec: "echo 'BOTH={{with.g}}+{{with.b}}'"

  # Fan-out with one failing item
  - id: items
    exec: 'echo ''["ok1","fail","ok2"]'''

  - id: fanout
    depends_on: [items]
    for_each: "$items"
    as: item
    fail_fast: false
    exec:
      command: "if [ '{{with.item}}' = 'fail' ]; then exit 1; fi; echo 'ITEM={{with.item}}'"
      shell: true
