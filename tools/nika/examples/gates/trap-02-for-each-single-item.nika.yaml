# TRAP-02: for_each with single item array — edge case
schema: nika/workflow@0.12
workflow: trap-02-single-foreach

tasks:
  - id: one_item
    exec: 'echo ''["only"]'''

  - id: process
    depends_on: [one_item]
    for_each: "$one_item"
    as: item
    exec: "echo 'ITEM={{with.item}}'"

  - id: collect
    depends_on: [process]
    with:
      results: $process
    exec: "echo 'RESULTS={{with.results}}'"
    description: "Single item for_each should still work and produce array result"
