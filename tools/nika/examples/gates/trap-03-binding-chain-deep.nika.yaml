# TRAP-03: 4-level binding chain A→B→C→D — data should flow all the way
schema: nika/workflow@0.12
workflow: trap-03-chain-deep

tasks:
  - id: origin
    exec: "echo 'ORIGINAL_DATA'"

  - id: step1
    depends_on: [origin]
    with:
      input: $origin
    exec: "echo 'S1({{with.input}})'"

  - id: step2
    depends_on: [step1]
    with:
      input: $step1
    exec: "echo 'S2({{with.input}})'"

  - id: step3
    depends_on: [step2]
    with:
      input: $step2
    exec: "echo 'S3({{with.input}})'"

  - id: final
    depends_on: [step3]
    with:
      input: $step3
    exec: "echo 'FINAL={{with.input}}'"
    description: "Should be FINAL=S3(S2(S1(ORIGINAL_DATA)))"
