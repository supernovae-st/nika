# TRAP-04: Many parallel tasks writing to same depends_on target
schema: nika/workflow@0.12
workflow: trap-04-parallel

tasks:
  - id: p1
    exec: "echo 'P1'"
  - id: p2
    exec: "echo 'P2'"
  - id: p3
    exec: "echo 'P3'"
  - id: p4
    exec: "echo 'P4'"
  - id: p5
    exec: "echo 'P5'"

  - id: gather
    depends_on: [p1, p2, p3, p4, p5]
    with:
      r1: $p1
      r2: $p2
      r3: $p3
      r4: $p4
      r5: $p5
    exec: "echo '{{with.r1}}-{{with.r2}}-{{with.r3}}-{{with.r4}}-{{with.r5}}'"
    description: "All 5 parallel tasks should complete and bind correctly"
