# TRAP-05: for_each iterating over array of JSON objects (not strings)
schema: nika/workflow@0.12
workflow: trap-05-foreach-objects

tasks:
  - id: data
    exec: 'printf ''[{"name":"Alice","age":30},{"name":"Bob","age":25}]'''

  - id: process
    depends_on: [data]
    for_each: "$data"
    as: person
    exec: "echo 'Name={{with.person}}'"
    description: "Each item should be a JSON object, accessible as {{with.person}}"

  - id: collect
    depends_on: [process]
    with:
      all: $process
    exec: "echo 'All={{with.all}}'"
