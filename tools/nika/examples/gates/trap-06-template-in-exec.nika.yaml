# TRAP-06: Downstream task gets data that could be confused with templates
# Tests that binding values are NOT re-interpreted as templates
schema: nika/workflow@0.12
workflow: trap-06-no-injection

tasks:
  - id: produce
    exec: "echo 'data with special: chars & symbols'"
    description: "Outputs text with special characters"

  - id: consume
    depends_on: [produce]
    with:
      data: $produce
    exec: "echo 'Got: {{with.data}}'"
    description: "Should output the raw data without mangling"
