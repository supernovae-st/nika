# TRAP-07: Large output — test that bindings work with >4KB data
schema: nika/workflow@0.12
workflow: trap-07-large-output

tasks:
  - id: generate_large
    exec: "python3 -c \"print('x' * 10000)\""
    description: "10KB output"

  - id: measure
    depends_on: [generate_large]
    with:
      big: $generate_large
    exec: "echo 'Length={{with.big}}' | wc -c"
    description: "Should handle large binding values"
