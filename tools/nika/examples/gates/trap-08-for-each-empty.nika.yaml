# TRAP-08: for_each with empty array — should handle gracefully
schema: nika/workflow@0.12
workflow: trap-08-empty-foreach

tasks:
  - id: empty
    exec: "echo '[]'"

  - id: process
    depends_on: [empty]
    for_each: "$empty"
    as: item
    exec: "echo 'SHOULD_NOT_RUN={{with.item}}'"

  - id: after
    depends_on: [process]
    with:
      results: $process ?? "no_results"
    exec: "echo 'After={{with.results}}'"
    description: "Empty for_each should produce empty result, not error"
