# TRAP-09: Concurrent artifact writes — race condition test
schema: nika/workflow@0.12
workflow: trap-09-concurrent-artifacts

artifacts:
  dir: ./examples/gates/.test-output/artifacts

tasks:
  - id: w1
    infer: "Write exactly: FILE_ONE"
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 10
    artifact:
      path: concurrent-1.txt
      format: text

  - id: w2
    infer: "Write exactly: FILE_TWO"
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 10
    artifact:
      path: concurrent-2.txt
      format: text

  - id: w3
    infer: "Write exactly: FILE_THREE"
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 10
    artifact:
      path: concurrent-3.txt
      format: text
