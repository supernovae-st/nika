# USE CASE 01: Blog post production pipeline
# Real-world workflow: research → outline → write → review → publish
schema: nika/workflow@0.12
workflow: usecase-01-blog

artifacts:
  dir: ./examples/gates/.test-output/artifacts

inputs:
  topic:
    default: "WebAssembly in 2026"
  tone:
    default: "professional"

tasks:
  # Step 1: Research via web scraping
  - id: research
    fetch:
      url: "https://httpbin.org/json"
      method: GET
    description: "Fetch reference data for the article"

  # Step 2: Generate outline
  - id: outline
    depends_on: [research]
    with:
      data: $research
    infer: |
      Based on this reference data, create a 4-point blog outline for "{{inputs.topic}}".
      Tone: {{inputs.tone}}
      Data: {{with.data}}
      Return as a JSON array of 4 strings (section titles only).
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 150
    description: "Generate article outline"

  # Step 3: Write each section (parallel via for_each)
  - id: write_sections
    depends_on: [outline]
    for_each: "$outline"
    as: section
    infer: |
      Write a 2-sentence paragraph for the blog section titled: "{{with.section}}"
      Topic: {{inputs.topic}}. Tone: {{inputs.tone}}.
    provider: xai
    model: grok-3-fast
    max_tokens: 100
    description: "Write each section with xAI"

  # Step 4: Compile final article
  - id: compile
    depends_on: [write_sections, outline]
    with:
      sections: $write_sections
      titles: $outline
    infer: |
      Compile a blog post from these sections:
      Titles: {{with.titles}}
      Content: {{with.sections}}
      Add a title, intro paragraph, and conclusion.
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 500
    artifact:
      path: "blog-{{inputs.topic}}.md"
      template: "# {{inputs.topic}}\n\n{{output}}\n\n---\n*Generated by Nika*"
      format: text
    description: "Compile final blog post with artifact"
