# VERIFY-01: exec with shell features (env vars, pipes, redirects)
schema: nika/workflow@0.12
workflow: verify-01-exec-shell

tasks:
  - id: env_vars
    exec:
      command: "echo USER=$USER PATH_FIRST=$(echo $PATH | cut -d: -f1)"
      shell: true
    description: "Shell mode should expand $USER and pipe"

  - id: pipe_chain
    exec:
      command: "echo 'hello world' | tr 'a-z' 'A-Z' | wc -c"
      shell: true
    description: "Pipe chain should work in shell mode"

  - id: subshell
    exec:
      command: "echo count=$(ls -1 src/runtime/builtin/*.rs | wc -l | tr -d ' ')"
      shell: true
    description: "Subshell with command substitution"
