# VERIFY-02: for_each fail_fast:false — continues on error
schema: nika/workflow@0.12
workflow: verify-02-failfast

tasks:
  - id: items
    exec: 'echo ''["good","bad","good2"]'''

  - id: process
    depends_on: [items]
    for_each: "$items"
    as: item
    fail_fast: false
    exec:
      command: "if [ '{{with.item}}' = 'bad' ]; then exit 1; fi; echo 'OK={{with.item}}'"
      shell: true
    description: "Second item fails, but third should still run"

  - id: summary
    depends_on: [process]
    with:
      results: $process ?? "partial"
    exec: "echo 'Results={{with.results}}'"
