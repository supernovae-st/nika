# VERIFY-04: Agent uses nika:write to create a file
schema: nika/workflow@0.12
workflow: verify-04-builtin-write

tasks:
  - id: write_test
    agent:
      prompt: |
        Use the nika:write tool to create a file at ./examples/gates/.test-output/agent-wrote-this.txt
        with the content "AGENT_WROTE_THIS_FILE".
        Then confirm by saying "DONE".
      provider: openai
      model: gpt-4.1-mini
      max_turns: 3
      tools: [builtin]
    description: "Agent writes a file using nika:write builtin"
