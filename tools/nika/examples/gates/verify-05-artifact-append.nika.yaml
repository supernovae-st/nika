# VERIFY-05: Artifact append mode — multiple tasks write to same file
schema: nika/workflow@0.12
workflow: verify-05-append

artifacts:
  dir: ./examples/gates/.test-output/artifacts

tasks:
  - id: write1
    exec: "echo 'LINE_ONE'"
    artifact:
      path: append-test.txt
      mode: overwrite
      format: text

  - id: write2
    depends_on: [write1]
    exec: "echo 'LINE_TWO'"
    artifact:
      path: append-test.txt
      mode: append
      format: text

  - id: write3
    depends_on: [write2]
    exec: "echo 'LINE_THREE'"
    artifact:
      path: append-test.txt
      mode: append
      format: text
