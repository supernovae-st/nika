# VERIFY-06: ALL 5 verbs in a single pipeline
schema: nika/workflow@0.12
workflow: verify-06-all-verbs

artifacts:
  dir: ./examples/gates/.test-output/artifacts

tasks:
  # VERB 1: exec
  - id: v1_exec
    exec: "echo 'step1_data'"
    description: "exec: verb"

  # VERB 2: fetch
  - id: v2_fetch
    fetch:
      url: "https://httpbin.org/get?source=nika"
      method: GET
    description: "fetch: verb"

  # VERB 3: infer
  - id: v3_infer
    depends_on: [v1_exec, v2_fetch]
    with:
      exec_data: $v1_exec
      fetch_data: $v2_fetch.url ?? "unknown"
    infer: "Combine: exec={{with.exec_data}} fetch_url={{with.fetch_data}}. Reply with one sentence."
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 100
    description: "infer: verb with bindings from exec and fetch"

  # VERB 4: agent (with builtin tool)
  - id: v4_agent
    depends_on: [v3_infer]
    with:
      prev: $v3_infer
    agent:
      prompt: "You received: {{with.prev}}. Call nika:complete with result='AGENT_DONE' and confidence=1.0 and reasoning='all verbs tested'."
      provider: openai
      model: gpt-4.1-mini
      max_turns: 2
      tools: [builtin]
    description: "agent: verb with builtin tools"

  # VERB 5: (no invoke: without MCP, use exec to simulate)
  - id: v5_final
    depends_on: [v4_agent]
    with:
      agent_result: $v4_agent
    exec: "echo 'ALL_VERBS_COMPLETE: {{with.agent_result}}'"
    artifact:
      path: all-verbs-result.txt
      format: text
    description: "Final exec with artifact"
