# VERIFY-07: Ultimate integration test — ALL features in one realistic workflow
# Simulates: research a topic → extract structured data → expand → compile → save
schema: nika/workflow@0.12
workflow: verify-07-ultimate

artifacts:
  dir: ./examples/gates/.test-output/artifacts

inputs:
  topic:
    default: "Rust"

context:
  files:
    style: ./examples/context/style-guide.md

tasks:
  # 1. EXEC: Get metadata
  - id: metadata
    exec:
      command: "echo '{\"date\":\"'$(date +%Y-%m-%d)'\",\"host\":\"'$(hostname)'\"}'"
      shell: true
    description: "Gather system metadata"

  # 2. FETCH: Get external data
  - id: fetch_data
    fetch:
      url: "https://httpbin.org/json"
      method: GET
    description: "Fetch reference data"

  # 3. INFER: Analyze with structured output (OpenAI)
  - id: analyze
    depends_on: [fetch_data]
    with:
      raw: $fetch_data
    infer: |
      Analyze this JSON and extract key themes:
      {{with.raw}}
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 300
    structured:
      schema:
        type: object
        properties:
          themes:
            type: array
            items:
              type: string
          tone:
            type: string
        required: [themes, tone]
    description: "Structured analysis with OpenAI"

  # 4. FOR_EACH: Expand themes (xAI)
  - id: expand
    depends_on: [analyze]
    for_each: "$analyze.themes"
    as: theme
    infer: "Write one sentence about '{{with.theme}}' related to {{inputs.topic}}."
    provider: xai
    model: grok-3-fast
    max_tokens: 80
    description: "Expand each theme with xAI"

  # 5. EXEC: Verify data flow with nested JSON
  - id: verify_bindings
    depends_on: [metadata, analyze]
    with:
      date: $metadata.date
      tone: $analyze.tone
    exec: "echo 'date={{with.date}} tone={{with.tone}}'"
    description: "Verify nested JSON binding access"

  # 6. INFER: Compile with template + context.files + all bindings
  - id: compile
    depends_on: [expand, verify_bindings]
    with:
      paragraphs: $expand
      bindings: $verify_bindings
    infer: |
      Compile a short report:
      - Style guide: {{context.files.style}}
      - Topic: {{inputs.topic}}
      - Bindings: {{with.bindings}}
      - Content: {{with.paragraphs}}

      Write 3-5 sentences.
    provider: openai
    model: gpt-4.1-mini
    max_tokens: 300
    artifact:
      path: "ultimate-report.md"
      template: "# {{inputs.topic}} Report\n\n{{output}}\n\n---\nGenerated by Nika"
      format: text
    description: "Final compilation with artifact"
