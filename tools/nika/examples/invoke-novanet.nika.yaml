# Invoke NovaNet MCP Tools
#
# Demonstrates the invoke verb for direct MCP tool calls.
# Builds a pipeline: schema -> context -> traversal -> content generation.
#
# Usage:
#   nika examples/invoke-novanet.nika.yaml
#
# Requirements:
#   - ANTHROPIC_API_KEY environment variable
#   - NovaNet MCP server running (cargo run in tools/novanet-mcp)
#   - Neo4j database with NovaNet schema

schema: "nika/workflow@0.12"
workflow: invoke-novanet
description: "Direct MCP tool invocation pipeline"

provider: claude
model: claude-sonnet-4-6

mcp:
  novanet:
    command: cargo
    args:
      - run
      - --manifest-path
      - ../../../novanet/tools/novanet-mcp/Cargo.toml
    env:
      NOVANET_MCP_NEO4J_URI: bolt://localhost:7687
      NOVANET_MCP_NEO4J_USER: neo4j
      NOVANET_MCP_NEO4J_PASSWORD: novanetpassword

tasks:
  # Step 1: Describe the NovaNet graph schema
  - id: schema
    description: "Get NovaNet schema overview"
    invoke:
      server: novanet
      tool: novanet_describe
      params:
        describe: schema
    output:
      format: json

  # Step 2: Assemble context for QR Code entity in French
  - id: entity_context
    description: "Assemble context for QR Code entity"
    with:
      graph_schema: $schema
    invoke:
      server: novanet
      tool: novanet_assemble
      params:
        focus_key: "entity:qr-code"
        locale: fr-FR
        token_budget: 10000
        include_entities: true
        include_knowledge: true
    output:
      format: json
    flow: [schema]

  # Step 3: Traverse from entity to its native content
  - id: traverse_native
    description: "Traverse to native content"
    with:
      ctx: $entity_context
    invoke:
      server: novanet
      tool: novanet_traverse
      params:
        start_key: "entity:qr-code"
        max_depth: 1
        direction: outgoing
        arc_families: [localization]
    output:
      format: json
    flow: [entity_context]

  # Step 4: Generate content using knowledge context
  - id: generate_content
    description: "Generate hero content from context"
    with:
      ctx: $entity_context
      native: $traverse_native
    infer:
      prompt: |
        Generate a compelling product description for the hero section.

        ENTITY CONTEXT:
        {{with.ctx}}

        TRAVERSAL DATA:
        {{with.native}}

        RULES:
        - Use ONLY denomination_forms values from context
        - NO invention, NO paraphrase of entity names
        - Follow ADR-033: text for prose, title for headings, url for links

        Output a JSON object with:
        - headline: string (use title form)
        - body: string (use text form)
        - cta: string (call to action)
    output:
      format: json
      schema:
        type: object
        required: [headline, body, cta]
        properties:
          headline:
            type: string
          body:
            type: string
          cta:
            type: string
      max_retries: 2
    flow: [traverse_native]
