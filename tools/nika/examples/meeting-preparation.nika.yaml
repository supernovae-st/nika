schema: nika/workflow@0.5
workflow: meeting-preparation
description: "Comprehensive meeting preparation workflow with attendee research and talking points"

provider: claude
model: claude-sonnet-4-6

mcp:
  perplexity:
    command: node
    args:
      - /path/to/perplexity-mcp/dist/index.js
    env:
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}

tasks:
  # STEP 1: Read local calendar file to get meeting details
  - id: read_calendar
    exec: |
      cat calendar.json 2>/dev/null || echo '{"meeting": "default", "date": "2026-02-26", "attendees": ["attendee1", "attendee2"], "topic": "Strategic Planning"}'

  # STEP 2: Parse calendar data and fetch from API for additional details
  - id: fetch_meeting_details
    use:
      calendar_data: read_calendar
    fetch:
      url: "https://api.example.com/meetings/{{use.calendar_data | from_json | .meeting_id}}"
      method: GET
      headers:
        Authorization: "Bearer ${MEETING_API_TOKEN}"
    output:
      format: json

  # STEP 3: Read local notes for context (background reading)
  - id: read_local_notes
    exec: |
      find . -name "notes.md" -o -name "background.md" 2>/dev/null | head -1 | xargs cat 2>/dev/null || echo "# No local notes found"

  # STEP 4: Extract attendees from calendar and details (fan-out pattern)
  - id: extract_attendees
    use:
      calendar: read_calendar
      meeting_details: fetch_meeting_details
    infer:
      prompt: |
        Extract all meeting attendees from this calendar data and API response.
        Return a JSON array of attendee objects with {name, title, organization, email}.

        Calendar data:
        {{use.calendar}}

        API response:
        {{use.meeting_details | to_json}}

        Return ONLY a valid JSON array, no other text.
      model: claude-sonnet-4-6
    output:
      format: json

  # STEP 5: Research multiple attendees in parallel (diamond pattern)
  - id: research_attendees
    use:
      attendee_list: extract_attendees
    for_each: "{{use.attendee_list}}"
    as: attendee
    concurrency: 4
    fail_fast: false
    invoke:
      server: perplexity
      tool: perplexity_research
      params:
        query: "{{use.attendee.name}} {{use.attendee.title}} {{use.attendee.organization}} recent news achievements publications"
        max_results: 5
    output:
      format: json

  # STEP 6: Get meeting topic insights (fan-out)
  - id: research_topic
    use:
      meeting_details: fetch_meeting_details
    invoke:
      server: perplexity
      tool: perplexity_research
      params:
        query: "{{use.meeting_details.topic | from_json}} recent trends 2026 industry insights"
        max_results: 10
    output:
      format: json

  # STEP 7: Analyze attendee backgrounds and generate profiles
  - id: generate_attendee_profiles
    use:
      attendee_research: research_attendees
      attendee_list: extract_attendees
    infer:
      prompt: |
        Based on research for {{use.attendee_list | length}} meeting attendees, create concise profiles.

        Attendee research data:
        {{use.attendee_research | to_json}}

        For each attendee, provide:
        - Key achievements and background
        - Known interests and expertise areas
        - Suggested talking points to connect with them
        - Potential concerns or priorities they care about

        Format as a JSON array of profile objects.
      model: claude-sonnet-4-6
    output:
      format: json

  # STEP 8: Generate key talking points (convergence point - diamond completes)
  - id: generate_talking_points
    use:
      attendee_profiles: generate_attendee_profiles
      topic_research: research_topic
      local_notes: read_local_notes
      meeting_details: fetch_meeting_details
    infer:
      prompt: |
        Create 5-7 strategic talking points for this meeting using the research compiled.

        Attendee Profiles:
        {{use.attendee_profiles | to_json}}

        Topic Research:
        {{use.topic_research | to_json}}

        Meeting Details:
        {{use.meeting_details | to_json}}

        Local Context Notes:
        {{use.local_notes}}

        For each talking point:
        1. State the point clearly
        2. Provide supporting evidence from research
        3. Explain relevance to the meeting objective
        4. Suggest how to connect it with attendees

        Format as a JSON object with array of talking_points.
      model: claude-sonnet-4-6
    output:
      format: json

  # STEP 9: Generate meeting questions to drive discussion
  - id: generate_questions
    use:
      topic_research: research_topic
      attendee_profiles: generate_attendee_profiles
      talking_points: generate_talking_points
    infer:
      prompt: |
        Generate 8-10 thought-provoking questions to ask during the meeting.

        Topic Context:
        {{use.topic_research | to_json}}

        Attendee Profiles:
        {{use.attendee_profiles | to_json}}

        Talking Points:
        {{use.talking_points | to_json}}

        Questions should:
        - Be open-ended to encourage discussion
        - Leverage attendee expertise and interests
        - Address potential concerns identified in research
        - Drive toward meeting objectives
        - Include both broad strategic questions and specific tactical ones

        Return a JSON object with array of questions, each with:
        {
          "question": "...",
          "purpose": "...",
          "directed_to": "attendee_name or 'group'"
        }
      model: claude-sonnet-4-6
    output:
      format: json

  # STEP 10: Orchestrate final brief assembly via agent
  - id: meeting_brief_agent
    use:
      attendee_profiles: generate_attendee_profiles
      talking_points: generate_talking_points
      discussion_questions: generate_questions
      meeting_details: fetch_meeting_details
      topic_research: research_topic
    agent:
      prompt: |
        You are a professional meeting preparation specialist. Your task is to synthesize all research
        and analysis into a comprehensive, actionable meeting brief.

        You have the following context:
        - Attendee profiles with backgrounds and interests
        - Key talking points with supporting evidence
        - Discussion questions tailored to attendees
        - Meeting details and objectives
        - Industry research and trends

        Create a professional meeting brief that includes:

        1. EXECUTIVE SUMMARY
           - Meeting purpose and desired outcomes
           - Key stakeholders and their interests
           - Success criteria

        2. ATTENDEE INTELLIGENCE
           - Brief profiles of key decision-makers
           - Each person's known priorities
           - Suggested conversation starters

        3. STRATEGIC TALKING POINTS
           - 5-7 key points to cover
           - Supporting data and context
           - Why each point matters to the group

        4. DISCUSSION FLOW
           - Recommended agenda order
           - Transition points between topics
           - Time allocations

        5. CRITICAL QUESTIONS
           - 8-10 questions that drive decision-making
           - Who should ask and when
           - Expected outcomes from each question

        6. RISK MITIGATION
           - Potential objections and counter-points
           - Sensitive topics to handle carefully
           - Backup plans if discussions go sideways

        7. ACTION ITEMS FRAMEWORK
           - Decision points to capture
           - Who owns follow-ups
           - Timeline for next steps

        Format the brief as clear, scannable markdown with bullet points and sections.
        Make it professional enough for executive use but practical enough to reference during the meeting.

        Attendee Data:
        {{use.attendee_profiles | to_json}}

        Talking Points:
        {{use.talking_points | to_json}}

        Discussion Questions:
        {{use.discussion_questions | to_json}}

        Meeting Details:
        {{use.meeting_details | to_json}}

        Topic Research Summary:
        {{use.topic_research | to_json}}

      mcp: []
      depth_limit: 1
      max_turns: 8
    output:
      format: text

  # STEP 11: Save the complete brief to file
  - id: save_brief
    use:
      brief: meeting_brief_agent
    exec: |
      mkdir -p meeting_briefs
      TIMESTAMP=$(date +%Y%m%d_%H%M%S)
      OUTPUT_FILE="meeting_briefs/brief_${TIMESTAMP}.md"
      echo "{{use.brief}}" > "$OUTPUT_FILE"
      echo "=== Meeting Brief Generated Successfully ==="
      echo "Saved to: $OUTPUT_FILE"
      echo "File size: $(wc -c < "$OUTPUT_FILE") bytes"

  # STEP 12: Generate summary for quick reference
  - id: generate_quick_ref
    use:
      brief: meeting_brief_agent
      talking_points: generate_talking_points
      questions: generate_questions
    infer:
      prompt: |
        Create a 1-page QUICK REFERENCE CARD for the meeting (max 30 lines).

        Full Brief:
        {{use.brief}}

        This should be something you can glance at right before the meeting starts.

        Format as markdown with:
        - Meeting objective (1 line)
        - Key attendees (2-3 lines)
        - Top 3 talking points (3 lines)
        - Top 3 questions to ask (3 lines)
        - Quick decision checklist (5 lines)
        - Emergency contact info format

        Be concise. One column. No fluff.
      model: claude-sonnet-4-6
    output:
      format: text

  # STEP 13: Final preparation summary
  - id: save_quick_ref
    use:
      quick_ref: generate_quick_ref
    exec: |
      mkdir -p meeting_briefs
      TIMESTAMP=$(date +%Y%m%d_%H%M%S)
      OUTPUT_FILE="meeting_briefs/quick_ref_${TIMESTAMP}.txt"
      echo "{{use.quick_ref}}" > "$OUTPUT_FILE"
      echo "=== Quick Reference Card Generated ==="
      echo "Saved to: $OUTPUT_FILE"

flows:
  # Read phase
  - source: read_calendar
    target: fetch_meeting_details
  - source: read_calendar
    target: extract_attendees
  - source: fetch_meeting_details
    target: extract_attendees

  # Parallel research phase (fan-out)
  - source: extract_attendees
    target: research_attendees
  - source: fetch_meeting_details
    target: research_topic

  # Analysis phase
  - source: research_attendees
    target: generate_attendee_profiles
  - source: read_local_notes
    target: generate_talking_points
  - source: research_topic
    target: generate_talking_points
  - source: generate_attendee_profiles
    target: generate_talking_points
  - source: fetch_meeting_details
    target: generate_talking_points

  # Question generation (uses previous results)
  - source: generate_talking_points
    target: generate_questions
  - source: research_topic
    target: generate_questions
  - source: generate_attendee_profiles
    target: generate_questions

  # Final orchestration phase (diamond pattern convergence)
  - source: generate_attendee_profiles
    target: meeting_brief_agent
  - source: generate_talking_points
    target: meeting_brief_agent
  - source: generate_questions
    target: meeting_brief_agent
  - source: fetch_meeting_details
    target: meeting_brief_agent
  - source: research_topic
    target: meeting_brief_agent

  # Output phase
  - source: meeting_brief_agent
    target: save_brief
  - source: meeting_brief_agent
    target: generate_quick_ref
  - source: generate_quick_ref
    target: save_quick_ref
