# Level 1 (top) workflow - calls level 2, which calls level 3
# Tests triple-nested workflow execution
# Run with: nika examples/nested-level1.nika.yaml

schema: "nika/workflow@0.5"

mcp:
  dummy:
    command: "echo"
    args: ["not used"]

tasks:
  - id: level1_start
    exec: "echo 'Level 1 starting triple-nested execution...'"

  - id: call_level2
    use:
      start: level1_start
    invoke:
      mcp: dummy
      tool: nika:run
      params:
        workflow: "examples/nested-level2.nika.yaml"

  - id: level1_end
    use:
      level2: call_level2
    exec: "echo 'Triple-nested complete!'"

flows:
  - source: level1_start
    target: call_level2
  - source: call_level2
    target: level1_end
