# Level 2 (middle) workflow - calls level 3
schema: "nika/workflow@0.5"

mcp:
  dummy:
    command: "echo"
    args: ["not used"]

tasks:
  - id: level2_start
    exec: "echo 'Level 2 starting...'"

  - id: call_level3
    use:
      start: level2_start
    invoke:
      mcp: dummy
      tool: nika:run
      params:
        workflow: "examples/nested-level3.nika.yaml"

  - id: level2_end
    use:
      level3: call_level3
    exec: "echo 'Level 2 done, level3 returned: {{use.level3}}'"

flows:
  - source: level2_start
    target: call_level3
  - source: call_level3
    target: level2_end
