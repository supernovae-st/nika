# Parent workflow that demonstrates nested workflow execution
# Run with: nika examples/nested-parent.nika.yaml
#
# Tests nika:run builtin tool for workflow composition

schema: "nika/workflow@0.5"

# Dummy MCP config (builtins intercept before MCP call)
mcp:
  dummy:
    command: "echo"
    args: ["not used"]

tasks:
  # Step 1: Preparation
  - id: parent_prepare
    exec: "echo 'Parent: Starting orchestration'"

  # Step 2: Execute child workflow using nika:run
  - id: run_child
    use:
      prep: parent_prepare
    invoke:
      mcp: dummy
      tool: nika:run
      params:
        workflow: "examples/nested-child.nika.yaml"

  # Step 3: Log child result
  - id: log_child_result
    use:
      child_output: run_child
    invoke:
      mcp: dummy
      tool: nika:log
      params:
        level: info
        message: "Child workflow result: {{use.child_output}}"

  # Step 4: Final summary
  - id: parent_complete
    use:
      logged: log_child_result
    exec: "echo 'Parent: All nested workflows completed successfully!'"

flows:
  - source: parent_prepare
    target: run_child
  - source: run_child
    target: log_child_result
  - source: log_child_result
    target: parent_complete
