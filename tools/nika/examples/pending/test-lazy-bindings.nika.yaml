# Test: lazy: bindings - Deferred resolution
# Tests: lazy flag, default values, binding timing
schema: nika/workflow@0.12
workflow: test-lazy-bindings

tasks:
  # Test 1: Standard eager binding
  - id: producer
    exec: "echo 'Produced value'"

  - id: eager_consumer
    with:
      value: $producer
    exec: "echo 'Eagerly consumed: value captured'"

  # Test 2: Lazy binding with default (references existing task)
  - id: slow_producer
    exec:
      command: "sleep 0.5 && echo 'Slow result'"
      shell: true

  - id: lazy_with_default
    with:
      slow_data:
        path: $slow_producer
        lazy: true
        default: "fallback_value"
    exec: "echo 'Got lazy data'"

  # Test 3: Multiple bindings
  - id: multi_binding
    with:
      a: $producer
      b: $slow_producer
    exec: "echo 'Combined A and B'"
