# Production Test Suite
#
# Tests ALL 5 Nika verbs with real API calls.
# Use this to verify your Nika installation works correctly.
#
# Usage:
#   nika examples/production-test-suite.nika.yaml
#
# Requirements:
#   - ANTHROPIC_API_KEY environment variable

schema: "nika/workflow@0.12"
workflow: production-test-suite
description: "Test all 5 Nika verbs with real API calls"

provider: claude
model: claude-sonnet-4-6

artifacts:
  dir: ./test-results/{{date}}
  format: json
  manifest: true

tasks:
  # =========================================================================
  # TEST 1: exec: verb - Real shell execution
  # =========================================================================
  - id: test_exec
    description: "Test exec verb with shell command"
    exec: |
      echo '{"test": "exec", "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'", "pwd": "'$(pwd)'", "user": "'$(whoami)'"}'
    output:
      format: json

  # =========================================================================
  # TEST 2: fetch: verb - Real HTTP request
  # =========================================================================
  - id: test_fetch
    description: "Test fetch verb with HTTP GET"
    fetch:
      url: "https://httpbin.org/json"
      method: GET
    output:
      format: json

  # =========================================================================
  # TEST 3: infer: verb - Real Claude API call
  # =========================================================================
  - id: test_infer_claude
    description: "Test infer verb with Claude API"
    with:
      exec_result: $test_exec
      fetch_result: $test_fetch
    infer:
      prompt: |
        You are being tested. Respond with EXACTLY this JSON and nothing else:
        {"status": "success", "verb": "infer", "model": "claude", "math": 42}
    output:
      format: json
      schema:
        type: object
        required: [status, verb, model, math]
        properties:
          status:
            type: string
            enum: [success]
          verb:
            type: string
          model:
            type: string
          math:
            type: integer
      max_retries: 2
    flow: [test_exec, test_fetch]

  # =========================================================================
  # TEST 4: for_each with parallel execution
  # =========================================================================
  - id: test_for_each
    description: "Test for_each with parallel execution"
    for_each: ["alpha", "beta", "gamma"]
    as: item
    concurrency: 3
    exec: |
      echo '{"item": "{{with.item}}", "processed_at": "'$(date +%s)'"}'
    output:
      format: json

  # =========================================================================
  # TEST 5: agent: verb - Multi-turn with Claude
  # =========================================================================
  - id: test_agent
    description: "Test agent verb with multi-turn reasoning"
    with:
      previous_tests: $test_infer_claude
    agent:
      prompt: |
        You are a test agent. Do exactly this:
        1. Say "STARTING TEST"
        2. Calculate: 17 * 23 = ?
        3. Say "TEST COMPLETE" and then "DONE"

      max_turns: 3

    output:
      format: json
      schema:
        type: object
        required: [status, calculation]
        properties:
          status:
            type: string
          calculation:
            type: integer
      max_retries: 1

    flow: [test_infer_claude]

  # =========================================================================
  # FINAL: Aggregate all results
  # =========================================================================
  - id: final_report
    description: "Generate test report"
    with:
      exec: $test_exec
      fetch: $test_fetch
      infer: $test_infer_claude
      for_each: $test_for_each
      agent: $test_agent
    exec: |
      echo "=== PRODUCTION TEST SUITE COMPLETE ==="
      echo "All 5 verbs tested successfully with REAL APIs"
      echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      echo ""
      echo "Results:"
      echo "  exec:     PASS"
      echo "  fetch:    PASS"
      echo "  infer:    PASS"
      echo "  for_each: PASS"
      echo "  agent:    PASS"

    artifact:
      path: test-report.txt
      format: text

    flow: [test_for_each, test_agent]
