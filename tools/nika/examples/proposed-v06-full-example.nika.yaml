# ============================================================================
# PROPOSED v0.6 — Full Example with Memory, Agents, Skills
# ============================================================================
#
# This file shows the PROPOSED v0.6 syntax (NOT YET IMPLEMENTED).
# Compare with current v0.5 workarounds below.
#
# Inspired by:
# - CrewAI: config/agents.yaml, config/tasks.yaml, knowledge sources
# - LangGraph: memory stores, checkpointers, state persistence
#
# Run with: cargo run -- run examples/proposed-v06-full-example.nika.yaml
# ============================================================================

schema: "nika/workflow@0.6"
workflow: qrcode-ai-content-pipeline
description: "Full content generation pipeline for QR Code AI"

# ============================================================================
# NEW: Memory System (v0.6)
# ============================================================================
# Replaces ugly `exec: cat ./file` workarounds with declarative file loading.
#
# CrewAI equivalent:
#   knowledge:
#     sources:
#       - TextFileKnowledgeSource(file_paths=["brand.md"])
#       - JSONKnowledgeSource(file_paths=["persona.json"])
# ============================================================================

memory:
  # Layer 1: Project Files (loaded at workflow start)
  files:
    # Markdown → raw string
    brand: ./context/brand.md
    style_guide: ./context/style-guide.md

    # JSON → parsed object (access via memory.files.persona.name)
    persona: ./context/persona.json

    # YAML → parsed object
    seo_rules: ./context/seo-rules.yaml

    # Glob pattern → array of strings
    examples: ./context/examples/*.md

  # Layer 2: Session Context (restore previous chat/workflow)
  session: .nika/sessions/previous-run.json

  # Layer 3: Long-term Memory (v1.0+, not implemented yet)
  # persistent: .nika/memory/embeddings.db

# ============================================================================
# NEW: Agent Definitions (v0.6)
# ============================================================================
# Reusable agent configurations, either inline or from external files.
#
# CrewAI equivalent:
#   agents_config = 'config/agents.yaml'
#   @agent
#   def researcher(self) -> Agent:
#       return Agent(config=self.agents_config['researcher'])
# ============================================================================

agents:
  # External file reference (recommended for complex agents)
  researcher:
    file: ./agents/researcher.agent.yaml

  writer:
    file: ./agents/writer.agent.yaml

  reviewer:
    file: ./agents/reviewer.agent.yaml

  # Inline definition (for simple agents)
  translator:
    system: |
      You are a professional translator specializing in tech content.
      Maintain brand voice and SEO keywords across locales.
    provider: claude
    model: claude-sonnet-4-6
    max_turns: 3
    temperature: 0.3

# ============================================================================
# NEW: Skill Definitions (v0.6)
# ============================================================================
# Skills augment agent system prompts with methodology/constraints.
#
# Similar to CrewAI's process configuration but more modular.
# ============================================================================

skills:
  tdd: ./skills/tdd.skill.yaml
  seo_optimization: ./skills/seo-optimization.skill.yaml
  brand_voice: ./skills/brand-voice.skill.yaml

# ============================================================================
# MCP Servers (existing v0.5 feature)
# ============================================================================

mcp:
  novanet:
    command: cargo
    args:
      - run
      - --manifest-path
      - ../../../novanet/tools/novanet-mcp/Cargo.toml
    env:
      NOVANET_MCP_NEO4J_URI: bolt://localhost:7687
      NOVANET_MCP_NEO4J_USER: neo4j
      NOVANET_MCP_NEO4J_PASSWORD: novanetpassword

  perplexity:
    command: npx
    args:
      - -y
      - "@anthropic/perplexity-mcp"
    env:
      PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY}"

  filesystem:
    command: npx
    args:
      - -y
      - "@anthropic/filesystem-mcp"
      - --root
      - ./output

# ============================================================================
# Tasks
# ============================================================================

tasks:
  # --------------------------------------------------------------------------
  # Task 1: Research (uses external agent + MCP)
  # --------------------------------------------------------------------------
  - id: research
    agent:
      use: researcher                          # Reference defined agent
      skill: seo_optimization                  # Apply skill
      prompt: |
        Research SEO trends and competitors for QR Code AI.

        Brand context:
        {{memory.files.brand}}

        Focus areas from previous session:
        {{memory.session.focus_areas}}

  # --------------------------------------------------------------------------
  # Task 2: Get Entity Context from NovaNet
  # --------------------------------------------------------------------------
  - id: get_entity
    invoke:
      tool: novanet_generate
      server: novanet
      params:
        entity: qr-code
        locale: fr-FR
        forms:
          - text
          - title
          - abbrev

  # --------------------------------------------------------------------------
  # Task 3: Write Content (uses agent with multiple skills)
  # --------------------------------------------------------------------------
  - id: write_content
    agent:
      use: writer
      skill:
        - brand_voice                          # Multiple skills
        - seo_optimization
      prompt: |
        Write landing page content for QR Code AI.

        Research findings:
        {{use.research}}

        Entity context from NovaNet:
        {{use.get_entity}}

        Brand guidelines:
        {{memory.files.brand}}

        Style guide:
        {{memory.files.style_guide}}

        Persona to target:
        {{memory.files.persona.target_audience}}

        SEO rules:
        {{memory.files.seo_rules}}

        Reference examples:
        {{memory.files.examples}}

  # --------------------------------------------------------------------------
  # Task 4: Review (uses agent)
  # --------------------------------------------------------------------------
  - id: review
    agent:
      use: reviewer
      prompt: |
        Review this content against brand guidelines:

        Content:
        {{use.write_content}}

        Brand guidelines:
        {{memory.files.brand}}

        Check for:
        - Brand voice consistency
        - SEO optimization
        - Factual accuracy

  # --------------------------------------------------------------------------
  # Task 5: Translate to multiple locales (for_each + agent)
  # --------------------------------------------------------------------------
  - id: translate
    for_each:
      - en-US
      - de-DE
      - es-ES
    as: locale
    concurrency: 3
    agent:
      use: translator
      prompt: |
        Translate to {{use.locale}}:

        {{use.write_content}}

        Maintain SEO keywords and brand voice.

  # --------------------------------------------------------------------------
  # Task 6: Save output
  # --------------------------------------------------------------------------
  - id: save_output
    exec: |
      mkdir -p ./output/content
      echo '{{use.write_content}}' > ./output/content/fr-FR.md
      echo 'Saved content to ./output/content/'

# ============================================================================
# Flows (DAG edges)
# ============================================================================

flows:
  - source: research
    target: write_content
  - source: get_entity
    target: write_content
  - source: write_content
    target: review
  - source: review
    target: translate
  - source: translate
    target: save_output
