# JSON Transformer
# Transform JSON data using LLM understanding
#
# Usage:
#   INPUT_FILE="data.json" TRANSFORM="Extract only user names and emails" nika examples/public/json-transformer.nika.yaml
#
# Requirements:
#   - ANTHROPIC_API_KEY or OPENAI_API_KEY
#   - INPUT_FILE environment variable (path to JSON)
#   - TRANSFORM environment variable (transformation instruction)

schema: "nika/workflow@0.10"
workflow: json-transformer
description: "Transform JSON data with natural language instructions"
provider: claude

tasks:
  # Step 1: Read input
  - id: read_input
    exec:
      command: |
        INPUT="${INPUT_FILE:-/dev/stdin}"
        if [ -f "$INPUT" ]; then
          cat "$INPUT"
        else
          echo '{"error": "No input file specified. Set INPUT_FILE env var."}'
        fi
      shell: true

  # Step 2: Get transformation
  - id: get_transform
    exec:
      command: "echo \"${TRANSFORM:-Convert to a simplified format}\""
      shell: true

  # Step 3: Analyze structure
  - id: analyze
    with:
      data: read_input
    infer:
      prompt: |
        Analyze this JSON structure:

        {{with.data}}

        Output a brief description:
        - Type (array/object)
        - Key fields
        - Nested structures
        - Data patterns

        Be concise (3-5 lines).

  # Step 4: Transform
  - id: transform
    with:
      data: read_input
      instruction: get_transform
      analysis: analyze
    infer:
      prompt: |
        Transform this JSON data.

        ORIGINAL DATA:
        {{with.data}}

        STRUCTURE ANALYSIS:
        {{with.analysis}}

        TRANSFORMATION INSTRUCTION:
        {{with.instruction}}

        Rules:
        - Output ONLY valid JSON
        - Preserve data integrity
        - Follow the instruction precisely
        - Handle edge cases gracefully
    output:
      format: json

  # Step 5: Validate and output
  - id: output
    with:
      result: transform
      instruction: get_transform
    exec:
      command: |
        echo "=== Transformation Complete ==="
        echo "Instruction: {{with.instruction}}"
        echo ""
        echo "=== Result ==="
        echo '{{with.result}}' | jq . 2>/dev/null || echo '{{with.result}}'
        echo ""
        echo '{{with.result}}' > /tmp/transformed.json
        echo "💾 Saved to /tmp/transformed.json"
      shell: true

flows:
  - source: read_input
    target: analyze
  - source: get_transform
    target: transform
  - source: analyze
    target: transform
  - source: read_input
    target: transform
  - source: transform
    target: output
