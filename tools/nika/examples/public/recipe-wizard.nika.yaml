# Recipe Wizard 🧙‍♂️🍳
# Generate a recipe from ingredients you have
#
# Usage:
#   INGREDIENTS="chicken, rice, tomatoes, garlic, onion" nika examples/public/recipe-wizard.nika.yaml
#   DIET="vegetarian" INGREDIENTS="tofu, mushrooms, soy sauce" nika examples/public/recipe-wizard.nika.yaml
#
# Pattern: Fan-out DAG (parallel analysis → merge)
# Showcases: Parallel tasks, creative generation, structured output

schema: "nika/workflow@0.12"
workflow: recipe-wizard
description: "Generate a recipe from ingredients in your fridge"
provider: claude

tasks:
  # Step 1: Get ingredients
  - id: get_ingredients
    exec:
      command: "echo \"${INGREDIENTS:-eggs, cheese, bread, butter, tomatoes}\""
      shell: true

  # Step 2: Get dietary preferences
  - id: get_diet
    exec:
      command: "echo \"${DIET:-none}\""
      shell: true

  # Step 3: Analyze ingredients (parallel with cuisine matching)
  - id: analyze_ingredients
    with:
      ingredients: get_ingredients
    infer:
      prompt: |
        Analyze these ingredients: {{with.ingredients}}

        Output JSON:
        {
          "proteins": ["list proteins"],
          "vegetables": ["list vegetables"],
          "carbs": ["list carbs"],
          "seasonings": ["list seasonings"],
          "dairy": ["list dairy"],
          "missing_essentials": ["salt", "pepper", "oil if not listed"],
          "cuisine_matches": ["Italian", "Asian", "etc based on ingredients"]
        }
    output:
      format: json

  # Step 4: Generate 3 recipe options (parallel)
  - id: generate_options
    for_each: ["quick_easy", "impressive", "comfort_food"]
    as: style
    concurrency: 3
    with:
      ingredients: get_ingredients
      diet: get_diet
      analysis: analyze_ingredients
    infer:
      prompt: |
        Generate a {{with.style}} recipe using these ingredients.

        AVAILABLE: {{with.ingredients}}
        DIETARY: {{with.diet}}
        ANALYSIS: {{with.analysis}}

        Style guide:
        - quick_easy: Under 20 minutes, minimal steps
        - impressive: Fancy presentation, restaurant quality
        - comfort_food: Hearty, satisfying, cozy vibes

        Output JSON:
        {
          "style": "{{with.style}}",
          "name": "Recipe Name",
          "emoji": "🍳",
          "time_minutes": 20,
          "difficulty": "easy/medium/hard",
          "servings": 2,
          "description": "One sentence pitch"
        }
    output:
      format: json

  # Step 5: Let user "pick" (in real app, would be interactive)
  - id: pick_recipe
    with:
      options: generate_options
    infer:
      prompt: |
        From these 3 recipe options, pick the most balanced one:
        {{with.options}}

        Output just the style name: quick_easy, impressive, or comfort_food
    output:
      format: text

  # Step 6: Generate full recipe
  - id: full_recipe
    with:
      ingredients: get_ingredients
      diet: get_diet
      style: pick_recipe
      analysis: analyze_ingredients
    infer:
      prompt: |
        Create a complete {{with.style}} recipe.

        INGREDIENTS: {{with.ingredients}}
        DIETARY: {{with.diet}}
        ANALYSIS: {{with.analysis}}

        Format:

        # 🍳 [Recipe Name]

        > [Catchy one-liner description]

        **⏱️ Time:** X minutes | **👨‍🍳 Difficulty:** Easy/Medium/Hard | **🍽️ Serves:** X

        ## 📝 Ingredients
        - [ ] Item 1 (amount)
        - [ ] Item 2 (amount)

        ## 🛒 You Might Need (optional additions)
        - Item that would enhance the dish

        ## 👨‍🍳 Instructions

        ### Prep
        1. Step 1
        2. Step 2

        ### Cook
        1. Step 1
        2. Step 2

        ### Plate
        1. Plating instructions

        ## 💡 Chef's Tips
        - Tip 1
        - Tip 2

        ## 🍷 Pairs Well With
        - Drink suggestion
        - Side dish suggestion

        ---
        *Generated by Recipe Wizard 🧙‍♂️*

  # Step 7: Save
  - id: save
    with:
      recipe: full_recipe
    exec:
      command: |
        echo "{{with.recipe}}"
        echo ""
        echo "{{with.recipe}}" > /tmp/recipe.md
        echo "📄 Recipe saved to /tmp/recipe.md"
      shell: true

flows:
  - source: get_ingredients
    target: analyze_ingredients
  - source: get_diet
    target: generate_options
  - source: analyze_ingredients
    target: generate_options
  - source: generate_options
    target: pick_recipe
  - source: pick_recipe
    target: full_recipe
  - source: analyze_ingredients
    target: full_recipe
  - source: full_recipe
    target: save
