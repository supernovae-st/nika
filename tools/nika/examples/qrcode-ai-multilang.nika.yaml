# QR Code AI: Multi-Language Landing Page Generation
# Real-world use case: Generate landing pages for 5 locales in parallel
#
# This workflow demonstrates:
# - invoke: verb for MCP tool calling
# - for_each: parallel execution
# - use: bindings for data flow
# - Full NovaNet integration

schema: nika/workflow@0.5
workflow: qrcode-ai-multilang
description: "Generate QR Code AI landing pages for multiple locales"

provider: claude
model: claude-sonnet-4-6

mcp:
  novanet:
    command: cargo
    args:
      - run
      - --manifest-path
      - ../../../../novanet/tools/novanet-mcp/Cargo.toml
    env:
      NOVANET_MCP_NEO4J_URI: bolt://localhost:7687
      NOVANET_MCP_NEO4J_USER: neo4j
      NOVANET_MCP_NEO4J_PASSWORD: novanetpassword

tasks:
  # Step 1: Get entity context for the main product
  - id: get_entity
    invoke:
      mcp: novanet
      tool: novanet_describe
      params:
        entity: "qr-code-generator"
    use.entity: entity_info

  # Step 2: Generate locale-specific content in parallel
  - id: generate_locales
    for_each: ["fr-FR", "en-US", "de-DE", "es-ES", "ja-JP"]
    as: locale
    concurrency: 5
    invoke:
      mcp: novanet
      tool: novanet_generate
      params:
        entity: "qr-code-generator"
        locale: "{{use.locale}}"
        forms: ["text", "title", "description", "url"]
    use.content: locale_content

  # Step 3: Generate hero section for French (primary locale)
  - id: generate_hero_fr
    use:
      entity: get_entity
      content: generate_locales
    infer: |
      Tu es un copywriter expert pour QR Code AI.

      Génère une section hero percutante pour la landing page française.

      Contexte de l'entité:
      - Nom: {{use.entity.name}}
      - Description: {{use.entity.description}}

      Contenu localisé disponible:
      {{use.content | to_yaml}}

      Retourne un JSON avec:
      {
        "headline": "Titre accrocheur (max 10 mots)",
        "subheadline": "Sous-titre explicatif (max 20 mots)",
        "cta_text": "Texte du bouton CTA",
        "cta_url": "/signup"
      }
    output:
      format: json

  # Step 4: Log results
  - id: log_output
    use:
      hero: generate_hero_fr
    exec: |
      echo "=== QR Code AI Landing Page Generated ==="
      echo "Hero: {{use.hero}}"
      echo "Locales processed: 5"

flows:
  - source: get_entity
    target: generate_locales
  - source: generate_locales
    target: generate_hero_fr
  - source: generate_hero_fr
    target: log_output
