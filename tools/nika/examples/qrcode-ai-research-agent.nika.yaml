# QR Code AI: Research Agent with spawn_agent
#
# AI-driven competitive research and content strategy agent.
#
# Features:
# - agent: with spawn_agent for nested agents
# - depth_limit: for recursion control
# - novanet_introspect: for schema-aware research
# - Complex multi-turn reasoning with extended thinking
#
# Usage:
#   nika examples/qrcode-ai-research-agent.nika.yaml
#
# Requirements:
#   - ANTHROPIC_API_KEY
#   - NovaNet MCP server running
#   - Neo4j database with NovaNet schema

schema: "nika/workflow@0.10"
workflow: qrcode-ai-research-agent
description: "AI-driven research agent for QR Code AI content strategy"

provider: claude
model: claude-sonnet-4-6

artifacts:
  dir: ./research/{{date}}
  format: json
  manifest: true

mcp:
  novanet:
    command: cargo
    args:
      - run
      - --manifest-path
      - ../../../novanet/tools/novanet-mcp/Cargo.toml
    env:
      NOVANET_MCP_NEO4J_URI: bolt://localhost:7687
      NOVANET_MCP_NEO4J_USER: neo4j
      NOVANET_MCP_NEO4J_PASSWORD: novanetpassword

tasks:
  # Step 1: Orchestrator agent with spawn capability
  - id: research_orchestrator
    description: "Research orchestrator with spawn_agent capability"
    agent:
      prompt: |
        You are a Content Strategy Researcher for QR Code AI.

        Your mission is to analyze our knowledge graph and provide strategic recommendations.

        Available tools:
        - novanet_introspect: Query the schema structure
        - novanet_search: Find entities by criteria
        - novanet_describe: Get entity details
        - spawn_agent: Delegate sub-research to specialized agents

        Research plan:
        1. First, use novanet_introspect to understand available node classes
        2. Then, search for entities related to "qr-code"
        3. Spawn sub-agents for:
           a) Competitor analysis (what entities have competitive positioning?)
           b) Content gap analysis (what entities lack content?)
        4. Synthesize findings into recommendations

        Important: You have a depth_limit of 2, so spawned agents cannot spawn further.

        Return your final analysis as structured JSON.

      mcp: [novanet]
      depth_limit: 2
      max_turns: 15
      extended_thinking: true
      thinking_budget: 8000

    output:
      format: json
      schema:
        type: object
        required: [schema_insights, entity_analysis, recommendations]
        properties:
          schema_insights:
            type: array
            items:
              type: object
              properties:
                insight:
                  type: string
                relevance:
                  type: string
          entity_analysis:
            type: array
            items:
              type: object
              properties:
                entity:
                  type: string
                status:
                  type: string
                gaps:
                  type: array
                  items:
                    type: string
          recommendations:
            type: array
            items:
              type: object
              required: [recommendation, priority, rationale]
              properties:
                recommendation:
                  type: string
                priority:
                  type: string
                  enum: [high, medium, low]
                rationale:
                  type: string
      max_retries: 2

    artifact:
      path: research-analysis.json

  # Step 2: Generate strategic brief from research
  - id: generate_brief
    description: "Generate content strategy brief"
    with:
      research: research_orchestrator
    infer:
      prompt: |
        Based on this research analysis:

        {{with.research | to_yaml}}

        Generate a 1-page Content Strategy Brief for QR Code AI with:

        ## Executive Summary
        (2-3 sentences on key findings)

        ## Top 5 Content Opportunities
        (Prioritized list with rationale)

        ## Recommended Actions
        (Specific next steps for the content team)

        ## Metrics to Track
        (KPIs to measure success)

        Write in a professional consulting style.

    output:
      format: text

    artifact:
      path: content-strategy-brief.md
      format: text

    flow: [research_orchestrator]

  # Step 3: Output summary
  - id: output_summary
    description: "Output generation summary"
    with:
      brief: generate_brief
    exec: |
      echo "=== Content Strategy Brief Generated ==="
      echo "Output: ./research/{{date}}/content-strategy-brief.md"
      echo ""
      echo "Artifacts:"
      echo "  - research-analysis.json"
      echo "  - content-strategy-brief.md"
      echo "  - artifacts.json (manifest)"

    flow: [generate_brief]
