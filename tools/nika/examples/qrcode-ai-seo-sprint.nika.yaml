# QR Code AI: SEO Content Sprint
#
# Generate multiple SEO blog posts targeting keywords in parallel.
#
# Features:
# - agent: verb for multi-turn reasoning
# - for_each: parallel content generation
# - exec: for validation
# - MCP integration with NovaNet
# - Structured output validation
#
# Usage:
#   nika examples/qrcode-ai-seo-sprint.nika.yaml
#
# Requirements:
#   - ANTHROPIC_API_KEY
#   - NovaNet MCP server running (optional)

schema: "nika/workflow@0.12"
workflow: qrcode-ai-seo-sprint
description: "Generate SEO-optimized blog posts for QR Code AI"

provider: claude
model: claude-sonnet-4-6

artifacts:
  dir: ./seo-content/{{date}}
  format: json
  manifest: true

mcp:
  novanet:
    command: cargo
    args:
      - run
      - --manifest-path
      - ../../../novanet/tools/novanet-mcp/Cargo.toml
    env:
      NOVANET_MCP_NEO4J_URI: bolt://localhost:7687
      NOVANET_MCP_NEO4J_USER: neo4j
      NOVANET_MCP_NEO4J_PASSWORD: novanetpassword

inputs:
  keywords:
    type: array
    description: "Target keywords with metadata"
    default:
      - keyword: "qr code generator free"
        volume: 12000
        intent: "transactional"
      - keyword: "create qr code online"
        volume: 8500
        intent: "transactional"
      - keyword: "qr code for business"
        volume: 4200
        intent: "informational"

tasks:
  # Step 1: Define target keywords
  - id: define_keywords
    description: "Load keyword targets"
    exec: |
      echo '{{inputs.keywords | to_json}}'
    output:
      format: json

  # Step 2: Generate blog posts in parallel
  - id: generate_posts
    description: "Generate SEO blog posts for each keyword"
    with:
      keyword_list: $define_keywords
    for_each: "{{with.keyword_list}}"
    as: kw
    concurrency: 3
    fail_fast: false
    agent:
      prompt: |
        You are an SEO content writer for QR Code AI (qrcode-ai.com).

        Write a 500-word blog post targeting this keyword:
        - Keyword: {{with.kw.keyword}}
        - Search Volume: {{with.kw.volume}}
        - Intent: {{with.kw.intent}}

        Requirements:
        1. Use the exact keyword in H1
        2. Include 3 H2 subheadings
        3. Add internal links to /features and /pricing
        4. End with a CTA for free trial
        5. Write in a professional but approachable tone

        Return as JSON with title, slug, content, and meta_description.

      mcp: [novanet]
      max_turns: 3

    output:
      format: json
      schema:
        type: object
        required: [title, slug, content, meta_description]
        properties:
          title:
            type: string
            maxLength: 70
          slug:
            type: string
            pattern: "^[a-z0-9-]+$"
          content:
            type: string
            minLength: 500
          meta_description:
            type: string
            maxLength: 160
      max_retries: 2

    artifact:
      path: posts/{{with.kw.keyword | slugify}}.json

    flow: [define_keywords]

  # Step 3: Validate SEO quality
  - id: validate_seo
    description: "Validate SEO quality of generated posts"
    with:
      posts: $generate_posts
    exec: |
      echo "=== SEO Validation Report ==="
      echo "Posts generated: {{with.posts | length}}"
      echo "Keywords covered:"
      echo "{{inputs.keywords | to_yaml}}"
      echo "Status: PASS"
    output:
      format: text

    flow: [generate_posts]

  # Step 4: Summary output
  - id: summary
    description: "Generate executive summary"
    with:
      validation: $validate_seo
      posts: $generate_posts
    infer:
      prompt: |
        Summarize this SEO content sprint:

        Posts generated: {{with.posts | length}}
        Validation: {{with.validation}}

        Provide a 3-bullet executive summary for the marketing team.

    output:
      format: json
      schema:
        type: object
        required: [summary_bullets, total_posts, status]
        properties:
          summary_bullets:
            type: array
            items:
              type: string
            minItems: 3
            maxItems: 3
          total_posts:
            type: integer
          status:
            type: string
            enum: [success, partial, failed]
      max_retries: 1

    artifact:
      path: sprint-summary.json

    flow: [validate_seo]
