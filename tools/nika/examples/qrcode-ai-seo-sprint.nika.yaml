# QR Code AI: SEO Content Sprint
# Real-world use case: Generate multiple SEO blog posts targeting keywords
#
# This workflow demonstrates:
# - agent: verb for multi-turn reasoning
# - for_each: parallel content generation
# - exec: for validation
# - MCP integration with novanet_search

schema: nika/workflow@0.5
workflow: qrcode-ai-seo-sprint
description: "Generate SEO-optimized blog posts for QR Code AI"

provider: claude
model: claude-sonnet-4-6

mcp:
  novanet:
    command: cargo
    args:
      - run
      - --manifest-path
      - ../../../../novanet/tools/novanet-mcp/Cargo.toml
    env:
      NOVANET_MCP_NEO4J_URI: bolt://localhost:7687
      NOVANET_MCP_NEO4J_USER: neo4j
      NOVANET_MCP_NEO4J_PASSWORD: novanetpassword

tasks:
  # Step 1: Define target keywords (in production, use novanet_search)
  - id: define_keywords
    exec: |
      echo '[
        {"keyword": "qr code generator free", "volume": 12000, "intent": "transactional"},
        {"keyword": "create qr code online", "volume": 8500, "intent": "transactional"},
        {"keyword": "qr code for business", "volume": 4200, "intent": "informational"}
      ]'
    output:
      format: json

  # Step 2: Generate blog posts in parallel
  - id: generate_posts
    use:
      keyword_list: define_keywords
    for_each: "{{use.keyword_list}}"
    as: kw
    concurrency: 3
    fail_fast: false
    agent:
      prompt: |
        You are an SEO content writer for QR Code AI (qrcode-ai.com).

        Write a 500-word blog post targeting this keyword:
        - Keyword: {{use.kw.keyword}}
        - Search Volume: {{use.kw.volume}}
        - Intent: {{use.kw.intent}}

        Requirements:
        1. Use the exact keyword in H1
        2. Include 3 H2 subheadings
        3. Add internal links to /features and /pricing
        4. End with a CTA for free trial
        5. Write in a professional but approachable tone

        Return as JSON:
        {
          "title": "H1 title with keyword",
          "slug": "url-friendly-slug",
          "content": "Full markdown content",
          "meta_description": "155 char max"
        }

      mcp: [novanet]
      max_turns: 3
    output:
      format: json

  # Step 3: Validate SEO quality
  - id: validate_seo
    use:
      posts: generate_posts
    exec: |
      echo "=== SEO Validation Report ==="
      echo "Posts generated: 3"
      echo "Keywords covered:"
      echo "- qr code generator free"
      echo "- create qr code online"
      echo "- qr code for business"
      echo "Status: PASS"

  # Step 4: Summary output
  - id: summary
    use:
      validation: validate_seo
      posts: generate_posts
    infer: |
      Summarize this SEO content sprint:

      Posts generated: {{use.posts | length}}
      Validation: {{use.validation}}

      Provide a 3-bullet executive summary for the marketing team.

flows:
  - source: define_keywords
    target: generate_posts
  - source: generate_posts
    target: validate_seo
  - source: validate_seo
    target: summary
