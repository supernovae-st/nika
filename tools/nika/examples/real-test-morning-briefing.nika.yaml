# Morning Tech Briefing
#
# Complete integration test workflow demonstrating ALL verbs, multiple MCPs,
# parallelism, and complex DAG patterns.
#
# Pipeline:
# 1. Gathers system info (exec)
# 2. Fetches GitHub/HN data (fetch)
# 3. Researches tech news (invoke/Perplexity)
# 4. Scrapes trending content (invoke/Firecrawl)
# 5. Generates summaries in parallel (infer + for_each)
# 6. Orchestrates final briefing (agent)
#
# Usage:
#   nika examples/real-test-morning-briefing.nika.yaml
#
# Requirements:
#   - ANTHROPIC_API_KEY
#   - PERPLEXITY_API_KEY
#   - FIRECRAWL_API_KEY

schema: "nika/workflow@0.12"
workflow: morning-tech-briefing
description: "Daily tech briefing with multi-source research"

provider: claude
model: claude-sonnet-4-6

artifacts:
  dir: ~/.nika/briefings/{{date}}
  format: json
  manifest: true

mcp:
  perplexity:
    command: npx
    args: ["-y", "@perplexity-ai/mcp-server"]

  firecrawl:
    command: npx
    args: ["-y", "firecrawl-mcp"]

tasks:
  # =========================================================================
  # LAYER 0: Foundation - System Info & Time Check
  # =========================================================================

  - id: system_context
    description: "Get system context"
    exec: |
      echo '{
        "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
        "local_time": "'$(date +%H:%M)'",
        "timezone": "'$(date +%Z)'",
        "hostname": "'$(hostname)'",
        "user": "'$(whoami)'",
        "day_of_week": "'$(date +%A)'"
      }'
    output:
      format: json

  - id: fetch_github_status
    description: "Fetch GitHub status"
    fetch:
      url: "https://www.githubstatus.com/api/v2/status.json"
      method: GET
    output:
      format: json

  - id: fetch_hacker_news_top
    description: "Fetch HN top stories"
    fetch:
      url: "https://hacker-news.firebaseio.com/v0/topstories.json?print=pretty"
      method: GET
    output:
      format: json

  # =========================================================================
  # LAYER 1: Parallel Research (Fan-Out Pattern)
  # =========================================================================

  - id: research_ai_news
    description: "Research AI/LLM news"
    invoke:
      server: perplexity
      tool: perplexity_search
      params:
        query: "AI and LLM news today March 2026"
    output:
      format: json

  - id: research_rust_news
    description: "Research Rust news"
    invoke:
      server: perplexity
      tool: perplexity_search
      params:
        query: "Rust programming language news March 2026"
    output:
      format: json

  - id: research_startup_news
    description: "Research startup news"
    invoke:
      server: perplexity
      tool: perplexity_search
      params:
        query: "Tech startup funding news this week March 2026"
    output:
      format: json

  # =========================================================================
  # LAYER 2: Web Scraping (Firecrawl MCP)
  # =========================================================================

  - id: scrape_hn_frontpage
    description: "Scrape HN front page"
    invoke:
      server: firecrawl
      tool: firecrawl_scrape
      params:
        url: "https://news.ycombinator.com/"
        formats: ["markdown"]
        onlyMainContent: true
    output:
      format: json

  - id: scrape_techcrunch
    description: "Scrape TechCrunch"
    invoke:
      server: firecrawl
      tool: firecrawl_scrape
      params:
        url: "https://techcrunch.com/"
        formats: ["markdown"]
        onlyMainContent: true
    output:
      format: json

  # =========================================================================
  # LAYER 3: Parallel Summary Generation
  # =========================================================================

  - id: generate_topic_summaries
    description: "Generate summaries for each topic"
    for_each: ["AI/LLM", "Rust", "Startups"]
    as: topic
    concurrency: 3
    fail_fast: false
    with:
      ai: $research_ai_news
      rust: $research_rust_news
      startup: $research_startup_news
    infer:
      prompt: |
        Generate a brief 2-3 bullet point summary for the topic: {{with.topic}}

        Based on this research data:
        - AI News: {{with.ai | truncate: 500}}
        - Rust News: {{with.rust | truncate: 500}}
        - Startup News: {{with.startup | truncate: 500}}

        Focus ONLY on {{with.topic}}. Be concise and actionable.
    output:
      format: text

    depends_on: [research_ai_news, research_rust_news, research_startup_news]

  # =========================================================================
  # LAYER 4: Synthesis (Diamond Join)
  # =========================================================================

  - id: synthesize_scraped_content
    description: "Synthesize scraped content"
    with:
      hn: $scrape_hn_frontpage
      tc: $scrape_techcrunch
    infer:
      prompt: |
        Analyze these scraped tech news sources and extract the TOP 5 stories:

        **Hacker News:**
        {{with.hn | truncate: 1000}}

        **TechCrunch:**
        {{with.tc | truncate: 1000}}

        Output format:
        1. [Source] Story title - one sentence summary
    output:
      format: text

    depends_on: [scrape_hn_frontpage, scrape_techcrunch]

  - id: check_system_health
    description: "Check system health"
    with:
      system: $system_context
      github: $fetch_github_status
    infer:
      prompt: |
        Provide a quick system status check:

        System: {{with.system | to_yaml}}
        GitHub: {{with.github | to_yaml}}

        Format:
        - Local time: [time]
        - GitHub: [operational/degraded/outage]
    output:
      format: text

    depends_on: [system_context, fetch_github_status]

  # =========================================================================
  # LAYER 5: Final Orchestration (Agent)
  # =========================================================================

  - id: morning_briefing_agent
    description: "Generate morning briefing"
    with:
      system_health: $check_system_health
      top_stories: $synthesize_scraped_content
      topic_summaries: $generate_topic_summaries
      hn_ids: $fetch_hacker_news_top
    agent:
      prompt: |
        You are a Morning Tech Briefing Assistant.

        Create a personalized morning briefing using this data:

        **SYSTEM STATUS:**
        {{with.system_health}}

        **TOP STORIES TODAY:**
        {{with.top_stories}}

        **TOPIC SUMMARIES:**
        {{with.topic_summaries | to_yaml}}

        Structure the briefing with these sections:
        - Quick Status (1 line)
        - Must-Read Stories (top 3)
        - AI/LLM Highlights
        - Rust Community
        - Startup Watch
        - Action Items (if any)

        Keep it concise - this is a MORNING BRIEFING.
        Say "BRIEFING_COMPLETE" when done.

      mcp: [perplexity]
      max_turns: 5
      extended_thinking: true
      thinking_budget: 4000

    output:
      format: text

    artifact:
      path: briefing.md
      format: text

    depends_on: [check_system_health, synthesize_scraped_content, generate_topic_summaries, fetch_hacker_news_top]

  # =========================================================================
  # LAYER 6: Output & Archive
  # =========================================================================

  - id: save_briefing
    description: "Save briefing to file"
    with:
      briefing: $morning_briefing_agent
      timestamp: $system_context
    exec: |
      echo "=== MORNING BRIEFING GENERATED ==="
      echo "Timestamp: {{with.timestamp.timestamp}}"
      echo "Saved to: ~/.nika/briefings/"
      echo ""
      echo "{{with.briefing}}"

    depends_on: [morning_briefing_agent]
