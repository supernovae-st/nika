# Research Agent Workflow
#
# Comprehensive web research using multiple MCP tools.
# Combines Perplexity search, Firecrawl scraping, and Supadata transcripts.
#
# Usage:
#   nika examples/research-agent.nika.yaml
#
# Requirements:
#   - ANTHROPIC_API_KEY
#   - PERPLEXITY_API_KEY
#   - FIRECRAWL_API_KEY
#   - SUPADATA_API_KEY

schema: "nika/workflow@0.12"
workflow: research-agent
description: "Multi-source web research agent"

provider: claude
model: claude-sonnet-4-6

artifacts:
  dir: ./research/{{date}}
  format: json
  manifest: true

mcp:
  perplexity:
    command: npx
    args: ["-y", "@perplexity-ai/mcp-server"]

  firecrawl:
    command: npx
    args: ["-y", "firecrawl-mcp"]

  supadata:
    command: npx
    args: ["-y", "@supadata/mcp"]

inputs:
  topic:
    type: string
    description: "Research topic"
    default: "AI QR code generation market trends 2025"
  depth:
    type: string
    description: "Research depth"
    default: "comprehensive"
    enum: [quick, standard, comprehensive]

tasks:
  - id: research
    description: "Deep research using all available tools"
    agent:
      prompt: |
        You are an expert researcher with access to multiple web tools.

        RESEARCH TOPIC: {{inputs.topic}}
        RESEARCH DEPTH: {{inputs.depth}}

        AVAILABLE TOOLS:
        1. perplexity_search - AI-synthesized web search
        2. firecrawl_scrape - Extract content from URLs (use for articles, docs)
        3. firecrawl_search - Search and scrape in one step
        4. supadata_transcript - Get video transcripts (YouTube, etc.)
        5. supadata_scrape - Alternative web scraper

        RESEARCH STRATEGY:
        1. Start with perplexity_search for overview
        2. Identify key sources from search results
        3. Use firecrawl_scrape for detailed content extraction
        4. If video content is relevant, use supadata_transcript
        5. Synthesize all findings

        When complete, output "RESEARCH_COMPLETE".

      mcp: [perplexity, firecrawl, supadata]
      max_turns: 15
      extended_thinking: true
      thinking_budget: 8000

    output:
      format: json
      schema:
        type: object
        required: [topic, executive_summary, key_findings, sources_consulted]
        properties:
          topic:
            type: string
          executive_summary:
            type: string
            maxLength: 500
          key_findings:
            type: array
            items:
              type: object
              required: [finding, source, confidence]
              properties:
                finding:
                  type: string
                source:
                  type: string
                confidence:
                  type: string
                  enum: [high, medium, low]
            minItems: 3
          detailed_sections:
            type: array
            items:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                sources:
                  type: array
                  items:
                    type: string
          data_points:
            type: array
            items:
              type: object
              properties:
                metric:
                  type: string
                value:
                  type: string
                source:
                  type: string
          sources_consulted:
            type: array
            items:
              type: object
              required: [url, type]
              properties:
                url:
                  type: string
                type:
                  type: string
                  enum: [article, video, doc]
                relevance:
                  type: string
                  enum: [high, medium, low]
          gaps_and_limitations:
            type: array
            items:
              type: string
          recommended_next_steps:
            type: array
            items:
              type: string
      max_retries: 2

    artifact:
      path: research-report.json
