# Schema Check Workflow
#
# Discover available arc types from the NovaNet knowledge graph.
# Uses the MCP invoke verb to query the novanet_describe tool.
#
# Usage:
#   nika examples/schema-check.nika.yaml
#
# Requirements:
#   - NovaNet MCP server running (cargo run in tools/novanet-mcp)
#   - Neo4j database with NovaNet schema

schema: "nika/workflow@0.10"
workflow: schema-check
description: "Query NovaNet schema via MCP"

provider: claude
model: claude-sonnet-4-6

mcp:
  novanet:
    command: cargo
    args:
      - run
      - --manifest-path
      - ../../../novanet/tools/novanet-mcp/Cargo.toml
    env:
      NOVANET_MCP_NEO4J_URI: bolt://localhost:7687
      NOVANET_MCP_NEO4J_USER: neo4j
      NOVANET_MCP_NEO4J_PASSWORD: novanetpassword

tasks:
  - id: schema
    description: "Get NovaNet schema overview"
    invoke:
      server: novanet
      tool: novanet_describe
      params:
        describe: schema
    output:
      format: json
