<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO / GEO Audit Dashboard</title>
<!--
  Self-contained dashboard: all data is embedded by the Nika workflow at build time.
  No user input is processed. innerHTML usage is safe in this context (no XSS surface).
  See: docs/research/2026-04-04-treemap-dashboard-research.md, Security note.
-->
<style>
/* ========================================================================
   BASE THEME
   ======================================================================== */
:root {
  --bg-body: #0f1117;
  --bg-card: #1e2130;
  --bg-card-hover: #252840;
  --border: #2d3148;
  --border-light: #3d4168;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --green: #10b981;
  --green-dim: rgba(16, 185, 129, 0.15);
  --yellow: #f59e0b;
  --yellow-dim: rgba(245, 158, 11, 0.15);
  --red: #ef4444;
  --red-dim: rgba(239, 68, 68, 0.15);
  --blue: #6366f1;
  --blue-dim: rgba(99, 102, 241, 0.15);
  --cyan: #06b6d4;
  --cyan-dim: rgba(6, 182, 212, 0.15);
  --orange: #f97316;
  --purple: #a855f7;
  --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --radius: 8px;
  --radius-sm: 4px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg-body);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.dashboard {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px;
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 20px;
}

.dashboard-header {
  grid-column: 1 / -1;
  display: flex;
  align-items: baseline;
  gap: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}

.dashboard-header h1 {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.dashboard-header .subtitle {
  color: var(--text-muted);
  font-size: 13px;
}

/* Card base */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  position: relative;
  transition: border-color 200ms ease;
}

.card:hover {
  border-color: var(--border-light);
}

.card-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: 16px;
}

/* ========================================================================
   TOOLTIP
   ======================================================================== */
.viz-tooltip {
  position: fixed;
  pointer-events: none;
  background: #1a1d2e;
  border: 1px solid var(--border-light);
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--text-primary);
  z-index: 9999;
  opacity: 0;
  transition: opacity 120ms ease;
  max-width: 280px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  line-height: 1.5;
}

.viz-tooltip.visible { opacity: 1; }

.viz-tooltip .tt-label {
  color: var(--text-muted);
  font-size: 11px;
}

.viz-tooltip .tt-value {
  font-weight: 600;
  font-family: var(--font-mono);
}

/* ========================================================================
   A. HEALTH RING  (span 3 cols)
   ======================================================================== */
.health-ring-card { grid-column: span 3; }

.health-ring-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.health-ring-svg {
  width: 180px;
  height: 180px;
}

.health-ring-bg {
  fill: none;
  stroke: var(--border);
  stroke-width: 12;
}

.health-ring-fg {
  fill: none;
  stroke-width: 12;
  stroke-linecap: round;
  transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1),
              stroke 0.3s ease;
  transform-origin: center;
  transform: rotate(-90deg);
}

.health-ring-label {
  font-size: 36px;
  font-weight: 700;
  fill: var(--text-primary);
  font-family: var(--font-mono);
}

.health-ring-unit {
  font-size: 14px;
  fill: var(--text-muted);
}

.health-ring-legend {
  display: flex;
  gap: 16px;
  font-size: 12px;
  color: var(--text-secondary);
}

.health-ring-legend span::before {
  content: '';
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
}

.legend-good::before { background: var(--green); }
.legend-warn::before { background: var(--yellow); }
.legend-bad::before  { background: var(--red); }

/* ========================================================================
   B. STATUS DISTRIBUTION  (span 5 cols)
   ======================================================================== */
.status-dist-card { grid-column: span 5; }

.status-bar-container {
  margin-top: 8px;
}

.status-bar {
  display: flex;
  height: 32px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--border);
}

.status-bar-segment {
  height: 100%;
  position: relative;
  transition: flex 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
  min-width: 2px;
}

.status-bar-segment:hover {
  filter: brightness(1.25);
}

.status-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 20px;
  margin-top: 14px;
  font-size: 12px;
}

.status-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-secondary);
}

.status-legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}

.status-legend-count {
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--text-primary);
  margin-left: 2px;
}

/* ========================================================================
   C. DEPTH HEATMAP  (span 4 cols)
   ======================================================================== */
.depth-heatmap-card { grid-column: span 4; }

.depth-bars {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  height: 160px;
  padding-top: 8px;
}

.depth-bar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  height: 100%;
  justify-content: flex-end;
}

.depth-bar {
  width: 100%;
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1),
              background-color 0.3s ease;
  cursor: pointer;
  position: relative;
  min-height: 4px;
}

.depth-bar:hover {
  filter: brightness(1.3);
}

.depth-bar-count {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-primary);
  text-align: center;
}

.depth-bar-label {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

/* ========================================================================
   D. AI CRAWLER ACCESS GRID  (span 4 cols)
   ======================================================================== */
.crawler-grid-card { grid-column: span 4; }

.crawler-grid {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 12px;
  align-items: center;
}

.crawler-row {
  display: contents;
  cursor: default;
}

.crawler-name {
  font-size: 13px;
  font-weight: 500;
  padding: 6px 0;
  color: var(--text-primary);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}

.crawler-status {
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
}

.crawler-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.crawler-dot-allowed { background: var(--green); box-shadow: 0 0 6px var(--green-dim); }
.crawler-dot-blocked { background: var(--red); box-shadow: 0 0 6px var(--red-dim); }
.crawler-dot-unknown { background: var(--text-muted); }

.crawler-status-text { color: var(--text-secondary); }

.crawler-summary {
  grid-column: 1 / -1;
  display: flex;
  gap: 16px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  font-size: 12px;
}

.crawler-summary-item {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-secondary);
}

.crawler-summary-item .count {
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--text-primary);
}

/* Extras row for llms.txt and citability */
.crawler-extras {
  grid-column: 1 / -1;
  display: flex;
  gap: 20px;
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-secondary);
}

.crawler-extras .badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 500;
  font-size: 11px;
}

.badge-ok { background: var(--green-dim); color: var(--green); }
.badge-warn { background: var(--yellow-dim); color: var(--yellow); }
.badge-bad { background: var(--red-dim); color: var(--red); }

/* ========================================================================
   E. LOCALE COVERAGE TABLE  (span 8 cols)
   ======================================================================== */
.locale-coverage-card { grid-column: span 8; }

.locale-table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.locale-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.locale-table th {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  padding: 8px 10px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg-card);
}

.locale-table th:first-child {
  text-align: left;
  min-width: 140px;
}

.locale-table td {
  padding: 7px 10px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-mono);
}

.locale-table td:first-child {
  text-align: left;
  font-family: var(--font-sans);
  font-weight: 500;
  color: var(--text-primary);
}

.locale-table tr:hover td {
  background: rgba(99, 102, 241, 0.04);
}

.locale-check {
  color: var(--green);
  font-size: 15px;
}

.locale-gap {
  color: var(--red);
  font-size: 13px;
  opacity: 0.7;
}

.locale-count {
  font-size: 11px;
  color: var(--text-muted);
}

.locale-coverage-pct {
  font-weight: 600;
  font-size: 12px;
}

/* ========================================================================
   F. RESPONSE TIME HISTOGRAM  (span 6 cols)
   ======================================================================== */
.response-hist-card { grid-column: span 6; }

.histogram {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 140px;
  padding-top: 8px;
}

.hist-bar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  height: 100%;
  justify-content: flex-end;
}

.hist-bar {
  width: 100%;
  border-radius: 2px 2px 0 0;
  transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
  min-height: 2px;
}

.hist-bar:hover {
  filter: brightness(1.35);
}

.hist-count {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-secondary);
}

.hist-label {
  font-size: 9px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  white-space: nowrap;
}

.histogram-stats {
  display: flex;
  gap: 24px;
  margin-top: 14px;
  font-size: 12px;
  color: var(--text-secondary);
}

.histogram-stats .stat-value {
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--text-primary);
}

/* ========================================================================
   G. MARKDOWN REPORT  (span 6 cols)
   ======================================================================== */
.report-card { grid-column: span 6; }

.report-content {
  max-height: 480px;
  overflow-y: auto;
  padding-right: 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.report-content::-webkit-scrollbar { width: 6px; }
.report-content::-webkit-scrollbar-track { background: transparent; }
.report-content::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}

/* Markdown rendered styles */
.md h1 { font-size: 20px; font-weight: 700; margin: 20px 0 10px; color: var(--text-primary); }
.md h2 { font-size: 16px; font-weight: 600; margin: 18px 0 8px; color: var(--text-primary); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.md h3 { font-size: 14px; font-weight: 600; margin: 14px 0 6px; color: var(--text-primary); }
.md h4 { font-size: 13px; font-weight: 600; margin: 12px 0 4px; color: var(--text-secondary); }

.md p { margin: 8px 0; color: var(--text-secondary); line-height: 1.7; }

.md strong { color: var(--text-primary); font-weight: 600; }
.md em { font-style: italic; }
.md code {
  font-family: var(--font-mono);
  font-size: 12px;
  background: rgba(99, 102, 241, 0.1);
  color: var(--blue);
  padding: 1px 5px;
  border-radius: 3px;
}

.md pre {
  background: #13151f;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin: 10px 0;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.5;
  color: var(--text-secondary);
}

.md pre code {
  background: none;
  padding: 0;
  color: inherit;
}

.md ul, .md ol {
  margin: 8px 0;
  padding-left: 24px;
  color: var(--text-secondary);
}

.md li { margin: 3px 0; }
.md li::marker { color: var(--text-muted); }

.md blockquote {
  border-left: 3px solid var(--blue);
  padding: 6px 14px;
  margin: 10px 0;
  color: var(--text-muted);
  background: rgba(99, 102, 241, 0.04);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

.md hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 16px 0;
}

.md table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
  font-size: 12px;
}

.md table th {
  text-align: left;
  font-weight: 600;
  padding: 6px 10px;
  border-bottom: 2px solid var(--border);
  color: var(--text-primary);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.md table td {
  padding: 5px 10px;
  border-bottom: 1px solid var(--border);
  color: var(--text-secondary);
}

.md table tr:hover td { background: rgba(99, 102, 241, 0.04); }

.md a {
  color: var(--cyan);
  text-decoration: none;
}

.md a:hover { text-decoration: underline; }

/* ========================================================================
   RESPONSIVE
   ======================================================================== */
@media (max-width: 1100px) {
  .dashboard { grid-template-columns: repeat(6, 1fr); gap: 16px; }
  .health-ring-card { grid-column: span 3; }
  .status-dist-card { grid-column: span 3; }
  .depth-heatmap-card { grid-column: span 3; }
  .crawler-grid-card { grid-column: span 3; }
  .locale-coverage-card { grid-column: span 6; }
  .response-hist-card { grid-column: span 6; }
  .report-card { grid-column: span 6; }
}

@media (max-width: 700px) {
  .dashboard {
    grid-template-columns: 1fr;
    padding: 12px;
  }
  .dashboard > * { grid-column: 1 / -1 !important; }
}
</style>
</head>

// SHARED TOOLTIP UTILITY
// ============================================================================
(function() {
  var tooltip = document.getElementById('tooltip');

  window.showTooltip = function(evt, htmlContent) {
    tooltip.textContent = '';
    // Build tooltip content safely via a DocumentFragment parsed from trusted source
    // Note: all tooltip content is generated from embedded data, not user input
    var fragment = document.createRange().createContextualFragment(htmlContent);
    tooltip.appendChild(fragment);
    tooltip.classList.add('visible');
    positionTooltip(evt);
  };

  function positionTooltip(evt) {
    var x = evt.clientX + 12;
    var y = evt.clientY - 8;
    var rect = tooltip.getBoundingClientRect();
    if (x + rect.width > window.innerWidth - 8) x = evt.clientX - rect.width - 12;
    if (y + rect.height > window.innerHeight - 8) y = evt.clientY - rect.height - 8;
    if (y < 8) y = 8;
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
  }

  window.hideTooltip = function() {
    tooltip.classList.remove('visible');
  };

  document.addEventListener('mousemove', function(e) {
    if (tooltip.classList.contains('visible')) positionTooltip(e);
  });
})();


// ============================================================================
// SAFE DOM HELPERS
// All content in this dashboard is from embedded data, not user input.
// These helpers use textContent for plain text and createRange for
// trusted HTML fragments (tooltip formatting etc).
// ============================================================================
function setHTML(el, htmlContent) {
  el.textContent = '';
  var fragment = document.createRange().createContextualFragment(htmlContent);
  el.appendChild(fragment);
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.textContent.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function escapeHtmlRaw(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

(function renderLocaleCoverage() {
  var container = document.getElementById('locale-coverage');

  // Extract locales and sections from TREE
  var locales = TREE.children.map(function(c) { return c.name; });
  var sectionSet = {};
  TREE.children.forEach(function(locale) {
    (locale.children || []).forEach(function(sec) {
      sectionSet[sec.name] = true;
    });
  });
  var sections = Object.keys(sectionSet).sort();

  // Build lookup: locale -> section -> count
  var lookup = {};
  TREE.children.forEach(function(locale) {
    lookup[locale.name] = {};
    (locale.children || []).forEach(function(sec) {
      lookup[locale.name][sec.name] = sec.value;
    });
  });

  var table = document.createElement('table');
  table.className = 'locale-table';
  table.setAttribute('role', 'table');
  table.setAttribute('aria-label', 'Locale and section coverage matrix');

  // Header
  var thead = document.createElement('thead');
  var headerRow = document.createElement('tr');

  var thSection = document.createElement('th');
  thSection.textContent = 'Section';
  headerRow.appendChild(thSection);

  locales.forEach(function(loc) {
    var th = document.createElement('th');
    th.textContent = loc.toUpperCase();
    headerRow.appendChild(th);
  });

  var thCoverage = document.createElement('th');
  thCoverage.textContent = 'Coverage';
  headerRow.appendChild(thCoverage);
  thead.appendChild(headerRow);
  table.appendChild(thead);

  // Body
  var tbody = document.createElement('tbody');
  sections.forEach(function(section) {
    var tr = document.createElement('tr');

    var tdName = document.createElement('td');
    tdName.textContent = section;
    tr.appendChild(tdName);

    var present = 0;
    locales.forEach(function(loc) {
      var td = document.createElement('td');
      var val = lookup[loc] && lookup[loc][section];
      if (val && val > 0) {
        present++;
        var checkSpan = document.createElement('span');
        checkSpan.className = 'locale-check';
        checkSpan.setAttribute('aria-label', 'Present');
        checkSpan.textContent = '\u2713';
        td.appendChild(checkSpan);

        td.appendChild(document.createTextNode(' '));

        var countSpan = document.createElement('span');

        countSpan.textContent = String(val);
        td.appendChild(countSpan);
      } else {
        var gapSpan = document.createElement('span');
        gapSpan.className = 'locale-gap';
        gapSpan.setAttribute('aria-label', 'Missing');
        gapSpan.textContent = '\u2014';
        td.appendChild(gapSpan);
      }
      tr.appendChild(td);
    });

    var tdPct = document.createElement('td');
    var pct = Math.round(present / locales.length * 100);
    var pctColor = pct === 100 ? 'var(--green)' : pct >= 50 ? 'var(--yellow)' : 'var(--red)';

    tr.appendChild(tdPct);

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  container.appendChild(table);
})();

(function renderResponseHist() {
  var container = document.getElementById('response-hist');
  var statsEl = document.getElementById('response-hist-stats');
  var times = (STATS.response_times || []).slice().sort(function(a, b) { return a - b; });

  if (times.length === 0) {
    var msg = document.createElement('div');
    msg.style.color = 'var(--text-muted)';
    msg.style.padding = '20px';
    msg.textContent = 'No response time data available.';
    container.appendChild(msg);
    return;
  }

  // Define buckets (ms)
  var bucketEdges = [0, 100, 200, 300, 400, 500, 750, 1000, 1500, 2000, 3000, Infinity];
  var buckets = [];
  for (var i = 0; i < bucketEdges.length - 1; i++) {
    var lo = bucketEdges[i];
    var hi = bucketEdges[i + 1];
    var label;
    if (hi === Infinity) label = lo + '+';
    else label = lo + '-' + hi;
    buckets.push({ lo: lo, hi: hi, label: label, count: 0 });
  }

  times.forEach(function(t) {
    for (var b = 0; b < buckets.length; b++) {
      if (t >= buckets[b].lo && t < buckets[b].hi) {
        buckets[b].count++;
        break;
      }
    }
  });

  var maxCount = Math.max.apply(null, buckets.map(function(b) { return b.count; }));

  // Color function: green < 300, yellow 300-1000, red > 1000
  function bucketColor(lo) {
    if (lo < 300) return 'var(--green)';
    if (lo < 1000) return 'var(--yellow)';
    return 'var(--red)';
  }

  buckets.forEach(function(bucket, idx) {
    var col = document.createElement('div');
    col.className = 'hist-bar-col';

    var countEl = document.createElement('div');
    countEl.className = 'hist-count';
    countEl.textContent = bucket.count > 0 ? String(bucket.count) : '';

    var barEl = document.createElement('div');
    barEl.className = 'hist-bar';
    barEl.style.height = '0%';
    barEl.style.background = bucketColor(bucket.lo);
    barEl.setAttribute('aria-label', bucket.label + 'ms: ' + bucket.count + ' pages');

    barEl.addEventListener('mouseenter', function(e) {
      showTooltip(e,
        '<span class="tt-label">' + escapeHtmlRaw(bucket.label) + ' ms</span><br>' +
        '<span class="tt-value">' + bucket.count + '</span> pages'
      );
    });
    barEl.addEventListener('mouseleave', hideTooltip);

    var labelEl = document.createElement('div');
    labelEl.className = 'hist-label';
    labelEl.textContent = bucket.label;

    col.appendChild(countEl);
    col.appendChild(barEl);
    col.appendChild(labelEl);
    container.appendChild(col);

    // Animate
    requestAnimationFrame(function() {
      setTimeout(function() {
        var pct = maxCount > 0 ? (bucket.count / maxCount * 100) : 0;
        barEl.style.height = Math.max(pct, bucket.count > 0 ? 3 : 0) + '%';
      }, idx * 50);
    });
  });

  // Stats summary
  var total = times.length;
  var sum = times.reduce(function(a, b) { return a + b; }, 0);
  var avg = Math.round(sum / total);
  var median = times[Math.floor(total / 2)];
  var p95 = times[Math.floor(total * 0.95)];
  var p99 = times[Math.floor(total * 0.99)];

  var statsDefs = [
    { label: 'Avg', value: avg + 'ms' },
    { label: 'Median', value: median + 'ms' },
    { label: 'P95', value: p95 + 'ms' },
    { label: 'P99', value: p99 + 'ms' },
    { label: 'Total', value: String(total) + ' pages' }
  ];

  statsDefs.forEach(function(stat) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(stat.label + ' '));
    var valSpan = document.createElement('span');
    valSpan.className = 'stat-value';
    valSpan.textContent = stat.value;
    div.appendChild(valSpan);
    statsEl.appendChild(div);
  });
})();

/**
 * Minimal markdown-to-HTML renderer.
 * Supports: headings, bold, italic, inline code, code blocks, blockquotes,
 * ordered/unordered lists, tables, horizontal rules, links, paragraphs.
 *
 * No external dependencies. Operates on trusted embedded data only.
 */
function renderMarkdown(src) {
  var lines = src.split('\n');
  var out = [];
  var i = 0;
  var len = lines.length;

  while (i < len) {
    var line = lines[i];

    // Fenced code block
    if (line.match(/^```/)) {
      var lang = line.slice(3).trim();
      var code = [];
      i++;
      while (i < len && !lines[i].match(/^```/)) {
        code.push(escapeHtmlRaw(lines[i]));
        i++;
      }
      i++; // skip closing ```
      out.push('<pre><code' + (lang ? ' class="lang-' + escapeHtmlRaw(lang) + '"' : '') + '>' + code.join('\n') + '</code></pre>');
      continue;
    }

    // Heading
    var headingMatch = line.match(/^(#{1,6})\s+(.+)/);
    if (headingMatch) {
      var level = headingMatch[1].length;
      out.push('<h' + level + '>' + inlineFormat(headingMatch[2]) + '</h' + level + '>');
      i++;
      continue;
    }

    // Horizontal rule
    if (line.match(/^(-{3,}|\*{3,}|_{3,})\s*$/)) {
      out.push('<hr>');
      i++;
      continue;
    }

    // Blockquote
    if (line.match(/^>\s?/)) {
      var bq = [];
      while (i < len && lines[i].match(/^>\s?/)) {
        bq.push(lines[i].replace(/^>\s?/, ''));
        i++;
      }
      out.push('<blockquote>' + renderMarkdown(bq.join('\n')) + '</blockquote>');
      continue;
    }

    // Table
    if (line.match(/^\|/) && i + 1 < len && lines[i + 1].match(/^\|[\s\-:|]+\|/)) {
      var headerCells = parseTableRow(line);
      i++; // skip to separator line

      // Parse alignment from separator
      var sepCells = parseTableRow(lines[i]);
      var aligns = sepCells.map(function(cell) {
        var trimmed = cell.trim();
        if (trimmed.match(/^:.*:$/)) return 'center';
        if (trimmed.match(/:$/)) return 'right';
        return 'left';
      });
      i++;

      var tableHtml = '<table><thead><tr>';
      headerCells.forEach(function(cell, ci) {
        var align = aligns[ci] || 'left';
        tableHtml += '<th style="text-align:' + align + '">' + inlineFormat(cell.trim()) + '</th>';
      });
      tableHtml += '</tr></thead><tbody>';

      while (i < len && lines[i].match(/^\|/)) {
        var rowCells = parseTableRow(lines[i]);
        tableHtml += '<tr>';
        rowCells.forEach(function(cell, ci) {
          var align = aligns[ci] || 'left';
          tableHtml += '<td style="text-align:' + align + '">' + inlineFormat(cell.trim()) + '</td>';
        });
        tableHtml += '</tr>';
        i++;
      }

      tableHtml += '</tbody></table>';
      out.push(tableHtml);
      continue;
    }

    // Unordered list
    if (line.match(/^[\s]*[-*+]\s/)) {
      var listItems = [];
      while (i < len && lines[i].match(/^[\s]*[-*+]\s/)) {
        listItems.push(inlineFormat(lines[i].replace(/^[\s]*[-*+]\s/, '')));
        i++;
      }
      out.push('<ul>' + listItems.map(function(li) { return '<li>' + li + '</li>'; }).join('') + '</ul>');
      continue;
    }

    // Ordered list
    if (line.match(/^[\s]*\d+\.\s/)) {
      var olItems = [];
      while (i < len && lines[i].match(/^[\s]*\d+\.\s/)) {
        olItems.push(inlineFormat(lines[i].replace(/^[\s]*\d+\.\s/, '')));
        i++;
      }
      out.push('<ol>' + olItems.map(function(li) { return '<li>' + li + '</li>'; }).join('') + '</ol>');
      continue;
    }

    // Empty line
    if (line.trim() === '') {
      i++;
      continue;
    }

    // Paragraph (collect consecutive non-empty, non-special lines)
    var para = [];
    while (i < len && lines[i].trim() !== '' &&
           !lines[i].match(/^(#{1,6}\s|```|>\s?|\||-{3,}|\*{3,}|_{3,}|[\s]*[-*+]\s|[\s]*\d+\.\s)/) ) {
      para.push(lines[i]);
      i++;
    }
    if (para.length > 0) {
      out.push('<p>' + inlineFormat(para.join(' ')) + '</p>');
    }
  }

  return out.join('\n');
}

function parseTableRow(line) {
  return line.replace(/^\|/, '').replace(/\|$/, '').split('|');
}

function inlineFormat(text) {
  // Inline code (must be first to protect content from further formatting)
  text = text.replace(/`([^`]+)`/g, function(_, code) {
    return '<code>' + escapeHtmlRaw(code) + '</code>';
  });
  // Bold + italic
  text = text.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Links [text](url)
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // Strikethrough
  text = text.replace(/~~(.+?)~~/g, '<del>$1</del>');
  return text;
}
