# Sequential Thinking Workflow
#
# Uses the sequential-thinking MCP server for step-by-step reasoning.
# Ideal for complex problems that need structured analysis.
#
# Usage:
#   nika examples/sequential-thinking.nika.yaml
#
# Requirements:
#   - ANTHROPIC_API_KEY

schema: "nika/workflow@0.10"
workflow: sequential-thinking
description: "Step-by-step reasoning using sequential-thinking MCP"

provider: claude
model: claude-sonnet-4-6

artifacts:
  dir: ./thinking/{{date}}
  format: json
  manifest: true

mcp:
  sequential-thinking:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-sequential-thinking"]

inputs:
  problem:
    type: string
    description: "Problem to analyze"
    default: "Design a caching strategy for a high-traffic API with 10M daily requests, mixed read/write patterns, and strict consistency requirements"
  context:
    type: string
    description: "Problem context"
    default: "E-commerce platform with product catalog and inventory"

tasks:
  - id: analyze
    description: "Deep analysis using sequential thinking"
    agent:
      prompt: |
        You are a senior systems architect. Analyze this problem using structured reasoning.

        PROBLEM: {{inputs.problem}}
        CONTEXT: {{inputs.context}}

        Use the sequentialthinking tool to break down the analysis:
        1. First, identify the key constraints and requirements
        2. Then, explore possible approaches (at least 3)
        3. Analyze trade-offs for each approach
        4. Consider edge cases and failure modes
        5. Make a recommendation with justification

        For EACH step, use sequentialthinking with:
        - thought: Your current analysis
        - thoughtNumber: Current step (1, 2, 3...)
        - totalThoughts: Estimated total steps
        - nextThoughtNeeded: true (until final conclusion)

        Say "ANALYSIS_COMPLETE" when done.

      mcp: [sequential-thinking]
      max_turns: 15
      extended_thinking: true
      thinking_budget: 10000

    output:
      format: json
      schema:
        type: object
        required: [problem_summary, constraints, approaches, recommendation]
        properties:
          problem_summary:
            type: string
          constraints:
            type: array
            items:
              type: string
            minItems: 3
          approaches:
            type: array
            items:
              type: object
              required: [name, pros, cons]
              properties:
                name:
                  type: string
                pros:
                  type: array
                  items:
                    type: string
                cons:
                  type: array
                  items:
                    type: string
            minItems: 3
          recommendation:
            type: object
            required: [approach, justification]
            properties:
              approach:
                type: string
              justification:
                type: string
              implementation_notes:
                type: array
                items:
                  type: string
          risks_and_mitigations:
            type: array
            items:
              type: object
              required: [risk, mitigation]
              properties:
                risk:
                  type: string
                mitigation:
                  type: string
      max_retries: 2

    artifact:
      path: analysis-result.json
