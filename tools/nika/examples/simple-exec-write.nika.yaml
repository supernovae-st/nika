# Simple Exec-Write Workflow
#
# Execute a shell command and save output to a file.
# Demonstrates basic exec verb and task dependencies via flow.
#
# Usage:
#   nika examples/simple-exec-write.nika.yaml
#
# Output:
#   /tmp/nika-output.txt

schema: "nika/workflow@0.12"
workflow: simple-exec-write
description: "Execute a command and save output to filesystem"

provider: claude
model: claude-sonnet-4-6

tasks:
  - id: get_date
    description: "Get current timestamp"
    exec: "date '+%Y-%m-%d %H:%M:%S'"

  - id: save_to_file
    description: "Save timestamp to file"
    with:
      timestamp: $get_date
    exec: "echo 'Workflow executed at: {{with.timestamp}}' > /tmp/nika-output.txt && echo 'Saved to /tmp/nika-output.txt'"
    depends_on: [get_date]
