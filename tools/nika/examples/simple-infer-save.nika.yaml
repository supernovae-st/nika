# Simple workflow: Generate text with LLM and save to file
# Run with: OPENAI_API_KEY=sk-... nika examples/simple-infer-save.nika.yaml
# Output: /tmp/nika-generated.txt

schema: "nika/workflow@0.3"
workflow: simple-infer-save
description: Generate AI text and save to filesystem
provider: openai  # Also works with claude (set ANTHROPIC_API_KEY)

tasks:
  - id: generate
    infer: "Write a haiku about Rust programming. Just the haiku, nothing else."

  - id: save_text
    use:
      haiku: generate
    exec: |
      cat > /tmp/nika-generated.txt << 'EOF'
      Generated by Nika v0.7.2
      ========================

      {{use.haiku}}
      EOF
      echo 'Saved to /tmp/nika-generated.txt'

flows:
  - source: generate
    target: save_text
