# Simple Infer-Save Workflow
#
# Generate text with an LLM and save to a file.
# Demonstrates the infer verb with text output.
#
# Usage:
#   nika examples/simple-infer-save.nika.yaml
#
# Requirements:
#   - ANTHROPIC_API_KEY environment variable
#
# Output:
#   /tmp/nika-generated.txt

schema: "nika/workflow@0.10"
workflow: simple-infer-save
description: "Generate AI text and save to filesystem"

provider: claude
model: claude-sonnet-4-6

tasks:
  - id: generate
    description: "Generate a haiku about Rust"
    infer:
      prompt: "Write a haiku about Rust programming. Just the haiku, nothing else."
    output:
      format: text

  - id: save_text
    description: "Save generated haiku to file"
    use:
      haiku: generate
    exec: |
      cat > /tmp/nika-generated.txt << 'EOF'
      Generated by Nika v0.19.1
      ==========================

      {{use.haiku}}
      EOF
      echo 'Saved to /tmp/nika-generated.txt'
    flow: [generate]
