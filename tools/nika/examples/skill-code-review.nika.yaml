# Code Review Workflow
#
# Implements systematic code review as a Nika workflow.
# Checks for bugs, security issues, performance, and code quality.
#
# Pipeline: input -> (parallel) [static + security + bugs + performance] -> synthesis
#
# Usage:
#   nika examples/skill-code-review.nika.yaml
#
# Requirements:
#   - ANTHROPIC_API_KEY

schema: "nika/workflow@0.10"
workflow: skill-code-review
description: "Systematic code review for bugs, security, and quality"

provider: claude
model: claude-sonnet-4-6

artifacts:
  dir: ./code-review/{{date}}
  format: json
  manifest: true

inputs:
  files:
    type: array
    description: "Files to review"
    default: ["src/lib.rs", "src/main.rs"]
  focus_areas:
    type: array
    description: "Focus areas for review"
    default: ["security", "performance", "error_handling"]
  language:
    type: string
    description: "Programming language"
    default: "rust"
  context:
    type: string
    description: "Project context"
    default: "Production Rust CLI tool"

tasks:
  # ========================================================================
  # PHASE 1: Static Analysis
  # ========================================================================

  - id: static_analysis
    description: "Run static analysis checks"
    infer:
      prompt: |
        You are reviewing {{inputs.language}} code.

        FILES TO REVIEW: {{inputs.files | to_yaml}}
        CONTEXT: {{inputs.context}}

        STATIC ANALYSIS CHECKLIST:
        1. Identify unused imports/variables
        2. Find code duplication
        3. Check naming conventions
        4. Verify documentation coverage
        5. Check for TODO/FIXME comments

    output:
      format: json
      schema:
        type: object
        required: [unused_code, naming_issues, missing_docs]
        properties:
          unused_code:
            type: array
            items:
              type: string
          duplication:
            type: array
            items:
              type: string
          naming_issues:
            type: array
            items:
              type: string
          missing_docs:
            type: array
            items:
              type: string
          todos:
            type: array
            items:
              type: string
      max_retries: 2

    artifact:
      path: analysis/static.json

  # ========================================================================
  # PHASE 2: Security Review
  # ========================================================================

  - id: security_review
    description: "Check for security vulnerabilities"
    infer:
      prompt: |
        Security review for {{inputs.language}} code.

        CONTEXT: {{inputs.context}}

        SECURITY CHECKLIST (OWASP-aligned):
        1. Input validation - Are all inputs sanitized?
        2. Authentication/Authorization - Proper access control?
        3. Injection risks - SQL, command, path injection?
        4. Sensitive data - Passwords, keys, PII exposed?
        5. Error handling - Do errors leak sensitive info?
        6. Dependencies - Known vulnerable packages?

        For each issue: SEVERITY, LOCATION, DESCRIPTION, FIX

    output:
      format: json
      schema:
        type: object
        required: [vulnerabilities]
        properties:
          vulnerabilities:
            type: array
            items:
              type: object
              required: [severity, location, description, fix]
              properties:
                severity:
                  type: string
                  enum: [Critical, High, Medium, Low]
                location:
                  type: string
                description:
                  type: string
                fix:
                  type: string
          secure_practices_missing:
            type: array
            items:
              type: string
          recommendations:
            type: array
            items:
              type: string
      max_retries: 2

    artifact:
      path: analysis/security.json

  # ========================================================================
  # PHASE 3: Bug Review
  # ========================================================================

  - id: bug_review
    description: "Find logic errors and potential bugs"
    infer:
      prompt: |
        Bug hunting in {{inputs.language}} code.

        CONTEXT: {{inputs.context}}

        BUG DETECTION CHECKLIST:
        1. Off-by-one errors
        2. Null/None/undefined handling
        3. Race conditions (if concurrent)
        4. Resource leaks (files, connections)
        5. Integer overflow/underflow
        6. Incorrect error handling
        7. Edge cases not handled

        CONFIDENCE: HIGH (definitely bug), MEDIUM (likely bug), LOW (potential issue)
        Only report HIGH or MEDIUM confidence issues.

    output:
      format: json
      schema:
        type: object
        required: [bugs]
        properties:
          bugs:
            type: array
            items:
              type: object
              required: [confidence, location, description, impact, fix]
              properties:
                confidence:
                  type: string
                  enum: [HIGH, MEDIUM]
                location:
                  type: string
                description:
                  type: string
                impact:
                  type: string
                fix:
                  type: string
      max_retries: 2

    artifact:
      path: analysis/bugs.json

  # ========================================================================
  # PHASE 4: Performance Review
  # ========================================================================

  - id: performance_review
    description: "Check for performance issues"
    infer:
      prompt: |
        Performance review for {{inputs.language}} code.

        CONTEXT: {{inputs.context}}

        PERFORMANCE CHECKLIST:
        1. Unnecessary allocations
        2. N+1 query patterns
        3. Inefficient algorithms (O(n^2) when O(n) possible)
        4. Missing caching opportunities
        5. Blocking operations in async context
        6. Excessive cloning/copying

        Only flag issues that matter at scale or in hot paths.

    output:
      format: json
      schema:
        type: object
        required: [performance_issues]
        properties:
          performance_issues:
            type: array
            items:
              type: object
              required: [severity, location, issue, optimization]
              properties:
                severity:
                  type: string
                  enum: [High, Medium, Low]
                location:
                  type: string
                issue:
                  type: string
                impact:
                  type: string
                optimization:
                  type: string
          optimization_opportunities:
            type: array
            items:
              type: string
      max_retries: 2

    artifact:
      path: analysis/performance.json

  # ========================================================================
  # PHASE 5: Synthesis
  # ========================================================================

  - id: synthesis
    description: "Combine all reviews into final report"
    use:
      static: static_analysis
      security: security_review
      bugs: bug_review
      perf: performance_review
    infer:
      prompt: |
        Create a final code review report.

        STATIC ANALYSIS: {{use.static | to_yaml}}
        SECURITY REVIEW: {{use.security | to_yaml}}
        BUG REVIEW: {{use.bugs | to_yaml}}
        PERFORMANCE REVIEW: {{use.perf | to_yaml}}

        SYNTHESIS RULES:
        1. Prioritize by impact (Critical > High > Medium > Low)
        2. Group related issues
        3. Provide actionable recommendations
        4. Include positive observations

        Generate a Markdown report with:
        - Summary (issue counts by severity)
        - Critical Issues (fix immediately)
        - High Priority Issues
        - Medium Priority Issues
        - What's Done Well
        - Recommendations

    output:
      format: text

    artifact:
      path: final-report.md
      format: text

    flow: [static_analysis, security_review, bug_review, performance_review]
