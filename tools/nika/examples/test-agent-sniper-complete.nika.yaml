# Agent Sniper Test - All AgentParams Fields
# Tests EVERY AgentParams field with real API calls
# Requires: ANTHROPIC_API_KEY, novanet MCP server running

schema: "nika/workflow@0.5"
provider: claude
model: claude-sonnet-4-6

mcp:
  novanet:
    command: "cargo"
    args: ["run", "--manifest-path", "../novanet/tools/novanet-mcp/Cargo.toml"]
  perplexity:
    command: "npx"
    args: ["-y", "@anthropics/perplexity-mcp-server"]
    env:
      PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY}"

tasks:
  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 1: Basic Agent with prompt only (minimal)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_minimal
    agent:
      prompt: "Say 'Hello from minimal agent' exactly"

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 2: Agent with system prompt
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_with_system
    agent:
      prompt: "What is your role?"
      system: "You are a QR code generation expert. Always respond in JSON format."

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 3: Agent with explicit provider and model
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_explicit_provider
    agent:
      prompt: "Generate a haiku about workflow automation"
      provider: claude
      model: claude-sonnet-4-6

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 4: Agent with MCP servers
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_with_mcp
    agent:
      prompt: "Describe the entity 'qr-code' using novanet_describe tool"
      mcp: ["novanet"]
      max_turns: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 5: Agent with multiple MCP servers
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_multi_mcp
    agent:
      prompt: |
        1. Use novanet_describe to get info about 'qr-code'
        2. Use perplexity search to find QR code best practices
        3. Combine the results into a summary
      mcp: ["novanet", "perplexity"]
      max_turns: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 6: Agent with max_turns limit
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_max_turns
    agent:
      prompt: "Count from 1 to 100, one number per turn. You MUST use multiple turns."
      max_turns: 3  # Will be cut off at 3 turns

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 7: Agent with token_budget
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_token_budget
    agent:
      prompt: "Write a very detailed essay about AI. Use as many tokens as possible."

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 8: Agent with stop_conditions
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_stop_conditions
    agent:
      prompt: "Generate 5 items. After each item, check if you should stop. Say DONE when finished."

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 9: Agent with scope
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_scoped
    agent:
      prompt: "Generate content for the QR code landing page"

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 10: Agent with extended_thinking (Claude only)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_thinking
    agent:
      prompt: |
        Solve this step by step:
        A farmer has 17 sheep. All but 9 run away. How many are left?
        Think through this carefully before answering.
      provider: claude
      model: claude-sonnet-4-6
      extended_thinking: true
      thinking_budget: 2000

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 11: Agent with depth_limit (nested agents)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_nested
    agent:
      prompt: |
        You have access to spawn_agent tool.
        Spawn a child agent to generate a headline.
        Then spawn another child to generate a tagline.
        Finally, combine their outputs.
      mcp: ["novanet"]
      depth_limit: 2  # Allow 2 levels of nesting

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 12: Agent with ALL fields combined (maximum complexity)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_full_params
    agent:
      prompt: |
        You are conducting comprehensive research about QR codes.
        1. First, use novanet_describe to understand the entity
        2. Then search for current trends
        3. Finally, synthesize into a report
        Say RESEARCH_COMPLETE when done.
      system: |
        You are a senior AI research assistant.
        Always cite your sources.
        Output in structured JSON format.
      provider: claude
      model: claude-sonnet-4-6
      mcp: ["novanet", "perplexity"]
      max_turns: 10
      extended_thinking: true
      thinking_budget: 3000
      depth_limit: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 13: Agent using bindings (both syntaxes)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: setup_context
    exec: |
      echo '{"entity": "qr-code", "locale": "fr-FR", "formats": ["svg", "png"]}'
    output:
      format: json

  - id: agent_with_bindings
    use:
      ctx: setup_context
    agent:
      prompt: |
        Using this context: {{use.ctx}}
        Generate a landing page for the entity.
        The locale is {{use.ctx.locale}}.
      mcp: ["novanet"]
      max_turns: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 14: Chained agents with context passing
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_research
    agent:
      prompt: "Research QR code technology. Output a JSON summary."
      mcp: ["novanet"]
      max_turns: 3

  - id: agent_write
    use:
      research: agent_research
    agent:
      prompt: |
        Based on this research: {{use.research}}
        Write a blog post about QR codes.
      max_turns: 2

  - id: agent_review
    use:
      blog: agent_write
    agent:
      prompt: |
        Review this blog post: {{use.blog}}
        Provide feedback and suggestions.
      max_turns: 2

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 15: Agent with for_each parallelism
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_parallel
    for_each: ["fr-FR", "en-US", "de-DE"]
    as: locale
    concurrency: 3
    agent:
      prompt: "Generate a tagline for QR Code AI in locale {{use.locale}}"
      max_turns: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # FINAL: Aggregate all agent results
  # ═══════════════════════════════════════════════════════════════════════════

  - id: final_aggregation
    use:
      minimal: agent_minimal
      system: agent_with_system
      explicit: agent_explicit_provider
      mcp: agent_with_mcp
      multi_mcp: agent_multi_mcp
      max_turns: agent_max_turns
      budget: agent_token_budget
      stop: agent_stop_conditions
      scoped: agent_scoped
      thinking: agent_thinking
      nested: agent_nested
      full: agent_full_params
      bindings: agent_with_bindings
      review: agent_review
      parallel: agent_parallel
    infer: |
      Summarize the results of all agent tests:
      - Minimal: {{use.minimal}}
      - With system: {{use.system}}
      - Explicit provider: {{use.explicit}}
      - With MCP: {{use.mcp}}
      - Multi MCP: {{use.multi_mcp}}
      - Max turns: {{use.max_turns}}
      - Token budget: {{use.budget}}
      - Stop conditions: {{use.stop}}
      - Scoped: {{use.scoped}}
      - Thinking: {{use.thinking}}
      - Nested: {{use.nested}}
      - Full params: {{use.full}}
      - Bindings: {{use.bindings}}
      - Review chain: {{use.review}}
      - Parallel: {{use.parallel}}

flows:
  # Minimal tests (no dependencies)
  - source: agent_minimal
    target: final_aggregation
  - source: agent_with_system
    target: final_aggregation
  - source: agent_explicit_provider
    target: final_aggregation
  - source: agent_with_mcp
    target: final_aggregation
  - source: agent_multi_mcp
    target: final_aggregation
  - source: agent_max_turns
    target: final_aggregation
  - source: agent_token_budget
    target: final_aggregation
  - source: agent_stop_conditions
    target: final_aggregation
  - source: agent_scoped
    target: final_aggregation
  - source: agent_thinking
    target: final_aggregation
  - source: agent_nested
    target: final_aggregation
  - source: agent_full_params
    target: final_aggregation

  # Binding chain
  - source: setup_context
    target: agent_with_bindings
  - source: agent_with_bindings
    target: final_aggregation

  # Sequential agent chain
  - source: agent_research
    target: agent_write
  - source: agent_write
    target: agent_review
  - source: agent_review
    target: final_aggregation

  # Parallel agents
  - source: agent_parallel
    target: final_aggregation
