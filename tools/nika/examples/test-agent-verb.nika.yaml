# Test Workflow: agent: Verb Comprehensive Testing
# Tests multi-turn agentic loops with various configurations.
#
# Run with: OPENAI_API_KEY=sk-... nika examples/test-agent-verb.nika.yaml
# Or:       ANTHROPIC_API_KEY=sk-ant-... nika examples/test-agent-verb.nika.yaml

schema: "nika/workflow@0.9"
workflow: test-agent-verb
description: |
  Comprehensive test of the agent: verb with:
  - Basic agent loop
  - Stop conditions (keyword-based)
  - Max turns limiting
  - Context injection via bindings
  - Agent with MCP tools
  - Depth limit for nested agents
  - Multi-agent orchestration
  - Agent output aggregation

provider: openai
model: gpt-4o-mini

tasks:
  # ═══════════════════════════════════════════════════════════════════════════
  # Test 1: Basic Agent Loop
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_basic
    description: "Basic agent with simple prompt and stop condition"
    agent:
      prompt: |
        You are a helpful assistant. Answer this question:
        What are the three primary colors?

        List them numbered 1-3, then say "COLORS_LISTED" to complete.
      max_turns: 3

  - id: agent_minimal
    description: "Minimal agent with just prompt"
    agent:
      prompt: |
        Say exactly: "Agent working" then "DONE"
      max_turns: 2

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 2: Stop Conditions
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_multi_stop
    description: "Agent with multiple stop conditions"
    agent:
      prompt: |
        Choose one of these actions:
        - If the time is morning, say "GOOD_MORNING"
        - If the time is afternoon, say "GOOD_AFTERNOON"
        - If unsure, say "GREETING_SENT"

        Pick any one and say it.
      max_turns: 2

  - id: agent_max_turns_limit
    description: "Agent that should hit max_turns before stop condition"
    agent:
      prompt: |
        Count from 1 to 100, one number per response.
        Say "COUNTING_COMPLETE" when done.
      max_turns: 2

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 3: Context Injection via Bindings
  # ═══════════════════════════════════════════════════════════════════════════

  - id: setup_context
    description: "Setup context data for agent"
    exec: |
      echo '{"topic": "Rust programming", "focus": "memory safety", "audience": "beginners"}'
    output:
      format: json

  - id: agent_with_context
    description: "Agent using injected context from binding"
    use:
      ctx: setup_context
    agent:
      prompt: |
        You have this context:
        {{use.ctx}}

        Based on this context, write ONE sentence explaining the topic to the audience.
        End with "EXPLANATION_COMPLETE"
      max_turns: 2

  - id: chained_agent
    description: "Agent that builds on previous agent's output"
    use:
      prev_output: agent_with_context
    agent:
      prompt: |
        Previous explanation: {{use.prev_output}}

        Provide ONE follow-up question that a beginner might ask.
        End with "QUESTION_ASKED"
      max_turns: 2

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 4: Depth Limit for Nested Agents
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_with_depth_limit
    description: "Agent with depth_limit for spawn_agent control"
    agent:
      prompt: |
        You are a task decomposer. For the task "Plan a picnic":
        1. List 3 subtasks
        2. Say "DECOMPOSED" when done

        Note: You have depth_limit=1, meaning no nested agent spawning.
      max_turns: 3
      depth_limit: 1

  - id: agent_deeper_limit
    description: "Agent with higher depth limit"
    agent:
      prompt: |
        Task: Analyze a simple math problem.

        Problem: What is 2 + 2?

        Think step by step:
        1. Identify the operation
        2. Calculate
        3. Verify

        Say "CALCULATED" with the answer.
      max_turns: 2
      depth_limit: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 5: JSON Output from Agent
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_json_output
    description: "Agent that outputs structured JSON"
    agent:
      prompt: |
        Generate a JSON object with exactly this structure:
        {
          "status": "success",
          "items": ["item1", "item2"],
          "count": 2
        }

        Output ONLY the JSON, then say "JSON_GENERATED"
      max_turns: 2
    output:
      format: json

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 6: Agent with Model Override
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_model_override
    description: "Agent with explicit model specification"
    agent:
      prompt: |
        You are using a specific model. Confirm by saying:
        "Model active. CONFIRMED."
      model: gpt-4o-mini
      max_turns: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 7: Edge Cases
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent_single_turn
    description: "Agent with max_turns=1 (single shot)"
    agent:
      prompt: |
        In exactly one response, say "HELLO WORLD" and then "SINGLE_TURN_DONE"
      max_turns: 1

  - id: agent_long_prompt
    description: "Agent with multi-line complex prompt"
    agent:
      prompt: |
        You are an expert assistant with the following capabilities:

        CAPABILITIES:
        1. Text analysis
        2. Summarization
        3. Question answering

        TASK:
        Given the word "programming", provide:
        - A one-word synonym
        - Its part of speech

        FORMAT:
        Synonym: [word]
        Part of speech: [type]

        End with "ANALYSIS_DONE"
      max_turns: 2

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 8: Final Aggregation
  # ═══════════════════════════════════════════════════════════════════════════

  - id: aggregate_results
    description: "Aggregate all agent test results"
    use:
      basic: agent_basic
      minimal: agent_minimal
      with_context: agent_with_context
      chained: chained_agent
      json_output: agent_json_output
      single_turn: agent_single_turn
    exec: |
      echo "=== AGENT VERB TEST RESULTS ==="
      echo ""
      echo "Basic agent: $(echo '{{use.basic}}' | head -c 100)"
      echo ""
      echo "Minimal agent: {{use.minimal}}"
      echo ""
      echo "With context: $(echo '{{use.with_context}}' | head -c 150)"
      echo ""
      echo "Chained agent: $(echo '{{use.chained}}' | head -c 100)"
      echo ""
      echo "JSON output: {{use.json_output}}"
      echo ""
      echo "Single turn: {{use.single_turn}}"
      echo ""
      echo "=== TEST COMPLETE ==="

flows:
  # Context chain
  - source: setup_context
    target: agent_with_context
  - source: agent_with_context
    target: chained_agent

  # Final aggregation
  - source: agent_basic
    target: aggregate_results
  - source: agent_minimal
    target: aggregate_results
  - source: agent_with_context
    target: aggregate_results
  - source: chained_agent
    target: aggregate_results
  - source: agent_json_output
    target: aggregate_results
  - source: agent_single_turn
    target: aggregate_results
