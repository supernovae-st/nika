# Test workflow for ALL 8 NovaNet MCP tools
# Run: nika run examples/test-all-mcp-tools.nika.yaml
schema: nika/workflow@0.5
workflow: test-all-mcp-tools
description: "Comprehensive test of all 8 NovaNet MCP tools"

mcp:
  novanet:
    command: /Users/thibaut/supernovae-st/supernovae-agi/novanet/tools/novanet-mcp/target/release/novanet-mcp
    env:
      NOVANET_MCP_NEO4J_URI: bolt://localhost:7687
      NOVANET_MCP_NEO4J_USER: neo4j
      NOVANET_MCP_NEO4J_PASSWORD: novanetpassword

tasks:
  # 1. novanet_query - Run custom Cypher query
  - id: test_query
    invoke:
      mcp: novanet
      tool: novanet_query
      params:
        cypher: "MATCH (e:Entity) RETURN count(e) AS entity_count"

  # 2. novanet_describe - Get entity details
  - id: test_describe
    invoke:
      mcp: novanet
      tool: novanet_describe
      params:
        describe: entity
        entity_key: "qr-code"

  # 3. novanet_search - Full-text search
  - id: test_search
    invoke:
      mcp: novanet
      tool: novanet_search
      params:
        query: "qr code"
        limit: 5

  # 4. novanet_traverse - Graph traversal
  - id: test_traverse
    invoke:
      mcp: novanet
      tool: novanet_traverse
      params:
        start_key: "qr-code"
        max_depth: 1
        direction: outgoing

  # 5. novanet_assemble - Build context
  - id: test_assemble
    invoke:
      mcp: novanet
      tool: novanet_assemble
      params:
        focus_key: "qr-code"
        locale: "fr-FR"

  # 6. novanet_atoms - Knowledge atoms
  - id: test_atoms
    invoke:
      mcp: novanet
      tool: novanet_atoms
      params:
        locale: "fr-FR"
        atom_type: term

  # 7. novanet_generate - Content generation context
  - id: test_generate
    invoke:
      mcp: novanet
      tool: novanet_generate
      params:
        focus_key: "qr-code"
        locale: "fr-FR"
        mode: block

  # 8. novanet_introspect - Schema introspection
  - id: test_introspect
    invoke:
      mcp: novanet
      tool: novanet_introspect
      params:
        target: classes
        realm: org

  # Summary task - collect all results
  - id: summary
    use:
      query_result: test_query
      describe_result: test_describe
      search_result: test_search
      traverse_result: test_traverse
      assemble_result: test_assemble
      atoms_result: test_atoms
      generate_result: test_generate
      introspect_result: test_introspect
    exec: |
      echo "=== All 8 MCP Tools Test Results ==="
      echo ""
      echo "1. novanet_query: OK"
      echo "2. novanet_describe: OK"
      echo "3. novanet_search: OK"
      echo "4. novanet_traverse: OK"
      echo "5. novanet_assemble: OK"
      echo "6. novanet_atoms: OK"
      echo "7. novanet_generate: OK"
      echo "8. novanet_introspect: OK"
      echo ""
      echo "=== ALL 8 TOOLS PASSED ==="

flows:
  - source: [test_query, test_describe, test_search, test_traverse, test_assemble, test_atoms, test_generate, test_introspect]
    target: summary
