# Test: Artifact system with binding integration
# Purpose: Verify artifact persistence works with binding references
# Features tested: artifacts, io::atomic, io::template, binding chains, output policy
schema: "nika/workflow@0.10"

provider: mock

# Artifact configuration - test template variables
artifacts:
  dir: ./output/{{date}}/{{workflow_name}}
  format: json
  manifest: true

tasks:
  # Step 1: Generate structured data
  - id: generate_data
    infer: "Generate a JSON object: {title: 'Test Report', items: ['a', 'b', 'c'], count: 3}"
    output:
      format: json

  # Step 2: Process and write artifact with binding
  - id: process_and_save
    use:
      data: $generate_data  # Implicit output reference
    artifact:
      - path: data/{{task_id}}.json
        mode: overwrite
    infer: "Transform the input data: {{use.data}} into a processed format"

  # Step 3: Multiple artifacts from single task
  - id: multi_artifact_task
    use:
      processed: $process_and_save
    artifact:
      - path: reports/main.json
        mode: overwrite
      - path: logs/audit.log
        mode: append
    infer: |
      Create two outputs from: {{use.processed}}
      1. A main report (JSON)
      2. An audit log entry (text)

  # Step 4: Artifact with template variables
  - id: templated_artifact
    use:
      source: $generate_data
      report: $multi_artifact_task
    artifact:
      - path: "{{task_id}}/{{date}}/output.json"
        mode: overwrite
    infer: |
      Combine source: {{use.source}}
      With report: {{use.report}}
      Generate final templated output.

  # Step 5: Test artifact with default values
  - id: artifact_with_defaults
    use:
      existing: $templated_artifact
      optional: $templated_artifact
    artifact:
      - path: final/complete.json
        mode: overwrite
    infer: |
      Using existing: {{use.existing}}
      With optional: {{use.optional}}
      Create final artifact.

  # Step 6: Verify artifact chain integrity
  - id: verify_chain
    use:
      step1: $generate_data
      step2: $process_and_save
      step3: $multi_artifact_task
      step4: $templated_artifact
      step5: $artifact_with_defaults
    infer: |
      Verify artifact chain integrity:
      - Step 1 (generate_data): {{use.step1}}
      - Step 2 (process_and_save): {{use.step2}}
      - Step 3 (multi_artifact_task): {{use.step3}}
      - Step 4 (templated_artifact): {{use.step4}}
      - Step 5 (artifact_with_defaults): {{use.step5}}

      All artifacts should be written and accessible.

flows:
  - source: generate_data
    target: process_and_save
  - source: process_and_save
    target: multi_artifact_task
  - source: generate_data
    target: templated_artifact
  - source: multi_artifact_task
    target: templated_artifact
  - source: templated_artifact
    target: artifact_with_defaults
  - source: generate_data
    target: verify_chain
  - source: process_and_save
    target: verify_chain
  - source: multi_artifact_task
    target: verify_chain
  - source: templated_artifact
    target: verify_chain
  - source: artifact_with_defaults
    target: verify_chain
