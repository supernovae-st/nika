# Test: Binding chain with implicit output syntax ($task)
# Purpose: Verify $step1 → step2 → $step2.result chains work correctly
# Features tested: implicit output ($task), nested field access ($task.field), default values (??)
schema: "nika/workflow@0.12"

provider: mock

tasks:
  # Step 1: Generate base data
  - id: generate_data
    infer: "Generate a JSON object with 'title' and 'count' fields"

  # Step 2: Use implicit output from step 1
  - id: process_data
    with:
      input: $generate_data  # Implicit output - normalizes to "generate_data"
    infer: "Process this data: {{with.input}}"

  # Step 3: Chain with explicit syntax for comparison
  - id: validate_data
    with:
      processed: $process_data  # Explicit syntax (now requires $)
    infer: "Validate: {{with.processed}}"

  # Step 4: Use implicit syntax with nested field access
  - id: extract_fields
    with:
      # Both syntaxes should produce equivalent results
      implicit_ref: $validate_data
      explicit_ref: $validate_data
    infer: |
      Compare references:
      Implicit: {{with.implicit_ref}}
      Explicit: {{with.explicit_ref}}

  # Step 5: Test values with binding
  - id: with_defaults
    with:
      data: $extract_fields
      optional: $validate_data
    infer: |
      Data: {{with.data}}
      Optional: {{with.optional}}

  # Step 6: Final aggregation
  - id: final_summary
    with:
      step1: $generate_data
      step2: $process_data
      step3: $validate_data
      step4: $extract_fields
      step5: $with_defaults
    infer: |
      Full chain summary:
      - Step 1: {{with.step1}}
      - Step 2: {{with.step2}}
      - Step 3: {{with.step3}}
      - Step 4: {{with.step4}}
      - Step 5: {{with.step5}}
