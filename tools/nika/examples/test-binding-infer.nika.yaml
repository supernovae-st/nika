# Test binding syntaxes in infer: specifically
# Tests {{use.alias}} mustache syntax in LLM prompts

schema: "nika/workflow@0.5"
provider: openai
model: gpt-4o-mini
workflow: test-binding-infer

tasks:
  - id: produce_data
    exec: |
      echo '{"app": "Nika", "version": "0.7.2"}'
    output:
      format: json

  # Test {{use.alias}} in infer
  - id: test_mustache_infer
    use:
      info: produce_data
    infer: |
      Data with mustache syntax: {{use.info}}
      Reply with just: MUSTACHE_OK

  # Test nested binding access in infer
  - id: test_nested_infer
    use:
      data: produce_data
    infer: |
      Process this app info: {{use.data}}
      Extract and output only the version number.

  # Aggregate
  - id: verify
    use:
      m: test_mustache_infer
      n: test_nested_infer
    exec: |
      echo "=== INFER BINDING RESULTS ==="
      echo "Mustache in infer: {{use.m}}"
      echo "Nested in infer: {{use.n}}"
      echo "=== DONE ==="

flows:
  - source: produce_data
    target: [test_mustache_infer, test_nested_infer]
  - source: [test_mustache_infer, test_nested_infer]
    target: verify
