# Quick binding syntax test
# Tests: {{use.alias}}, $alias, lazy bindings, defaults

schema: "nika/workflow@0.5"
workflow: test-binding-quick
description: Quick test of all binding syntaxes

tasks:
  # Producer tasks
  - id: produce_json
    exec: |
      echo '{"product": "QR Code AI", "version": "2.0"}'
    output:
      format: json

  - id: produce_text
    exec: |
      echo "Hello World from Nika"

  # Test 1: Mustache syntax {{use.alias}}
  - id: test_mustache
    use:
      data: produce_json
    exec: |
      echo "MUSTACHE: {{use.data}}"

  # Test 2: Dollar syntax $alias
  - id: test_dollar
    use:
      data: produce_json
    exec: |
      echo "DOLLAR: $data"

  # Test 3: Mixed in same task
  - id: test_mixed
    use:
      json_data: produce_json
      text_data: produce_text
    exec: |
      echo "MIXED - Mustache: {{use.json_data}} | Dollar: $text_data"

  # Test 4: Lazy binding with default
  - id: test_lazy
    use:
      existing: produce_json
      lazy_data:
        path: produce_text
        lazy: true
        default: "fallback value"
    exec: |
      echo "LAZY - Existing: {{use.existing}} | Lazy: {{use.lazy_data}}"

  # Test 5: Aggregate all results
  - id: aggregate
    use:
      r1: test_mustache
      r2: test_dollar
      r3: test_mixed
      r4: test_lazy
    exec: |
      echo "=== BINDING TEST RESULTS ==="
      echo "Test 1 (mustache): $r1"
      echo "Test 2 (dollar): {{use.r2}}"
      echo "Test 3 (mixed): $r3"
      echo "Test 4 (lazy): {{use.r4}}"
      echo "=== ALL TESTS COMPLETE ==="

flows:
  - source: produce_json
    target: [test_mustache, test_dollar, test_mixed, test_lazy]
  - source: produce_text
    target: [test_mixed, test_lazy]
  - source: [test_mustache, test_dollar, test_mixed, test_lazy]
    target: aggregate
