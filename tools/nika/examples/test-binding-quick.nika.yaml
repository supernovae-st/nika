# Quick binding syntax test
# Tests: {{use.alias}} mustache syntax and lazy bindings with defaults

schema: "nika/workflow@0.5"
workflow: test-binding-quick
description: Quick test of all binding syntaxes

tasks:
  # Producer tasks
  - id: produce_json
    exec: |
      echo '{"product": "QR Code AI", "version": "2.0"}'
    output:
      format: json

  - id: produce_text
    exec: |
      echo "Hello World from Nika"

  # Test 1: Mustache syntax {{use.alias}}
  - id: test_mustache
    use:
      data: produce_json
    exec: |
      echo "MUSTACHE: {{use.data}}"

  # Test 2: Multiple bindings in same task
  - id: test_multi
    use:
      json_data: produce_json
      text_data: produce_text
    exec: |
      echo "MULTI - JSON: {{use.json_data}} | Text: {{use.text_data}}"

  # Test 4: Lazy binding with default
  - id: test_lazy
    use:
      existing: produce_json
      lazy_data:
        path: produce_text
        lazy: true
        default: "fallback value"
    exec: |
      echo "LAZY - Existing: {{use.existing}} | Lazy: {{use.lazy_data}}"

  # Test 4: Aggregate all results
  - id: aggregate
    use:
      r1: test_mustache
      r2: test_multi
      r3: test_lazy
    exec: |
      echo "=== BINDING TEST RESULTS ==="
      echo "Test 1 (mustache): {{use.r1}}"
      echo "Test 2 (multi): {{use.r2}}"
      echo "Test 3 (lazy): {{use.r3}}"
      echo "=== ALL TESTS COMPLETE ==="

flows:
  - source: produce_json
    target: [test_mustache, test_multi, test_lazy]
  - source: produce_text
    target: [test_multi, test_lazy]
  - source: [test_mustache, test_multi, test_lazy]
    target: aggregate
