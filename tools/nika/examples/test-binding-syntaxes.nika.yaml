# Binding Syntax Comprehensive Test
# Tests the VALID binding syntax: {{use.alias}}
# Also tests lazy bindings with defaults

schema: "nika/workflow@0.5"
provider: claude
model: claude-sonnet-4-6

tasks:
  # ═══════════════════════════════════════════════════════════════════════════
  # SETUP: Create various data types
  # ═══════════════════════════════════════════════════════════════════════════

  - id: json_producer
    exec: |
      echo '{"name": "QR Code AI", "version": "1.0", "features": ["generate", "customize", "track"]}'
    output:
      format: json

  - id: text_producer
    exec: |
      echo "Hello from text producer"

  - id: array_producer
    exec: |
      echo '["fr-FR", "en-US", "de-DE", "ja-JP"]'
    output:
      format: json

  - id: nested_json_producer
    exec: |
      echo '{"level1": {"level2": {"level3": {"deep_value": 42}}}}'
    output:
      format: json

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 1: Mustache syntax {{use.alias}} in infer
  # ═══════════════════════════════════════════════════════════════════════════

  - id: mustache_in_infer
    use:
      data: json_producer
      text: text_producer
    infer: |
      Process this JSON data: {{use.data}}
      And this text: {{use.text}}
      Output a summary.

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 2: Multiple bindings in same prompt
  # ═══════════════════════════════════════════════════════════════════════════

  - id: multi_binding_infer
    use:
      data: json_producer
      text: text_producer
      arr: array_producer
    infer: |
      Processing multiple bindings:
      JSON data: {{use.data}}
      Text data: {{use.text}}
      Array data: {{use.arr}}

      Please summarize all inputs.

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 3: Bindings in exec commands
  # ═══════════════════════════════════════════════════════════════════════════

  - id: binding_in_exec
    use:
      name: text_producer
    exec: |
      echo "Received binding: {{use.name}}"

  - id: binding_in_exec_json
    use:
      data: json_producer
    exec: |
      echo "Received JSON binding: {{use.data}}"

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 4: Bindings in agent prompts
  # ═══════════════════════════════════════════════════════════════════════════

  - id: binding_in_agent
    use:
      context: json_producer
    agent:
      prompt: |
        You have this context: {{use.context}}
        Process it and respond with a brief summary.
      max_turns: 1

  - id: binding_in_agent_multi
    use:
      ctx1: json_producer
      ctx2: text_producer
    agent:
      prompt: |
        Context 1: {{use.ctx1}}
        Context 2: {{use.ctx2}}
        Compare and summarize both contexts.
      max_turns: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 5: Lazy bindings with defaults
  # ═══════════════════════════════════════════════════════════════════════════

  - id: lazy_binding_with_default
    use:
      maybe_data:
        path: json_producer
        lazy: true
        default: '{"fallback": true}'
    infer: |
      Using lazy binding with default: {{use.maybe_data}}
      Confirm you received the data.

  - id: lazy_binding_text
    use:
      lazy_val:
        path: text_producer
        lazy: true
        default: "default text value"
    infer: |
      Using lazy text binding: {{use.lazy_val}}
      Echo back what you received.

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 6: Multiple bindings from same source
  # ═══════════════════════════════════════════════════════════════════════════

  - id: multiple_same_source
    use:
      a: json_producer
      b: json_producer
      c: json_producer
    infer: |
      Same source, different aliases:
      A: {{use.a}}
      B: {{use.b}}
      C: {{use.c}}

      Confirm all three are identical.

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 7: Bindings in for_each context
  # ═══════════════════════════════════════════════════════════════════════════

  - id: for_each_with_bindings
    use:
      locales: array_producer
      meta: json_producer
    for_each: "{{use.locales}}"
    as: locale
    concurrency: 4
    infer: |
      Processing locale: {{use.locale}}
      With metadata: {{use.meta}}
      Generate a greeting for this locale.

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 8: Chain of bindings
  # ═══════════════════════════════════════════════════════════════════════════

  - id: chain_step_1
    use:
      source: json_producer
    exec: |
      echo "Step 1 processed: {{use.source}}"

  - id: chain_step_2
    use:
      prev: chain_step_1
    exec: |
      echo "Step 2 received: {{use.prev}}"

  - id: chain_step_3
    use:
      prev: chain_step_2
    exec: |
      echo "Step 3 received: {{use.prev}}"

  - id: chain_step_4
    use:
      prev: chain_step_3
    infer: |
      Final step in chain. Previous output: {{use.prev}}
      Summarize the chain progression.

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 9: Wide fan-in with bindings
  # ═══════════════════════════════════════════════════════════════════════════

  - id: wide_aggregation
    use:
      mustache_infer: mustache_in_infer
      multi_binding: multi_binding_infer
      exec_result: binding_in_exec
      exec_json: binding_in_exec_json
      agent_result: binding_in_agent
      agent_multi: binding_in_agent_multi
      lazy_default: lazy_binding_with_default
      lazy_text: lazy_binding_text
      multi_source: multiple_same_source
      foreach_result: for_each_with_bindings
      chain_result: chain_step_4
    infer: |
      Aggregating all binding test results:

      Mustache infer: {{use.mustache_infer}}
      Multi binding: {{use.multi_binding}}
      Exec result: {{use.exec_result}}
      Exec JSON: {{use.exec_json}}
      Agent result: {{use.agent_result}}
      Agent multi: {{use.agent_multi}}
      Lazy default: {{use.lazy_default}}
      Lazy text: {{use.lazy_text}}
      Multiple source: {{use.multi_source}}
      For-each: {{use.foreach_result}}
      Chain: {{use.chain_result}}

      Confirm all bindings resolved correctly.

flows:
  # Setup dependencies
  - source: json_producer
    target: [mustache_in_infer, multi_binding_infer, binding_in_exec_json, binding_in_agent, binding_in_agent_multi, lazy_binding_with_default, multiple_same_source, for_each_with_bindings, chain_step_1]
  - source: text_producer
    target: [mustache_in_infer, multi_binding_infer, binding_in_exec, binding_in_agent_multi, lazy_binding_text]
  - source: array_producer
    target: [multi_binding_infer, for_each_with_bindings]

  # Chain dependencies
  - source: chain_step_1
    target: chain_step_2
  - source: chain_step_2
    target: chain_step_3
  - source: chain_step_3
    target: chain_step_4

  # Final aggregation
  - source: [mustache_in_infer, multi_binding_infer, binding_in_exec, binding_in_exec_json, binding_in_agent, binding_in_agent_multi, lazy_binding_with_default, lazy_binding_text, multiple_same_source, for_each_with_bindings, chain_step_4]
    target: wide_aggregation
