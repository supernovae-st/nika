# Test: Complex DAG with diamond dependencies
# Run with: nika examples/test-dag-complex.nika.yaml
#
#      a
#     / \
#    b   c
#     \ /
#      d
#     / \
#    e   f
#     \ /
#      g

schema: "nika/workflow@0.5"

tasks:
  - id: task_a
    exec: "echo 'A: Root task'"
    output:
      format: text

  - id: task_b
    use:
      a: task_a
    exec: "echo 'B: Left branch from A={{use.a}}'"
    output:
      format: text

  - id: task_c
    use:
      a: task_a
    exec: "echo 'C: Right branch from A={{use.a}}'"
    output:
      format: text

  - id: task_d
    use:
      b: task_b
      c: task_c
    exec: "echo 'D: Diamond merge B={{use.b}}, C={{use.c}}'"
    output:
      format: text

  - id: task_e
    use:
      d: task_d
    exec: "echo 'E: Left from D={{use.d}}'"
    output:
      format: text

  - id: task_f
    use:
      d: task_d
    exec: "echo 'F: Right from D={{use.d}}'"
    output:
      format: text

  - id: task_g
    use:
      e: task_e
      f: task_f
    exec: "echo 'G: Final merge E={{use.e}}, F={{use.f}}'"
    output:
      format: text

flows:
  - source: task_a
    target: task_b
  - source: task_a
    target: task_c
  - source: task_b
    target: task_d
  - source: task_c
    target: task_d
  - source: task_d
    target: task_e
  - source: task_d
    target: task_f
  - source: task_e
    target: task_g
  - source: task_f
    target: task_g
