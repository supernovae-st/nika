# Edge Case Testing Workflow
# Tests tricky scenarios that often break:
# - Very deep dependency chains (10+ levels)
# - Lazy bindings with defaults
# - Large for_each iterations
# - Mixed shorthand and full syntax
# - Complex binding expressions
# - Multiple output formats

schema: "nika/workflow@0.5"
provider: claude

tasks:
  # ═══════════════════════════════════════════════════════════════════════════
  # EDGE CASE 1: Very Deep Dependency Chain (10 levels)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: chain_1
    exec: "echo 'level_1'"

  - id: chain_2
    use:
      prev: chain_1
    exec: "echo 'level_2 (prev: {{use.prev}})'"

  - id: chain_3
    use:
      prev: chain_2
    exec: "echo 'level_3 (prev: {{use.prev}})'"

  - id: chain_4
    use:
      prev: chain_3
    exec: "echo 'level_4 (prev: {{use.prev}})'"

  - id: chain_5
    use:
      prev: chain_4
    exec: "echo 'level_5 (prev: {{use.prev}})'"

  - id: chain_6
    use:
      prev: chain_5
    exec: "echo 'level_6 (prev: {{use.prev}})'"

  - id: chain_7
    use:
      prev: chain_6
    exec: "echo 'level_7 (prev: {{use.prev}})'"

  - id: chain_8
    use:
      prev: chain_7
    exec: "echo 'level_8 (prev: {{use.prev}})'"

  - id: chain_9
    use:
      prev: chain_8
    exec: "echo 'level_9 (prev: {{use.prev}})'"

  - id: chain_10
    use:
      prev: chain_9
    exec: "echo 'level_10 - FINAL (prev: {{use.prev}})'"

  # ═══════════════════════════════════════════════════════════════════════════
  # EDGE CASE 2: Lazy Bindings with Fallback Values
  # ═══════════════════════════════════════════════════════════════════════════

  - id: maybe_succeeds
    exec: |
      if [ $((RANDOM % 2)) -eq 0 ]; then
        echo '{"status": "success", "value": 42}'
      else
        echo '{"status": "success", "value": 42}'
      fi
    output:
      format: json

  - id: use_with_lazy
    use:
      data:
        path: maybe_succeeds
        lazy: true
        default: '{"status": "fallback", "value": 0}'
    exec: |
      echo "Received data: {{use.data}}"

  # ═══════════════════════════════════════════════════════════════════════════
  # EDGE CASE 3: Large for_each (20 items)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: large_parallel
    for_each: ["i01", "i02", "i03", "i04", "i05", "i06", "i07", "i08", "i09", "i10",
               "i11", "i12", "i13", "i14", "i15", "i16", "i17", "i18", "i19", "i20"]
    as: item
    concurrency: 10
    fail_fast: false
    exec: |
      sleep 0.1
      echo '{"item": "{{use.item}}", "timestamp": "'$(date +%s.%N)'"}'
    output:
      format: json

  # ═══════════════════════════════════════════════════════════════════════════
  # EDGE CASE 4: Mixed Shorthand and Full Syntax
  # ═══════════════════════════════════════════════════════════════════════════

  - id: shorthand_infer
    infer: "Say hello in exactly 3 words"

  - id: full_infer
    infer:
      prompt: "Say goodbye in exactly 3 words"
      model: claude-sonnet-4-6

  - id: shorthand_exec
    exec: "echo 'shorthand works'"

  - id: full_exec
    exec:
      command: "echo 'full syntax works'"

  # ═══════════════════════════════════════════════════════════════════════════
  # EDGE CASE 5: Complex Nested JSON in Bindings
  # ═══════════════════════════════════════════════════════════════════════════

  - id: nested_json_producer
    exec: |
      echo '{"level1": {"level2": {"level3": {"value": "deeply_nested"}}}}'
    output:
      format: json

  - id: nested_json_consumer
    use:
      nested: nested_json_producer
    exec: |
      echo "Consumed: {{use.nested}}"

  # ═══════════════════════════════════════════════════════════════════════════
  # EDGE CASE 6: Unicode and Special Characters
  # ═══════════════════════════════════════════════════════════════════════════

  - id: unicode_test
    exec: |
      echo '{"emoji": "🚀🔥✨", "japanese": "日本語テスト", "french": "café résumé", "special": "a<b>c&d\"e"}'
    output:
      format: json

  - id: unicode_infer
    use:
      unicode_data: unicode_test
    infer: |
      Process this unicode data: {{use.unicode_data}}
      Repeat back the emoji and Japanese text exactly.

  # ═══════════════════════════════════════════════════════════════════════════
  # EDGE CASE 7: Empty and Null Handling
  # ═══════════════════════════════════════════════════════════════════════════

  - id: empty_string_exec
    exec: "echo ''"

  - id: null_json
    exec: 'echo "null"'
    output:
      format: json

  - id: empty_array
    exec: 'echo "[]"'
    output:
      format: json

  - id: empty_object
    exec: 'echo "{}"'
    output:
      format: json

  # ═══════════════════════════════════════════════════════════════════════════
  # EDGE CASE 8: Concurrent Dependencies (Wide Fan-In)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: wide_fanin
    use:
      chain: chain_10
      lazy_data: use_with_lazy
      parallel: large_parallel
      shorthand: shorthand_infer
      full: full_infer
      unicode: unicode_test
      empty_str: empty_string_exec
      null_val: null_json
      empty_arr: empty_array
      empty_obj: empty_object
    exec: |
      echo "Wide fan-in aggregated 10 dependencies successfully"
      echo "Chain result: {{use.chain}}"

flows:
  # Deep chain
  - source: chain_1
    target: chain_2
  - source: chain_2
    target: chain_3
  - source: chain_3
    target: chain_4
  - source: chain_4
    target: chain_5
  - source: chain_5
    target: chain_6
  - source: chain_6
    target: chain_7
  - source: chain_7
    target: chain_8
  - source: chain_8
    target: chain_9
  - source: chain_9
    target: chain_10

  # Lazy binding
  - source: maybe_succeeds
    target: use_with_lazy

  # Nested JSON
  - source: nested_json_producer
    target: nested_json_consumer

  # Unicode
  - source: unicode_test
    target: unicode_infer

  # Wide fan-in
  - source: [chain_10, use_with_lazy, large_parallel, shorthand_infer, full_infer, unicode_test, empty_string_exec, null_json, empty_array, empty_object]
    target: wide_fanin
