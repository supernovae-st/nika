# Test Workflow: exec: Verb Comprehensive Testing
# Tests command execution with various shell patterns and bindings.
#
# Run with: nika examples/test-exec-verb.nika.yaml
# No API keys required - pure shell execution.

schema: "nika/workflow@0.9"
workflow: test-exec-verb
description: |
  Comprehensive test of the exec: verb with:
  - Shorthand syntax (string form)
  - Full form with command field
  - Multi-line shell scripts
  - JSON output parsing
  - Environment variables
  - Binding interpolation
  - Exit code handling
  - Piped commands

tasks:
  # ═══════════════════════════════════════════════════════════════════════════
  # Test 1: Shorthand Syntax (v0.5.1+)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: shorthand_basic
    description: "Basic shorthand exec: with simple command"
    exec: "echo 'Hello from shorthand exec'"

  - id: shorthand_with_args
    description: "Shorthand with command arguments"
    exec: "date '+%Y-%m-%d %H:%M:%S'"

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 2: Full Form Syntax
  # ═══════════════════════════════════════════════════════════════════════════

  - id: fullform_basic
    description: "Full form with explicit command field"
    exec:
      command: "echo 'Hello from full form exec'"

  - id: fullform_multiline
    description: "Full form with multi-line script"
    exec:
      command: |
        echo "Step 1: Starting"
        sleep 0.1
        echo "Step 2: Processing"
        sleep 0.1
        echo "Step 3: Complete"

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 3: JSON Output
  # ═══════════════════════════════════════════════════════════════════════════

  - id: json_output_simple
    description: "Generate JSON output for downstream parsing"
    exec: 'echo ''{"status": "ok", "value": 42, "message": "test"}'''
    output:
      format: json

  - id: json_output_complex
    description: "Generate complex JSON with shell variables"
    exec: |
      cat << EOF
      {
        "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
        "hostname": "$(hostname)",
        "user": "$(whoami)",
        "shell": "$SHELL",
        "pwd": "$(pwd)"
      }
      EOF
    output:
      format: json

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 4: Binding Interpolation
  # ═══════════════════════════════════════════════════════════════════════════

  - id: setup_value
    description: "Setup task providing value for binding"
    exec: "echo 'BINDING_VALUE_123'"

  - id: exec_with_binding
    description: "Exec using binding from previous task"
    use:
      value: setup_value
    exec: "echo 'Received binding: {{use.value}}'"

  - id: chained_exec
    description: "Chain of exec tasks with binding propagation"
    use:
      prev: exec_with_binding
    exec: |
      echo "Previous output was: {{use.prev}}"
      echo "Adding suffix: PROCESSED"

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 5: Piped Commands
  # ═══════════════════════════════════════════════════════════════════════════

  - id: pipe_basic
    description: "Basic pipe between commands"
    exec: "echo 'apple banana cherry' | tr ' ' '\n' | sort"

  - id: pipe_with_grep
    description: "Pipe with grep filter"
    exec: "echo -e 'line1\ntest_line\nline3\nanother_test' | grep test"

  - id: pipe_with_count
    description: "Pipe to count lines"
    exec: "echo -e 'a\nb\nc\nd\ne' | wc -l | tr -d ' '"

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 6: Edge Cases
  # ═══════════════════════════════════════════════════════════════════════════

  - id: special_chars
    description: "Handle special characters in output"
    exec: |
      echo 'Special: "quotes" and '\''apostrophes'\'' and dollar_sign and `backticks`'

  - id: empty_output
    description: "Command with no output (just exit 0)"
    exec: "true"

  - id: whitespace_handling
    description: "Preserve whitespace in output"
    exec: "echo '  leading and trailing spaces  '"

  - id: exit_code_success
    description: "Verify successful exit code"
    exec: "exit 0"

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 7: For Each Parallelism
  # ═══════════════════════════════════════════════════════════════════════════

  - id: parallel_exec
    description: "Parallel execution with for_each"
    for_each: ["alpha", "beta", "gamma"]
    as: item
    concurrency: 3
    exec: "echo 'Processing: {{use.item}}'"

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 8: Final Aggregation
  # ═══════════════════════════════════════════════════════════════════════════

  - id: aggregate_results
    description: "Aggregate all exec results"
    use:
      shorthand: shorthand_basic
      json: json_output_simple
      chained: chained_exec
      piped: pipe_basic
      parallel: parallel_exec
    exec: |
      echo "=== EXEC VERB TEST RESULTS ==="
      echo ""
      echo "Shorthand: {{use.shorthand}}"
      echo ""
      echo "JSON output: {{use.json}}"
      echo ""
      echo "Chained: {{use.chained}}"
      echo ""
      echo "Piped: {{use.piped}}"
      echo ""
      echo "Parallel results: {{use.parallel}}"
      echo ""
      echo "=== TEST COMPLETE ==="

flows:
  # Binding chain
  - source: setup_value
    target: exec_with_binding
  - source: exec_with_binding
    target: chained_exec

  # Final aggregation
  - source: shorthand_basic
    target: aggregate_results
  - source: json_output_simple
    target: aggregate_results
  - source: chained_exec
    target: aggregate_results
  - source: pipe_basic
    target: aggregate_results
  - source: parallel_exec
    target: aggregate_results
