# Test Workflow: fetch: Verb Comprehensive Testing
# Tests HTTP requests with various methods, headers, and response handling.
#
# Run with: nika examples/test-fetch-verb.nika.yaml
# No API keys required - uses httpbin.org for testing.

schema: "nika/workflow@0.9"
workflow: test-fetch-verb
description: |
  Comprehensive test of the fetch: verb with:
  - GET requests (basic and with params)
  - POST requests with body
  - Various HTTP methods
  - JSON response parsing
  - Header handling
  - Status code verification
  - Binding interpolation

tasks:
  # ═══════════════════════════════════════════════════════════════════════════
  # Test 1: Basic GET Requests
  # ═══════════════════════════════════════════════════════════════════════════

  - id: get_simple
    description: "Simple GET request returning JSON"
    fetch:
      url: "https://httpbin.org/get"
      method: GET
    output:
      format: json

  - id: get_with_params
    description: "GET request with query parameters"
    fetch:
      url: "https://httpbin.org/get?foo=bar&count=42"
      method: GET
    output:
      format: json

  - id: get_json_endpoint
    description: "GET request to JSON data endpoint"
    fetch:
      url: "https://httpbin.org/json"
      method: GET
    output:
      format: json

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 2: Various HTTP Methods
  # ═══════════════════════════════════════════════════════════════════════════

  - id: post_basic
    description: "POST request with JSON body"
    fetch:
      url: "https://httpbin.org/post"
      method: POST
      headers:
        Content-Type: "application/json"
      body: '{"key": "value", "number": 123}'
    output:
      format: json

  - id: put_request
    description: "PUT request to update endpoint"
    fetch:
      url: "https://httpbin.org/put"
      method: PUT
      headers:
        Content-Type: "application/json"
      body: '{"action": "update", "id": 1}'
    output:
      format: json

  - id: delete_request
    description: "DELETE request"
    fetch:
      url: "https://httpbin.org/delete"
      method: DELETE
    output:
      format: json

  - id: patch_request
    description: "PATCH request for partial update"
    fetch:
      url: "https://httpbin.org/patch"
      method: PATCH
      headers:
        Content-Type: "application/json"
      body: '{"field": "patched_value"}'
    output:
      format: json

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 3: Headers and Authentication
  # ═══════════════════════════════════════════════════════════════════════════

  - id: custom_headers
    description: "Request with custom headers"
    fetch:
      url: "https://httpbin.org/headers"
      method: GET
      headers:
        X-Custom-Header: "CustomValue"
        X-Request-ID: "test-12345"
        User-Agent: "Nika-Test/0.9"
    output:
      format: json

  - id: bearer_auth
    description: "Request with Bearer authentication"
    fetch:
      url: "https://httpbin.org/bearer"
      method: GET
      headers:
        Authorization: "Bearer test-token-12345"
    output:
      format: json

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 4: Response Types
  # ═══════════════════════════════════════════════════════════════════════════

  - id: response_html
    description: "Request returning HTML (as text)"
    fetch:
      url: "https://httpbin.org/html"
      method: GET
    output:
      format: text

  - id: response_uuid
    description: "Get UUID response"
    fetch:
      url: "https://httpbin.org/uuid"
      method: GET
    output:
      format: json

  - id: response_ip
    description: "Get origin IP response"
    fetch:
      url: "https://httpbin.org/ip"
      method: GET
    output:
      format: json

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 5: Status Codes
  # ═══════════════════════════════════════════════════════════════════════════

  - id: status_200
    description: "Request returning 200 OK"
    fetch:
      url: "https://httpbin.org/status/200"
      method: GET

  - id: status_201
    description: "Request returning 201 Created"
    fetch:
      url: "https://httpbin.org/status/201"
      method: GET

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 6: Binding Interpolation
  # ═══════════════════════════════════════════════════════════════════════════

  - id: setup_dynamic_path
    description: "Setup task to provide dynamic URL component"
    exec: "echo 'test-workflow-data'"

  - id: fetch_with_binding
    description: "Fetch using dynamic value in URL"
    use:
      path_segment: setup_dynamic_path
    fetch:
      url: "https://httpbin.org/anything/{{use.path_segment}}"
      method: GET
    output:
      format: json

  - id: post_with_binding
    description: "POST with binding in body"
    use:
      uuid_data: response_uuid
    fetch:
      url: "https://httpbin.org/post"
      method: POST
      headers:
        Content-Type: "application/json"
      body: '{"received_uuid": "{{use.uuid_data}}"}'
    output:
      format: json

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 7: Delayed Response (Timeout Testing)
  # ═══════════════════════════════════════════════════════════════════════════

  - id: delayed_response
    description: "Request with 1 second delay (tests timeout handling)"
    fetch:
      url: "https://httpbin.org/delay/1"
      method: GET
    output:
      format: json

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 8: Final Aggregation
  # ═══════════════════════════════════════════════════════════════════════════

  - id: aggregate_results
    description: "Aggregate fetch results"
    use:
      get_result: get_simple
      post_result: post_basic
      uuid: response_uuid
      ip: response_ip
      dynamic: fetch_with_binding
    exec: |
      echo "=== FETCH VERB TEST RESULTS ==="
      echo ""
      echo "GET result origin: $(echo '{{use.get_result}}' | head -c 200)"
      echo ""
      echo "POST echoed data: $(echo '{{use.post_result}}' | head -c 200)"
      echo ""
      echo "UUID: {{use.uuid}}"
      echo ""
      echo "Origin IP: {{use.ip}}"
      echo ""
      echo "Dynamic fetch: $(echo '{{use.dynamic}}' | head -c 200)"
      echo ""
      echo "=== TEST COMPLETE ==="

flows:
  # UUID -> POST with binding
  - source: response_uuid
    target: post_with_binding

  # Setup -> dynamic fetch
  - source: setup_dynamic_path
    target: fetch_with_binding

  # Final aggregation
  - source: get_simple
    target: aggregate_results
  - source: post_basic
    target: aggregate_results
  - source: response_uuid
    target: aggregate_results
  - source: response_ip
    target: aggregate_results
  - source: fetch_with_binding
    target: aggregate_results
