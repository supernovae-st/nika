# Test: Simple for_each parallelism without MCP
# Run with: nika examples/test-for-each-simple.nika.yaml

schema: "nika/workflow@0.5"

tasks:
  - id: parallel_exec
    for_each: ["alpha", "beta", "gamma"]
    as: item
    concurrency: 3
    exec: "echo 'Processing {{use.item}}'"

  - id: collect
    use:
      results: parallel_exec
    exec: "echo 'All items processed: {{use.results}}'"

flows:
  - source: parallel_exec
    target: collect
