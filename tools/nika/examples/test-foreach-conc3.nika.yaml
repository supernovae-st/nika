schema: "nika/workflow@0.8"
workflow: test-foreach-concurrency-3
description: "Test for_each with concurrency=3 (parallel)"

tasks:
  - id: parallel_test
    for_each: ["apple", "banana", "cherry", "date", "elderberry"]
    as: fruit
    concurrency: 3
    fail_fast: true
    infer: "Describe {{use.fruit}} in exactly one short sentence (max 15 words)."
