schema: "nika/workflow@0.8"
workflow: test-foreach-concurrency-5
description: "Test for_each with concurrency=5 (full parallel)"

tasks:
  - id: parallel_test
    for_each: ["apple", "banana", "cherry", "date", "elderberry"]
    as: fruit
    concurrency: 5
    fail_fast: true
    infer: "Describe {{use.fruit}} in exactly one short sentence (max 15 words)."
