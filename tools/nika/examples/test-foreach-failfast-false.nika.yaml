schema: "nika/workflow@0.8"
workflow: test-foreach-failfast-false
description: "Test for_each with fail_fast=false (continue on error)"

tasks:
  - id: parallel_test
    for_each: ["apple", "banana", "cherry"]
    as: fruit
    concurrency: 3
    fail_fast: false
    infer: "Describe {{use.fruit}} in exactly one short sentence (max 15 words)."
