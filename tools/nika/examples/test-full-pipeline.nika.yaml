# Full Pipeline Test: NovaNet MCP + LLM Generation
# Tests complete integration of invoke: and infer: verbs
schema: "nika/workflow@0.5"
provider: claude

mcp:
  novanet:
    command: /Users/thibaut/supernovae-st/supernovae-agi/novanet/tools/novanet-mcp/target/release/novanet-mcp
    env:
      NOVANET_MCP_NEO4J_URI: bolt://localhost:7687
      NOVANET_MCP_NEO4J_USER: neo4j
      NOVANET_MCP_NEO4J_PASSWORD: novanetpassword

tasks:
  # Step 1: Get schema overview
  - id: schema
    invoke:
      mcp: novanet
      tool: novanet_describe
      params:
        describe: schema
    output:
      format: json

  # Step 2: Get introspection data for node classes
  - id: introspect
    invoke:
      mcp: novanet
      tool: novanet_introspect
      params:
        target: classes
        realm: shared
    output:
      format: json

  # Step 3: Search for entities
  - id: search_entities
    invoke:
      mcp: novanet
      tool: novanet_search
      params:
        query: "qr"
        limit: 5
    output:
      format: json

  # Step 4: Generate a summary using the context (requires ANTHROPIC_API_KEY)
  - id: generate_summary
    use:
      schema_data: schema
      classes: introspect
      search_results: search_entities
    infer:
      prompt: |
        You are analyzing a knowledge graph schema. Generate a brief summary (2-3 sentences).

        SCHEMA OVERVIEW:
        {{use.schema_data}}

        NODE CLASSES (shared realm):
        {{use.classes}}

        SEARCH RESULTS for "qr":
        {{use.search_results}}

        Provide a concise summary of what this schema represents.
    output:
      format: text

  # Final report
  - id: report
    use:
      summary: generate_summary
    exec: |
      echo "=== FULL PIPELINE TEST COMPLETE ==="
      echo ""
      echo "Summary:"
      echo "{{use.summary}}"

flows:
  - source: schema
    target: generate_summary
  - source: introspect
    target: generate_summary
  - source: search_entities
    target: generate_summary
  - source: generate_summary
    target: report
