# Test invoke: verb with Perplexity MCP
# Prerequisites: PERPLEXITY_API_KEY set

schema: nika/workflow@0.5
workflow: test-invoke-perplexity
description: "Direct test of invoke verb with Perplexity MCP"

mcp:
  perplexity:
    command: npx
    args:
      - -y
      - "perplexity-mcp"
    env:
      PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY}"

tasks:
  # Direct invoke: of Perplexity search tool
  - id: web_search
    invoke:
      mcp: perplexity
      tool: search
      params:
        query: "Rust programming language 2026 latest features"
    output:
      format: json

  # Process the search result
  - id: summarize
    use:
      search_result: web_search
    exec: |
      echo "=== INVOKE TEST RESULT ==="
      echo "Search completed. First 500 chars:"
      echo '{{use.search_result}}' | head -c 500
      echo "=== DONE ==="

flows:
  - source: web_search
    target: summarize
