# Test Workflow: invoke: Verb Comprehensive Testing
# Tests MCP tool invocations with mock server patterns.
#
# Run with: nika examples/test-invoke-verb.nika.yaml
# Note: This uses mock patterns - for real MCP tests, see test-novanet-mcp.nika.yaml
#
# For real testing with Perplexity MCP:
#   PERPLEXITY_API_KEY=pplx-... nika examples/test-invoke-verb.nika.yaml

schema: "nika/workflow@0.9"
workflow: test-invoke-verb
description: |
  Comprehensive test of the invoke: verb with:
  - Basic MCP tool invocation
  - Parameter passing
  - Response handling
  - Binding interpolation with invoke results
  - Multiple server configurations
  - Error scenario patterns

# MCP Server Configuration
# Using echo-based mock server for testing without external dependencies
mcp:
  # Mock MCP server using a simple echo pattern for testing
  # In production, replace with real MCP servers like novanet or perplexity
  mock_server:
    command: bash
    args:
      - "-c"
      - |
        # Simple mock MCP server that echoes tool calls as JSON-RPC responses
        while IFS= read -r line; do
          echo '{"jsonrpc":"2.0","id":1,"result":{"content":[{"type":"text","text":"Mock response for invoke test"}]}}'
        done

tasks:
  # ═══════════════════════════════════════════════════════════════════════════
  # Test 1: Basic invoke: Syntax Validation (via exec mock)
  # Since MCP requires a running server, we test the syntax/structure
  # ═══════════════════════════════════════════════════════════════════════════

  - id: invoke_syntax_test
    description: "Test invoke: YAML syntax structure (mock via exec)"
    exec: |
      # Simulating what an invoke: call would return
      echo '{"tool": "mock_tool", "result": {"status": "ok", "data": "test_value"}}'
    output:
      format: json

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 2: Invoke with Parameters Pattern
  # ═══════════════════════════════════════════════════════════════════════════

  - id: invoke_with_params_mock
    description: "Test invoke: with params structure (simulated)"
    exec: |
      # Simulating invoke with params
      cat << 'EOF'
      {
        "tool": "novanet_describe",
        "params": {
          "entity": "qr-code",
          "locale": "en-US"
        },
        "result": {
          "entity_key": "qr-code",
          "description": "Quick Response code for encoding data",
          "locale": "en-US"
        }
      }
      EOF
    output:
      format: json

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 3: Multiple Tool Invocations Pattern
  # ═══════════════════════════════════════════════════════════════════════════

  - id: invoke_describe_mock
    description: "Mock novanet_describe invocation"
    exec: |
      echo '{"type": "description", "content": "QR Code AI - Generate intelligent QR codes"}'
    output:
      format: json

  - id: invoke_traverse_mock
    description: "Mock novanet_traverse invocation"
    exec: |
      echo '{"type": "traversal", "nodes": ["entity:qr-code", "native:qr-code:en-US", "native:qr-code:fr-FR"]}'
    output:
      format: json

  - id: invoke_generate_mock
    description: "Mock novanet_generate invocation"
    exec: |
      echo '{"type": "generation", "locale": "fr-FR", "content": "Codes QR intelligents pour vos besoins"}'
    output:
      format: json

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 4: Binding with Invoke Results
  # ═══════════════════════════════════════════════════════════════════════════

  - id: setup_entity_key
    description: "Setup entity key for dynamic invoke"
    exec: "echo 'qr-code'"

  - id: invoke_with_binding_mock
    description: "Invoke using binding for dynamic params"
    use:
      entity: setup_entity_key
    exec: |
      echo '{"tool": "novanet_describe", "entity": "{{use.entity}}", "result": "Dynamic entity lookup successful"}'
    output:
      format: json

  - id: chain_invoke_results
    description: "Chain invoke results into next task"
    use:
      describe: invoke_describe_mock
      traverse: invoke_traverse_mock
    exec: |
      echo "Description: {{use.describe}}"
      echo "Traversal: {{use.traverse}}"

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 5: For Each with Invoke Pattern
  # ═══════════════════════════════════════════════════════════════════════════

  - id: parallel_invoke_mock
    description: "Parallel invoke: simulation with for_each"
    for_each: ["en-US", "fr-FR", "de-DE", "es-ES"]
    as: locale
    concurrency: 4
    exec: |
      echo '{"locale": "{{use.locale}}", "content": "Generated content for {{use.locale}}"}'
    output:
      format: json

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 6: Error Handling Patterns
  # ═══════════════════════════════════════════════════════════════════════════

  - id: invoke_error_pattern
    description: "Simulated invoke error response"
    exec: |
      echo '{"error": {"code": -32602, "message": "Invalid params"}, "tool": "novanet_unknown"}'
    output:
      format: json

  - id: invoke_timeout_pattern
    description: "Simulated timeout scenario (with delay)"
    exec: |
      sleep 0.5
      echo '{"tool": "slow_tool", "result": "Completed after delay"}'
    output:
      format: json

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 7: Real invoke: Syntax Examples (for validation)
  # These document the correct YAML syntax even if not executed
  # ═══════════════════════════════════════════════════════════════════════════

  # EXAMPLE (commented for syntax reference):
  # - id: real_invoke_example
  #   invoke:
  #     mcp: novanet
  #     tool: novanet_describe
  #     params:
  #       entity: "qr-code"
  #   output:
  #     format: json

  # EXAMPLE with binding:
  # - id: real_invoke_with_binding
  #   use:
  #     entity_key: previous_task
  #   invoke:
  #     mcp: novanet
  #     tool: novanet_generate
  #     params:
  #       focus_key: "entity:{{use.entity_key}}"
  #       locale: "fr-FR"
  #       mode: block

  # ═══════════════════════════════════════════════════════════════════════════
  # Test 8: Final Aggregation
  # ═══════════════════════════════════════════════════════════════════════════

  - id: aggregate_results
    description: "Aggregate all invoke test results"
    use:
      syntax: invoke_syntax_test
      params: invoke_with_params_mock
      describe: invoke_describe_mock
      traverse: invoke_traverse_mock
      generate: invoke_generate_mock
      parallel: parallel_invoke_mock
      dynamic: invoke_with_binding_mock
    exec: |
      echo "=== INVOKE VERB TEST RESULTS ==="
      echo ""
      echo "Syntax test: {{use.syntax}}"
      echo ""
      echo "With params: {{use.params}}"
      echo ""
      echo "Describe mock: {{use.describe}}"
      echo ""
      echo "Traverse mock: {{use.traverse}}"
      echo ""
      echo "Generate mock: {{use.generate}}"
      echo ""
      echo "Parallel results: {{use.parallel}}"
      echo ""
      echo "Dynamic binding: {{use.dynamic}}"
      echo ""
      echo "=== TEST COMPLETE ==="

flows:
  # Setup -> dynamic invoke
  - source: setup_entity_key
    target: invoke_with_binding_mock

  # Chaining invoke results
  - source: invoke_describe_mock
    target: chain_invoke_results
  - source: invoke_traverse_mock
    target: chain_invoke_results

  # Final aggregation
  - source: invoke_syntax_test
    target: aggregate_results
  - source: invoke_with_params_mock
    target: aggregate_results
  - source: invoke_describe_mock
    target: aggregate_results
  - source: invoke_traverse_mock
    target: aggregate_results
  - source: invoke_generate_mock
    target: aggregate_results
  - source: parallel_invoke_mock
    target: aggregate_results
  - source: invoke_with_binding_mock
    target: aggregate_results
