# Test: Mixed syntax equivalence ($task vs task)
# Purpose: Verify that $task and task produce identical results
# Features tested: implicit output ($task), explicit output (task), mixed references
schema: "nika/workflow@0.10"

provider:
  name: mock
  model: mock-model

tasks:
  # Step 1: Generate source data
  - id: source_data
    infer: "Generate a JSON object: {name: 'Test', value: 42}"

  # Step 2A: Use implicit syntax
  - id: implicit_consumer
    use:
      data: $source_data  # Implicit syntax - strips leading $
    infer: "Process with implicit: {{use.data}}"

  # Step 2B: Use explicit syntax (parallel with 2A)
  - id: explicit_consumer
    use:
      data: source_data  # Explicit syntax - no $ prefix
    infer: "Process with explicit: {{use.data}}"

  # Step 3: Compare results - both should be identical
  - id: compare_results
    use:
      implicit_result: $implicit_consumer
      explicit_result: explicit_consumer
    infer: |
      Compare results from both syntaxes:
      - Implicit ($source_data → $implicit_consumer): {{use.implicit_result}}
      - Explicit (source_data → explicit_consumer): {{use.explicit_result}}

      Verify they are identical.

  # Step 4: Test mixed in same use block
  - id: mixed_references
    use:
      # Mix both syntaxes in same use block
      from_implicit: $source_data
      from_explicit: source_data
      result_implicit: $compare_results
      result_explicit: compare_results
    infer: |
      Mixed syntax test:
      Source via $: {{use.from_implicit}}
      Source direct: {{use.from_explicit}}
      Compare via $: {{use.result_implicit}}
      Compare direct: {{use.result_explicit}}

  # Step 5: Verify $ stripping with edge cases
  - id: edge_case_test
    use:
      # Single $ should be stripped
      single_dollar: $mixed_references
      # Explicit form for comparison
      no_dollar: mixed_references
    infer: |
      Edge case verification:
      - $mixed_references resolves to: {{use.single_dollar}}
      - mixed_references resolves to: {{use.no_dollar}}
      Both should be identical.

flows:
  - name: main
    tasks:
      - source_data
      - implicit_consumer
      - explicit_consumer
      - compare_results
      - mixed_references
      - edge_case_test
