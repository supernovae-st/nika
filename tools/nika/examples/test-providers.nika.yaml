# Test: Multiple LLM providers
# Run with: nika examples/test-providers.nika.yaml
# Requires: ANTHROPIC_API_KEY, OPENAI_API_KEY

schema: "nika/workflow@0.5"

tasks:
  - id: test_claude
    infer:
      prompt: "Say 'Hello from Claude' exactly, nothing more."
      provider: claude
      model: claude-sonnet-4-6

  - id: test_openai
    infer:
      prompt: "Say 'Hello from OpenAI' exactly, nothing more."
      provider: openai
      model: gpt-4o

  - id: combine
    use:
      claude: test_claude
      openai: test_openai
    exec: |
      echo "Claude: {{use.claude}}"
      echo "OpenAI: {{use.openai}}"

flows:
  - source: test_claude
    target: combine
  - source: test_openai
    target: combine
