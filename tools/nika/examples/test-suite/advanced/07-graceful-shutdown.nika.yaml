# Test: advanced/07-graceful-shutdown
# Tests: Graceful shutdown handling
# Expected: Long-running tasks can be interrupted gracefully

schema: "nika/workflow@0.12"
workflow: test-graceful-shutdown
description: "Test graceful shutdown"

provider: claude

tasks:
  - id: long_task_1
    description: "Long-running task 1"
    exec:
      command: "echo 'Long task 1'"
      timeout: 30

  - id: long_task_2
    description: "Long-running task 2"
    exec:
      command: "echo 'Long task 2'"
      timeout: 30

  - id: cleanup_on_shutdown
    description: "Cleanup task"
    exec: "echo 'Cleanup'"
    flow: [long_task_1, long_task_2]
