# Test: agent/05-advanced
# Tests: Agent verb with all advanced options
# Expected: Full configuration works including thinking and nested agents

schema: "nika/workflow@0.10"
workflow: test-agent-advanced
description: "Test agent verb with advanced options"

provider: mock

mcp:
  dummy:
    command: echo
    args: ["not used"]

tasks:
  - id: full_config_agent
    description: "Agent with full configuration"
    agent:
      prompt: "Analyze the benefits of functional programming."
      system: "You are an expert software architect."
      max_turns: 5
      depth_limit: 2
      temperature: 0.5
      max_tokens: 2000
      tool_choice: auto
      mcp:
        - dummy
      tools:
        - nika:log
        - nika:emit

  - id: thinking_agent
    description: "Agent with extended thinking"
    agent:
      prompt: "Design a microservices architecture for an e-commerce platform."
      extended_thinking: true
      thinking_budget: 8192
      max_turns: 3
      temperature: 0.3

  - id: nested_agent
    description: "Agent that can spawn sub-agents"
    agent:
      prompt: "Break down this task into subtasks and delegate them."
      depth_limit: 3
      max_turns: 5
      tools:
        - nika:log
