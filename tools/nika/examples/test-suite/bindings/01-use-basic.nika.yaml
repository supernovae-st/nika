# Test: bindings/01-use-basic
# Tests: Basic use: binding from task output
# Expected: Task output is available via {{use.alias}}

schema: "nika/workflow@0.10"
workflow: test-bindings-use-basic
description: "Test basic use: binding pattern"

provider: mock

tasks:
  - id: source
    description: "Source task that produces output"
    exec: "echo 'Hello World'"

  - id: consumer
    description: "Consumer task that uses source output"
    use:
      message: source
    exec: "echo 'Received: {{use.message}}'"
    flow: [source]
