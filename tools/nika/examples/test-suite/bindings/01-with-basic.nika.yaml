# Test: bindings/01-with-basic
# Tests: Basic with: binding from task output
# Expected: Task output is available via {{with.alias}}

schema: "nika/workflow@0.12"
workflow: test-bindings-with-basic
description: "Test basic with: binding pattern"

provider: claude

tasks:
  - id: source
    description: "Source task that produces output"
    exec: "echo 'Hello World'"

  - id: consumer
    description: "Consumer task that uses source output"
    with:
      message: source
    exec: "echo 'Received: {{with.message}}'"
    flow: [source]
