# Test: bindings/02-with-nested
# Tests: Nested object access in bindings
# Expected: Nested JSON paths are resolved correctly

schema: "nika/workflow@0.12"
workflow: test-bindings-with-nested
description: "Test nested object access in bindings"

provider: claude

tasks:
  - id: produce_json
    description: "Produce structured JSON output"
    exec:
      command: "echo '{\"user\": {\"name\": \"Alice\", \"email\": \"alice@example.com\"}}'"
      shell: true
    output:
      format: json

  - id: use_nested
    description: "Access nested fields from JSON"
    with:
      data: $produce_json
    infer: "Process user data: {{with.data}}"
    depends_on: [produce_json]
