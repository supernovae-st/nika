# Test: bindings/07-for-each-concurrent
# Tests: for_each with concurrency control
# Expected: Items process in parallel up to concurrency limit

schema: "nika/workflow@0.10"
workflow: test-bindings-foreach-concurrent
description: "Test for_each with concurrency control"

provider: claude  # Not used - exec only workflow

tasks:
  - id: parallel_process
    description: "Process items with concurrency"
    for_each: ["task1", "task2", "task3", "task4", "task5"]
    as: task
    concurrency: 3
    fail_fast: true
    exec: "echo 'Parallel: {{with.task}}'"
