# Test: bindings/09-template-resolution
# Tests: Template resolution with multiple bindings
# Expected: Multiple {{with.x}} templates resolve correctly

schema: "nika/workflow@0.12"
workflow: test-bindings-template
description: "Test multiple template resolution"

provider: claude

tasks:
  - id: step1
    exec: "echo 'value1'"

  - id: step2
    exec: "echo 'value2'"

  - id: step3
    exec: "echo 'value3'"

  - id: combine
    description: "Combine multiple bindings"
    with:
      a: $step1
      b: $step2
      c: $step3
    infer: "Combine: {{with.a}}, {{with.b}}, {{with.c}}"
    flow: [step1, step2, step3]
