# Test: bindings/10-lazy-bindings
# Tests: Lazy binding resolution
# Expected: Lazy bindings are deferred until access

schema: "nika/workflow@0.12"
workflow: test-bindings-lazy
description: "Test lazy binding resolution"

provider: claude

tasks:
  - id: early_task
    exec: "echo 'early'"

  - id: late_task
    description: "Task with lazy binding"
    with:
      data:
        path: early_task
        lazy: true
        default: "fallback"
    infer: "Using data: {{with.data}}"
    flow: [early_task]
