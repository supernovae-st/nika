# Test: bindings/11-cross-task
# Tests: Cross-task data flow in complex DAG
# Expected: Data flows correctly through DAG

schema: "nika/workflow@0.12"
workflow: test-bindings-cross-task
description: "Test cross-task data flow"

provider: claude

tasks:
  - id: root
    exec: "echo 'root-data'"

  - id: branch_a
    with:
      input: $root
    exec: "echo 'A: {{with.input}}'"
    depends_on: [root]

  - id: branch_b
    with:
      input: $root
    exec: "echo 'B: {{with.input}}'"
    depends_on: [root]

  - id: merge
    description: "Merge data from branches"
    with:
      from_a: $branch_a
      from_b: $branch_b
    infer: "Merged: {{with.from_a}} and {{with.from_b}}"
    depends_on: [branch_a, branch_b]
