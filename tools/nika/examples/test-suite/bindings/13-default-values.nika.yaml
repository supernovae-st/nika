# Test: bindings/13-default-values
# Tests: Binding with default values
# Expected: Default values are used when source is null

schema: "nika/workflow@0.10"
workflow: test-bindings-defaults
description: "Test binding default values"

provider: claude

tasks:
  - id: maybe_empty
    exec: "echo ''"

  - id: with_defaults
    description: "Use default when source is empty"
    with:
      data:
        path: maybe_empty
        default: "default-value"
    infer: "Using: {{with.data}}"
    flow: [maybe_empty]
