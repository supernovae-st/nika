# Test: bindings/14-validation
# Tests: Output validation with schema
# Expected: Invalid output triggers retry

schema: "nika/workflow@0.12"
workflow: test-bindings-validation
description: "Test output validation with schema"

provider: claude

tasks:
  - id: structured_output
    description: "Generate structured output with validation"
    infer:
      prompt: "Generate a JSON object with name and age fields."
    output:
      format: json
      schema:
        type: object
        required: [name, age]
        properties:
          name:
            type: string
          age:
            type: integer
            minimum: 0
      max_retries: 2
