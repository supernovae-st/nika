# Test: exec/03-timeout
# Tests: Exec verb with timeout configuration
# Expected: Command respects timeout setting

schema: "nika/workflow@0.12"
workflow: test-exec-timeout
description: "Test exec verb with timeout configuration"

provider: claude

tasks:
  - id: quick_command
    description: "Command with short timeout"
    exec:
      command: "echo 'fast operation'"
      timeout: 5

  - id: slow_command
    description: "Command with longer timeout"
    exec:
      command: "sleep 1 && echo 'done'"
      shell: true
      timeout: 10
