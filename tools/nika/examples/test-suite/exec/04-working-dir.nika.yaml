# Test: exec/04-working-dir
# Tests: Exec verb with working directory configuration
# Expected: Command runs in specified directory

schema: "nika/workflow@0.12"
workflow: test-exec-working-dir
description: "Test exec verb with custom working directory"

provider: claude

tasks:
  - id: in_tmp
    description: "Execute command in /tmp directory"
    exec:
      command: "pwd"
      cwd: /tmp
