# Test: flow/04-complex-dag
# Tests: Complex DAG with multiple paths
# Expected: All paths resolve correctly

schema: "nika/workflow@0.10"
workflow: test-flow-complex-dag
description: "Test complex DAG with multiple paths"

provider: mock

tasks:
  - id: root
    exec: "echo 'Root'"

  - id: node_a
    exec: "echo 'Node A'"

  - id: node_b
    exec: "echo 'Node B'"

  - id: node_c
    exec: "echo 'Node C'"

  - id: node_d
    exec: "echo 'Node D'"

  - id: node_e
    exec: "echo 'Node E'"

  - id: sink
    exec: "echo 'Sink'"

flows:
  - source: root
    target: [node_a, node_b]
  - source: node_a
    target: [node_c, node_d]
  - source: node_b
    target: node_d
  - source: node_c
    target: node_e
  - source: node_d
    target: node_e
  - source: node_e
    target: sink
