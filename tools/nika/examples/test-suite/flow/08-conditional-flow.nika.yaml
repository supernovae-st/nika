# Test: flow/08-conditional-flow
# Tests: DAG ordering with conditional-style data flow
# Expected: Tasks execute in correct dependency order
# Note: This tests DAG parsing only — no runtime conditional logic

schema: "nika/workflow@0.12"
workflow: test-flow-conditional
description: "Test conditional-style DAG ordering (parse only)"

provider: claude

tasks:
  - id: check_condition
    description: "Check a condition"
    exec: "echo 'true'"

  - id: on_true
    description: "Execute after check (always runs — no actual conditional)"
    with:
      result: check_condition
    exec: "echo 'Condition was true'"
    flow: [check_condition]

  - id: always_run
    description: "Always runs after condition check"
    exec: "echo 'Always runs'"
    flow: [check_condition]
