# Test: flow/14-fan-out
# Tests: Fan-out pattern (one to many)
# Expected: Single task fans out to multiple

schema: "nika/workflow@0.12"
workflow: test-flow-fan-out
description: "Test fan-out pattern"

provider: claude

tasks:
  - id: source
    exec: "echo 'Source data'"

  - id: worker1
    with:
      data: $source
    exec: "echo 'Worker 1: {{with.data}}'"
    depends_on: [source]

  - id: worker2
    with:
      data: $source
    exec: "echo 'Worker 2: {{with.data}}'"
    depends_on: [source]

  - id: worker3
    with:
      data: $source
    exec: "echo 'Worker 3: {{with.data}}'"
    depends_on: [source]

  - id: worker4
    with:
      data: $source
    exec: "echo 'Worker 4: {{with.data}}'"
    depends_on: [source]

  - id: worker5
    with:
      data: $source
    exec: "echo 'Worker 5: {{with.data}}'"
    depends_on: [source]
