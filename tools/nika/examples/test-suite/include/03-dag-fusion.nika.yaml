# Test: include/03-dag-fusion
# Tests: DAG fusion with flow connections to included tasks
# Expected: Main workflow flows connect to included tasks

schema: "nika/workflow@0.10"
workflow: test-include-dag-fusion
description: "Test DAG fusion with includes"

provider: mock

include:
  - path: ./partials/setup.nika.yaml
    prefix: setup_
  - path: ./partials/cleanup.nika.yaml
    prefix: cleanup_

tasks:
  - id: process
    description: "Main processing"
    exec: "echo 'Processing'"

flows:
  - source: setup_validate
    target: process
  - source: process
    target: cleanup_finalize
