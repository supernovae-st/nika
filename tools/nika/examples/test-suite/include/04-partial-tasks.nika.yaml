# Test: include/04-partial-tasks
# Tests: Using specific tasks from included workflow
# Expected: Can reference prefixed task IDs

schema: "nika/workflow@0.12"
workflow: test-include-partial-tasks
description: "Test referencing included task outputs"

provider: claude

include:
  - path: ./partials/processing.nika.yaml
    prefix: proc_

tasks:
  - id: use_processed
    description: "Use output from included task"
    with:
      result: $proc_validate_output
    exec: "echo 'Using: {{with.result}}'"
    depends_on: [proc_validate_output]
