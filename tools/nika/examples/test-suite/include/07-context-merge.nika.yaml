# Test: include/07-context-merge
# Tests: Context merging with included workflows
# Expected: Context from parent available to included tasks

schema: "nika/workflow@0.12"
workflow: test-include-context-merge
description: "Test context merging with includes"

provider: claude

context:
  files:
    readme: ../../README.md

include:
  - path: ./partials/setup.nika.yaml
    prefix: ctx_

tasks:
  - id: use_context
    description: "Use merged context"
    infer: "Process: {{context.files.readme}}"
    flow: [ctx_validate]
