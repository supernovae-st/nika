# Test: include/10-circular-detection
# Tests: Circular include detection (should not error for non-circular)
# Expected: Non-circular includes work fine

schema: "nika/workflow@0.10"
workflow: test-include-non-circular
description: "Test that non-circular includes work"

provider: claude

# This is NOT circular - just includes the same partial twice
# with different prefixes (which is valid)
include:
  - path: ./partials/setup.nika.yaml
    prefix: first_
  - path: ./partials/setup.nika.yaml
    prefix: second_

tasks:
  - id: after_both
    description: "After both setups"
    exec: "echo 'After both'"
    flow: [first_validate, second_validate]
