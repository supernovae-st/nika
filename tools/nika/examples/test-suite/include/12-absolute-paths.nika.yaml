# Test: include/12-absolute-paths
# Tests: Absolute path handling (uses relative for portability)
# Expected: Path resolution works correctly

schema: "nika/workflow@0.10"
workflow: test-include-paths
description: "Test path handling"

provider: claude

# Using relative path for test portability
# In production, absolute paths would work too
include:
  - path: ./partials/setup.nika.yaml
    prefix: abs_

tasks:
  - id: verify_path
    description: "Verify path resolution"
    exec: "echo 'Path resolution OK'"
    flow: [abs_validate]
