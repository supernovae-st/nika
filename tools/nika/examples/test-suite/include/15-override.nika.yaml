# Test: include/15-override
# Tests: Task override patterns with includes
# Expected: Main workflow tasks can override included

schema: "nika/workflow@0.10"
workflow: test-include-override
description: "Test override patterns"

provider: mock

include:
  - path: ./partials/setup.nika.yaml
    prefix: base_
  - path: ./partials/processing.nika.yaml
    prefix: proc_

tasks:
  # Custom task that hooks into the flow
  - id: custom_step
    description: "Custom step between setup and processing"
    exec: "echo 'Custom override step'"

flows:
  - source: base_validate
    target: custom_step
  - source: custom_step
    target: proc_transform
