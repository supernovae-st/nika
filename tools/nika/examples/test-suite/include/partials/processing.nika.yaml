# Reusable processing tasks

schema: "nika/workflow@0.10"
workflow: partial-processing

provider: claude

tasks:
  - id: transform
    description: "Transform data"
    exec: "echo 'Transformed'"

  - id: enrich
    description: "Enrich data"
    exec: "echo 'Enriched'"
