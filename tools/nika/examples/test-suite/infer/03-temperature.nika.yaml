# Test: infer/03-temperature
# Tests: Infer verb with temperature control
# Expected: Temperature parameter affects generation creativity

schema: "nika/workflow@0.10"
workflow: test-infer-temperature
description: "Test infer verb with temperature control"

provider: mock

tasks:
  - id: low_temp
    description: "Low temperature for deterministic output"
    infer:
      prompt: "What is the capital of France?"
      temperature: 0.1

  - id: high_temp
    description: "High temperature for creative output"
    infer:
      prompt: "Write a creative sentence about clouds."
      temperature: 0.9
