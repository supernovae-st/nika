# Test: infer/05-advanced
# Tests: Infer verb with all options including extended thinking
# Expected: Full configuration works including thinking budget

schema: "nika/workflow@0.10"
workflow: test-infer-advanced
description: "Test infer verb with all advanced options"

provider: mock

tasks:
  - id: full_config
    description: "Infer with all configuration options"
    infer:
      prompt: "Analyze the trade-offs between SQL and NoSQL databases for a high-traffic application."
      system: "You are a senior software architect with 15 years of experience."
      temperature: 0.3
      max_tokens: 1000
      response_format: json

  - id: with_thinking
    description: "Infer with extended thinking enabled"
    infer:
      prompt: "Design a caching strategy for a distributed system."
      extended_thinking: true
      thinking_budget: 4096
      temperature: 0.2
