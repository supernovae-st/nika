# Content Generation Integration Test
# =============================================================================
# Full Nika↔NovaNet pipeline: context assembly → LLM generation → validation.
#
# Usage:
#   docker compose -f docker-compose.test.yml --profile e2e up -d
#   ANTHROPIC_API_KEY=sk-ant-... nika examples/test-suite/integration/03-content-generation.nika.yaml
#
# Requirements:
#   - Neo4j with NovaNet schema and entity data
#   - ANTHROPIC_API_KEY or other LLM provider key
# =============================================================================

schema: "nika/workflow@0.10"
workflow: test-content-generation
description: "Test full Nika↔NovaNet content generation pipeline"

provider: claude
model: claude-sonnet-4-6

mcp:
  novanet:
    command: cargo
    args:
      - run
      - --manifest-path
      - ../../../../novanet/tools/novanet-mcp/Cargo.toml
    env:
      NOVANET_MCP_NEO4J_URI: ${NOVANET_MCP_NEO4J_URI:-bolt://localhost:7687}
      NOVANET_MCP_NEO4J_USER: neo4j
      NOVANET_MCP_NEO4J_PASSWORD: ${NOVANET_MCP_NEO4J_PASSWORD:-novanetpassword}

tasks:
  # Step 1: Assemble context from NovaNet
  - id: assemble_context
    description: "Assemble context for French QR Code page"
    invoke:
      server: novanet
      tool: novanet_generate
      params:
        focus_key: "entity:qr-code"
        locale: fr-FR
        mode: page
        token_budget: 8000
        include_entities: true
        include_knowledge: true
    output:
      format: json

  # Step 2: Generate hero section content
  - id: generate_hero
    description: "Generate hero section from context"
    with:
      ctx: assemble_context
    infer:
      prompt: |
        Generate a hero section for a QR Code AI landing page in French.

        CONTEXT FROM NOVANET:
        {{with.ctx}}

        RULES:
        - Use denomination_forms EXACTLY as provided (no paraphrasing)
        - Follow ADR-033: text for prose, title for headings
        - Output ONLY valid JSON, no markdown

        OUTPUT FORMAT:
        {
          "headline": "H1 headline using title form",
          "description": "2-3 sentences using text form",
          "cta": "Call-to-action button text"
        }
      temperature: 0.3
      system: "You are a French copywriter. Output JSON only, no explanation."
      max_tokens: 500
    output:
      format: json
      schema:
        type: object
        required:
          - headline
          - description
          - cta
        properties:
          headline:
            type: string
            minLength: 5
          description:
            type: string
            minLength: 20
          cta:
            type: string
            minLength: 3
      max_retries: 2
    flow: [assemble_context]

  # Step 3: Validate output structure
  - id: validate_hero
    description: "Validate generated hero content"
    with:
      hero: generate_hero
    exec:
      command: |
        echo '{{with.hero}}' | jq -e '
          .headline != null and
          .description != null and
          .cta != null and
          (.headline | length) >= 5 and
          (.description | length) >= 20
        '
      shell: true
    flow: [generate_hero]

  # Step 4: Log success
  - id: log_success
    description: "Log successful generation"
    with:
      hero: generate_hero
    invoke:
      server: novanet
      tool: nika:log
      params:
        level: info
        message: "Content generation successful: {{with.hero.headline}}"
    flow: [validate_hero]
