# Test: invoke/04-resource-read
# Tests: Invoke verb with resource reading
# Expected: MCP resource is read successfully

schema: "nika/workflow@0.10"
workflow: test-invoke-resource
description: "Test invoke verb with MCP resource reading"

provider: claude

mcp:
  builtin:
    command: echo
    args: ["not used"]

tasks:
  - id: read_resource
    description: "Read MCP resource"
    invoke:
      mcp: builtin
      resource: "file:///tmp/test-resource.txt"
