# Test: mcp/01-tool-call-basic
# Tests: Basic MCP tool call via invoke
# Expected: MCP tool is called and returns result

schema: "nika/workflow@0.10"
workflow: test-mcp-tool-basic
description: "Test basic MCP tool call"

provider: mock

mcp:
  test-server:
    command: echo
    args: ["not used"]

tasks:
  - id: call_tool
    description: "Basic MCP tool call"
    invoke:
      mcp: test-server
      tool: nika:log
      params:
        level: info
        message: "MCP test message"
