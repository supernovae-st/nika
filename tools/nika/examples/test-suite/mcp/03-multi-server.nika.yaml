# Test: mcp/03-multi-server
# Tests: Multiple MCP servers in one workflow
# Expected: Multiple servers can be configured and used

schema: "nika/workflow@0.10"
workflow: test-mcp-multi-server
description: "Test multiple MCP servers"

provider: claude

mcp:
  server-a:
    command: echo
    args: ["server-a"]

  server-b:
    command: echo
    args: ["server-b"]

  server-c:
    command: echo
    args: ["server-c"]

tasks:
  - id: call_server_a
    description: "Call server A"
    invoke:
      mcp: server-a
      tool: nika:emit
      params:
        name: event-a
        payload:
          source: server-a

  - id: call_server_b
    description: "Call server B"
    invoke:
      mcp: server-b
      tool: nika:emit
      params:
        name: event-b
        payload:
          source: server-b

  - id: call_server_c
    description: "Call server C"
    invoke:
      mcp: server-c
      tool: nika:emit
      params:
        name: event-c
        payload:
          source: server-c
