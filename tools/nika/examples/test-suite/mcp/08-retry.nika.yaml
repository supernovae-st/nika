# Test: mcp/08-retry
# Tests: MCP retry behavior
# Expected: Failed calls can trigger workflow retry

schema: "nika/workflow@0.10"
workflow: test-mcp-retry
description: "Test MCP retry behavior"

provider: mock

mcp:
  retry-server:
    command: echo
    args: ["retry"]

tasks:
  - id: retry_call
    description: "Call that might need retry"
    invoke:
      mcp: retry-server
      tool: nika:log
      params:
        level: info
        message: "Retry test"
    output:
      max_retries: 3
