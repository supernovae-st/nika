# Test: mcp/10-agent-with-mcp
# Tests: Agent with MCP server access
# Expected: Agent can call MCP tools during execution

schema: "nika/workflow@0.10"
workflow: test-mcp-agent
description: "Test agent with MCP server access"

provider: mock

mcp:
  agent-server:
    command: echo
    args: ["agent-server"]

tasks:
  - id: mcp_agent
    description: "Agent with MCP access"
    agent:
      prompt: "Use the available tools to log a message."
      mcp:
        - agent-server
      max_turns: 3
