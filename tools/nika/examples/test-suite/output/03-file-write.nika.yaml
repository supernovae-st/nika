# Test: output/03-file-write
# Tests: Artifact file persistence
# Expected: Output is written to specified path via artifact system

schema: "nika/workflow@0.10"
workflow: test-output-file
description: "Test artifact file writing (migrated from deprecated output.save)"

provider: ollama
model: llama3.2:1b

# v0.18 Artifact system replaces deprecated output.save
artifacts:
  dir: /tmp/nika-test-artifacts
  format: text
  mode: overwrite

tasks:
  - id: save_output
    description: "Save output to file via artifact system"
    infer: "Generate a short test content about cats. Keep it under 20 words."
    output:
      format: text
    artifact:
      path: output.txt
