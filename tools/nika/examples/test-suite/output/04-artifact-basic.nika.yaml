# Test: output/04-artifact-basic
# Tests: Basic artifact configuration
# Expected: Artifact is saved with default settings

schema: "nika/workflow@0.10"
workflow: test-artifact-basic
description: "Test basic artifact configuration"

provider: claude

artifacts:
  dir: /tmp/nika-artifacts
  format: text

tasks:
  - id: with_artifact
    description: "Task with artifact output"
    infer: "Generate content for artifact."
    artifact:
      path: "{{workflow}}/output.txt"
