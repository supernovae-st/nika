# Test: output/05-artifact-conditional
# Tests: Conditional artifact saving
# Expected: Artifact behavior controlled by boolean

schema: "nika/workflow@0.12"
workflow: test-artifact-conditional
description: "Test conditional artifact saving"

provider: claude

artifacts:
  dir: /tmp/nika-artifacts
  format: json

tasks:
  - id: with_artifact
    description: "Task with artifact enabled"
    infer: "Generate JSON content."
    artifact: true
    output:
      format: json

  - id: without_artifact
    description: "Task with artifact disabled"
    infer: "Generate content without artifact."
    artifact: false
