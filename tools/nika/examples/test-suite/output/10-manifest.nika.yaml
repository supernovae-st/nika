# Test: output/10-manifest
# Tests: Artifact manifest generation
# Expected: artifacts.json manifest is generated

schema: "nika/workflow@0.10"
workflow: test-artifact-manifest
description: "Test artifact manifest generation"

provider: claude

artifacts:
  dir: /tmp/nika-artifacts
  manifest: true
  format: json
  mode: overwrite
  max_size: 1048576

tasks:
  - id: artifact_a
    description: "First artifact"
    exec: "echo '{\"a\": 1}'"
    artifact:
      path: "manifest-test/a.json"

  - id: artifact_b
    description: "Second artifact"
    exec: "echo '{\"b\": 2}'"
    artifact:
      path: "manifest-test/b.json"

  - id: artifact_c
    description: "Third artifact"
    exec: "echo '{\"c\": 3}'"
    artifact:
      path: "manifest-test/c.json"
