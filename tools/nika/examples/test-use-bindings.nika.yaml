schema: "nika/workflow@0.8"
workflow: test-use-bindings
description: "Test use: bindings and flows: DAG dependencies with real execution"

tasks:
  - id: step1
    infer: "Generate a random number between 1 and 100. Reply with ONLY the number, nothing else."

  - id: step2
    use:
      num: step1
    infer: "The number from step1 was: {{use.num}}. Double this number and reply with ONLY the result, nothing else."

  - id: step3
    use:
      original: step1
      doubled: step2
    infer: "Original number: {{use.original}}. Doubled: {{use.doubled}}. Now add them together and explain the calculation briefly."

flows:
  - source: step1
    target: step2
  - source: step1
    target: step3
  - source: step2
    target: step3
