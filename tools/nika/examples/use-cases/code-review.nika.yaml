# Code Review Assistant
# Read a source file, analyze it, and produce a structured code review.
#
# Usage:
#   FILE="src/main.rs" nika run examples/use-cases/code-review.nika.yaml
#
# Requirements:
#   - OPENAI_API_KEY
#   - Source file to review

schema: nika/workflow@0.12
workflow: code-review
description: "Read a source file, analyze quality/security/performance, generate review"
provider: openai
model: gpt-4.1-mini

tasks:
  # Step 1: Read the source file
  - id: read_source
    exec:
      command: "cat ${FILE:-src/main.rs} 2>/dev/null || echo 'File not found'"
      shell: true

  # Step 2: Get file metadata
  - id: file_meta
    exec:
      command: "wc -l ${FILE:-src/main.rs} 2>/dev/null && file ${FILE:-src/main.rs} 2>/dev/null || echo 'unknown'"
      shell: true

  # Step 3: Security analysis
  - id: security_review
    depends_on: [read_source]
    with:
      code: $read_source
    infer:
      prompt: |
        Perform a security-focused code review on this source code.

        CODE:
        {{with.code}}

        Check for:
        - Injection vulnerabilities (SQL, command, path traversal)
        - Hardcoded secrets or credentials
        - Unsafe memory operations
        - Missing input validation
        - Authentication/authorization gaps
        - Insecure defaults

        For each finding, provide: severity (critical/high/medium/low), location, description, and fix.
        If no issues found, state that explicitly.
      max_tokens: 200

  # Step 4: Quality and style analysis
  - id: quality_review
    depends_on: [read_source]
    with:
      code: $read_source
    infer:
      prompt: |
        Review this code for quality and maintainability.

        CODE:
        {{with.code}}

        Evaluate:
        - Code clarity and readability
        - Function/method length and complexity
        - DRY principle adherence
        - Error handling completeness
        - Naming conventions
        - Documentation coverage
        - Test implications

        Provide specific, actionable suggestions with code snippets where helpful.
      max_tokens: 200

  # Step 5: Compile final review report
  - id: final_report
    depends_on: [security_review, quality_review, file_meta]
    with:
      security: $security_review
      quality: $quality_review
      meta: $file_meta
    infer:
      prompt: |
        Compile a final code review report combining these analyses.

        FILE INFO:
        {{with.meta}}

        SECURITY REVIEW:
        {{with.security}}

        QUALITY REVIEW:
        {{with.quality}}

        Format as a markdown report with:
        - Summary verdict (Approve / Request Changes / Block)
        - Risk level (Low / Medium / High)
        - Top 3 action items ranked by priority
        - Detailed findings by category
      max_tokens: 200
    artifact:
      path: code-review-report.md
      template: |
        # Code Review Report

        {{task.output}}
