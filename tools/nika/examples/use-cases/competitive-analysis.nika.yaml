# Competitive Analysis
# Fetch a competitor's webpage, analyze positioning, and compare with your product.
#
# Usage:
#   URL="https://example.com" nika run examples/use-cases/competitive-analysis.nika.yaml
#
# Requirements:
#   - OPENAI_API_KEY
#   - Target URL accessible via HTTP

schema: nika/workflow@0.12
workflow: competitive-analysis
description: "Fetch competitor page, analyze positioning, compare with your product"
provider: openai
model: gpt-4.1-mini

tasks:
  # Step 1: Fetch competitor page content
  - id: fetch_competitor
    fetch:
      url: "${URL:-https://httpbin.org/html}"
      method: GET

  # Step 2: Analyze the competitor's positioning
  - id: analyze_positioning
    depends_on: [fetch_competitor]
    with:
      page: $fetch_competitor
    infer:
      prompt: |
        Analyze this competitor's web page content for market positioning.

        PAGE CONTENT:
        {{with.page}}

        Extract and analyze:
        1. Value proposition (main headline/tagline)
        2. Target audience (who are they speaking to)
        3. Key features highlighted (top 5)
        4. Pricing signals (if visible)
        5. Trust signals (testimonials, logos, certifications)
        6. Call-to-action strategy
        7. Tone and brand voice
      max_tokens: 200

  # Step 3: SWOT comparison
  - id: swot_comparison
    depends_on: [analyze_positioning]
    with:
      analysis: $analyze_positioning
    infer:
      prompt: |
        Based on this competitor analysis, create a SWOT comparison from our perspective.

        COMPETITOR ANALYSIS:
        {{with.analysis}}

        OUR PRODUCT: An open-source YAML workflow engine for AI tasks with 5 semantic verbs,
        native MCP integration, and a terminal UI. Runs locally with zero dependencies.

        Create a SWOT matrix:
        - Strengths: Where we beat them
        - Weaknesses: Where they beat us
        - Opportunities: Gaps we can exploit
        - Threats: Risks from their approach

        Be specific and actionable, not generic.
      max_tokens: 200

  # Step 4: Strategic recommendations
  - id: recommendations
    depends_on: [swot_comparison, analyze_positioning]
    with:
      swot: $swot_comparison
      positioning: $analyze_positioning
    infer:
      prompt: |
        Based on this competitive analysis, provide 5 strategic recommendations.

        COMPETITOR POSITIONING:
        {{with.positioning}}

        SWOT ANALYSIS:
        {{with.swot}}

        For each recommendation:
        - Action: what to do
        - Rationale: why it matters
        - Effort: low/medium/high
        - Impact: low/medium/high
        - Timeline: immediate/short-term/long-term

        Prioritize by impact-to-effort ratio.
      max_tokens: 200
    artifact:
      path: competitive-analysis.md
      template: |
        # Competitive Analysis Report

        {{task.output}}
