# Data ETL Pipeline
# Extract data via shell command, transform with AI, and save as artifact.
#
# Usage:
#   nika run examples/use-cases/data-etl.nika.yaml
#
# Requirements:
#   - OPENAI_API_KEY

schema: nika/workflow@0.12
workflow: data-etl
description: "Extract data (exec) -> transform with AI (infer) -> load as artifact"
provider: openai
model: gpt-4.1-mini
artifacts:
  dir: ./examples/use-cases/.output

tasks:
  # EXTRACT: Read raw data from system
  - id: extract
    exec:
      command: |
        echo '[
          {"date":"2024-01-15","event":"signup","user":"u001","value":0},
          {"date":"2024-01-15","event":"purchase","user":"u002","value":49.99},
          {"date":"2024-01-16","event":"signup","user":"u003","value":0},
          {"date":"2024-01-16","event":"purchase","user":"u001","value":99.99},
          {"date":"2024-01-16","event":"churn","user":"u004","value":-29.99},
          {"date":"2024-01-17","event":"signup","user":"u005","value":0},
          {"date":"2024-01-17","event":"upgrade","user":"u002","value":50.00},
          {"date":"2024-01-17","event":"purchase","user":"u003","value":49.99}
        ]'
      shell: true

  # TRANSFORM: Enrich and aggregate with AI
  - id: transform
    depends_on: [extract]
    with:
      raw: $extract
    infer:
      prompt: |
        Transform this raw event data into an aggregated analytics summary.

        RAW DATA:
        {{with.raw}}

        Perform these transformations:
        1. Aggregate by date: total signups, purchases, churns, upgrades
        2. Calculate daily revenue (sum of values for purchase/upgrade events)
        3. Calculate cumulative metrics
        4. Identify trends (growth rate, churn rate)
        5. Flag anomalies if any

        Return a JSON object with:
        - daily_summary: array of { date, signups, purchases, churns, revenue }
        - totals: { total_signups, total_purchases, total_revenue, churn_rate }
        - insights: array of string observations
      max_tokens: 200
    output:
      format: json

  # LOAD: Save transformed data as artifact
  - id: load
    depends_on: [transform]
    with:
      analytics: $transform
    infer:
      prompt: |
        Format this analytics data into a human-readable markdown report.

        ANALYTICS:
        {{with.analytics}}

        Include:
        - Executive summary (2-3 sentences)
        - Daily metrics table
        - Key insights
        - Recommendations based on trends
      max_tokens: 200
    artifact:
      path: etl-report.md
      template: |
        # ETL Analytics Report

        Generated by data-etl pipeline

        {{task.output}}
