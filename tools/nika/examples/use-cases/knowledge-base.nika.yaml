# Knowledge Base QA
# Answer a question using context search and source citation.
#
# Usage:
#   QUESTION="How do I configure MCP servers in Nika?" \
#   nika run examples/use-cases/knowledge-base.nika.yaml
#
# Requirements:
#   - OPENAI_API_KEY

schema: nika/workflow@0.12
workflow: knowledge-base
description: "Question -> search context -> answer with source citations"
provider: openai
model: gpt-4.1-mini

tasks:
  # Step 1: Get the question
  - id: question
    exec:
      command: "echo '${QUESTION:-How do I configure MCP servers in a Nika workflow?}'"
      shell: true

  # Step 2: Search for relevant context (simulating a knowledge base search)
  - id: search_context
    exec:
      command: |
        echo 'SOURCE 1 (docs/mcp-config.md):
        MCP servers are defined in the workflow YAML under the mcp: key. Each server needs a command and optional args and env fields. Example: mcp: { novanet: { command: novanet-mcp, env: { NEO4J_URI: bolt://localhost:7687 } } }

        SOURCE 2 (docs/workflow-reference.md):
        The invoke: verb calls MCP tools. Syntax: invoke: { mcp: server_name, tool: tool_name, params: { key: value } }. The server must be defined in the mcp: section.

        SOURCE 3 (examples/mcp-invoke.nika.yaml):
        schema: nika/workflow@0.12. mcp: { perplexity: { command: npx, args: ["-y", "perplexity-mcp"], env: { PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY}" } } }'
      shell: true

  # Step 3: Generate answer with citations
  - id: answer
    depends_on: [question, search_context]
    with:
      q: $question
      context: $search_context
    infer:
      prompt: |
        Answer this question using ONLY the provided context. Cite your sources.

        QUESTION:
        {{with.q}}

        CONTEXT:
        {{with.context}}

        Answer guidelines:
        1. Answer the question directly in the first sentence
        2. Provide step-by-step instructions if applicable
        3. Include a code example from the sources
        4. Cite sources using [Source N] notation
        5. If the context doesn't fully answer the question, say what's missing
        6. End with related topics the user might want to explore
      max_tokens: 200

  # Step 4: Assess answer quality
  - id: quality_check
    depends_on: [answer, question, search_context]
    with:
      answer: $answer
      q: $question
      context: $search_context
    infer:
      prompt: |
        Evaluate the quality of this knowledge base answer.

        QUESTION:
        {{with.q}}

        ANSWER:
        {{with.answer}}

        AVAILABLE CONTEXT:
        {{with.context}}

        Check:
        - Accuracy: Does the answer match the source material?
        - Completeness: Are all aspects of the question addressed?
        - Citations: Are sources properly referenced?
        - Clarity: Is the answer easy to follow?
        - Hallucination: Does it include information not in the sources?

        Return a confidence score (0-100) and any corrections needed.
      max_tokens: 200
    structured:
      schema:
        type: object
        properties:
          confidence_score:
            type: integer
          accuracy:
            type: string
          completeness:
            type: string
          has_hallucination:
            type: boolean
          corrections:
            type: array
            items:
              type: string
        required: [confidence_score, accuracy, has_hallucination]
