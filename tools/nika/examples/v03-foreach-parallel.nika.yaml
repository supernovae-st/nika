# ============================================================================
# v0.3 — for_each: Parallelism Example
# ============================================================================
#
# Demonstrates parallel task execution via for_each modifier.
# Tasks iterate over arrays with configurable concurrency.
#
# Features demonstrated:
# - for_each: array or binding expression
# - as: loop variable name
# - concurrency: max parallel executions
# - fail_fast: stop on first error
#
# Run with: cargo run -- check examples/v05-decompose.nika.yaml
# ============================================================================

schema: "nika/workflow@0.3"
workflow: foreach-demo
description: "Demonstrate for_each: parallel task execution"

tasks:
  # --------------------------------------------------------------------------
  # Task 1: Generate content for multiple locales in parallel
  # --------------------------------------------------------------------------
  - id: generate_locales
    description: "Generate greetings for each locale in parallel"
    for_each:
      - "en-US"
      - "fr-FR"
      - "de-DE"
      - "es-ES"
      - "ja-JP"
    as: locale
    concurrency: 3              # Run up to 3 tasks in parallel
    fail_fast: true             # Stop all if one fails
    infer: |
      Generate a culturally appropriate greeting for locale: {{use.locale}}

      Make it natural and friendly for that culture.

  # --------------------------------------------------------------------------
  # Task 2: Collect all results
  # --------------------------------------------------------------------------
  - id: collect_greetings
    description: "Collect and summarize all generated greetings"
    use:
      greetings: generate_locales
    infer: |
      I have generated greetings for multiple locales:
      {{use.greetings}}

      Create a summary table showing each locale and its greeting.

flows:
  - source: generate_locales
    target: collect_greetings
