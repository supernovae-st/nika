# ============================================================================
# v0.5 — Lazy Bindings Example
# ============================================================================
#
# Demonstrates lazy bindings that defer resolution until first access.
# Useful for optional data with fallbacks and conditional execution.
#
# Features demonstrated:
# - lazy: true for deferred resolution
# - default: fallback values
# - Eager vs lazy binding comparison
#
# Run with: cargo run -- check examples/v05-lazy-bindings.nika.yaml
# ============================================================================

schema: "nika/workflow@0.5"
workflow: lazy-bindings-demo
description: "Demonstrate lazy: binding resolution"

tasks:
  # --------------------------------------------------------------------------
  # Task 1: Setup task that always runs first
  # --------------------------------------------------------------------------
  - id: setup_task
    description: "Setup task providing required data"
    infer: "Generate basic setup configuration as JSON"

  # --------------------------------------------------------------------------
  # Task 2: Optional enhancement task (may provide extra data)
  # --------------------------------------------------------------------------
  - id: optional_task
    description: "Optional enhancement task"
    infer: "Generate optional enhancement data as JSON"

  # --------------------------------------------------------------------------
  # Task 3: Processor with lazy binding to optional data
  # --------------------------------------------------------------------------
  # Lazy bindings allow deferred resolution - if optional_task hasn't
  # completed yet, the default value is used instead of blocking.
  - id: processor
    description: "Process with lazy binding to optional data"
    use:
      # Eager binding (default) - resolved immediately at task start
      required_data: setup_task

      # Lazy binding - resolved on first access, uses default if unavailable
      optional_data:
        path: optional_task
        lazy: true
        default: '{"status": "not_available"}'

    infer: |
      Process the required data: {{use.required_data}}

      Optional context (if available): {{use.optional_data}}

      Generate a summary combining both sources.

flows:
  - source: setup_task
    target: optional_task
  - source: optional_task
    target: processor
