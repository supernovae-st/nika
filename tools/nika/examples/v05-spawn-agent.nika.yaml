# ============================================================================
# v0.5 — spawn_agent Example
# ============================================================================
#
# Demonstrates nested agent spawning with depth protection.
# Parent agents can spawn child agents via the spawn_agent tool.
#
# Features demonstrated:
# - agent: verb with spawn capability
# - depth_limit: for recursion protection
# - spawn_agent internal tool
#
# Run with: cargo run -- check examples/v05-spawn-agent.nika.yaml
# ============================================================================

schema: "nika/workflow@0.5"
workflow: spawn-agent-demo
description: "Demonstrate nested agent spawning with depth protection"

tasks:
  # --------------------------------------------------------------------------
  # Task 1: Orchestrator agent that can spawn child agents
  # --------------------------------------------------------------------------
  - id: orchestrator
    description: "Orchestrator that delegates sub-tasks to child agents"
    agent:
      prompt: |
        You are an orchestrator agent. Your task is to break down complex
        work into smaller sub-tasks and delegate them to child agents.

        Your goal: Generate a complete landing page with:
        1. A catchy headline
        2. A compelling description
        3. A call-to-action

        Use the spawn_agent tool to delegate each sub-task to a
        specialized child agent. Each child agent will focus on
        one aspect of the landing page.

        After all children complete, combine their outputs into
        a final landing page structure.

      # Depth limit prevents infinite recursion
      # depth=0 (orchestrator) can spawn up to depth=3
      depth_limit: 3

  # --------------------------------------------------------------------------
  # Task 2: Simple agent without spawn capability
  # --------------------------------------------------------------------------
  - id: simple_agent
    description: "Simple agent that completes its task directly"
    agent:
      prompt: |
        Review the output from the orchestrator and provide
        quality feedback on the landing page structure.

        This agent does not need to spawn children.

      # depth_limit: 1 means this agent cannot spawn children
      depth_limit: 1

flows:
  - source: orchestrator
    target: simple_agent
