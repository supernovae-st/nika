# ============================================================================
# v0.9 — context: File Loading Example
# ============================================================================
#
# Demonstrates the `context:` field for loading files at workflow start.
# Files are available via `{{context.files.alias}}` bindings.
#
# Features demonstrated:
# - context: field for file loading
# - files: map with alias -> path
# - session: optional session restoration
# - Glob patterns for multiple files
#
# Run with: cargo run -- check examples/v09-context-loading.nika.yaml
# ============================================================================

schema: "nika/workflow@0.12"
workflow: context-loading-demo
description: "Demonstrate context: file loading at workflow start"

# ============================================================================
# Context (v0.9)
# ============================================================================
# Load files at workflow start for use in tasks.
# ============================================================================

context:
  files:
    # Single file - loaded as string or parsed object based on extension
    brand_guide: ./context/brand.md
    # JSON file - automatically parsed as JSON object
    config: ./context/config.json
    # Glob pattern - loaded as array of strings
    examples: ./context/*.md

# ============================================================================
# Tasks
# ============================================================================

tasks:
  - id: use_context
    description: "Use loaded context files in inference"
    infer: |
      Using context files:

      Brand Guide: {{context.files.brand_guide}}

      Generate a short tagline based on the brand guide.

  - id: process_examples
    description: "Process context file array"
    infer: |
      I have loaded these example files: {{context.files.examples}}

      Summarize the common themes.
