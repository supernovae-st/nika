# ============================================================================
# v0.9 — include: DAG Fusion Example
# ============================================================================
#
# Demonstrates the `include:` feature for merging external workflows.
# Tasks from included workflows are merged into the main DAG at parse time.
#
# Features demonstrated:
# - include: field for DAG fusion
# - prefix: for task ID namespacing
# - context: field for file loading
# - Referencing prefixed task outputs
#
# Run with: cargo run -- run examples/v09-include-dag-fusion.nika.yaml
# ============================================================================

schema: "nika/workflow@0.12"
workflow: content-with-seo
description: "Content generation with included SEO tasks"

# ============================================================================
# Include External Workflows (v0.9)
# ============================================================================
# Tasks from included workflows are merged into this DAG.
# Use prefix: to prevent task ID collisions.
# ============================================================================

include:
  - path: ./lib/seo-tasks.nika.yaml
    prefix: seo_

# ============================================================================
# Context (v0.9)
# ============================================================================
# Load files at workflow start for use in tasks.
# ============================================================================

context:
  files:
    brand_guide: ./context/brand.md
    style_guide: ./context/style-guide.md

# ============================================================================
# Tasks
# ============================================================================

tasks:
  # --------------------------------------------------------------------------
  # Task 1: Generate Content
  # --------------------------------------------------------------------------
  - id: generate_content
    description: "Generate blog post content"
    infer: |
      Write a blog post about QR Code AI technology.

      Brand guidelines:
      {{context.files.brand_guide}}

      The content should be informative, engaging, and
      optimized for search engines.

  # --------------------------------------------------------------------------
  # Task 2: Prepare content for SEO analysis
  # --------------------------------------------------------------------------
  # This task bridges to the included SEO tasks by providing the 'content' binding
  # NOTE: Using infer: with output schema instead of exec: because:
  # 1. LLM content may contain quotes that break shell parsing (shell: false default)
  # 2. output.schema enforces structured JSON response
  - id: prepare_for_seo
    depends_on: [generate_content]
    description: "Prepare content for SEO analysis"
    infer:
      prompt: |
        Analyze this content and extract SEO keywords and key phrases.

        Content:
        {{with.content}}
      response_format: json
    with:
      content: $generate_content
    output:
      format: json
      max_retries: 3
      schema:
        type: object
        properties:
          keywords:
            type: array
            items:
              type: string
            description: "Single-word SEO keywords"
          key_phrases:
            type: array
            items:
              type: string
            description: "Multi-word key phrases for SEO"
        required:
          - keywords
          - key_phrases

  # --------------------------------------------------------------------------
  # Task 3: Final Assembly
  # --------------------------------------------------------------------------
  # References prefixed task outputs from included workflow
  - id: assemble_page
    depends_on: [generate_content, seo_generate_title, seo_generate_meta]
    description: "Assemble final page with SEO elements"
    with:
      seo_title: $seo_generate_title
      seo_meta: $seo_generate_meta
      content: $generate_content
    infer: |
      Assemble a complete HTML page with:

      Title: {{with.seo_title}}
      Meta Description: {{with.seo_meta}}

      Content:
      {{with.content}}

      Return the complete HTML document.

# Dependencies are now expressed via depends_on: on each task (see above).
