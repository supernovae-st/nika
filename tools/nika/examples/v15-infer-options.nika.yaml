# Test: Infer LLM Control Options (v0.15.0)
# Tests temperature, system prompt, and max_tokens parameters
# Run with: ANTHROPIC_API_KEY=... nika examples/v15-infer-options.nika.yaml

schema: "nika/workflow@0.12"
provider: claude

tasks:
  # Test 1: High temperature for creative output
  - id: creative_tagline
    infer:
      prompt: "Generate a creative and unconventional tagline for a QR code app"
      temperature: 0.9
      max_tokens: 50
    output:
      format: text

  # Test 2: Low temperature for precise output
  - id: precise_description
    infer:
      prompt: "Write a technical description of QR code encoding in exactly 2 sentences"
      temperature: 0.1
      max_tokens: 100
    output:
      format: text

  # Test 3: System prompt for persona
  - id: marketing_copy
    with:
      tagline: $creative_tagline
    infer:
      prompt: "Expand this tagline into a marketing paragraph: {{with.tagline}}"
      system: "You are an expert marketing copywriter specializing in tech products. Write in an engaging, professional tone."
      temperature: 0.7
      max_tokens: 200
    output:
      format: text

  # Test 4: Default values (no options specified)
  - id: default_infer
    infer: "What is a QR code? Answer in one sentence."
    output:
      format: text

  # Test 5: All options combined
  - id: full_options
    infer:
      prompt: "List 3 innovative uses for QR codes in healthcare"
      system: "You are a healthcare technology consultant. Be specific and practical."
      temperature: 0.5
      max_tokens: 300
    output:
      format: text

  - id: comparison
    with:
      creative: $creative_tagline
      precise: $precise_description
      marketing: $marketing_copy
      default: $default_infer
      full: $full_options
    exec: "echo 'All infer option tests completed. Compare outputs above.'"
