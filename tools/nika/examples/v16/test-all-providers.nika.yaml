# Test: All 6 LLM providers
# Tests: Claude, OpenAI, Mistral, Groq, DeepSeek, Gemini
# NOTE: Ollama removed in v0.27 - use provider: native instead
# NOTE: Requires respective API keys to be set
schema: nika/workflow@0.12
workflow: test-all-providers

