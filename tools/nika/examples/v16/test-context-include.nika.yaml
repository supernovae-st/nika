# Test: context: - File loading
# Tests: context.files loading markdown and json
schema: nika/workflow@0.12
workflow: test-context-loading

# Context file loading (v0.14.3)
# Note: Paths are relative to workflow file location
context:
  files:
    readme: ../context/brand.md

tasks:
  # Test 1: Use context file content
  - id: read_readme
    infer: |
      What is the brand name mentioned in this file? Just say the name.
      {{context.files.readme}}

  # Test 2: Chain context to output
  - id: summarize
    with:
      version: read_readme
    infer: |
      Confirm the version found: {{with.version}}

flows:
  - source: read_readme
    target: summarize
