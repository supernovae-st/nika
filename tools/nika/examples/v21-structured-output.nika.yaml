# Test: Structured Output with 4-Layer Defense (v0.21)
# Tests JSON Schema validation with automatic retry and repair
# Run with: ANTHROPIC_API_KEY=... nika examples/v21-structured-output.nika.yaml

schema: "nika/workflow@0.10"
workflow: test-structured-output
description: Test 4-layer structured output defense system (v0.21)
provider: claude

tasks:
  # Test 1: Basic structured output with inline schema
  - id: generate_person
    infer:
      prompt: |
        Generate a person profile with:
        - A creative name
        - Age between 25-35
        - A tech-related job
    structured:
      schema:
        type: object
        properties:
          name:
            type: string
          age:
            type: integer
            minimum: 25
            maximum: 35
          job:
            type: string
        required:
          - name
          - age
          - job

  # Test 2: Complex nested schema with array constraints
  - id: generate_keywords
    infer:
      prompt: |
        Generate 5 SEO keywords for "QR code generator" with:
        - The keyword term (2+ characters)
        - Monthly search volume estimate (100-50000)
        - Difficulty score (0-100)
    structured:
      schema:
        type: object
        properties:
          keywords:
            type: array
            minItems: 5
            maxItems: 5
            items:
              type: object
              properties:
                term:
                  type: string
                  minLength: 2
                volume:
                  type: integer
                  minimum: 100
                  maximum: 50000
                difficulty:
                  type: integer
                  minimum: 0
                  maximum: 100
              required:
                - term
                - volume
                - difficulty
        required:
          - keywords
      max_retries: 3
      enable_repair: true

  # Test 3: Structured output with all layers configured
  - id: generate_product
    infer:
      prompt: |
        Generate a product description for a premium QR code app:
        - Product name (3-30 characters)
        - Short tagline (max 50 characters)
        - Three key features (each feature has title and description)
        - Price in USD (9.99 to 99.99)
    structured:
      schema:
        type: object
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 30
          tagline:
            type: string
            maxLength: 50
          features:
            type: array
            minItems: 3
            maxItems: 3
            items:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
              required:
                - title
                - description
          price:
            type: number
            minimum: 9.99
            maximum: 99.99
        required:
          - name
          - tagline
          - features
          - price
      enable_extractor: true
      enable_tool_use: true
      enable_retry: true
      enable_repair: true
      max_retries: 2

  # Test 4: Summary combining results
  - id: summary
    use:
      person: generate_person
      keywords: generate_keywords
      product: generate_product
    infer:
      prompt: |
        Summarize the structured outputs:

        Person: {{use.person}}

        Keywords: {{use.keywords}}

        Product: {{use.product}}

        Write a brief analysis of each output's quality.
      temperature: 0.3

flows:
  - source: generate_person
    target: summary
  - source: generate_keywords
    target: summary
  - source: generate_product
    target: summary
