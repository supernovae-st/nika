# This workflow should work WITHOUT explicit depends_on
# Before fix: Error NIKA-081 "use.data.from='step1' is not upstream"
# After fix: Works correctly with implicit dependency

schema: nika/workflow@0.9
workflow: bug003-fix-validation
provider: openai

tasks:
