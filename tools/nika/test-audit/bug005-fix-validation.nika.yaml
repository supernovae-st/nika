# Test: BUG-005 Fix Validation - for_each with binding expression
# Before fix: NIKA-041 Template error - Alias(es) not resolved
# After fix: Loop variable properly injected

schema: nika/workflow@0.9
workflow: bug005-fix-validation
provider: openai

tasks:
  - id: generate_items
    infer: 'Return EXACTLY this JSON array (nothing else): ["red", "green", "blue"]'

  - id: process_items
    with:
      items: generate_items
    for_each: $items
    as: color
    infer: "Color received: {{with.color}}"
