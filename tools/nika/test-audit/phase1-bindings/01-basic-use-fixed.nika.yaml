# Test: Basic use: block binding WITH explicit depends_on
# This is to verify if depends_on fixes the issue

schema: nika/workflow@0.9
workflow: test-basic-use-fixed

tasks:
  - id: produce_data
    infer: |
      Return EXACTLY this JSON (no explanation, just the JSON):
      {"name": "TestProduct", "price": 99}

  - id: consume_data
    depends_on: [produce_data]
    use:
      data: produce_data
    infer: |
      You received this data: {{use.data}}

      Extract the name and price, then return EXACTLY:
      {"received_name": "<name>", "received_price": <price>}

      No explanation, just the JSON.
