# Test: $task shorthand syntax (v0.21)
# Expected: $task should resolve identically to task

schema: nika/workflow@0.9
workflow: test-shorthand-syntax

tasks:
  - id: step1
    infer: |
      Return EXACTLY: "Hello from step1"
      No quotes around the output, no explanation.

  - id: step2_explicit
    with:
      msg: step1
    infer: |
      Echo back: {{with.msg}}
      Return the exact same text, nothing else.

  - id: step2_shorthand
    with:
      msg: $step1
    infer: |
      Echo back: {{with.msg}}
      Return the exact same text, nothing else.

  - id: verify
    with:
      explicit: step2_explicit
      shorthand: step2_shorthand
    infer: |
      Compare these two values:
      - Explicit: {{with.explicit}}
      - Shorthand: {{with.shorthand}}

      Return EXACTLY "PASS" if they are identical, "FAIL" if different.
