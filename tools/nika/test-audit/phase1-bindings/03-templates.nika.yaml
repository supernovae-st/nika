# Test: {{with.alias}} template expansion in various positions
# Expected: Templates expand in prompts, params, and nested structures

schema: nika/workflow@0.9
workflow: test-templates

tasks:
  - id: source
    infer: |
      Return EXACTLY: SuperNovae
      Just the word, nothing else.

  - id: template_in_prompt
    with:
      company: source
    infer: |
      The company name is: {{with.company}}

      Confirm by returning: "Company: <name>"

  - id: template_multiple
    with:
      company: source
    infer: |
      First mention: {{with.company}}
      Second mention: {{with.company}}
      Third mention: {{with.company}}

      How many times does "{{with.company}}" appear in your input? Return just the number.

  - id: verify_count
    with:
      count: template_multiple
    infer: |
      The count was: {{with.count}}

      If the count is 3, return "PASS". Otherwise return "FAIL: <count>".
