# Test: Array indexing with bracket notation (v0.22 feature)
# Expected: $task.items[0] should work

schema: nika/workflow@0.9
workflow: test-array-indexing

tasks:
  - id: produce_array
    infer: |
      Return EXACTLY this JSON array (no explanation):
      ["apple", "banana", "cherry", "date"]

  - id: access_first
    use:
      items: produce_array
    infer: |
      Array: {{use.items}}

      Return ONLY the first element of the array.

  - id: access_third
    use:
      items: produce_array
    infer: |
      Array: {{use.items}}

      Return ONLY the third element of the array (index 2).

  - id: verify
    use:
      first: access_first
      third: access_third
    infer: |
      First element: {{use.first}}
      Third element: {{use.third}}

      If first is "apple" and third is "cherry", return "PASS".
      Otherwise return "FAIL: first={{use.first}}, third={{use.third}}".
