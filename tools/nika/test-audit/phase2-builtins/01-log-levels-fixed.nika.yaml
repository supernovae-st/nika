# Test: nika:log builtin tool with different levels
# Expected: Log events appear in trace with correct levels

schema: nika/workflow@0.9
workflow: test-log-levels
provider: openai

mcp:
  dummy:
    command: "echo"
    args: ["not used"]

tasks:
  - id: log_info
    invoke:
      mcp: dummy
      tool: nika:log
      params:
        level: info
        message: "This is an INFO message"

  - id: log_warn
    depends_on: [log_info]
    invoke:
      mcp: dummy
      tool: nika:log
      params:
        level: warn
        message: "This is a WARN message"

  - id: log_error
    depends_on: [log_warn]
    invoke:
      mcp: dummy
      tool: nika:log
      params:
        level: error
        message: "This is an ERROR message"

  - id: log_debug
    depends_on: [log_error]
    invoke:
      mcp: dummy
      tool: nika:log
      params:
        level: debug
        message: "This is a DEBUG message"

  - id: verify
    depends_on: [log_debug]
    infer: |
      All log levels tested: info, warn, error, debug.
      Return "PASS" to confirm completion.
