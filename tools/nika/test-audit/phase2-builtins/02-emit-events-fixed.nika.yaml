# Test: nika:emit custom events
# Expected: Custom events appear in trace with payload

schema: nika/workflow@0.9
workflow: test-emit-events
provider: openai

mcp:
  dummy:
    command: "echo"
    args: ["not used"]

tasks:
  - id: emit_simple
    invoke:
      mcp: dummy
      tool: nika:emit
      params:
        name: "simple_event"
        payload:
          message: "Hello from emit"

  - id: emit_complex
    depends_on: [emit_simple]
    invoke:
      mcp: dummy
      tool: nika:emit
      params:
        name: "complex_event"
        payload:
          user:
            name: "Test User"
            id: 12345
          items:
            - "item1"
            - "item2"

  - id: verify
    depends_on: [emit_complex]
    infer: |
      Two custom events emitted: simple_event, complex_event.
      Return "PASS" to confirm.
