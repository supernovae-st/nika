# Test: nika:assert condition validation
# Expected: Assert passes for true conditions, fails for false

schema: nika/workflow@0.9
workflow: test-assert-conditions

mcp:
  servers:
    dummy:
      command: "echo"
      args: ["not used"]

tasks:
  - id: assert_true
    invoke:
      mcp: dummy
      tool: nika:assert
      params:
        condition: true
        message: "This should pass"

  - id: assert_expression
    depends_on: [assert_true]
    invoke:
      mcp: dummy
      tool: nika:assert
      params:
        condition: true
        message: "Expression evaluation test"

  - id: verify
    depends_on: [assert_expression]
    infer: |
      All assertions passed.
      Return "PASS" to confirm.
