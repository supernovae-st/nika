# Test: nika:assert condition validation
# Expected: Assert passes for true conditions

schema: nika/workflow@0.9
workflow: test-assert-conditions
provider: openai

mcp:
  dummy:
    command: "echo"
    args: ["not used"]

tasks:
  - id: assert_true
    invoke:
      mcp: dummy
      tool: nika:assert
      params:
        condition: true
        message: "True condition should pass"

  - id: verify
    depends_on: [assert_true]
    infer: |
      Assertion passed.
      Return "PASS" to confirm.
