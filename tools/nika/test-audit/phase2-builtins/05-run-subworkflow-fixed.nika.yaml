# Test: nika:run to execute sub-workflow
# Expected: Sub-workflow runs and result is accessible

schema: nika/workflow@0.9
workflow: test-run-subworkflow
provider: openai

mcp:
  dummy:
    command: "echo"
    args: ["not used"]

tasks:
  - id: run_sub
    invoke:
      mcp: dummy
      tool: nika:run
      params:
        workflow: "./test-audit/phase2-builtins/sub-workflow-fixed.nika.yaml"

  - id: verify
    depends_on: [run_sub]
    with:
      sub_result: run_sub
    infer: |
      Sub-workflow result: {{with.sub_result}}

      If result contains "SUB_RESULT_OK", return "PASS".
      Otherwise return "FAIL: <result>".
