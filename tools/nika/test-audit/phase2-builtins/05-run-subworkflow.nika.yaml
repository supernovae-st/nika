# Test: nika:run to execute sub-workflow
# Expected: Sub-workflow runs and result is accessible

schema: nika/workflow@0.9
workflow: test-run-subworkflow

mcp:
  servers:
    dummy:
      command: "echo"
      args: ["not used"]

tasks:
  - id: run_sub
    invoke:
      mcp: dummy
      tool: nika:run
      params:
        workflow: "./test-audit/phase2-builtins/sub-workflow.nika.yaml"

  - id: verify
    use:
      sub_result: run_sub
    infer: |
      Sub-workflow result: {{use.sub_result}}

      If result contains "SUB_RESULT_OK", return "PASS".
      Otherwise return "FAIL: <result>".
