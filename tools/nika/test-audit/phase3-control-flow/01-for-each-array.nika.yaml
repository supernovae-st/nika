# Test: for_each with static array
# Expected: Task runs once per array element

schema: nika/workflow@0.9
workflow: test-for-each-array
provider: openai

tasks:
  - id: process_items
    for_each: ["apple", "banana", "cherry"]
    as: fruit
    infer: |
      Process fruit: {{use.fruit}}
      Return: "Processed <fruit>"

  - id: verify
    depends_on: [process_items]
    use:
      results: process_items
    infer: |
      Results: {{use.results}}

      If all 3 fruits were processed, return "PASS".
      Otherwise return "FAIL".
