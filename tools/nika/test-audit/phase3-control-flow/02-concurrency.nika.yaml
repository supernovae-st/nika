# Test: for_each with concurrency
# Expected: Multiple items process in parallel

schema: nika/workflow@0.9
workflow: test-concurrency
provider: openai

mcp:
  dummy:
    command: "echo"
    args: ["not used"]

tasks:
  - id: parallel_sleep
    for_each: ["item1", "item2", "item3", "item4"]
    as: item
    concurrency: 4
    invoke:
      mcp: dummy
      tool: nika:sleep
      params:
        duration: "500ms"

  - id: verify
    depends_on: [parallel_sleep]
    infer: |
      All 4 items should have run in parallel (total ~0.5s, not ~2s).
      Return "PASS" to confirm.
