# Test: depends_on explicit dependencies
# Expected: Tasks execute in correct order

schema: nika/workflow@0.9
workflow: test-depends-on
provider: openai

tasks:
  - id: step_a
    infer: "Return: A"

  - id: step_b
    infer: "Return: B"

  - id: step_c
    depends_on: [step_a, step_b]
    use:
      a: step_a
      b: step_b
    infer: |
      A = {{use.a}}
      B = {{use.b}}
      Concatenate and return: "<A><B>"

  - id: verify
    depends_on: [step_c]
    use:
      result: step_c
    infer: |
      Result: {{use.result}}
      If result is "AB", return "PASS". Otherwise "FAIL".
