# Test: Basic artifact writing
# Expected: File is created with task output

schema: nika/workflow@0.9
workflow: test-basic-artifact
provider: openai

artifacts:
  dir: ./test-audit/artifacts

tasks:
  - id: generate_content
    infer: |
      Return EXACTLY: "Hello from artifact test"
    artifact:
      path: "basic-test-{{task_id}}.txt"

  - id: verify
    depends_on: [generate_content]
    infer: |
      Artifact should be written.
      Return "PASS" to confirm task completed.
