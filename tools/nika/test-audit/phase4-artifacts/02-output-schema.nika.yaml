# Test: output_schema JSON validation
# Expected: Output is validated against schema, retried if invalid

schema: nika/workflow@0.9
workflow: test-output-schema
provider: openai

tasks:
  - id: structured_output
    infer: |
      Generate a product JSON with these fields:
      - name: string
      - price: number
      - inStock: boolean
    output_schema:
      type: object
      required: [name, price, inStock]
      properties:
        name:
          type: string
        price:
          type: number
        inStock:
          type: boolean
      additionalProperties: false

  - id: verify
    depends_on: [structured_output]
    with:
      product: structured_output
    infer: |
      Product: {{with.product}}

      If it's valid JSON with name, price, and inStock fields, return "PASS".
      Otherwise return "FAIL".
