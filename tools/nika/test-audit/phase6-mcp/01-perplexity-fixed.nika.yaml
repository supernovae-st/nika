# Test: Real MCP server integration (Perplexity)
# Expected: MCP tool call works with real API

schema: nika/workflow@0.9
workflow: test-perplexity-mcp
provider: openai

mcp:
  perplexity:
    command: "npx"
    args: ["-y", "@perplexity-ai/mcp-server"]
    env:
      PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY}"

tasks:
  - id: search
    invoke:
      mcp: perplexity
      tool: perplexity_search
      params:
        query: "What is Rust programming language?"

  - id: verify
    depends_on: [search]
    use:
      result: search
    infer: |
      Search result: {{use.result}}

      If the result contains information about Rust programming, return "PASS".
      Otherwise return "FAIL".
