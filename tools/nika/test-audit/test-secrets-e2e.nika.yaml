schema: nika/workflow@0.9
workflow: test-secrets-e2e
description: End-to-end test of spn daemon secret injection
provider: openai

tasks:
  - id: test_infer
    infer:
      prompt: "Say 'Secrets working!' in exactly 2 words"
      max_tokens: 10

  - id: verify_result
    with:
      response: test_infer
    exec:
      command: "echo 'E2E Test Result: {{with.response}}'"
      shell: true

flows:
  - source: test_infer
    target: verify_result
