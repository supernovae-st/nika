schema: "nika/workflow@0.5"

mcp:
  dummy:
    command: "echo"
    args: ["not used"]

tasks:
  - id: test_sleep
    invoke:
      mcp: dummy
      tool: nika:sleep
      params:
        duration: "100ms"

  - id: test_log
    with:
      sleep_result: test_sleep
    invoke:
      mcp: dummy
      tool: nika:log
      params:
        level: info
        message: "Sleep completed successfully"

flows:
  - source: test_sleep
    target: test_log
