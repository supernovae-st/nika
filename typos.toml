# typos-cli configuration for nika-diamond
# https://github.com/crate-ci/typos

[default]
# Don't check binary or build artifacts
extend-ignore-identifiers-re = [
  # Hex strings (commit SHAs, hashes)
  "^[0-9a-f]{7,40}$",
]

[default.extend-words]
# Project-specific terms that look like typos but aren't
Nika       = "Nika"
nika       = "nika"
diamond    = "diamond"   # part of branch name; typos may flag `dimond`
# Rust idioms
impl       = "impl"
fn         = "fn"

[files]
extend-exclude = [
  "target/",
  "**/*.lock",
  "**/*.snap",
  "**/*.png",
  "**/*.jpg",
  "**/*.svg",
  # Snapshot tests — controlled by the test author
  "**/snapshots/",
  # Legacy excluded crates
  "crates/nika-blob",
  "crates/nika-builtin",
  "crates/nika-cli",
  "crates/nika-clock",
  "crates/nika-core",
  "crates/nika-daemon",
  "crates/nika-display",
  "crates/nika-engine",
  "crates/nika-event",
  "crates/nika-exec-runner",
  "crates/nika-extract",
  "crates/nika-fs",
  "crates/nika-http",
  "crates/nika-init",
  "crates/nika-lsp",
  "crates/nika-lsp-core",
  "crates/nika-macros",
  "crates/nika-mcp",
  "crates/nika-media",
  "crates/nika-policy",
  "crates/nika-sdk",
  "crates/nika-security",
  "crates/nika-serve",
  "crates/nika-storage",
  "crates/nika-vault",
  "crates/nika-verb-exec",
  "crates/nika-verb-fetch",
  "crates/nika-verb-infer",
  "crates/nika-verb-invoke",
  "crates/nika",
]
