# typos-cli configuration for nika-diamond
# https://github.com/crate-ci/typos

[default]
# Don't check binary or build artifacts
extend-ignore-identifiers-re = [
  # Hex strings (commit SHAs, hashes)
  "^[0-9a-f]{7,40}$",
]
# Verbatim French citations. The studio commits in French, so any doc that
# QUOTES a commit subject carries French prose inside English text. The
# guillemets are this repo's verbatim marker — nothing else uses them — so
# ignoring what sits between them is surgical.
#
# Deliberately NOT `extend-words`: the words these citations trip on are
# `enveloppe` and `identite`, plausible English typos of `envelope` and
# `identity`, and allowlisting them would blind the gate across 57 crates
# of public code — the exact reasoning the two file exclusions below give.
# Deliberately NOT a file exclusion either: an ADR is normative public
# prose, and a real typo in its ENGLISH half must still be caught.
# The did-you-mean fixture in nika-types (`suggest.rs`): a deliberate
# misspelling the suggester must correct, quoted as a string literal. Newer
# typos dictionaries flag it (the crate-ci/typos bump of 2026-08-31); ignoring
# the QUOTED token keeps the fixture and keeps the gate armed everywhere else.
extend-ignore-re = ["« [^»]* »", "\"highlihgts\""]

[default.extend-words]
# Speaches is a real project (speaches.ai · OpenAI-compat speech server), not a typo of "Speeches".
Speaches = "Speaches"
# Project-specific terms that look like typos but aren't
Nika       = "Nika"
nika       = "nika"
diamond    = "diamond"   # part of branch name; typos may flag `dimond`
# Rust idioms
impl       = "impl"
fn         = "fn"
# Researcher / author names in academic citations (docs reference tables)
Wil        = "Wil"       # Wil M. P. van der Aalst (process-mining researcher)
Ba         = "Ba"        # Jinsheng Ba (paper author)
Thm        = "Thm"       # standard math citation shorthand (« Thm 3 » · resource-algebra plan)
Comput     = "Comput"    # journal-name abbreviation (« J. Comput. » · citation tables)
# Code identifiers in helper scripts (not prose)
lits       = "lits"      # `strip_str_lits` — string-literal stripping helper
criticals  = "criticals" # shell variable name in an audit script
# Typo-detection feature vocabulary — nika-schema/{check,suggest,parser} carry
# these misspellings ON PURPOSE as test fixtures + examples (the engine detects
# and suggests fixes for them). "Fixing" them would break the feature's tests.
raed       = "raed"
objet      = "objet"
sumary     = "sumary"
sumamry    = "sumamry"
wrte       = "wrte"
digets     = "digets"   # full-loop tape fixture (broken-release-notes · the did-you-mean rung)
temperture = "temperture"
nmae       = "nmae"
strng      = "strng"
frist      = "frist"
titel      = "titel"
requierd   = "requierd"
requrie    = "requrie"    # the NIKA-1711 typo-refusal fixture (#889 · the sandbox-policy tests ASSERT the misspelled knob refuses — "fixing" it breaks them)
filesytem  = "filesytem"
BUIL       = "BUIL"
markdwon   = "markdwon"  # extract-mode typo rung fixture (nika-types suggest/extract tests)
buidl      = "buidl"     # dep/ref rename fixture (rename_repair docs + --fix convergence tests)
promt      = "promt"     # field rename fixture (--fix docs + CHANGELOG cite the healed typo)
childs     = "childs"    # the v0.107.0 CHANGELOG cites the healed typo (childs → child · #759)
topik      = "topik"     # vars-ref rename fixture (--fix convergence test)
celing     = "celing"    # the `nika.yaml` unknown-key fixture — `ceiling` misspelled ON PURPOSE, and the test ASSERTS the refusal NAMES it (nika-vocab project tests · verbs/run/ceiling.rs)
flor       = "flor"      # its twin one level down — `registry.flor` must refuse as an unknown key
# French (the studio writes franglais — these are real French words, not typos)
raison     = "raison"
raisons    = "raisons"
projet     = "projet"
mesure     = "mesure"
correspondant = "correspondant"
# 2026-08-14 · the session crates (nika-cadence · nika-tui-core) comment in
# French. Only words NO English reader could reach for by mistake land here.
# The ones that ARE plausible English typos — `sur`/`reste`/`valide`/`formes`/
# `seconde` — were REWRITTEN in the French instead (`demeure` · `licite` ·
# `écritures` · `2e`), so those five stay dangerous across all 64 crates.
# Allowlisting them would have been the cheap fix and the wrong one.
Syntaxe    = "Syntaxe"
syntaxe    = "syntaxe"
registre   = "registre"
contribue  = "contribue"
verifie    = "verifie"
enveloppe  = "enveloppe"
comparaison = "comparaison"
toi        = "toi"
accepte    = "accepte"   # « on ne choisit pas, on accepte » — a quoted French line; rewriting it would bend the quote
# Code identifiers / domain shorthand
CLEN       = "CLEN"      # RFC 1951 HCLEN code-length alphabet (nika-fx inflate)
clen       = "clen"      # its lowercase binding in the dynamic-Huffman header parse
ser        = "ser"       # serde serialize shorthand (`ser`/`de`)
numer      = "numer"     # numerator (BM25 scorer: numer/denom)
nd         = "nd"        # binding in `Ok(nd) => …`
anc        = "anc"       # `anc_count` (graph ancestor count)
fo         = "fo"        # glob test pattern `fo?.rs`
mis        = "mis"       # `mis-coding` (hyphenated prefix)
magent     = "magent"    # ANSI SGR `\x1b[1;35m` + `agent` concatenation
failer     = "failer"    # test mock name (a thing that fails)
observ     = "observ"    # `unstable-observ` Cargo feature name
# Proper nouns / library names
Paeth      = "Paeth"     # Alan W. Paeth — the PNG filter type 4 bears his name (spec term)
paeth      = "paeth"     # lowercase form in fn names + comments (nika-fx PNG codec)
ratatui    = "ratatui"   # the Ratatui TUI library
Hashi      = "Hashi"     # HashiCorp (proper noun)
OLY        = "OLY"       # OLY- prefix in a negative test (wrong-prefix rejection)
YELLO      = "YELLO"     # part of YELLOW in a hygiene-color comment
# Valid alternative spelling
unparseable = "unparseable"
# File-format plural in vendored corpus prose (« two PNGs » · README-jobs) —
# the tokenizer splits the acronym and reads `PN` as a typo of `ON`.
PN         = "PN"
# Test-fixture tokens the un-excluded crates carry ON PURPOSE (the 2026-07-31
# de-exclusion: 15 of the 30 « legacy excluded » crates no longer existed and
# the 13 live ones held ZERO real typos — only these deliberate fixtures).
empted     = "empted"    # `preempted` split by the tokenizer (verdict-coverage oracle)
mesage     = "mesage"    # did-you-mean fixture — the test ASSERTS the suggestion (bin_smoke)
hel        = "hel"       # half-typed completion fixtures (nika-lsp analysis)
som        = "som"       # half-typed completion fixtures (nika-lsp analysis)
Caf        = "Caf"       # « Café » ISO-8859-1 encoding fixtures, é split off (net · image)
caf        = "caf"       # lowercase twin
abd        = "abd"       # negative glob-match fixture (`abc` vs `abd` · file.rs)
# in-toto attestation format — the SLSA generator's release asset is literally
# named `multiple.intoto.jsonl` (RELEASING.md + release notes teach the
# slsa-verifier command against it).
intoto     = "intoto"

[files]
extend-exclude = [
  "target/",
  # French-language session checkpoint (the studio writes franglais — an
  # English spell-checker judging French prose is noise, not a gate).
  # Excluded rather than allowlisted: the words it trips on — `sur`,
  # `clos`, `classe`, `restauration` — are plausible English typos of
  # `sure`, `close`, `class` and `restoration`, so extend-words would
  # blind the gate across 57 crates of public code. The franglais list
  # above stays for words no English reader could mistake (`raison`).
  "docs/plans/2026-07-30-checkpoint-next-session.md",
  # Catalog data carrying a French editorial header (the bulk-stamp block
  # explaining what `pricing` is and what the gate will require). Same call
  # as the line above, for the same reason: the words it trips on (`sur`,
  # `amont`, `varient`) are plausible English typos of `sure`, `among`,
  # `variant`, so allowlisting them would blind the gate across 57 crates
  # of public code. The DATA rows below the header stay English.
  "crates/nika-catalog/data/mcp-servers.toml",
  # cargo public-api baselines — generated symbol dumps, not prose. Real
  # source typos are still caught in the .rs files they derive from.
  "**/public-api.txt",
  # Fuzzing corpus — intentionally-malformed inputs for the fuzzer.
  "fuzz/corpus/",
  "**/*.lock",
  "**/*.snap",
  "**/*.png",
  "**/*.jpg",
  "**/*.svg",
  # Snapshot tests — controlled by the test author
  "**/snapshots/",
  # The session crates' crate-specs, written in French (the studio writes
  # franglais). Same call as the two lines above, for the same measured
  # reason: 35 of their 77 hits are `sur` and `reste`, which are plausible
  # English typos of `sure` and `rest` — allowlisting those two words would
  # blind the gate across 64 crates of public code. The FILE goes, the
  # words stay dangerous everywhere else.
  "docs/crate-specs/nika-tui-core.md",
  "docs/crate-specs/nika-tui.md",
  "docs/crate-specs/nika-cadence.md",
  # Session-law test fixtures — recorded engine output (journals, graph
  # projections), not prose. The `journal-casse.ndjson` one is a
  # deliberately TORN journal: its bytes are the test. Same class as
  # `fuzz/corpus/` above.
  "crates/nika-tui-core/tests/fixtures/",
]
