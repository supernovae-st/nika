# wiring.yaml · DECLARED capabilities of this engine
# A wiring gate reads this file. in_release_build and status are
# DERIVED by the gate. Never type them.

schema: 1

# A cargo feature that governs user-visible behaviour must appear on a
# release build line, or live here with a reason and a date.

tombstones:
  - id: nika-cli:metal
    reason: >-
      candle 0.10 quantized rms-norm Metal kernel dies at first token.
      release.yml keeps it off on purpose. Revisit when candle ships a
      working kernel.
    date: 2026-08-23

# An excluded crate that is a deliberate quarantine (own lockfile, own
# feature graph) is not an orphan IF a named CI job is its judge.
# NEVER lift the nika-acp exclude (nika-harness/src/lib.rs · spec §2bis).

quarantine:
  - id: crates/nika-acp
    reason: >-
      Official ACP SDK requires serde_json/preserve_order. Unification
      would flip byte-attested goldens. The SDK judges nika-harness
      over a process boundary from this workspace.
    date: 2026-08-23
    proven_by: acp-quarantine

capabilities:
  - id: lsp.parent-watchdog
    kind: cli-flag
    declared_at: crates/nika-cli/src/main.rs:331
    shipped_when: "default"
    reachable_by: "nika lsp --stdio --clientProcessId=<pid>"
    proven_by: rust
    issue: 1181
  - id: display.gate-provenance
    kind: operator-teaching
    declared_at: crates/nika-display/src/render.rs:416
    shipped_when: "default"
    reachable_by: "a task blocked by a settled upstream binding"
    proven_by: rust
    issue: 1198
  - id: gate.issue-proof.judges-every-close
    kind: ci-gate
    declared_at: .github/workflows/issue-proof.yml:48
    shipped_when: "default"
    reachable_by: "closing any issue as completed"
    # The ledger, not the body. #1200's body is ABOUT this marker, so it
    # carries three line-initial `proven_by:` occurrences — one real, two
    # left by markdown wrapping a code span. The reader cannot tell which is
    # the declaration and refuses rather than guess, which is the right
    # refusal and an unclosable issue. An authored ledger row is what the
    # refusal itself asks for.
    proven_by: proof
    issue: 1200
