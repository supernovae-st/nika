# The ONE DOOR — the catalog maintenance ceremony as a single command.
#
# WHY THIS FILE EXISTS. The wave-15 ruling (§3bis · ONE DOOR): catalog
# ingestion is ONE nika-first pipeline, one leg per pinned source, one
# refresh ceremony — maintenance scripts become legs of this door, never
# siblings of it. Before this file there were two free-standing tools
# (refresh-pricing.sh · pricing-differential.py) and nothing forced them
# to run together; a refresh could land without its judge.
#
# WHAT THE DOOR ENFORCES, BY SHAPE. The legs are chained: the refresh
# rewrites the snapshot (models.dev · merge step re-attaches research
# facts and names orphans) → the differential holds the fresh snapshot
# against LiteLLM (an unexplained skew exits 4, the leg fails, THE DOOR
# REFUSES — a refresh that creates an unexplained disagreement cannot
# land silently) → the codegen validators prove the fresh TOML end to
# end (custody chains · closed sets · dup keys). Only a run where all
# three legs agree leaves the tree in a committable state.
#
# WHY exec LEGS AND NOT nika: TOOLS. The refresh's write and the
# differential's fetch live inside audited scripts with their own guards
# (shrink guard · orphan report · directional ledger); the door's job is
# ORDER and REFUSAL, not re-implementation. The boundary is honest about
# that: `permits.exec` names the three interpreters and nothing else.
#
#   nika check workflows/catalog/ingest-catalog.nika.yaml
#   nika run workflows/catalog/ingest-catalog.nika.yaml   # the ceremony ·
#     network + tree mutation — run it from a clean tree, review the
#     diff it leaves, commit with the snapshot date in the message
#
# WHAT IT DOES NOT DO. It does not commit. The diff review and the
# commit stay the operator's move — the door leaves a judged tree, the
# human leaves history.
# refresh the pinned snapshot · judge it against LiteLLM · prove it with the validators
nika: catalog-ingest

run: { clock: system }

const:
  pricing_script: "scripts/refresh-pricing.sh"
  differential_script: "scripts/pricing-differential.py"

permits:
  exec: ["bash", "python3", "cargo"]

tasks:
  # ── leg 1 · the refresh (models.dev → TOML · the merge step) ────────
  refresh:
    timeout: "5m"
    exec:
      command: ["bash", "${{ const.pricing_script }}"]

  # ── leg 2 · the judge (fresh TOML × LiteLLM · NOBODY WINS) ──────────
  # Exit 4 on an unexplained skew fails this leg and stops the door:
  # triage the finding (fix a catalog or name a ledger row), re-run.
  differential:
    timeout: "5m"
    after: { refresh: success }
    exec:
      command: ["python3", "${{ const.differential_script }}"]

  # ── leg 3 · the proof (validators over the fresh snapshot) ──────────
  prove:
    timeout: "15m"
    after: { differential: success }
    exec:
      command:
        ["cargo", "test", "-p", "nika-catalog-codegen", "--lib", "--quiet"]

outputs:
  refresh_report:
    value: ${{ tasks.refresh.output.stdout }}
    description: "rule count · per-field coverage · research facts re-attached / orphaned"
  differential_verdict:
    value: ${{ tasks.differential.output.stdout }}
    description: "prices compared · agreements · ledgered skews (a clean door is 0 unexplained)"
